 to get back together with him. He recently installed the video security system outside his residence and had no internet service at the home. He provided verbal consent to search his home and property, which agents did. He said he was a 'gun nutåÓ, and had a criminal history to include simple assault and DUI. A search using cadaver dogs was conducted (Shelby Co SO), yielding positive results on a bedroom area, however agents determined the indication was on possible fluids belonging to Austin."], ["TN0204", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Phone call came in from 530-221-2899.  Unknown male caller stated that he went to school in California with a guy who was really into blondes and who also always wore camo.  He said he knew this guy had moved to Tennessee but did not know what area he was in.  Caller stated that this person of interest would be in his late 20's or early 30's. He said that both of the person's deceased parents were alcholoics and he most likely was too.  He stated that this was a huge gut feeling and he hopes it helps us find Holly Bobo.  He said the man's name is Joe or Joseph Lind."], ["TN0205", "04-18-2011", "Open", "Routine", "", "note", "Per Todd Bowmen - Wayne Gibson was in prison, is out now. Lives in a rockhouse in the Bible Hill Community. Linda White, his girlfriend, was tied up and kept in her basement for several days before she escaped."], ["TN0011", "04-18-2011", "Update", "Routine", "", "", "While searching the Coon Hunt list, Shannon David Williams was found as a TN Sex Offender and there is a Shannon Williams that participated in the Coon Hunt. Shannon Williams that participated in the Coon Hunt, reported an address of 1240 Nose Gay Road, White Bluff, TN. The SEx Offender Shannon Williams has listed his address as 358 Stagecoach Road, Dickson, TN. Williams' TOMIS # is 00466943"], ["TN0206", "04-18-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Katelyn Dingeman at 10:40a.m., on 04.18.2011, phone: 641-780-3613. Dingeman reported she saw an ad on Craig's list for New ATV tires. Someone is selling these tires in Parsons. No name was listed on the ad, but there was the following phone: 731-845-4760 and Craig's list email: sale-84J2H-2329942059@craigslist.org"], ["TN0207", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller named Jack Knott of St. Louis called and stated he is a former hunter and law enforcement officer. He said he is retired and grew up in South Dakota. Mr. Knott stated he has a gut feeling that she is buried in an underground pit, has been possibly sexually molested and that this was done by someone pretty smart, probably not the brother, but, possibly the boyfriend should be further investigated. He said in the past 40-50 yrs there have been several movies made about girls who were abducted and were put into pits underground and this is most likely the type of scenerio that should be investigated. Mr. Knott said he can be reached at 314-265-7778."], ["TN0208", "04-18-2011", "Open", "Routine", "", "In person", "Lora Prickett (mother)/Breanna Wyand (731) 602-2894, 615 Franklin Store Road, Lexinton, TN (SA Booth) - Called her phone at 1015 4/18/1, male subject said he was from Jamaica, asked if she knew the girl that was missing. He called from 876-895-8255 the number called (Breanna_ 731-733-8870. Told Breanna she could be next. Said he was not worried about law enforcement because he was in Jamaica. Told him not to call back. He has continually called since. They do not know him."], ["TN0209", "04-18-2011", "Open", "Routine", "", "Telephone", "Sheriff Benton County (731) 441-9430 (731) 234-1388 through SA Booth - White/Male Donnie McKenzie - Sunset Road comes out at Sugartree, there is a bar there. He is hanging out there and living with a family member. He is using drugs and soliciting people for drugs. He has not been seen since this happened."], ["TN0210", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Larry Moian called from Dickson County, phone number 615-763-0789. He stated several months ago in Dickson County there was a man that was jumped by someone in Camo. The individual came out of the woods, jumped the man and attacked him and then went back into the woods. He said Dickson County should have a record of this incident even though he did not know the victims name or address of where this attack occurred. He wanted to let us know she the attacker took the Holly into the woods."], ["TN0211", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Charles Stuart of Lafayette, LA stated that during the Vietnam War the Vietkong built underground tunnels and even hospitals, would take off into the massive forests and disappear into thin air. Mr. Stuart advised that the military and FBI should have high-tech equipment that can search underground by doing fly-overs and/or rolling a certain type of equipment on the ground that would show the depth of the soil, etc. Mr. Stuart advised that it would be wise for this to be checked into and considered as a way this guy might have taken Holly Bobo. Mr. Stuart stated that if this guy has been obsessed with this young girl for a long time and wanted her for long-term use that he could have been plotting all along and had plenty of time to dig a tunnel underground to keep her from being found. Mr. Stuart can be reached at 337-281-2156."], ["TN0212", "04-18-2011", "Open", "Routine", "", "Email", "Linda Goff (731) 614-5023 forwarded by Larry Anthony from Kathy Randolph (TIES)- She stated a friend called to tell her about a man that was known to hang around the Post Office in Scotts Hill, TN. They described the man as \"creepy\", acting odd and one that just didn't fit into the community. His name is Donnie Burgess and was staying at 10114 Highway 114 in Scotts Hill, TN. THis property is owned by Jeffrey Whitehead. Donnie Burgess has not been seen around the community for several days. The caller also said she though Donnie Burgess stayed with a cousin named Judy Branch who lives in Greenville, TN."], ["TN0213", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Joseph Mark Wilken, a disabled gentleman from Centertown, GA called to ask if anyone was checking out people in the community who hunted that area. He stated they should have a hunting license and cleared individually. Also, Mr. Wilken stated there might be someone in the community who was trying to keep people away from him by saying he was sick with something contagious and that way was not being considered suspicious.  He said today was the first time that he'd seen this about this young girl and was very disturbed by her mother's broken heart and wanted to give him first thoughts on trying to assist in finding her. Phone call came in from 706-777-0115."], ["TN0227", "04-18-2011", "Open", "Routine", "", "TBI Find", "Dottie Rinks called from 731-696-5566 and stated her daughter is going to nursing school just like the victim. She stated that her daughter had done some clinicals at the prisons. Ms. Rinks wanted to suggest that if Holly was doing clinicals did she do any at any of the prisons and if so one of those prisoners could have been released and harmed her."], ["TN0214", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Cristi Collins from south Jackson called stating there was a Craigslist add posted at 12:22 (EST) on April 17th, 2011, advertising 4 wheeler tires in the Parsons area. The telephone number in the add given is: (731) 845-4760."], ["TN0215", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Ron Thrasher stated that he was driving to Tupelo, MS for his mother's surgery on Thursday morning. He said that it was about daybreak and he was about to cross the Tennessee River. Mr. Thrasher stated there are two large rock walls just before the bridge and there was a guy in his late 20's or early 30's there putting rock from the walls into three 5 gallon buckets. He said it struck him as strange because the guy was in a small white truck (either a Toyota or Nissan, he thinks) and wasn't just putting the rock into his truckbed. He discussed this with his wife when he got home on Saturday and they decided they should let the TBI know about this because it might be of help. He could not get through to the TBI Find line yesterday. Mr. Thrasher can be reached at work number 615-367-2200 or on his cell at 615-739-4661. Call came in from 615-367-1474. Mr. Thrasher lives in Nashville."], ["TN0216", "04-18-2011", "Open", "Routine", "", "Telephone", "Unknown caller to the Sheriff Benton County; message relayed through ASAC Doug Long - Benton County area off Inman Road there is an abandoned house. There has been a pickup truck with a camper seen there. Trooper Mark Stanford and Joey Hudgens(DHS) are enroute to check house out."], ["TN0218", "04-18-2011", "Open", "Routine", "", "Telephone", "at 0619 at 152 Law Road, there was a lady who came in and asked for cigarettes reported: Off exit 93 on I-40, a lady in a white vehicle (300 PMS) said she saw a girl who looked like the victim. THP car 8810 looked for the vehicle but could not find it. The White vehicle went eastbound on I-40."], ["TN0217", "04-18-2011", "Open", "Routine", "", "Telephone", "at 0619 at 152 Law Road, there was a lady who came in and asked for cigarettes reported: Off exit 93 on I-40, a lady in a white vehicle (300 PMS) said she saw a girl who looked like the victim. THP car 8810 looked for the vehicle but could not find it. The White vehicle went eastbound on I-40."], ["TN0219", "04-18-2011", "Open", "Routine", "", "phon1-800-TBI-FIND", "Caller Kathrine Vaness(731)928-5555 stated we may need to look at some posting on Craig's list. One person named Robby (Jackson) 5'11\" and 175lbs, menseekingwomen, another posting, countykitty-25Harden county, looking for a cutie, taking charge"], ["TN0221", "04-18-2011", "Open", "Routine", "", "Middle Tennessee Field Office", "Glenda Jones working in the TBI Middle Tennessee Field Office checked phoned messages from the weekend and an unknown female caller left a message stating she had added information about the missing girl on her Facebook page, and someone asked if they had checked Orange Mound in Memphis, (615) 767-2297."], ["TN0306", "04-18-2011", "Open", "Routine", "", "Lead Sheet", "Kara Douglas of 12825 Hwy 641 in Holliday,TN stated Jonathan Dodd had a Facebook status posted on February 16th, \"want to kill someone you know who you are\" She heard he used to go out with Holly and had a sexual relationship with her. Does not know for sure. Shelby Sellers goes to Lexington High School was also dating Dodd. \n\nInterview by SA Jeff Jackson of Kerry Sellers. All information brought back to case agent. Found that Jonathan is living at 9440 Hwy 220, Lexington, TN. He likes to go Spelunking (cave exploring). Thinks we should search bogus cave. His latest Facebook posting \"Hello I haven't been arrested\"."], ["TN0220", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Jeff Cornett of Lancaster, PA called and suggested we use bloodhounds to check vehicles of persons of interest (Family, Boyfriend, ex-boyfriends, etc). Mr. Cornett can be reached at 717-413-8565."], ["TN0222", "04-18-2011", "Open", "Routine", "", "Middle Tennessee Field Office", "Glenda Jones working in the TBI Middle Tennessee Field Office checked phoned messages from the weekend and an unknown female caller left a message stating she use to be a reporter in Memphis and wanted to talk to someone, (731) 984-6600."], ["TN0069", "04-18-2011", "Update", "Routine", "", "", "Related to TN0192"], ["TN0232", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Call rec'd from Ms. PJ Bartholomew. Wednesday night she and her daughter were returning to Hickory Withe, TN after teaching a Defensive Driving class. She was heading West on Hwy 64 between Summerville and Oakland. She said she came up on a car that seemed to have pulled off quickly to the right side of the road, as determined from the tire tracks. She said she noticed 2 people in the median in the middle of the road who seems to be fighting or struggling with each other, their arms up in the air. She said one of the individuals was not very large and was wearing either a pink or peach colored top. She contacted her daughter on her phone and told her to watch for this, as they were in seperate cars. She said her daughter, Teri Jacquez was a former police officer. Her daughter turned around her car and rode back through the area but did not see the people, only the car. Ms. Bartholomew turned around also and drove back and noticed the two people were now down low off the side of the embankment. Her daughter called the Fayette County dispatch and reported this. Ms. Bartholomew stated the car looked either white or creme color and seemed to her to be an older model. Her daughter told her she thought maybe it was a cadillac. Ms. Bartholomew can be reached at 901-550-1202."], ["TN0192", "04-18-2011", "Update", "Routine", "", "", "Related to TN0069"], ["TN0234", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Tracey Jacobs phoned to advise that she has a friend named Heather Sullivan who lives in Centerville, TN. She said that a couple of months ago, her friend had been grabbed by a guy off her front porch. Heather's boyfriend, Eddie Halbrooks came out and grabbed her away from the guy who ran away. She said the last she knew, her friend Heather was living on Bear Creek Road with her boyfriend. She does not know what happened after this and has not talked again with her friend and does not know if the friend advised anyone of this incident. Tracey Jacobs is from Fayetteville and can be reached on her cell at 931-652-4190 or home 931-438-1506."], ["TN0223", "04-18-2011", "Open", "Routine", "", "Tips Email on TBI Website", "Email to the Tips Email on the TBI Website. Was forwarded from Cathi Lasater with TWRA. 615-781-6580\n\n\n\nErnie,\n\n \n\nThank you for taking the time to pass on the tip.  By copy of this e-mail I am forwarding yours along to the Tennessee Bureau of Investigation.  As you know, they are appreciative of any and all tips that may help solve this crime.\n\n \n\nCathi Lasater\n\nLaw Enforcement Division\n\nTennessee Wildlife Resources Agency\n\n615-781-6580\n\n\n\n\n\n>>> \"Ernie\" <indianeyes@charter.net> 4/15/2011 8:41 PM >>>\n\n\n\nHi, Just an idea concerning the kidnapping of the girl in Parsons, Tenn. I see on your website there is a spring turkey season open, much like here in Wisconsin. But, it looks like you have a more broad way of issuing permits a hunter would need, compared to here , where a permit is only valid for a particular small section and dates.  The news keeps mentioning the abductor was wearing full camoflauge, and later found those clothes  miles away in an abandoned car, I believe.  It might be too difficult there, but here it would be pretty easy to make a list of who has turkey hunting privileges and lives close to any particular town.  Might be of some help in finding who the kidnapper is.\n\nJust a shot in the dark, but odds are he was a hunter, maybe even a turkey hunter, or just used those clothes to conceal himself while watching the house. \n\nIt happens that I saw a flock of wild turkeys along the road, last evening, and the thought keeps coming to me that if s similar thing happened here, it would be one easy way to help narrow down suspects. Even today's news mentions that they suspect he might be someone local or familiar with the family's routine. I have 5 daughters myself, so I feel for the parents.   Sorry if this is wasting your time."], ["TN0224", "04-18-2011", "Open", "Routine", "", "Email to Tip Email on Webiste", "Tip from TBI Email on Website\n\n\n\nhttp://www.cbsnews.com/2300-504083_162-10007417-26.html?tag=page;next\n\n \n\nThe guy in this picture is wearing what can be considered camouflage.\n\n\n\nI have no idea whether this helps or not but I felt inclined to try.\n\nI hope you find her."], ["TN0225", "04-18-2011", "Open", "Routine", "", "Tip Email on TBI Website", "Tip received through TBI Website Email\n\n\n\nTennessee Bureau of Investigation,\n\n\n\nI feel quite awkward writing this email but I was compelled to because of an urgency of faith. If you haven't found Ms. Bobo yet I would like to offer a gut feeling.\n\n\n\nYou can call this whatever you want, but I have a sense of her whereabouts and her condition. Call it psychic, a premonition, an act of faith or just plain crazy but I got this strong vision and it I couldn't let it rest until contacted the TBI.\n\n\n\nI believe she has a badly injured right shoulder that needs medical attention. You can find her in a small house/cottage near a two lane highway called \"Heftner\" or \"Halten\". I wish I could be more clear on the name but it was blurred in my vision(or whatever you want to call it). The building is near a stone/concrete wall that is maybe 3 to 4 feet high. There is an open field of some kind of low growing crop on one side of this property.\n\n\n\nI know this is a very unconventional way of helping and goes against normal and logical criminal investigational protocol but I had to write. I have never done anything like this before and I currently live in Brussels, Belgium, but if this in anyway helps then it was worth. If not, maybe it was just an over active imagination and I need to reduce my coffee intake AND get a check&#8209;up from the neck up. If I have wasted your valuable time I do indeed apologize.\n\n\n\nRegards,\n\nClaude Stark\n\n1(646)862.4838 US\n\n+32 (0)499 55 83 96 Belgium"], ["TN0226", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received on TBI Website Email\n\n\n\nHello,\n\n\n\nI live in Georgia and this morning was watching the Today Show. They showed an arial view of Holly Bobo's house and surrounding area. I noticed a covered swimming pool in back yard. Has anyone checked this pool? It showed the cover still on the pool with standing water on top. Doesn't look like it had been checked out. It would be green stagnant water and easy to hide a body if need to. I know water will cause a faster decomp of a body. I know this may sound far fetched but when I saw it I got chills. It just doesn't add up about a man in camo dragging the boys sister and he not doing anything about it. Like yelling at the man, following them, fighting him for her....just doesn't seem right. I hope she is ok, but something tells me that there is more to this than we are hearing...and if it is being portrayed as the boyfriend wouldn't the brother recognize him?\n\n \n\nChristie"], ["TN0228", "04-18-2011", "Open", "Routine", "", "In person", "THP Search/Tracker - CID Spivey (615) 533-5920 - DD Puckett dispatched SA Kuykendall, Koback, Magnon to an area behind victim's residence to collect a flashlight noticed by THP Search Crew. While there a pink thread was also found in the area. Both were collected."], ["TN0229", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received on TBI Website Email\n\n\n\nRE: Holly Bobo case\n\n\n\nI have attached a link with the Drew Peterson public interview, The Susan Smith and others. When the Bobo family interview aired on the 'Today'show, the first thing that jumped at me was 'Susan Smith'demeanor. Maybe it's just me but after just a little researchåÉcheck it out. See anything familiar!!! Trouble with that camera staring at them. Hope I am wrong!!\n\n\n\nhttp://www.youtube.com/watch?v=15l9HQgAk4M&feature=related\n\n\n\nhttp://today.msnbc.msn.com/id/26184891/vp/42605859#42605859\n\n\n\nRespectfully,\n\n\n\nPatrick Williams\n\n\n\nSr. GIS Analyst\n\n\n\nJackson-Madison County Planning Dept\n\n\n\n731-425-8288 (office)   731-803-8085 (cell)"], ["TN0230", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Email Tip from TBI Website\n\n\n\nholly bobo,dead !ex-boyfrend !body 8 miles from her home.mark out a radius {8 miles}.near a etream of water"], ["TN0231", "04-18-2011", "Open", "Routine", "", "Telephone", "Terry Grinder (931) 698-4650 - Anonymous caller called Terry Grinder and said Jason Bougus Lives on Stokes Road drives a four wheeler with a rifle and in that area all the time. Caller hasn't seen him since. First and second wife, death and disappearance."], ["TN0233", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received from TBI Website Email - Series of Emails received from 4/17/2011 to 4/18/2011\n\n\n\nHolly Bobo could be easily located using Rv, and you should know this.\n\nCertainly Jesus would have a comment to make on this, should he return.  \n\n\n\nHaving worked in the Oil Industry, I was deeply impressed with the\n\nLouisiana 'No Bullshit' Approach! It is a great balance to the more\n\ncerebral Oxbridge method. \n\nNeither however is as good as the CIA Derived RV Approach. In this you\n\nsimply KNOW .... anything! For instance Holly Bobo was abducted last\n\nweek. State Troopers are roaming around looking for her. Michael Ruiz\n\ncould find her in a trice.\n\nStep to it guys!!!\n\n\n\nhttp://www.youtube.com/watch?v=iw&#8209;GzHSEgvQ \n\nhttp://www.youtube.com/user/ResilientRV#p/a/u/1/xeqPwX6vNYs \n\nhttp://www.matrixintelligenceagency.com/ \n\n\n\nPS. Please find attached example of the work of Michael Ruiz. Sian\n\nO'Callaghan's murderer was sorted out within days ... and another 10\n\nyear old murder victim found. \n\nFor some strange reason MI5 have this capability but deem not to use\n\nit."], ["TN0231", "04-18-2011", "Closed", "", "", "Telephone", "Jason found and interviewed. He was at home on the day this happened sick. First heard of it at 1700. Got a text on his verizon phone (731) 441-6877. Phone number being run by Bill Green. Alibi by his father - James Baugus 2/23/46."], ["TN0236", "04-18-2011", "Open", "Routine", "", "TBI FIND Line", "A George Klauck from Rochester, NY called and stated he knows people are praying but people should pay attention the signs. After goggling churches and lakes he realizes that the Red Bud Lake in Parsons is shaped like an eagle and the right side of the lake resembles a tiger. Based on his findings, this is where the kidnapper and his victim are hiding."], ["TN0235", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received from TBI Website\n\n\n\nI am sure that given the description of the suspect that took her, I would think he would have some hunting background. Most men who wear camo are hunters, or prior military, but I don't think he would be military, the reason for that is military, and I was Army years ago, don't like wearing our own issued camo. So, my thinking is the individual is or has hunted before. if there are foot prints, that should help to see if he is wearing a hunting boot or a hiking shoe. If there was more information available that would help. I would look for those associated with her with this type of background.\n\n\n\n \n\n\n\nI am sure these ideas have already been thought out, but thought I would try to help. Such a tragedy.\n\n\n\n \n\n\n\nOmar Ganoom\n\n\n\nColumbus, Ohio"], ["TN0237", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip from TBI Website - Photo also attached to email is available if needed.\n\n\n\nI do remote dowsing to help find people.  I am 59 and live in Sneedville.  This morning I spent trying to find this girl and I think that I have located an area where you might want to look.  I did not look up the address of her home only started with a map of the Darden area so that I would not be influenced.  I do not know the area, never been there but this is where I am getting a hit, she may be there or been there.  Please at least take a look and see if you can find anything.  I do not know who that house belong to, again did not want to influence my findings.  Good luck.\n\nJanet Tallon\n\n423.733.1964\n\nThe light shaded area is the one where I am getting a hit, I cannot zoom any closer to get anymore accurate."], ["TN0238", "04-18-2011", "Open", "Routine", "", "In Person", "April 731-733-3452 - Bradley Dood about 50 years old made comment, while dumping something in compact dumpster, that he didn't know why people were letting searches on their property without a warrant. He also stood noticeably on camera during interview."], ["TN0239", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received from TBI Website\n\n\n\nI'm a detective in Los Angeles. Forgive me if I don't have my facts straight, but I just have what I've seen in the papers.\n\n \n\nI looked at a map of Parsons, Tennessee and see there is a small airport just west of town. Could this girl have been dragged there and flown out without anyone noticing? I know her lunch box and some duct tape with hair have been found miles from the girls home. Could either or both of these items have been tossed from a small plane? Is the lunch box dented, etc...? Anyone odd fly out of the airport that morning? Or fly in?\n\n \n\nNo need for reply. Hope she is found soon.\n\n \n\nDet Bill Dunn\n\n27764@lapd.lacity.org"], ["TN0241", "04-18-2011", "Open", "Routine", "", "In Person", "LT Dunaway THP through Michael Ivey - Subject come to Lt Dunoway and provide the following informaiton: Neal Hightower had been praying about this and God told him Holly was buried on a vacant lot in Obion County. John Blankenship is who killed her. He has done this six times before. Blankenship  is from Bismark ND. Hightower can be reached through local attorney Michael Ivey."], ["TN0240", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Email received from TBI Website\n\n\n\nHello, \n\n\n\n\n\nI have no information on Ms. Bobo, but reading of her abduction by someone wearing camo made me think of Baugus cave on Hwy 69 that I visited 30 years ago while deer hunting.  It may be worth searching the cave if it has not already been searched.\n\n\n\n\n\nSteve Kirby\n\n529 W. Parkview St\n\nDyersburg, TN \n\n731.286.2304"], ["TN0243", "04-18-2011", "Open", "Routine", "", "Telephone", "Citizen Searcher Robert Pitts 731-549-9456. Searcher stated while out searching near Neelywoods and Corinth Natchez Trace about 4 to 5 miles from victims house. He ran into a large guy names \"Tony the tiger\" (has a mohowk). He lives in a shack made of bamboo. Searcher also found plastic zipties (like bondage type). Tip called from ASAC Doug Long to LEIC Prickett."], ["TN0242", "04-18-2011", "Open", "Routine", "", "Email from TBI Website", "Tip received by Memphis Crimestoppers and forwarded to the Website Email. \n\n\n\nSEND ANY REPLIES TO...MEMPHIS CRIME STOPPERS\n\nMEMMPDCrimeStoppersAdmin@memphistn.gov \n\n\n\nTipSoft PDF Attached: Report #6006\n\nPOSSIBLE INFO ABOUT THE HOLLY BOBO MISSING PERSON CASE>\n\n\n\nTIPSTER NAME:Johnathan Dunn Home: (901)840&#8209;2041 Cell:  (901)491&#8209;9931 [#&#8209;TSID633,6006,,&#8209;#]\n\n\n\nRelating to the Holly Bobo Missing person case in Parsons, TN Tipster called in and stated that on Sat. (4/16) at approx 1030 hrs the tipster was working in the neighborhood around Valmont Circle & Rogers Park Ave in Old Cordova. Tipster stated that He observed a F/W wearing white shirt, Black sweater type top, and black stretch pants walking down a alley/rd that runs from Rogers Park to Valmont Circle, crying. Tipster stated that the F/W looked alot like the\n\npictures they have seen on the news and did not seem to be injured. Tipste stated that the F/W looked upset like she was emotional like she was arguing with her boyfriend. Tipster stated that as the female walked to the end of the alley he saw a gold/champagne colored 4 door sedan possibly a lexus or newer model nissan with dark, limo type tint, on the windows. Tipster stated that he never saw the F/W get in the vehicle, because they lost sight of her. But did see the vehicle slow down and possible stop arround where the female was walking. The Tipster wanted to include thier name and phone number in case investigators wanted to contact them. I've included this in the\n\nnotes. This tip was transferred to the TBI."], ["TN0244", "04-18-2011", "Open", "Routine", "", "TBI Find", "Psychic by the name of Kelly Jo Monagham called to say she had a dream last night that Holly was crying and was in an underground cave. She stated that Holly was 25 miles Northwest of where she was taken. The abductor is wearing tan work boots, a size 11 and carrys an icky hunting knife. Her number is 561-333-5367."], ["TN0246", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Kim Moore(731)307-0755 advised her ex-husband Robert Owen lives at 4780 Darden Christian Chapel Road in Darden, TN. He has mental problems and has pulled a gun on his wife and daughter before. She said, she didn't call the police when this happen. So, he may not have a criminal history. His daughter is the same age and has blonde hair like Bobo.  Ms. Moore advised he hears voice in his head.  Mr. Owen has a handgun permit."], ["TN0245", "04-18-2011", "Open", "Routine", "", "800 TBI FIND", "Pat Cole - 406-889-3231 (Caller wishes to remain anonymous but will talk to LE if needed) Ms. Cole advised that the victim looked like George Wesley White's deceased fiance. Per Ms. Cole, Mr. White is currently out on bond awaiting trial for the kidnapping and rape of his daughter in Nashville. Mr. White held his daughter for 10 days before she was found. Ms. Cole advised she thought the case detective's last name was \"Carrigan or Kerrigan?\"."], ["TN0247", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Wally Hickson (731) 549-7556 advised to check out all the barns and vacant homes in the area of North Western part of Decatur and Henderson county. He advised law enforcement has already been to his house and looked around.  He is on the sex offenders registry for stat rape in 1995. He also advised to look around the Prospect Road area and across from Jerry Tubbs home (no address) in a vacant trailer. He had one more area to check at the bridge at Old Log Road."], ["TN0160", "04-18-2011", "Closed", "", "", "in person", "SA Bilnoski closed lead. Steve Paulk was interviewed by agents/detectives."], ["TN0008", "04-18-2011", "Closed", "", "", "in person", "SA Bilnoski - closed lead. Steve Paulk was interviewed by agents/detectives. Related to TN0160."], ["TN0248", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Call from Nathan Rankin of Arizona. He said that about 20-25 yrs ago there was another case of a missing girl very similar to this in Idaho he believed. He said the girl and her abductor were living in the rough, like in the outback, for well over a year prior to her finally being found. He said he has 2 daughters of his own, ages 21 and 28 and knows what parents go through in situations like this. He said he can't help but feel this is someone from the community who is comfortable around the public, who is functional in society but not in the classroom. He said this is most likely someone who she has shunned in the past 5 yrs or so or someone who has been a secret admirer who had a bad intent and she was unaware, even though she may have known him. Mr. Rankin stated that he was on the outside looking in, but, felt the abductor may be around 18-28 yrs in ago and a white male...definitely not a loner. Mr. Rankin stated he could be reached at 623-691-6015."], ["TN0159", "04-18-2011", "Closed", "", "", "in person", "SA Bilnoski FBI - Boo Scott was interviewed. Lead can be closed but additional interviews may be required."], ["TN0168", "04-18-2011", "Closed", "", "", "In person", "SA Harsha and SA McMurtrie FBI - Jackie O. Blankenship white male DOB 3/14/48, 915 Blankenship Road, Parsons, TN was interviewed at his place of employment, Vulcan Parsons, TN. Blankenship stated that he does not know victim Holly Bobo and has no knowledge of the incident of her abduction. He stated that he worked 0530 to 1600 on 4/13/11. Time and attendance records verified Blankenship's. time at work."], ["TN0298", "04-18-2011", "Open", "Routine", "", "", "Sidney Paul Teal @ 6040 Lee Ave. Murfreesboro, TN. TN OLN/055807922.Been at work every day at Auto Zone there Sunday thru Thursday, leaves on Thursday around mid-day going to Murfreesboro home.  When I come from Lexington to Auto Zone I came in here from 641 Hwy. Bible Hill Rd. to Sulfer Springs Rd. to his house @ 1220 Sulfer Springs Rd.Parson TN. Live with my wife Golden Teal in Murfreesboro, Tn. Comsented to search of the house and out buildings.  Search was done no results for Holly Bobo."], ["TN0143", "04-18-2011", "Closed", "", "", "Telephone", "SA John S. McMurtrie FBI - Gail Jordan, DOB 5/8/1965, residence address 181 Beverly Lane, Parsons, TN 731-733-664, advised she accidentally sent a text message to 731-549-2644 discussing missing victim Holly Bobo."], ["TN0249", "04-18-2011", "Open", "Routine", "", "In Person", "Paul M. Moore 731-225-1502 - Reporting agent interviewed the owner of BED used cars in Lexinton, TN. Owner reported a vehicle stolen from his lot to the Henderson CO Sheriff's Dept on 4/11/11. Vehicle was apparently stolen on 4/9/11. RA interviewed owner and employees. One employee (CS John Edward Hicks)of inerest stated he knew of the Bobo family and had visited family after abduction. (S) Hicks stated he was at work or home the day in question. Employer verified his attendance at work."], ["TN0250", "04-18-2011", "Open", "Routine", "", "In person", "Karen Bobo - Karen Bobo stated that an individual named Dusty Gilbert had befriended Holly at an event in approximately September 2010. Gilbert befriended Holly on Facebook. On day of incident Gilbert exchanged several text messages with Karen. Karen stated that Gilbert has a basement house where the family bought hay in the past."], ["TN0251", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Scott Vincent (914) 761-7515 advised to check past google earth satellite maps."], ["TN0082", "04-18-2011", "Closed", "", "", "", "Waiting for MPD to give Disposition."], ["TN0084", "04-18-2011", "Closed", "", "", "", ""], ["TN0252", "04-18-2011", "Open", "Routine", "", "Telephone", "SA Cathy Ferguson TBI - Wife called to report her husband Daryl Hamm w/m DOB 11/17/72 SSN 413-57-4095 was the suspect in Holly's disappearance. I called him and he stated on the morning of Holly's disappearance he was turkey hunting on his family's farm. He left his home between 0500-0515, got in the the woods by 0530-0540, left the woods by 0900 and got home by 0930 - 0945. No one was with him and he didn't see anyone he knew. When he got home, his wife told him to change out of his camo, because the suspect was wearing camo."], ["TN0252", "04-18-2011", "Closed", "", "", "", "Close per SA Ferguson"], ["TN0078", "04-18-2011", "Closed", "", "", "in person", "Stuart Broustern FBI spoke with Alan Wyatt at his place of employment. Same information as lead. No new information. Nothing further to add."], ["TN0208", "04-18-2011", "Closed", "", "", "", "Mother Lora Prickett was contacted, said that her daughter does not have her phone number posted on Facebook. Writer contacted 876-895-8255; he said name was James Buchanan, and he lived in Jamaica. He said he got Brianna's number from her facebook profile. He said he called and texted her (Brianna) Buchanan said that he was in Jamaica and that no one could do anythig about it. He said that he didn't say anything about Holly Bobo. CLOSED"], ["TN0255", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Anonymous caller (270) 737-0926 stated he saw Holly Bobo in the commissary at Ft. Knox, KY on Sunday 04/17/11 at 1:30 p.m.. Holly was wearing a Black Jacket with a crown with silver sequins with the name Bobo on the front pocket and black jeans."], ["TN0079", "04-18-2011", "Closed", "", "", "Telephone", "Stuart Bronstein - contacted Michael Rose who wanted to help search. Has been in contact with Mr. Cagel about assisting."], ["TN0253", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Gina Coleman of Decatur County attended a meeting at the Fairgrounds and was told to advise TBI FIND of anything they found that might be of assistance. She wanted to tell us that on Craigslist there were 2 postings that caught her attention.  One posting was for a 4 wheeler for sale in Lexington that was posted on Friday.  It referenced a phone number 731-845-6151. The other posting was for a Suzuki street bike with an address only about 2 miles away and it gave phone number 731-845-4819. She hopes this helps us find Holly and bring her home to her family. Gina can be reached at 731-549-6083."], ["TN0254", "04-18-2011", "Open", "Routine", "", "In person", "Thor Wilson 901-508-1808 FBI - LouAnn Walls (731) 549-4382 5380 Mt. Ararat Road, Darden, TN approached Wilson to let him know that Gerry Gilbert who lives across the \"holler\" in a trailer with a Parsons Motel sign on Myracertown (sp?) Road (Box road). The family are known crimanals in drug trafficking. Four boys, John, Luke, Bobby and Jimmy all in thei 20s. Couple of them have been arrested. Lots of vehicles come and go from residence. Daughter shot Gilbert once for beating her mother."], ["TN0222", "04-18-2011", "Closed", "", "", "", "Unable to verify phone number to call back.No further information to gather.CLOSED"], ["TN0232", "04-18-2011", "Update", "Routine", "", "", "Spoke with Fayette County S.D., People looking for gas. Subjects known to local L.E. as Wayne   Hampton and Tonya Wilkerson. Vehicle-2000 Cadillac. CLOSED"], ["TN0256", "04-18-2011", "Open", "Routine", "", "In person", "Thor Wilson FBI 901-508-1888 - Kris Ann Cerrentano-Douglas 5457 N. Newland Chicago IL 731-845-6269 (In Chicago from 4/18 to 4/25) and Kelli Ames 12825 Hwy 641 Holladay, Tn 731-441-7930 reported that Jonathan Dodd - Dodd Farm, Cedar Hill Rad 731-549-0599 is a former boyfriend of Holly. They started talking again but his baby's momma got mad. She is a Senior at Lexington High School - Shelby Sellers. He is putting out some odd suspicious facebook postings beginning 4/12/11. Everybody is accessing him according to him. He has an abandoned house on his farm and two open wells. Jon redirected search team and was getting odd. Brenda Redding on search team Thursday 731-847-2660. Brenda Johnson and Kelli on search team. Sandra Dodd (grandmother) works at Riverside High School - sayes he has been strange lately 731-852-3944. been going in and out of the woods on four wheeler.He was in a white pickup with somebody and had a four wheeler in the bed 4/14/11 around 3pm. Brenda Redding talked to FBI on Friday night. Jon supposedly was threatening Holly on Facebook. Channel 3 camera on him at car wash - black truck here at CP today. Left at around 1340 - 1345 in the black truck another guy driving. Disturbance at Cedar Mill around house like someone drove up/backed up and drove around house."], ["TN0322", "04-18-2011", "Open", "Routine", "", "lead sheet", "Dusty Johnson, cell 731.845.6493, stated to SA Faulkner that while searching on horseback he noticed an old house off of Evanston Rd near intersection of Cedar Hill Rd. The house had a new digital electric meter on it but was abandoned down old gravel road. SA Faulkner and FBI SA Saltsman located the abandoned house and got the meter number. House was unoccupied and side door was open. We entered the house and found no one inside. SA Faulkner called Lexington Electric and gave the meter number. They confirmed that the meter was supposed to be on the house. Billing address: Phebus C. Williamson, 5316 Ligon Springs Rd, Russellville Alabama."], ["TN0182", "04-18-2011", "Closed", "", "", "", "Close Vehicle info. SA Mark Lewis."], ["TN0232", "04-18-2011", "Closed", "", "", "", ""], ["TN0193", "04-18-2011", "Closed", "", "", "in person", "Stuart Bronstein FBI 568-3671 - No answer at phone number, dates of birth/age do not match."], ["TN0183", "04-18-2011", "Update", "Routine", "", "", "Gladys Pepper, Personnel Dept., Wal-Mart, Millington, TN was teliphonically contacted by SA Harsha. She stated that Michael Hilton is a Wal-Mart employee but has been missing since 4/9/11. He has not shown up for work and his family has reported him missing. Memphis P.D. gt. Latahas, 901-636-4443 is handling the mising person case. Coordinate with Memphis PD."], ["TN0257", "04-18-2011", "Open", "Routine", "", "In person", "Mike Hickok Austin Peay Student online and Army Iraq veteran 931-306-1609/Jessica (wife) 931-306-1741. Wife passes every day a silver Grand Am with tinted windows and sits low just before Jody Barbon's double wide on 438 west. Car going fast (80-85 mph east bound) and about ran her off the road. Wife passes everyday going to work at the Mega Mart Express in Parsons (M-F evening 1300 to 2130. Hasn't seen the car since the incident. They say that Holly may have spoken at or hosted the youth event at the Coon Creek Turkey Hunting Club Chris Coble - Lobelville, TN Hosts. They wanted to help, but can't- has to take care of kids."], ["TN0022", "04-18-2011", "Closed", "", "", "", "Close No records found."], ["TN0258", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller Bill Duncan, Kansas - Christian Minister who uses motion technique of finding truth and non-truths.  Has solved 2 cases in the past 6 months with this technique. Mr. Duncan stated that a 19 yr old Polish man who Holly Bobo met in at Georgia Tech has her in a 4 door blue 1996 sedan 10 miles straight West of Parsons, TN. He has not yet hurt her, but, Mr. Duncan feels time is running out and he intends to hurt her soon. Mr. Duncan stated that the man's parents are nationalized Polish immigrants. He said the man's name is Polish and is LJVRY M. VYSYZM. He said the man's parents live in the southwest quandrant of Georgia. He said LJVRY loves Holly and wants to marry her but she doesn't want to.  He insists that we must HURRY!  He said that the are about 5 miles off the road into the woods on a car trail."], ["TN0170", "04-18-2011", "Closed", "", "", "in person", "\"I was at work on Wednesday 4/13/11. I got here before 0700. I sent an email to my mother at 0704 and several others emails to others. I was in my office. I was on the plant floor all day. I know Dana Bobo he is always messing with older cars (MOPAR) I do to. I don't know Holly. My wife and I am separated (Leigh Ann Powers) lives with Wanda in Scottsshill. Leigh Ann is the accounting manager of Lexington Elextric Systems.  I was under an order of protection. Have a lawyer. Not: Chris took this agent to his office and showed me his computer and the emails he sent and received that day. He was here that morning. Small pickup in driveway. Guy said he wanted to buy old car parts asked about my house - who lived here. Left phone number 614-1591 or 967-8988. Lives on Camper Road near Mt. Zion Road."], ["TN0259", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Charli Douglas (female) called from 731-441-1849. Stated that Blake Williams knew Holly and went to school with her. He has a girlfriend named Ashley and she is pregnant with his child. On Wednesday he told the girlfriend he was at work but she has since found out he has lied about his whereabouts and came in higher than a kite on Wednesday. They are concerned since he lied about his whereabouts, he may have been involved. Charli has the text messages on her phone in regards to this."], ["TN0260", "04-18-2011", "Open", "Routine", "", "HQ", "Caller Paige Bennett (731) 487-5790 advised there is a Victor Gojcajon on Facebook that is following all the news stories on WBBJ 7 news and posting comments about Bobo after every news reports."], ["TN0310", "04-18-2011", "Open", "Routine", "", "Lead Sheet", "Carolyn Rogers was almost run off the road Wed, 4/13, around 7am by dk red or burgundy, late model, mid-size car. Rogers was going to 529 Box Rd before Myracle Rd to pick up her mother. She knows that road very well, grew up there, and can maneuver it well, but other car was going way too fast and almost hit her. Rogers was headed away from Hwy 412. It scared her and she told her mother and husband about it. Friday morning her husband told her she should call it in. Holly's house is 2-2å_ miles from where the car almost hit her. It looked like probably only 1 person in car. Rogers is the ex-aunt of Holly's father, Dana. Rogers is still very close to the family, she married into it at 15. Holly's grandmother, Ruby, practically finished raising Rogers and they've been talking lately. Rogers has been helping care for her while Dana and Karen have been dealing with what's happened. Ruby stated Holly had problems with one of her ex-boyfriends but she didn't tell Rogers his name. Rogers has heard Jonathan Dodd knew one of Holly's ex-boyfriends and Dodd is someone people believe has something to do with Holly's disappearance. Dodd is from this area, knows the land very, very well and lives close at a neighboring farm. Rogers' kids know him well as a troublemaker and thief who stole a 4-wheeler from her ex-husband. The neighbors saw him and reported it to the Decatur Co Sheriff but nothing happened until her ex-husband forced the case to move forward and got it to court. Dodd had to pay restitution. His family is known to help him out of trouble using their influence and bails him out frequently. Dodd's aunt, Miranda, told Rogers Dodd's parents kept bailing him out. Rogers' ex-husband's name is Robert (LNU). He told Rogers he was hurt that Roy Wyatt did nothing about the theft."], ["TN0261", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Connie Bowman (731) 234-0110 states a Victor Gojcaj on Facebook is posting comments after every WBBJ news report about Bobo.  The posting have \"Bitch\", periods, and other odd comments about Holly Bobo."], ["TN0262", "04-18-2011", "Open", "Routine", "", "TBI FIND", "Call from Kristie Turnbow from Adamsville, TN who said a 19-20 yr old guy named Ricky Dale Show has been going on the searches for Holly Bobo for the last 3-4 days. He's posting on YouTube where they are going and what they find. She said she called Jackson County but they instructed her to call TBI and give us this information. She said Ricky Dale has a good heart and is trying to help, but, should be told that this is not appropriate in this situation and that he should stop. Kristie can be reached at 731-607-0900. She is in Michigan working today but wanted to go ahead and let us know this is happening."], ["TN0263", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Chris Beasley with Max Trans called. She said she had an officer from Dickson PD call wanting to get information on Jason Nickell's work information. He was asking about the 7th, but when she got to look at his file she felt it pertinent to call.\n\n \n\nThey show he did not work on the 13th or 14th. Came in long enough on the 15th to pick up his check, and then didn't show up on the 16th. He brought in a doctors note for the 13th; however, when she looked at it today the doctor's note was for an individual by the name of Joshua Wallace. \n\n \n\nShe is taking home the file so if you need to speak with her she will have it.\n\n \n\nHer work cell is 866-616-9105. I confirmed that number with her twice.\n\n\n\nSAC John Mehr has been emailed about this information."], ["TN0264", "04-18-2011", "Open", "Routine", "", "TBI Find line", "At 4:56p.m. Caller, David Mann, phone number: 254-718-1699. A couple of months ago caller was logged on to an adult live feed site of a person using the name 'Bobo Big Jay-JayåÓ. The videos are on servers tied to a single feed. Someone using live chat asked model if she would do a live show with duct tape. From the model's camera angle you could view a pair of camouflage pants hanging on a clothing hook on the back of a door in the background. Last week caller friended someone on his twitter by the name, Holly Dorrough. Caller found her myspace and liked her music. Then caller saw where Holly Bobo was missing."], ["TN0265", "04-18-2011", "Open", "Routine", "", "Telephone", "FBI Complaint Desk IA Cathy Williams 901-747-4300 - Call in complaint on Thursday 4/1/11 that a caller reported seeing Holly Bobo as a person wantin get a date on \"match.com\"."], ["TN0083", "04-18-2011", "Update", "Routine", "", "Telephone", "Jaime Wilson Cormar - Spoke with Thompson. No indication that Russell has any connection to Parsons, TN or Holly Bobo. Should run Will Russell to check criminal history."], ["TN0266", "04-18-2011", "Open", "Routine", "", "Telephone", "Anonymous caller - Caller said we need to check out Tyler Moody. No further info as to why. 1-636-352-5683 out of Missouri."], ["TN0266", "04-18-2011", "Closed", "", "", "In person", "J Jackson - Tyler interviewed by SA Jeff Jackson on 4/18/11. Cell phone 636-352-5683. Has no girlfriend. Was asleep when it happened at home on 315 Flangan Drive, Lexington. Did not know Holly. Has no information related to case.\n\n\n\nUpdate 4/23/2011 1300 hrs - Interview conducted by SA J Jackson"], ["TN0267", "04-18-2011", "Open", "Routine", "", "Email sent from TIES to ASAC Quin", "Call received by TIES\n\n\n\n0635  An unidentified woman phoned TBI this morrning.  She was outraged that they are not looking into the brothers' story.\n\n\n\nShe phoned from (469) 337-8054."], ["TN0268", "04-18-2011", "Open", "Routine", "", "Email sent from TIES to ASAC Quin", "Call received by TIES\n\n\n\n0641  Rosemarie Jess, a retired nurse, phoned TBI.  She was concerned about, \"What patients has she (Holly) taken care of recently?  \n\nMs. Jess' phone number is (269) 344-0502."], ["TN0271", "04-18-2011", "Open", "Routine", "", "Telephone", "SA Booth - Brandon Powers 967-3834 - Saw Nissan Pathfinder dark green on MIller Trail and Wildenville Road Wildersville, Tn. THis was wed 4/13/2011. McNairy County 315 DJG."], ["TN0269", "04-18-2011", "Open", "Routine", "", "Email sent from TIES to ASAC Quin", "Call received by TIES\n\n0744  A Nicole Elliston also phoned TBI this morning.  She asked if they had, \"looked at the river\".  She believes that he has taken her further away.  \n\n\n\nMs. Elliston's phone number is (615) 557-0350."], ["TN0270", "04-18-2011", "Open", "Routine", "", "Email sent from TIES to ASAC Quin", "Call taken by TIES\n\n\n\n????  Anita Belcher phoned TBI this morning advised that she was asked a rather strange question on Craigslist.  The question was, \"How long does it take a body to start smelling after deceased?\"  \n\n\n\nHer phone number is (828) 270-8741."], ["TN0091", "04-18-2011", "Closed", "", "", "Lead Sheet", "Unable to locate Heather Burly with details. The telephone number provided is a \"bad\" number. Follow up investigaton at UT-Martin Campus and BP Station confirmed incident with flirting by construction workeres with a group of nursing students but Holly was not there.Lead assiged to FBI Memphis SA Reich/SA Sligh."], ["TN0272", "04-18-2011", "Open", "Routine", "", "800 TBI FIND", "Morgan King (731) 412-9346 - Complainant advised that a red 4-wheeler has been sitting on Hwy 128 N, 500 ft from Old TVA Road in Hardin Co since 1:00 p.m. on Saturday, April 16, 2011."], ["TN0273", "04-18-2011", "Open", "Routine", "", "telephone", "T. Dicus - A searcher, Brian Smith, saw a suspicious white male exiting a cabin #6 at Natchez Trace Park. He was carrying a pink bag and left papers talking about her teeth and how the answers are in the street.\n\n\n\nPer SA Clark, SA Jeff Jackson already worked this lead. No status from SA Jeff Jackson."], ["TN0274", "04-18-2011", "Open", "Routine", "", "in person", "SA Art Viveros FBI - Bryan Young 549-575/Joel Crawley 549-4329, Young and Crawley approached SA Viveros and reported searching a barn at 3020 Five Forks Road in Darden behind the victim Holly Bobo's residence. They observd burned clothing and porn magazines in the barn and buzzards circling overhead. Young says the person who lives in a trailer associated with the barn is Kevin Camper 45-46 white male."], ["TN0275", "04-18-2011", "Open", "Routine", "", "in person", "Sheriff R Wyatt  549-0099 - Just passed Cub Creek on Bible Hill Road there is a field, road turns to left, goes to old house place, just the foundation is all that remains. Informaiton is Jonathon Dodd throws dogs in old hand dug well to watch them die. Makes frequent trips to this area."], ["TN0155", "04-18-2011", "Update", "Routine", "", "in person", "SA Harsha and SA McMurtrie FBI - Chief Phinnessee, Henning Police Dept, Lauderdale Co, TN was contacted regarding lead. Chief Phinnesse advised that he and/or Lauderdale Co Sheriff Dept would attempt to contact Angela and Bobby Jones, 505 Bud Jennings Road, Henning, TN owners of silver Toyota Tacoma, TN 084 DDT, and determine activities and whereabouts at time of victim abduction SA Harsha will forward any positive information to TBI."], ["TN0151", "04-18-2011", "Closed", "", "", "in person", "SA McMurtrie - Tiffany Overbey, DOB 7/7/1980 residence address 74 Wade Hampton Lane, Decaturville, TN 731-549-0393, employed as bartender at Teazers Strip Club, interviewed re: dollar bills presented by cutomer with blood on the bills. Resolved. No connection to missing victim."], ["TN0276", "04-18-2011", "Open", "Routine", "", "in person", "SA McMurtrie - Lou Ann Wallace 731-549-4382 believes Kevin Daws, white male DOB 11/1/1976 DL#079086151, address 4570 Stegall Road, Lexintion, TN, is someone who would be very capable of committing this offense of kidnapping. Daws is currently home invasion charges."], ["TN0011", "04-18-2011", "Update", "Routine", "", "in person", "This lead has been assigned to Jim Webb, Dickson County SO."], ["TN0133", "04-18-2011", "Update", "Routine", "", "", "SA Reich - Have SA in Jackson, TN visit Gerdeau Steel in Jackson, TN to verify Love's work schedule."], ["TN0132", "04-18-2011", "Update", "Routine", "", "Telephone", "SA Reich and SA Sligh, FBI - Confirmed information from Deer; however Deer was not aware of any prior relationship between Woods and Holly. Jessica Deer's phone number is 731-549-7028, address 95 McPeake Lane, Lexington, KY. Attempt to confirm with Karen Bobo info regarding Woods' interest in Holly and attempt to locate and interview Woods regarding Holly."], ["TN0299", "04-18-2011", "Open", "Routine", "", "", "Patricia Clark @ Walgreens in Paris, 731-641-6660, said a female came in store to report her son missing for at least 7 days and wanted to get pictures made up to get out in Public, son is Andy Clark. \n\nAs per USMS David Wray."], ["TN0120", "04-18-2011", "Update", "Routine", "", "Telephone", "SA Sligh and SA Reich FBI - Contact with Beth Higdon determined initial name (Cory Williams) was incorrect and had additional info for follow-up lead. According to Beth, there is a group of boys who hangout/ride 4 wheelers in the Bible Hill Community/Pugh Road/Gooch Road area. These boys include Cory Tubbs (25-26), John Williams Tubbs (19-20), Jonathon Dodd (who may have been questioned by law enforcement), and another boy first name unknown (FNU) Barnett. The father of the Tubbs boys is Stanley Tubbs who owns a lot of property and a saw mill in the general area. The Tubbs brothers are normally seen in this area regularly; however since the abduction, they have not been sighted nor have they helped with the search for Holly. The Tubbs boys are alledgedly handy with tools and know the area very well. They are known to be troublemakers and deal with drugs (crystal meth). People are afraid to go to the authorities due to the \"connectedness\" of the Tubbs family. Their uncle is a county commissioner (Decatur Couty) and other relatives are in law enforcement. There house/family property is in the middle of the area where Holly's items have been found. Attempt to locate interview Cory and John William Tubbs about their knowledge of Holly."], ["TN0278", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller advised he saw a white male wearing camouflage at a gas station at Exit 4 in Ky at Love's Truck Stop on Sunday 04/17/11 at 1:00p.m..  He was driving a black Chevy truck with Henderson TN tags. No tag information or direction of travel. No female in the vehicle."], ["TN0111", "04-18-2011", "Closed", "", "", "Telephone", "SA Reich and SA Sligh FBI - Contact with Ms. Lewis determined that Tobie had no specific details - other than the camo attire - that related to Holly's abduction in Parsons, TN. Nothing further could be provided by the caller."], ["TN0305", "04-18-2011", "Closed", "", "", "", "SA Ronnie Faulkner spoke with Mr. Roberts and he read text message and the forward message to SA Faulkner cell. SA Faulkner called 731-614-9580 and a female answered.  We SA Faulkner identified himself as TBI SA the female hung up or lost service.  Called back and left message & sent text to please call.\n\nAt 8:02 Tim Stubblefield at 1154 S. Main St.,Lexington 731-614-7568, father of Tiffany (age 16) 731-614-9580, called back and stated that the message was to be sent to him and Tiffany must have texted to the wrong number."], ["TN0305", "04-18-2011", "Open", "Routine", "", "", "Glen Roberts @ 745 Presley Rd., Lexington, TN, 731-968-8406(H). Mr. Roberts received text message on 4-18-11 at 10:37am from 731-614-9580: Hyy daddy immsorry if. u weere aslleep. i just want too go o granddmas tonight plzzy cause ever time i text or. wanna call Arreen Aunt. Doris says n k. about all the guy has really said that he has so much evidence that he needs some help lossing all of it in. They are searc"], ["TN0277", "04-18-2011", "Open", "Routine", "", "Telephone", "US Marshall Jim Grant 394-7326 - Camden, heard/saw ad in Craigslist regarding a 4 wheeler in Decatur County that someone needed to sell very quickly \"as soon as possible.\" Wheels and rims included."], ["TN0279", "04-18-2011", "Open", "Routine", "", "Telephone", "US Marshall Jim Grant 394-7326 - Camden, a person overheard some teachers talking over coffee about Holly and an ex-boyfriend who had an ugly breakup and got a restraining order against him. No name of the boyfriend given."], ["TN0280", "04-18-2011", "Open", "Routine", "", "telephone", "Sherry Hewitt (731-602-0840) stated she was in the Major Market in Hendereson County and overheard some \"kids\" talking. One in particular was Johnathon Dodd. Dodd said that Holly Bobo is still alive and is at his grandmother's farm. The call came in at 3:50 p.m. to the Decatur County 911 and was forwarded to the Command Post."], ["TN0283", "04-18-2011", "Open", "Routine", "", "", "Int-Oral-Brian Lee\n\n\n\n\n\nBrian Lee was interviewed by ASAC Doug Long on April 18, 2011, at the Bible Hill Baptist Church.  After proper identification and explanation of the purpose for the interview, he voluntarily provided the following information:\n\n\n\nLee advised on Wednesday, April 13th, he was working construction at Orene Duke's home.  Duke's home is located at the corner of Bible Hill Road and Cub Creek Hall Road.  Lee arrived for work at approximately 8:15 am.  Between 8:30 am and 9:30 am Lee was standing in the front yard, talking to Barry Duke and Randall Duke.  According to Lee, while they were talking he observed Jonathan Dodd coming driving down Bible Hill on a 4 wheeler.  Lee stated Dodd turned and headed north towards the direction of his grandparents.  Dodd took the turn at a high rate of speed, even putting the 4 wheeler onto 2 wheels.  \n\n\n\nLee stated he thought Dodd was wearing a green shirt and blue jeans.  Lee did not know if the green jacket was camouflage.  The 4 wheeler was red in color.  Dodd was not wearing a helmet.\n\n\n\nLee stated he did not see Dodd anymore that day.  Lee had been working at the Duke home for approximately 2 weeks and this is the only day he saw Dodd.  Lee knows Dodd from going on a duck hunt with him a couple of years ago. Lee also said that Dodd has a younger brother.  Lee stated Dodd's grandparents, Grafton and Sandra, live in the direction Dodd was traveling.  Lee felt as though his grandparents would probably cover for him.\n\n\n\nFrom information and observation, the following descriptive data was obtained:\n\n\n\nName:\tBrian K Lee\n\n\n\nRace:\twhite\n\n\n\nSex:\tmale\n\n\n\nDOB:\t6/14/1981\n\n\n\nSSN:\t408-55-2338\n\n\n\nAddress: 4810 Bible Hill Road\n\n\t   Parsons, TN\n\n\n\nPhone:\t731-733-1190"], ["TN0284", "04-18-2011", "Open", "Routine", "", "", "Int-Oral-Brian Lee\n\n\n\n\n\nBarry Duke was interviewed by ASAC Doug Long on April 18, 2011 at Bible Hill Baptist Church.  After proper identification and explanation of the purpose for the interview, he volunteered the following information:\n\n\n\nDuke advised he remembered being outside his mom's house the other day and seeing one of the Dodd brothers come by on a 4 wheeler.  Duke was not sure if it was the youngest Dodd or older Dodd.  Duke did not remember which day it was.  Duke also did not know what time of day.  Duke did not remember what color clothes he was wearing.  \n\n\n\nDuke advised when Dodd came by, he was driving fast enough that he almost got the 4 wheeler on two wheels.  Duke stated Dodd turned and went north on Cub Creek Hall Road.  Duke stated he did not see him again that day.\n\n\n\nFrom information and observation, the following descriptive data was obtained:\n\n\n\nName:\tBarry Duke\n\n\n\nRace:\twhite\n\n\n\nSex:\tmale\n\n\n\nDOB:\t1/9/1961\n\n\n\nSSN:\t415-23-0601\n\n\n\nAddress: 22 Cub Creek Hall Road\n\n\t   Parsons, TN\n\n\n\nPhone:\t731-847-9424"], ["TN0285", "04-18-2011", "Open", "Routine", "", "", "Int-Oral-Brian Lee\n\n\n\n\n\nRandall Duke was interviewed by ASAC Doug Long on April 18, 2011 at his mother's residence, located at the corner of Bible Hill Road and Cub Creek Hall Road.  After proper identification and explanation of the purpose for the interview, he volunteered the following information:\n\n\n\nDuke advised he remembered being outside his mom's house the other day and seeing one of the Dodd brothers come by on a 4 wheeler.  Duke stated it had to have been either Monday, Tuesday, or Wednesday of last week. Duke was not sure if it was the youngest Dodd or older Dodd.  Duke also did not know what time of day exactly but thought it was between 9:00 am and 10:00 am.  Duke stated he thought he came from past the church and turned on Cub Creek Hall road.  \n\n\n\nDuke advised the boy was wearing a green jacket.  Duke did not remember if it was camouflage or not.  Duke remembered the 4 wheeler is either orange or red.  Duke advised he didn't see him again that day.    \n\n\n\nFrom information and observation, the following descriptive data was obtained:\n\n\n\nName:\tRandall Duke\n\n\n\nRace:\twhite\n\n\n\nSex:\tmale\n\n\n\nDOB:\t1/14/1953\n\n\n\nSSN:\t410-94-7520\n\n\n\nAddress: 20 Russ Long Lane\n\n\t   Parsons, TN\n\n\n\nPhone:\t731-847-6797"], ["TN0190", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0287", "04-18-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Jessica Jones (731) 697-9519 advised she, husband, and friends went four wheeling on Saturday 04/16/11 around 1:30. They saw some footprints beginning at Dobbs Trail at Natchez Trace State Park, Lexington, TN. Ms. Jones stated it looked like a car had \"spun out\" at the start of the trail and someone got out of the car.  The footprints were close together and sunk into the ground like the person was carrying something heavy.  Ms. Jones and family followed the prints all the way down the trail until the footprints stopped and turned around.  The footprints lead them to a man made trail. Ms. Jones said, they couldn't follow the footprints because the trail was too small and they were on the four wheelers. The footprint looked about a size 11 or 12."], ["TN0295", "04-18-2011", "Open", "Routine", "", "", "Cindy Thompson @ 840 Cedar Bluff Dr., Mt. Carmel, TN 731-852-2444.  There is an abandoned house down from Ms. Thompson's home.  Her husband looked in it and saw some medical supplies (Dextrose saline & tubing). Ms. Thompson is a nurse; these supplies would be used to rehydrate a person."], ["TN0289", "04-18-2011", "Open", "Routine", "", "", "Received a call from Beth Little.  Her phone number is 731-733-1846.  She heard from a friend that overhead another lady stating that she saw Holly Bobo in an abandoned house in Bible Hill (Parsons, TN).  The caller stated that you would have to contact Craig Hendrix, aka:  Skull.  His parents own property (Mother's name is Linda) in that area.  Caller can't remember name of road.  Caller stated that everyone around there should know who Craig Hendrix is and a way to get in touch with him.  Caller stated that you come to a Y in the road and can't go left..you go straight."], ["TN0199", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0184", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0188", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0077", "04-18-2011", "Closed", "", "", "", "Marks found pink shirt by bridge on Hwy. 114 & Scott's Hill & Chesterfield.  Provided shirt to Sgt. Byrd of Henderson Co S.O. on 2/3rd day of searching.  Appears covered. Info only."], ["TN0189", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis. SA Terry Dicus checked Call."], ["TN0194", "04-18-2011", "Closed", "", "", "", "Close Facebook. SA Mark Lewis."], ["TN0294", "04-18-2011", "Open", "Routine", "", "", "An anonymous female caller stated that her ex-boyfriend, Bryan Fiddler, used to wear camo a lot.  He owns an arsenal of weapons.  He knows that area very well.  He used to drink heavily.  He works some nights and is off a lot during the week.  He lives in a trailer.  You go to the post office, make a left and go 5 miles and then turn left by the shop.  He is a white male who is approximately 37-38 years old.  He might have a girlfriend....not sure.  He has a history of domestic violence. \n\n \n\nWe took her phone number off the terminal ID.  It is 731-394-0901.  She wishes to remain anonymous."], ["TN0076", "04-18-2011", "Update", "Routine", "", "", "Follow up needed, possibly retrieve security tape from Fred's trough manager,  Pam Jordan 731-967-5337."], ["TN0161", "04-18-2011", "Closed", "", "", "", "No additional description of suspect.  Ms. Thompson state after the suspect fled the scene, they found a 5 gallon bucket near some trees.  The area around the bucket appeared heavily worn, as if the suspect had been there for some time."], ["TN0288", "04-18-2011", "Closed", "", "", "", "No Follow up to do. SA Cathy Ferguson"], ["TN0290", "04-18-2011", "Open", "Routine", "", "", "An elderly lady by the name of Dian Matlock called.  Her phone number is 731-249-5489.  She used to reside down there in that area in 2002.  Her deceased husband used to hunt arrowheads and he made mention that there are several caves in the area.  She also said that some older men had lived in one of the caves.  These caves are close to the river."], ["TN0291", "04-18-2011", "Open", "Routine", "", "", "Received a call from Pam McGaha.  Her phone number is 731-549-2319.  Her work number is 731-847-6354.  She was sitting in her front yard on Tuesday, at 6 pm. She stated that a greenish, blush grey truck with a long wheel base pulled up.  In the back of the truck was a deep freezer.  Two male individuals were in the truck, only one got out.  He had red long dread locks.  He wanted to know if the couple wanted to buy some meat.  The couple declined.  They asked him or made a comment that he was not from around there.  No license number or any other details."], ["TN0292", "04-18-2011", "Open", "Routine", "", "", "Got a call from Whitney Duncan's aunt.  She said that a local psychic there in Parsons is stating that she is picking up on a man's name with the letters P or G.  She sees an old burgundy car.  She sees a lot of rusted tin and a boat motor.  She is also picking up on the names Keith and Brad.  Caller stated that they had heard there was a suspicious couple of lives out at the lake.  They went and pretended they were asking about boat there and secretly took a picture.  They are sending the picture to the psychic and if she gets any more readings she will call back."], ["TN0304", "04-18-2011", "Open", "Routine", "", "", "Frankie Lay, with a Jackson radio station, Called John Mehr, and said they received a call after their Radio Program from a caller unkown to them who said that Holly was in a cabin in the N. T. Park and she is hurt bad, but was not dead.Frankie is going to see if the tech guys can get the caller number."], ["TN0293", "04-18-2011", "Open", "Routine", "", "", "Received a call from Decatur County 9-11 dispatch.  She received a call from Shawn Crow.  Her phone number is 423-333-8893.  Her name of Shawn Crow.  She stated that a male that works at Vanderbilt Hospital wanted to be her friend.  She declined this invite.  She just thinks this was the same time Holly came up missing.  He seemed weird.  Maybe he invited Holly to be his friend and she turned him down."], ["TN0241", "04-18-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0300", "04-18-2011", "Open", "Routine", "", "", "Ms. Smith called from Gatlinburg, TN.  Her phone number is 423-487-4554.  She works at Corky's B-B-Que.  She said that Holly Bobo or someone that looks just like her except short red hair came in and turned in an application for Hard Rock Cafe around 6:30 pm tonight.\n\n04/19/2011 T. Wilson and T. Nolen  called this source and spoke with her, at which time she advised she saw a Female who she believes to by Holly Bobo. This female filled out and turned in an application to Hard Rock Cafe. Source is sure the female was Bobo. The female appeared to not be in any danger. Officers spoke to this person by phone and state that an In-Person visit is needed to this sourec."], ["TN0301", "04-18-2011", "Open", "Routine", "", "", "John Vaughn called.  His phone number is 615-578-4821.  He applied and was hired by MTA bus service last year (nashville).  he stated that another man by the name of John Gary Vaugh, aka:  John Michael Kent stole his identity.  Said John Gary Vaughn is a sex offender listed as residing at 813 Curtis Street in Paris, TN.  Need to check this out."], ["TN0302", "04-18-2011", "Open", "Routine", "", "", "Stephanie Colter called.  Her phone number is 731-441-5745.  Her mother lives on Liberty Church Road in Holiday, TN.  You need to check out Jason Everett Nickle.  He was just arrested yesterday on sex offender charges.  He was arrested in Jackson.  Suspect Nickle had stopped by her mothers house on March 10th.  He was just knocking on their door and asking questions.  They are assuming he had been in that area where Holly Bobo had been missing from.  \n\nHe has followed young women.  \n\n\n\nCaller wants to remain anonymous.  He is supposed to be married and you could ask her where he's been.  He was passing himself off as a youth pastor."], ["TN0303", "04-19-2011", "Open", "Routine", "", "", "Received a call from Decatur County Command Post (DeeAnna).  Her phone number is 731-852-3911.  She stated that she has received many calls reporting that Jesslyn Duncan has been getting text messages from John Curtis.  John Curtis states that he is staying with Jonathan Dodd in an abandoned shed on some property.  Both Dodd and Curtis were in the search party.  No address or location information."], ["TN0297", "04-19-2011", "Closed", "", "", "", "No Follow up needed, SA Brent Booth."], ["TN0298", "04-19-2011", "Closed", "", "", "", "No follow up needed, SA Brent Booth."], ["TN0205", "04-19-2011", "Closed", "", "", "", "Anthony Wayne Gibson, DOB/ 4-22-71, TN OLN/066942651, lives in rock house at 398 Gibson Rd., Parson, phone 731-549-0798.  He had the flu and sent to see Dr. Phillips at 2:00pm.  Stayed home. Went to his Mothers for supper.  He works for Danny Graves.  Dating Allison Bedy. Lives in the Bible Hill C se info only. SA Mark Lewis."], ["TN0219", "04-19-2011", "Closed", "", "", "", "Close Craiglist. SA Mark Lewis."], ["TN0217", "04-19-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0198", "04-19-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0242", "04-19-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0185", "04-19-2011", "Closed", "", "", "", "Close no more specific information. SA Mark Lewis."], ["TN0178", "04-19-2011", "Closed", "", "", "", "Close Craiglist. SA Mark Lewis."], ["TN0177", "04-19-2011", "Closed", "", "", "", "Close evidence not believed to pertain to case. SA Mark Lewis."], ["TN0154", "04-19-2011", "Closed", "", "", "", "Close Craiglist. SA Mark Lewis."], ["TN0153", "04-19-2011", "Closed", "", "", "", "Close Psychic. SA Mark Lewis."], ["TN0149", "04-19-2011", "Closed", "", "", "", "Close Craiglist. SA Mark Lewis."], ["TN0152", "04-19-2011", "Closed", "", "", "", "Close info only. SA Mark Lewis."], ["TN0145", "04-19-2011", "Closed", "", "", "", "Close out of state (narative). SA Mark Lewis."], ["TN0140", "04-19-2011", "Closed", "", "", "", "Close no specific info . SA Mark Lewis."], ["TN0135", "04-19-2011", "Closed", "", "", "", "Close Facebook. SA Mark Lewis."], ["TN0134", "04-19-2011", "Closed", "", "", "", "Close out of state (narative). SA Mark Lewis."], ["TN0128", "04-19-2011", "Closed", "", "", "", "Close Psychic. SA Mark Lewis."], ["TN0124", "04-19-2011", "Closed", "", "", "", "Close not speciic to case. SA Mark Lewis."], ["TN0064", "04-19-2011", "Closed", "", "", "", "Close Out of state. SA Mark Lewis."], ["TN0043", "04-19-2011", "Closed", "", "", "", "Close Veh info only. SA Mark Lewis."], ["TN0311", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Call rec'd from Bob Stevens of Camden, TN who is a disabled former police officer of Benton County. He requested his name be kept out of things since he is disabled and could not get away from anyone who might come after him. Mr. Stevens said he worked in the past with Alvin Daniels on several cases involving disappearances of young girls like Holly Bobo. He stated that the suspect in several of the disappearaces was a J C Brue. He advised that several of J C Bruce's brothers were already in prison. Mr. Stevens advised that Bruce's DNA should be on record since he just recently got out of prision. Mr. Stevens mentioned a Shelia Bradford case, a case of 2 missing girls in Stuart County and a case of a boy and his sister from Dickson. He said Shelia was never found, the 2 girls were never found, and the boy had gone for help when their car broke down and the sister was also taken and never found. He definitely feels that this J C Bruce suspect should be considered and checked out."], ["TN0059", "04-19-2011", "Closed", "", "", "", "This lead to be closed per SA Mark Lewis."], ["TN0036", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Vehicle Information only."], ["TN0382", "04-19-2011", "Open", "Routine", "", "SA Jimmy Turner", "SA Jimmy Turner spoke with Kary Bennett (w/f) that she saw a w/m at approximately 5:30 pm on the 13th of April. She said she had never seen this individual before. He was 6'2, 260-275 lbs, wearing a tan fleece coat, blue jeans, tennis shoes, bright blue ballcap. Subject was dark complected. He did not walk with a limp and was seen heading towards the fairgrounds in Tip Top Market area."], ["TN0227", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Information only."], ["TN0080", "04-19-2011", "Closed", "", "", "", "To Close per SA Mark Lewis. Refer to SA Joe Craig."], ["TN0377", "04-19-2011", "Open", "Routine", "", "SA Darryl Richardson", "SA Darryl Richardson spoke with Ginger Rainey whoe works in the Judges office reported a co-worker (Stacy Ivy) observed a w/m washing the inside of his truck at the car wash on Friday, April 15, 2011 across from the municipal building. Mrs. Rainey stated Ivey reported this occurred during a severe thunderstorm. Ivey described the truck to Rainey as an older black Ford pickup."], ["TN0380", "04-19-2011", "Open", "Routine", "", "SA Darryl Richardson", "SA Darryl Richardson spoke with Bronson Sewell and stated on Tuesday, April 12th in the afternoon, he and his daughter observed a car backed in a little road just off \"five forks road\". Sewell stated he thought the person was just back there smoking marijuana. Sewell stated he and his daughter drove over to the car and yelled at the guy. Sewell stated the guy looked startled and drove from the area at a high rate of speed. Sewell described the car as a 97-98 model Ford Taurus, and the person driving as a w/m wearing a baseball cap and appeared to have a skinny face. Sewell stated this occurred 1/4 mile from Holly Bobo's residence."], ["TN0376", "04-19-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "SA Darryl Richardson", "SA Darryl Richardson advised a Mr. Lackey with Lackey Super Market (731-847-2913) told agents that on Wednesday, the day of Holly's dissapearance, Max Chumney who buffs the floors at the supermarket did not show up for work. Mr. Lackey said it was odd that Chumney wasn't there because he is there every Wednesday unless it rains. Mr. Lackey said it did not rain last Wednesday. According to Lackey, Chumney drives a red Toyota Pickup truck and a white van for the buffer business. Lackey also stated Chumney is an avid hunter for turkey, deer and coon hunting. Mr. Lackey stated he wished to remain anonymous. Mr. Lackey also stated lived close to Bobo and he has been involved in the search for her.\n\n04/19/2011 TFO P. Gooch and B. Beasley interviewed Max Chumeny at his residence at 775 Tip Hayes Road, Phone 731-847-2739 Chumney never mentioned missing work last Wednesday, but said his employer said that Chumney normally is there by 07:00 and gone by 07:30. Chumney id say that last Wednesday he did take his girls to school that morning around 07:30, and he has been taking them to school. Mr. Lackey, employer,  can't recall what he did when he left the school around 07:30 to 07:35, but says he normally going into town to get a drink or something. He remembers that he was talking to a man in the neighborhood named Brent Ley when they saw helos flying around. Chumney didn't act obvisously suspicious or nervous, but we will leave his tip open in the event no suspect is developed and this could be a possible re-interview. Chumney drives a red truck, or a white work van."], ["TN0307", "04-19-2011", "Open", "Routine", "", "phone call", "Received several calls today from people that are nurses and they are all suggesting that we check if Holly was doing any clinicals.  If she was the suggestion is to check on the patients she had contact with and see if any of them were stalking her or had inappropriate contact with her."], ["TN0308", "04-19-2011", "Open", "Routine", "", "phone call", "Amanda Bry (731) 549-2599 called this morning regarding a friend of her's, Charles Cory Stewart. Amanda advised that Stewart was questioned by the TBI on Sat (4/16) and every since then he has been acting \"weird\". Amanda stated that he did not do this and it was not in his nature. Amanda also stated that on Sunday evening she noticed that Stewart's girlfriend put some trash bags in the car along with a child and drove away but came back a little later."], ["TN0328", "04-19-2011", "Open", "Routine", "", "Lead Sheet", "Frances Edmonson, Registrar Jackson State CC, 731.425.2654, 2046 N Parkway, Jackson TN, was interviewed in person by SA FBI Jason Bilnoski. Edmonson advised Holly Bobo attended JSCC from Fall of 2008 until Summer 2010. Jonathan Dodd attended only in Fall 2008. They did not attend JSCC together."], ["TN0312", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller: Drew Deck who works with a guy named Jason Nichols. Stated that Nichols was arrested on Sex Offender charges last week, but he wasn't sure what day - either Wed or Thurs. He wanted t
