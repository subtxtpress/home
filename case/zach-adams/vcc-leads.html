s they were saying, they all agreed on. Like the description of the man, that he drives a red truck, there's a shed involved, you have to \"look down\" to find Holly because they see her in an area"], ["TN0703", "04-27-2011", "Update", "Routine", "", "Email to TBI Website", "2nd part of email\n\nunderground, etc. A woman also drew a sketch of the man she saw in her vision. Well yesterday, one of the ladies on the website showed the sketch to a few people who live in Holly's town, and they all recognized the man and gave her the same name: Johnny Harris. This girl from the forum, found Johnny on facebook and showed his profile to the other psychics and they were all shocked and agreed this was the man they all saw. They looked through his profile and through the pictures he had up, read his wall posts and all of those things they were posting in the past (the ones I was confused about and didn't see how they were connected) well they came together. A few people said he must have been in the military or something, and they figured out from his profile that he was in Vietnam. A few psychics also had the names Martin and Keith come to them, he is retired from working for Lockheed MARTIN, and he has a son named Keith. Many of them also think there is more than one person involved, and that they see a younger boy in their visions. He has quite a few children, including the son Keith. I just think this is all really fishy, and this man needs to be looked into. I'm sure someone already brought him up and told you guys, but I wanted to be sure you knew! I still do not really believe in psychics, but I just think it's not a coincidence that they all said this is the man and they all agree it's him. Everyone is so in-sync on that forum, it's unbelievable. Someone from the community who recognized him also said he is not a normal man, and there is something wrong with him. Almost every single psychic on that forum believes the man who took Holly has a speech impediment or is somehow 'slow'."], ["TN0703", "04-27-2011", "Update", "Routine", "", "Email sent to TBI Website.", "3rd part of email\n\nAnother scary thing a few people mentioned, including my friend Kyle's aunt, is that he has \"eyes\" on his property. He lives in a storage building/shed like place. Someone said there must be an underground area around there where he is keeping Holly. That same person said the neighbors knew about it, but they must have forgotten about it (unless something has already been reported to the police about it). But the person who said he has \"eyes\" there said he saw surveillance cameras or something along the lines of that because he's not there a lot of the time and only \"visits\" Holly. This is just all really scary, and I really wanted to let you guys know about what's going on because I think this could really help out. I just really want Holly to be brought back home safely, my friends and I all know Whitney, so that's how we got involved in this so quickly and why it's really affected us. It's just terrifying hearing about these cases, and especially Holly's. Me and my friends are all around her age, all students, and I actually live right next to the woods. So you can imagine how freaked out I am now to get home and have to walk right next to them not knowing if there's someone in there... I just can't imagine going through what Holly is right now and she needs to be found and brought back home to her family!! Hopefully this email will help out with something and be of use.\n\n \n\n-Nicole Merchut"], ["TN0704", "04-27-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email to TBI Website\n\nI'm gifted. I realize psychic abilities are looked down upon. People don't believe in them. I would like to offer a tip anyway that I believe could possibly help your case.I'm a visionary. I saw a white truck looked to be a chevy crew cab parked in  a remote area. I saw trees in the background. The trees were behind (in the background).It looked like the truck was hidden in a cove not wanting to be found. It appeared to be in a remote area like a lake setting.\n\n \n\nSearch the lake areas. Hidden remote areas.\n\n \n\nThank you so much for your time."], ["TN0704", "04-27-2011", "Closed", "", "", "", "Psychic Lead\n\n\n\nSubject emailed additional information\n\n\n\nI saw a vision of an underground opening (hole).  A line (rope) was hanging down in the hole and a container (object) was attached. The container was swaying back and forth.\n\nJust wanted to give some info. Not sure if its related to this case.  Ellen Staab"], ["TN0705", "04-27-2011", "Open", "Routine", "", "800 TBI FIND", "Rhonda Hatcher - 301-514-6801 cell 301-834-7868 home\n\n\n\nComplainant advised her ex-husband Jeff Hatcher should be looked at in regards to Holly's disappearance. He lives in Unionville, Tennessee and is supposed to have a cabin on Tims Ford Lake and a boat there. She states that he is involved in the horse show industry with several Bobo's She stated that a dead female was found on his property on Cave Road in Charles Town, West Virginia. Also a female customer of theirs was found dead as well. He is also involved in various theft and fraud cases according to the complainant."], ["TN0706", "04-27-2011", "Open", "Routine", "", "TN OHS Larry Mullins", "Decatur County EMA Office received a phone call from a Rod Livingston  who is a truck driver and he said he was working last weekend 4/16 @ 4:45 pm around mile marker 111 when he saw a guy come out of the woods east bound at 2nd bridge, buzzards present. It was a w/m, straight black hair, 20-25 wearing a camo shirt, brown pants and a backpack. Mr. Livingston's number is 676-4577."], ["TN0707", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email from TBI Website\n\nHello, \n\nI heard on the news about Holly Bobo being abducted from her home in TN and I wanted to help find her  with my psychic thoughts.\n\nI was drawn to  an area  shown below on the google map .This map  shows an area that I was mentally  drawn to near 2085  Beacon Rd (Co Hwy 1735) and  also near Dixie Mills .\n\nThis area shows to be only 14 miles from Holly's home.\n\nI feel a male with possibly initials C W (His name  could be Chase or Charles ) I feel he  is the one who abducted Holly and I also feel she is deceased now and felt she was raped and choked by him .\n\nI feel he is a hunter and police can possibly  check for a name like this of people who may have  applied for Hunting License .\n\nI have been right in the past when asked  to look for other missing people. I wanted to pass this info on to you and hopefully it may help in your search.\n\n \n\nSincerely \n\nJO\n\nJpnicks@aol.com"], ["TN0707", "04-27-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0709", "04-27-2011", "Open", "Routine", "", "TN OHS Larry Mullins", "Decatur County EMA received information from a Sara Allen and husband Patrick Allen who live at Mt. Arat and Tubbs Springs, 1st house on right. Stated Shane Hardison of 218 Box Rd has been known to proposition females in the past."], ["TN0708", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website    \n\nMy name is Wally Lidberg, I live at 799 Bethany Church Road, across the road from Bethany Church, where they land emergency helicopters in their large parking lot, to carry passengers to far away hospitals. My location is in Forest City, North Carolina-28043. I am 74 years old, was born on 8/8/1936 in Racine Wisconsin, my Social Security number is 393-32-5688, \"E\"Mail address is wlidberg@nctv.com. The coordinates for that helicopter landing is 35*18'13.18\"N and 81*53'35.14\"W. My Cell Phone number is (828) 980-2516 and a Verizon call is free. \n\n \n\n    I am a Pendulum Dowser and I find lost treasures all of the time, so I use those talents to help find lost people.\n\n \n\n    I gave you the location next to that large 6 lane highway and I believe the attached aerial photograph will be very helpful to your search. \n\n \n\nIf you could give me some information that you have about this case, that might help me to help you. \n\n                                                                                                                                                           Wally"], ["TN0708", "04-27-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0710", "04-27-2011", "Open", "Routine", "", "Email sent to TBI HQ", "Email sent to TBI Website\n\nPlease see attached hand-drawn map.  \n\n \n\nA friend of mine asked me to meditate on Holly Bobo.  I believe I reached her energy as I did with Jacob Jordan who disappeared last summer.  I told his mom Stephanie that there was a box under his bed that he wanted her to have.  She found it.\n\n \n\nI also recently drew a picture of a house for a friend of mine and told her that the man who lived there was stalking her daughter.  They sent me a photo of the house and it matched up exactly.  The man was this girl's grandma's ex-boyfriend's son who they have a restraining order against.  \n\n \n\nWhen I first meditated on Holly Bobo a few days ago, I got that her stepfather? or \"the\" stepfather of someone she knew - took her.  I now believe she is dead because her energy told me what to draw.  She said the pond she is near is \"heart-shaped\" and I heard her say 'I'm not in the pond, though, I'm in the woods.\"   When I went on mapquest and tried to do the mile-measurements on the attached map she told me to draw, there is a pond in that area that is rather heart-shaped.    \n\n \n\nI don't do this for money.   I gave tips to Atlantic City on Nadirah Ruffin and I told them she was in the water 2 weeks before they found her in the river.  \n\n \n\nIf you want me to meditate again on this, I'll be happy to do so.\n\n \n\nBecky M."], ["TN0711", "04-27-2011", "Open", "Routine", "", "TN OHS Larry Mullins", "Decatur County EMA received information from Tony Calabrese out of Ohio stating he saw something on Facebook that an officer should look at. He can be reached at 234-736-1293."], ["TN0712", "04-27-2011", "Open", "Routine", "", "Fax from America's Most Wanted", "Faxed Tip from America's Most Wanted - Case Mgr: cthomas@amw.com\n\nTipster is anonymous\n\nLocation of sighting at Circleville High School, Circleville, Ohio on Tuesday April 26, 2011 at 8:55. Subject saw a white female with blond hair, blue eyes, 5'2\" 110lbs wearing a pink shirt and blue jeans. Appeared to be early 20's. Comments by the caller advised that \"She told me her name and it sounded familiar she said she had a ride on the way but the police need to be called and I have no phone."], ["TN0713", "04-27-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0713", "04-27-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email to TBI Website\n\n\n\nDear Sir:\n\n\n\nI may not be correct but I had a dream a compelling dream that at the  \n\nGunderson Lutheran Mediacal Center 1900 South Ave. - La Crosse, WI 54601\n\nsome men took Holly Bobo to this hospital and claimed she had been in a \n\ncar accident because her nose was operated on a couple days ago and she \n\nwas bruised in the face and that maybe she has vascular head trauma.\n\nI dreamed about a surgeon named Gunderson III operating on her under the \n\nname of Holly Kowalski."], ["TN0572", "04-27-2011", "Closed", "", "", "", "SA Faulkner spoke with Joann Vandersarl by phone. She stated she lived near Athens, AL approximately 100 miles south of Nashville. Saw a couple walking on road with no side walk and they crossed in front of her while she was stopped at stop sign. The girl was blonde and looked \"unhappy\" but did not ask for help. Limestone Correctional Facility is approximately 1 1/2 miles away"], ["TN0570", "04-27-2011", "Closed", "", "Rachel Pierce Victim Specialist FBI", "", ""], ["TN0564", "04-27-2011", "Closed", "", "", "", ""], ["TN0558", "04-27-2011", "Closed", "", "", "", ""], ["TN0559", "04-27-2011", "Closed", "", "", "", ""], ["TN0540", "04-27-2011", "Closed", "", "", "", "Information not related to case"], ["TN0546", "04-27-2011", "Closed", "", "", "", "Informational only."], ["TN0533", "04-27-2011", "Closed", "", "", "", "Informational only"], ["TN0531", "04-27-2011", "Closed", "", "", "", "Not related."], ["TN0493", "04-27-2011", "Closed", "", "SA Brent Booth", "", "Not related to case."], ["TN0508", "04-27-2011", "Closed", "", "", "", ""], ["TN0472", "04-27-2011", "Closed", "", "", "", ""], ["TN0538", "04-27-2011", "Update", "Routine", "", "", "Leave open per SA Lewis"], ["TN0163", "04-27-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Per FBI update, lead could not be verified."], ["TN0171", "04-27-2011", "Closed", "", "", "", "Vehicle information"], ["TN0257", "04-27-2011", "Closed", "", "", "", ""], ["TN0300", "04-27-2011", "Closed", "", "", "", "Possible sighting unknown female, not in danger. \n\n\n\nAdditional INFO ADDED 5-03-11 Sent to LEIC Prickett via email from SA Johnny Simmons via email from SA DeArmond:\n\nOn 4/21/11, at about 10:45 a.m., I spoke with complainant, Felicia Smith, 577 Middle Creek, Cosby, TN 37722, Ph 423-487-4554, who advised that a girl came into her work, Corky's Barbeque in Gatlinburg on 4/18/2011 around 6:30 pm and asked to borrow a pen.  The female then walked in the direction of the Hard Rock Cafe with another female about her age.  She then returned the pen several minutes later.  The complainant described the female as 5'3\", 120-125 pounds with strawberry blonde hair. She said the girl was in her 20's.  Mrs. Smith said the girl looked like the missing female and that she assumed that she went to the Hard Rock to fill out an application.  \n\n\n\nOn 4/21/11, I went to the Hard Rock Cafe located at 515 Parkway in Gatlinburg and spoke to the Manager, Mark Baker.  Mr. Baker stated that no employment applications had been turned in on the evening of April 18, 2011.  He provided a telephone number of 865/640-7625 for any follow-up"], ["TN0314", "04-27-2011", "Closed", "", "", "", "Vehicle description only"], ["TN0357", "04-27-2011", "Closed", "", "", "", "Facebook intel only"], ["TN0382", "04-27-2011", "Closed", "", "", "", "Description of unknown subject. No more information available."], ["TN0385", "04-27-2011", "Closed", "", "", "", ""], ["TN0462", "04-27-2011", "Closed", "", "", "", "Information on hitchhiker prior to abduction."], ["TN0408", "04-27-2011", "Closed", "", "", "", "Search area information"], ["TN0466", "04-27-2011", "Closed", "", "", "", "Information on crime in another state."], ["TN0581", "04-27-2011", "Closed", "", "Rachel Pierce Victim Specialist FBI", "", "Chad Marshall interviewed by FBI Champine and Viveros. Marshall was at school or on way to school at time of incident."], ["TN0585", "04-27-2011", "Closed", "", "", "", "No investigative value"], ["TN0586", "04-27-2011", "Closed", "", "", "", "Lidburg's telephone number out of area. Recontact attempt to determine his ability to know location of abductor. No answer. Investigative information deemed to have no lead value."], ["TN0627", "04-27-2011", "Closed", "", "", "", "No investigative value. No reason to believe link between St. Louis attack and TN."], ["TN0633", "04-27-2011", "Closed", "", "", "", "No investigative value."], ["TN0635", "04-27-2011", "Closed", "", "", "", "Caller recounted. He is speculating based on statistical probability. No investigative value."], ["TN0638", "04-27-2011", "Closed", "", "", "", "No investigative value"], ["TN0639", "04-27-2011", "Closed", "", "", "", "No investigative value."], ["TN0642", "04-27-2011", "Closed", "", "", "", "House located and searched by FBI Ricci and Adams"], ["TN0655", "04-27-2011", "Closed", "", "", "", "No investigative value"], ["TN0659", "04-27-2011", "Closed", "", "", "", "No investigative value"], ["TN0663", "04-27-2011", "Closed", "", "", "", "No investigative value"], ["TN0683", "04-27-2011", "Closed", "", "", "", "FBI SA Champine and Jeff Jackson interviewed Aaron Evans. Did not ID occupants of vehicle or tag #. Also, sighting was not north of Bobo residence. Evans has not seen the truck since. Event closed by TBI SA Jackson."], ["TN0677", "04-27-2011", "Closed", "", "", "", "Vehicle description noted. No follow up investigative information."], ["TN0687", "04-27-2011", "Closed", "", "", "", "It appears records provided by Ricci and Adams that Dustin Little wsa driving an over the road truck @ the time and between Ohio and Georgia."], ["TN0514", "04-27-2011", "Update", "Routine", "", "", "SA Ronnie Faulkner spoke with Det. Pitts and he has subpoenaed cell records for 731-433-8347. It is a Verizon pre-paid phone bought in Grand Junction, TN. Det. Pitts called back and provided victim had received more text from the guy from a new number 731-433-7049. Det. Pitts will keep SA Faulkner updated on case."], ["TN0607", "04-27-2011", "Update", "Routine", "", "", "Decatur Co SO reported Nathan Linton has a criminal background of Assault and threatening phone calls. Linton lives with his mother, Chrystal Carlson at 119 Pine Wood Dr in Jackson, TN. Agents attempted to locate victims of prior assault cases with no success (see Decatur Co Reports Attached). SA Joseph Upton in Jackson RA (FBI) will attempt to locate Linton and Carlson to interview at 119 Pinewood Jackson, TN address."], ["TN0714", "04-27-2011", "Open", "Routine", "", "", "USMS Thomas Boock and John Walker interviewed Flint Lee Perkins (friend of Clint Bobo) at the Hardeman Co EMS. He said he knew Holly Bobo for several years, since grade school. Her mother was his 6th grade teacher. Perkins and Clint Bobo went to high school together and reconnected in 2008. They set together and ride 4 wheelers and hung out. He at one time wanted to date Holly Bobo. Perkins has no alibi for the time period of the abduction. He was alone at his fathers house. He is an avid hunter and has many knives and guns. (Investigators notes: Full report to follow. This is a person of interest. He has no alibi, he is an avid hunter, has many knives and guns. He lives alone and has no girlfriend. He is a family friend and knew Holly well. His story is consistent. He made a posting on Facebook at 8:54 am which could possibly give him an alibi. Investigator feels subject needs to be printed.)"], ["TN0715", "04-27-2011", "Update", "Routine", "SA Scott Lawson - FBI", "SA S Lawson", "William Pearson was interviewed by SA S Lawson - FBI and SA K Hayden - TBI. Follow up is needed to compare phone number (731) 549-0990 to tower dump."], ["TN0715", "04-27-2011", "Open", "Routine", "SA Scott Lawson - FBI", "SA S Lawson", "Jenny Fairweather (731) 733-6875 1256 Haney School Road, Parsons, TN - Fairweather is concerned with some statements made by William Pearson. Pearson accompanied Fairweather during the search efforts and said \"only a genius could pull this off and then assist with the search\""], ["TN0674", "04-27-2011", "Closed", "", "", "", "SA Kira Hayden and FBI SA Scott Lawson went to Camp McMerry located off Boy Scout Camp Rd. All cabins have been checked and nothing found."], ["TN0716", "04-28-2011", "Open", "Routine", "SA Brent Booth", "NCMEC Harold Jones", "April 1, 2011 a Tracy Loving (Family Leisure Pools) Jackson, TN (931) 637-7333, subject worked on the Bobo's pool."], ["TN0615", "04-28-2011", "Closed", "", "USMS Thomas Boock - US Marshal", "USMS T Boock", "USMS Thomas Boock interviewed West in person at her place of employment on 04/27/2011."], ["TN0607", "04-28-2011", "Update", "Routine", "SA Joe Upton - FBI", "SA J Upton - FBI", "Crystal Carlson, Linton's mother advised Linton is working in Columbia, TN operating a backhoe at the Saturn Plant. He has been staying at a motel in Columbia for the past 2 months. She is not sure which hotel. He comes to Jackson every other weekend because he has partial custody of his daughter. Linton's cell is 731-845-6614.\n\n\n\nNeed to contact Linton in Columbia to determine if he was working on 4/13/2011."], ["TN0717", "04-28-2011", "Open", "Routine", "SA Cathy Ferguson - TBI", "SA C Ferguson", "Ashley Brinkley - 13 Fox Den Cv, Jackson, TN 03/20/1992 411-71-5566 - John Curtis's Girlfriend (731) 358-0591.\n\n\n\nCheck with John Curtis's girlfriend to see if she has any info on Dodd or Curtis."], ["TN0717", "04-28-2011", "Closed", "", "SA Cathy Ferguson - TBI", "SA C Ferguson", "SA Cathy Ferguson interviewed Brinkley on 04/28/2011."], ["TN0718", "04-28-2011", "Open", "Routine", "", "Inv. Wes Woodward - Parsons PD", "Thomas Holloway was caught on video stealing an FM Alert and a Police Scanner from Radio Shack. It was believed this gentleman had been involved in the searches. Mr. Holloway was also wanted on two outstanding warrants. I (Hudgins) was notified by Inv. Woodward (Parsons PD) that when he was arrested and questioned about the search he stated \"my sister told me Decatur Co was looking to pick him up for snatching the Bobo girl\""], ["TN0718", "04-28-2011", "Update", "Routine", "SA Greg Simpson - FBI", "SA G Simpson - FBI/J Hudgins", "Greg Simpson and Joey Hudgins interviewed Mr. Holloway on 4/27/2011. \n\n\n\nFollow up is needed on Hollway's alibi for the morning of the abduction and possible questioned about the shacks w/ropes on rafters."], ["TN0595", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "SA Faulkner spoke with Mr. Bixon by phone. No follow needed per SA Faulkner"], ["TN0694", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Psychic lead from Canada. Lead talks about Meredith Hope Emerson who was murdered in Atlanta in O8, Hills was arrested."], ["TN0719", "04-28-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nI am a concerned citizen from Dunn NC following the Holly Bobo case and find this website strange and unusal\n\n \n\nhttp://headlinesandtags.blogspot.com/2011/04/breaking-holly-bobo-update-was-west.html\n\n\n\nWeb page attached to Lead Sheet"], ["TN0133", "04-28-2011", "Closed", "", "SA Travis Taylor - FBI", "SA T Taylor - FBI", "Contacted Robin Goff who is the office coordinator at David Joseph Scrap Co. in Jackson, TN who stated Paul Love was at work on 4/13/2011 at 7:30 a.m. when she arrived and was still there at 4:00 p.m. when she left that day. The company phone number is 731-424-5659 and the manager is Allen McCracken."], ["TN0720", "04-28-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Charles Adam (731)845-3410 said, a white male in his 40's, brown hair, moustache, goatee, wearing camouflauge followed his granddaughter Lindsey McCollum (731)845-3567 to E.W.James & Sons grocery store, McKenzie, TN on 04/15/11. Lindsey was leaving Bethel University in McKenzie at 2:00 p.m. Friday afternoon. She noticed an older model, blue Dodge Ram four-wheel truck(no tag info)following her. This person followed her about one mile to E.W. James & Sons grocery store in McKenzie. When Lindsey got out of her vehicle to enter the store, the white male in the truck parked his vehicle and started to follow her. Lindsey's boyfriend(Josh Frye) was riding with her and noticed this person get out of his truck and follow her toward the store. When the man noticed Mr. Frye get out of the vehicle, he turned around and left. Mr. Frye tried to get a license plate number but wasn't able to."], ["TN0721", "04-28-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email from TBI Website\n\n\n\nTHIS MAY BE NOTHING BUT THERE IS A MAN THAT LIVES IN OR AROUND LYNCHBUG THAT HAS A HORSE FARM. LAST NAME BOBO. \n\nHE STALKED MY NEICE A FEW YEARS AGO UNTIL SHE WENT TO COURT  IN COFFEE COUNTY.\n\nSHE ALSO IS YOUNG, PETITE, BLONDE.\n\nHE WOULD DRIVE BY HER HOUSE AND STALK HER WHEREVER SHE WENT.\n\n\n\nMAYBE NOTHING BUT..JUST IN CASE. \n\n\n\nALSO HAVE YOU LINKED THE CASES OF THE TEACHER IN SHELBYVILLE WHO DISAPPEARED SOME TIME AGO.? HER CAR WAS FOUND  BURNT OUT. SHENHAS NEVER BEEN FOUND...\n\n\n\nTHANKS \n\n\\LINDA EBERHART    9316365402"], ["TN0722", "04-28-2011", "Open", "Routine", "SA John Simmons - TBI", "SA J Simmons", "Rosie Maness - Bus drive Myracletown area (731) 847-6454 1005 Myracletown Road, Darden, TN.\n\n\n\nManess drives a Decatur County school bus in the Myracletown Road area."], ["TN0711", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Close Facebook Lead - Caller gave information about Douglas St. John who lives in Decaturville."], ["TN0712", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Close per SA Faulkner"], ["TN0703", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Psychic Lead - Close per SA Faulkner"], ["TN0722", "04-28-2011", "Closed", "", "SA John Simmons - TBI", "SA J Simmons", "Maness stated during her bus route she normally saw Holly Bobo as Holly was headed to school. She said she does not recall seeing anything suspicious on the day Holly became missing or the days leading up to 4/13/2011."], ["TN0545", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Psychic Lead - Closed per SA R Faulkner"], ["TN0679", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Closed per SA Faulkner"], ["TN0702", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Closed per SA Faulkner"], ["TN0700", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Close per SA R Faulkner"], ["TN0699", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Closed per SA R Faulkner"], ["TN0234", "04-28-2011", "Update", "Routine", "SA Colleen McEachen - TBI", "By email from ASAC J Locke", "Information from SA McEachen\n\nUpon receiving this lead, SA Derek Travers contacted the woman who called this lead in and asked for a contact number for Heather Sullivan. She did not have that information. SA Travers then contacted the Hickman County Sheriff's Dept and inquired about an incident report that they or Centerville PD had completed relevant to this incident. Hickman County located the report that Centerville PD had completed and are going to fax it to LEIC Purviance (they are currently having computer problems). SA Travers obtained a contact number for Heather Sullivan (I do not have that number) from Hickman County and contacted her telephonically.\n\n\n\nI just left a message for Travers to get the details of their conversation. I believe she reiterated her story of being grabbed in January of this year by a man on her front porch in Centerville, but he ran away when she dropped part of the lamp that she was holding. He could not provide any type of physical description or additional information on the individual.\n\nSullivan told SA Travers that the man was tall, thin, in his mid-30s, was wearing jeans and a grey hoodie. She said that he ran away into the woods by her house where there are trails and she never heard a vehicle start, etc."], ["TN0723", "04-28-2011", "Open", "Routine", "", "Telephone", "Caller Robin Stanfill 731-234-1005 stated she had additional information regarding her ex-husband, Jason Baine. She stated that he told their children that the evidence that was found last week, info that has not been released, is a cell phone and knew exactly the location it was found. She also wanted to let the investigators know that Baine is extremely violent and during their marriage had threatened the caller stating \"they would never find your body - the Tennessee river is a very big place.\""], ["TN0681", "04-28-2011", "Closed", "", "SA Bilnoski - FBI", "From SA Bilnoski", "Need to close, Melvin Stegall was previously interviewed on Sex Offender Canvas"], ["TN0676", "04-28-2011", "Closed", "", "SA Scott Lawson - FBI", "SA S Lawson", "Interviewed by SA S Lawson and S Champine. Agent interviewed Joseph Tucsnak and verified he was at work during the time of Holly Bobo's abduction\n\n\n\nAlso Ref#TN0695"], ["TN0695", "04-28-2011", "Closed", "", "", "SA S Lawson", "Interviewed by SA S Lawson and S Champine. Agent interviewed Joseph Tucsnak and verified he was at work during the time of Holly Bobo's abduction\n\n\n\nAlso Ref#TN0676"], ["TN0724", "04-28-2011", "Open", "Routine", "", "TBI Find Line", "Rose Mary Hamilton 731-733-1999 called to say Blake Barnett is cleaning out his vehicle right now at a car wash next to City Hall in Parsons, TN."], ["TN0724", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Close per SA Faulkner, subject has been interviewed"], ["TN0577", "04-28-2011", "Update", "Routine", "SA Joe Upton - FBI", "SA J Upton", "Danny Burton interviewed by Pete Hennemann and Joe Upton - FBI. Burton advised he dropped his nephew, Dawson Fiddler off at Pin Oak Elementary on 4/13/2011 at 7:30 a.m. Pin Oak Elementary School advised Dawson was present on 4/13/2011 and class starts at 7:45. \n\n\n\nNo follow up necessary w/Burton"], ["TN0460", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Closed per SA Faulkner - Facebook"], ["TN0710", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Psychic lead - Closed per SA R Faulkner"], ["TN0725", "04-28-2011", "Open", "Routine", "FBI Victim's Specialist Mychelle Mitchell", "M Mitchell - FBI", "Karen Bobo reported Franklin Woods fits the description of Holly Bobo's abductor. Karen Bobo reported that she spoke to Franklin Woods either the day of or the day after Holly went missing. Karen Bobo reports Franklin Woods stated he was Holly's Facebook friend and took classes with Holly at Jackson State Community College."], ["TN0726", "04-28-2011", "Open", "Routine", "SA John Simmons - TBI", "SA J Simmons", "Keith Dickson - Bus driver in Five Forks and Swan Johnson area - 1845 Cub Creek Hall Road, Parsons, TN (731) 733-1168. Dickson drives a Decatur County school bus in the Five Forks and Swan Johnson Road area"], ["TN0726", "04-28-2011", "Closed", "", "SA John Simmons - TBI", "SA J Simmons", "Dickson stated he was driving his school bus the morning of 4/13/2011. He does not recall observing anything suspicious that morning or on the days preceding 4/13/11."], ["TN0641", "04-28-2011", "Closed", "", "USMS Thomas Boock - US Marshal", "USMS T Boock", "Interviewed Lewis Dieon Timberlake, M/B, 18 yoa 65 Gross Loop Lexington, TN at Lexington High School where he is a senior. He said that he has heard people talking about the Bobo case but had no specific knowledge or information about the case. He does not know who may have committed the crime. Timberlake Cell 731-614-0875."], ["TN0654", "04-28-2011", "Update", "Routine", "SA John Simmons - TBI", "SA J Simmons", "SA Simmons and Dep. Tom Boock USMS checked home but no answer at door. Area resident Mark Mays 731-847-7945 advised he believes Justin Hill is a welder. Does not know his hours but believes the family gets home after dark. He said Justin is about 25 yoa and his little sister Chelsea is 16-17 yoa. Mother is Elaine and father is Randall. \n\n\n\nNote: Just needs to be interviewed to determine his whereabouts on 4/14/11, his alibi and his cell phone number"], ["TN0317", "04-28-2011", "Update", "Routine", "SA Travis Taylor - FBI", "SA T Taylor", "Located Gerald Martin in computer database. Address is 2347 Smith Chapel Road, Decatur County. Phone number is 731-549-3605. His birth date is 2-18-1934 which makes him 77 yoa."], ["TN0721", "04-28-2011", "Closed", "", "SA Mark Lewis TBI", "SA M Lewis", "Close - suggestion on how to solve"], ["TN0719", "04-28-2011", "Closed", "", "SA Mark Lewis TBI", "SA M Lewis", "Close emailed link to website"], ["TN0718", "04-28-2011", "Closed", "", "Joseph Hudgins", "SA M Lewis", "Joseph Hudgins and Rickey Inman (Decatur County) interviewed Mr. Terry Hardee on 4/28/2011 @ 1100. Mr. Hardee said he was home that morning (he spent the night) and that Mr. Holloway was with him."], ["TN0172", "04-28-2011", "Closed", "", "SA Travis Taylor - FBI", "SA T Taylor", "Located Trent Blankenship at his shop on Bible Hill Rd. and he said that TBI SA Jeff Jackson had already interviewed him about a white male named Dodd. He was unsure of the boy's first name. I believe this lead is being pursued by TBI.\n\n\n\nRef person of interest Jonathan Dodd"], ["TN0607", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "On 4/28/2011 SA Faulkner spoke with Nathan Linton by cell phone. He knew Holly through his friend Lee Baugus who used to date her. He used to duck hunt and ride 4-Wheelers with Clint Bobo. Nathan has not talked to Holly in over a year and has never been to her house. He was at work in Columbia, TN on April 13th. Works at GM and Saturn Plant for BJ & Sons, Kevin is his supervisor contact# 810-217-7612."], ["TN0727", "04-28-2011", "Open", "Routine", "DTF Agent Dennis King - 24th Judicial Drug Task Force", "DTF Agent D King", "Dr. William Jennings 731-852-2144 36 N Pleasant Street, Decaturville, TN 38329 - Dr. Jennings reported that on 4/27/2011 he observed a male and a female on a 4-wheeler on the right side of the road at Beech River Bridge on 641 Hwy. The female had blonde hair and both were  overdressed for the weather. They were coming out of the gravel road by the bridge and did appear to avoid passing traffic by backing quickly down the gravel road."], ["TN0576", "04-28-2011", "Closed", "", "Det. Bartlett - FBI SSTF", "SA R Faulkner", "Det. Bartlett spoke to the complainant which stated the same as the lead. Officer spoke to Ranger Jeremy Blackwell at the park (615) 210-2692 and gave a vehicle description of a gray vehicle. Blackwell emailed a picture of a gray Subaru with TN Tag. Suspicious subject is unknown and nothing current to identify the guy. Blackwell was instructed to call if anything new."], ["TN0330", "04-28-2011", "Closed", "", "Det. Bartlett - FBI SSTF", "SA R Faulkner", "Officers checked Storms Loop and Hwy 69 area. Nothing was located."], ["TN0467", "04-28-2011", "Update", "Routine", "Det. Bartlett - FBI SSTF", "SA R Faulkner", "Called complainant no answer no message left"], ["TN0092", "04-28-2011", "Closed", "", "SA Travis Taylor - FBI", "SA T Taylor", "Called Human Resources at Kolpak and talked to Kerry Pierce who checked the company records which showed that Jeffrey Krider was at work from 5:46 a.m. until 2:30 p.m. on 4/13/2011"], ["TN0550", "04-28-2011", "Update", "Routine", "Det. Bartlett - FBI SSTF", "SA R Faulkner", "Called - no answer, no voice mail left"], ["TN0728", "04-28-2011", "Open", "Routine", "SA Cathy Ferguson - TBI", "SA C Ferguson", "Surveillance Videos from BP at 412 and 641 crossing."], ["TN0728", "04-28-2011", "Closed", "", "SA Cathy Ferguson - TBI", "SA C Ferguson", "Video footage from BP for the hours of 6:30 to 7:30 a.m. on 4/13/2011 has been secured. (Owner Johnny Keene says the time is 6 a.m. - 7:30 a.m. of video he provided) Agents checked on further footage and everything from 4-18 and earlier has been burned over. No further footage available."], ["TN0317", "04-28-2011", "Closed", "", "SA Ronnie Faulkner", "SA R Faulkner", "Closed by SA R Faulkner"], ["TN0729", "04-28-2011", "Open", "Routine", "SA Cathy Ferguson - TBI", "SA C Ferguson", "20400 Hwy 412E Lexington, TN 38351 - Surveillance Videos from Fisher's Gas Station Hwy 412"], ["TN0729", "04-28-2011", "Closed", "", "SA Cathy Ferguson - TBI", "SA C Ferguson", "Spoke to owner of Fisher's, Mike Fisher, he advised his system only holds video footage for a week then burns over itself. Therefore no video footage available."], ["TN0725", "04-28-2011", "Closed", "", "SA Joe Upton - FBI", "SA J Upton", "Woods advised he was at K-Wood Elementary in Lexington at 7:30 a.m. on 4/13. He signed in to assist with testing."], ["TN0730", "04-28-2011", "Open", "Routine", "", "Telephone", "Caller Tammy Chester 731-592-8684 stated a friend meditated about Holly Bobo and she sees her on the side of the Whites Creek located by Sims Bottom Road down from where the pontoon boats are put in. She said the man who took her is a big hunter and if investigators do not find Holly soon the man will go back and destroy the body."], ["TN0730", "04-28-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0731", "04-28-2011", "Open", "Routine", "SA Scott Lawson - FBI", "SA S Lawson", "Interview Kenneth Riley Lawson on Sex Offender Registry and lives in Parsons, TN"], ["TN0731", "04-28-2011", "Closed", "", "SA Scott Lawson - FBI", "SA S Lawson", "FBI Agents interviewed Kenneth Lawson and determined him to be at work at time of abduction"], ["TN0686", "04-28-2011", "Update", "Routine", "S L Lovelace", "SL Lovelace", "Attempted to contact Jimmy Pirtle. No answer message was left"], ["TN0705", "04-28-2011", "Closed", "", "S L Lovelace", "SL Lovelace", "Spoke to Rhonda Hatcher. Her ex-husband (James Jeffrey Hatcher, 1/23/1957, 232-80-0140) unk address in Unionville, TN may have known Holly Bobo through horse shows. Jeff Hatcher may have had involvement in murders of women in the past. May have a cabin at Tims Ford Lake. \n\n\n\nNote: If no local suspects are developed, Hatcher needs to be interviewed in Unionville, TN"], ["TN0701", "04-28-2011", "Closed", "", "S L Lovelace", "SL Lovelace", "Contacted Mr. Marley who verified the incident. Lebanon is not in the search area no follow up needed"], ["TN0671", "04-28-2011", "Update", "Routine", "S L Lovelace", "SL Lovelace/SAC John Mehr", "Met Delbert Ellis and he saw a suspicious w/m, 30 yoa, wearing a white shirt on 4/24/2011 in Natchez Trace near Pecan Tree @ Wiley. The male ran away when Ellis confronted him. I walked area with Ellis but wind damage had caused many areas to be inaccessible. \n\n\n\nPer SAC Mehr subject still needs to be located and interviewed"], ["TN0732", "04-28-2011", "Open", "Routine", "", "Telephone", "Update info rcvd 4/28/11 @1800pm from caller Tammy Chessor 731 592-8684 about orginal info listed in TN0730 (CLOSED). Update info states the place to look is Eagle's Nest @ Bob's Lake vice white Creek as 1st reported."], ["TN0733", "04-28-2011", "Open", "Routine", "", "Telephone", "Caller 'Dave' 603-627-7041 stated you will find Holly off I-40 exit 137 at the crossroads of Tennessee River Blue Creek Road and Daniel Road."], ["TN0390", "04-29-2011", "Closed", "", "", "", "Shawn Herdon. Officers spoke with Shawn Herndon at Tudena Restaurant on Main Street in Parsons, TN. Herndon stated he was in Texas at the time of Holly Bobo's abduction. Herndon works for GEA and his boss is Bobby Knollen (c) 281-224-6675. Herndon was staying with Charles Rook in Texas, å© 713-382-4169. Herndon has been out of town for the past 2 months. Two weeks working for GEA. He worked in South Carolina, Alabama, and Texas. Herndon was a student of Karen Bobo many years ago, but does not know the Bobo family. Herndon arrived in Scotts Hill, TN April 22, 2011. Herndon lives at 60 Walton Road, Scotts Hill, TN å© 731-733-8740. Herndon lives with Kamerou Hickerson and they have a 9 month old baby girl. Herndon stated he believes a man by the name of Kelly (brother of Jamey Kelly) could hurt Holly Bobo.\n\n\n\nKamerou Hickerson stated she believed the Dodd boy could be capable of hurting Holly Bobo because he has hit on women in the past.\n\n\n\nOfficers spoke with Bobby Knollen (GEA Power Cooling Superintendent) in Houston, TX and he verified that Herndon was in Houston, TX until April 21, 2011 and was at work the week of April 13, 2011 in Houston, TX.\n\nEvent closed by FBI SA Barhett and Pago."], ["TN0734", "04-29-2011", "Open", "Routine", "", "Telephone", "Caller Rosalie Smith 573-769-0229 stated that investigators need to check into Clint Bobo's gambling because he could have paid off his debts in exchange for his sister."], ["TN0734", "04-29-2011", "Closed", "", "", "", "Psychic lead?"], ["TN0735", "04-29-2011", "Open", "Routine", "", "Via Email SA from SA Harmon", "TBI FSSA Brock Sain (901-379-3457) stated that a friend of his dad saw two white females and one white male last Friday April 22, 2011 at approximately 4:30 pm at the BP station in Drummonds.  One of the females looked like Holly Bobo.  FSSA Sain stated that the BP has surveillance video."], ["TN0470", "04-29-2011", "Closed", "", "", "", "Corey Milam has been cleared as a suspect. Event closed by TBI SA Ferguson and SA White."], ["TN0736", "04-29-2011", "Open", "Routine", "", "", "SA McMurtrie spoke with Kristy Love, å© 931-994-9957, a hair stylist at North 40 Truck Stop, who advised that Kevin Allen, home address 389 Metalford Road, Hohenwald, TN, å© 931-306-9618 came into her shop and wanted a hair cut and said he was logging in the area and would check in later. Allen called later and wanted Love to come out to him   offered her $100 for a haircut. Love said no. Allen called again and made the same offer and stated, 'I know it probably sound weird, especially given that a girl has ended up missing around hereåÓ."], ["TN0737", "04-29-2011", "Open", "Routine", "", "", "Randy McGee, address 334 Tapestry Lane, phone (c) 731-549-7532, (w) 731-847-7183 advised that he was searching on 17 Apr 11 and found a Hickman County Newspaper dated the day before the abduction on Cox Road across the intersection on the left. Also on 17 Apr 11 he found a shovel on his property which was not there before. He turned this in to the Sheriff's Department. He also saw a full-sized sedan, burgundy at Shiloh Church on 16 Apr 11. It had two people in it wearing caps, after midnight they took off when they saw him. He has been looking for it again but hasn't found it."], ["TN0577", "04-29-2011", "Update", "Routine", "SA Joe Upton - FBI", "", "Corey Milam (number 9 on the list) has been cleared as a suspect and TN0470 has been closed by SA Faulkner."], ["TN0666", "04-29-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner."], ["TN0733", "04-29-2011", "Closed", "", "", "", "Psychic lead closed by TBI SA Faulknes."], ["TN0715", "04-29-2011", "Update", "Routine", "SA Scott Lawson - FBI", "", "William Patrick Pearson, DOB 03/31/1988, home address 458 Sunshine Circle, Scotts Hill, TN, å© 731-549-0990, was interviewed at his residence by SA Scott Lawson and TBI SA Kira Hayden. After being advised of the nature of the interview and the identity of the interviewing agents, Pearson provided the following information.\n\nPearson was a year behind Clint Bobo at Scotts Hill High School. Pearson does not really know Clint Bobo and never met Holly Bobo. Pearson received a message from a friend on the morning of 04/13/2011 telling him of Bobo's abduction. On the evening of 04/13/2011 Pearson went with Mason Applebee to Houston, TX to attend a concert. The name of the band is called Volbe. Pearson provided the following number for Applebee is 73-757-5858.\n\nPearson was unsure of the date of his return from Houston but believes it was on Friday 04/15/2011. Upon his return he assisted in the search for Bobo. He met with Jenny Fairweather and joined her family in the search effort. He believes he assisted in the search until 04/17/2011. Pearson could not think of anyone who would want to do Bobo harm."], ["TN0715", "04-29-2011", "Closed", "", "SA Scott Lawson - FBI", "", "Event closed by TBI SA Faulkner."], ["TN0690", "04-29-2011", "Closed", "", "", "", "Event closed by FBI SA Pierce."], ["TN0686", "04-29-2011", "Closed", "", "S L Lovelace", "", "Event closed by SA S.L. Lovelace."], ["TN0515", "04-29-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner. Information only."], ["TN0467", "04-29-2011", "Closed", "", "Det. Bartlett - FBI SSTF", "", "FB SSTF Page and Barlett attempted to call, but no answer and no voice mail. Event closed by TBI SA Faulkner."], ["TN0714", "04-29-2011", "Update", "Routine", "", "", "Perkins came in on 04/28/2011. Perkins was finger printed, DNA, Hair samples, and cell phone imaged. Keep open for information. TBI SA Faulkner."], ["TN0654", "04-29-2011", "Closed", "", "SA John Simmons - TBI", "", "USMS Boock advised Hill's mother was interviewed at her residence she stated that Justin moved to Bunkie, LA on 2/18/2011 and works for Michels Corporation as a welder. He has not been home since 02/18/2011. Justin's (c) 318-717-4580. Nicole Fye with the Michels Corporation in LA and she verified that Justin was there in Bunkie, LA on Apr 13/14 2011. Justin Hill is no longer a suspect. Event closed by USMS Boock.\n\nRandall Hill, father of Justin Hill, was interviewed at 450 Evanstown Road. He stated that Justin left Decatur County on 18 Feb 2011 for a welder job in Bunkie, Louisiana. Justin's employer verified that he was in Houston, TX working at the time of the abduction. Event closed by TBI SA Jackson."], ["TN0698", "04-29-2011", "Closed", "", "", "", "SA Scott Lawson interviewed Charter Cable Techs Joel Keeton, phone 731-549-4079, and Clint Morris, phone 731-733-0439. Neither recall anything suspicious on the date of the abduction in Parsons, TN. Event closed by SA Lawson."], ["TN0692", "04-29-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner."], ["TN0709", "04-29-2011", "Update", "Routine", "", "", "FBI SSTF Carroll and Barnes located what was believed to be the residence of Shane Hardison, 218 Box Drive, Darden, TN. Several attempts were made to contact someone at the residence with negative results."], ["TN0738", "04-29-2011", "Open", "Routine", "", "", "Jimmy Ray Potts: FBI SA Lawson identified 2301 Mount Lebanon Road, Decaturville, TN as being the residence of Potts parents. They were not at home but neighbor believes Potts has moved to Lexington. Tn."], ["TN0739", "04-29-2011", "Open", "Routine", "", "", "Accounting for road construction workers:\n\nFBI SA Viveros has checked last week on all Dement Construction Crew through Mark Post. SAC John Mehr has a list of sub-contractors that will be checked. All Dement workers were accounted for. No further action at this time. Event closed by SA Faulkner."], ["TN0740", "04-29-2011", "Open", "Routine", "", "", "Karen Bobo wants to make sure the information on a reddish/rust colored Chevrolet S10 pickup was seen driving fast and doing donuts at Five Forks the morning of the abduction. Jimmy Broadway and Frank Washburn advised that this was previously reported. FBI SA Pierce."], ["TN0741", "04-29-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Linda Mangrum (615)799-2939 said she was on a search team for Bobo on 04/25/11 between the hours of 9:30-2:45p.m. near a cave. The search leaders name was Flint. Ms. Mangrum stated Flint is a friend of Holly Bobo's brother Clint. Ms. Mangrum said, Flint acted weird and never stayed with the group. He wouldn't follow directions and didn't bag some duck tape he came across.  The other group leaders name was Jacob from Alabama and his group looked on one side of the road while Flint's group looked on the other side. Ms. Mangrum couldn't  remember the exact location of the search."], ["TN0742", "04-29-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Misty Bailey (731) 845-3524 at 5:40 pm on 4-29-2011.  Misty wishes to remain anonymous.  She stated that she works at Young's Touchstone in Lexington, TN.  She is calling about a temporary employee named Russell Rich.  Misty stated that on April 14, 2011, Mr. Rich left work early around 7:30am and has missed work several times since Holly Bobo went missing.  She said that  Mr. Rich claims to know Holly and her family and friends.  One of the things that he has said is that 'Holly did not like her motheråÓ.  He has also claimed to be in the search group that found duct tape with blonde hair attached.  Misty said that Mr. Rich told his co-workers this information before it came on the news.  She said that Mr. Rich lives in the Yellow Springs area."], ["TN0696", "04-30-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner. Information only."], ["TN0691", "04-30-2011", "Closed", "", "", "", "Event closed by SA Faulkner."], ["TN0706", "04-30-2011", "Closed", "", "", "", "Searchers have covered the area. Event closed by TBI SA Faulkner."], ["TN0511", "04-30-2011", "Closed", "", "", "", "Interview conducted. Event closed by TBI SA Faulkner."], ["TN0653", "04-30-2011", "Closed", "", "", "", "Event closed by FBI SA Champine"], ["TN0743", "04-30-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 0905am from a lady @ 615 772-3987 stating she spoke w/Linda Hamilton & Kelly Wallace @ Greens in Benton CO about searching for Holly and they went into the woods @ Ruby Drive in Benton Co near an old cemetery (Connolly) and found a cell phone charger and various other items that were turned into the Benton PD. Linda and Kelly spoke about an old truck being parked near the lake in that area and this was not normal because it's hard for people to come into the area without being noticed when they don't live there. The truck was an old Chevy S10 type truck that had being rusted out and maybe belonging to two men (Shane & Tank). The caller stated she remembers seeing a truck of this type parked at a dead end on 8th Street in Nashville TN. The caller states she has spoken w/agents previously about her visions and physic abilities and says feel free to call for additional info."], ["TN0643", "04-30-2011", "Closed", "", "", "", "Jason Nickell has been investigated in previous Lead. Event closed by FBI SA Champine."], ["TN0680", "04-30-2011", "Closed", "", "", "", "Event closed by FBI SA Champine"], ["TN0469", "04-30-2011", "Closed", "", "", "", "Not related, information only. Event Closed by TBI SA Faulkner."], ["TN0723", "04-30-2011", "Closed", "", "", "", "Related to Lead Number TN0196. Event closed by TBI SA Faulkner."], ["TN0732", "04-30-2011", "Closed", "", "", "", "Psychic lead related to Lead Number TN0730. Event closed by TBI SA Faulkner."], ["TN0532", "04-30-2011", "Closed", "", "", "", "Information only. Event closed by TBI SA Faulkner."], ["TN0560", "04-30-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner."], ["TN0566", "04-30-2011", "Closed", "", "", "", "SA Faulkner spoke with caller, who had no specific information. Property map checked and Volner does not own property near the Bobo's. Event closed by TBI SA Faulkner."], ["TN0574", "04-30-2011", "Closed", "", "", "", "Information only. Event closed by TBI SA Faulkner"], ["TN0737", "04-30-2011", "Closed", "", "", "", "Shovel and newspapers recovered and turned into Decatur County Sheriff's Office by Officer Jeremy  Pratt. Event closed by SA Ricky Inman."], ["TN0744", "04-30-2011", "Open", "Routine", "", "", "FBI IA Cathy Williams received a call from Beverly Hearn, home phone 731-668-8674, cell phone 731-343-0691, home address on Wallace Road in Jackson, TN. Beverly's sister-in-law, Pat Hearn, works at Jimmy D's in Jackson, TN. Prior to Holly Bobo's disappearance, Holly and her brother were at Jimmy D's for Karaoka (exact date unknown). It was reported that Holly and her brother got into a huge argument. Pat Hearn cooks and cleans at Jimmy D's. Pat Hearn's number is 731-584-7018, or 731-694-1504. Jimmy D's is located in the Hamilton Hills Shopping Center in Jackson, TN near O'Charley's Restaurant."], ["TN0606", "04-30-2011", "Closed", "", "", "", "TBI SA Jeff Jackson interviewed Michael Lumley, phone (c) 731-549-7140, phone 731-847-7409, who advised he got to work at 07:00 and got a call at 09:00. He used to ride 4 wheelers all the time with Holly and Drew. Event closed by SA Jackson."], ["TN0709", "04-30-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner."], ["TN0744", "04-30-2011", "Closed", "", "", "", "TBI SA Faulkner spoke with Pat Hearn at 731-694-1504. She stated that at least 5 or 6 months ago Holly and Clint were at Jimmy D's in Jackson, TN and got into an argument because Holly did not want to leave. They talked and later left together. No other problems that she is aware of. Event closed by SA Faulkner."], ["TN0745", "04-30-2011", "Open", "Routine", "", "", "Dylynn Burton provided information that she had a message on her answering machine from April 18th. The message was from Francis Maness and indicated that her son talked to one of the people who had been interviewed and was told that Holly Bobo was in a box covered with concrete."], ["TN0745", "04-30-2011", "Closed", "", "", "", "TBI SA Faulkner spoke with Bobbie Maness at 731-968-5743, address 985 Wilderville Road, Widlerville, TN. He stated that he rides horses at Natchez Trace and had heard a rumor that Holly was in a room or box under concrete. No one told him that directly. Event closed by SA Faulkner."], ["TN0746", "04-30-2011", "Open", "Routine", "", "", "William Candler pawned his red Dodge pickkup at 191 Salvage Yard for $500 on 30 Apr 11. He told the salvage yard he needed the or would have to serve 11/29."], ["TN0746", "04-30-2011", "Closed", "", "", "", "TBI SA Cathy Ferguson spoke with Candler who stated he pawned his truck for $500 because he had fines and court costs to pay in Benton and Henderson counties. His father, William Austin, bought the truck for him 1 or 2 weeks ago. Candler's TDL is suspended due to unpaid traffic tickets. Candler did not know Bobo. He was at home the morning of the disapperance. Candler can be reached at 731-733-0751, or 731-441-7311. Event closed by SA Ferguson."], ["TN0736", "04-30-2011", "Update", "Routine", "", "", "FBI SA Jeff Dale telephoned Kevin Allen at 931-306-9618 and asked if he knew of any logging which was being done in the Parsons area. Allen advised he was working for Tim Carroll Custom Logging; phone 615-418-2094, near I40/Camden/Parsons area near Natchez Trace Park. Allen only worked for Carroll for a couple of weeks because the drive from Hohenwald was too far. Allen had been driving his wife's BMW to and from the job site. Allen and a couple of co-workers searched a couple of cabins near their logging site and found no evidence of anyone just after the abduction.\n\nNOTE: Suggest follow up with Tim Carroll to determine the employment status and whereabouts of Kevin Allen on 13 Apr 11."], ["TN0738", "04-30-2011", "Update", "Routine", "", "", "FBI SA Derek Edwards and Jeff Dale attempted to contact Jimmy Potts or parents with negative results. No one home at parents residence. A neighbor advised Jimmy Potts works for TVA, he thinks out of state.\n\nNOTE: Suggest attempt to recontact Potts parents or determine why he is beleived to be a person of interest."], ["TN0742", "04-30-2011", "Update", "Routine", "", "", "FBI SA Dale and Edwards interviewed Misty Bailey, 349 Crawford School Road, Decaturville, TN 38329, phone 731-845-3524 at her residence. Also present was Patrick Byrd, 420 Craig Road, Sardis, TN 38371, phone 731-858-2527. Both Bailey and Byrd are suspicious of Russell Rich, 57 Melton Lane, Parsons, TN 38363, TNDL 106396183, DOB 10/25/1989. Rich works with Bailey and Byrd at Young and Touchstone Radiators, 1000 Young Drive, Lexington, TN, phone 731-968-3617. On 04/13/11 around 09:00 Bailey overheard Rick say to Byrd that he was cousins with Bobo. Byrd and Bailey do not know what time Rich arrived to work on 04/13/11. Rich has been absent a lot since the Bobo Abduction. The Human Resources Person at Young and Touchstone Radiators is Elizabeth Dunn, phone 731-967-7722 and she can be reached on Monday. Dunn may be able to provide the time that rich arrived to work on 04/13/11.\n\nNOTE: Follow up with Elizabeth Dunn\n\nNOTE: PROTECT THE IDENTITY OF BAILEY AND BYRD."], ["TN0455", "04-30-2011", "Closed", "", "SA Greg Elliott and SA John Simmons - TBI", "", "Grafton Dodd, phone 549-0304. April 30, 2011 TBI SA Jackson and Walker received permission from Mr. Dodd to search the camper trailer. No evidence was found. Event closed by SA Jackson."], ["TN0584", "04-30-2011", "Closed", "", "", "", "Event closed by TBI SA John Simmons."], ["TN0389", "04-30-2011", "Update", "Routine", "", "", "TBI SA John Simmons and SA Booth met with Jerry Gilbert, MW/DOB 09/03/1939 an his home at 986 Beacon Road, Parsons, TN. Mr. Gilbert said he has a son named Jerry Gilbert who is about 40 years old. His son's cell number is 731-733-8050. His son works at Magnatech in Lexington. His son was interviewed by a male and female FBI Agents at the fairgrounds a week to a week and a half ago. \n\nNOTE: Need to determine if Jerry Gilbert, Jr has actually been interviewed."], ["TN0727", "04-30-2011", "Update", "Routine", "DTF Agent Dennis King - 24th Judicial Drug Task Force", "", "TBI SA John Simmons called 731-852-2214 on 30 Apr 11 and got a message that Dr. Jennings office is closed. This number should be attempted again during weekday business hours."], ["TN0685", "04-30-2011", "Update", "Routine", "", "", "FBI SA Champine called Myers telephone number 423-622-8095 and got no answer or answering machine after multiple attempts.\n\nNOTE: Send agent to Myer's address in Chattanooga."], ["TN0747", "05-01-2011", "Open", "Routine", "", "", "FBI SA Jason Bilnoski received information that on Wednesday 13 Apr 11 at approximately 03:00 Sammy Hayes, MW/51 tried to open the door of Anlie Livinth at 1125 Highway 114, Scott's Hill, TN. Her husband ran Hayes off and called Scott's Hill Police. Hayes was detained and released to his parents in Scott's Hill. \n\nNOTE: Investigation needed to determine if Hayes may be involved with Holly Bobo abduction."], ["TN0736", "05-01-2011", "Update", "Routine", "", "", "FBI SA E. Toms contacted Tim Carroll by phone (615-418-2094) 1507 Hohenwald, TN who accounted for the whereabouts of Kevin Allen and other logging employees. Mr. Carroll stated he would check 'Load Sheets'for his logging company on 2 May 11 and advise who was working on 13 Apr 11. Carroll denied any strange behavior of employees.\n\nKEVIN ALLEN, MW/DOB 12/13/1970, TNDL 068635624, address 389 Metal Ford Road, Hohenwald. Phone 931-796-2573.\n\nTIM CARROLL, address 1697 Hohenwald, TN. Phone 931-796-4154."], ["TN0748", "05-01-2011", "Open", "Routine", "", "", "Henry Higdon (Higdon's Sewer Service) is Suzanne Prattis father. Suzanne is Holly's classmate. Phone 731-847-7649, address 931 Jeanette Holladay Road. FBI SA Pierce reports that on 28 Apr 11 Karen Bobo was searching for Holly and ended up at Henry's property. Henry reported that 1 or 2 weeks before Holly went missing, Kathy Wise hired him to pump out her septic tank, even though it wasn't broken. While there Kathy complained a lot about Dana and the Bobo family. Holly's uncle is an expert in septic tanks and reports that it is extremely unusual to pay several hundred dollars to have this done for no reason, particularly by a woman. He looked it up and reports that Kathy Wise just had this installed 2 years ago. Septic tanks only need to be cleaned out every 20 years or so. Holly's uncle, Vaughn Duncan (731-549-6462) has offered to attest to this if needed for any reason (i.e. search warrants, ect.) Henry has offered to pump Kathy, or James', or anybody's tank again for free if assistance is needed in checking these."], ["TN0749", "05-01-2011", "Open", "Routine", "", "", "Karen Bobo: Bobo family reports the woman and child living with James Barnes has never been seen out there before Holly went missing. Since she's been gone the woman and child have been 'brought in'and are often seen outside. Kathy Wise is outside every single day watching the Bobo's. They have seem them out often at night since Holly went missing, looking around with their flashlights."], ["TN0750", "05-01-2011", "Open", "Routine", "", "", "FBI SA Pierce stated Karen Bobo advised that Cody Ward works at Mike's net+60/Quick Mart in Lexington. He also goes to JSCC. He got really upset with Holly less than a year ago when she wouldn't talk to him. He 'creeped her out really badåÓ. As recently as 5 or 6 months ago he was hounding her about why she would not talk to him on facebook. He has made nasty comments about her, no threats. Reportedly has a history of being aggressive and obsessive with his high school girlfriend, per Clint's girlfriend Alicia Cosisco (spelling). Cody Ward's phone is 731-307-7267. Cody is also known to hang out at the WalMart parking lot, according to LE/Ricky Inman. Holly has been seen there with a dark headed girl.  Cody could be friends with Ben Steele, who has previously been reported and could fit the suspect description, per Clint. Also, Ben was hanging out with Jonathan Dodd on Saturday night (per Dodd's facebook)"], ["TN0751", "05-01-2011", "Open", "Routine", "", "", "FBI SA Pierce reports that Clint Bobo advised that Tony Calabrese claims to be from Liverpool, Ohio. He has been making sexual comments on Holly's facebook pages that indicate he is involved with LE. He made a comment today stating that LE had a new lead that sent them to Henderson County. He has been making comments that let the public know every step LE has been making."], ["TN0752", "05-01-2011", "Open", "Routine", "", "", "FBI SA Pierce reported that Clint Bobo advised that Barry Allan claims to be from Camden, TN. He made several comments on Holly's facebook pages. He sent family friend Dlynn Borten a friend request and a message on facebook, then retracted the friend request. Clint states he looked familiar."], ["TN0753", "05-01-2011", "Open", "Routine", "", "", "FBI SA Pierce reports that Clint Bobo advised that Timmy Clenney may have driven by our house before 08:00 on 13 Apr 11. He is a teacher/coach and drives a blue Ford Ranger, extended cab, 4 wheel drive, 2006 or later model."], ["TN0754", "05-01-2011", "Open", "Routine", "", "", "FBI SA Pierce reported that Clint Bobo advised that he got a facebook message from Nancy Miller, who indicated that she went to school with him. He doesn't remember her, or knew which school she meant. She reported that Bobby Cornelious has preyed on young girls in this area. He used to rape young girls and tell them that if they told anyone he would kill them. He took Nancy and her brother Nate and showed them shallow graves where he claimed he'd buried kids that told. He used to live in Paris, TN, but Nancy's grandfather left him a spot of land and a mobile home across the road from the BP station on Highway 412 in Perryville, TN.\n\nNOTE: Handwritten account from Clint Bobo attached to file."], ["TN0507", "05-01-2011", "Closed", "", "", "", "Informational purposes only. Infromation from Erin, TN. Event closed by TBI SA Lewis."], ["TN0592", "05-01-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Informational purposes only from Centerville, TN. Event closed by TBI SA Lewis."], ["TN0743", "05-01-2011", "Closed", "", "", "", "Psychic lead. Event closed by TBI SA Lewis."], ["TN0740", "05-01-2011", "Closed", "", "", "", "Event closed by TBI SA Lewis."], ["TN0747", "05-01-2011", "Update", "Routine", "", "", "Sammy Hayes: FBI SA Wes Mayes and Chris Miller did a neighborhood canvass in relations to the Sammy Hayes incident to determine if Hayes had attempted to enter any other people's homes. Agents went to 1150 Highway 114 S, Scotts Hill and spoke with Bobby McPeake MW/DOB 08/04/1956, phone 731-549-3617, who advised he was not at home the morning of 13 Apr 11.\n\nAgents went to 1090 Highway 114 S. Scotts Hill and spoke with Stacy Lynn Clendenon, FW/DOB 03/27/1980, cell phone 731-733-8087. She was not home on the day of the incident.\n\nNOTE: Canvass of other neighbors needs to be done."], ["TN0747", "05-01-2011", "Update", "Routine", "", "", "FBI SA Adams and Simpson investigated the movements of Sammy Hayes on 13 Apr 11. Sammy was at his daughter's house until approximately 03:00 when she kicked him out. Sammy started going to houses to borrow money and police were called. The police took Sammy to his parent's house and left him. Sammy's parents left the house at approximately 07:00 and Sammy was still there asleep. Sammy called Robert Berberett, who lives at 121 Hughes Road in Scotts Hill to come and pick him up and take him to a diner where his truck was. Berberette picked up Sammy between 09:00 and 10:00 and took him to get his truck. Sammy went to church on Wednesday night and got money for gas to go to Memphis. He arrived in Memphis and passed out at a convenience store. An ambulance was called and took Sammy to Baptist East in Memphis where he remained for 1 å_ weeks. Sammy is currently at his brother's house, Eddie Hayes, 3631 Tiffany Oaks, Bartlett, TN.\n\nNOTE: Need follow up contact with Robert Berberette."], ["TN0752", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Closed-facebook info"], ["TN0751", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Facebook Info"], ["TN0741", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Flint Perkins intel"], ["TN0749", "05-02-2011", "Closed", "", "", "SA Mark lewis", "Close-Barnes intel"], ["TN0714", "05-02-2011", "Closed", "", "", "SA mark Lewis", "Close-Flint Perkins intel"], ["TN0619", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Jason Nickells Intel"], ["TN0632", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Information only"], ["TN0598", "05-02-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "SA Mark Lewis", "Close-Barnes Intel"], ["TN0555", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Dodd Intel"], ["TN0538", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Jason Nickel Intel"], ["TN0473", "05-02-2011", "Closed", "", "", "SA Mark Lewis", "Close-Dodd Intel"], ["TN0487", "05-02-2011", "Closed", "", "", "SA mark Lewis", "Close-Dodd Intel"], ["TN0312", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Nickels intel"], ["TN0453", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Dodd intel"], ["TN0263", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Nickell intel"], ["TN0280", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Dodd Intel"], ["TN0192", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Nickell intel"], ["TN0256", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Dodd Intel"], ["TN0103", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Dickson lead intel"], ["TN0186", "05-02-2011", "Closed", "", "", "", "Close per SA Lewis-Dickson lead intel"], ["TN0778", "05-03-2011", "Open", "Routine", "", "", "Rebecca Conrad advised in November 2010 she lost her Motorola Raser Cell Phone.She last had her phone when she was at the Oakdale Funeral Home on Hwy 69 in November 2010.She was transported from Funeral home to Decatur County General Hospital where she remained for 2 days.She realized that her phone was missing a couple of days after she was transported to Decatur County General. Dennis and Rebecca Conrad has an address of 3885 Hwy 192 Holiday,TN.\n\n\n\nDennis Conrad Phone# 731-584-6156\n\nRebecca Conrad Phone# 731-220-0597"], ["TN0742", "05-03-2011", "Closed", "", "", "", "SA Jason Cardone (FBI) met with Elizabeth Dunn at her place of employment, Young Touchstone. Dunn provided a copy of timecard report for Russell Rich. Time card showed \"in\" and \"out\" timestamps as well as absences. Timecard shows \"in\" (0700 a) and \"out\" (3:30p) with lunch (11:30a-11:58a), with unpaid absences on 4/14/11 (7.25 hrs), 4/22 (8 hrs), and 4/28 (8 hrs)."], ["TN0755", "05-03-2011", "Open", "Routine", "", "R Pierce FBI", "R Pierce (FBI) received information from Karen Bobo that Corey Milam 731-614-7716 and son of Tina Crews 731-614-3765 stated that Brandon \"Bubba\" Wood physically saw Ben Steele and Jonathan Dodd the morning of the abduction. Unknown what time or where. Corey Milam met Ben Steele at JSCC. Ben dated Laura Jones who graduated with Holly. Ben's number is 731-602-0505."], ["TN0738", "05-03-2011", "Closed", "", "", "", "On 5/2/11, SA Faulkner spoke with TVA Police Mike Walker (256) 386-2001. Jimmy Ray Potts is working with a private contractor through Hinckles and McCoy and according to work records he was at work at the Colbert Steam Plant in Alabama on April, 13, 2011."], ["TN0754", "05-03-2011", "Closed", "", "", "", "Open source and DL checks by IA Cathy Williams revealed a Robert Farr Cornelius IV, of 200 Shell Lane, Decatur, TN. Clint Bobo advised initially he did not know Nancy Miller and she randomly posted to his Facebook account (per SA Mark Lewis, TBI). Criminal history negative for sexual/abduction type offenses."], ["TN0736", "05-03-2011", "Closed", "", "", "", "SA McMurtrie (FBI) talked with Tim Carroll. Mr. Carroll said they were working north of I-40 and all his people were on time and no one was missing from work on 4/13/2011."], ["TN0727", "05-03-2011", "Closed", "", "DTF Agent Dennis King - 24th Judicial Drug Task Force", "", "On 5/2/2011, SA Faulkner spoke with Dr. Jennings by cell phone at (731) 343-5029. He stated he saw the 4 wheeler with a white male and female. The female was blonde but did not recognize her as Holly Bobo. He called in because they were wearing dress clothes not clothes to be riding 4 wheelers with. He also stated he met a Sheriff's department car and they should have seen the 4 wheeler."], ["TN0671", "05-03-2011", "Closed", "", "S L Lovelace", "", "Information only."], ["TN0668", "05-03-2011", "Closed", "", "", "", "Intelligence Only"], ["TN0747", "05-03-2011", "Update", "Routine", "", "", "On 5/2/11, Katherine Walker and Miguel Acosta of the FBI spoke with Robert and Linda Berberette at their residence. Robert stated on the morning of 4/13/2011 he received a telephone call from Roy Hayes (Sammy's father) to check up on Sammy at the Hayes' residence around 8:30 am. Robert went to Sammy's residence and noted no vehicle and no one answered the door. He called Roy to verify Sammy's location. Roy stated vehicle was at Jessica's house (Sammy's daughter) and Sammy is at the residence. Around 10 am, Robert entered the residence and found Sammy in the back bedroom and \"seemed out of this world\"."], ["TN0720", "05-03-2011", "Closed", "", "", "", "Information only."], ["TN0368", "05-03-2011", "Closed", "", "", "", "Dodd Intel"], ["TN0365", "05-03-2011", "Closed", "", "", "", "Dodd Intel"], ["TN0504", "05-03-2011", "Closed", "", "", "", "Informational only"], ["TN0543", "05-03-2011", "Closed", "", "", "", "Information only regarding break ins."], ["TN0393", "05-03-2011", "Closed", "", "", "", "Dodd info"], ["TN0401", "05-03-2011", "Closed", "", "SA Brent Booth", "", "SA Walker contacted John William Turner at his home at 170 Eastwood, Parsons, TN on 5/2/2011. Mr. Turner states he was interviewed by Savannah and Decatur County deputy 4/13/2011. Turner was the victim (Bobo's) 10 and 11 year old softball coach. States his room mate Jared woke him up and told him of Bobo's disappearance. Jared confirmed this information. Used to live at 430 Swan Johnson Road. Child still live in near proximity to Bobo family. He was located by SOR searchers at children's house. Went there to have locks changed."], ["TN0753", "05-03-2011", "Closed", "", "", "", "FBI Chris Miller and Joe Upton made contact with Timothy Clenney at middle school near Decaturville on 5/3/2011 at 11:45 am. Clenney advised he left home at 6:45 am en route to school on 4/13/2011. He did not see anything unusual for vehicle traffic or activity in the area."], ["TN0756", "05-03-2011", "Open", "Routine", "", "", "REceived called from Jeanee Moore (731) 845-5336 who stated she works at a convient store in Lexington and she wanted to report some strange behavior regarding one of the regular customers. Ms Moore stated that Casey Jowers is a regular customer and he has told her he is a good friend of Clint's and Clint has not been seen since the abduction. Ms Moore stated that it felt like Casey was trying to weigh the conversation towards Clint being guilty. Ms Moore also stated that during the conversation they got on the subject of German Sheppards (she raised them). Ms Moore stated that she said if the Bobo's had a german sheppard noone would have been able to take Holly and when she said that Casey said something in the contrary and gave her a very strange look. Ms. Moore stated Casey works at NCI in Lexington and he may be worth checking out."], ["TN0747", "05-03-2011", "Closed", "", "", "", "SA Dycus is in possession of recent interviews and phone information of Hayes which excludes him; however, the information is too large to put into the VCC."], ["TN0234", "05-03-2011", "Closed", "", "SA Colleen McEachen - TBI", "", "No additional information on suspect. Fax never received at HQ by LEIC Purviance. Hickman County has report."], ["TN0660", "05-03-2011", "Closed", "", "", "", "SA Faulkner spoke with Mike via cell phone (901) 598-5360 on 5/2/11. Mike stated he called in the lead because he knew Gary Atkins for about 10 years. Atkins lives in Lincoln County near Fayetteville, TN. Atkins had recently gotten out of the mental hospital. The reason for concern was that Atkins had killed some dogs. Mike knew nothing of Atkins having a history of rape, kidnapping or murder. Atkins cell number is (931) 993-5743. SA Bill Green ran the number through the cell dump records and it did not show up in the records. \n\nOn 5/3/11, SA Faulkner spoke with Lincoln County Sheriff Blackwelder. He advised the subject was Gary Askins not Atkins. He was familiar with Askins but he had no history of rape, kidnapping, etc. Later Sheriff Blackwelder called back and advised Askins left Lincoln County and was supposedly in Montana and Idaho hunting around April 13, 2011. Askins drives a white Nissan Xterra covered in bumper stickers and sawblades that would stand out and be very noticeable."], ["TN0506", "05-03-2011", "Closed", "", "", "", "Refer to lead TN391. Same information."], ["TN0391", "05-03-2011", "Closed", "", "", "", "SA Joe Walker along with SA Brent Booth, four FBI Agents and Inv. Inman from DCSO searched Austin's home, ran cadaver dogs through his house and his camo clothing with no attraction. The dogs were from Shelby County and were trained to alert to bodily fluids. The only items they alerted to was a sock in Austin's bedroom closet he had apparently masturbated into. Austin has no mode of transportation. His mother must carry him to work. Austin was in a terrible motorcycle accident and his balance is messed up."], ["TN0757", "05-04-2011", "Open", "Routine", "", "TBI Find Line", "Barbara Millhorn (731) 616-2366 called in reference to an individual that made a comment 2 1/2 weeks ago. She stated Anthony Kothe made a comment that Holly was at the Tubbs Sawmill. She stated he lives close to the Bobo Family. She said she didn't think anything about it at the time but decided to call in today."], ["TN0758", "05-04-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller Tammy Barron can be reached at (713)413-2820. Caller stated she is nursing student. Her (2)daughters both attend UT Martin. Caller stated that on Facebook \"Todd Casey\" tried to be-freind one of her daughters. Caller stated that Todd constantly changes his location on Facebook and his activities and interests. He at one time was in to \"Nursing\" but has changed to something else."], ["TN0716", "05-04-2011", "Closed", "", "SA Brent Booth", "", "Larry Mullins, DHS, Spoke with Tracy Loving, 615.691.7665. Loving stated he's already been interviewed by TBI Mike Cox and the last time he was at the Bobo's residence was April 1, 2011."], ["TN0758", "05-04-2011", "Closed", "", "", "", "Facebook lead closed. Processing by TSU."], ["TN0634", "05-04-2011", "Closed", "", "", "", "On 05.03.2011, SA Faulkner and WA Walker located Michael Huddleston and spoke with them in Perryville.Huddleston stated that he had never seen or met Holly Bobo, but some of his customers at the River Bar knew her dad and had been talking about Holly being missing. On April 13th, he was at home by himself until about 2:00PM when he got up and carried four cases of water to Bible Hill Church. Someone had called and told him the searchers needed water. Mike Huddleston, 69 Waller Lane, Parsons, TN, cell 901.859.8674, DOB 08.28.1973, 415.51.9964, Silver Chevrolet Z71 pickup TN Wildlife tag 3204."], ["TN0688", "05-04-2011", "Closed", "", "", "", "On 05.02.2011, SA Faulker called John Murphy and asked him to send the picture of the female he was chatting with. On 05.04.2011, SA Faulkner received a copy of the pictures from John Murphy. The pictures were reviewed by SA Faulkner, SA Dicus, and SA Lewis and the pictures are not of Holly Bobo. John Murphy lives in Columbus, Ohio."], ["TN0759", "05-04-2011", "Open", "Routine", "", "", "Gary Zeznnaski, 105 Gaines Hidden Valley Lane, Holladay, TN 38341, cell 731.549.0962, home 731.847.3203, DOB 07.26.1965. Zeznnaski owns a farm located south of I40 and west of Hwy 69. His farm has 26 ponds on it. He advised that a Tennessee Game Warden came by and asked if they could search the ponds. Zeznnaski is willing to allow his property to be searched."], ["TN0759", "05-04-2011", "Closed", "", "", "", "Closed, information only"], ["TN0550", "05-04-2011", "Closed", "", "Det. Bartlett - FBI SSTF", "", "SA Joe Walker spoke with Grant Adams by telephone at 731.307.0899. He stated he met Holly about 2 years ago at Jackson State Community College. He became friends on Facebook about 4 months ago. Noticed Holly changed her profile picture often. Always new people in picture. Grant is a high school student at Lexington High School. Contacted school resource officer, Sgt JP Melton, at 307.8306. He verified Grant was at school at 8AM but checked out after 10:30AM."], ["TN0384", "05-04-2011", "Closed", "", "", "", "Close-Dodd intel"], ["TN0383", "05-04-2011", "Closed", "", "", "", "Close-vehicle description"], ["TN0665", "05-04-2011", "Closed", "", "", "", "Close - information only. No contact information for follow-up"], ["TN0685", "05-04-2011", "Closed", "", "", "", "On 05.04.2011, ASAC Skip Elrod and SAC Dennis Daniels spoke to Mr. Bob Myers in Chattanooga and conformed that he does own property near the Bobo residence. He has not been there since Nov 2010 and has given no one permission to hunt. No further information."], ["TN0514", "05-04-2011", "Closed", "", "", "", "Per SA Ronnie Faulkner, phone number is a prepaid Verizon number. There has been no more recent text messages. Unknown if this is related to the Holly Bobo case."], ["TN0760", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website \n\nHello,\n\nI recently sent you a tip telling you of areas I was drawn to near 2085  Beacon Rd (Co Hwy 1735) and  also near Dixie Mills .This area shows to be only 14 miles from Holly's home. I went back onto Google map today to Beacon Rd to see what other thoughts may  come to me about where Holly may be  and I found this abandoned shack that I feel should be searched only because when Holly 1st went missing I did get  thoughts of a man having Holly in an old shack . I also felt thoughts about the area 1412 Beacon Rd.\n\nIf you  click on the 2201Beacon Rd. Link below and a pic of this shack and its location on the map should come up. This shack is not far from the area I sent you in my first email on >>> <JPNICKS@aol.com> 4/25/2011 5:14 PM \n\n \n\nHope This Helps \n\nJpnicks@aol.com"], ["TN0761", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nThis is the last thing I will say on this subject I am one of the Psychics who contacted you. I believe I did so on 4/21/11 with regards to Holly Bobo. I stated this man went due North with her in an all terrain vehicle. I didn't e-mail you again about him/her.\n\nHere is the rest of what I have to say on this subject. When he left her home, he took a Highway & went North for a short distance, then he took a Highway and headed South,drove for about 58 miles and then proceeded to head East and circled to the North again.\n\n His last stop he made was at a Dam in Hardin Co.,TN. on the Northside. He had access to camping equiptment, fishing gear and a small boat. \n\nI am sensing she is not alive, I sensed this a couple of days ago,\n\nI have no more to say.I will not bother You again.\n\nThank You,\n\nNancy Porter"], ["TN0760", "05-04-2011", "Closed", "", "", "Email to TBI Website", "Psychic Lead"], ["TN0761", "05-04-2011", "Closed", "", "", "Email to TBI Website", "Psychic Lead"], ["TN0762", "05-04-2011", "
