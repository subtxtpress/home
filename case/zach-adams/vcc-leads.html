["TN0052", "04-16-2011", "Update", "Routine", "Oneonta Alabama Police Department", "Called Oneonta AL PD", "LEIC Allen spoke with dispatch and requested to speak with Investigator Latta. Dispatch is attempting to reach him in regards to this lead."], ["TN0027", "04-16-2011", "Closed", "", "TBI", "talked with LEIC Purviance", "checked facebook page-no information located"], ["TN0027", "04-16-2011", "Closed", "", "", "", ""], ["TN0034", "04-16-2011", "Closed", "", "Perry County Ohio Sheriff's Department", "Called Perry Co. Ohio SD", "LEIC Allen spoke with Dispatcher Howell with the Perry County Ohio Sheriff's Department. Dispatcher Howell advised the body had been identified as being Laura Chevalier of Roseville, Ohio."], ["TN0046", "04-16-2011", "Closed", "", "", "", "no additional information"], ["TN0037", "04-16-2011", "Update", "Routine", "", "Called Tipton County SO", "LEIC Allen has possibly identified the subject as being Shane Hopper DOB: 09/15/1973. His address is 104 Willow Point in Lexington, Tennessee. His point of contact on his Tipton County booking record is his mother, Margaret Fry (731) 602-0005. DL Photo and CCH available at TBI HQ"], ["TN0047", "04-16-2011", "Closed", "", "", "", "no additional information"], ["TN0052", "04-16-2011", "Closed", "", "Oneonta Alabama Police Department", "Call from Invs. Latta OPD", "LEIC Allen spoke with Investigator Latta. He advised that they have been unable to locate the victim of this incident. They received the information through messages that were being posted to the internet by members of their community. At this time they do not have any specific information regarding the subject. Advised they will contact TBI back with any further information on the case."], ["TN0058", "04-16-2011", "Closed", "", "", "", "Incident occurred in Northern States"], ["TN0117", "04-16-2011", "Open", "Routine", "", "Phnoe call", "4/16/11 approx 1135 LEIC Bryson rcvd a tip from a caller at 407 319-0574 about a Doug Saul who is on a face book blog (prime news) talking about the missing person Holly Bobo and how he hates women. He states she has a 2nd boyfriend and that is who she ran away with and not the 1st boyfriend. She is embarrassed because he is older and a friend of the family. This is what happens and young girls do this because it is like eloping. They make it seem like abduction so the parents are on the wrong track, and I'm sure she is fine. Girls do this all the time to disobey parents and this is what happened."], ["TN0119", "04-16-2011", "Open", "Routine", "LEIC C. Purviance", "1-800-TBI-FIND", "Debbie Harris, (731)676-7053 c,731-287-1369 h, advised that a Glen Adams was posting on site concerning missing Bobo. Caller was concerned because of some statements on his site. Caller advised he had listed that he was a fireman, woodsman, hunting, hiking and gravedowser on his facebook.  He has a blog on Glennindawson.blogspot.com. SAC Powell requested that LEIC Purviance review his facebook and blogspot for any pertinent information."], ["TN0053", "04-16-2011", "Closed", "", "LEIC Amy Allen - TBI", "", "LEIC Allen has located information in CLEAR showing the phone number is a landline and belongs to a Lee Wright at 200 N Lovekin Blvd, Blythe, CA 92225. Call being closed per SAC J Powell"], ["TN0118", "04-16-2011", "Closed", "", "", "", "Lead followed up on and determined lead/tip complete."], ["TN0125", "04-16-2011", "Open", "Routine", "", "FBI Mychell Mitchell", "Anthony (the cousin of the victims father) called in to the FBI stating there's a parade in Holladay TN today across the road from the search area. Anthony's friend, Wayne Holliday is at the parade and noticed an old abandoned house that has been empty for a long time. But sometime within the last 5 days, new plywood boards have been nailed up on the windows that weren't there before. Thats all the information he had, no #'s or anything."], ["TN0109", "04-16-2011", "Closed", "", "", "", "SA Frizzel met with Michael Sanders JR. of 2210 Oak Circle in Franklin, TN at approximately 2:45-3:00 am on 4/16/11 in regards to the FB posting. SA Frizzel stated Mr. Sanders thought the posting was funny. Mr. Sanders was advised of the situation and see the posting is not funny."], ["TN0120", "04-16-2011", "Open", "Routine", "", "", "LEIC Stanfill took a call on 4-16-2011 at 12:50 pm from Beth Higdon ph. (731) 549-7764.  Beth stated she has a friend who has been searching for Holly.  This friend wanted to remain anonymous and asked Beth to call TBI.  Beth stated that her friend got suspicious of some boys (near Holly's age) who live in the area being searched because he did not see them helping in the search.  The boys live near Pugh Rd in the Yellow Springs area.  One of the boy's names is Cory Williams.  Beth stated that he is known to use drugs and has been seen with Holly in the past.  Beth said that the Father of the boys owns a Saw Mill and owns several vehicles. \n\nBeth stated that her friend told her that he has seen drug paraphernalia and portable meth labs in the area near where some of the evidence has been found."], ["TN0092", "04-16-2011", "Update", "Routine", "", "", "SA Doug Pate spoke with Jeffery Krider at 1590 Brodies Landing Rd, Parsons, TN. He was at work at Kolpak from 0515-1430 on Wednesday April 13, 2011. His son Michael McCall lives at address also but the son is not suspected. There is a hunting cabin behind the property on Brodies Landing owned by Bobby Swindle. This property is being checked out by Decatur Co SO per Decatur 911."], ["TN0115", "04-16-2011", "Update", "Routine", "Missouri Highway Patrol", "Call from Trooper Patterson", "Trooper Patterson called back and advised that he had spoken with the manager Karen Swanson (417) 226-4686 and that only the owner had access to the cameras. She would be contacting him to see if he could check the tapes."], ["TN0059", "04-16-2011", "Update", "Routine", "", "", "LEIC Allen located information on Paul Winklebleck on AMW.  Below is the link to his story. Subject is still at large per the AMW website.\n\n\n\nhttp://www.amw.com/fugitives/case.cfm?id=71863"], ["TN0130", "04-16-2011", "Open", "Routine", "", "Email to Kristin Helm PIO", "PIO Kristin Helm received an email from and individual by the name of Darlene Geary, email address brgeary@sbcglobal.net. The following is the message of the email.\n\n\"Hello, My name is Mrs. Geary. I live in CA. I don't know if this will help or not but I wanted to share with you a dream I had about a girl that looked just like Holly Bobo. I had this dream at least a year or more ago. \n\nA girl, which fits Holly's description, was stolen from her house. She was taken and kept in a hidden cave by a body of water. I saw a beach line also. She was stolen for human trafficking. I remember the name Holly and this girl looks just like the girl in my dream. \n\nI hope you find her safe and I will be praying for her safe return to her family. I have never met Holly or her family but I have lost a child and it's heartbreaking.\"\n\nPer SA Mark Lewis this lead can be closed."], ["TN0121", "04-16-2011", "Open", "Routine", "", "Phone call", "4/16/11 approx 1:12pm LEIC Bryson rcvd a phone call from Nancy Nelson 580 862-7691(H), 580 862-7692 a school teacher of 38 yrs and she states that last night while praying she had a vision of a trailer (light in color, w/a slightly dark roof) sitting on a slight incline between some trees cut out just for the trailer. On the back side of the trailer was a freshly planted tree on the south side and in that same area was a freshly dug hole near the skirting of the trailer that lead under and behind the skirting back into the trailer and she feels she may be inside or in the hole outside near the skirt of the trailer."], ["TN0127", "04-16-2011", "Open", "Routine", "", "Search Team", "Search team dog hit on an area around 2051 Yellow Springs Rd which is a cabin. Vehicle at location had TN Tag 754-FZZ. Owner of vehicle is a Paul Baswell,DOB: 10/09/1970 and SSN of 435-27-9143, W/M, TN DL 112790292. Address of 105 Bentree Court, Hendersonville, TN. TN OHS Joey Hudgins spoke with search team and the dogs handler stated the hit could have been methane gas. Records check showed the subject does not have a criminal history. This lead to be closed per SA Mark Lewis."], ["TN0063", "04-16-2011", "Update", "Routine", "", "", "At approximately 1306, SA Art Viveros with the FBI called the number given for Ms. Jamie Sypsma. Was advised by female subject answering phone that Jamie was not in but SA Viveros left a message for Ms. Sypsma to call."], ["TN0123", "04-16-2011", "Open", "Routine", "TBI Command Post", "1-800-TBI-FIND", "Recd call from Kelly(family friend),662-587-7500,who advised she had spoken to a Tracy Woodson,C662-322-7175,662-507-0300, who met new boyfriend,Bill Smithfrom Booneville/Iuka Mississippi at Chili's in Tupolo MS @12noon on April 13th.  She had spoken with him that morning and he said he was in TN-taking care of things and getting some beer.  Per Tracy, he was talking like a Psycotic Idiot on phone during lunch.  He told her he had just broken up with girlfriend who was in nursing school in TN and showed her a picture that looked like Bobo.  He is in the military and was scheduled to fly to the middle east on a C-5 plane at midnight of the 13th.  Tracy advised he drives a grey dodge vehicle."], ["TN0123", "04-16-2011", "Update", "Routine", "TBI Command Post", "Email from Kelly Brewer", "Photo received by LEIC Allen and forwarded to TBI Command Post"], ["TN0123", "04-16-2011", "Closed", "", "TBI Command Post", "phone call", "S/A Mark Lewis spoke by phone with Woodsen and determined that there were similiarities due to the appearance of his girlfriend and that she was in nursing school. Complainant thought authorities were looking for a grey truck also. Person in question was in Mississippi by 11:30 a.m. or noon on the date in question."], ["TN0124", "04-16-2011", "Open", "Routine", "", "Phone call", "4-16-11 approx 1345 LEIC Bryson rcvd a phone call from 765 744-0681. The caller was calling about 2 people that she knew back in the 90's who like to hunt and kill things. She has no info about where they currently live but she thinks this is something that they may do. The names are (Alan Cook & Goodacre (first name not known), but has a sister named Candice and the 2 men do not know each other."], ["TN0071", "04-16-2011", "Update", "Routine", "LEIC Amy Allen - TBI", "Called security at Harrah's Casino", "LEIC Allen contacted security at Harrah's Casino in Joliet, IL and spoke with Security Officer D. Jadzak. Officer Jadzak. LEIC Allen forwarded a copy of the press release to him. Officer Jadzak is forwarding the information to the surveillance department to search their surveillance footage. He will also forward the release to the on-duty managers."], ["TN0126", "04-16-2011", "Open", "Routine", "", "", "SA Doug Pate receieved information from an individual by the name of Wayne Wright. Mr. Wright was reporting a person of interest, Aaron Wallace. Wallace is described as mentally impaired, lives in the area, close in age. SA Pate discovered Mr. Wallace does not live in the area; has lived with his mother for the last 4 years. He is mentally handicapped, draws SSI and does not have a DL. Mr. Wallace helped with the search parties on 4 wheeler/horseback since date of incident. Father Tommy Wallace lives at 1940 Sulfur Springs Rd in Parsons and was personally spoken to on 4/16 by SA Pate."], ["TN0049", "04-16-2011", "Update", "Routine", "", "", ""], ["TN0088", "04-16-2011", "Closed", "", "LEIC Amy Allen - TBI", "", "Same Lead as TN0052. Has been cleared by LEIC Allen."], ["TN0113", "04-16-2011", "Closed", "", "", "", "Lead investigated, nothing found. Close per SA Mark Lewis"], ["TN0119", "04-16-2011", "Closed", "", "LEIC C. Purviance", "", "Facebook page reviewed and blog page by LEIC Purviance. Nothing unusual posted on either page. Glenn Adams is a retired Atlanta Fire Department Captain. Has joined the Bring Home Holly Bobo Safe facebook page. All postings are in line with other postings by other individuals. Nothing further to look into. Close lead."], ["TN0093", "04-16-2011", "Closed", "", "LEIC Amy Allen - TBI", "", "Same lead as TN0052. LEIC Allen has spoken with Investigator Latta about his case. This is an email that has been sent around the community. At this time the investigator advised the victim has not come in to file a formal report on this case at this time. If additional information is located Latta will contact TBI."], ["TN0065", "04-16-2011", "Closed", "", "", "", "Closed, lack of leads."], ["TN0126", "04-16-2011", "Closed", "", "", "", "SA Pate spoke with Mother and Father. Mother Tonya Fisher gave alibi for Aaron Wallace. Stated he was at home during the time of the incident and a painter was at the house as well. Tonya Fisher 731-549-7866"], ["TN0127", "04-16-2011", "Closed", "", "", "", "Area searched with no results. Case closed per SA Mark Lewis."], ["TN0128", "04-16-2011", "Open", "Routine", "", "Call into SAC Mehr", "SAC John Mehr received information from the victims family in regards to a Wally Lidberg. Mr. Lidberg stated he knew where the victim's body was. The location was approximately 1 1/2 hours away. Law enforcement personnel went to the area. Mr. Lidberg had given previous information on another case and a body was found on that case. Mr. Lidberg's information shows phone number of 828-980-2516 which comes back to a cell phone. Address of 799 Bethany Church Road, Forest City, NC, DOB: 08/08/1936 and SSN of 393-32-5688. Checks showed Mr. Lidberg does not have a criminal history. Phone calls made to Mr. Lidberg were recorded and copied to the Decatur Kidnap folder on the Command Post laptop next to the wall with leads, under folder of Phone Calls Audio. SA Jeff Jackson and the Obion CO SO are still in area as of 1603 hrs searching."], ["TN0129", "04-16-2011", "Open", "Routine", "", "", "LEIC Stanfill received called from Decatur Co. Dispatcher Deanna. She reported that they received a tip at 16:33 from a Kenneth Smith JR. (781) 697-1535.  Deanna said that Mr. Smith was very difficult to understand but she thinks that he said that he saw Holly Bobo 1 å_ months ago at a Gentleman's Club in Massachusetts."], ["TN0102", "04-16-2011", "Closed", "", "", "", "On April 16, 2011 at approximatey 1540, SA Clayton Goldsmith of the FBI and SA Joe Walker of the TBI went to TBI went to 1264 Yellow Springs Rd, Holladay and spoke with Miller. Miller was told we were investigating the disappearance of Holly Bobo and Miller was asked where he was yesterday. Miller said he was turkey hunting alon on Conrad Ridge Rd on the property of Lloyd Conrad. Miller said he came of the woods and Deputy Johnson of the Decatur County SO was there. Miller said when he got home he realized he had lost his hunting chair and a decoy. Miller said he and a friend Jason Markowski went back and retrieved the chair and decoy and he threw these items in his trunk and left. Lead investigated and agents feel comfortable to close this lead."], ["TN0130", "04-16-2011", "Closed", "", "", "", "Per SA Mark Lewis this lead can be closed."], ["TN0131", "04-16-2011", "Open", "Routine", "", "TIES", "Norma Raleigh in TIES recieved a call at 1718 hrs from number 731-632-1218. Caller stated her kids were assigned to search team group 17, list 2. Caller stated the kids were at Conway Ridge and are sure they heard a female frantic yelling for help. They state they told the team leaders who would not go back to check it out. The voluteers were Ricky Alexander age 19, Dakota Alexander age 15 and Katlin Caffree age 19. The caller states her kids have returned upset and feel certain they heard something and are asking to please send someone back to check the Conway Ridge area again."], ["TN0131", "04-16-2011", "Closed", "", "", "", "THP has flown over the area with no result. Per SAC Mehr, this lead can be closed."], ["TN0132", "04-16-2011", "Open", "Routine", "", "Interview at victims residence by FBI", "Friend of the family, Jessica Deer, remembered that last Friday she ran into Mitchell Wood and he indicated that he quit being a volunteer searcher and firefighter because they \"disrespected\"him, did not call him out, etc. However, after Holly went missing, she saw Mitchell in the search party on Wednesday. She also indicated that Mitchell has a history of being obsessive and stalking his ex girlfriends. TBI Agent Terry Dycus has been involved in interviewing the Woods family and should get this information. \n\nSeparately, mom (Karen Bobo) remembered that Holly had said that (cousin, country singer Whitney Dunkins) song lyrics, \"So Sorry Mama\" were about Mitchell to her. Mom stated the song is about a bad boy that a girl is attracted to but knows he's trouble and so tries to stay away from him. This was said during the time period that Holly was pursuing Drew and Mitchell was pursuing Holly."], ["TN0063", "04-16-2011", "Closed", "", "", "", "Wes Mays FBI Agent, SA Art Viveros FBI spoke to Mike Chiulli, caller's brother in law, dob 6/22/1968, ssn 024-64-7022, born in MA, w/m, 5'9\", 250 lbs at his residence located at 2575 Mouse Tail Rd, Parsons, TN 731-847-2058. He states he's bi-polar and takes medications saraquill xr, lithium, trazadon, atravil. HE says he does own camo overall hunting garment that got from friend but hasn't worn in a year. Says he does not go into woods. On Wednesday, April 13, he was at home, said his wife Deanna can verify that. He does not work,is on disability, he does not hunt but owns several rifles that keeps at friends house because he's had thoughts of suicide in the past. He says he does drive but does not leave house often. He and his wife have son Dakota Sharpe, 18 yoa, goes to UT-Martin and knows victim. 5'9\"-5'11\" 120-140 lbs. Both said Dakota was sick on the 13th of April. Kristen Young is Dakota's girlfriend 731-733-3406, 17 yoa and JR at Riverside High, Dakota full time college student. After interview, it was determined this lead can be closed."], ["TN0288", "04-16-2011", "Open", "Routine", "", "", "ASAC Long received a call from Diane Locker about this case.  She suggested Holly's abduction was spear headed by a group of people in Fl.  The 3 leaders of the group are Chris Forehand, James Kent, & Jason Cleland. There is no follow up to do, only FYI."], ["TN0133", "04-16-2011", "Open", "Routine", "", "", "Decatur Co 911 received a call from Rose A. Rimmer(now Hinchey) 731-733-1837.  Ms Hinchey reported she had told Officer Dale King 2 or 3 years ago that a man was stalking her and had said he wanted to take her out into the woods and tie her up.  Hinchey could not remember the man's name.  Shelia Carver passed this information to SA Joe Walker and informed SA Walker the male's name was Paul Love and he was a volunteer fireman here.  Carver said he lived on Lindsey Rd.  I located Love at 1117 Lindsey Rd. and discussed this matter with him.  Love stated he does not remember anyone from law enforcement contacting him about this.  Love said on Wednesday April 13th he left home at about 4:30am like always and traveled to Jackson to work.  Love said he was the supervisor of operations at David Joseph a subsidiary of Gerdeau Steel.  Records need to be checked the first of the week to verify he was at work."], ["TN0134", "04-16-2011", "Open", "Routine", "", "", "Decatur Co 911 received a call from Sigornee Colby from Orlando Fl 407-319-0577.  Ms. Colby was calling to bring our attention to Holly Bobo's Facebook blogs.  Colby said everyone blogging on here is in support of Holly and her family.  Saul is making comments on the blog like Holly ran off with another man, Holly has eloped, people should stop looking for her, she is okay, it is all staged.  Saul is also making comments about how terrible the world is.  Colby believes he either knows something or is acting out. She just thought this was bizarre."], ["TN0135", "04-16-2011", "Open", "Routine", "", "", "Decatur Co. 911 received a tip from an anonymous caller, 731-446-0456.  This caller wanted us to check on Mark Clark on Holly's Facebook.  There is a page called Prayer for Holly Bobo.  The caller told SA Joe Walker she has been monitoring this page.  Mark Clark's original photograph showed him with a knit stocking cap and a camo shirt.  The caller said he now has on a suit.  The caller said originally Clark had eight friends and now he has ten.  The caller said Clark has not said anything negative about Holly but she said \"his eyes look dead\".  She said she had extra bad feelings about him."], ["TN0136", "04-16-2011", "Open", "Routine", "", "", "SA Joe Walker spoke with Rhonda Kates at approximately 7:30pm on 4-16-11 to follow up on her initial call.  Kates said she was turning off Spring Hollow on Bunches Chapel and there is a small pull off there.  Kates said she observed a newer model black jeep with blacked out windows.  Kates said she noticed the driver was on hte cell phone and she thought he was wearing camo.  Kates said she had never seen this jeep before in the area and there was nothing distinstive about it."], ["TN0137", "04-17-2011", "Open", "Routine", "", "", "Mrs. Bobo called SA Brent Booth and said she and her husband remembered an old boyfriend of Holly's that was very strange and wanted to report this info.  His name is Wallace Hall and he is believed to be in the military now, he was married to a Katie Tomlin and they have a child.  Katie's parents are Allen and Lori Tomlin and Katie now lives with them. They don't know his exact where abouts at this time. His mother did live around the Lost Creek area in either Decaturville or Perryville, they did not know her name."], ["TN0021", "04-17-2011", "Closed", "", "", "", "Bank officials advised S/A Dicus and Det. Ricky Inman that there is no bank cards on her accounts, just a check book. There was around $90.00 in the account. She just deals with cash and checks."], ["TN0024", "04-17-2011", "Closed", "", "", "", "Homeland Security SA Joseph Hudgins followed up on this information. It was not a positive ID, witness said it looked like her. Met with Perry CO SO Chief Deputy Nick Weemes (931) 213-4192, lead investigator Fred Moore (931) 213-1813. Also spoke to Mr. Gary Patel, manager of Fatman's Deli in Perry County. First stoe across Decatur Co. line in Perry Co. Mr. Patel hadn't seen the subjects and his # is (615) 337-0415. Perry Co asigned Deputy George Dittfurth (615) 542-4242 to canvass all stores in the county and to question and place posters. He will report his findings to me Joseph Hudgins,TNOHS when finished (731) 394-2811. 1700 Deputy George Dittfurth completed contact with all stores w/nothing to report, BOLO'S went out."], ["TN0138", "04-17-2011", "Open", "Routine", "", "", "Linked to TN0139.  On April 15, at approximately 1727, Officer Nicholas, Officer McCready, and Lt. Hetherington went to the residence of Ricky L Frye, at 89-B Natchez Trace Drive, Lexington, TN. Upon arrival, Stephany Bryum (his live in girlfriend) answered the front door. Ricky was in bed asleep due to working the night shift at Wal-Mart in Lexington. Ricky got up and spoke with Hetherington while Nicholas and McCready walked around the outside of the residence. Ricky advised that he works at Wal-Mart from 10PM - 7AM. He stated his days off are Sunday and MOnday. He also stated he always stops at the Shell station and buys beer before going home. Stephany said that he comes straight home, drinks his beer, then goes to bed, which is his regular routine.\n\nI contacted Pam Scott, security at Wal-Mart, she stated that he arrived at Wal-Mart for work on Tuesday night at 2027 hrs and left at 0707 Wednesday morning. On Wednesday night he arrived at work at 2047 hrs and clocked out at 0723 hrs. \n\nRicky gave permission to me to tour his residence. I was able to check all closets, bathrooms, bedrooms, kitchen, and living room. He also gave permission to Nicholas and McCready to check his vehicles.\n\nLT. Donna Hetherington, CID"], ["TN0139", "04-17-2011", "Open", "Routine", "", "", "Linked to TN0138.  Officer Nicholas checked on Ricky Kiggins, a known sex offender who lives in Ricky Frye's neighorhood, and found that he is and was incarcerated at Henderson County Jail."], ["TN0138", "04-17-2011", "Closed", "", "", "", ""], ["TN0139", "04-17-2011", "Closed", "", "", "", ""], ["TN0140", "04-17-2011", "Open", "Routine", "", "800 TBI FIND", "Ben Nelson - 612-282-6002: Mr. Nelson advised that at 1:17 a.m. this morning he and a group of friends were traveling through Tennessee to Minnesota. Mr. Nelson stated they stopped at a gas station/McDonald's at 6137 Epps Mill Road in Christiana, TN (615) 904-7303. There were two white male subjects in the McDonald's in their early 30's. One subject had blood on his jeans and the other was wearing a camo t-shirt. The subject wearing the jeans was 5'8 to 5'10 and had darker hair. The subjects were possibly driving a newer model two-tone Ford SUV."], ["TN0141", "04-17-2011", "Open", "Routine", "", "800 TBI FIND", "Pam Beming - 731-616-6169: Ms. Beming advised that she has been taking her friend back and forth to Nashville to the airport. As she came back through this morning she saw a female's black tennis shoe on the entrance ramp of a road that connects to Interstate 40 going WB just across the TN river bridge. Ms. Beming did not know if the shoe could be related to the case but wanted to make someone aware of it."], ["TN0297", "04-17-2011", "Open", "Routine", "", "", "SAC THP Stanford, report of a black Nissan Altima on Bible Hill Rd. traveling at a high rate of speed. No ag # was provided.  Caller said it was driven by a W/M and a W/F with blonde hair was in the back seat.  THP ran all black Altimas in Decatur Co.  Brent Hickson of 3766 Towlin Chaple Rd. was a refistered owner of a 2005 Altima.Brent Doyle Hickson was  interviewed 4-17-11 @ 10:30 am. Said he was at work on Wed. (13th) working for Henderson Cut Stock near Beech River Airport in Decatur Co. On the day Holly went missing he was at work arrived at work at 7:00am was there all day. Was at home all day Saturday the day a black Altima was seen on Bible Hill Rd. never was on Bible Hill Rd. Wife confirmed his story."], ["TN0148", "04-17-2011", "Open", "Routine", "SA Bill Green - TBI", "LEIC A Allen", "SA Bill Green and LEIC Allen have requested and are processing subscriber information from the tower dumps of the cell towers surrounding the search area."], ["TN0142", "04-17-2011", "Open", "Routine", "", "", "Corey Stewart, 50 Anglin Rd, Scotts Hall. Scott and Whitney Duncan, a couple of months ago, tried to befriend Holly and Whitney but were unsuccessful. Dicus and Viveros and spoke with Stewart and has an alibi for that morning of Tiffany Huffington."], ["TN0142", "04-17-2011", "Closed", "", "", "", "Dicus and Viveros and spoke with Stewart and has an alibi for that morning of Tiffany Huffington."], ["TN0143", "04-17-2011", "Open", "Routine", "", "", "Joey Hudgins, TNOHS, was contacted on 4/16/2011 by Mr. James (Jim) Haggard regarding a suspicious text message his daughter, Chelsea Kelly (731-549-2644) received. On 4/13/2011, Chelsea received the following text from phone number 731-733-6464:\n\n1:11-Have you found her yet\n\nChelsea: Who is this?\n\n1:30-Oops I got a wrong no. I was trying to find out about the missing girl.\n\nChelsea: That's ok.\n\n2:24-I got afraid I texted the FBI and they were coming to get me.\n\nChelsea:That's ok. This is Chelsea and there are alot of people out looking for her.\n\nEnd of text\n\nShe informed her father on 4/16/2011 (Saturday), that she got this and didn't pass it on sooner because she didn't think it was a big deal. She showed it to her mother, Deborah Haggard, who then told her husband, James Haggard. Mr. Haggard researched the phone number (731-733-6464) and found that it is a Florida Vandeveer of Martin, TN. He didn't think it added up that someone in Martin would have a Parsons cell phone number. Also, using Intelius he discovered Ms. Vandeveer previously lived in Cicero, IL. They also did a search of the National Sex Offender Registry and found a Duane Vandeveer who lives in Lyons, IL. They thought someone should know this."], ["TN0144", "04-17-2011", "Open", "Routine", "", "800 TBI FIND", "Teresa Warnke - 715-813-0097: Ms. Warnke advised that she was not a psychic but had a strong feeling that the victim was in a tubular structure possibly a culvert, some type of storage or drainage pipe."], ["TN0145", "04-17-2011", "Open", "Routine", "", "800 TBI FIND", "Michael Nault - (508) 525-5690: Mr. Nault called to advise that the Holly Bobo case was similar to the homicides of Holly Piirainen and Molly Bish in Staubridge, MA. Mr. Nault said that the local barracks of the Massachusetts State Police had the case."], ["TN0071", "04-17-2011", "Closed", "", "LEIC Amy Allen - TBI", "Message to 744-4098", "LEIC Allen received a message from the security officer at Harrah's Casino. Female subject has been identified and will not be Holly Bobo."], ["TN0146", "04-17-2011", "Open", "Routine", "", "800 TBI  FIND", "Sporting Goods Clerk at Lexington, TN Wal Mart called to advise of a male subject in the store at this time buying camping gear. Clerk stated subject had an injured hand that was wrapped and that he had stated he was going to be camping in the area for the next several months. Clerk was advised to hang up and contact the local police to have the subject identified. ASAC J Locke notified by phone of incident."], ["TN0146", "04-17-2011", "Closed", "", "", "", "LPD says the subject checks out ok."], ["TN0147", "04-17-2011", "Open", "Immediate", "", "800 TBI FIND", "Barry Woods 731-614-0678 called advised that he and his son just found a long sleeve pink knit shirt at the entrance of Sycamore Lake in Lexington on Hwy 22S. He is standing by in a black Silverado Pickup. SACs John Mehr and Jerri Powell notified by phone"], ["TN0147", "04-17-2011", "Closed", "", "", "", "Talked to Barry Wood, he examined the shirt and it does not have any writing on it. It's made like an under armor shirt, longsleeved, child's shirt. Therefore, closing incident."], ["TN0115", "04-17-2011", "Update", "Routine", "Missouri Highway Patrol", "Call from Trooper Patterson", "Trooper Patterson called to advise that the owner and manager Polk Craig had reviewed the surveillance footage and located the female subject the complainant saw at the truck stop. Trooper Patterson advised that they did not feel it was the victim. The manager did advise that the film would be available tomorrow (4/18/2011) if an office wanted to view the footage."], ["TN0148", "04-17-2011", "Update", "Routine", "SA Bill Green - TBI", "By email from Verizon Wireless", "Records have been received from Verizon Wireless towers"], ["TN0150", "04-17-2011", "Open", "Routine", "", "", "Holly's brother Clint remembered that on Sunday 27 March 2011, at the viewing for Brennan at the funeral home, a man they'd never met before named Kevin Dickson (Dixon?) rode with them to eat at Zaxbys. Kevin, who was said to be friends with Brennan's dad, was there alone.  Drew and Kevin thought they might have met on a hunting trip before. Kevin offered to give them (Holly, Drew, and Clint) a ride to Zaxbys, but they decided to take Hollys car. As they moved her school books to the trunk to make room, Kevin was asking about her nursing program. Clint drove with Kevin in the passenger seat and Holly and Drew in the back. They all ate together then rode back to the funeral home. Clint recalled that Kevin was \"very outgoing.\". He said Kevin was probably in his 30s, may have been wearing a wedding band, and drove a burgandy 4door Dodge Ram 1500 (later model, at least after 2002). He described him as tall and stockier, like the man that led Holly away."], ["TN0149", "04-17-2011", "Open", "Routine", "", "800 TBI FIND & EMail", "Shawna Marshall - 731-733-0734: Ms. Marshall advised that she found an ad on Craigslist that was posted on April 15 wanting to sell a vehicle. A copy of the ad is posted below.\n\n\n\nThis vehicle is being sold as for parts. It does run. It has a 225 V-6 Buick \"Odd Fire\" Engine, Turbohydramatic 400 automatic Transmission, Dana 27 front axle, Dana 44 rear axle. Modifications: GM HEI Disatributor, K & N Air Filter, Flex Fan, Rear Leaf Spring, Riser Shackles. \n\nAsking $1,000.00 Or Best Offer. Call 731-847-3278 \n\n\n\n\n\nLocation: Parsons\n\nit's NOT ok to contact this poster with services or other commercial interests"], ["TN0151", "04-17-2011", "Open", "Routine", "", "", "Rebecca Brewer, door check girl at Teasers, was interviewed by SA Nathan Bishop on 4/17/2011. Brewer indicated a customer came in last night, very drunk, and tipped her, and the bartender with dollar bills. One of the dollars he gave her had blood on it. She also indicated there are security cameras if needed."], ["TN0148", "04-17-2011", "Update", "Routine", "LEIC Amy Allen - TBI", "Phone call from SA B Green", "SA Bill Green has advised that the FBI will be assisting with phone records. Information being sent to carriers to allow FBI access to all phone records requested by TBI.\n\n\n\nLEIC Allen faxing request to all carriers."], ["TN0152", "04-17-2011", "Open", "Routine", "", "", "Larry Mullins, TNOHS 731.234.3985, interviewed several loggers that have been in the area since a storm approximately a month ago. These loggers have been clearing the area since that time and may have seen Holly coming and going. The list is as follows:\n\nLynn Moore, land owner (Logger: Terry Mill, 847-7793 not on site, **Ricky Mills, 731-220-0254, **Kenneth Johnson, 731-206-0001. ** worked in the area three weeks prior to abduction. \n\nRonnie Moore (847-9739)land owner, (Logger: Matt Clendenin 731-614-7005, Albert Allan, 731-847-3248, reported they saw Dewayne Lance in a 1970 Ford 2tone truck, blue and white drive thru the area a couple of weeks before and has been convicted of simple possession and lives at Brodies Landing Road.\n\nFrank Washburn (731-614-0972) logging worked his own property off Bear Creek Road from 4/13-14/2011 on and after abduction. Reported suspicious vehicle to sheriff Brian Duke (white S10 pickup). \n\n\n\nRicky Mills and Kenneth Johnson are working the search and very cooperative."], ["TN0011", "04-17-2011", "Update", "Routine", "", "", "Kathy Holt checked the Coon Hunt list for Hamilton County participants. DB Little was found from Chattanooga as a dog owner. Phone 423-304-0038. The handler is Dee Little. David B Little has a TN dl w/ a DOB 11.21.1959. No Dee Little was found. Also Wayne Smith DOB 01/06/1947, 6857 Sam Smith Rd., Birchwood, TN 37308. no criminal history or wants found."], ["TN0153", "04-17-2011", "Open", "Routine", "", "TBI Find", "Pat Leebvre called HQ at 3:24 with the following information.  Her daughter has strong feeling that victim Holly Bobo is alive but very weak.  She can be location in the area of Cunningham, TN Montgomery County to Henerita, TN Cheatham County TN.  Daughter also advise this crime was planned and set up deal.  Pat phone number is 251-979-1663"], ["TN0155", "04-17-2011", "Open", "Routine", "", "800 TBI FIND", "Amanda Parks - 731-441-1979: Complainant advised that a male subject in a Silver Toyota Tacoma with Lauderdale County Tag 084DDT was driving around in the area of 320 Ray Miller Road in Sugar Tree, TN. Subject was watching the complainant and was acting odd. Subject asked if they had found \"that girl yet\". Ms. Parks' grandmother is the owner of the home on Ray Miller Rd. Ms. Parks advised she has never seen that man down there before and its a very rural area. The subject also stated he owned a place at the Ponderosa. Subject is described as a white male in his late 40's early 50's wearing a camouflage t-shirt and hat as well as either sunglasses or glasses with tinted lenses.  \n\n\n\n084DDT is registered on a 2004 Silver Toyota Pickup to Angela and Bobby Jones, 505 Bud Jennings Road, Henning, TN 38041."], ["TN0154", "04-17-2011", "Open", "Routine", "", "800 TBI FIND and Email", "Shana Rowe - 731-307-1534: Complainant saw an ad on Craigslist for a subject selling 4 new ATV Tires. A copy of the ad is posted below.\n\n\n\nemail this posting to a friend jackson, TN craigslist > for sale / wanted > recreational vehicles \n\nplease flag with care: [?] \n\n\n\n\n\nmiscategorized\n\n \n\n\n\nprohibited\n\n \n\n\n\nspam/overpost\n\n \n\n\n\nbest of craigslist\n\n \n\nAvoid scams and fraud by dealing locally! Beware any deal involving Western Union, Moneygram, wire transfer, cashier check, money order, shipping, escrow, or any promise of transaction protection/certification/guarantee. More info\n\nNew Atv Tires 25-12-9 110 o.b.o - $100 (Parsons)\n\n\n\n--------------------------------------------------------------------------------\n\nDate: 2011-04-17, 12:33AM EDT\n\nReply to: sale-84j2h-2329942059@craigslist.org [Errors when replying to ads?]\n\n\n\n--------------------------------------------------------------------------------\n\n\n\n\n\nI have a pair of New ATV tires for sale. Came off of a honda. need em gone 100$ and their yours. call r txt me at 731-845-476zero (rims&tires) go. \n\n\n\n\n\nå¥Location: Parsons \n\nå¥it's NOT ok to contact this poster with services or other commercial interests\n\n  \n\n  \n\n\n\nPostingID: 2329942059\n\n\n\n\n\n--------------------------------------------------------------------------------\n\n\n\nCopyright å© 2011 craigslist, inc.terms of useprivacy policyfeedback forum"], ["TN0154", "04-17-2011", "Update", "Routine", "", "By email", "The following is a dialouge I have had with the poster of the suspicious ad on craigslist (http://jacksontn.craigslist.org/rvs/2329942059.html)\n\nMe/Shayna - Very interested in the tires!!! I need em bad!!! Cash in hand, in lex now....\n\n\n\nDustin - Srry I'm at a dirttrack race in horhenwhale tn but I still have em would you want em tonight 100$ n hand?\n\n\n\nShayna - Yes cash in hand!!!! What time can i come by? And what's ur address so i can plug it into gps?\n\n\n\nDustin - Just come to parsons and ill meet u n town idk the races aren't over yet ill txt u as soon as I'm on my way back\n\n\n\nComplainant emailed the following dialogue between her and the poster of the ad.\n\n\n\nShayna - Ok sounds goos!!! Super excited... My name is shayna, what's urs?\n\nDustin - Dustin ill txt you when I'm headed home thanks shayna\n\nHOPE THIS HELPS!!!\n\nHere are some additional posts using same phone # \n\nhttp://jacksontn.craigslist.org/pts/2329945048.html\n\nhttp://jacksontn.craigslist.org/pts/2329948925.html"], ["TN0296", "04-17-2011", "Open", "Routine", "", "", "(Joseph Hudgins, TNOHS), Larry Mullins (TNOHS) and Tommy Spivey (THP-CID) were requested by the decatur county command post to check on a suspicious cabin found by a search team.  The cabin is located on Old Poplar Springs Road in Henderson County.  Upon arrival we were met by Henderson County Deputy Sheriff Meggon Woods and the property owner Mr. Grafton Dodd and his son Bradley Dodd(847-7237).  I explained the reason we were there and ask Mr. Grafton Dodd if he (Mr. Grafton Dodd) minded if we checked the cabin to ensure it was safe.  He gave us premission and I, along with the individuals named above, to include the property owner and his son proceed to the cabin.  Myself and Deputy Woods made entry and cleared cabin. We then cleared some sheds and a barn behind the cabin without incident and departed the area."], ["TN0156", "04-17-2011", "Open", "Routine", "", "", "Art Viveros, FBI, along with Joey Hudgins, TNOHS, on Sunday, 04/17/2011 at 13:50 interviewed Donna Manes, W/F, 18 Montgomery, Lexington, TN, Cell: 731-394-5763. Manes alleged that on a weekend day at sometime betwen 7-8 PM, approximately the end of March 2010, she was abducted by a W/M while at a gas station located at Parkers Cross Roads off I40. The male was approximately 5'9-5'10\", 200-250 lbs., short dark brown hair, missing a top front tooth, driving a Jeep vehicle. She alleged that the man pushed her into the passenger seat of the vehicle and drove her to a cemetery located in the Natchez Trace State Park and raped her over a 30 minute period. She escaped by kicking him in the groin and departing on foot returning to Parkers Cross Roads where she found her car and left the area back to LExington where she resides. The man threatened for her not to tell of the incident to anyone or he would kill her and her family and that he knew where she and her family lived. She alleges that once she returned to Lexington that evening, she went to the Walmart and shopped and was able to be at her home by midnight. She never reported the rape to law enforcement. Agents are reporting incident to Henderson County for them to follow-up on the rape."], ["TN0004", "04-17-2011", "Update", "Routine", "", "", "Today at approximately 4:20, Joey Hudgins from TNOHS, and myself interviewed John Babb a W/M, DOB 12/29/1946, 61 Bellemeade Road, LExington, TN, cell phone 731-614-4079, a retired Rear Admiral US Navy. Reported on WEdnesday, 4/13/2011, he and his friend, Bob Williams also returned Navy officer, arrived at their fishing pond at 7:25 which is located across the street from the victim, Holly Bobo's, family residence. At approximately 7:40 they were putting a canoe into the lake when they saw a white possibly Ford pickup truck driving at a fast rate of speed, southbound on Swan Johnson Road. The vehicle had an extended cab. Mr. Babb and Mr. WIlliams heard what they thought were cats fighting sometime between 7:25 - 7:40. Mr. Babb assumed it was cats fighting because it sounded like a howling sound. Because a lot of cats live in the house beside the lake. Mr. Babb has known the Bobo family for 6 years after having purchased the lakes. He thinks highly of Holly's father, Dana, and the Holly and Clint children. They always seem to do everything together as a family."], ["TN0156", "04-17-2011", "Closed", "", "", "", "FBI investigated. No additional information"], ["TN0157", "04-17-2011", "Open", "Routine", "", "", "SA Brent Booth on 4/14/2011 11:48AM, interviewed Clint Bobo, WM DOB 8/29/1985, cell 731-549-7798, employed Westwood Health Care and as an Asst Social Worker and attends classes Tuesdays and Thursdays at UT Martin.  Clint was awakened by a dog barking. Her and a man/boy is in the garage. sounded like a calm conversation. I was standing next to the window in the garage. Noticed some stress in her voice. They were talking about a plan. He was telling her what to do. I can't remember the words. He sounded white. I thought they were talking about turkey hunting. He would say something and she would say something. No yelling no screams. They walked around the deck and around the pool up into the woods. She was too his left and he to her right. He had something black in his right hand down by his side. He had on full camoflauge and a turkey hunting mask and possibly a cap."], ["TN0158", "04-17-2011", "Open", "Routine", "", "", "SA Jeff Jackson, received a signed consent to search the home of Holly Bobo on 4/17/2011, which was given to Lead Agent Terry Dicus. The following was found in Holly's room:\n\nNew email address: tw1l1ghtz0ne8\n\nfavorite historical person: Anne Frank\n\nMyspace lil bobo-09\n\npassword - Dimage 21\n\nHotmail: holly12bobo@hotmail\n\npassword: worms6n\n\n\n\nscratched out 43612!hlb\n\n\n\nFound in middle of underwear drawer a note that says: Jackson, TN 38301 - Phone: (731)211-3003-$250\n\n\n\nIn Holly's closet: Found HP laptop computer Henderson Co Schools property tag #000166. \n\n\n\nFound in brother's room: saw note with #602-7950 Steff"], ["TN0148", "04-17-2011", "Closed", "", "LEIC Amy Allen - TBI", "", "Phone records requested"], ["TN0159", "04-17-2011", "Open", "Routine", "", "", "4/13/2011 FBI SA Jason Bilnoski, interview with Boo Scott, DOB: 1/23/1967, phone 731-847-4902, resides at 279 Oakville Circle, Parsons, TN, works at the Food Giant in Parsons, TN. His son is Drew Scott, the boyfriend of HOlly Bobo. His son has been dating Holly for 8-9 months. He knows of no issues between Holly and Drew involving fighting/arguing. He last saw Holly on Sunday, 4/10. He advised Drew works for the City of Parsons. He and drew went hunting the morning of the 13th and left the house at approximately 5:20AM. They were in the woods by 5:40AM. Back in Parsons at approximately 7:50AM. Mr. Scott advised Drew got a text message from Holly at 7:41AM. At aproximately 8:10-8:15, Mr. Scott got a call from his wife stating Holly was missing."], ["TN0144", "04-17-2011", "Closed", "", "", "", "psychic lead"], ["TN0160", "04-17-2011", "Open", "Routine", "", "", "FBI Special Agent Bilnoski, Detective Inman, and SA Cardone, spoke with a STeve Paulk, W/M, DOB 2/2/1957, phone 731-847-9613, resides at 106 Swan Johnson Road, Darden, TN. He advised he was sleeping til 7:30 that morning. Didn't leave the house til later that day. He was alone with no one else at the house. Approximately 12 years ago, he was arrested for making phone calls to tghe Bobo family. Particarilly Karen Bobo. Originally, Paulk stated it was social issues but then further elaborated, he heard Karen Bobo was having an afair on her husband. Paulk stated he was basically asking her \"why not me.\" He has not seen Holly in quite some time."], ["TN0141", "04-17-2011", "Closed", "", "", "", "Shoe does not match victims clothing."], ["TN0161", "04-17-2011", "Open", "Routine", "", "FBI SA Bilnoski", "Cindy Thompson (protect identity) 840 Cedar Bluff Drive, Mt Carmel, TN, 731-852-2444. Thompson advised late August, September 2010, one of her daughters and she observed a white male in light camoflauge with a mask in his 20s watching her daughters in the backyard from the woods. Thompson advised when she yelled at him he began to run away. She attempted to find a vehicle but was unable to. 911 was called but no report was taken by DCSO. There is no identifying information to locate individual. Thompson advised all their neighbors and Sheriff's office."], ["TN0136", "04-17-2011", "Closed", "", "", "", "Unknown vehicle"], ["TN0157", "04-17-2011", "Update", "Routine", "", "", "Part 2 continued from 4:15pm interiew.\n\nAFter talking to my mother, I called 911. I had gone outside with my gun. The lady next door, Ms. Kathy, drove up. She said she heard somebody screaming. I didn't hear it. I guess I was asleep. I had my dad's .38 revolver in my hand. Ms. Kathy saw it. I put it in my pocket. My truck was in the garage with the doors closed. My truck was in there with a baracuda and 2 four-wheelers. I think the white dump truck is there. Dad works for McKenzie tree service. He leaves early. Mother works for Scottshill school and leaves around 7AM. I normally work at Parsons Elementary school on Wednesdays on volunteer basis. I'm a social work major at UTM. \n\nI changed pants and put on a pair of green sweat pants. It was cool outside. Thinking I might need to walk up in the woods, I put on a camoflauge jacket. \n\nI think someone has kidnapped her. Wanting to do something sexual to her. I'm used to dealing with people in a crisis in my work and field of study of social work. I hope it's for ransom, but we don't have money. Clint provided a timeline and has consented to a polygraph."], ["TN0157", "04-17-2011", "Update", "Routine", "", "", "at 4:15PM, SA Brent Booth reinterviewed Clint Bobo. I woke up close to 7:40AM. Dog barking. I was wearing black shorts, super summer brand and a biege t-shirt. I called my mother right after I woke up. Asking her if Holly was home. I heard people talking. It was coming from the garage. I was in my bedroom. My mother said HOlly was at school or on her way to school. SHe called 911. I was still thinking it was HOlly and Drew in the garage. I looked out or peeped out and saw 2 people squatting down in the garage. I could only see 2 silhouettes. I couldn't see their faces. It sounded like Holly and Drew, her boyfriend. I called my mom back and told her I think Drew is here. I didn't see his truck and wondered how he got here. Mom told me HOlly was supposed to be at school and her car was still in the garage. I saw them, Holly and that person, man in camouflauge walking into the woods. I was in the house looking out the back door. It looked like she was willingly walking with him. It looked like he was holding her by her right arm. He had a black object in his right hand. I thought it was Drew, her boyfriend. I went outside in the carport and saw blood in the carport. I thought it was blood from a turkey. I thought that Drew had killed a turkey and they were walking up into the woods. Maybe something to do with a turkey. (continued with update)"], ["TN0162", "04-17-2011", "Open", "Routine", "", "", "Two searchers located an abandoned home located approximately 1/4 mile off Christie Chapel Road. Searches located what appeared to be blood inside the home."], ["TN0129", "04-17-2011", "Closed", "", "", "", "Holly was in-state during that time period"], ["TN0162", "04-17-2011", "Closed", "", "", "", "TBI SA Nathan Bishop searched the location at 1800 hrs on 07/17/2011. The suspected blood was located. The suspected blood appeared to be evidence of animal activity. The main source of the suspected blood was on the attic side of a ceiling board. No other evidence was found. GPS coordinates were 35 degrees 35' 42'N, 88 degrees 7'7'W. No follow up needed."], ["TN0163", "04-17-2011", "Open", "Routine", "", "", "Information from Decatur County Sheriff's Office. Gerald Ochs, 765-244-1912 called to report Kenny Stenim's two sons, Gilbert (?) and Raymond (18/19 or ounger) run Prekwick to Bussletown. Back woods guys.. Live off land. Raymond tried to rape a girl looks like Holly. Runs creeks, fishes. Perry/Wayne County. No stores. Shop at flea markets. Gilbert (6'2\" or 6'3\") Raymond (5'9 strong stocky ark hair, blue eyes. All 3 170 lbs. Camo dressed. Probably no IDs. Cheap vehicles. Another 260-568-3135."], ["TN0122", "04-17-2011", "Closed", "", "", "", "Close-no valid information"], ["TN0121", "04-17-2011", "Closed", "", "", "", "psychic lead"], ["TN0164", "04-17-2011", "Open", "Routine", "", "", "LEIC Givens arrived at CP to releave LEIC Holt"], ["TN0117", "04-17-2011", "Closed", "", "", "", "Facebook lead"], ["TN0117", "04-17-2011", "Closed", "", "", "", "Facebook lead"], ["TN0116", "04-17-2011", "Closed", "", "", "", "vehicle lead"], ["TN0115", "04-17-2011", "Closed", "", "Missouri Highway Patrol", "", "Missouri Highway Patrol-viewed video"], ["TN0114", "04-17-2011", "Closed", "", "", "", "Shift change"], ["TN0112", "04-17-2011", "Closed", "", "Schaumburg Illinois Police Department", "", "no varifiable information"], ["TN0165", "04-17-2011", "Open", "Routine", "", "", "Mrs Swanson called to advised a Michael Lee Still has written RIP on Holly Bobo's facebook page wall"], ["TN0110", "04-17-2011", "Closed", "", "", "", "no varifiable information"], ["TN0108", "04-17-2011", "Closed", "", "", "", "information on recovered items from BOBO"], ["TN0166", "04-17-2011", "Open", "Routine", "", "phone call to TBI", "Michael Nelson from PA (717)-778-2158 advised he was traveling back to his home near Getysburg when he saw a foam green station wagon, Ford Escort, on Rt 51 north bound. He stated a man in old fashion Army camo was in the passenger seat and a very blond woman in her 20's was driving.  Vehicle has a TN plate and the woman was smoking"], ["TN0165", "04-17-2011", "Closed", "", "", "", "Facebook wall entry closed"], ["TN0104", "04-17-2011", "Closed", "", "", "", "person in camo clothing"], ["TN0101", "04-17-2011", "Closed", "", "", "", "No new information-lead checked"], ["TN0167", "04-17-2011", "Open", "Routine", "", "", "Received a call from Officer David Hoffman of the OFallon PD in Illinois and stated that the story regarding at question but said yes. He felt this was suspicous so instead of calling 911 he drove directly to the CP to report."], ["TN0169", "04-17-2011", "Closed", "", "", "", "Lead was unfounded"], ["TN0074", "04-17-2011", "Closed", "", "", "", "no new information"], ["TN0073", "04-17-2011", "Closed", "", "", "", "camoflage clothing-no specific information"], ["TN0072", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0070", "04-17-2011", "Closed", "", "", "", "hunting clubs-no new information"], ["TN0070", "04-17-2011", "Closed", "", "", "", "hunting clubs-no new information"], ["TN0069", "04-17-2011", "Update", "Routine", "", "", "subject polygraphed by Valerie Troutt,  additional information to be added"], ["TN0066", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0062", "04-17-2011", "Closed", "", "", "", "facebook"], ["TN0060", "04-17-2011", "Closed", "", "", "", "FBI interviewed-seemed credible"], ["TN0057", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0056", "04-17-2011", "Closed", "", "", "", "psychic"], ["TN0055", "04-17-2011", "Closed", "", "", "", "Lunchbox-evidence located"], ["TN0054", "04-17-2011", "Closed", "", "", "", "Person identified-no information linking to crime"], ["TN0051", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0050", "04-17-2011", "Closed", "", "", "", "facebook lead"], ["TN0170", "04-17-2011", "Open", "Routine", "", "Cheif Deputy Scott Cagle", "SA Jeff Jackson received information from Cheif Deputy Scott Cagle regarding Chris Powers. Cheif Deputy Cagle recevied the information from Johnny Sanders who lives in the area of Swan Johnson and Myrackle Town Rd.  Sanders stated that he saw a 98 Pontiac 2dr green firebird TN Tag 953 CBK belonging to Lee Ann Powers driving around the area of Holly's house for approximately 2 weeks prior to incident. Chris Powers has access to the car and been having marital problems. Powers was served an Order of Protection on 3/21/11 and a full order on 3/28/11"], ["TN0049", "04-17-2011", "Update", "Routine", "", "", ""], ["TN0048", "04-17-2011", "Closed", "", "", "", "no information to link to case"], ["TN0045", "04-17-2011", "Closed", "", "", "", "vehicle description"], ["TN0044", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0043", "04-17-2011", "Update", "Routine", "", "", ""], ["TN0042", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0040", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0039", "04-17-2011", "Closed", "", "", "", "vehicle information-does not appear to be connected to investigation"], ["TN0038", "04-17-2011", "Closed", "", "", "", "craiglist lead"], ["TN0037", "04-17-2011", "Update", "Routine", "", "", "US marshalls working on lead-make routine"], ["TN0035", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0032", "04-17-2011", "Closed", "", "", "", "decription of victims clothing"], ["TN0031", "04-17-2011", "Closed", "", "", "", "vehicle description-no specific suspect information"], ["TN0030", "04-17-2011", "Closed", "", "", "", "lead worked by SA MARK LEWIS-NO SPECIFIC INFORMATION"], ["TN0029", "04-17-2011", "Closed", "", "", "", "information only"], ["TN0028", "04-17-2011", "Closed", "", "", "", "no specific information"], ["TN0023", "04-17-2011", "Closed", "", "SA Mark Lewis TBI", "", "All Sex Offenders will be reinterviewed begnning on April 18th in Decatur, Benton, Perry and Henderson counties"], ["TN0019", "04-17-2011", "Closed", "", "", "", "interviewed with statement-no further action at this time"], ["TN0018", "04-17-2011", "Closed", "", "", "", "pertinent witness information to case file"], ["TN0014", "04-17-2011", "Closed", "", "", "", "cell phone information-case information"], ["TN0012", "04-17-2011", "Closed", "", "", "", "vehicle information only"], ["TN0010", "04-17-2011", "Closed", "", "", "", "TSU-computer forensic information"], ["TN0009", "04-17-2011", "Closed", "", "", "", "vehicle information on Hamilton co tags"], ["TN0007", "04-17-2011", "Closed", "", "", "", "All Sex Offenders in decatur,perry,henderson and benton will be reinterview starting on april 18th"], ["TN0006", "04-17-2011", "Closed", "", "", "", "residence search-no evidence found"], ["TN0005", "04-17-2011", "Closed", "", "", "", "A quick neighborhood canvas obtained no evidence or information.  Additional extensive neighborhood canvas will be performed starting on april 18th."], ["TN0004", "04-17-2011", "Closed", "", "", "", "vehicle information only"], ["TN0003", "04-17-2011", "Closed", "", "", "", "knife recovered by search team, recovered by THP Brad Lund and submitted to tbi for evidence testing. Knife appears to have been there for some time."], ["TN0002", "04-17-2011", "Closed", "", "", "", "evidence found not associated with case"], ["TN0001", "04-17-2011", "Closed", "", "", "", "Command Post arrival on scene"], ["TN0171", "04-17-2011", "Open", "Routine", "", "Phone Call", "Jodi Jones called (731) 967-3834 and stated that she and her husband were on a trail in Henderson TN and noticed a clean SUV parked on the trail with noone inside TN tag #315-DJG out of McNairy Co. This occured on the day HOlly went missing between noon and 1pm and they noticed two sets of footprints leading from the vehicle"], ["TN0172", "04-17-2011", "Open", "Routine", "", "Phone Call", "Trent Blankenship called (731) 847-2882 and stated that he works at a shop about 2 miles from where holly went missing. There is a teenage male individual who walks by the shop and has a particular pattern everyday. The day Holly wend missing he came from that particular area. He does have a criminal History."], ["TN0173", "04-17-2011", "Open", "Routine", "", "phone call", "Several psychics on Facebook have said that you will find Holly's body in a container, dumpster or shack off Brody Landing Road in Janette TN"], ["TN0173", "04-17-2011", "Closed", "", "", "", "psychics"], ["TN0174", "04-17-2011", "Open", "Routine", "", "", "Anonymous female caller stated there is a male white subject on the FBI's most wanted website by the name of David Anthony Durham and he wears camo"], ["TN0175", "04-17-2011", "Open", "Routine", "", "", "Female caller from California stated that she believes Holly and the suspect are at a cabin (with a boat) 88.4 miles west of Redbud Lake.  Also stated Holly should know her suspect from High School and he is probably a distured military man.  Information came to caller when she picked up a map"], ["TN0174", "04-17-2011", "Closed", "", "", "", "information only"], ["TN0175", "04-17-2011", "Closed", "", "", "", "psychic"], ["TN0176", "04-17-2011", "Open", "Routine", "", "", "Anonymous female caller stated that there is a Facebook page called Bring Holly Bobo home safe and on the site there is a guy named Glen Adams from Jasper Georgia.  After everyone's comments he has either something mean or weird to say."], ["TN0177", "04-17-2011", "Open", "Routine", "", "", "Member of one of the search teams (Michael Stone 731-343-0895) stated that the team saw a sock on the side of the road and they decided not to pick it up because they figured law enforcement was working so many leads and it is probably nothing. He stated it has weighed heavy on his mind and he did take a picture. He wants someone to call him back so he can email someone the picture.  The sock was left at the scene"], ["TN0178", "04-17-2011", "Open", "Routine", "", "", "Several callers stated there is a craiglist listing for two ATV tires for sale. The posting went up at around midnight and states they are new tires for $100 and he needs them gone. The tires appear to be used and it is in the Parsons TN area.  The listing number is 25-12-9111 and the poster's phone mumber is 731-845-4760 (the zero is spelt out)"], ["TN0179", "04-17-2011", "Info Only", "Routine", "", "", "Received call from Grady Calmes (843) 623-6309 who stated that we need to look at other cases such as Bernice Cutshaw (unsolved cases where the victims were about the same size and features as Holly)"], ["TN0176", "04-17-2011", "Closed", "", "", "", "Facebook"], ["TN0180", "04-17-2011", "Open", "Routine", "", "Phone call", "Retired Marion County officer Rick Stokes (423) 280-1234 called regarding Holly's facebook page. He stated that if you go to her page, look up a female by the name Denise Stokes (no relation to him) and then look down from her you will see profile of a man by the name Dylan Raney. He is wearing hunting camo amd lists his favorite movie as Hangover 2. This happens to be the same movie as Holly's. May not be anything he said but something to check into."], ["TN0180", "04-17-2011", "Closed", "", "", "", "facebook lead"], ["TN0181", "04-18-2011", "Open", "Routine", "", "phone call", "Psychic from Boston Mass called because she prayed for God to receive information regarding Holly. Psychic state Holly is still alive and is being held for ransom. She stated that Holly has a wealthy aunt that is ill and the suspect wants money before the aunt dies. Psychic also feels the brother knows more than he is telling and a \"brother-in-law\" keeps popping up. Psychic keeps calling with additional info. states that the ransom is not much $10,000 and the aunt is out of state. Holly is allegedly sitting in a chair but in a catatonic state. The area she is in is damp and Holly sees a frog.  The city Holly is in has something to do with the Civil War. Suspect is not in the house but has left."], ["TN0181", "04-18-2011", "Closed", "", "", "", "psychic"], ["TN0182", "04-18-2011", "Open", "Immediate", "", "Phone Call", "Jennifer Delosh (731)733-0598 called and stated that she left her home on the day of the kidnapping at 7:20 am. She lives at 2680 Myracletown Rd (one road over from Holly's residence). She stated that an older purple Mustang with a black strip came up behind her going really fast. Unknown suspect continued to follow her until they came to a four lane road in which the suspect passed her and sped off. She could not see if the driver was male or female but thinks it was a male. She is scared so she is staying at her parent's (address not givens)"], ["TN0183", "04-18-2011", "Open", "Routine", "", "email", "This is probably nothing but my friend's uncle has been missing for over a week. He works at the Walmart in Millington, TN. He somewhat fits the description of Holly's abductor. His name is Michael Hilton and he is 6'2  165 lbs. I do not want my friend to know that I am suspicious of him- it just seemed a weird coincidence that I should report.\n\n \n\nThank you,\n\nChristy Lou Lau\n\n(901)-483-4127"], ["TN0184", "04-18-2011", "Open", "Routine", "", "email", "Email tip-was a councelor at Camp Makanawa(all girls camp) in Crossville. 5 or so years ago food was being stolen from the dining hall. Later in teh sumer a man was arrested who had been living in the woods all summer. He was a former Navy Seal and had survival training. Lots of camp stuff was found at a site in the surrounding woods where he had lived.  Felt this was eerie since the man had been watching the campers and counselors and the guy in this case came out of the woods and could have been watching the family (no contact info given other than email address of dejdobbs@aol.com)"], ["TN0185", "04-18-2011", "Open", "Routine", "", "Phone Call", "anonymous call from female stating she and her family were fishing last night (4/17) at the Browns Creek Lake in Natchez Trace Park. Caller stated that if you were at the boat ramp and look out you will see an island in the middle of the lake.  Looking to the right of the island the caller stated she saw a green flat bottom boat with no motor.  The caller stated the only vehicle around was her brother in law's. Caller stated there is a path that goes from that boat into the woods. Caller has been worried about this boat and states that there would be no reason to have a boat that you would have to paddle all the way to the island...you would want a boat with a trolling or outboard motor. Caller wasnt sure if boat was being used by search team. Her and family departed lake at 7:30pm"], ["TN0186", "04-18-2011", "Open", "Routine", "", "interview", "(Possible linked to incident 103) Dickson County lead-Lead came in regarding an attempted sexual assault of Markitta Kennedy in Dickson County on April 7, 2011. SA Joe Craig spoke with Ms Kennedy and she stated that on April 7, 2011 she was walking to her residence when she was approached by a large (app 260lbs) white male with short dark hair driving a greenish/blue two door car. Ms. kennedy states he was asking for direction to a tattoo shop in the area. Ms. Kennedy stated the suspect had a business card for one of the shops and when she lead in to get a better look at the card. Ms. Kennedy stated the suspect asked her if she needed a ride home and she declined. At this point Ms Kennedy stated the suspect grabbed her right wrist. Ms. Kennedy stated when she leaned into the car it was \"nasty\" and then she noticed the suspect did not have on any pants and was exposing himself to her. Ms. Kennedy stated she called the suspect a \"freak\" and ran to the nearest residence. When asked if she could provide any other information she stated the suspect had \"fat\" fingers"], ["TN0281", "04-18-2011", "Open", "Routine", "", "", "This person was traveling I-40 heading west and saw a white bundle between mile marker 285 and 295 on the side of the road.  She stated it was big enough to hold a person.  The time she saw this was about 0500 or 0530.\n\n\n\nNicole Binstock - 405-388-3078"], ["TN0187", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "A female individual called in wanting to remain anonymous and stated she lives in Florida. There is a male individual that lived in Florida that is on the National Sex Offender Registry. His nameis William Kenley Reavis, DOB: 08/21/1943 and DOC# 899734. He would travel without registring. He is from TN and did have a SUV type vehicle. He lives in Hayesville, NC. Caller felt this would be someone that needed to be looked into. Her phone number is 239-269-2766."], ["TN0193", "04-18-2011", "Open", "Routine", "", "TBI Find", "Call came in from:  615-889-8080\n\nCaller:  Lorrie Marshall\n\n\n\nCaller stated that upon reviewing her 2009 1040 tax instructions, she came across (on page 20) a picture of a missing and exploited child named Halle Bobo, age 12, blond hair, blue eyes, who was abducted from Arkadelphia, AK in May of 2005.  She said she doesn't want to waste our time, but because the name was so close and they both had blonde hair and blue eyes, she wanted to let us know about this situation.  She said in Maury County TN, close to Columia, there are known survivor groups/religious/Nazi groups.  She said that she wasn't sure if the mother's boyfriend might be of interest, but, that we should check out all leads and that several little girls have been abducted and these people in this area are known to be trying to start a cult commune.  She stated that if you go East out of Parsons - East on Hwy 100 towards Centerville, there is an Arkland in Maury County.  She wonders if this is just consequence or if it should be checked out.  \n\n\n\nMs. Marshall said her phone number is 615-430-0712."], ["TN0188", "04-18-2011", "Open", "Routine", "", "TBI Find", "An individual by the name of Michael called in from Gulfport, MS. Stated pressure needed to be put on the mother. He feels the mother knows who did it. Michael stated he helped to solved the homicide of the 2 children of Susan Smith that put her children in the water and drowned them. His number is 228-234-6848."], ["TN0286", "04-18-2011", "Open", "Routine", "", "", "Linda Goff - 731-614-5023  called.\n\n\n\nShe stated a friend called to tell her about a man that was known to hang around the Post Office in Scotts Hill, TN.  They described the man as \"creepy\", acting odd and one that just didn't fit into the community. \n\n\n\nHis name is Donnie Burgess and was staying at 10114 Highway 114 in Scotts Hill, TN.  This property is owned by Jeffrey Whitehead.  Donnie Burgess has not been seen around the community for several days.\n\n\n\nThe caller also said she thought Donnie Burgess stayed with a cousin named Judy Branch who lives in Greenville, TN."], ["TN0282", "04-18-2011", "Open", "Routine", "", "", "Linda Goff - 731-614-5023  called.\n\n\n\nShe stated a friend called to tell her about a man that was known to hang around the Post Office in Scotts Hill, TN.  They described the man as \"creepy\", acting odd and one that just didn't fit into the community. \n\n\n\nHis name is Donnie Burgess and was staying at 10114 Highway 114 in Scotts Hill, TN.  This property is owned by Jeffrey Whitehead.  Donnie Burgess has not been seen around the community for several days.\n\n\n\nThe caller also said she thought Donnie Burgess stayed with a cousin named Judy Branch who lives in Greenville, TN."], ["TN0189", "04-18-2011", "Open", "Routine", "", "TBI Find", "Male individual called from Benton County, TN (phone 731-220-2712)and wanted to know if an individual by the name of J C Bruce had been checked out. He is a known abuser of women and has served time in Prison. His family has also been in prison. They have killed people and then burned the house down. J C had a girlfriend at one time and she had last been seen with him and then she's never been seen since. He's also kidnapped other female individuals. This individual is out of prison now."], ["TN0190", "04-18-2011", "Open", "Routine", "", "", "Male individual called from IL ( 309 657-1198 )  he saw the story on Good Morning America today.  He advised that the roof looked new and had we check out the roofer.  Also suggested we check out the direct TV person."], ["TN0191", "04-18-2011", "Open", "Routine", "", "TBI Find", "Donald Chastain called from 901-483-7940. Stated he has a sister that lives approximately 5 miles from the victims residence. Stated sister lives at 2331 Halls Creek Road. Stated a hermit from E. TN just bought the house next door and the family has had some strange vibes from him. He goes by the name of Kirk. Mr. Chastain stated this person may not be involved but they find it odd he's moved into the house and does not hunt or fish and stays to himself."], ["TN0195", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Caller:  Frank Wengler from Aurora, Nebraska\n\nPhone no:  402-737-3368\n\n\n\nMr. Wengler was watching his local TV station and saw something he felt was very odd.  Mr. Wenger noticed that one of the ATV drivers who was supposed to be helping out with the search for Holly Bobo turned and spit on the patrol car.  He thought this showed suspicion and lack of concern from both the victim and the law enforcement attempting to find her.  Mr. Wengler wanted us to run back the tape of this, check out who the individual was and check him out, that he might be part of this abduction."], ["TN0192", "04-18-2011", "Open", "Immediate", "", "Email to Pam Beck", "Pam Beck received an email from Judy Stevens with the Benton County SO. Stated that Jason Nickell was arrested Friday night at his Benton County home which is in Holliday, TN by the Jackson Police Department for stalking. She just found out that Dickson County SO also has a hold on Nickell for indecent exposure and Camden PD has an ongoing investigation of exposure where Nickell is the likely suspect. Ms. Stevens feels that Mr. Nickells is on his way to doing something bad and felt TBI needed to know. She can be reached at the Benton County So at 731-441-2731 or 731-584-4632."], ["TN0194", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Call came in from:  519-432-1584\n\nCaller:  Cheryl Allan\n\n\n\nFemale caller from Canada.  Said that this case has had her attention and concern.  She said there is a HOLLY BOBO FACEBOOK WILL FIND YOU PAGE and that she was looking over it.  She said that there is a guy named Todd Casey who has a page that is being very aggressive with people who continue to post on this page.  She said that his picture looks like something from the JackAss sitcom.  She doesn't believe it's a real picture.  \n\n\n\nMs. Allan stated that he continues to aggressively tell others who are posting that this is a RECOVERY and stress that.  She said that his favorite quote on his page reads....\"When the world is mine, your days shall be quick and painless.\"  \n\n\n\nShe doesn't know if this will help, but, said she just felt she had to tell us about it and hopes that we care able to check this out and hopefully find out if he is part of this problem.  She said that his page says he's from Bluff, KY."], ["TN0196", "04-18-2011", "Open", "Immediate", "", "TBI Find Line", "Phone call rec'd from Ms. Robin Stanfill who asked to be kept confidential because she didn't want to upset her daughters. Ms. Stanfill stated her ex-husband lives in Decautur County. She said they have triplets together, age 14. Ms. Stanfill stated that her girls told her about 2 months back their father took them to roll yards taking them to the home of Holly Bobo along with other homes. They were unaware of why because she was not one of the people who he or they normally hung with and they did not know her. When the news showed this girl and where she was from, Ms. Stanfill asked her children if they knew her. They told her about this situation of rolling yards and laughed about the fact that they tripped on a wire or something at this house. Ms. Stanfill was unaware if they ever acutally rolled the yard or not. Ms. Stanfill stated that her ex's name is Jason Baine and he lives with his mother on Iron Hill Road. She said he also has a trailer that is usually empty in the same area on the same road, but he does not rent it out. She said that Mr. Baine has an ATV, rides that area alot, and also hunts and ride horses there. She said he is very violent and that he used to threaten her all the time telling her that no one would ever find her because of the terrain and the Tennessee River, if he decided to take her out. She said that when this came on the news, her ex actually called her girls to remind them that this was the girl who's house they'd gone to roll. She also stated that this was about the time that Mr. Baine would have been scheduled to have exchanged his other child in Chesterfield that morning. She stated that Mr. Blaine is obsessed with blondes. Ms. Stanfill described Mr. Baine as being about 5'4\" tall, dark with black hair and age 36."], ["TN0197", "04-18-2011", "Open", "Routine", "", "TBI Find", "Christina Knight called from 731-487-7279. She stated she lives in Gibson County in Dickson. She saw a vehicle yesterday in the area of Hunter Jones Road on a gravel road. She saw a newer model Ford F-150 pickup, red in color. There was a male individual wearing a camo hat and shirt and had a whitish grey beard. He had a tall construction bag and was dragging it into the woods. She did not get the license plate of the vehicle."], ["TN0201", "04-18-2011", "Open", "Routine", "", "TBI Find Line", "Call rec'd from Brenda Conrad of Decatur County. Ms. Conrad stated she hesitated to call because she didn't know how significant this might be. She stated her cousin, who's name she did not give, and who now lives in Nashville, formerly rented to a guy named Jonathan Mayes, who has felony charges due to drug involvement. She stated that Mr. Mayes was a former convict and now out of prison. She said her cousin would not call us because of issues their own family had been through with corruption with the officials of Decatur County. Ms. Conrad stated she had seen her own father's crime scene destroyed right before her eyes. What she wanted us to know was that her cousin had told her that there is a cabin near Natchez Trace that intersects with the Bible Hill area. She said sometimes this area is called 5 Point or 5 Fork because of how it intersects with so many other large areas. She stated that not only her cousin but many other people in Decatur County are upset and yet afraid to talk because they are either arrested or said to be crazy when they do. She stated that it's very upsetting that Decatur County is being said to be a crime-free community when they really aren't. She also stated that there is a lady who is working with this search who is being totally ignored by the county officials when she trys to give information that might be helpful. Ms. Conrad stated she is currently unemployed because of the issues associated with Decatur County and her family and is hoping that some of the local churches will help her find a way to get out of this place. She hopes this cabin and Natchez Trace area will be checked out."], ["TN0198", "04-18-2011", "Open", "Routine", "", "TBI Find", "Doris Bennett called from 805-227-4457, Paso Robles, CA. She stated 3 days ago she was at the Kohl's located in the Woodland Shopping Center on Nibleck Road and swears she saw Holly in that Kohl's store. She first thought it was her granddaughter and then saw the story about Holly and now swears it was Holly."], ["TN0202", "04-18-2011", "Open", "Routine", "", "TBI Find", "Received Called from psychic ( 304 924-9347 ) she stated that the victim (Holly) is face down in a shed, South East of Parsons, close to the river.  She does hear water.  Offender is a W/M with dirty Brown hair, with some teeth missing, Has a blue officers shirt with letter D ( maybe for Dean)  .  He works at a garage .  She see 2 garage doors."], ["TN0200", "04-18-2011", "Open", "Routine", "", "", "Lisa Russell (615.498.6629) has medidated and sees a cross tattoo with RE5 on it. She found it on the internet and there is a video game called RE5 and people are getting their tattoo. She thought we should ask the brother and/or some of her/his friends if they know anyone with an RE5 tattoo."], ["TN0199", "04-18-2011", "Open", "Routine", "", "TBI Find", "Pat Sullivan from 602-471-0620 called and stated he saw a movie several years ago and states the movie made him think that the person that did this is close by and the search teams should be looking underground possibly and underground tunnel. That Holly will be in there."], ["TN0203", "04-18-2011", "Open", "Routine", "", "TBI Find", "Female called from 714-956-2906 and stated she was reminded of a case in which a guy kidnapped a girl and held her in the woods underground. There was a bunch of brush, etc on top of the underground tunnel and search teams need to be looking for anything underground."], ["TN0323", "04-18-2011", "Open", "Routine", "", "interview at his residence", "Shayne Austin, DOB: 11/14/1984, SSN: 411-63-9675, CELL: 731.733.6373; was interviewed at his residence 30 Yellow Spring Rd, Holladay, TN; on . Austin moved into the trailer approx. 1 month ago and purchased the trailer and 4 acres of land for $20k. He works at the adult bookstore, located at exit 126 of I40, and began working there approx. 2 wks. ago. He did not work on Wed or Thurs of last week (4/13 or 4/14). He woke up Wed, straightened up the house and may have gone fishing. He heard about the missing girl, but didn't know anything about it. He didn't know Bobo. When asked, he said he'd like to put a few rounds from his rifle in the person. Austin had a loaded SKS-type rifle leaning on the couch when agents entered the residence. He advised the remainder of his guns were at his mom's in a safe. Austin noted he received the existing abrasion/injury under eye as a result of getting in a fight with Zach Adams, over at 'Miss Dottie's'house. Austin said 'Miss Dottie'is associated with Dottie's Marine. Austin stated approx. 2 yrs ago he took classes at Jackson State, specifically Anatomy and Physiology. He currently has a drug problem and no driver's license. He owned a 1995 Chrysler New Yorker, silver in color, that had been at 'Smitty's'shop since last summer. He stated his ex-girlfriend, Brandy Williams, was currently trying
