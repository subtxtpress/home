en."], ["TN0335", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0334", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King"], ["TN0333", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0338", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0339", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0407", "04-19-2011", "Closed", "", "", "", "TBI SA Jeff Jackson met informant at Florida and 7th on 04/19/2011 at 21:49 hours. Informant did not want to give his name, but was driving a White Van. SA Jackson and other officers checke 173 Whiperwill, Decaturville 38329 and interviewed Robert McCoy, DOB 01/24/1971, SSN 262-35-5866. McCoy stated the chains were in the house when he moved in. He took all that down. He gave officers consent to search. Officers searched the entire house, attic, and out buildings. No evidence was found. Event closed by SA Jackson."], ["TN0336", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0332", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0331", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0302", "04-19-2011", "Closed", "", "", "", "Nickell is in custody on other charges. Event closed by Officers T. Wilson and T. Nolen."], ["TN0150", "04-19-2011", "Update", "Routine", "", "", "FBI SA Saltsman and Vargas made an attempt to located a Kevin Dickson in the Parsons area. An address was listed at 1039 Iron Hill Road, but no house exist at this address. A phone number was located but is not associated with Dickson. Further identifiers needed."], ["TN0209", "04-19-2011", "Update", "Routine", "", "", "FBI SA Michael Saltsman went to Johnny's Bar and Grill in Sugar Tree, TN. The bar was closed, but SA Saltsman knocked on the door but there was no answer. Needs follow up."], ["TN0158", "04-19-2011", "Update", "Routine", "", "", "FBI SA Saltsman and Vargas called phone number 731-211-3003 and learned this is a non-working Verizon wireless number. SA Vargas called phone number 602-7950 and left a message to return her call."], ["TN0411", "04-20-2011", "Open", "Routine", "", "SA Russ Winkler", "last night (4/19) Donna Anderson (731-441-4096) from Camden reported by telephone that the other day a friend of hers texted her saying that J.C. Bruce works for Holly's Dad, and that on the day before Holly's kidnapping J.C. Bruce and her Dad got into an argument. Donna Anderson would not name her friend, but said that she works as a bartender. I told Donna Anderson to save the text message"], ["TN0412", "04-20-2011", "Open", "Routine", "", "Phone call", "Received a call from a gentleman named Dewight Comer who stated about 11:00 am yesterday April 19 around 11:00 am he heard another gentleman on a CB  radio talking about Holly Bobo.  The man on the radio was saying that he heard on the Nashville news that Bolo had been found in a cabin locked in the closet at the Eagles Nest Camp ground.  He also said that the guy had been caught through a cell phone and that she was OK, had not been raped or hurt.  \n\n \n\nThe caller (Dewight) said that he was N95, while this guy was on the interstate traveling through Jackson.  Dewight  said he new this had to be incorrect information, because a few minutes later the news in Jackson came on asking for assistance.  He also said he remember their was Eagles Nest Campground near Decatur CO.  \n\n \n\nDewight's phone number is 662-603-5658"], ["TN0413", "04-20-2011", "Open", "Routine", "", "phone call", "A lady called and said she wanted to remain anonymous (number called from 615-791-1063).   She said that her 2 9 year old kids had wander farther up the road that they normally do.  The kids told her that they heard  someone scream like they were afraid.  This happen on Dale Ewing RD by the Natchez Trace Bridge Hwy 96 W."], ["TN0414", "04-20-2011", "Open", "Routine", "", "Telephone", "Caller Holly Ferris 615-823-3297 stated that when she was at the Flying J gas station (near exit 86 or 87 (to Fort Campbell) a dark skin, heavy set, mid 20s male in a black sports car (wearing military issue light green camo)asked where the Lowes was and she told him it is at exit 4. The man then asked for her telephone number \"just in case he got lost\" but she refused to give it to him. He then told her that he may \"want to take her to dinner\". Ms. Ferris stated she had a very weird feeling about this man because he was pretty insistant on getting her contact information. She is a blonde."], ["TN0416", "04-20-2011", "Open", "Routine", "", "Telephone", "Caller Jack Smit 941-488-8266 stated he and his father saw a woman who was cleaning jewelry outside of Kay's Jewelers in the Sarasota Square West Field Mall in Florida. He stated she looked exactly like Holly Bobo."], ["TN0415", "04-20-2011", "Open", "Routine", "", "TBI FIND", "Internet Posting - www.examier.com  posting from a Wally Lidberg over 200 letter posting.  Has lots of details.  Call received from James Wilson 423 304-5089."], ["TN0415", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell"], ["TN0417", "04-20-2011", "Open", "Routine", "", "TBI FIND", "Retired MA Major Dan Kobowski 978-363-5775 - called and advised MA has a similar case 10 years ago.  Victim Molly Bish - girls look alike.  same age.   \n\nHe has advised the following numbers - LT Alben 508 820-2344 - LT Hiorns 413 243-0600.  SAC Jerri Powell advised to refer information to SA Louis Kuykendall.\n\nSA Kuykendall called Dan Kobowski and he advised since similar in the cases TBI should contact Lt Alben or Lt Hiorns. SA Kuykendall advised me to close this lead."], ["TN0418", "04-20-2011", "Open", "Routine", "", "", "New York Police Officer 516-510-9988 stated the investigation needs to look into the white slave trade and having Holly moved towards Arizona."], ["TN0420", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Female individual called from number 651-739-2090 to advise she lives in Minnesota and was driving on Hwy 694 when she saw a black vehicle with a license plate of Bobo. She called the local authorities about it as well. She believes if the kindapper is obsessed with the victim he could have put her name on his license plate."], ["TN0419", "04-20-2011", "Open", "Routine", "", "Command Post", "SA Val Troutt contacted Sheriff Dickson on 4/18/11-a reg sex offender out of Carroll County was at Farmidol at Mallard's Rest at the same time as Holly. He was taking pictures with his cell phone. Wanted someone to talk to Brian Riggs and check his whereabout at 8am on 4/13."], ["TN0419", "04-20-2011", "Closed", "", "", "", "Assigned to Becky Keith and Inv Jackie Wallace-they talked to Brian at his residence 3801 WEstport Rd. Stated he was home on Wed 4/13 and around 7:30am he was helping his mother in the yard. Check him for cuts , marks or scratches on his arms, neck, chest or back and he had none. Lead is being closed"], ["TN0300", "04-20-2011", "Update", "Routine", "", "", "T Wilson and T Nolen interviewed Mr. Smith on 4/19/2011. Writer called this source speaking with her, at which time she advised she saw a female who she believes to be Holly Bobo. The females filled out and turned application in to Hard Rock Cafe. Source is sure the female was Bobo. The female appeared to not be in any danger. Spoke by phone. In person visit is needed."], ["TN0421", "04-20-2011", "Open", "Routine", "", "Road block interview", "Linda Quinn TNDL 042685682 interviewed by Lt Paul Donaway during roadblock at TJ evans & Prospect-stated on Friday 4/15 at 6:45 am she noticed the door was opened on new prospect missonary baptist church"], ["TN0420", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Out of state."], ["TN0428", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Female called and stated to possibly use a Kelli Faulkner to assist with the case. Kelli is a spiritual messenger and helped the caller find her brother when her brother went missing and Kelli helped to find him. Kelli can be reached at 260-432-7986 and her website is www.kellifaulkner.com. No caller ID information came up for the individual that called."], ["TN0422", "04-20-2011", "Open", "Routine", "", "SAJack Vance", "James s Spence Jr (TNDL 49625219)stated that someone called him by mistake on the evening of 4/19 wanting to sell their truck and the caller lived in this area."], ["TN0337", "04-20-2011", "Update", "Routine", "", "", "Refer to search team for follow-up."], ["TN0423", "04-20-2011", "Open", "Routine", "", "Lead sheet", "Received lead sheet obtained during Road Block that stated a Green mustang had been spotted in the area of the abduction for approximatley 4 wks prior. (200 Swan Johnson Rd) Car was driving by a white male and was seen every morning around the same time (6:50-7am).  Car has not been seen since Holly's disappearence. Lead has the name of Lynn Walls with a contact number of 617-0386"], ["TN0425", "04-20-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Marion Tyler aka 'Duke'ph# (803) 564-5201 on 4-20-2011 at 10:05 am.  Duke stated that he is working with Jessica and they wanted to fax TBI a map of the Abductor's house.  He stated that he is interested in the reward.  I asked him how he knew that it was a map of the abductor house.  He said that 'he didn't want to say but all would become clear when the fax came inåÓ.  I gave him fax number (615) 744-4655.  Received fax from Jessica and Duke Tyler of a google map depicting possible adbuctor Terry Britt (sex offender).  The address listed for Terry Britt is 3138 Jeanette Holladay Rd. Parsons, TN 38341.  The map also shows the distance from Britt's home to the Bobo Home. Included on the fax is Duke's email address kosterbrown@pbtcomm.net"], ["TN0424", "04-20-2011", "Open", "Routine", "", "Telephone", "Caller 413-658-8439 stated she found an online post on www.onlinejournal.com/artman/publish/article_8617.shtml which reads:\n\n\n\n'Kat \n\nSearch shafts in ground around water, covered by wood pieces and debris. \n\nAlso, I believe that this guy knew her. She liked someone he knows. THis guy knows the forest area and hunting. Is there not a military engineer group around where she is. Either way, had a dream that she was driving with someone she knew. She really liked or someone really liked her but this guy is the acquantance to him. In a wood shelter in the ground, near the water. Maybe get someone who really know that area and military to give you help. Hope to have another dream tomorrow. 11 hours ago.'Possible psychic lead."], ["TN0424", "04-20-2011", "Closed", "", "", "", "Per SAC Powell. Psychic lead."], ["TN0411", "04-20-2011", "Closed", "", "", "SALocke", "SAC John Mehr spoke with DAna Bobo by phone on 4/20/11. Dana Bobo advised he did not have any arguments with anyone the day before the incident"], ["TN0426", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Private investigator Theresa Tibbs out of Lexington, Tn (731) 571-5131 called to advise the brother may have been involved in some type of drug activity. The sister may have been aware of this and she was trying to help her brother. She may have been used as a payment.  Inv. Tibbs advised to check in the two-foot area(a black community dealing in drugs).  The two-foot area is located behind the Tipp Topp Market Shell at 377 Tennessee Avenue South, Parson, TN."], ["TN0427", "04-20-2011", "Open", "Routine", "", "800 TBI FIND", "Woodrow Mayo - (731) 852-4650 home or (731) 733-3100 - Advised that he has a customer by the name of Mark Mays that lives at 695 Evans Town Road, Parsons, TN. Mr. Mayo advised that he is acting very agitated, very hyper, bitter and hostile. He was not home last Tuesday when Mr. Mayo normally picks up his trash. Mays called Mr. Mayo on Saturday and was very indignant and accused Mr. Mayo of driving by his residence. Mr. Mayo stated he drove up into the driveway and Mays was not at home. Mr. Mayo stated Mays lives by himself and the residence is close to the home of the victim and where the lunch box was located. Mr. Mayo still has the trash on his truck that he picked up from Mays if anyone wants to look at it. Mays is described as being a w/m 5'10 to 6'0 and is in his late 30's early 40's with a stocky build and graying hair."], ["TN0510", "04-20-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "Doug Houston TIES", "Received call from Decator Co 911. They recieved a call from a Terri Campbell 712-309-2597). Caller stated she is getting e-mails from a Wille Limburg saying that he has Holly Bobo.  Caller also stated she has gotten 30 e-mails just today."], ["TN0429", "04-20-2011", "Open", "Routine", "", "", "The following is a text sent from Holly Bobo (1494882246)to Natalie Bobo (615715089) on 01/21/2011 at 20:40:09 UTC:\n\nListen Natalie I know nobody is supposed to know where u r or anything but u really needa listen to me. plz come back this is serious If u told u did ppl r WATCHING u wat do u think that means! Do not ignore me! i don't want this to me the last tiime i talk to me damn cousin!!! I'm serious. Mom has just told me where u are and i have been cryin! Plz talk to me. This is serious natalie people are not like us u dnt even know wat uve got urself into. nobody kknows i'm messagin u so plz call or txt me i'm beggin u natalie i'm so upset right now i can't lose u!"], ["TN0428", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Physic."], ["TN0431", "04-20-2011", "Open", "Routine", "", "Fax from America's Most Wanted", "America's Most Wanted faxed over information they received on this date. AMW received information from a Sanford Shirk of 2888 Locke Hollow Rd in Dickson, TN with a cell phone of 615-829-9955 and a home phone of 615-441-5217. He stated he lives off I-40 at exit 163 about 2 counties away from the incident. He found a pair of female panties, red in color, silky type fabric, with a little lace, and size 7. There is a handwritten name on the front written in black marker that states \"Tonya 2000\". He doesn't know if they are related to the Bobo case, but he called local law enforcement who responded and collected them under 20110419-164, Dickson County SO. The item may have been dragged into the woods by a dog or other critter but he could not just do nothing. The case owner for AMW is C Thomas and can be reached by email at cthomas@amw.comor 240-482-1100."], ["TN0430", "04-20-2011", "Open", "Routine", "", "Lead Sheet", "SA Doug Long received info from k-9 search team that their dog alerted on house on Blankenship Rd Henderson Co."], ["TN0430", "04-20-2011", "Closed", "", "", "SA Doug Long", "Inv David Dowdy made contact with Jackie Blankenship 915 Blankenship Rd DOB 3-14-48 works at Vulcan Material in Parsons 5:30am-7:30pm M-F. Mr Blankenship had no info and Inv Dowdy searched area and found nothing out of the ordinary"], ["TN0347", "04-20-2011", "Closed", "", "", "", "close-info only"], ["TN0432", "04-20-2011", "Info Only", "Routine", "", "", "Investigator Donna Heatherington, Lexington PD, spoke with SA Brent Booth and reported that a subject at O'Reilly Auto Parts reported to Lexington Police Officers a white/male that looked like Holly's ex-boyfriend, came into the store yesterday and wanted to buy material to make a silencer. He purchased freeze out plugs for an engine block. (731-614-5341) 04/20/2011 at 11:08AM"], ["TN0342", "04-20-2011", "Closed", "", "", "", "close-info only"], ["TN0432", "04-20-2011", "Closed", "", "", "", "Per SA Mark Lewis to be closed."], ["TN0341", "04-20-2011", "Closed", "", "", "", "Close- info only"], ["TN0433", "04-20-2011", "Open", "Routine", "", "", "ASAC Stephen Phelps spoke with Michael Heidelberg on April 20, 2011 at 10:45AM. Heidelberg was \"hanging out\" at Decatur County Civic Center, stated he wanted to help. Stated that he knew Holly Bobo, but only been to Parsons three times. Right hand in cast  stated he broke his hand on WEdnesday, 13 April, while working at Wal-Mart in Lexington. TN DL 112206485, W/M, DOB 04/27/1990, SSN 409-69-6533. Information given to SAC John Mehr and SA Terry Dicus."], ["TN0434", "04-20-2011", "Info Only", "Routine", "", "", "TBI SA Kring, 04/20/2011, 11:07AM, spoke with Jerry Walsh, 2750 Conrad Ridge Road, 731-220-5098. Sex offender, Bo Buster, owns BTB Erotic Nights Toys, lives at 2720 Conridge Road. Is a sex offender. Owns 4 acres. Lives close to Bobo house."], ["TN0404", "04-20-2011", "Closed", "", "", "", "Close-info only"], ["TN0434", "04-20-2011", "Closed", "", "", "", "Completed by Marshals"], ["TN0403", "04-20-2011", "Closed", "", "", "", "psychic"], ["TN0435", "04-20-2011", "Open", "Routine", "", "Telephone", "Sally O'Hara 931-432-5708 (gets feelings) stated that the investigators need to look one mile west of the lunchbox and question the brother further. Holly will not be covered."], ["TN0435", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Psychic lead."], ["TN0436", "04-20-2011", "Open", "Routine", "", "TBI FIND", "Caller-David Brett can be reached at 731-267-8346. Mr. Brett stated that yesterday around 5:30 p.m. he was travelling on I-40 East between mile markers 83-93 and he noticed a very bad odor that he has never smelled before. Mr. Brett stated the wind was blowing really hard and the smell stayed with him for quite some time. Mr. Brett stated that he knew this was quite a distance from the abduction site but wanted to report it anyway."], ["TN0437", "04-20-2011", "Open", "Routine", "", "", "Caller-Brian Bain can be reached 731-614-0144. Mr. Bain stated that back in January/February at Scottsville High School BasketBall Game that Holly attended there was a white male that made a lewd comment about her. Caller doesnt know the persons name but may be on the video."], ["TN0439", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Leslie Noble 608-588-3475 called to state she had been working with a psychic and had the following information:\n\nThere are 5 people that took Holly. Her current boyfriend is in on it even though he has an alibi. She was immediately drugged. She has been sick and vomiting. Holly was still alive on Monday. The people involved don't want to kill her; it's just more of a vendetta to get money from the father. The father has something to do with selling pharmaceutical drugs illegally. Feels she was taken because the father owes them money. She does not think Holly will be harmed just drugged. Holly is in a shack somewhere."], ["TN0438", "04-20-2011", "Open", "Routine", "", "Email", "Crime Stopper Tip forwarded by Det Chris Locke (chris.locke@nashville.gov). The email reads \"the garbage man should be looked at. same as christa worthington.\""], ["TN0439", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Psychic."], ["TN0068", "04-20-2011", "Update", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Hall was interviewed by SA Cathy Ferguson at 9:00AM on 4/19/2011. Hall stated he and his wife, Amanda, left between 7-8:00AM n Wednesday to got o WalMart in Lexington. They paid for purchaes w/EBT card. Took groceries home, and back back to Lexington for Amanda's Quinco appt. He stayed in car. They wer ehome by 3-4:00PM. Confirmation of food stamp purchase at Walmart should be done."], ["TN0440", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Psychic Linda Perry (615) 719-3160 advised she met a homeless man named \"Wind\" last October in Nashville.  Wind advised he killed his family and them burned them. Wind wears camouflauge, white male, early forties with sandy/blonde hair, green eyes, greek nose, good looking, and a beautiful smile. Wind talked to her about all the homeless teenagers in Tennessee. He likes the singer Jonny Lang."], ["TN0394", "04-20-2011", "Closed", "", "", "", "close-intel only"], ["TN0392", "04-20-2011", "Closed", "", "", "", "closed-intel only"], ["TN0440", "04-20-2011", "Closed", "", "", "", "psychic call/close per SAC Powell"], ["TN0450", "04-20-2011", "Open", "Routine", "", "TBI FIND", "Caller-Kristin Latimer (step mother to Lee Baugus)wishes to reamin anonymous but can be reached at 731-441-4110. Kristin stated that Monday April 18 she,her stepson (Lee Baugus-Holly's ex-boyfriend before Blake Barnett),Amy Barnett(Blake's sister), and Joyce Cotham all went on a \"search\" for Holly. This search started at about 10:30 a.m. (started near Holly's house and went to Dogwood Lake)and ended around 7:30 p.m. (at Fairgrounds) Kristin stated that Joyce Cotham mentioned to her that Amy Barnet was constantly texting during the time they were in the vehicle and every time they stopped the car Amy would walk away from the group and would either make/recieve a phone call. Amy never commented on who she was talking to or what she was talking about. At some point during the search at Dogwood Lake near the Dodd property, the group noticed a really bad odor in the air. Amy had walked away from the group once again and was on the phone-then announced that \"they found her in a cabin at Natchez Trace and Jonathon Dodd had confessed\". Kristin stated that she was previously married to Alex Latimer (her daughter's father) and that Alex is an investigator for Camden PD and encouraged her to call us (TBI). Kristin Latimer did not provide Amy Barnett's cell phone number at the time of the call.\n\n731 549-7258."], ["TN0442", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Anonymous caller (731) 206-0017 advised a Shane Hart was trying to sell his 2001 Four Wheeler for $500 because he was in a bind. God told her"], ["TN0441", "04-20-2011", "Open", "Routine", "", "neighborhood canvass", "During neighborohood canvass Cathy Wise (731) 733-2090 was interviewed at 555 Swan Johnson Rd-Wise stated James Barnes, her son, heard screaming @ 7:30. Wise stated she then went over to the Bobo residence and Clint was there and told her that his sister was missing. Wise also stated son heard female screaming and it sounded like \"dont\" \"stop it\" and \"god damn stop it\" lasted about 45 seconds"], ["TN0443", "04-20-2011", "Open", "Routine", "", "Telephone", "Lt. Simmons 731-514-4644 was given the TBI FIND number through Jeff Jackson. He wants to speak to Mark Lewis regarding Subject Jason D. Cheek SSN 411-39-3087, address 190 Neelely Road, Paris, TN was arrested a couple of years ago for drug paraphernalia and stalking. He had in is his possesson a cell phone with over 200 photos of women (up skirt/panty type). One of the women photographed is Mallory K. Williams SSN 415-49-6675 (Mallory Williams Pate), who has a strong resemblance to Holly Bobo. Cheek stalked Williams. After arrest he stalked a women outside of a store. He is off probation."], ["TN0442", "04-20-2011", "Closed", "", "", "", "God told her/close per SAC Powell"], ["TN0444", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Female caller would not leave her name. Called from 484-619-4122. Say this may sound crazy but she feels Holly's body is 3 houses SE of her house, 5 miles off the man's property. There is a clearing and the ground is mushy. There are leaves and debris and she is under there. She also sees a dark haired man and a name of Aaron."], ["TN0431", "04-20-2011", "Closed", "", "", "", "AMW lead-info only"], ["TN0444", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Psychic."], ["TN0446", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Michael Shearer from California called from 707-943-3053. He stated he gets pictures in his mind that are uncannily accurate. He said he sees a green canvas jacket and a guy with scraggly hair that took her out into the woods around 5 Forks Rd (per google maps). There are dirt roads with an area that looks like a lighting strike. He sees upcropping in middle of road with a cave and rocks. In his mind, he saw the kidnapper rape and kill Hollly. He initially put her inside the cave but then took her up on a hill and buried her and then covered her body under brush. It is a dug out area to the right of the cave. The kidnapper thinks he got away with it. Caller still sees the jacket and the kidnapper is staying close to the house but getting out a little more each day building his confidence. The kidnapper ate breakfast today at a horseshoe type place. He saw law enforcement and law enforcement wondered about him."], ["TN0427", "04-20-2011", "Update", "Routine", "", "Telephone", "Caller Laverne Mangrum 731-847-4295 stated that her trashman, Woodrow Mayo 731-852-4650 was contacted by a man with the last name of Mays on Yellow Springs Road to come and pick up trash on Thursday April 14, 2011. Mays did not have any trash for the regular trash day (Tuesday). Mr. Mayo told Mays that he would have to charge him extra for the trip on Thursday but Mays declined. Mr. Mayo picked up three trash bags April 19, 2011 from the Mays house. Ms. Mangrum stated that Mr. Mayo has called the local police but when she spoke to Mr. Mayo 25 minutes ago, no one has come to look at the bags. He still has the trash bags in his shed for the police."], ["TN0445", "04-20-2011", "Info Only", "Routine", "", "", "04/20/2011 at 11:06AM, TBI SA Kring spoke with Karen Lancaster, 2609 Old Decaturville Road, Parsons, TN 38363, cell 731-234-6939, home 731-847-6726, DOB 11/18/1966. 7 years Ronald Kenner Sheriff. Worked at the cigarette and beer  store. He was white/male, 5'8åÓ, stocky, 55 yoa, big belly, blonde hair, long, bald on top, beard. She was scared/terrified of him. He undressed her with his eyes. He was driving a six-wheel white van. YMCA on both sides of van. He walked around the store, bought water, left, and came back in. He asked her to come out and help with his van. He asked her to get inside the van with him in the front seat to fix the wires. She did not help him and went back inside. A regular customer came in and helped her. He finally left after 10 minutes. Never came back in same vehicle. She felt it was strange. He was not local."], ["TN0445", "04-20-2011", "Closed", "", "", "", "information only"], ["TN0446", "04-20-2011", "Closed", "", "", "", "Close per SAC Powell. Psychic"], ["TN0447", "04-20-2011", "Open", "Routine", "", "TBI Find Line", "Marshall Janson called from 731-607-0159. Stated he was on Liberty Road on this date around Scotts Hill when he saw a suspicious person. Said it was just past the Liberty Methodist Church on the right hand side almost to Hardin County. Said there was a guy that had a little fire going and was burning something but could not tell what it was. It was at an old decrepid house. The individual was about 6'0\" and 200 lbs. The tag number on the vehicle is 764-SMR. This LEIC ran the tag and it comes back to a Jonathan Bivens of 75 Hannahs Loop in Sardis, TN on a 1986 Chevrolet S-10 pickup, no vehicle color given."], ["TN0405", "04-20-2011", "Closed", "", "", "", "SA Terry Reed and SA Colleen MacEachen left a message with Mr. Bright on 04/20/2011. The search team is searching the area."], ["TN0410", "04-20-2011", "Closed", "", "", "", "Closed per SA Reed and McEachen"], ["TN0402", "04-20-2011", "Closed", "", "", "", "Per SA Reed and McEachen-Park Manager stated not unusual and will check other cabins and info TBI if anything is unusual"], ["TN0286", "04-20-2011", "Closed", "", "", "", "SA Terry Reed and SA Colleen MacEachen went to the post office to get more information on Burgess according to the caller on 04/20/2011."], ["TN0409", "04-20-2011", "Closed", "", "", "", "SA Terry Reed and SA Colleen MacEachen - no number to follow-up with."], ["TN0400", "04-20-2011", "Closed", "", "", "", "Closed per SA Reed and McEachen"], ["TN0412", "04-20-2011", "Closed", "", "", "", "Closed per SA Reed and McEachen-area is being searched by volunteers"], ["TN0406", "04-20-2011", "Closed", "", "", "", "Closed per SA Reed and McEachen"], ["TN0291", "04-20-2011", "Closed", "", "", "", "Closed per SA Reed and McEachen"], ["TN0448", "04-20-2011", "Open", "Routine", "", "", "SA Ronnie Faulkner. While out at an accident scene on 04/20/2011, Ruth Burnett (731-549-4649) informed Investigator Vaughn that on 4/13/11 at 9:37AM. She received a call from (731-549-6740) stating, \"don't go home Holly has been kidnapped.\" Ms. Burnett asked who is this and caller replied they had the wrong number."], ["TN0049", "04-20-2011", "Update", "Routine", "", "Lead Sheet", "Registered Sex Offender Harold Mitchell B/M believed not to be involved. Alibi was verified with Mitchell's cousin, Terry Arnold cell #731-307-8100. Roger LNU was interviewed by USMS and verified Mitchell was with him Tue 4/12/11 and scraped Mitchell's car in Lexington"], ["TN0025", "04-20-2011", "Closed", "", "", "lead sheet", "No follow up needed- Joe Upton FBI and SA Dycus"], ["TN0447", "04-20-2011", "Closed", "", "", "", "intel only-closing for now"], ["TN0449", "04-20-2011", "Open", "Routine", "", "phone call", "Decatur County SO received a call from a female who identifed herself as a member of Blake William's family.  Caller stated his mother lives on Iron Hill Rd and Father is Floyd Williams who lives in Camden. Caller stated Blake floats between the two residence and she believes he had something to do with it."], ["TN0150", "04-20-2011", "Update", "Routine", "", "CLEAR search", "Kevin Dickson DOB is 8/28/81 ss# 413-45-1627 and his current address may be 1662 Hwy 301 N Lake Cormorant MS"], ["TN0451", "04-20-2011", "Open", "Routine", "", "TBI FIND", "Caller Curtis Tinin can be reached at 731-377-4710. Curtis called for anonymous female that gave him the following information because she is afraid of the individuals: Anonymous female stated that on the morning of the abduction at approx. 6 and 6:30 a.m. she saw Johnny Pardon and Bill Tucker at the BP Station in Perryville, TN East of Parsons 6-7 miles. The two were waering black t-shirts and camoflauge over-alls and camo bandanas on their heads. They were in a black pick up truck with a 4-wheeler in the back. Mr. Tinin stated the two individuals were drug dealing thugs and that everyone in the area knew of the criminal history and he thought that they are very capable of commitited the abduction."], ["TN0452", "04-20-2011", "Open", "Routine", "", "phone call", "Decatur CO 911 received a call from a concerned citizen regarding Jody Troxler 1200 Gilbert Rd.  Caller stated he had been out of town in Tunica but caller does not believe him and feels he needs to be check out.  According to DL his given name is Joseph Shawn Troxler DOB 1/21/1972 TNDL 070289024."], ["TN0453", "04-20-2011", "Open", "Routine", "", "", "04/20/2011, 1500 hrs, SA R Faulkner spoke Trooper Atkinson and SA Lewis and he reported that his cousin, Bethany Woods, and her husband, had contact with Jonathan Dodd while they were searching and hew as acting suspicious. On 04/20/2011 at approximately 2:50, SA Faulkner spoke with Bethany Woods by cell phone, she gave the following information. Last Saturday morning, 04/16/2011, she and her husband and two other people were out searching in the Bible Hill area. She saw a white Ford ranger with a bed cover come by slow, two times that morning. According lunch they had stopped and the same Ford Ranger stopped and questioned them about if they had found anything and if they had heard anything. One of the guys joked that Holly could be under his bed cover for all they knew. The driver of the Ford Ranger did not show any emotion and seemed uncomfortable. Ms. Woods was looking on facebook last nigh after hearing about Jonathan Dodd being questioned and she recognized him as the driver of the Ford Ranger."], ["TN0209", "04-20-2011", "Closed", "", "", "SA Simmons", "SA John Simmons & SA Pate met with Benjamin Ragsdale at 16752 Birdsong Rd Holladay TN. He is dating Brittany McKinney who is Donnie McKinney's daughter.  Both confirmed that Donnie McKinney stayed with them at their home from the morning of 4/11/11 thru 4/19/11. Each advisd on 4/13/11 at 8 am Donnie was at their home in bed still asleep. Lead closed"], ["TN0358", "04-20-2011", "Closed", "", "", "SA Simmons", "SA SImmons and SA Pate went to location, collected gloves and discover reason buzzards were circling was due to two dead dogs in the area. Tip closed"], ["TN0418", "04-20-2011", "Closed", "", "", "", "Investigative technique, closed"], ["TN0413", "04-20-2011", "Closed", "", "", "", "TBI SA Doug Page spoke with Ms. Smith and no follow-up is necessary."], ["TN0414", "04-20-2011", "Closed", "", "", "", "Flying JIm, Clarksville, would have transaction information if develops as a person of interest. SA Doug Pate spoke with caller. Lead unfounded. No follow up necessary."], ["TN0454", "04-20-2011", "Open", "Routine", "", "", "SA Doug Pate received information regarding 3 caves on Cub Creek near its intersection with Bible HIll Rd. Hand drawn map on back of lead sheet."], ["TN0455", "04-20-2011", "Open", "Immediate", "", "", "SA Doug Pate spoke with Roy Lee Hutts, 4230 Hwy 100, Decaturville, TNDL 070996421, home 731-852-2484, cell 731-733-1347. Hutt's daughter-in-law's mother, Linda Tucker, sold property to Grafton Dodd on Whites Creek on the TN river. Dodd has a single wide trailer there that Jonathan Dodd is known to take females to. Hutts described the area as down Mr. Carmel Road, just past store turn left, follow the river and turn right. Probably next to the last trailer."], ["TN0454", "04-20-2011", "Closed", "", "", "", "Wildlife is searching caves."], ["TN0426", "04-20-2011", "Update", "Routine", "", "TBI Find Line", "Theresa Tibbs (Private Investigator) called back from 731-571-5131. She stated she is being told that Holly could be in an area in the Natchez Trace Pkwy in some type of underground shelter. Possibly could have been some bomb shelters at one point. She is being told this by the younger citizens of the community. She stated it had been mentioned that someone had gotten nervous because TBI had gotten so close to the location. Theresa just wanted to update us on this information."], ["TN0417", "04-20-2011", "Closed", "", "", "", "Closed per SA Louis Kuykendall"], ["TN0456", "04-20-2011", "Open", "Routine", "", "", "SA Alaina Kring, TBI, spoke with Jerry Walsh on 04/20/2011 at 3:12PM. Walsh owns the Biker bar located on Conrad Ridge Road. Walsh stated that there is a patron of the bar 'Jerry,'that lives at 1671 Jeannette Holiday Road with Kenny Martin, that was seen at his bar on Thursday, April 12 in the evening harassing female patrons. Kenny and Jerry left and went to another bar. Walsh stated that Kenny always comes to the bar with Jerry and has been for the past 4 months. However, Walsh thought it was strange that on 4/14 (Thursday), Kenny was not with Jerry.  Walsh stated that Jerry brags about being at ravler and that he is a 'weird'guy. The house that Jerry lives in is close to the Bobo house. Pete Taylor, Bill PlatåÉ and Hal Peter noticed that Jerry had not been back to the house until Tuesday, 4/19. Walsh stated Jerry has been around the bar for the past 6 months and knows the area. Kring/Phelps talked to Kenny and Jerry on 4/20 at 2:10 PM. His and Jerry's story do not match that of Walsh. They both claim to be out of the area in Savannah and Crump. Shelly (w/f) was at the house gave a different story as well. Kenny also never admitted to going to the biker bar where he has signed a membership card. Agent should follow-up. Consent form signed and search completed of property."], ["TN0457", "04-20-2011", "Open", "Routine", "", "Email", "ORailley had a person believed to be Blake Barnett come into the store yesterday at approximately 1643 hours and wanted to purchase something to make a silencer for his 22.  He already had a tube, and bought freeze plugs.  He was driving a 03 or an 04 Dodge Silver in color carvan.\n\n\n\n\n\n      employee working at the time: Neil Norwood  731-614-5907\n\n\n\n\n\n       Manager of the store:  Dewayne Waddle  731-614-5707\n\n\n\n\n\n         friend of Holly's that came by the store and showed them a picture of Blake was  Doug Jones   731-614-9187.  Doug went to H.S. and college with Holly and to school with Blake.\n\n\n\n\n\nLet me know if you need anymore information\n\n\n\n\n\nDonna Hetherington CID Lexington"], ["TN0458", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Peggy Smith suggested to check the U.S. Army Reserves 212 Trucking Company men that returned on April 8, 2011 in Nashville."], ["TN0398", "04-20-2011", "Closed", "", "", "SA Harmon", "Per SA Harmon Cecil had court on 4/13/11 in Mt Pleasant so absent from work was validated. Closed Lead"], ["TN0399", "04-20-2011", "Closed", "", "", "SA Harmon", "SA Harmon and SA Sullivan checked the area and nothing was found. Lead Closed"], ["TN0397", "04-20-2011", "Closed", "", "", "SA Harmon", "Close-Psychic"], ["TN0033", "04-20-2011", "Closed", "", "", "SA Harmon", "Close-myspace-forward to tech services"], ["TN0352", "04-20-2011", "Closed", "", "", "SA Sullivan", "Close-info only"], ["TN0456", "04-20-2011", "Update", "Routine", "", "", "SA Kring and ASAC Phelps interviewed Jerry Martin during the neighborhood canvass. At 1671 Jeannette Holiday, 04/20/2011 at 1:50PM. Jerry's story contradicted Kenny's and Jerry Walsh's stories."], ["TN0456", "04-20-2011", "Update", "Routine", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "", "ASAC Stephen Phelps interviewed Shelly D Keen, W/F, DOB 09/28/1980, on 04/20/2011 at 2:30PM during the neighborhood canvass at Jerry Martin's. Keen met Natalie Bobo when Keen was working at Joe's Video & Tanning Salon in Parsons. Natalie and Holly Bobo would come in together. That was in the Spring 2009. Natalie's father did not like Keen and broke up their friendship. Natalie worked at a strip club in Corinth, MS, bragged about the amount of money she made. Natalie worked there all summer 2010."], ["TN0459", "04-20-2011", "Closed", "", "", "", "psychic/close SAC Powell- Caller Psychic Virginia White (615)585-2740 has had a vision and believes Bobo is in a building in a wooded area close to a creek. The building is a old small barn or a storage building with 3\" or 4\" wood that runs up and down the building."], ["TN0459", "04-20-2011", "Closed", "", "", "", "Close-psychic"], ["TN0458", "04-20-2011", "Closed", "", "", "", "Closed-info only"], ["TN0460", "04-20-2011", "Open", "Routine", "", "Email sent to PIO Helm", "Lead Emailed to PIO Helm\n\n\n\nNot sure if this is an online troll or not, from Holly Bobo FP page- http://www.facebook.com/pages/Holly-Bobo/210492292313447?ref=ts\n\n\n\n \n\n\n\nDee Taylor Im not sure if what i have to say is useful to them but a male tried to sell a car to me on april 13 he said he needed to get rid of is fast as he had debt to pay off he was wearing camaflouge but he is local guy i havent seen him since april 13 tho! Im not sure if this is useful but anything helps no matter how big or small\n\n\n\n \n\n\n\n \n\n\n\n \n\n\n\nBest, \n\n\n\nISABELLE ZEHNDER\n\n\n\nColumnist | News Writer:\n\n\n\nNational Missing Persons Examiner\n\nTel: (360) 723-5253\n\nCell: (360) 903-3951\n\n\n\nEmail: isabelle.zehnder@comcast.net\n\nTwitter: @ChildCareUSA"], ["TN0460", "04-20-2011", "Update", "Routine", "", "Email sent to PIO Helm", "Additional information \n\n\n\nLady just PM'd me on Facebook asking for a number to call. Gave her Decatur\n\nSheriff 731&#8209;852&#8209;3911. She scared, says she's back in the UK. Not sure it's\n\nfor real but says someone there tried to sell her a car. I told her she\n\ncould send me the details and I would forward them to the TBI if she wants.\n\nI'll let you know if I hear back."], ["TN0461", "04-20-2011", "Open", "Routine", "", "Phone call", "LEIC Bryson received a phone call a woman in Camden TN 731 441-0546 stating that the caretaker of the property at 94 Jacqueline Circle, Camden Tn has been acting out of the ordinary. He has began coming and going at all hours of the night and day and leaving the screen door open and sometimes taking things in and out. This is unusual for him because he has never done this before. He is taking care of the home for the home owners who reside out of state. The caretaker drives an 1980's/1990's blue ford pickup."], ["TN0460", "04-20-2011", "Update", "Routine", "", "Email sent from PIO Helm", "Additional Information\n\nDee Taylor April 20 at 3:41pm Report\n\n\n\nIsabelle if you could copy and paste this, even screen print it and send it to sheriff and TBI\n\n\n\nOn april 13th approx around 13.40pm a male around the age of 26+ approached me in camaflouge clothing. He asked if i was intrested in buying a car and i said no unfortunatly i wouldnt be able to get it back to the UK with me and the guy said do i no of anybody who wants to buy it and i said no sorry and he said ok ma'am. He seemed very shakey and very disturbed, he looked really nervous i do remember him having blood on his left cheek and he did say he fell over in the woods. He then laughed/joked about giving me the car for 500$ and i said no im sorry i cannot take it back to the UK with me he then asked how long i was here for and asked if i would want to go for a walk with him at this point my auntie come outside and i went inside with her i watched him get back in the car and drive off. \n\n\n\nThis is my telephone number (+44) 07798820339.\n\nIf they need to contact me in england then need to dial +447798820339 \n\nmy email adress dee-xox@live.co.uk\n\n\n\n \n\n\n\n \n\n\n\nBest, \n\n\n\nISABELLE ZEHNDER\n\n\n\nColumnist | News Writer:\n\n\n\nNational Missing Persons Examiner\n\nTel: (360) 723-5253\n\nCell: (360) 903-3951\n\n\n\nEmail: isabelle.zehnder@comcast.net\n\nTwitter: @ChildCareUSA"], ["TN0462", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Veronica Valdez (901)634-4294 picked up a black man named Victor on April 5th at the on ramp to Fairview/I-40. He was wearing camouflauge pants, backpack, and with dreadlocks. Ms. Valdez stated his arms were bleeding. He told her he had been staying in the Natchez Trace area and then returned to Nashville, TN. Ms. Valdez was heading to Memphis area and dropped him off after the Jackson exit and before Summerville exit in TN at the Route 66 Gas Station on April 5, 2011. He also had a pit bull."], ["TN0463", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Theresa Brisanti (901)378-0703 suggested to check in the Vaugus Caves in Decatur county, TN. The caves are located off of Old Highway 641 toward I-40."], ["TN0464", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Christopher Lynn (731)847-6735 advised his friends saw a white male around 5'8\" with short, sandy hair walking across from the Travel Heads Bar in Holladay on April 19, 2011.  He looked like someone TBI may have been interested in talking to.  The caller said, his picture was in the Jackson Sun news on April 14, 2011."], ["TN0465", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Kim Murphy (407)825-3842 advised to check the hospitals for people with injuries."], ["TN0466", "04-20-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Carol Wilson (804)288-0136 from Virginia called to advise there is a similar case in Charlottesville, VA. Morgan Harrington disappeared and was found dead on a Virginia Farm. Ms. Wilson stated she looked like Holly Bobo and there may be a connection. The suspect is still at large."], ["TN0467", "04-20-2011", "Open", "Routine", "", "800 TBI FIND", "Aredia Williams - 731-987-2244 - Ms. Williams advised at around 10:30 or 11:00 as she was traveling to Lexington, TN, she saw a white male with dark hair on Root Hammer (? spelling) Road laying on the ground on a blanket by the side of the road. The blanket was beige with brown flowers. The subject jumped up from the blanket and got into an older model blue Ford Ranger with a red stripe. Ms. Williams advised that the man would not look at her and seemed to be hiding from her view in the vehicle is what caught her attention."], ["TN0468", "04-20-2011", "Open", "Routine", "", "Email from TBI Website", "Email to TBI Website\n\n\n\nI know you have looked into Holly's Facebook but I did notice ROBERT LEE TEEMS is not a typical friend of hers or any other person in this community. As I reviewed his profile page I noticed it had been exactly 1 year since they become friends. He is from Mayfield KY. I looked further into him, he grad. 1996 so he is 33 his MYSPACE confirmed he is 5 foot 10 inches. This is his blog, which also contains strong sexual content and friends which are mostly women. He seems to be troubled. \n\n\"To the people in my life that has not fucked me over in my life there are so many things that that I could say, but all I need is thank you . The battles in my life started at a young age, but through it all that it is my friends that have help me with it through the ups and downs they have been there. I have lived the streets,in back of cars, and in other places that I would never say out loud,but when it got so bad that death has been a serious thought that I sleep with a 12 ga. pump just in case I got the guts to do it but no matter what my friends were there. The only thing I can say with tear filled eyes is thank you \" \n\nI know you can't go on a gut feeling but being raised half my life in law enforcement and a mother. He should be addressed. \n\nI am a nurse practitioner in Parsons, I did have a patient not show up for an appt. who has a negative past history on the day she was abducted which was also a friend of hers on Facebook. If you need that information let me know.\n\nKim Inman FNP 731 845-4488\n\nCLINIC-766 Tennessee Ave S\n\nParsons\n\nHOME-1818 Tennessee Ave N\n\nParsons"], ["TN0469", "04-20-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nReported By &#8209; Customer &#8209; Bobo, Holly \n\nIssue Number &#8209; 154793\n\nCategory &#8209; TIP&#8209;EMAIL\n\nDate Received &#8209; 4/20/2011 10:33:00\n\nPriority &#8209; LOW\n\nEntered By &#8209; terameau\n\nName Used &#8209; \n\nAddress &#8209; \n\nCity &#8209; \n\nState &#8209; \n\nCountry &#8209; \n\nWhen Last Seen &#8209; \n\nAppx Age &#8209; \n\nHeight &#8209; \n\nWeight &#8209; \n\nHair &#8209; \n\nEyes &#8209; \n\nLanguage and Accent &#8209; \n\nRace &#8209; \n\nVehicle &#8209; \n\nScars and Tattoos &#8209; \n\nClothing &#8209; \n\nDescription &#8209; WHO_SEEN: Reference: Holly Bobo\n\nWHAT_NAME: \n\nWHERE_SEEN: \n\nWHEN_LAST_SEEN: \n\nHEIGHT: \n\nWEIGHT: \n\nAGE: \n\nEYE_COLOR: \n\nHAIR_COLOR: \n\nADDITIONAL_PHYSICAL_DESCRIPTION: \n\nVEHICLE_USED: \n\nOTHER_COMMENTS: Reference Missing Person Holly Bobo, in Parsons, Tenn. I live just off Interstate 40 at exit 163 about two counties away from incident. I found a pair of female panties, red in color, silky type fabric, with a little lace, and size 7. There is a handwritten name on the front written in black marker that states \"Tonya 2000\". I don't know if they are related to the Bobo case, but I called local LE, who responded and collected the item under their case number 20110419&#8209;164, Dickson County Sheriff's Office. This item may have been dragged into my woods by a dog or other critter, but I could not just do nothing. May God help you solve this case and others.\n\nLEVEL_OF_SURENESS: 10\n\nPERSONAL_INFORMATION: Sanford Shirk, 2888 Locke Hollow Road, Dickson, TN 37055 Cell Phone 615&#8209;829&#8209;9955 Home Phone 615&#8209;441&#8209;5217\n\nENTERED: {ts '2011&#8209;04&#8209;19 17:53:27'}\n\n\n\nTime Spent &#8209; 000:00:48:57\n\nSummary &#8209; Sanford Shirk, 2888 Locke Hollow Road, Dickson, TN 37055 Cell Phone 615&#8209;829&#8209;9955 Home Phone 615&#8209;441&#8209;5217"], ["TN0470", "04-20-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email from TBI Website\n\n\n\nI have been viewing the list of friends on holly's bobo's facebook  there is a ( Cory hunter Milam ) on there . I have read 10 pages of his older posts. \n\nHis profile,  he  looks to be about 200 lbs 6 feet tall.\n\nHe goes hunting almost everyday.\n\nHe spends most of his times in the woods.\n\nThere are pics of him on his facebook with his camo gear and face painted.\n\nHe Travels extensively through out allot of areas to go hunting (sardi) (white oak) (Jackson) (savannah) ect act.\n\nHe whishes just to meet a woman. mentions this a few times \n\nHe has mood swings.\n\nHe has thought about suicide twice in those post pages\n\nHe is very lonely and quite bored\n\nHe drives a truck for ups\n\nHe enters on facebook very regular except  lately.\n\n\n\n \n\nhe may or may not  but its worth checking him out"], ["TN0471", "04-21-2011", "Open", "Routine", "", "Telephone", "Caller Sharon Spray 870-203-2100 had a dream that Holly knew the boy and they went to church together. He has brown hair and brown eyes. Caller stated Holly confided in this boy that she wanted to leave. They got on a 4 wheeler and left. He is from a rich family who lived in the area but has moved to Houston. The man has kin still in the Parsons area. This person has blond hair and light eyes. Holly and the man are still in Houston."], ["TN0471", "04-21-2011", "Closed", "", "", "", "Psychic lead"], ["TN0416", "04-21-2011", "Update", "Routine", "", "Paper update", "04/20/11 called 941 488-8266 @ 1440 w/no answers/left message. SA Pate\n\n4/20/11 made contact. Female worked @ Kay Jewelry. Need to ge Sarasota Co, FL to ck w/Kays to eliminate."], ["TN0472", "04-21-2011", "Open", "Routine", "", "TBI Find", "A caller name Mary (317 490-1156 advised that she and her daughter were eating breakfast at I HOP located I 70 and Post Rd, Indianapolis, Indiana this am.  A heavy set man walked toward them, with lots of engery, wearing camo.  He asked them how to spell boo boo. When Mary answered he replied isnt it spelled bo bo and she said no that is Bo Bo.  Then when is at his table he wouldnt stop looking at them and got on his head set and made a call.  He said this is Bob Yount and I am calling about the missing girl from Tennessee.  Mary didnt see a vehicle."], ["TN0158", "04-21-2011", "Update", "Routine", "", "Paper update 4/21/11", "04/20/11  Attempted to call 731 602-7950 w/no answer/only voicemail. Voicemail id stephanie. Sa Pate"], ["TN0473", "04-21-2011", "Open", "Immediate", "", "TN OHS Joey Hudgins", "Joey Hudgins with TN OHS received information from a Kevin Wood that he had a run in with Jonathan Dodd during the search for Holly Bobo on April 16, 2011. Wood approached Dodd's property off Evanstown Road. Dodd seemed very excited/nervouse. Dodd left the property and returned while they were there. When Dodd returned he was slamming doors and drawers, etc. TN OHS Joey Hudgins met with Mr. Wood on 4/20/2011 regarding this incident and he wrote a statement (attached to lead sheet) and couldn't recall anyting else regarding the search."], ["TN0450", "04-21-2011", "Update", "Routine", "", "Paper update 4/20/11", "4/20/11 John Simmons & D Pate met w/Amy Barnett, DOB:1/24/93, 4456 Brooksie Thompson Rd, Decaturville TN 38329, (c) 731 549-7258. She said a friend named Falen Hasher, 17 yoa called her saying she received a text msg. saying Holly had been found in a cabin at Natchez Trace & Blake Barnett (her brother), Jonathan Dodd and Blake (B.A.) Williames had been arrested. Falen did not say where her information came from."], ["TN0474", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Det. Schneider with Harriman PD, TN called regarding a stolen car. 04/21/2011 9:30 am \n\n\n\nDet. Schneider stated that Dana Hall reported that she lent her car on April 12th, 2011 to Ryan Bain & Michael Brashears.   Ms. Hall has not seen the car since that date.\n\n\n\nMs. Hall reported that Ryan Bain had stated he is or was Holly Bobo's boyfriend.\n\n\n\nMs. Hall was reluctant to talk with Det. Schneider on one call, and then called Det. Schneider back 5 minutes later to explain that she was told to shut up and not say anything about her missing car.\n\n\n\nDet. Schneider with Harriman PD  865-882-3383\n\n\n\nDana Hall 865-882-3514  address:  1724 Bennet Circle Harriman, TN\n\n\n\nRyan Bain: W,M.  07/21/1992 TN DL 119104351\n\n\n\nMichael Brashears: W,M 07/12/1977 TN DL 079140627\n\n\n\nCar stolen:  1996 Blue Chevy Beretta  TN Tag:  091PPK"], ["TN0475", "04-21-2011", "Open", "Routine", "", "Telephone", "Caller Linda Henry (nee Binkley) 731-803-8875 stated that she and her daughter were kidnapped in 1982 by Leslie Wayne White who is from Lexington, Tn. After her kidnapped he also kidnapped seven other girls, one who was from Lexington, TN. [online search found a Leslie Wayne White from Lexington, Tn now living in South Dakota, moved in January 2011]."], ["TN0476", "04-21-2011", "Open", "Routine", "", "Telephne", "Caller Lakecha Sykes 901-461-4875 stated she has been watching the case and is getting a feeling that Holly is on a trail or near a campground.  Sykes googled the area and stated that Holly may be on Mt. Zion Trail. Ms. Sykes stated that she is not psychic but is getting a feeling about a trail or campground."], ["TN0476", "04-21-2011", "Closed", "", "", "Lead sheet", "Psychic lead. TFO J. Poindexter MPHS/SSTF No follow up needed, tipster has no personal knowledge of case. Info from tv & gut feelings, claims to not be psychic. SA R Winkler"], ["TN0477", "04-21-2011", "Open", "Routine", "", "TBI FIND", "Caller Molton Sanders can be reached at 731-584-8022. Mr. Sanders stated that about 30 years ago he helped build 2 cabins way out in the woods in the general vacinity of Natchez Trace Park and Hollady (near Mcelwain exit 126). He also stated that very few people know the cabins are there. These cabins are near the Pierce Property where \"Pierce\" a former fugitive was hiding a few years ago. Mr. Sanders stated that he has an elderly father so if someone calls him, leave a message and he will call back. Mr. Sanders will be happy to show someone how to get back to the cabins and 4 wheelers may be needed."], ["TN0478", "04-21-2011", "Open", "Routine", "", "Telephone", "Caller Jessica Hutcherson 270-991-2523 stated on April 13th between 1700 and 1900 she saw a woman who resembled Holly standing in her apartment complex parking lot talking on a cell phone."], ["TN0480", "04-21-2011", "Open", "Routine", "", "Telephone", "Caller Lester West 317-438-5079 stated that he saw a man with short hair cut, wide nose, round face, not a lot of hair, rough shaved, wide thin mouth, is not brown eyed. This man was in a white Grand Am with a blonde girl who hung her head. The man stared at the caller. The caller stated \"he looked just like the pencil sketch\" that was shown on the Today Show. The caller is in Indianapolis, Indiana."], ["TN0479", "04-21-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website - \n\n\n\nMy name Betty Sims and I Own a Florist in Scotts Hill and one of My Customers sent Me some Pics by text on My phone and She ask would I show Them to My Husband,Because He works for Lt. Brad Wilbanks,She said That some may have already reported it,Her Son was searching with the Group on Sunday and came up on this Vehicle and thought it was strange with the Gun and camo in it\n\n                                                                                                                             Thanks Betty Sims needed\n\n \n\nForgot to put Phone number if needed 731-549-9771\n\nAnd This car was at Natchez Trace State Park\n\n\n\nVehicle in photo registration\n\n\n\nRR.TN0000000\n\n10:35 04/21/11 07545\n\n10:35 04/21/11 00018 TNTBI0002\n\nTXT\n\nLIC/130JZB      VIN/1G3AG54N3P6444399    MAKE/OLDS YR/1993 EXP/20110930\n\nTITLE/70099351        MODEL/CIS   BODY/4D VCO/        \n\nOWNER/HALTERS       J         C  CO-OF-REG/HENDERSON \n\n                               \n\nADDR/ 4180  UNION CROSS RD                           WT/  000000000        \n\n     WILDERSVILLE   TN 38388-9801 CLSCD/1000 ISSYR/2006"], ["TN0477", "04-21-2011", "Update", "Routine", "", "", "SAC Powell spoke with Mr. Sanders and confirmed the property is in Benton County. Exit 126 go North. Go past the church on the left, Flatwoods Baptist Church. Lonnie Pierce's house beside church. Turn in Pierce's driveway to back of house - red beans to right- follow road to left hand side. Trail will lead in woods to two cabins.  Must use 4 wheeler to access cabins.  Call Mr. Sanders and he will meet officers to give better information  and directions."], ["TN0455", "04-21-2011", "Update", "Immediate", "SA Greg Elliott and SA John Simmons - TBI", "", "SA Greg Elliott and SA John Simmons in route to location."], ["TN0481", "04-21-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nHow about www.newsvine.com where anyone can post a comment about Holly Bobo!  who is curtis 1084385 and Allison 1391898?  Maybe the animal who abducted Holly is following info. via internet.  who knows maybe they are posting comments to the site.\n\n \n\nPlease find Holly!  \n\n \n\nthanks\n\nLeigh\n\n \n\n \n\nPLEASE FIND HOLLY!"], ["TN0468", "04-21-2011", "Closed", "", "", "", "MySpace - Facebook Lead"], ["TN0482", "04-21-2011", "Open", "Routine", "", "", "4/20/11 @ 6:00pm John Sullivan spoke with Lindsey Pafford 731 544-0924 & Beth Griffith 731 441-3934 at the Parson's Armory. They advised Jonathan Dodd, Rocky Scott, Mitchell Wood and an unknown W/M wearing a cowboy hat, were with them on April 19 2011 searching for Holly Bobo. They advised Jonathan Dodd & W/M w/cowboy hat were acting nervous by smoking a lot & avoiding a deputy that had pulled up to speak to them. They had no other information. Request closure, no further investigation needed per SA John Sullivan."], ["TN0483", "04-21-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nI know it might sound crazy but I just woke up from a dream where I was fighting a tall black man whom lives down the road from me that I don't know personally and a tall white man who I have no idea who he was.  At the end of the dream though I walked into my mobile home and a woman handed me a paper like folded card that said \"I'm in Olive Grove\" and in tiny letters around Olive Grove it said \"fan\".  I know the card in my dream was from Holly because in my dream Holly Bobo was running through my mind when I read it and I'm assuming the girl that handed it to me in the dream was Holly.  I don't know what it means, I've never heard of an Olive Grove but if you don't have any leads to go on and there is a place nearby that may be related to Olive Grove maybe it was a preminition.  I have witnessed some of my dreams being right.  Also the name Allen or Alan was whispered to me at some point and going through Holly's friend list on facebook the only male Allen's or Alan that comes up are http://www.facebook.com/profile.php?id=529488428 , http://www.facebook.com/profile.php?id=100000113055635 , and http://www.facebook.com/#!/blake.sides  The first and middle one seems to bother me the most for some reason.  If ya'll can log into her facebook if you haven't already it may be worthwhile to go through her messages and trach messages.  I don't know this family or anything about them but it is odd to me that out of nowhere suddenly these things came to me all in one night.  I hope it helps and if it doesn't I will still talk to God and hope in my heart Holly is ok.  I know it may be a long shot but I felt I should tell you about it anyway.  Stephen Redmond"], ["TN0483", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0484", "04-21-2011", "Open", "Routine", "", "Paper Lead Input", "4/20/11 @ 5:15pm SA John Simmons spoke w/Dennis Wagner 731 441-8975, who is SA V. Trott's brother. Mr. Wagner heard a young female scream 'Help me'while fishing @ Trott's Landing. He said he & Don Pilcher were fishing @ Trott's Landing on 4/13/11 @ 6:00pm. He and Don heard a young woman yell 'Help me'twice & described this as a blood curling scream. He heard a car slow down on nearby Hwy 70E before the scream. The car sped off toward Ne w Johnsonville TN and he briefly saw it through the brush. He described the car as a 90's, white or silver small compact w/hatchback, 2dr, but saw no occupants. About 1 hr later they took the boat out of the water but saw no one along Hwy 70E. The GPS coordinates are: N36.962, W88.965 *mile marker 12. Officer Shane Daniel, Johnsonville TN PD was provided with the vehicle description. *A search of the roadway needs to be conducted."], ["TN0485", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Jim Canant from Houston, TX  281-253-2268\n\n \n\nCanant stated that he has been \"remote viewing\"....psychic, but not.  Unemployed on \n\nCanant stated the following:\n\nCaller stated that Holly's abductor is white male.  age 27-33.  light skinned.  Looks young.  Red hair with short military haircut. very light eyebrows. 5'10\" to 6'0\"\n\nMed. light muscular build.  like body builder.  Is strong.\n\nsubject is connected with public service employment such as a volunteer fire fighter.\n\nMilitary past, former active duty, inactive reservist currently.\n\n \n\nSubject has access to prefabricated mobile home. Debris all around home outside. with standard bathtub outside the home.   Pink and red due to rust. tub will be in plain view of the home.  The ends of the tub will be bored down.  A cellar will be near tub.  Not visible from the air, but visible on the ground by a slight hump in ground.  Cellar door is wood with brush against it.  \n\n \n\nSubject is known to community.  Subject is obscure and transparent but makes eye contact.  Has been a responder to the crisis.  Feels Holy has talked with subject before in some capacity."], ["TN0485", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0482", "04-21-2011", "Closed", "", "", "Paper submission", "Closed per SA John Sullivan, no further Investigation needed."], ["TN0486", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Jan Lewis 931-622-1558 (55 year old woman)  lives in Humphries county TN.\n\n \n\nMs. Lewis sated the following:\n\n3 months ago she was walking with hand weights in Bakerville community. \n\n5 minutes from I40.\n\nMan in older model, small Nissan, light colored truck stopped and tried to make conversation  with ms. Lewis.  Man asked ms. Lewis if she had car trouble.  She said no she was walking. \n\n(Ms. Lewis stated that is was very obvious she was just out walking with weights)\n\nman put truck in park, was looking back and forth down the street.  Another car came down the street and the man took off in his truck.\n\nMs. Lewis had a very uneasy feeling about the man in the truck.  \n\nMs. Lewis described the man as a white male, age 25-30, slim, fairly nice looking, sandy hair. Had a ball cap on.  \n\nMs. Lewis stated that she read the article regarding a girl named Heather Sullivan in Centerville and thought it could be the same man in her experience since Ms. Lewis lives between Parsons and Centerville."], ["TN0487", "04-21-2011", "Open", "Immediate", "", "Paper Lead sheet", "4/21/11 @10:00am, Agent Dennis King spoke w/ Brian Lee (c) 731 733-1190, 4810 Bible Hill Rd, Parsons TN. He stated about Mr. Dodd traveling at a high rate of speed on Bible Hill Rd on a (red Honda 4-wheeler). He stated that Barry Duke said he saw Bradley & Jonathan Dodd hauling a mattress on a trailer on Bible Hill Rd. Follow up needed in order to speak w/Barry Duke about the mattress and the 4 wheeler incident."], ["TN0448", "04-21-2011", "Update", "Routine", "", "", "4/20/11 Called Burnette, no further than before.\n\n4/20/11 Called 731 549-6740, no answer/left msg.\n\n4/20/11 Working in Bolivar, wife called telling about Holly, called sister-in-law to be aware Brendon Aurty, 1770 Cornith Rd."], ["TN0488", "04-21-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Melissa Curd (731) 707-0712 stated a man named Jason Nickell from Benton County, TN was arrested recently for stalking young women in the Jackson area. He is currently at the Madison County jail.  Ms. Curd advised Mr. Nickell has been in trouble for other sex offenses."], ["TN0489", "04-21-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Jana Peters (573) 837-5857 said, God told her the name \"paul\".  Ms. Peters doesn't know if it is a person or street name. Ms. Peters has been online and looking up sex offenders and one named Johnathon Paul Hasher stood out. Ms. Peters said, maybe this is the person God told her about."], ["TN0490", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "James Tucker (931) 629-9030 - Advised that his niece was being harassed by a Vance Staggs from Waynesboro. Mr. Tucker's niece is a nurse and was forced to move because of the harassment. Mr. Tucker felt Mr. Staggs should be looked at because of this matter."], ["TN0489", "04-21-2011", "Closed", "", "", "", "Psychic lead"], ["TN0491", "04-21-2011", "Open", "Priority", "", "Lead sheet & letter", "4/21/11 @ 08:25am Joey Hudgins presented a typed written letter that was left at the Command Post by an unknown person. Mark Mangrum who was previously a Pastor in Parsons & supposedly counseled two of the persons' of interest called about Holly Bobo and has helpful info. He is now serving time for sex w/underage children. ** The letter reads as such: I am just letting you know that Mark Mangrum called me and was concerned about Holly Bobo who has been missing. He said he had counseled a couple of guys who he felt could have had something to do with it based on past conversations they had with him individually. Mark did not tell me anything other than names. I found it interesting that he named two of the young men that have been questioned and are still being questioned and their property searched. I had not mentioned these names to him. I actually told him little about other than she is missing. **"], ["TN0492", "04-21-2011", "Open", "Routine", "", "", "4/20/11 @ 7:30am, ASAC Long, 615 202-9545, rcvd the following info from Jessi McCormick of (Radio Shack, 731 847-2102 & Joe White of (Fred's, 731 549-7671). Thomas Hollowell was observed in Radio Shack on 4/20/11 stealing a weather radio & police scanner. When he was contacted about the weather radio, he came into the store to pay. He produced a large wad of cash. He is unknown to McCormick or White. He was also observed taking a watch from Fred's. Two DVD's of him at Fred's were obtained by ASAC Long. After discussing with SA Dycus, Joe White will contact police and file report. Parsons' PD will contact Command Post to have an agent with them to question Hollowell when he is confronted about the thefts. SA Dycus is in possession of DVD's. Hollowell's address is 1849 Broadies Landing, 731 733-2688. He was also thought to be at the Bible Hill Command Post on 4/19/11."], ["TN0493", "04-21-2011", "Open", "Routine", "", "Letter @ command post", "4/21/11 @ 1215pm Mike Frizzel rcvd a letter from Peggy Grice, 1668 Walter Garrett, Parsons TN, 731 847-7355 stating the letter has some info that should be checked. The letter states: Young man works @ Johnson Control, Lexington TN supervisor is Danny Mills, and mother's name is (Marcus Mills), his name is not Mills, and so she must have already had him when she married a Mills. Do not know his but someone called me and said he wanted to leave work Wednesday, the day of kidnapping, and that his grandfather was sick. Said he had been leaving work before that with some excuse, but they didn't know who his grandpa was, so they could check out his excuse. They thought I might know because my maiden name is Mills. I didn't know Marcus Mills and no one I ask knew her. There is another set of Mills not related, who used to live around Jeanette TN or close. I thought you might have another way to check this out that would give you more info. I wanted to give this info to TBI in confidence, so word would not get back to him before checking it out. Not much to go on, but couldn't let it go. Good Luck & God Bless. \n\nP.S. my son is somewhat disabled so I'm not gone very long at a time or I might could have found out more."], ["TN0463", "04-21-2011", "Closed", "", "", "Update sheet", "Closed 4/21/11, no subsequent info Per R. Winkler"], ["TN0494", "04-21-2011", "Open", "Routine", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "Phone Call into Bible Hill Command Post", "Uniformed Officer Darryl Brown received information from the Bible Hill Command Post. Lynn Mooney with the EMA stated a call came into the Bible Hill Command Post and this caller suspected Frankie Fuller adn a person by the last name of Evans could be involved. The Evans subject has been known to prostitute underage mentally challenged girls. Evans lives a short distance from Bobo's home on Five Forks Rd and Sam Evans Rd. Caller also stated a pond is located on this property."], ["TN0497", "04-21-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Cythia Nash (615)322-1074 said, there is an unusual person that lives at the Crossing of Bellevue Apartments in Nashville, TN. His first name is Tony (unknown last name)white male, very thin and has had a complaint filed with Metro Nashville Police Dept. for stalking.  He was driving an older model white Chevrolet Suburban and two days ago he got rid of it."], ["TN0496", "04-21-2011", "Open", "Routine", "", "Carroll Co SO", "Investigator David Bunn with the Carroll County SO received a phone call from Donnie Wheat a sex offender from Carroll County. Wheat said he saw Holly and her brother in a four door car in Huntington with a sex offender. He described the sex offender as sandy haired and living on Chapel Hill Rd in Carroll CO. Bunn identified the sex offender as Fred Neeley. Wheat says they were at a market across from McDonalds. Bunn said this would have been about the time of the Idol competition at the Dixie. When asked how he knew Holly, Wheat said he delivered a Christmas present from Bill's Florist in Huntington, TN where he works. Neeley is big into churchs and church events per Bunn. This this might be the connections. Information was given to SA Joe Walker."], ["TN0495", "04-21-2011", "Open", "Routine", "", "Lead sheet", "4/21/11 @ 1230pm from Joey Hudgins: I was informed by LT Paul Dunneway (THP) that Dwayne Waddle needed to speak w/someone about a suspicious purchase. Mr. Waddle is the Manager of O'Reilly's Auto Parts; Lexington TN. Joey Hudgins interviewed him at the store. He stated that on 4/19/11, W/M, 22 yrs old, driving an early Dodge Caravan, entered & asked for freeze plugs. He got 2 but needed more. He showed him a silencer for a .40cal & explained he wanted to reduce it to a .22cal. He was informed that this was illegal but it didn't seem to bother him. He stated he and a friend were doing this and his friend had an SKS w/a silencer. Mr. Waddle was discussing this w/a colleague Doug Jones, and described his appearance. Mr. Jones went to school w/both Holly & Blake Barnett and felt the description sounded like Barnette. He showed Mr. Waddle a picture of Barnett from face book & he and another co-worker Neil Norwood said it looked like the gentleman in the store. A receipt of the debit card purchases was obtained, no store video."], ["TN0496", "04-21-2011", "Closed", "", "", "Carroll County SO", "SA Walker called Clint Bobo and checked with him. He said he and Holly have not been to Huntington together in a long time and he doesn't know Fred Neeley."], ["TN0436", "04-21-2011", "Closed", "", "", "", "Lead unfounded."], ["TN0433", "04-21-2011", "Closed", "", "", "", "Lead unfounded. Injury verified in Heidelberg.\n\n\n\nASAC Stephen Phelps interviewed James \"Bo\" Goodrich, on 04/21/2011 at 9:40PM. Goodrich is the night manager at Wal-Mart, in Lexington, where Heidelberg is employed. Goodrich stated that Heidelberg worked the night shift at Wal-mart on 04/12-13/2011, and clocked out at 7:30AM, 4/13/2011. Goodrich stated that he and Heidelberg had 8 swing sets to put up, around 7:15AM and Heidelberg went home like nothing happened. Goodrich stated that Heidelberg came back to work on Wednesday night, 4/13/2011, and his right hand was swollen, stating that he had dropped a swing set on his hand the morning before, when they were stacking them. Goodrich stated that he was with Heidelberg, and did not see him drop anything on his hand, Heidelberg never complained about his hand, and did not say anything about hurting his hand. Goodrich stated that he sent Heidelberg home, and that they both met with Wal-Mart's personnel director on Thursday morning, 4/14/2011. Heidelberg was sent to the doctor and was treated for a broken bone in his right pinky finger.\n\n\n\nGoodrich described Heidelberg as young, immature, not having a good sense of work ethic, but extremely polite. \n\n\n\nTIB SA Mike Frizzell checked Heidelberg's cell phone number (731.394.5106) against the database and advised that the results were negative.  \n\n\n\n\n\nMichael Andrew heidelberg, 59 Jack Hay St #21, Lexington, TN (cell 731-394-5106)"], ["TN0526", "04-21-2011", "Open", "Routine", "", "Decatur CO 911", "Sheila Carver with Decatur County E911 received information from a Laurie Jepsen 951-440-4201. She states Holly is underground in a concrete barricade under a house. There are 2 doors that fold open with handles in ground. (Folds upward , underground shelter, storm shelter). It is within 20-25 miles away near Parsons or adjoining city. Holly is still alive and he is trying to figure out what to do. She is crying and exhausted, asleep due to blood loss. Harold Lovett-He has blind folded other women and killed other women. House is like a gray blue color with a funny trim color (that doesn't match, yellow is on the house somewhere). Street is near Kellogg. Parents - Sherman - Campos. He is angry and has a love hate relationship with women. Decatur Co could not locate a Harold Lovett. They show a Lovett (no first name) at a 2770 Martin Landing Road but show the property to be under construction and not for sure if something is on the lot now. Possibly past Shannon Lane before Eagles Nest Lane. Show cell of 901-212-4652 and home of 901-385-7726. Henderson CO has a Richard Lovett at 950 Zimmerle Rd and Benton Co has a Della Lovett on Tara LN and Lavelle Lovett on Beaver Road."], ["TN0451", "04-21-2011", "Closed", "", "", "", "Information not verifiable. Complainant stated he could not give any further details or information on named suspects."], ["TN0438", "04-21-2011", "Closed", "", "", "", "Tip vague. Not workable."], ["TN0437", "04-21-2011", "Closed", "", "", "", "Unable to contact tipster. No action to be taken 4/21/11."], ["TN0498", "04-21-2011", "Open", "Routine", "", "Email send to TBI", "Email sent to TBI Website\n\n\n\nHi,\n\nI've been following this case closely and doing a little digging and someone stood out to me.\n\nFlint Lee Perkins of Scotts Hill, TN\n\nHe is a \"friend\" of both her and her brother on FB and was a regular poster up until the morning she went missing when he stopped posting completely. \n\nThere are many other things that bother me about him, but I know you are busy so I will not take up your time. Hopefully he has already been checked out and cleared/ or not....\n\nThank you for all you do.\n\nStacey"], ["TN0448", "04-21-2011", "Closed", "", "", "", "Called Tipster. No new information. Telephone number not on file with Accurint or TLO."], ["TN0443", "04-21-2011", "Closed", "", "", "", "No links to Holly. Lt. Simmons just wanted us to know."], ["TN0449", "04-21-2011", "Closed", "", "", "", "Need local input. Unknown to us. No leads or phone # to contact."], ["TN0498", "04-21-2011", "Closed", "", "", "", "Facebook lead"], ["TN0500", "04-21-2011", "Open", "Routine", "", "Telephone", "Caller Pam Villaflor 731-549-4053 stated she met a friend of Whitney Duncan who came from Nashville to help in the search. The caller does not know the man's name but he told the caller that his aunt is a psychic. When on Gooch Road and on the phone with his aunt he drove over a creek and his aunt stated \"do not get out of the car\" because \"someone is watching you\" and the spot terrified her. The guy said he drove away and this made the aunt feel better. Without telling his aunt he turned around to go back to the spot and his aunt asked if he had turned around. The aunt stated that Holly is in small building with no windows but there is light coming through the cracks."], ["TN0499", "04-21-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website \n\n\n\nI am a psychic, dont hang up!  ; 0\n\nLast time I told you the escapees were laid back in the woods waiting  \n\na few days to get a car and they were.\n\nNOW IM TELLING you I can see Holly B. being stalked at school!  Then  \n\nall he had to do was get to be friends of a friend on facebok, Im  \n\nsure youve looked at her settings....He watched her come out of class  \n\nevery day and followed her home.  And went fro there.I dont know what  \n\nschool she goes to but I think thats it. thanks!"], ["TN0499", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0500", "04-21-2011", "Closed", "", "", "", "Psychic lead."], ["TN0488", "04-21-2011", "Closed", "", "", "Lead sheet", "4/21/11 No follow-up needed, individual in jail, interviewed by MPHS/FBI. Closed by SA R Winkler"], ["TN0484", "04-21-2011", "Update", "Routine", "", "In person", "SA Simmons  went spoke with Mr Wagner.  SA Simmons advised Johnsonville PD of information and vehicle description.  SA Simmons gave ASAC Long the lat/long/mile marker to coordinate search of area.  SA Simmons advised that only remaining lead would be to compare vehcile description against other leads and possible vehicle/suspect vehicle description."], ["TN0501", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Charlyne Weiss from Omaha NE called to say that God told her that Holly Bobo is alive, but not well & Holly is in a cave and she is alone.  The cave is not well hidden but not easily found."], ["TN0425", "04-21-2011", "Closed", "", "", "", "Terry Britt has already been arrested by local authorities on an unrelated charge. Sgt. Nolen with the SSTF-FBI received information from FBI that Britt has been investigated."], ["TN0501", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0480", "04-21-2011", "Closed", "", "", "Lead sheet", "4/21/11 Closed No follow-up needed per R Winkler"], ["TN0423", "04-21-2011", "Closed", "", "", "", "Lynn Walls has been interviewed. No further action at this time. Event closed by TBI SA Jeff Jackson."], ["TN0484", "04-21-2011", "Closed", "", "", "", "SA Sullivan compared vehicle description against other leads and possible future suspect vehicles. Provided info to the following: Officer Lee Hatley, Benton CO SO who will provide it to his S.O. and will call 1-800-TBI-FIND if positive,Investigator Bryant Allen, Benton CO (c) 731 441-9615, and New Johnsonville TN PD who passed to shift supervisors. They will check and advise."], ["TN0479", "04-21-2011", "Closed", "", "", "Lead sheet", "Assigned to TFO J. Poindexter MPHS/SSTF, Closed no follow-up,search group already addressed information per SA R Winkler"], ["TN0422", "04-21-2011", "Closed", "", "", "", "Information appears to be incomplete. Unable to check lead due to incomplete information."], ["TN0429", "04-21-2011", "Closed", "", "", "", "Tip was in regard to text message sent from Holly Bobo to Natalie Bob on 1/21/11. Advised not to follow up on any tips regarding Natalie Bobo."], ["TN0421", "04-21-2011", "Closed", "", "", "Lead sheet", "4/21/11 Closed, no phone number was listed to follow-up with per SA R Winkler"], ["TN0491", "04-21-2011", "Update", "Routine", "", "", "Per F. Bartlett with the ME-SSTF, TBI needed to locate Mark Mangrum in TDOC and interview."], ["TN0490", "04-21-2011", "Update", "Routine", "", "", "F. Bartlett with the ME-SSTF called Tucker on 4/21/11 @ 1338 hrs. Tucker advised the suspect was W/M, late 30's-early 40's. Occur
