o advise us that Nichols was not at work since Tuesday of last week and just wanted to make us aware in case Nichols should be considered and/or questioned about Holly Bobo's disappearance. Mr. Deck can be reached at 731-935-9256. Call came in from 73-935-9275."], ["TN0313", "04-19-2011", "Open", "Routine", "", "phone call", "Received a call from a woman in Richmond KY regarding a sex offender.  She stated that her granddaughter was abducted and raped a few years ago and the sex offender that did it is now in South Carolina but she feels he could have something to do with this.  His name is Jonathan William Noe and here is a link to his sex offender registry in SC http://www.icrimewatch.net/offenderdetails.php?OfndrID=1396848&AgencyID=54575"], ["TN0347", "04-19-2011", "Open", "Routine", "", "Dog Search Team", "Search Dog Team was searching the pond behind victims house and the dog started going crazy with a scent and was trying to get into the water. Other LE were headed to the scene."], ["TN0318", "04-19-2011", "Open", "Routine", "", "", "Alice A. Reid reported that her mother, Alice H. Reid age 85, owned 100 acres across the road from the Bobo home. The home health nurse, Bradley Todd age 28, for Alice H. requested permission for himself, his father, and the father's boss to hunt on the Reid's property. Permission was never granted. Alice A. requests that the nurse was not told that this was reported by Alice H. Daughter, Alice A. requests to be contacted before Sunday, 4/24 for more information at 615.708.5105 or 615.708.5705."], ["TN0314", "04-19-2011", "Open", "Routine", "", "phone call", "Stan Ross (731)967-0933 called regaring a vehicle he saw on the morning after the abduction (4/14/11). Mr Ross stated that he and his brother were fishing at Brown Lake on the morning after the abduction and when they left at 11am they noticed a white SUV on the side of the road and a white male dressed in camo got out with a gun. Mr.Ross stated the road was the first one on the left as you are leaving the park."], ["TN0316", "04-19-2011", "Open", "Routine", "", "phone call", "Donald Bullock with the Department of Corrections called with a suggestion.  He suggested that we find out what product Holly uses when she is on her period and see if we can figure out when her period is because her abductor may have gone to the store to buy her some supplies."], ["TN0315", "04-19-2011", "Open", "Routine", "", "phone call", "The woman that lives next to the Bobo residence called this morning because she had fresh horse prints in her yard this morning.  She stated the prints came from the direction of the woods and was concerned because they got within 30 yrds of her home.  She stated it scared her because what if the person that did this was looking for another victim.  Her address is 555 Swan Johnson Rd."], ["TN0345", "04-19-2011", "Open", "Routine", "", "Info from search team", "Search teams working the Five Forks and Sulphur Springs area found receipts and paperwork along with a credit card for Dennis Sewell. SA Doug Long requested criminal history, DL inforimation to be queried on this individual. A Dennis C Sewell 2nd was located at 33 Durbin Lane in Parsons, TN. DL # is 104055826, dob 01/10/1989, ssn 415658336. Criminal history shows arrest 10/10/08 by Walker CO SO in Georgia for Furnishing Purchasing and Poss of Alcoholic Beverages by Persons below Legal age. Also arrest by Decatur Co SO in TN for Recless Driving, Driving on Revoked and 3 counts of Burglary. Also arrest by Parsons PD for Poss Schedule 6, underage consumption and contributing to delinquency. SA Doug Long stated further investigation showed the credit card was a Citibank Visa with expiration of May 2010."], ["TN0317", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Call rec'd from Bill Jackson, former Germantown police officer. Mr. Jackson stated he had been married to the daughter of a Gerald Martin. Back in the late 70's it was found that Mr. Martin had raped Mr. Jackson's ex-wife and her sister. Mr. Martin formerly lived at 511 Chalmers in Memphis, but, per Mr. Jackson's son (age 29), Martin has now moved back to a farm in Parson, TN. Mr. Jackson stated that they did not have the SOR back in the 70's so he most likely could not be pulled from our records. He also stated that they went to court on this sex offense and were given custody of his wife's siter to raise. He said that Mr. Martin is a sick individual and that since he's now known to be living in the Parsons area, he might be a person of interest and should be checked out. He did not have an address for Mr. Martin. Call came in from 931-545-6290."], ["TN0319", "04-19-2011", "Open", "Routine", "", "phone call", "Robin Cantrell (864) 406-0166 called regarding a bank robbery that occured in Friendship Tennessee yesterday 4/18/11). Ms Cantrell stated the robber was approximatley 6 ft tall and was dressed in full camo. Ms Cantrell wasnt sure if this could have been related to the abduction but wanted to pass the information along"], ["TN0379", "04-19-2011", "Open", "Routine", "", "SA Darryl Richardson", "SA Darryl Richardson spoke with Mrs. Mary Box and stated a TBI Agent interviewed herself and her husband last date. Mrs. Box stated she did say anything about it then because of her husband's relationship with the subject. Mrs. Box stated she was concerned her neighbor and her husbands cousin, Nazareth Brown who also lives on Sulphur Springs Rd was involved in a car accident several years back and has not acted right since. Mrs. Box stated Brown has been violen towards his estranged wife. Box also stated agents had previously inquired if she knew of anyone involved in carpentry. Box said Brown is a carpenter and electrician. Box said Brown is 5'8-5'9, 165-170 lbs, blonde-brown hair and drove a champagne colored Ford picku truck. Box also stated Brown owned an abandoned house on Hwy 641 on the left if traveling towards the interstate. There is a chain gate acaross the drive to the property. According to Box, the property is accessible through the woods from Sulphur Springs Rd. Box did say she did not want Brown to know the information came from her."], ["TN0320", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller: James Brown, phone number 731-602-2212. Mr. Brown stated that he had been at a coon hunt awhile back with a guy who's son is a registered sex offender named Eddie Hall. Mr. Brown said he has checked the SOR and Hall is still showing as active. He said Hall has children in his home, which should not be, but, also stated that when people went to question him, he always seemed to get away before they got there and not be questioned. He stated that Hall lives in the Darden area and is approx 5'7\" and around 200 lbs. Mr. Brown said he has spoken with the boy a few times and the guy just doesn't seem to have it all together. He feels this Eddie Hall should be checked out in regards to the Holly Bobo case."], ["TN0321", "04-19-2011", "Open", "Routine", "", "phone call", "Lionel Lowery (423) 878-7080 called and stated that yesterday (4/18) he noticed a guy in full camo coming out of the woods in the back of his property. He stated that his cousin went to investigate what the guy was doing and when he got there the guy ran off. Mr. Lowery lives on Sinking Springs Rd in Bristol TN but he felt that the guy was very suspious and he has been watching the news reports regarding Holly so he felt he needed to call in."], ["TN0364", "04-19-2011", "Open", "Routine", "", "lead sheet", "SA Simmons was given the attached Decatur Co SO PIR concerning missing person, Sammy Hays, dob: 10/29/59 by SA Nathan Bishop. SA Bishop requested the writer follow up on the information. SA Simmons called telephone 731.549.2380 and spoke with Dorris Hays. She stated she is the mother of Sammy Hays. She said her son, Sammy, was at home with her and her husband, Roy, on 4/13/11 until he left for church at 6:45p.m. Late that same night he said he was out of gas when he called home at about 11:30pm. She and her husband took gas to him. Sammy told them he was going to check himself into the med in Memphis. She said he is addicted to Tylenol. She received a call on the morning of 04/14/11 (Thurs) from a doctor at Baptist East Hospital. The doctor said Sammy had been discovered at a Cirle K in Germantown TN suffering from an overdose of Tylenol. He was hospitalized in critical care and is now staying with a brother in Memphis."], ["TN0186", "04-19-2011", "Update", "Routine", "", "lead sheet", "The victim was not able to provide sufficient information to allow the suspect to be identified. reference TN 103 for similiar entry."], ["TN0383", "04-19-2011", "Open", "Routine", "", "road block", "SA Turner, interviewed neighbor, D'lynn Burton, 1958 Five Ford Rd, Parsons, 731.549.4544, while at road block. D'lynn Burton, stated Terry Evans who lives on Five Forks Rd wanted to talk to the TBI. He felt he had information on a vehicle observed by him on the morning of the event. He felt he had been brushed off by local police."], ["TN0322", "04-19-2011", "Closed", "", "", "", "Closed per SA Ronnie Faulkner"], ["TN0324", "04-19-2011", "Open", "Routine", "", "phone call", "Psychic from Michigan called stating she felt that Holly is near water or waterfall and she keeps seeing Holly and the word \"snake\".  Also feels that the suspect knows the brother or father and has reddish or dark hair.  Also stated the suspect has either a scar or mark on his upper lip and his name may start with a \"D\" or \"B\". wasnt sure if that was last name or first name. Also sees the number \"84\" which is either a route number or road sign. Call back number is (810) 214-1481"], ["TN0381", "04-19-2011", "Open", "Routine", "", "SA Jimmy Turner", "Capt Kenny Brown was told by Angie Jordan of 470 Cedar HIll Road, Parsons, TN that on the 17th or 18th of April at approximately 9:00 pm, she heard 4 wheelers in the woods behind her home. She never saw anyone come out. This struck her as odd because she never hears 4 wheelers out there this late. Employed by Community South Bank."], ["TN0378", "04-19-2011", "Open", "Routine", "", "lead sheet", "SA Talley interviewed Christee Jean Clenney, dob: 02/10/71, neighbor, 2912 Myracle Town Rd, 731.549.5392. Subject was approached by W/M stranger while jogging on Myracle Town Rd. W/M, unknown to Clenney, was in a white truck and stopped, telling Clenney he was looking for someone else. Subject named person, Clenney doesn't remember the name. Subject was nervous. This occured 2-3 weeks ago at 7:30-8:00a.m. Photo of Jason Nickell shown to Ms. Clenney. Neg results."], ["TN0325", "04-19-2011", "Open", "Routine", "", "Called NCMEC Case Mgr Bob Russo", "TEAM Adam with National Center for Missing and Exploited Children has been requested and is in the process of being deployed by the National Center. ASAC Quin will be point of contact."], ["TN0069", "04-19-2011", "Closed", "", "", "", "Nothing to do for now. Check with SA Troutt for poly results. Close - in custody."], ["TN0326", "04-19-2011", "Open", "Routine", "", "phone call", "Psychic Virginia Anders (901) 463-0024 called today and stated that she saw Holly in a ditch and that is where she will be found.  Ms. Anders did not have any other information to pass along."], ["TN0230", "04-19-2011", "Closed", "", "", "", "Email lead...close - search team"], ["TN0250", "04-19-2011", "Update", "Routine", "", "lead sheet", "Was told not to contact Karen Bobo for more information. There is a Dusty Gilbert who is a female in Parsons. Don't know if this is the person or not. Tags of vehicles @ address. TN E-25304, red Geo Tracker and TN E-30294 White Nissan pick-up. Dustin Gilbert also has TN E-30270 Dodge Ram White. Went to house 80 Gilbert Rd, Parsons. Appeared to be abondoned - no lights, 2 cars, both w/windows down, house door unlocked. Window open in back. Did not appear to be a basement house. Instructed not to contact Karen Bobo for more information."], ["TN0256", "04-19-2011", "Update", "Routine", "", "lead sheet", "SA Angela Beverly - was told to hold off on contacting Jonathaon Dodd or his grandmother, Sandra Dodd (works at Riverside High School), 731.852.3944. Brenda REdding, on search team, 731.847.2660. Jonathon Dodd - 731.549.0599"], ["TN0257", "04-19-2011", "Update", "Routine", "", "lead sheet", "Offline search of Silver Grand Ams in area. FBI to analyze list per SA Stephen Champline. FBI State Analyst is running/comparing list. Contact SA Stephen Champline."], ["TN0263", "04-19-2011", "Update", "Routine", "", "lead sheet", "SA Talley interviewed Chris Beasley 865.616.9105. Beasley advised Nickell to her knowledge is a sex offender and currently in jail in Madison Co, for stalking-type charges. Beasley advised Jackson PD Det. Mark Headen 731.425.8530 has been to her business, Max Trans, in reference to Jason Nickell. Nickell has been employed at Max Trans. According to Beasley, Nickell was absent from work on 4/13 and 4/14, on 4/15 Nickell advised he would not be at work due to the wind blowing over and totaling a vehicle. Around noon on the 15th Nickell showed up briefly to pick up a check. Nickell was driving a new Chevy Suburban truck Silver or possibly white. Nickell also presented a doctor note for his absence on the 13th, upon inspection the doctor's note was for 'Joshua WallaceåÓ. Beasley maintains this note in Nickell's personnel file. Beasley advised that Nickell's listed address in his personnel file is 1815 Liberty Church Road, Holiday TN."], ["TN0103", "04-19-2011", "Update", "Routine", "", "lead sheet", "Referenced leads pertain to attempted abduction of complainant. She ID'd Nickell in photo lineup. Dickson PD is interviewing Nickell now. He has warrants and a history of attempted abductions. His employer stated Nickell's time sheet had him clocked in at work, but he could have had someone clock him in without actually being there."], ["TN0358", "04-19-2011", "Open", "Routine", "", "From individual", "Information received from Billy Bray, 215 Westwood Acres, Scotts Hill,TN Phone number of 731-549-5853. . Stated saw tracks going into the field in ChesterField Bottom. Looked like vehicle driving into field since rain. Field is on the New CL Rd which is off Middleburg Road. Bray found latex gloves on side of road near vehicle tracks and noticed buzzards circling but said he thinks it was due to a dead dog."], ["TN0327", "04-19-2011", "Open", "Routine", "", "in person", "Herbert Patterson, 214 Oakwood Dr, Decaturville TN, reported W/M lived in area has not been seen in several days."], ["TN0327", "04-19-2011", "Closed", "", "", "lead sheet", "Capt Daniel Stoneburner, Henderson Co Sheriff, spoke with Charles Perez (733.3458) in person @ 1063 Patterson Town Loop. He stated Daniel Stevens was arrested by Deputies and taken to Henderson Co jail. Confirmed Stevens was arrested on 4/14/11 @ 1:37am and currently in custody."], ["TN0251", "04-19-2011", "Closed", "", "", "Lead sheet", "no investigative value to lead."], ["TN0329", "04-19-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Dedra (731) 220-1459 advised to check at the Cuba Landing Marina at the Hurricane Mills area in TN. Holly Bobo ex-boyfriend's grandmother Geneva Baugus owns the marina and the ex-boyfriend(Lee Baugus) would have access to a boat."], ["TN0328", "04-19-2011", "Closed", "", "", "Lead sheet", "close per SA FBI Jason Bilnoski"], ["TN0330", "04-19-2011", "Open", "Routine", "", "TBI-FIND Line", "Caller Hellen Miller (member of a search team-but not on a team today)called and stated she had a dream and seems to think that Storms Loop off Hwy 69 near Cub Creek Road needs to be searched. Mrs. Miller called again and stated that she was out walking that area alone and found: a purple eraser, rope, duct tape, a copy of the movie \"Watch Tower\", an un-opened condom, and a pack of vibran. Mrs. Miller stated that she left all the items at the location along the side of Hwy 69 near Storms Loop."], ["TN0212", "04-19-2011", "Closed", "", "", "lead sheet", "Jeffrey Whitehead, dob: 06/30/1972, SSN: 413-31-2502, 10114 Hwy 114, Scotts Hill TN, advised Donnie Burgess has not been in the area for approx 2 months. Burgess moved to Greenfield TN and Whitehead is Burgess' cousin. Also spoke to Postmaster, Monty Ray, Ray advised Burgess did not live in area and had a PO Box. Stated has not seen Burgess since first part of April and Burgess' forwarding address is 40 Allen St, McKenzie TN."], ["TN0331", "04-19-2011", "Open", "Routine", "", "Email from PIO Helm", "Email sent to PIO Kristin Helm\n\n\n\nI am certain it is nothing and is just a mis-dial, but I received a call from this number on my cell...731-234-0806 on April 12th at 6:38pm. I didn't know the number so I didn't answer it. I just saw it while deleting old messages/calls on my phone..there was no message left as it was likely a mis-dialed number...I looked it up and it evidently is from the Jackson, TN area...I don't know anyone from that area....\n\n \n\nI have a 20 year old daughter and can't even imagine the agony this family must be going through and just wanted to pass this on....\n\n \n\nThank You,\n\nEllen Toth\n\nMemphis, TN\n\n901-569-0696- cell"], ["TN0332", "04-19-2011", "Open", "Routine", "", "Email from PIO Helm", "Email sent to PIO Helm\n\n\n\n\n\nI have been following the case closely as I can.\n\nI'm from Bulgaria, the other side of the world.\n\nHere some time ago if we had 24 disappearances for 6 monts .\n\nWe decided most, but we do not have the resources and organization that has in USA.\n\nWe had two inspectors and twenty regular police for search of 100 square miles, for all 24 missing.\n\n\n\nI think I can help but I need information.\n\nWhere can I get the information fast.\n\nI have a map of the place I work with Google Earth.\n\n\n\nIs there any hunting lodges within 40 square miles? - Have you checked?\n\nWho are the friends of  her boyfriend which are hunters? åÐ Have you checked?\n\nAre there people from the city, (with caravans, trucks,campers) who travel, have traveled to another city within 11 to 15 April? åÐ Have you checked?\n\nWho usually travels for some reason, every year in April? Driver, carpenter, hunter, technician? Who spends more time on the roads and forests?\n\n\n\nThe school of Holly is there new students or teachers, who turn with more attention of her? Is somebody of they tath is hunter?\n\n\n\nPlease make some pictures of places where you look, the house (I find some), villas around afar sent  me them.\n\n\n\nYou can publish them in Google Eart, whit cordinates.\n\nCan i still ask If i remember anything more ?\n\nThanks, will watch around the clock until the case is resolved.\n\n\n\nI pray for Holly Lynn Bobo and her family!"], ["TN0333", "04-19-2011", "Open", "Routine", "", "Email sent to PIO Helm", "Email sent to PIO Helm\n\n\n\n I am a medium and psychic who lives in Ohio and I have received information through medium-ship that I feel will help to find Holly Bobo.  I saw that she is being held in an abandoned fall out shelter, not very large (about fifteen by thirty feet), tubular shaped, it is north of where she lives.  The shelter is half buried in the side of a hill.  It is still visible at this time.  He knows of this place because of hunting.  The man who took her is about lower to mid twenties, brown, short shaggy hair, about one hundred and eighty pounds, Caucasian,  borrowed his fathers jeep, it is about ten to fifteen years old and brown or red color.  He works at a grocery or convenient store that Holly went to often, especially to purchase hairspray, so it could be a pharmacy type of store.  I believe his name is Richard Holmes (Jr) who lives about twenty miles to the north of her so most likely works somewhere in between the two points.  This is all of the information that I have at this time, I hope it helps and I sincerely hope that at least a few minuets are spent to look into this information.  Please feel free to contact me if I can be of any further assistance.\n\n\n\nSincerely,\n\nErica Tabet"], ["TN0197", "04-19-2011", "Update", "Routine", "", "", "SA Simmons contacted Knight on 4/19/11 regarding this lead (0197). During the call she stated she has been receiving harrassing text messages from John Baker, cellphone 731-431-7480, who she believes is from Decatur County. He is asking her to send nude photos of herself to him. He told her he got out of jail last week (Unknown jail). She has reported this to the Gibson County SO."], ["TN0334", "04-19-2011", "Open", "Routine", "", "Email sent to PIO Helm", "Email sent to PIO \n\n\n\nIf it was a Turkey Hunter(season opened A2) there's a good chance he may have \n\nbeen hunting prior to the 13th and it may be on record. Process of elimination of one closest to area .Found this online. \n\nTennessee Wildlife Resources Agency Ed Carter, Executive Director\n\n\n\nhttps://hfwa.centraltechnology.net/TNHFInternetHarvest app/countyCheckInSearch.do  \n\n  \n\nCOUNTY CHECK IN INFORMATION\n\n* Numbers are subject to change until current hunt season ends *\n\nCounty:     \n\nSpecies:Turkey     \n\nFrom Date:     April 2/2011\n\nTo Date:     April 12/2011\n\nPrintable version\n\nAgent ID     Business Name     Number Males     Number Females\n\n8074     OSCAR D GIBSON STORE     2     0\n\n8075     69 GET & GO     4     0\n\n8206     DAISY BP     21     0\n\n8888     TWRA HARVEST STATION     21     0\n\n20044     STANFILLS DOLLAR SAVER     8     0\n\n20049     PERRYVILLE MINI MART     3     0\n\n20054     BP ONE STOP     19     0\n\n20056     DOTTIES BP & MARINE     18     0\n\n36113     SALTILLO TRADING POST     8     0\n\n57085     THE GREAT OUTDOOR STORE     1     0\n\n91046     COUNTRY GIRL TRUCK STOP     5     0\n\n4/18/2011 10:31 PM\n\n\n\nTennessee Wildlife Resources Agency\n\nEd Carter, Executive Director"], ["TN0335", "04-19-2011", "Open", "Routine", "", "Email sent to PIO", "Email sent to PIO Helm\n\n\n\nI've been told to report anything that seemed suspicious.  There may not be anything at all to this, but there's something that keeps telling me I need to say something.\n\n\n\nI live in the area that was searched this past weekend.  I was at my parent's house (next door) while people were searching our woods.  My Dad and brother-in-law were out talking to the searchers, seeing if they could help.  While sitting in the kitchen with my mother and sister, a silver PT Cruiser came up the drive way.  We didn't have a clue who it was, but suspected it was someone probably wanting to ask questions about Holly.  It was a guy we had never seen before.  He didn't introduce himself or anything.  He just asked me if we allowed people to fish in our ponds.  I told him he would need to talk to my dad, but that it was my understanding that we no longer had fish in them.  He asked if my Dad was there, and I told him he was out helping people try to find Holly.  When I told him that, he ran his hands through his hair and didn't say a word.  He seemed stressed.  Then he said, 'I wouldn't keep them; I'd put them back.  I'll come back sometime when he's here.' I had already told him the ponds were basically empty.  Just seemed strange and since we had never seen this person before, I thought I might should tell someone.  My parents have lived here probably 25 + years, and no one has ever stopped like that before.  I would say this guy was probably in his early 20's, dark hair (needed to shave), 6 ft. and 200 lbs. or less.  \n\n\n\n \n\n\n\nAgain, there may not be anything to this, but I want more than anything to help locate Holly.  \n\n\n\nThank you,\n\n\n\nBrenda O'Bryant"], ["TN0337", "04-19-2011", "Open", "Routine", "", "Telephone", "Call received from Blake White 731-847-4030. He knows of two caves that are located in the area. The first cave is out on Hwy 641 before you get to \"JC Beer Joint\" (but he doesn't think that place is there anymore) between Brodies Landing Road and Old TN 69. The cave is not very big but you can go into the cave before it ends. The second cave is across the river towards Perry County. It is a large cave that goes for quite a ways. It is hard to see the entrance and must be looking for it."], ["TN0336", "04-19-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nSearcher Austin Cook from Franklin, TN emailed suggestions and comments regarding the search conducted on 4/17/2011. Following is a summary of his email. Full email available at the Fusion Center. \n\n\n\nMr. Cook questions the brother's story, the 911 call timeline, the location and finding of the lunch box, if fresh graves at local cemeteries have been checked to see if she could be buried in one and whether a water search had been conducted as of yet."], ["TN0344", "04-19-2011", "Open", "Routine", "", "lead sheet", "Debbie Stout, 361 Davis Mill Rd, Parsons TN, 731.847.3144 was interviewed telephonically by Agent Dennis King 24th DTF. Stout reported a cabin in the woods behind her property she believed belonged to a Dodd subject. This cabin did not appear to have been occupied for a long period of time. No evidence or indications of current inhabitation. Cabin was checked by Agent King and Ms. Stout's husband."], ["TN0338", "04-19-2011", "Open", "Routine", "", "Email to TBI Website", "Tip sent to TBI Website - Summary of email\n\n\n\nhttp://www.onlinebootycall.com/search/profile-view.php?eqs=Xx3135HSeaUL%2BMW9qS9kFJeVeERQ4LNM7crTYn5dajmzKD2wKqHudBXV27HkYPzY%3D\n\n \n\nThis is the link for the profile of the name of Katty68 who is listing the age of 19 yrs in Cordova TN. She is stating bisexual. She is stating height of 5'5\". Blue eyes and blonde hair. What is interesting is it states \"I have never had sex before.\" in the information section. \n\n \n\nYou may have to log on to the site, make a fake profile and look for her profile within the search menu. She has a slightly different looking nose, but the hairline part on the right side is identical. Her head is turned slightly to the left making her nose look thinner. It could have been photo-shopped. Family could identify the picture. I am sure you could hack the site. I found her profile in less than 15 minutes. \n\n \n\nI am still thinking of the man I met down here. He deleted his profile after meeting me. Then he asked me to bring certain types of clothes with me to his house. Why would he delete his profile. We had 2 women killed down here and dumped in the woods. The police said they had the killer, but did they? \n\n \n\nI recommend you look for someone in the military. Women trust them more easily. They are usually fit and can navigate any woods without having seen them first. Also, they are more apt to snap from PTSD etc. It could also be an issue of some other sort like baby, etc. Military men hide their secrets well. They are much smarter than typical predators. Again, check the people in the hunt for Holly. If she is bisexual, could a woman be involved? \n\n \n\nBest of luck. I hope this helps. Can't believe I found this. My son thought I made the profile up myself but the administrators have to verify emails etc. You can follow the trails. \n\n \n\n-SShelton"], ["TN0339", "04-19-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website - Online map of the Pinoak Lake, Browns Creek Lake, Redbud Lake, Dogwood Lake and the Natchez Trace Park area was attached to emai\n\n\n\nHi I'm a student at South Puget Sound Community College and I was\n\nwondering if they've searched the area I sent in the jpeg... It's only\n\n20 mins away from Parsons and for some odd reason I'm feeling strongly\n\ncompelled to send this email even though I've never sent a tip before\n\nin my life.\n\n\n\nMichael Mitchell\n\n7134 Spurgeon Creek Rd SE Olympia, WA 98513"], ["TN0340", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nhttp://www.psychicsuniteforum.com/holly&#8209;bobo&#8209;age&#8209;20&#8209;darden&#8209;tn&#8209;t340&#8209;20.html \n\n\n\nI hope this helps in some kind of way. You can refresh to get more recent posts as well... I pray this helps and brings Holly home well and unharmed!!!! Thank you for taking the time to look at this. It can be very important! \n\n\n\nSent from my iPhone"], ["TN0191", "04-19-2011", "Closed", "", "", "lead sheet", "Agents made contact with Curtis Evan Scissors, W/M, dob: 12/23/66, TN 113342894, at his residence, 2275 Hog Creek Rd, Parsons, 731.847.3671. Scissors advised on the morning of Bobo's disappearance he slept in until 8:30 or 9:00am. Scissors advised he recently moved to the area from Jonesboro TN. He is not familiar with the area. He was not in Parson's last Wed or at least doesn't think he was. Scissors advised rapists should be executed and castrated. Agents observed a small minor scratch on Scissor's left and right wrists. He advised the scratches were from one of his six cats. He refused a search of his residence. Scissors left his residence 5 minutes after agents left. Agents followed him to the Sugar Tree Post Office. Where he stayed for approx. 15 mins. Scissors vehicle is an unknown year Nissan Maxima grey with TN tag 427-SHS. Criminal History and warrant check were negative per TBI Fusion Ctr. Vehicle is registered to Scissors. A human source at the post office advised Scissors owns a company called Argent Media."], ["TN0341", "04-19-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website - Summary \n\n\n\n\"This particular case, as all cases do, has emotion being projected from individuals that have wished harm on the victim and quite possibly the purpatrator also. It seems some did not understand being an attractive woman did not mean that Holly Bobo desired unwanted attention. However jealousy being what it is has caused some severe feelings towards miss Bobo due to known and unknown romantic interest. Quite possibly her school, church etc. Therefore take all seen with a grain of salt. There are those with hard feelings towards the victim and purpatrator even before this crime was commited, projecting very bizarre emotions. \n\n\n\nHowever, I do see a redneck type drinker. Did miss Bobo ever frequent a drinking establishment or a drinking party with school friends?I do realize miss Bobo was a rightly related church woman, however her friends may have encouraged other activity. \n\n\n\nIt does appear that the purpatrator has some connection to the local state park. However what cannot be defined is whether it was previous or current.\n\n\n\nGetting a feeling that the purpatrator is worried about his DNA ending up detectable. He is thinking that murder is not worth it due to DNA that might finger him and this fear of the penalties for murder. However he doesn't realize the penalties for kidnapping can be severe. He is thinking either consciously or subconsciously that he will do max 10 years for kidnapping and or a sexual offense. However the sexual offense is not a sure thing. The perpetrator's fear of detectable DNA might be one of the things weighing in the victim's favor as far as death and sexual offenses are concerned. However, the perpetrator as usually occurs in these cases is brainstorming(fantasizing) the \"perfect crime\" in order to end the ordeal and get away scott free. Time is skewed here so time frame might be past, present, or future."], ["TN0343", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website - Summary of Email\n\n\n\nEmail from Nancy Porter advising her soon to be ex-husband, Brent Alan Ellis DOB 06/17/1957 should be looked at as a suspect. Ellis has a residence at 1699 Rushing Road, Michie, TN. Ms. Porter advised subject has a criminal history in Kansas and spent 23 1/2 years in prison for armed robberies. Ms Porter advised that he was associated with the local fire department there at one time and may still be in possession of several uniforms and badges and is a former Marine."], ["TN0342", "04-19-2011", "Open", "Routine", "", "Phone call", "Caller didn't leave name but call came from 912-713-8042.  Caller stated to check Holly's computer cause she was talking the the guy she took off with.  After making this statement caller hung up."], ["TN0344", "04-19-2011", "Closed", "", "", "", "interview complete. Close per Agent Dennis King"], ["TN0338", "04-19-2011", "Update", "Routine", "", "Email sent to TBI Website", "Received additional emails from this subject. Emails sent to ASAC Quin for review."], ["TN0187", "04-19-2011", "Update", "Routine", "", "lead sheet", "SA Doug Pate contacted caller that did not ID self at 239.269.2766. TBI SOR contact for NC/GA SOR. 706.897.2084, Townes County (Georgia) SO went by home. No contact, still appears to live there. Officer that went by verified residence last SOR update. Will attempt to locate and verify location on 4/13/11 at 0745."], ["TN0366", "04-19-2011", "Open", "Routine", "", "Lead Sheet", "Dep. Ken Christopher was contacted by an anonymous caller who stated he worked with SOR Offender, Eric Christensen (2800 Jeanette Rd, Holladay TN, cell: 731.441.1216), at Palmer Tool & Dye in Camden. Caller stated Eric missed work Wed, 04/13/11, and seemed to be nervous about the police coming to search his place."], ["TN0367", "04-19-2011", "Open", "Routine", "", "lead sheet", "Dep Christopher relayed a psychic, that was reliable in the past, believes Holly Bobo to be located 3 miles due south of the abduction site in a shed that looks like an outhouse. She is supposed to be bound and gagged."], ["TN0346", "04-19-2011", "Closed", "", "", "lead sheet", "Closed per USMS Jeff Love."], ["TN0309", "04-19-2011", "Closed", "", "", "", "Per SA Lewis close. Informational only."], ["TN0348", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nholly lynn bobo,is 1700',taken out and buried in a shallow grave,by her brother,on a atv.she was stabbed,in a fight,gravesite is covered with leaves.there was no other person involved !\n\ni had said 1000'.change that to 1700'.\n\nother cases done;annie marie le,newhavenfbi.that she was dead,onsite,on school grounds.found ,stuffedv in wall chase.keighley ann alyea,kansas crimestoppers,that she was dead,buried in shallow grave 25 miles from home.dustin hilt,killed her strangled !dustin hilt buried her !meredith hope emerson,that gary michael hilton,killed her,and that he would have to take you into the forest to recover her body.which he did !missing 20 yr old in jacksonville fl.michell lee mccoy,on tv their was a claim that she had been kidnapped,by 4 men in a silver van.i called jacksonville sheriff dept,on feb 1,2011.that the person who called it in had killed michell lee mccoy,that she was dead,10 miles on interstate-10,from her home,the operator asked me if i missed my meds !michell lee mccoy was found feb 2,2011.dead !and they went to speak to the person who called it in,he killed himself \n\n---- tipstotbi <tipstotbi@tn.gov> wrote: \n\n> The information you have sent to the TBI has been received. Thank you.\n\n> \n\n> >>> \"Luis Quinones\" <lquinones27@cfl.rr.com> 4/15/2011 2:30 PM >>>\n\n> holly bobo,dead !ex-boyfrend !body 8 miles from her home.mark out a radius {8 miles}.near a etream of water"], ["TN0349", "04-19-2011", "Open", "Routine", "", "phone call", "Tammy Pettigrew, nurse in Savannah, went onto \"Holly Bobo Community\" page on Facebook yesterday and made comment about praying for Bobo family.  Under her comment, Victoria Valz Wilbeck had commented \"let's bring Holly home\"......under Wilbeck's comment was \"you wish\" and \"ha-ha let's find Holly\".  This comment was made by a \"John-Jacob-Hammer-Smith\".  Pettigrew sent Wilbeck a message, asking if she knew this person, but has not heard back.  Pettigrew has since gone back on-line and the comment has been deleted.  This was around 12:40 p.m. yesterday, 4/18."], ["TN0350", "04-19-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nI know this sounds crazy but I went to sleep last night thinking about Holly Bobo because i once knew some Bobos. I had a dream and in this dream, I kept seeing the name \" Meadowlark\". Sounds crazy huh. But if there is a meadowlark area, street, etc nearby maybe its worth looking at. Good luck with the search. Sincerely, Lynn Alan Burks"], ["TN0352", "04-19-2011", "Open", "Routine", "", "phone call", "Caller stated she picked up a hitchhiker on 4/7/11 in Nashville and was heading to Memphis.  Caller stated the hitchhiker was very dirty, smelt of \"death\", had dark dreadlocked hair and was wearing camo. Caller stated he also had a brown dog with him and he had scratches all over his arms. Caller stated he said he would have sex with her which freaked her out so she dropped him off at Hwy 66 station near Summerville.  Call back number was (901) 382-9445"], ["TN0351", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email from TBI Website\n\n\n\nMy husband and myself see a girl who could be a twin to Holly on 4/14/2011. The girl we see had hair that was a little past shoulder length. She was with a young gentleman. My husband thinks it is possible it could be her, and some of the conversation they were having may have been suspicious. She was talking about 'something she recently did and screwing up and how upset her parents would be and they would hate heråÓ. This was in a Burger King outside of Lexington, SC. If any of this sounds credible, feel free to get back to me for more details at: dkoehn1957@msn.com\n\n \n\nThank you\n\n \n\nDelilah McMillion"], ["TN0353", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nDear Sheriff, \n\n \n\nWhen I become aware of abductions in the media, I have dreams about their case which afterwards are proven to be accurate.\n\nThe information in the dream appears symbolically & people who are close to the individual will know the meaning so I can tell you the dream, but others may be better at interpreting it. \n\n \n\nA young teenage boy & girl are in a  clearing and they are burying what appears to be a fetus.  Each of them was burying one.\n\nThe boy is an only child, athletic, intelligent, may wear glasses, is shy at times & outspoken other times, plays shooting type games & is more prominent in the dream than the girl. \n\nJust before they are about to bury the fetus & it is in their hands, a man comes out from the wooded section into the clearing.\n\nThis man has medical training, works in a hospital, is in a medical type educational program, was raised by grandparents, has his own family, takes risks & participates in youth sports, & compliments as well as jokes with/about people.   (One or some of the attributes of the boy or man will have significance)\n\nThe teenage boy reports that the man knew what they were going to do & came out from hiding 2 x when they were about to bury each fetus. The boy explained that the man had planned it & was waiting for the right moment to spring out at them.\n\n \n\nMay God bless you in your search for Holly Bobo."], ["TN0313", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Out of State."], ["TN0354", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nHi. My name is Katie Pitts and I've sent yall 2 other tips without stating who I am, sorry I actually didn't think about it! Those 2 other tips were links to 'psychic crime fighter' and 'psychics unite to help find missing children'.\n\n\n\nI was sending this one to say maybe Holly had another boyfriend in her college and he may be a \"student teacher\". And I seen on 'psychic crime fighter' (the link i sent yesterday) they give a name and address of a person possibly names Allen Keith Hale. \n\n\n\nI hope this helps and will bring her home safe. \n\nOh and my email is: katiepitts79@yahoo.com"], ["TN0355", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website. (this is also lead 319)\n\n\n\nI called today about Friendship Bank being robbed...I guess it could be possible that this same person could have been involved in the disappearance of Holly Bobo. I have attached a photo that was released by Crockett County Sheriff's Dept. via Friendship Banks Cameras. \n\n\n\nThanks, \n\n\n\nRobin Cottrell"], ["TN0360", "04-19-2011", "Open", "Routine", "", "Email from Kathy Randolph TIES", "A man who lives in California called but doesn't want to give his name. His phone number is 760-567-6645. He stated that Holly Bobo treated him for one day while he was in the hospital but when he asked for her the next day they denied her being there.  He found that very suspicious.  He couldn't remember how long ago that was but the hospital is Palm Springs Desert Medical Center. He also believes this might be connected to what's happening in Long Island. He is hoping that someone will call him and talk to him about this and wants to be kept informed."], ["TN0192", "04-19-2011", "Update", "Routine", "", "", "SA John Simmons contacted Judy Stevens at 731-441-2731. She believes Jason Nickell is currently incarcerated in the Madison County Jail under a $75,000 bond. Alex Lattimore of Camden TN PD at 731-58-4622 and the Dickson County SO ar currently investigating Nickell for indecent exposure. DO NOT CLOSE PER SA MARK LEWIS."], ["TN0356", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nI live in Paris, but have family in Holladay,TN. I saw in this morning's paper that a registered sex offender from Holladay was arrested in Jackson, TN for stalking some college age women. Since Bible Hill Road goes through Holliday and some of Holly's stuff was found off of Bible Hill Rd I hope ya'll are checking this guy really closely. \n\nhttp://www.jacksonsun.com/article/20110419/NEWS01/104190308/Offender-accused-stalking-2-women?odyssey=tab|topnews|text|FRONTPAGE\n\n\n\n-- \n\nScott Underwood\n\nUPS Store #4905"], ["TN0357", "04-19-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nI think that this guy needs to be looked at, he has been inactive on facebook since the 7th, but if you will just look at what he posts its so disturbing.  \n\n\n\nHe has been deleted by most, but in the past has made bad comments to underage girls.  He is withing 50-100 miles of where Holly disappeared.\n\n\n\nEither way, he needs to be looked at.\n\n\n\n\n\nhttp://www.facebook.com/profile.php?id=1592675859\n\n\n\nHis profile is public.\n\n\n\nHannah-Wade Powell"], ["TN0157", "04-19-2011", "Update", "Routine", "", "", "SA Deanna Vargas with the FBI reviewed the referenced lead in regards to the Clint Bobo interview. Due to number of previous taskforce contacts with Clint, they wish to defer to case agent instructions on this lead."], ["TN0216", "04-19-2011", "Closed", "", "", "", "SA Deanna Vargas with the FBI checked location. Found locked trailer and delapidated house on property plus a few other crack houses. Nothing of significance found. All checked. Lead completed.To Close"], ["TN0075", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Informational purposes only."], ["TN0359", "04-19-2011", "Open", "Routine", "", "Sheriff Barker Decatur County", "Sheriff Harrell Barker provided the following information: 1768 Cypress Creek Road, Linden,TN, a sex offender out of Perry County. Has been hunting on Barnes property who joins the Bobo property. Reliable source said he was hunting there Wednesday morning of the abduction. Drives a green Dodge pickup truck. Truck has not been moved from home since Friday 4/15/11. Barker and Barnes are good friends."], ["TN0361", "04-19-2011", "Open", "Routine", "", "800 TBI FIND", "Sherry Sigler (901) 359-0554. Complainant is a bus driver in Benton Co. TN. She advised on the morning of the abduction at 7:20 a.m. she saw an older model white 4 door Honda occupied by 4 subjects. She said 2 males were in the front. She had never seen the vehicle in the area before. \n\n\n\nMs. Sigler also advised that the buses in the area have cameras and many may have been in the area the morning of the abduction."], ["TN0363", "04-19-2011", "Open", "Routine", "", "phone call", "Phillip Jones (731) 441-8235 is a professor at UT Martin Parson and called regarding one of his students. Mr. Jones stated that Jeffery Daniel is one of his students and he has class on Tues/Thurs but last Thurs (4/14)Daniel was not in his class. Mr. Jones stated this was odd since Daniel never misses class. Mr. Jones stated that Daniel was in class this morning (4/19) and he was very jumpy and nervous. Mr Jones stated Daniel told him he wasnt in class last thurs because he did not have gas to get there. Mr. Jones stated Daniel is a very intelligent student but seems socially akward. Mr. Jones also stated that Daniel's email address is valkurifromthevoid@yahoo.com. I found a DL for a Jeffery Daniel and it is TNDL 114535559."], ["TN0362", "04-19-2011", "Open", "Routine", "", "Email From ASAC Margie Quin", "Cheryl Phillips, DOB: 3-27-67, Kentucky DL (Doesnt know her number), work cell -270-978-3136, home - 270-436-5844, Address: 141 John Crain Circle, New Concord, KY 42076. This lady attended a wedding at Natchez Trace Park Lodge (thats the old Park Lodge) and got a picture of a green cavalier in the background. She said it was there from the time she started decorating until she left at approx 10:30pm.  She thought it was significant because her son ended up searching the area near there, and someone mentioned that a green car was scene at the Bobo home at the time of abduction.\n\n\n\nNotes from Brent Booth:  Unusual for a car to be left that long in that location, because a park ranger will usually run it and have it towed.\n\n\n\nI (Nick) spoke with Mrs. Phillips, but Brent seems to know her better."], ["TN0365", "04-19-2011", "Open", "Routine", "", "lead sheet", "Shelby Sellers was with Lauren Snider on Thursday evening from 6p-9p and was at residence on Wednesday from 5:30p-10:15p which was unusual. She is usually with Jonathan Dodd. Dodd and Sellers have 10 month old chid together. He stated he was helping search for Holly on Wed and Thur evening. Information provided to SA Lewis and ASAC Winkler."], ["TN0364", "04-19-2011", "Closed", "", "", "lead sheet", "Close per SA John Simmons"], ["TN0323", "04-19-2011", "Closed", "", "", "lead sheet", "Close lead per SA Booth"], ["TN0368", "04-19-2011", "Open", "Routine", "", "SA Billy Green", "SA Billy Green received information from a Jennifer Ames 731-441-7930. She stated she heard a rumor possibly from Facebook that Jonathan Dodd hsa fled to Georgia to stay with his mom. His grandmother is a teacher at a local school adn Mrs. Ames sister is in the class. Grandmother made comment that Dodd has ben acting weird and strange for the last week. Ames gave email address for Dodd jondodd@tds.net"], ["TN0383", "04-19-2011", "Update", "Routine", "", "lead sheet", "Terry Wayne Evans, 2670 Five Forks Rd, Parsons,731.847.3932. Around 8:00am Terry Wayne Evans was looking out the window of his residence. He was waiting on a call from Progressive Insurance carrier was Tucker. He saw a green truck going down Sam Evans Rd. traveling north. The vehicle came from the Five Forks Rd. The truck came from the direction where Holly Bobo lived. He knew this to be a Ford because he had a 68 Ford. The truck had a steel flat bed. Also it had a homemade box. It was a feeder type looking box. It was painted white. Did 20 months in Federal Custody. Evans was told by Terry Miller of 579 Albert Ivy Ln in Parsons that he saw the green Ford truck on Wed on 641. Mr. Miller was returning from Camden. Miller's number is 847-6706. Mickey Earl Harris' wife told Evans on Friday before lunch she saw a truck possibly the truck Evans saw. Evans is unsure the truck she saw was the green Ford he saw. The truck was coming out of Farmers Bank. The vehicle then went north on 641. Two men and a woman from Oklahoma rented a house from Tommy Evans, located at Natchez Trace Park. Tommy is a park ranger up there. This was supposed to be a couple months ago. The woman was supposed to left and went back. Terry Evans heard this from Mrs. Harris. Marty Tolley worked on the pipe line. He did have a truck like that. Tolley sold the truck. Terry Evans heard from Gerald Wayne Flower's wife, Mary Tolley had a green truck but sold it. Mary is a superintendant on a pipe line. Marty lived on the first road on left before you get to the airport, believe it is Tolley Ln."], ["TN0373", "04-19-2011", "Open", "Routine", "", "Capt. Stoneburner", "Captain Daniel Stoneburner with the Henderson County So spoke to Mr. William Atchinson on Old Hwy 69. Mr. Atchinson stated on 4/18/11 between 1:00 pm and 1:30 pm. He stated that a black SUV with gutted out passenger side stopped down from his house on S Coxbury Rd. He stated that he opened the door and dropped something and took off. Mr. Atchinson went to area and found a condom wrapper.\n\nWilliam Atchinson lives at 590 S Coxbury Rd, Sugar Tree, TN and home phone of 731-584-1999 and cell of 731-441-0504.\n\nCapt. Stoneburner took possession of condom wrapper and placed in evidence bag. Evidence bag given to SA Mark Lewis 4/19/11 @ 1510"], ["TN0041", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Vehicle information only. Ref#TN310"], ["TN0265", "04-19-2011", "Closed", "", "", "", "Close per SA Steve Talley."], ["TN0268", "04-19-2011", "Closed", "", "", "", "Close per SA Steve Talley. Informational only."], ["TN0366", "04-19-2011", "Closed", "", "", "lead sheet", "Christensen was interviewed on 04/18/11 by SA Louis Kuykendall. Christensen stated he, his wife, and son were in McKenzie TN shopping the morning of 04/13/11. His residence was searched."], ["TN0276", "04-19-2011", "Closed", "", "", "", "Close per Steve Talley. Unable to develop."], ["TN0275", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Informational purposes only."], ["TN0274", "04-19-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Close per SA Joey Clark. Nothing found at location. Non pertinent.\n\n4/22/11 at 1415 SA Joe Walker and SA Nathan Bishop searched the location. Clothes do not match Bobo's. Vulture is nesting in structure. Request Closure."], ["TN0326", "04-19-2011", "Closed", "", "", "lead sheet", "Close per SA Stegall - psychic"], ["TN0324", "04-19-2011", "Closed", "", "", "Lead sheet", "Close per SA Stegall - Psychic Info"], ["TN0321", "04-19-2011", "Closed", "", "", "lead sheet", "Close per SA Stegall - intel"], ["TN0164", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Operational Staffing Only."], ["TN0179", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Intel only."], ["TN0369", "04-19-2011", "Open", "Routine", "", "Email from ASAC Locke", "Chief Smith of Camden PD wants an agent to call him for a tip. He can be reached at 731-571-6896 cell and 731-584-4622 office."], ["TN0370", "04-19-2011", "Open", "Routine", "", "TBI FIND", "Call received from a women in Washingston State (509 860-0803 )  she claims her friend is clairvoyant. when she showed him a picture of Holly he saw the following vision--  Man in camo dragging her into woods, had her in a bunker underground as a sex slave.  Saw a older red pick up truck.  and think she is dead."], ["TN0371", "04-19-2011", "Open", "Routine", "", "Email from TBI Website", "Email sent to TBI Website\n\n\n\nTo whom it may concern,\n\n \n\nHello, my name is Scott Carroll, I am a medical student in CA.  I have worked up a profile from info gathered on the internet for your suspect.  I would assume that you will already have most of this, but I would kick myself if I didn't send you what I have.  \n\n \n\nWhite male approx. 30yo, he is likely a fellow student, I'm sure you are checking those, but I would think a student of a tech trade at the same campus.  I'm not sure what campus Holly was attending but UT Martin is on spring break, if her campus & fellow students aren't on break he is likely a recent withdrawal from that campus, otherwise any absence may be suspicious.  Ariel photos on google maps show 2lg and 2sm bodies of water just east of Swan Johnson Rd. the one further NE is most secluded w/access.  With that said I have a feeling that she is still alive, that your suspect is out of town on spring break or recently withdrawn from classes and within a 50mi radius, possibly Huntington.\n\n \n\nFrom a psychological standpoint he is probably mildly handsome, outgoing, parents divorced, raised by father, witty, smart and cunning but not noticibly more intelligent than his peers. He may also have a history of regular absence from classes or work or just part-time employment.\n\n \n\nThis is just a speculative profile, historically I have been pretty accurate, but never acted on contacting anyone until now, hence the reason I would kick myself. I am sure I can expand this with more detailed info, if you are willing to provide it, confidentially of course.\n\n \n\nPlease feel free to contact me if you feel I can provide futher information which may aid in your investigation.\n\n \n\nSincerely,\n\n \n\nScott Carroll\n\n760-972-4140"], ["TN0320", "04-19-2011", "Update", "Routine", "", "", "Per SA Gene Stegall, Hall was interviewed by the USMS on 4/18/11, but could not verify his whereabouts on date and time of incident. Leave open for further review."], ["TN0187", "04-19-2011", "Closed", "", "", "lead sheet", "Townes Co SO, 706.897.2084, made contact with William Kenley Reavis on 4/19/11 approx 1200. Reavis stated remodeling home on 4/13/11 and purchased supplies at Blairsville GA Home Depot."], ["TN0372", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Marilyn Pennington 731-697-7289 stated she has a home in Parsons (she currently lives elsewhere) and when she was visiting on Saturday she noticed a man on a 4 wheeler at an area that has 'junky trailers' on Old Perryville Road near the cemetary. She stated that as she passed by the man he turned around and stared at her. She has noticed in the past a 'no trespassing' sign but a new sign 'Keep Out' was visible on Saturday. The man had sandy blonde hair and a mustache. She couldn't really tell weight or height because he was sitting on the 4 wheeler but he looked 'heavy set'."], ["TN0356", "04-19-2011", "Update", "Routine", "", "lead sheet", "Information concerns Jason Nickell who was arrested on Friday, 04/15/11 and has been investigated thoroughly regarding H. Bobo."], ["TN0391", "04-19-2011", "Open", "Routine", "", "lead sheet", "Brandi Gore is an employee at the adult bookstore at the 126 exit (north 40 truck stop). She said she hired Shane Austin a couple weeks ago to work the night shift. She said she hired him 4/9/11. She said all last week 4/11-4/15 Shane was \"messed up\". She spoke with Zach Adams, a friend of Shanes, and Zach said, Shane has been shooting up dope. Brandi said yesterday, 4/18, she fired Shane for passing out at work. Shane told her that he took too much Benadryl because he had a lot of tick bites. Brandi said Shane worked Mon, Tues, Fri and Sat of last week 1530 to 2300. Brandi thought it was suspicious he had a lot of tick bites. (She thought from being out in the woods) She said he was off work Wed and for him to have a lot of tick bites looked suspicious to her. Attempts are being made to contact Shane Austin to confim his whereabouts on Wed morning."], ["TN0196", "04-19-2011", "Closed", "", "", "lead sheet", "SA Doug Page interviewed Robin Stanfill, ex-wife, Address for Brenda Baine at 1676 Iron Hill Rd. Found mother, Brenda Baine, at address that stated he was at Kolpak working 4/13/11. Verified with Kolpak Kason Baine clocked in at 0559 and out at 1446. Jason Baine was contacted by phone at 731.845.3303; stated at work, been searching with Rescue Squad."], ["TN0374", "04-19-2011", "Open", "Routine", "", "Capt. Stoneburner", "Tom Cook with the Decatur Co Fire Department received information that searches found on laptop on side of road 1/2 mile south of McMillwain Road on Hwy 69. Found by Misty Dillard 731-733-0117. Captain Stoneburner of the Henderson County SO took photos of laptop placed into custody bag, brought to command post."], ["TN0375", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Krystal Miller 228-215-6188 saw a newer model black Mercades on I-10 between Gulfport, MS and Louisianna 4/18/11 around 1000. She noticed a very badly beaten up blonde woman passed out in the passenger seat. The driver had black hair. She was not able to get the tag number. The vehicle was going extrmely fast."], ["TN0195", "04-19-2011", "Closed", "", "", "", "out of state-nothing further"], ["TN0299", "04-19-2011", "Closed", "", "", "lead sheet", "TFO Beasley and Gooch, FBI Memphis, talked to Patricia Heinz. She advised a Walgreens customer came in the store and said her (the customer's) son was missing. Heinz said the customer, Patricia Clark, advised her son is from Murray, KY. We attempted to call Patricia Clark, but there was no answer."], ["TN0385", "04-19-2011", "Open", "Routine", "", "Decatur CO SO", "Decatur County Dispatch received information from Tim Grace of 665 E Poplar Dr in Decaturville, TN reporting he found a stethoscope. Tony Weber with the Decatur County SO made contact with Mr. Grace just east of 6724 Hwy 100 W in Scotts Hill, TN. Mr. Grace is employed by TDS Telecom and found this item on the side of Hwy 100 while performing his work duties. Stethoscope recovered from Mr. Grace and put in evidence and given to SA Mark Lewis on this date."], ["TN0384", "04-19-2011", "Open", "Routine", "", "SA Wayne Wesson", "Deputy Ricky Pafford with the Benton County SO 731-441-8050 gave SA Wayne Wesson the following information:\n\nDavid Dodd, dob 9/20/1971, ssn 411-49-4919 resides across the Benton County line. He is a hunting guide and may have a cabin in the area where Bobo's papers were found."], ["TN0243", "04-19-2011", "Closed", "", "", "lead sheet", "SA Fazenbaker interviewed Joseph Anthony Ragusa, dob: 04/23/57, SSN:436-04-0505, aka \"Tony the Tiger\", advised he was interviewed, photographed, fingerprinted by the TBI yesterday. Ragusa lived in the 800-900 block of Nealis Woods Rd near the lake. No address for location. Ragusa advised TBI took his guns and knives yesterday. He advised he was with Bill King, an individual Ragusa works for, at the time of the incident."], ["TN0292", "04-19-2011", "Closed", "", "", "lead sheet", "No further action needed. Close per TFO Phillip Gooch, FBI Memphis"], ["TN0387", "04-19-2011", "Closed", "", "", "lead sheet", "Mrs. Morris was instructed to determine the license plate of the vehicle if she sees it again and contact the TBI."], ["TN0387", "04-19-2011", "Open", "Routine", "", "lead sheet", "Carol Morris, dob: 8/27/54, 414 Fannie Crawford Rd, Darden TN 38328, c)731-549-5047, h) 731-847-2889. Mrs. Morris stated on two straight mornings during 4/5-4/11 she noticed a red chevrolet full size pickup on Myracle Town Rd, about 1/2 mile N of Hwy 412. The truck was friven by a young W/M"], ["TN0363", "04-19-2011", "Closed", "", "", "", "Per interview, Jeff Daniels was at his residence on Crawford School Road in Decaturville on Wednesday morning 4/13/11 with his cousin Jay Vise. This information came as a result of an interview with Vise.\n\nClose per SA Wayne Wesson."], ["TN0354", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Psychic"], ["TN0351", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis . Intel only."], ["TN0197", "04-19-2011", "Closed", "", "", "", "Close per SA John Simmons. Gibson County SO assisted. No further action needed."], ["TN0353", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Psychic."], ["TN0355", "04-19-2011", "Closed", "", "", "", "Close per SA John Simmons. No further action."], ["TN0360", "04-19-2011", "Closed", "", "", "", "Close per SA John Simmons. Information not credible and warrants no further action."], ["TN0125", "04-19-2011", "Closed", "", "", "lead sheet", "Not enough information. Close per SA Harmon and SA Sullivan"], ["TN0247", "04-19-2011", "Closed", "", "", "lead sheet", "Advised there are a lot of abandoned houses in area that need to be searched. Provided no evidence just guessing the houses need searched. Stated he lives 10 miles from Holly's house. Close per SA Harmon and Sullivan."], ["TN0246", "04-19-2011", "Closed", "", "", "lead sheet", "Kim Moore advised she was at home when it happened. Her mom called her about the incident. Searched all vehicles on property and 2 vans. Everyhing looked fine. Close per SA Harmon and Sullivan."], ["TN0325", "04-19-2011", "Closed", "", "", "lead sheet", "close per SA Stegall."], ["TN0386", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Nancy Turnbo 731-445-5545 stated she saw a white male on Saturday or Sunday 'stuffing something' into a square box attached to the back of his motorcycle. She said he looked like he was trying to hide something. He was next to the Cumberland Presbyterian Church on Millsfield Highway in Dyer County."], ["TN0329", "04-19-2011", "Closed", "", "", "lead sheet", "Caller contacted. Close per SA Stegall"], ["TN0394", "04-19-2011", "Open", "Routine", "", "SA Brent Booth", "Larry Mullins was assigned by SA Brent Booth to go to Dottie's Marine at 13489 Hwy 641 North in Holladay, TN to recover camera footage to possibly help with the Holly Bobo Case. Larry Mullins has the thumb drive in his possession and is holding until he can give to SA Brent Booth. Larry's number is 731-234-3985"], ["TN0183", "04-19-2011", "Update", "Routine", "", "lead sheet", "Christy Lou Lav, 901.483.4127, reported friend's uncle, Michael Hilton, 6'2\", 165 lb, ha been missing since 4/9/11 from job at Walmart in Millington TN, vehicle 2009 Silver Nissan Sentra. Memphis PD case#1104007277ME. No more information at this time."], ["TN0378", "04-19-2011", "Closed", "", "", "", "Close per SA Mark Lewis. Informational only."], ["TN0369", "04-19-2011", "Closed", "", "", "Chief Smith Camden PD", "Chief Smith received a tip concerning a sex offender living in the area of the incident. Eric Christensen (registered sex offender) lives in immediate area and works for Palmer Tool and Dye. Wears camo on regular basis. Mr. Christensen clocked out on the 14th at 7:00 pm and clocked back in at 8:30 pm. Chief Smith has no further information. Per Scott Cagle subject has been checked on 3 separate occasions by teams since incident date."], ["TN0388", "04-19-2011", "Open", "Routine", "", "Investigation", "SA Doug Pate while checking employees at Kolpak with the Human Resource Department found that employee Jeremy Moody of 185 Washington Street, Camden, TN did not come to work on 4/13/11. Per Chief George Smith with Camden PD, Jeremy Moody was at the office of Dr. Swain DDS on 4/13/11 and Chief Smith saw the appointment card. This lead can be closed."], ["TN0388", "04-19-2011", "Closed", "", "", "", "Close Per SA Doug Pate."], ["TN0067", "04-19-2011", "Update", "Routine", "", "", "Follow up call from voicemail left by SA Doug Pate. Middleton stated he was going turkey hunting 4/13/11 at approximately 0530 and was driving on Nelliswood Rd. A 1998 hunter green Ford Explorer with 2 persons was driving slowly. Vehicle strange to area, in very good condition, no tag #. Passenger was smoking. Per SA Doug Pate leave open due to vehicle information and check on later."], ["TN0293", "04-19-2011", "Closed", "", "", "lead sheet", "TFO B.Beasley and P.Gooch spoke to Crow via telephone 423.333.8893. She advised someone was sending her strange friend requests on Facebook. We looked at this person, named \"Gregg Ingalls\" facebook page. Nothing seemed suspicious, other than this male seems to possibly be randomly contacting women online. Close per TFO Phillip Gooch"], ["TN0253", "04-19-2011", "Closed", "", "", "", "SA Angel Beverly left message for Ms. Coleman. Suzuki message removed by the First Baptist Church in Decaturville that posted the ad. \n\nMichael Menzies 731-845-6151"], ["TN0392", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller (731-968-4500)stated he was searching Craigslist for \"cars and trucks for sale by individuals\" and saw an add for Camden,TN for a 1995 Chevy 4X4 super cheap. Caller stated the seller of the vehicle was very desparate to sell the truck and would be willing to buy the truck back at a later date for more money. The telephone number listed fo the seller is (731)441-2893."], ["TN0282", "04-19-2011", "Closed", "", "", "lead sheet", "1242 hrs:spoke to Linda Goff via telephone. 1310 hrs:spoke to Monty Ray, the postal employee. He advised FBI SA Fazenbaker had already come by and spoken with them. 133 hrs:spoke to Jeffrey Whitehead in person. He advised Donnie Burgess now lives in Greenville TN and hasn't been around for about 2 months. He also advised FBI Agents had been by and spoken with him on today's date. We were unable to reach SA Fazenbaker to get more information. Close per TFO Gooch."], ["TN0311", "04-19-2011", "Closed", "", "", "", "Close per SA Angel Beverly. Subject already interviewed by other agent prior to lead coming in."], ["TN0389", "04-19-2011", "Open", "Routine", "", "Neighborhood Canvass", "During neighbohood canvass, SA Kira Hayden spoke with Hugh Russell of 4470 Mt. Ararat Rd 731-845-5104 and he stated Jerry Gilbert, approximately 60 yoa, w/m was arrested for dope and lives near Arms Creek Rd in close proximity to the Bobo family. SA Kira Hayden also spoke with Louann Wallace of 5380 Mt. Ararat Rd 731-845-5394 stated Jerry Gilbert has been arrested for drugs. He has two sons, John and Luke, approximately 20 yoa she has reported for suspicious activity on 4/18/2011.\n\nPer SA Mark Lewis leave open for informational purposes."], ["TN0295", "04-19-2011", "Closed", "", "", "lead sheet", "1346hrs:spoke to Cindy on the phone and made arrangements to meet her. 1430hrs:checked the abondoned house. It's several miles from the area and the medical supplies appear to be old and possibly left by the previous owner who is now deceased."], ["TN0296", "04-19-2011", "Closed", "", "", "lead sheet", "No further action needed. Close per TFO Beasley, FBI Memphis"], ["TN0390", "04-19-2011", "Open", "Routine", "", "800 TBI FIND", "Thomas Holcomb (931) 797-3099 - Mr. Holcomb was a student of Mrs. Bobo's and remembers a friend named Shawn Herndon that always talked about her a lot. Mr. Holcomb advised that Herndon has been arrested several times for Meth."], ["TN0259", "04-19-2011", "Closed", "", "", "lead sheet", "Called Charli - no return call as of yet. No one @ residence at 1:07pm or 6:05pm"], ["TN0210", "04-19-2011", "Update", "Routine", "", "", "Contact was made with Det Andy Davis of Dickson Co SO. He said he responded to the complaint described in the lead and that he would get a copy of the incident report and verify/confirm the suspect in that incident was still in jail on Wed 4/13/11. He will forward the information to SA Pat Looney."], ["TN0393", "04-19-2011", "Open", "Routine", "", "Neighborhood Canvass", "During neighborhood canvass, SA Alaina King interviewed Paula Dana Coleman from 405 Old Poplar Springs School Rd. She stated that property owned by Grafton Dodd has/had an abandoned house on it with air mattresses and grilling items in it. Searchers found the items while looking in the area on Sunday. Paula further stated that Dodd's grandson, w/m, approximately 20-25 yoa has a criminal history and possibly knows the victim. Paula also explained there was a sex offender that lived in a barn/camper behind a trailer belonging to Marie Johnson. The offender's name is Kendall Tuten. According to Paula, Tuten is a welder on a pipeline and is not in this area often. \n\nSA Kring also interviewed Patsy Jean Renfroe of 1285 Old Poplar Springs Rd and she gave the same information as above with the following additional information:\n\nPatsy stated that Arnold Hendrix ownned the property before his death. According to Patsy, Dodd is Hendrix's son/kinfolk. \n\nLeave open per SA Mark Lewis for informational purposes."], ["TN0076", "04-19-2011", "Closed", "", "", "lead sheet", "Retrieved store tape. Image not identifiable. Close info only, no further action."], ["TN0348", "04-19-2011", "Closed", "", "", "", "Alleged gravesite well within dedicated search area. Other provided information is unrelated. Close per SA John Sullivan"], ["TN0349", "04-19-2011", "Closed", "", "", "lead sheet", "Provided name is bogus. Close per SA John Sullivan."], ["TN0397", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Ronny Taylor 931-628-6946 stated that Holly has been shot in the chest and has been put in the center of a triangular lake near Pinson Mounds State Archaeological Park in Pinson Tennessee (just south of Jackson on Highway 45). He is not a psychic but has had numerous years of study to learn the skill of determining where people are. He said it is \"just like the other little girl who was shot in the chest\". He said that he just wants to help the family bring Holly home and \"of course, we need the money.\""], ["TN0395", "04-19-2011", "Open", "Routine", "", "TIES Angela Woodall", "Received a call from a teacher who wishes to remain anonymous.  She stated that for several years Karen Bobo taught with a Mr. Joey Tucsnak.  Mr. Tucsnak was even Holly's teachers and he had been mean to the children.  No one would ever turn him in for his behavior but that particular year that Holly was in his class he was fired.  He lives 5.7 miles from the Bobo home.  The address is 3301 Highway 641 North, Parsons, TN.  Mr. Tucsnak is approximately 55 year old and weighs about 200 lbs.  He has a lot of property and his wife has divorced him."], ["TN0396", "04-19-2011", "Open", "Routine", "", "TIES Angela Woodall", "Sue Anne Mills called.  She stated that she gets up really early every morning and on her road, Swan Johnson, there are never any cars at that time of day.  She said she heard a car or truck (doesn't know which and no description) come down the road at 4:30 am.  Very unusual."], ["TN0359", "04-19-2011", "Update", "Routine", "", "lead sheet", "located property owner at 525 Swan Johnson Rd who stated no person has permission to hunt on their property. TN tag 142ZNF (James Barnes) in driveway w/Perry Co registration. Perry County Deputy 931.209.4182 stated William Harrell Barker Jr. lived just over river bridge in Perry County. left card with property owner who will also ask son regarding Barker."], ["TN0398", "04-19-2011", "Open", "Routine", "", "lead sheet", "HR @ Kolpak (employer) 731.847.5331. Employee, Cecil Wayne Newman, did not report to work 4/13/11. Lives at 5991 Mt. Carmel Rd, Decaturville TN."], ["TN0399", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller-Dana can be reached at 615-754-8134(home) and 615-969-2202 (cell). Dana said that her mother Brenda Dressander (recently deceased)owns the property at 80 Union Church Road in Lexington. This house still has furniture and other items in it but no one lives there. Dana said there is a key hidden and her brother David Dressander can be reached at 731-307-9740 if Law Enforcement wants to check the property. There is also a barn and garage on the property."], ["TN0026", "04-19-2011", "Closed", "", "", "", "Interview conducded by TBI SA Dave Harmon. No further action required. Event closed per SA Harmon"], ["TN0362", "04-19-2011", "Closed", "", "", "", "TBI SA John Sullivan spoke with Cheryl Phillips on 19 Apr 11 at 17:43. She advised all information had been provided to SA Brent Booth. Event closed per SA Sulllivan"], ["TN0400", "04-19-2011", "Open", "Routine", "", "", "Anthony Alexander and Dana Bobo were riding around the area on Saturday afternoon at approximately 3 0r 4 p.m. on Horney Head Creek Road, about a quarter mile from Jeanette Holiday Road. They were travelling east going up a hill. At the last trailer on the right before the intersection, they observed two men and one woman burning what appeared to be building materials which was putting out black smoke. There were ground searches in the area, so Antony and Dana discussed the burning and thought it was not suspicious at the time. This information submitted by FBI Victim Advocate Mychell Mitchell."], ["TN0409", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller stated that a few days prior to the abduction, Eric Roberts called his wife(dicorce should be final in a few days)and requested that she give him his turkey mount,camo clothing, and mask. Caller called back and stated that she was unsure if Mr. Roberts actually got the items but on his Facebook page the  day before the abduction, there was a picture of him in camo and he had killed a turkey. Caller just wanted Law Enforcement to know that Mr. Roberts asked for the itmes before the abduction."], ["TN0402", "04-19-2011", "Open", "Routine", "", "Telephone", "Shannon Woodard 731-852-3911 Decatur County 911 forwarded a message from Melissa Faust 731-614-9934 that cabin number 9 Pin Oak Lodge, Natchez State Park had a screen taken off and the cabin was destroyed."], ["TN0401", "04-19-2011", "Open", "Routine", "", "", "Lead from Lorie Kennamore, Dana Bobo's sister. John Turner was arrested and charged with sexually assaulting his step-daughter. He lives off 412 going toward Lexington, TN no far from Box Road. He was once the Bobo's neighbor. Information provided by FBI Victim Advocate Mychell Mitchell."], ["TN0403", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Bubba Darnell 731-487-2776 is a psychic. He would like to talk to someone who has dealt with psychics before so he can tell them everything that he had felt. He does not charge for his services."], ["TN0404", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Crystal Cooper 731-592-9722 stated that her husband is a hunter and wondered if anyone has checked the 'hunter's cameras'?"], ["TN0405", "04-19-2011", "Open", "Routine", "", "Telephone", "Caller Phillip Bright 731-847-2603 on Brodies Landing Road. He stated there is the Vulcan Quarry but was not sure of the address [online search reads 150 Rock Crusher Lane, Parsons) He can see the area of the backside of the quarry and he saw nine or ten buzzards circling. He also noticed a stick in the ground with a coke bottle place on it as maybe a marker. He was not sure if the searchers, that had been in the area, used the stick/coke bottle as a marker of how far they had gone."], ["TN0406", "04-19-2011", "Open", "Routine", "", "TBI FIND LINE", "Caller was very apprehensive to give a name and wants to remain anonymous. Caller(s) was Jessica and I also spoke to her husband. Mr. Mays stated that about a year ago he was helping a friend, help a friend move some furniture at a house (owned by the Dodd family)next to the Dodd residence. Mr. Mays stated that there were about 4-5 dead bolt locks on the inside and outside doors. Inside the house there were chains in the corner  that appeared to hold hands and feet to the wall. There were guide wires all through the house and a strange closet and a window in the shower. Caller stated there was also a shed behind the house with carpet and a boarded window. Caller thinks that Bobby McCoy's brother was just out of drug rehab and was staying at the house with him. Caller stated that he felt very nervous just being at the house and thought it was very strange that the house had all of the bondage type things in it. Caller doesn't know the address but is willing to show an agent where it is. Caller can be reached at 731-733-1731."], ["TN0103", "04-19-2011", "Update", "Routine", "", "", "18:20 hours Tuesday 04/19/2011 TBI SA Joe Craig stated he advised Dickson PD to put out a state wide BOLO on the vehicle reported in an attempted abduction in Dickson."], ["TN0407", "04-19-2011", "Open", "Routine", "", "", "Received from LEIC Prickett at 20:10 hours on 04/19/2011. Caller was very apprehensive to give a name and wants to remain anonymous. Caller(s) was Jessica and I also spoke to her husband. Mr. Mays stated that about a year ago he was helping a friend, help a friend move some furniture at a house (owned by the Dodd family)next to the Dodd residence. Mr. Mays stated that there were about 4-5 dead bolt locks on the inside and outside doors. Inside the house there were chains in the corner  that appeared to hold hands and feet to the wall. There were guide wires all through the house and a strange closet and a window in the shower. Caller stated there was also a shed behind the house with carpet and a boarded window. Caller thinks that Bobby McCoy's brother was just out of drug rehab and was staying at the house with him. Caller stated that he felt very nervous just being at the house and thought it was very strange that the house had all of the bondage type things in it. Caller doesn't know the address but is willing to show an agent where it is. Caller can be reached at 731-733-1731."], ["TN0408", "04-19-2011", "Open", "Routine", "", "", "Lead received from FBI Victim Advocate Mychell Mitchell. Lead from Suzanne Johnson, phone 731-549-5486. She works at the Dental Office in Parsons at 519 N. Florida Avenue. She Received a phone call this afternoon at approximately 15:30 or 16:00 from Dr. Meek's daughter, Erica Pennington, who stated her in-laws, Joe and Marlyn Pennington were spending time at their cabin located at Featherfoot Point in Parsons this weekend and noticed a person on a four-wheeler. She states there are old trailers in the area."], ["TN0410", "04-19-2011", "Open", "Routine", "", "", "Hand writen statement Clint Bobo given to FBI Victim Advocate Mychell Mithcell.\n\nI had a call on my cell phone last duck season. This was probably in January. This boy told me that he was planning on hunting the blind that I hunted the day before. I felt that he was asking for my permission to hunt that blind. The blind was on Pin Oak Lake. I told him that I was not planning on hunting that lake the next morning. I told him I was going somewhere else the next morning. I told him the blind was not mine and that it was Jerry Neal Wood's blind. He said that he got my number for Jacob Woods, a friend of mine. He said that his name was John Dodd. I asked Jacob about hima nd he said that he didn't know him well, but he has hunted with him before."], ["TN0386", "04-19-2011", "Closed", "", "", "", "Event closed by TBI SA Mark Lewis."], ["TN0381", "04-19-2011", "Closed", "", "", "", "Event closed by TBI SA Mark Lewis."], ["TN0380", "04-19-2011", "Closed", "", "", "", "Event closed by TBI SA Mark Lewis."], ["TN0367", "04-19-2011", "Closed", "", "", "", "Event closed by TBI SA Mark Lewis."], ["TN0340", "04-19-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0137", "04-19-2011", "Closed", "", "", "", "Event closed by FBI SA Jason Bilnoski."], ["TN0370", "04-19-2011", "Closed", "", "", "", "Event closed by TFO P. Gooch and B. Beasley."], ["TN0371", "04-19-2011", "Closed", "", "", "", "Event closed by TFO P. Gooch and B. Beasley."], ["TN0373", "04-19-2011", "Closed", "", "", "", "Event closed by TFO Gooch and Beasley."], ["TN0372", "04-19-2011", "Closed", "", "", "", "Event closed by TFO Beasley and Gooch."], ["TN0374", "04-19-2011", "Closed", "", "", "", "Event closed by TFO Gooch and Beasley."], ["TN0375", "04-19-2011", "Closed", "", "", "", "Event closed by TFO Gooch and Beasley."], ["TN0304", "04-19-2011", "Closed", "", "", "", "Event closed by Sgt. T. Nolen."], ["TN0308", "04-19-2011", "Closed", "", "", "", "Event closed by Sgt. T. Nolen, SSTF."], ["TN0307", "04-19-2011", "Closed", "", "", "", "Event closed by Sgt. T. Nolen, SSTF."], ["TN0301", "04-19-2011", "Closed", "", "", "", "Event closed by T. Wilson and T. Nol
