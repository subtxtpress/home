12", "Closed", "", "", "", "SA Terry Dicus;  Dicus and Inman identified the residence described as belonging to Glenn Martin of 665 Kelly Access Road.  The \"fortress\" consisted of an approximately ten foot tall wooden fence that surrounds a mobile home and an rv.  No one appeared to be on the property and only an older model Ford Windstar that was not functioning was in the driveway.  A neighbor, Frank Lojas stated that he knows Martin.  Lojas described Martin as being crippled from breaking his legs after a fall sometime around last summer.  Lojas said that he has not noticed anything unusual or any females at Martin's residence except for his daughter.  He also said Martin drives a silver vehicle.  Lojas provided a cell number of (731) 220-0637 and stated that he would call the investigators if he observed anything suspicous at his neighbor's house.  Chief Rogers was familiar with Martin and he described him as unstable.  Rogers will contact Dicus if the BCSD hears anything further about Martin that needs to be followed.  This lead can be closed pending further information.  (Date worked 03-21-12)"], ["TN0856", "03-23-2012", "Closed", "", "", "", "Please close the following lead per Inv. Inman:\n\n \n\nRicky Miller, 62 years of age, interviewed by Inv. Inman and he was at home with his girlfriend Melissa on Highway 192 Benton County at the time of the disappearance.  Melissa will be interviewed to confirm when she is located.  Lead can be closed pending inconsistent alibi information."], ["TN0843", "04-10-2012", "Closed", "", "", "Phone and Personal Interview", "On 03/21/12 SA Faulkner contacted Mark Werda via phone and he advised that he had met Buck Castleberry years ago but the last time he had seen him was two years ago. he was just suspicious because of how Buck had acted in the past. Buck was identifed as Clarence Farris Castleberry 4847 Bunches Chapel Rd Parsons, TN DOB: 11/01/41.\n\nInv. Ricky Inman interviewed him and he advised that he was retired from the Navy, had heard about Holly on the news and that the only contact he had ever had with the Bobo family was when Dana Bobo delivered a load of top soil to his house. he had never been to Bobo residence and was at home the day of abduction. \n\nTBI/SA Ronnie Faulkner"], ["TN0893", "04-14-2012", "Open", "Routine", "", "Telephone", "Received a phone call from former Medina TN Police Officer @ 731 783-3992 who wishes to input his theory about where Holly may be loacted. He references the case where the girl was taken and lived in the back yard for years and the shady tent/shack was spotted but not searched. He feels the same thing has happened with Holly and that she is alive living within the community just like the girl did years ago."], ["TN0881", "04-18-2012", "Closed", "", "", "Email", "SA Faulkner contacted Inv. Ed Flores (956) 795-2852 and requested assistance. Inv. Flores stated that the corner of Hwy 35 and Hwy 59 in Laredo, TX was an area where homeless individuals frequested and he was familiar with a white blonde female who wore a long dress and had a dog. He emailed info on the female and identied her as Karen Frances Robbins DOB: 06/04/69 5'04 and 165 lbs. Incident closed per SA Faulkner."], ["TN0894", "04-28-2012", "Open", "Routine", "", "Phone", "1320 pm received a phone call from a David Coker (731 733-8451) about rumors he overheard in a bar 'Double D'in Decatur CO about Holly Bobo. He states two people (Jason Artury & Zack or Zachary) were saying that Holly is in a well in the 'Yellow Springs area of Decatur CO'and has been there for sometime. He overheard this conversation about 2 weeks to a month ago. Should you wish more info you may contact him at the phone number above."], ["TN0895", "04-28-2012", "Open", "Routine", "", "Phone", "1535 pm received a phone call from a lady @ 901 570-2516 with a TBI Tip in reference to Holly Bobo. Caller states that her girlfriend Shelia told her that her boyfriend David Thomas Garey threaten to kill her and tha let sortCol = 1, sortDir = 1;

function statusClass(s) {
  if (s === 'Open')      return 's-open';
  if (s === 'Closed')    return 's-closed';
  if (s === 'Update')    return 's-update';
  return 's-info';
}
function precClass(s) {
  if (s === 'Immediate') return 'p-immediate';
  if (s === 'Priority')  return 'p-priority';
  return 'p-routine';
}
function precRowClass(s) {
  if (s === 'Immediate') return 'prec-immediate';
  if (s === 'Priority')  return 'prec-priority';
  return 'prec-routine';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const q   = document.getElementById('search').value.toLowerCase();
  const fS  = document.getElementById('fStatus').value;
  const fP  = document.getElementById('fPrec').value;
  const fA  = document.getElementById('fAgent').value;

  let filtered = DATA.filter(r => {
    if (fS && r[2] !== fS) return false;
    if (fP && r[3] !== fP) return false;
    if (fA && r[4] !== fA) return false;
    if (q) {
      const hay = (r[0]+' '+r[1]+' '+r[2]+' '+r[3]+' '+r[4]+' '+r[5]+' '+r[6]).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const av = a[sortCol] || '', bv = b[sortCol] || '';
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  filtered.forEach((r, i) => {
    const narr = esc(r[6]);
    const hasMore = r[6].length > 120;
    const tr = document.createElement('tr');
    tr.className = precRowClass(r[3]);
    tr.innerHTML = `
      <td data-label="ID"><strong>${r[0]}</strong></td>
      <td data-label="Date" style="white-space:nowrap">${r[1]}</td>
      <td data-label="Status"><span class="badge ${statusClass(r[2])}">${esc(r[2])}</span></td>
      <td ${r[3] ? 'data-label="Prec"' : ''}><span class="badge ${precClass(r[3])}">${esc(r[3])}</span></td>
      <td ${r[4] ? 'data-label="Agent"' : ''} style="max-width:140px">${esc(r[4])}</td>
      <td ${r[5] ? 'data-label="Via"' : ''} style="max-width:120px">${esc(r[5])}</td>
      <td data-label="Narrative" class="narr-cell">
        <div class="narr-preview">${narr}</div>
        ${hasMore ? `<div class="narr-full">${narr.replace(/\n+/g,'<br>')}</div><button class="narr-toggle" onclick="toggleNarr(this)">▸ Read more</button>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('countBar').textContent =
    `Showing ${filtered.length.toLocaleString()} of ${DATA.length.toLocaleString()} leads`;

  // stats always from full data
  document.getElementById('stTotal').textContent  = DATA.length.toLocaleString();
  document.getElementById('stOpen').textContent   = DATA.filter(r=>r[2]==='Open').length;
  document.getElementById('stClosed').textContent = DATA.filter(r=>r[2]==='Closed').length;
  document.getElementById('stUpdate').textContent = DATA.filter(r=>r[2]==='Update').length;
  document.getElementById('stImm').textContent    = DATA.filter(r=>r[3]==='Immediate').length;
}

function toggleNarr(btn) {
  const tr = btn.closest('tr');
  tr.classList.toggle('expanded');
  btn.textContent = tr.classList.contains('expanded') ? '▾ Collapse' : '▸ Read more';
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('thead th').forEach((th, i) => {
    th.classList.toggle('sorted', i === col);
    const si = th.querySelector('.si');
    if (si) si.textContent = i === col ? (sortDir === 1 ? '↑' : '↓') : '↕';
  });
  render();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('fStatus').value = '';
  document.getElementById('fPrec').value = '';
  document.getElementById('fAgent').value = '';
  render();
}

render();
</script>
