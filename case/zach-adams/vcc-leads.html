red in Centerville about 3 mos ago. Suspect grabbed W/F and she dropped lamp and suspect ran off."], ["TN0492", "04-21-2011", "Closed", "", "", "TFO J Poindexter MPHS/SSTF", "No follow up needed. Not related."], ["TN0502", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Nancy Hayes, psychic, called with a vision.  Hayes stated that she works with the FBI and NCMEC.  TBI Analyst called NCMEC and was told no such person works with them.\n\n\n\n \n\n\n\nHayes gave the following statement:\n\n\n\n \n\n\n\nHolly was taken by a man who knew Holly in earlier years, most likely high school.\n\n\n\nHolly only knows him as an acquaintance.  The man tried to get close to Holly personally but was unsuccessful.   \n\n\n\nHayes stated that the man tried to get in the door to get Holy and he cut her arm with a stiletto knife.  He had the knife on Holly as he led her away and put duct tape on her.\n\n\n\nHayes stated that Holly was anally raped and killed then put in a shallow grave by a 15 to 20 year old tree.  Not in a watery location.\n\n\n\nHolly had been wrapped in an old green tarp.  After burying her he shook out the tarp and a white powder fell over the ground.  Such as fertilizer or Deer attractant.  \n\n\n\nHayes stated that man has an unusual hunting style, such as 'trip trap'where he traps animals by putting cloth down, traps them and hangs them to gut them.  He hunts with a gray 'trip trap'cloth.  \n\n\n\nMan took Holly in a concrete gray color pickup truck with a red or burgundy stripe down the side of the truck bed.  Man may have done the truck detailing himself.\n\n\n\nHayes feels the man may have a gardening background."], ["TN0504", "04-21-2011", "Open", "Routine", "", "TIES Mary Fox", "Received a call from a gentleman named Jimmie Patterson who stated he saw another male buy a shovel at the Freds store in Parsons, TN. They guy was wearing a camo shirt and blue jeans. Jimmie took a picture of the guy with shovel and a picture of the guys license plate number ecked out.  Caller used to live at this address and now Mr. Austin does. They ran into each other while the subject was working at an adult store and because of the comments Mr. Austin made the caller believes he needs to be checked out. Caller also said Mr. Austin's cousin, Jason Atry, needs to be checked out as well."], ["TN0507", "04-21-2011", "Open", "Routine", "", "Steven Kennard Uniformed Officers", "Received a call from Mr Terry Brooks of Erin TN (approximately 70 miles NW of Parsons) concerning some suspicious activity he saw. Mr Brooks stated while at his house in a rural area, he saw a young couple jogging down the road, which was highly unusual.  The male was identified as a son of one of his friends.  This particular son (Joseph Harris) is known as a trouble maker who is usually \"up to no good\".  The boy generally matches the physical description of the suspect last seen with Holly Bobo.  The boy was said to be jogging with a \"young good looking blond girl\".  Mr. Brooks also advised the son has been gone for some time, but is now suddenly back in town. Mr Brooks stated later in the day, he again saw the boy driving down the road. He saw a female in the passenger seat, but the subject was ducking down as they drove by so he could not get a good look at her face. Mr. Brooks advised he thought it was the same girl from earlier in the day. He thought given the girl's general description and the unusual events he observed, he should report the information. He also this all occurred yesterday (04-19-2011). Mr Brooks said he could be reached at 931-289-5925 for any further information."], ["TN0509", "04-21-2011", "Open", "Routine", "", "TBI FIND Line", "Caller Doug Hoggard stated he lives in Ripley, TN but is willing to search if volunteers are still needed. Mr. Hoggard can be reached at 731-612-3163."], ["TN0511", "04-21-2011", "Open", "Routine", "", "TBI FIND Line", "Caller Brittney Roberts can be reached at 731-549-7393. Brittney stated Shane Austin fits the description of the abductor and lives near Holly. Brittney is unsure of the exaact address but stated it is out of Parsons towards I-40 (maybe Conway Ridge). Brittney stated that Shane has a criminal history with drugs and weapons charges and was recently released from jail. Brittney stated that she has not seen Shane for almost a year but her other friends that know Shane say that he has been acting really wierd lately. Brittney also stated that Shane has \"thousands of guns\", some with silencers and loves to shoot them. Shane may live with his parents. The telephone number is 731-847-7468."], ["TN0455", "04-21-2011", "Update", "Immediate", "SA Greg Elliott and SA John Simmons - TBI", "SA Elliott", "SA Elliott and Simmmons went to locations with 2 wildlife officers familiar with area. Located a Winnebago camper on one of the lots. The other 2 were vacant. Searched camper and nothing found. Located camper at store and it was locked. Store owners stated the camper belonged to Dodd. Camper still needs to be searched."], ["TN0210", "04-21-2011", "Closed", "", "", "", "SA Looney spoke with Det. Mark Bausell. He confirmed the suspect of the incident was William (Bill) Lanius. Det. Bausell told SA Looney he confirmed with the Dickson Co Jail that Lanius was incarcerated on Wednesday 4/13/11. As of 4/21/11 Lanius is still in jail in Dickson County. No further investigation needed."], ["TN0427", "04-21-2011", "Update", "Routine", "Acosta", "Lead sheet update", "Rcvd from S.L. Lovelace 731 852-4650, 731 733-3100 that @1330pm via telephone, that the writer contacted Mr. Mayo who advised that a Mr. Mark Mays has been acting suspicious and had an unusually large number of trash bags to get rid of. Mr Mayo is the trash collector and advised that Mr. Mays lives in the area where the lunch box was recovered. Mr. Mayo saved the trash and thinks there may be some evidence in it. Follow up required."], ["TN0512", "04-21-2011", "Open", "Routine", "", "Lead sheet", "4/21/11 @1425pm Mike Breedlove spoke w/David Kowsky, 731 733-6656, 225 Horny Head Creek Rd, Parsons TN. He stated neighbor 'Kurt Lnu'was acting strange, walking up the road and standing prior to abduction. Lives in a house w/no windows and is a loner. States Kurt is active military, drives a small blue vehicle. Source feels it is an ideal place to put victim."], ["TN0513", "04-21-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "Telephone", "Caller Noel Freeman 307-710-5889 stated the investigation needs to check out Chester E. Siler [possible address 2880 Hwy 70, Cedar Grove, Tn]. Caller states Siler is a sexual predator and he had \"experiences\" with him ten years ago when the caller lived in TN. Caller tried to call Michael Frizzell but could not get through."], ["TN0514", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Det. William Pitts with the University of North Alabama is investigating a case where a student is receiving harassing text messages from an unknown subject using phone number 731-433-8347. A subpoena has been sent by Det. Pitts for subscriber information on this number. The subject mentions the victim Holly Bobo in the text messages sent to the student. Det. William Pitts U of N Alabama contact number is 256-765-4357. A copy of the text messages has been forwarded to LEIC Purviance."], ["TN0495", "04-21-2011", "Update", "Routine", "", "Lead sheet", "Follow up needed."], ["TN0515", "04-21-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website - Summary of Email\n\n\n\nI was approached by about 3&#8209;4 weeks ago, I was confronted by a suspicious man who was wearing camo military clothing. He was sitting at Starbucks talking to anyone and everyone that would pay him attention. I was there with a friend and he told me that he always saw the same guy at North Park in Jackson, TN walking a dog and talking to random women. He is a very \"engaging\" person. He is not afraid to approach strangers and does it comfortably. He has light brown to blonde hair, 5'10\" &#8209; 6', about 200 lbs, looked to be in early 30's and ALWAYS has the same \"uniform\" on made of the woodland style camo of old. I have never seen him drive a vehicle of any kind. He normally has a German Shepherd with him. He was wearing green camo.\n\n\n\nComplainant also advised \"He said he was some type of Homeland Counter Terrorism Unit. He even gave an acronym for it. He always used that as his \"in\" to start a conversation. If you are a part of that type of unit, why would you tell everyone? You can't get surveillance and intelligence if everyone knows you. Since that day I have not seen him, nor has anyone else since. That was about a week or 2 before Holly went missing.\""], ["TN0516", "04-21-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website\n\n\n\nI spoke with a young lady at your tip line and she asked me to email this information.  One of my hobbies is following websleuths.com online.  There was a discussion of geo-caching.  Geo-caching is a hobby where people use the GPS devices to hunt hidden spots intentionally left by others; often there are trinkets left or notes, etc. when people find the geocache.  Someone on Web Sleuths found a link to a a geo-caching log webpage where a fellow who goes by jackthebear posted that he was geo-caching in the Baugus Cave area, which best I can tell is very near the area where the Holly Bobo searchers are looking.\n\n\n\n \n\n\n\nI don't think this guy is a suspect or anything, but who knows what he may have seen while he was trying to find the geo-cache spot.  Just thought I'd pass it along.  \n\n\n\n \n\n\n\nThe website I'm referring to is:\n\n\n\n \n\n\n\nhttp://www.geocaching.com/seek/log.aspx?LUID=85d6281b-f221-435a-b75a-e61f53d3141f&IID=6ecf3514-e6cb-4b84-ad3a-4c34b7ea2a3c\n\n\n\n \n\n\n\nYou will probably need to contact the website administrators if to find his identity if you are interested.\n\n\n\n \n\n\n\nGood luck finding this girl and god speed.\n\n\n\n \n\n\n\nTim Barkley\n\n\n\nSystems Manager, The Ohio State University\n\n\n\nbarkley.10@osu.edu\n\n\n\n(740) 584.2519"], ["TN0517", "04-21-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website\n\n\n\nI belong to a website called websleuths. I have been following this case and posted some info on there about caves in the area. I was encouraged to e-mail you all with the info. \n\nthis is what i posted:\n\n\n\n\n\nhttp://www.wsmv.com/news/27625343/detail.html\n\nOn this site above that was just posted it also says, \n\n\n\nSullivan is scared now and said there are caves and trails behind her rural home. She said she's like to see those areas searched as well.\n\n\n\nIt made me think about a cave i looked at awhile back when you all were talking about them and i found this cave..\n\n\n\nhttp://www.waymarking.com/waymarks/W...ave_Parsons_TN\n\n\n\nand this picture on the day she went missing...\n\n\n\nhttp://www.geocaching.com/seek/log.a...a-4c34b7ea2a3c\n\n\n\nNot saying that guy in the picture is at all related to this but maybe he seen something that day, don't look like he entered it because of the water.\n\n\n\nper his post:\n\nI wasn't sure if I was at the right place when I was trying to find a place to park. Once I got out of the truck and walked toward the hillside I could see the cave immediately. I was surprised to see the creek flowing out of its mouth. That would make exploring it a little more difficult. All the wildflowers on the hillside today made the place feel like being in the Smokies. Thanks for bring me to a very interesting spot.\n\n\n\nALL IMO"], ["TN0518", "04-21-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "Lead sheet", "4/21/11 @1505, Investigator Wes Woodward, Parsons PD, 731 549-7403 spoke with Michell Braxton of Satellite Tracking People 866 703-7867, 571 223-4067. She stated that a Sex Offender was in Decatur County on 4/13/11. Ms. Braxton did give name and address of person, (Charles Devour, W/M, 5'6åÓ, 160 lbs, DOB 12/06/71, TOMIS# 00143835."], ["TN0519", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Cheryl Willey (262) 567-4546 - Subject advised that she had meditated on the abduction and received 4 images. First image was of a black straight lined metal open rectangular object, second was of a waterfall or spill over, third was the corner of a straight white cement structure/building,and the fourth was of a large bulbous ceramic white pitcher with milk pouring out of it."], ["TN0497", "04-21-2011", "Closed", "", "", "Lead sheet", "F. Bartlett ME/SSTF St 1790 spoke w/tipster and she thinks the guy is creepy but has no proof. She lives @ 1027 Park Parkway. Closed by F. Bartlett"], ["TN0183", "04-21-2011", "Closed", "", "", "", "No further information"], ["TN0519", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0478", "04-21-2011", "Closed", "", "", "Lead sheet", "TFO J. Poindexter MPHS/SSTF, Close no follow up needed, called @1358 and got voicemail; left msg for her to call, no response. Live in MT Juliet TN,1023 Duck Hill Trail; blonde/F early 20's. Studying in parking lot,never saw her before; probably was not her"], ["TN0520", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Cheryl Allen (731) 847-6373 work - (731) 847-3940 home - Ms. Allen has received 2 calls from a female subject named Ava at 731-695-3323 asking to speak to Holly. The first was on Sunday 4/17/2011 around 10:00 - 10:30 a.m. and today at 4:00. Ms. Allen was once married to Holly's Uncle and has not had the last name of Bobo since 1993."], ["TN0486", "04-21-2011", "Closed", "", "", "Lead sheet", "S.L. Lovelace @1405 was advised by the tipster that 3 months ago she was walking when a man approached her in a truck. The man then drove off when another care approached. Tipster not contacted, no follow up needed. Lead Completed and close."], ["TN0481", "04-21-2011", "Closed", "", "", "Lead sheet", "Internet msg board, concerned citizen stated that the kidnapper may be following the news via internet. No follow up needed, close."], ["TN0495", "04-21-2011", "Closed", "", "", "Lead sheet", "Already interviewed by SA Hudgins & THP LT Dunneway, no follow up needed, lead complete.\n\n\n\n04/22/2011 @ 1540 - Subject was re-interviewed by SA Steve Wiley (ATF) and SA Jason Cardone (FBI) in Parsons. Barnett denied any involvement in the acquisition, possession, or manufacture of any silencer. SA Wiley verified that Barnett's bank card was not a Visa and did not match the Visa Card Numbers from the O'Reilly's receipt. \n\n\n\nBarnett consented to search of his room at his grandmother's residence located at 1563 Cedar Hill Rd.in Parsons. Three weapons were examined: a .22 Rifle, Shotgun, and a Pellet Rifle with an affixed barrel compensator (for equal weight distribution)\n\n\n\nRecommend closing lead. Barnett does not appear to be subject from O'Reilly's."], ["TN0457", "04-21-2011", "Closed", "", "", "Lead sheet", "Completed 4/21/11 due to interview by SA Hudgins & THP LT Duneway, no follow up needed."], ["TN0514", "04-21-2011", "Update", "Routine", "", "", "Information received from Jacinda Byrom in regards to text. Below is the beginning of email message:\n\nDear Officer Pitts,\n\nI am just going to type these. If you need what I sent him please let me know. After we sent him that text from the police station he sent the 12:42 message. I turned around and told him I was pressing charges. Then he started trying to justify himself. I gave him a piece of my mind and turned my phone off and later went to the library and blocked his number. I can't get the picture to paste on here. But I will not delete anything until that turkey is taken care of. God Bless you for helping me. Let me know if I need to do anything further. \n\nJacinda Byrom"], ["TN0514", "04-21-2011", "Update", "Routine", "", "", "Content of text messages from 4/17/11 and # 731-433-8347:\n\n 76-1308.  He stated that the lady who took his order looked like Holly Bobo."], ["TN0521", "04-21-2011", "Closed", "", "", "VCC review", "Closed, information only at this time"], ["TN0523", "04-21-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Rena Baker (731) 693-8838 at 5:15 pm on 4-21-2011. She stated that a co-worker told her about a man named J.C. Bruce.  According to the co-worker Mr. Bruce was recently released from prison.  He is from Benton CO and was believe to have been involved in a missing person's case from the 1990's in Benton Co.  Rena said that her co-worker told her that he is back in Benton Co since his release from prison."], ["TN0522", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Lea Chapin (727) 302-0437 - Advised that she is a psychic and received information that a Tom Johnson stabbed and strangled the victim and placed her 17 miles w of town on Hwy 412 and is on the left side of a retention pond with her body covered in leaves and debris. She advised Johnson has fled to the Raleigh Durham area of NC and was driving a Blue/Black truck with Missouri license plate 945X35. She stated Johnson is 32 years of age and from a prominent local family."], ["TN0522", "04-21-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0524", "04-21-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller Melissa Sellers (731) 225-2744 saw several large birds circling around  Highway 412/Law Road just outside Lexington heading west on Hwy 412 about 1 hour ago."], ["TN0503", "04-21-2011", "Closed", "", "", "Verbal input", "Becca Earp DOB 7/14/83, 112 E 9TH ST, Parsons TN 38363, 731 733-1346; was interviewd by SA Simmons & SA Harrmon on 4/21/11 @1500pm. She advised Zach Adams 26 yoa, is her ex boyfriend, and that he was arrested in Henderson CO by TWRA approx 3 wks ago. She stated they chased him through the woods and she observed numerous straches on his face and neck area due to the chase. SA Simmons is closing this lead."], ["TN0474", "04-21-2011", "Closed", "", "", "Lead sheet", "SA Harmon is closing this lead and states Harriman PD should investigate due to distance of 4 hrs away. *Refer to Harriman PD."], ["TN0377", "04-21-2011", "Closed", "", "", "Lead sheet", "Intell only, put in vehicle database. Closed\n\n\n\nLead reassigned FBI SA Acosta 23 Apr 11 at 09:50."], ["TN0396", "04-21-2011", "Closed", "", "", "Lead sheet", "SA Sullivan called 731 847-9838 @ 1209pm & 1646pm w/no answer/no voicemail; address is 1720 Swan Johnson Rd Parsons TN. Put in vehicle database. Unable to locate house or Ms. Mills."], ["TN0395", "04-21-2011", "Closed", "", "", "Lead sheet", "Not home @1505pm 4/20/11, works @ North 40 truck stop today. Wednesday I was @ the North 40 truck stop and locl police came and got video. Mr. Tucsnak 731 733-1916 stated Holly was a quite/shy student and he taught 7th grade Social Studies and that he has searched every shed on his property."], ["TN0525", "04-21-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Gloria Wilson(901)515-8992 was at the Wolfchase Mall in Memphis on Wednesday, April 20th. Ms. Wilson thought she saw Holly Bobo in the Mall. Ms. Wilson said, she was with a w/m, tall, thin, short hair and dressed nicely. The female was wearing shorts, top, and flip flops.  The male was holding the female by the  forearm and was walking quickly."], ["TN0475", "04-21-2011", "Closed", "", "", "Lead sheet", "Out of State lead (South Dakota) in ref to former kidnapper Leslie Waye White, may need to be checked out for info. Close"], ["TN0083", "04-21-2011", "Closed", "", "", "", "If needed for future have LEIC check criminal history. However, no connection to Parsons or Holly Bobo."], ["TN0527", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "James Cannon (901) 388-7363 home (901) 848-2771 cell- Advised saw a large number of buzzards circling at 94 MM at I40. He was WB coming from Nashville when he saw them."], ["TN0528", "04-21-2011", "Open", "Routine", "", "SA Art Viveros, FBI", "SA Art Viveros, FBI received information from a Kevin Kennedy from 731-733-8662. Mr. Kennedy stated he was fishing at Brown's Creek Lake at the Natchez State Park when he found black plastic 10 gauge shells (2) on the lake shore. There is no duck hunting at the lake. The shells can be found by looking straight across the lake from the boat dock."], ["TN0529", "04-21-2011", "Open", "Routine", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "1-800-TBI-FIND", "Jerry Clenney(731)549-9354 advised TBI to talk to Billy Doug Brasher 438 Beacon Road.  He has a Black Chevy Blazer and has been cleaning it out several times over the last week. Mr. Clenney says he may have been in the Red Bud Lake area on the day before and after Holly Bobo disappearance. Mr. Clenney also said, Mr. Brasher told him he found a pair of purple panties in his truck."], ["TN0530", "04-21-2011", "Open", "Routine", "Chris Crozier,Rodney Anderson (731-467-0106),Nathaniel Shoat,FBI SA Joe Upton", "1-800-TBI-FIND", "Anonymous caller suggested TBI to talk to kenneth Lee Pipkin at 6225 Hwy 125 S, Middleton, TN. The caller said, he killed a girl and dumped her body into the river in 1994. He is out of prison."], ["TN0531", "04-21-2011", "Open", "Routine", "", "800 TBI FIND", "Roy Goff (615) 519-2817 - Mr. Goff advised he has trail cameras on his farm in Hickman Co. and they caught a tall slender man on a remote part of his farm in an odd location. He gave the photos to Brandy Sullivan a Hickman County Deputy. Not sure who the man is and has not been identified to his knowledge. He still has the images if needed."], ["TN0532", "04-22-2011", "Open", "Routine", "", "Email", "Date/time: 4/21/11 at 9:40pm\n\nReceived call from 731-614-1313.  Caller stated son had been at a meeting tonight with the Wildlife Rep.  Stated had been given a map of area that will be searched tomorrow in Natchez Trace Park. Caller stated three vacant houses on a Wilders Timberlake Road in park.  One house has been vacant since New Year's when owner:  Tom Yates moved to Washington state to be with daughter because of his health. Mr. Yates' daughter, Kate can be reached at 253-875-6506; Kate can have someone with keys meet then at the house to open it up."], ["TN0533", "04-22-2011", "Open", "Routine", "", "Email", "Date/time: 4/22/11 at 1:07am\n\nCaller, Torrane Concord at 209-409-4283 (flying out later Friday am).  Mr. Concord stated that around 11:00pm Central time on Thursday evening, he saw a women who resembled Holly come in and out of Room 219 at the Fairfield Inn-Marriott near the Lexington Airport.Caller stated the women did not appear to be in any distress but he felt he should call with this possible siting of Holly."], ["TN0534", "04-22-2011", "Open", "Routine", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "written statement", "Kim Duncan, 4-21-11, (Karen Bobo's sister) at 5:15pm. Kim Duncan stated that on Tuesday, 4-19-11 at approximately 2:00pm, she was leaving the Bobos house traveling south on Swan Johnson Road - noticed Cathy Wise standing in her yard near a landscape bedded area. Kim Duncan stated that Cathy  Wise didn't appear to be working the bed but trying to ease drop. Kim Duncan stated when she returned to the Bobos' hous on Swan Johnson Road that day around 4:30pm she noticed Cathy Wise wasin the same area - just standing and looking around. Then that same day at approximately 6;30pm Kim Duncan, Terrie Bromley, and Tammy White left the Bobos' house on Swan Johnson Road traveling south to Natalie Bobos' house. Upon returning to the Bobos' house from Natalie Bobos' house around 7:30pm, Kim Duncan noticed Cathy Wise was still in teh same area of her yard looking around Kim Duncan stated that Tammy White, who was in the car with she and Tarrie Bromley noticed Cathy Wise behavior also."], ["TN0535", "04-22-2011", "Open", "Routine", "", "VIA Email form ASAC Doug Long", "Donelle Crowley who is helping register volunteers says she talked with a tarot card reader who read Holly's tea leaves week before last and claims she is in a hotel being held against her will. Crowley's number is 731-549-4570."], ["TN0536", "04-22-2011", "Open", "Routine", "", "Written Statement", "For Information Only - 4-21-11\n\nLead from Mychell Mitchell, FBI Victim Specialist\n\n\n\nOn Wednesday, 4/20/11, at approximately 6:00pm, Natalie Bobo, Karen and Dana Bobos' niece, came to the Bobos' house. Natalie Bobo stated she was having a bad day because Holly Bobo had not been rescued or recovered. Karen Bobo took Natalie Bobo to Holly's bedroom to talk with her. After about thirty minutes Karen Bobo came out of Holly's bedroom without Natalie Bobo and asked FBI Victim Specialist Mychell Mitchell to talk with Natalie Bobo. Victim Specialist Mychell Mitchell went into Holly's bedroom where Natalie Bobo was to talk with her. Natalie stated she was upset about Holly's disappearance and not finding her yet. Natalie Bobo stated that it was strange because Holly Bobo thought she (Natalie Bobo) would end up missing one day because of her risk taking behavior. Natalie Bobo stated that she had worked in a strip club in Miami, Fl. In addition, Natalie Bobo stated she uses drugs and drinks and hang out with people that Holly Bobo disapproves of. Natalie Bobo stated she had been to Henderson and Savannah, Tn that day with some people searching the area for Holly. Natalie Bobo stated that the lake cabins in the area appeared suspicious to her because lights were in some of the uninhabited cabins."], ["TN0536", "04-22-2011", "Closed", "", "", "", "For Information Only"], ["TN0524", "04-22-2011", "Closed", "", "", "", "TBI SA Harmon and Simmons checked area with negative results. Event closed by SA Harmon."], ["TN0520", "04-22-2011", "Closed", "", "", "", "Lack of information."], ["TN0537", "04-22-2011", "Open", "Routine", "", "written statement", "Statement from Mychell Mitchell, FBI Victim Specialist, stated the Bobos' have been receiving calls and texts from Ava Baker. Last one received 4/21/11. Ava Baker has called the Bobos' home phone several times since Holly Bobo went missing asking to speak with Holly. Ava Baker has also called Dana Bobo mother's house, Ruby Bobo, twice. Ava Baker reported she is 10 years old and lives in Camden, Tn. Ava Baker's mother is Tammy Baker. Ava Baker is harrassing the Bobo family with the multiple phone calls."], ["TN0538", "04-22-2011", "Open", "Routine", "", "telephone message through Mycell Mitchell", "Jason Nickell, Holladay, Tn. One of his toll workers said he was not at work wed, thurs, friday last week."], ["TN0539", "04-22-2011", "Open", "Routine", "", "Email", "Female called in identified her self as Crystal Peirpoint ( she did spell her name out to me)she advised 2 numbers work /731 644 0723 and her cell / 731 441 8618 she stated the following : That her husband Cory Peirpoint works with a JC Bruce at Delta contracting. In this conversation with her husband - JC Bruce was known to have been logging in the woods near the Bobo home, that Bruce purchased an item / she didn't say what and he had taken it back to get his money back with Mr Bobo not refunding the money back. Bruce was heard to state- that he was going to get even with Bobo for it. Ms Peirpoint pointed out that Bruce is the brother of the Bruce brothers who were convicted on the Danny Vine case / where the couple was murdered and the house set on fire, over shells. Further stating that Bruce is a diver and has not been diving for quite some time now- and has been seen recently pulling a boat from the river. location unknown. If you have additional questions she is willing to assist. ***spoke to SAC Mehr on this- he said that they have already spoke to JC Bruce.  But wanted it for record-"], ["TN0539", "04-22-2011", "Closed", "", "", "", "Information/Record Only"], ["TN0540", "04-22-2011", "Open", "Routine", "", "Email", "A woman named Susan from Nashville called in.  Her number is 615-485-3018.  She said about a month or 2 ago she was at a McDonald's on Old Hickory Blvd over towards Nashville Shores.  A rough looking man dressed in camouflage knocked on her window.  She waved the guy off and after 30 seconds he left. She also stated that he acted very weird.  She said she called Metro police 862-8600 number and gave them a partial number to the car the guy got into. The guy left McDonald's and pulled into the Shell station across the street and sat there.  This was on the same day that the MBA rifle team was at the McDonald's around 8 pm after their rifle match."], ["TN0541", "04-22-2011", "Open", "Routine", "", "Email", "A woman called in and said she was watching an ABC News video from Wednesday April 20.  She said the man in the blue jacket, when he notice he was on the camera he stepped behind the man with white hair.  The woman who called in that this looked suspiciously."], ["TN0542", "04-22-2011", "Open", "Routine", "", "Email", "Around 1028 hours Ms Tibbs 731 571 5131 stated that she spoke to FBI person no name given and was advise to call TBI with this information. Shane Austin WM was taken hostage several years back and taken to Pentecost Hill by a drug cartel where he was near beaten to death. This individual has a fixation on Holly always has. He is a known drug user and paranoid/he has a cell phone that registered to Juanita Hickerson,subject's grandmother, deceased.Cell/731 733 1865 Shane Austin resides with his parents a Rita and Jimmy Austin 790 Pugh Rd, Holiday TN - S of Natchez Park area. Caller stated that Shane Austin runs with a BM Jonathon Mays - linked to a Jeff Miller and Jonathon Dodd. Dodd has a grandfather, Grifton or Grafton Dodd who refused access to property when door by door search was done? Property backs up to yellow spring cemetery area/or Lady's Bluff - stating that Lady's Bluff was supposed to be the deepest area in the river. That Jimmy Austin's boat motor is suddenly missing and Shane keeps trying to get his cousin to go fishing with him all of a sudden. Ms Tibbs further stated that holly was possibly underground in a shelter or bunker/tornado shelter/ that TBI got too close in the search and Holly was moved to another location.- it was unknown if the subjects have radios or scanners/ the information was coming from drug users in the area. Tibbs told the FBI something wrong yesterday - she told the FBI guy that one of the Decatur Dep's called the Austin residence to give them a heads up on their son being looked at- she stated that she was incorrect on who the dep called–that it was actually the Auntie a Shirley Kay Autry who the sister of Rita Austin. That the Dep's do that kind of stuff all the time there- set back take the information and then give a heads up that the family member is being looked at for questioning or charges. Some how Shirley Kay Autry is related to Mr Bobo."], ["TN0543", "04-22-2011", "Open", "Routine", "", "Telephone", "At 1105 4/22/11 Lead taken from Karen Bobo by Mychell Mitchell, FBI Victims Specialist -Karen Bobo reported that on Wednesday afternoon, 4/20/11, their neighbors house, Casey and Bethany Jowers, was broken into. Karen Bobo reported items missing were cash, groceries, and some video games. Karen Bobo reported the video games were recovered in the pasture. Karen Bobo reported since the abduction of Holly, the Jowers have been staying with Bethany's parents, Bonnie and Mickey Powers, who live at 5342 Hwy 100 West, Scotts Hill, T; (731) 549-2267. Karen Bobo reported Bethany has a sister who lives in the area off Myracle Town Road. Karen Bobo reported Casey and Bethany Jowers often rode four wheelers with her children, Chit and Holly Bobo."], ["TN0544", "04-22-2011", "Open", "Routine", "", "In person", "Sgt Byrd, Henderson County Sheriff's Department 731-798-0897 - Kris Brantley (civilian) 731-614-1672 found a bag of yellow cloth (bedding in a plastic bag on 4/22/11 at 1760 Darden Christian Chapel Road (off 412 East). She called the Henderson County Sheriff's Dept, who brought the bag of evidence to the National Guard Armory CP. The bag was found 10 to 15 feet off the road."], ["TN0544", "04-22-2011", "Update", "Routine", "", "in person", "SA David Harmon - The FBI Evidence Response Team took the evidence to dry. Andrew Huckstadt 901-229-2780 took control of the evidence. Follow up needed"], ["TN0452", "04-22-2011", "Closed", "", "", "In person", "Check of 1200 Gilbert - negative for Jody Troxler. Obtained his cell phone 731-845-3251. Per Troxler he has already been interviewed regarding Holly Bobo three days ago. Troxler reported to SA Moore he did travel to Tunica, MS on Saturday night (4/16/11) to gamble. Troxler is available for future contat if needed at 731-845-3251."], ["TN0461", "04-22-2011", "Closed", "", "", "in person", "SA Kimberly R. Moore - Unusual activity at 94 Jacqueline was determined to be renovation work being conducted at property by family member of owner. Per Jeff Oatrvall, 50 Jacqueline, Camden, TN the owners of Jacqueline are William and Della Casey. They currently reside in Harwood, IL. They purchased 94 Jacqueline about two years ago as a retirement home. Their family members, specifically, a brother-in-law described as a white male driving a blue truck, checks on the property regularly. Oatsvell thinks the brother-in-law last name is Rhodes. Oatrvall has observed them renovating the property from time to time."], ["TN0545", "04-22-2011", "Open", "Routine", "", "Email", "A gentleman named John H Yates Jr called and said the man (who abducted her) was a w/m with sandy hair, tall slim man, drives a grey or white little van - recreational type van.  He said to look in the river or near a water fall - southward.  (She was put in the river.) He said the river is running about 15 miles per hour that the body probably has moved and is lodge under a building that is partially in the river.His phone number is 216 961 4405.He gave his web page of www.yahwehei.com"], ["TN0546", "04-22-2011", "Open", "Routine", "", "Email", "A gentleman named Joe Thratcher who drives to Nashville and back home everyday for his job stated that he saw a little gray car \n\n(Corolla or Mazda) part in front of the gate at a Water Treatment Plant near Parson.  There was a guy was standing in front of the gate that was open.  This gentleman had his hair pulled back tied to his head.  He was looking out across the plant.  The guy was dressed in a camouflage pants and blue T-shirt.  He went by their between 2:30 - 3:00 and 6:00 - 7:00 every day.  He said their is a creek that runs down beside the treatment plant. Joe Thratcher's  number is 662-284-7069"], ["TN0547", "04-22-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "Email", "We received a call here in Columbia from a Billy Benefield, (931) 388-5575, 2485 Knob Creek Road, Columbia, TN in regards to the Holly Bobo matter. On Thurs, 4/14/2011, Mr. Benefield, along with J.W. Scott and Larry Inman, were in the area of Bunches Chapel Road at approx 11:30 am when they came across a lone W/M in a small white car, possibly a Chevy, acting strangely.Mr. Benefield had turned off Hwy 412 and headed north on Bunches Chapel Road and traveled approx 1/2 mile and turned east on a \"New gravel Road\".  Mr. Benefeld indicated that he believed the \"Gravel Road\" was located between Long Hollow Lane and Spring Hollow Lane of Bunches Chapel Road. Mr. Benefield traveled east on this \"New Gravel Rd\" for approx. 1/2 mile and then turned around heading back west towards Bunches Chapel Rd when he came across this suspicious vehicle sitting in the roadway.  The driver immediately got into his car and left the area very quickly.  Mr. Benefield noted that there are no houses in the area and this car had no real reason to be there.  The car was not present when he went down the road prior to turning around and heading back to Bunches Chapel Road. Mr. Benefield followed the vehicle for a short period and then he was unable to keep up with the vehicle.Mr. Benefield could provided no further information on the description of the W/M\n\nSpecial Agent Brian E. Fazenbaker\n\nFederal Bureau of Investigation\n\nColumbia, Tennessee\n\n(931) 388-0398 (Office)\n\n(615) 319-5870 (Mobile)\n\n(931) 381-1530 (Fax)"], ["TN0548", "04-22-2011", "Open", "Routine", "", "Email", "A psychic called in and said that she saw/vision on Holly Bobo.  She saw the name Scott Bryan Robins.  She said she found a Scott Robins that lives in Loudon TN.  She also said that she sees a little shack hunting cabin in the foothills.   The guy is scruffy looking who also knows the father or son.  This guy also has an East Coast accent that may also be covered up with the South accent.  She saw the number 102 that is a route number or fire trail.  She also sees 20 min or 20 hrs."], ["TN0061", "04-22-2011", "Closed", "", "", "", "Lead followed and closed."], ["TN0548", "04-22-2011", "Closed", "", "", "", "Psychic Lead."], ["TN0294", "04-22-2011", "Closed", "", "", "", "Contact made by Beasley/Switzer. Outbuildings searched and he was interviewed."], ["TN0343", "04-22-2011", "Update", "Routine", "", "", "J. Morris/S. Grooms spoke to local fire/police chief on 4/19/11 at 1400. Does not know of an Ellis subject. Checked listing for Michie, TN and found no listings. Ex accusing Ex - checked justice portal - shows Ellis at listed address in McNair County. No TOMIS record. Get McNairy County investigators to interview."], ["TN0343", "04-22-2011", "Closed", "", "", "", "Follow up by local agency."], ["TN0510", "04-22-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "in person", "SA Nathan Bishop - 4/22/11 at 1453 spoke with Ms. Campbel via telephone. Walley Limbur is the subject's correct name. All of the communication was via Facebook. This same subject has sent similar emails to her in the past about other missing persons in the past. Caller stated that she first thought the subject was psychic but the subject corrected her and said he received his information from God. Subject reported that he lived in North Caroline. Request closure."], ["TN0549", "04-22-2011", "Open", "Routine", "", "Written Statement", "4/22/11 at 1230 Lead from Karen Bobo take by Victim Specialist Mychell Mitchell. Joey Tucsnak was a 7th and 8th History teacher at Scotts Hill School K through 12. Joey Tucsnak was Holly Bobo's 7th and 8th grade History Teacher. Joey Tucsnak always made Holly uncomfortable for some reason. Karen Bobo reported that Joey Tucsnak was terminated from his teaching position by Henderson County School Syste for inappropriate sexual conduct with female and make students. Holly Bobo was one of the students questioned by the officials at the officials at the school regarding Joey Tucsnak's behavior with students. Karen Bobo reported in Holly's senior year she field trip and stopped at North 40 Truck Stop where Joey Tucsnak works. Joey Tucsnak attempted to talk with Holly when she came out of the restroom. Karen Bobo reported Holly was always afraid of Joey Tucsnak."], ["TN0550", "04-22-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "written Statement", "Family is suspicious of a Grant Adams who they don't know, but is Facebook friends with Holly. They report they were told that Grant missed a lot of school this year because of seizures, and this his seizure medication would be useful in keeping Holly sedated."], ["TN0120", "04-22-2011", "Update", "Routine", "", "", "Check the Tubb's out."], ["TN0513", "04-22-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "In perso", "SA Nathan Bishop 4/22/11 at 1315 - no SOR record found on Chester Siler Subject does not live in this county. No prison record. Subject has DOB of 1938. He does not match description. Request closure."], ["TN0551", "04-22-2011", "Open", "Routine", "", "lead sheet", "TRP Dewayne Stanford - Stopped Jason Makowski on i-40. Arrested him for DOSL and warrant for V.O.C.C. (Henderson County). Makowski stated that Jeff Miller stated that Holly left with a guy, last name Scott, the morning of indicent on 4-wheeler."], ["TN0551", "04-22-2011", "Closed", "", "", "Lead sheet", "4/21/11 at 0830 Inv. Tracy Grisham interviewed Jason Makowski at Henderson County Jail. Makowski stated that Jeff Miller had information concerning HOlly Bobo. He stated that Miller knew that Holly left with a guy, last name Scott, on the morning of the incident. He stated that Scott had been waiting to hook up with Holly. Stated that she walked into the woods and they got on a 4 wheeler. Makowski stated that we needed to look at a cave on Hwy 221? It feeds from a creek. 4/21/11 confirmed that Jeff Miller is in Decatur County Jail."], ["TN0552", "04-22-2011", "Open", "Routine", "", "Lead Sheet", "Victim Specialist Racheal Pearce FBI - went with Clint Bobo who purchased a camo jacket. Clint said the shirt was close to the pattern that the man with Holly was wearing."], ["TN0552", "04-22-2011", "Closed", "", "", "", "Closed."], ["TN0556", "04-22-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "Interview with Tammy White", "Interview of Tammy White - Friend of Karen Bobo (731) 549-0585\n\n\n\nWhite reported that about two or three months ago in Hickman County a man wearing the same kind of clothing attempted to abduct a woman under her carport. Tammy reported seeing a Hickman County Public Transport Van in Parsons area twice this week. White advised she saw the van today and it did not have people in it."], ["TN0376", "04-22-2011", "Update", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "TFO's P. Gooch & B. Bewley", "1900hrs-We went and interviewed Max Chumney at his residence, which is 775 Tip Hayes Rd (731-847-2739). Chumney knows Mr. Bobo but hasn't been to the house ib 7 or8 years. Chumney never mentioned missing work last Wed. but his employer said Chumney normally is there by 7am and gone by 7:30 a.m. Chumney stated last Wed. he took hisgirls to school that morning around 7:30 and he has been taking them to school. Lackey can't recall what he did when he left the school around 7:30-7:35 a.m. but says he normally goes into town and gets something to drink. He remembers thatt he was talking to a man in the neighborhood named Brent Lcy when they saw Lelos flying around. Chumney didn't act suspicious or nervous. Chumney drives a red truck or van."], ["TN0553", "04-22-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "SA Champine", "State Probation and Parole has GPS Tracking Devices on some individuals. Have Probation and Parole review data to determine if ant subjects in Decatur County."], ["TN0554", "04-22-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "FBI SA Chris Miller", "Steve Burton came by command post at the National Guard Armory. Stated he was told by someone that he was a subject of interest. Burton arrived at Armory and was later turned away. Burton thought the FBI was looling for soemone 6'0\" tall, bald headed that matches his description. Steve Burton wanted to clear his name. Stated he could be contacted anytime at 731-293-5406."], ["TN0554", "04-22-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "FBI SA Chris Miller", "Waiting for return call from Steve Butron."], ["TN0570", "04-22-2011", "Open", "Routine", "Rachel Pierce Victim Specialist FBI", "From Victim Specialist R Pierce", "Clint Bobo got a Facebook Alert/Text from \"Sid Winek\" with the subject \"Witness\". It stated \"What were you thinking when you saw your sister being led away? Did that behavior seem normal behavior to you?\" Clint does not know Sid. Has gotten over 500 friend request since this happened."], ["TN0555", "04-22-2011", "Open", "Routine", "", "TBI SA Robert Simmons", "During a neighborhood Canvas, Katrina Gilchrist 2800 Mt. Ararat Road Parsons, TN 731-845-9788 stated that Brooke (LNU) is a newer student at West TN Business College in Jackson. She (Brooke) has made statements that she knows Dodd and thinks Dodd is involved. She claims she was interviewed by the Sheriff's Department."], ["TN0530", "04-22-2011", "Closed", "", "Chris Crozier,Rodney Anderson (731-467-0106),Nathaniel Shoat,FBI SA Joe Upton", "From US Marshal C Crozier", "Pipkin was at work from 06:30 until 17:00 on Wednesday, April 13, 2011. Spoke with Office Manager Sheila Burrow at (731) 376-1166. She verified Pipkin was at work."], ["TN0376", "04-22-2011", "Update", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "SA Nathen Bishop and Joe Walker", "At 7:05 a.m. was at home. Left to take the kids to school. Left school at 7:35 a.m. Went to eat at Sonic. At 8:45 am until 10:00a.m. Saw nothing strange. No strangers in neighborhood. Fed Ex and UPS drivers only delivery in area. Subject did not act suspicious. Nothing to indicate he was involved. Patrick Smith and another subject on a 4-wheeler by Sandy Pottigrews house on Iron Hill Road about 11 a.m. Subject had taken the time to write out his activities."], ["TN0376", "04-22-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "SA Nathen Bishop and Joe Walker", "Subject took time to write out his activities. Request that Lead be CLOSED."], ["TN0557", "04-22-2011", "Open", "Routine", "", "TBI SA Faulkner", "On 4/21/11 at approx 8:30 pm SA Faulkner received a call from D'Lon Dodosn, he stated that he and a friend were talking and thought of John Nerren as a possible suspect,Nerren always wears camo and works in mussel shell bussiness. John Nerren is in late 40's and lives in Parsons,TN. SA Brent Booth knows Nerren and said he has no criminal history."], ["TN0518", "04-22-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "Lead Sheet", "FBI SA Steven Champine contacted State Probation/Parole about subject. GPS tracking info reviewed and suspect was not in Decatur County at time of incident."], ["TN0558", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a call @ 0740am from a lady who stated that 2 wks before the Bobo case,  her daughter & friends were walking on campus @ UT Martin and were approached by a man in a car and was trying to talk to them. The campus PD was notifed and stopped the car and questioned the man w/no other incident."], ["TN0559", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 0750am from a man who was traveling I40 and stopped @ Exit 183 (Nicks' BBQ) and saw 5 young girls sitting @ a table and one of them kind of looked like the Bobo girl. Not totally sure, but wanted to report this because he saw it on tv."], ["TN0560", "04-23-2011", "Open", "Routine", "", "Email", "Please add to vcc.\n\nJason Locke, Assistant Special Agent in Charge\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation\n\n901 R.S. Gass Boulevard\n\nNashville, TN 37216-2639\n\nJason.Locke@tn.gov \n\n>>> Helm, Kristin(Kristin Helm) 4/15/2011 6:33 PM >>>Just wanted to let you know that some guy named Michael Sanders has posted on our Facebook 'I have her'and 'she is right here in my closet.åÓMatthew has deleted the post from our page, but I print screened them and have attached the comments to this email.\n\nNot sure if this is big deal or small deal, but just wanted you to be aware of this.He also made comments on other of our statuses relating to her that were saying 'they prolly raped her in the woods' and 'The brother is LYING.. seriously. Hes lying in the whole investigation.åÓThose comments have not been deleted and are under our 'Holly Bobo Presser: She was not taken from inside the home, she was not forcefully dragged, but was taken into the woods'status.\n\nAgain, not sure if this is just some wacko posting on our page but wanted you to see it!Thanks!\n\nCrystal Compton|Assignment Desk WSMV-TV|ccompton@wsmv.com|615-353-2440"], ["TN0561", "04-23-2011", "Open", "Routine", "", "", "From:  Emerald Star  \n\nTo:  Allen, Amy; Anthony, Larry  \n\nCC:  TIES  \n\nDate:  Friday - April 22, 2011 8:12 PM  \n\nSubject:  Holly Bobo Tip  \n\n\n\n--------------------------------------------------------------------------------\n\n \n\n \n\nDate/time:    4/22/11 at 9:00pm\n\n\n\nA Sgt. Cohl, called from 901-636-4446, from Memphis PD called (please call her cell 901-289-5899) stating she has two people who may be involved.\n\n\n\nThese subjects drove from Memphis to Lawenceburg.  On April 11 they left Lawrenceburg to drive back to Memphis.  At this time neither subject has been heard from. Mr. Rowden's mother is not being very forthcoming with Sgt. Cohl at this time.\n\n\n\nSgt. Cole would like to talk to someone regarding these subjects and any possible connection to Holly Bobo case.\n\n\n\nFirst subject:  Scott W. Sobey\n\nW/M DOB 10-15-1977, SOC 004-80-4395\n\nTN DL 119478472\n\nFBI #593250VB1\n\nTN SID TN02882449\n\nProbation officer currently working on paperwork to enter as a wanted subject\n\n\n\nSecond subject:  Brent D. Rowden\n\nW/M, SOC 408-31-4010, TN DL 077833056\n\nServed time for Aggravated Assault and Rape\n\nLast known address:  49 Turnpike Rd., Lawrenceburg, TN\n\nDriving a red/maroon 2dr Ford Expire\n\n\n\nEmerald Star/TIES"], ["TN0562", "04-23-2011", "Open", "Routine", "SA Jeff Jackson", "", "Sex Offender Canvass produced name of William Harrell Barker. Barker did not reveal that he hunted the land around victim's residence and he is friends with neighbor/suspect Barnes."], ["TN0564", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 1000am from Cynthia who is an analyst 757 288-0407 in Norfolk VA; stating that she has compiled an Excel spreadsheet of all the facebook accounts in Parsons TN. The one account that stands out the most is Tony Stone, who lives at 811 Holiday Rd which is within 6.1 miles of the Bobo's home. He has numerous aliases on facebook, 2 of which are under the name of his deceased son (Brandon), & 2 gmail/tweets under the name of (April Spoon). None of the accounts seem to ref to Bobo or anyone that was on her facebook account."], ["TN0563", "04-23-2011", "Open", "Routine", "", "", "Date/time:  4/23/11 at 2:38am called from 559-515-0114:\n\nUpdated Lat. 35.878721, -87736985\n\n \n\nA psychic called from 661-380-4269, stated to look at Lat 35.87821, -87736985, location of Barren Hollow Dr., Bakersville, Bold Spring.Stated she saw that Holly may be unconscious and may not be alive.  Caller stated to use this latitude and not the address because it is wrong.  Caller stated she is diver and that she left a comment on the website.  She did not state what the website address.\n\nEmerald Star/TIES\n\nA psychic called from 661-380-4269, stated to look at Lat 35.87821, -87736985, location of Barren Hollow Dr., Bakersville, Bold Spring.\n\n \n\nStated she saw that Holly may be unconscious and may not be alive.  Caller stated to use this latitude and not the address because it is wrong.  Caller stated she is diver and that she left a comment on the website.  She did not state what the website address.\n\nEmerald Star/TIES"], ["TN0565", "04-23-2011", "Open", "Routine", "", "", "From:  Belinda Allender  \n\nTo:  Allen, Amy; Anthony, Larry; ties gang  \n\nDate:  Friday - April 22, 2011 9:48 PM  \n\nSubject:  tip on Bobo  \n\n\n\n--------------------------------------------------------------------------------\n\n \n\n \n\n4/22/2011\n\n9:35 PM\n\n\n\nI received a call from a Clay Parker who lives in Bells, TN.  His phone number is a cell phone with an AL number as he just moved from AL (251-284-0066).\n\n\n\nHe advised that today about 10 AM a man came to his house and rang the bell.  He peak out and saw that the man was wearing a McCoy Heating and Air service uniform.  As he had not call this company, he ignore the bell thinking that the man would leave but the man rang again.  \n\n\n\nHe answered the door and the man asked him if Bobo lived their.  Mr. Parker told him no and then the service person asked if Sanchez lived their.  Again, Mr Parker said no.  Then the service man said he was coming in.  When Mr. Parker refused the service man try to force his way into the house.  \n\n\n\nMr. Parker managed to close the door and locked it.  He called Bells PD and spoke with the Asst Chief, Roger Jenkins at 731-663-3131 to report the incident. \n\nBecause the man mentioned Bobo he thought he should report it.\n\nBelinda C. Allender\n\nTIES"], ["TN0567", "04-23-2011", "Open", "Routine", "", "", "From:  Belinda Allender  \n\nTo:  Allen, Amy; Anthony, Larry; ties gang  \n\nDate:  Friday - April 22, 2011 8:29 PM  \n\nSubject:  Tip on Bobo  \n\n\n\n--------------------------------------------------------------------------------\n\n4/22/2011\n\n8:20 PM\n\nI received a call from a Debra Cagle with the Jackson PD.  She advised that she had received a call from a Cynthia Merrell (757-288-0407) at Norfolk, VA.  Cynthia advised that she is a Financial Analyst for a local PD in VA.  She also advised that there is strange stuff posted on a web site from a guy that lives about 6 miles from Bobo.  She also mentioned that one of the pictures was of the ground with plastic on it. That is all that the operator could get out of her.\n\nBelinda C. Allender\n\nTIES"], ["TN0566", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 1005am from man @ 731 614-6420 with some info about a Mr. Ricky Volner who lives on the property behind the Bobo property. He has known Mr. Volner for about 25 yrs and thought it was very odd that he was @ the Physician Quality Care Clinic in Jackson TN @ 1300 on the day of Holly's missing. He and Mr. Volner always talk when they see each other, but this time he was withdrawn and barely acknowledged him and kind of hid his face within a magazine. He just feels this is very odd and out of the ordinary for him to be in Jackson, let alone at the walk in clinic."], ["TN0554", "04-23-2011", "Closed", "", "SA David Harmon - TBI", "From SA D Harmon", "Burton interviewed by SA Champine. Stated a sunject Dwayne Roach, told him someone matching his description was being sought. He mentioned his associate stating suspect matched his description. Burton stated he was eating at Tucker's Restaurant on day of abduction."], ["TN0568", "04-23-2011", "Open", "Routine", "", "", "Eric Miller 1461 Myracle Town Road, Darden, TN 38328 owns a gravel pit on 280 Charlie D. Aughtery Road. This pit is in close proxmity to the area east of confirmed evidence on Yellow Springs Road. TBI SA Jeff Jackson coordinated with THP Special Ops Dive Team on 04/21/11 the pit was checked with divers. A ground search was conducted of the area at the same time by Jackson and THP. No evidence found."], ["TN0569", "04-23-2011", "Open", "Routine", "", "", "Chris Williams, a volunteer, phone number 931-209-8863, address 211 Long Street East, McEwen, TN, advised he received a K9 hit on Holly Bobo's scent as well as 2 other K9s. GPS on Cox Road.\n\n35 50.455\n\n88 05.901"], ["TN0568", "04-23-2011", "Closed", "", "", "", "Event closed by SA Jeff Jackson."], ["TN0569", "04-23-2011", "Closed", "", "", "", "Event closed by TBI SA Dave Harmon."], ["TN0571", "04-23-2011", "Open", "Routine", "", "", "Bob Weible, phone 662-564-2212, 901-539-4556, Search Dogs South reques permission to get fresh Holly scent and walk the crime scene. Currently work with MBI and Memphis PD."], ["TN0571", "04-23-2011", "Closed", "", "", "", "Event closed by TBI SA Dave Harmon."], ["TN0250", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Champline."], ["TN0155", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA McMurtie"], ["TN0529", "04-23-2011", "Closed", "", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "", "Event closed by TBI SA Johnny Simmons."], ["TN0576", "04-23-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Rob Hager (615) 812-2105 at 11:45, 4-23-2011.  Rob stated he and his son were going camping at Longhunter State Park on Friday 4-22-2011 around 6:30-7:00 pm.  He stated that they were walking on a trail and were about 5 å_ miles into the trail when they met a very strange man.  Rob stated that the man was wearing shorts, flip flops, a belt was around his neck, and camouflage pants were over his shoulder with the tags still on them.  The guy did not have any camping suplies or water. Rob stated that this man was carrying a hammer in one hand and a live snake in the other hand.  Rob stated that this guy starting talking about plants, Jesus, and a missing girl and that they will never find her. Rob stated that the guy never mentioned Holly Bobo by name.  He just said missing girl.  The guy told Rob that he was from Huntsville, AL and decided to come to Tennessee when his wife kicked him out of the house.  The guy also mentioned having a gray car in the parking lot.  Rob described the man as being around 30 years old, rotting teeth, tribal tattoo on the right calf, about 5'10åÓ, very thin, with a shaved head."], ["TN0572", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 1120am from Joann Vandersarl, 256 216-9442 and she states that @ approx 1200 -1500 on the day of Holly's missing she saw a couple walking down the street @ Cliff Dr & Nick Davis Rd in Limestone County AL. She said this was strange because people don't normally walk out there. The guy was very thin looking w/thin chin, uncut facial stubble, mid 20's, and blue hood pulled down over his head w/the temps in the 70's; and looked down a lot; the girl looked about 16 to 20, wavy hair, cream print style dress, boots, stone faced as if she was upset. They were holding hands but it was an odd hold because it looked as if he was leading her down the road and she really didn't want to go. To me this was a total mismatch. There is a prison on that same road and they may have a video of them."], ["TN0573", "04-23-2011", "Open", "Priority", "SA David Harmon - TBI", "From SA N Bishop", "Locate Brian Hunter and interview. He is on SOR and participated in the Coon Hunt"], ["TN0574", "04-23-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 1145am from a lady in Dickson TN, 615 375-8080 about an article in the Dickson paper that mentioned about a woman escaping from an attempted abduction 4/7/11. The possible abductor was a man from Jackson TN and thought maybe since he failed at this place he went to Parsons and did the same thing."], ["TN0575", "04-23-2011", "Open", "Routine", "", "", "Sheriff Wyatt. THP made contact with Zack Adams at 235 Adams Lane. He was extremely nervous.  FBI SA Matt Ross and SA Annett Cotton interviewed Zack Adams, Dick Adams, and Dillon Adams. No significant information obtained."], ["TN0575", "04-23-2011", "Closed", "", "", "", "Even closed by FBI SA Ross and SA Cotton. Decatur County Sheriff's Office Booking Report on Zackery Rye Adams obtained and placed with file."], ["TN0577", "04-23-2011", "Open", "Routine", "", "", "(1) Danny Burton (works at Chevrolet Dealership in Lexington as a car salesman) lives on Christian Chapel Road in Darden, TN. Burton made a comment about Holly in a Tee-Shirt and panties when he picked up Drew and Clint to go duck hunting. Burton said she gave him a kiss at the door.\n\n(2) Steve Paulls stalked Karen years ago and went through therapy. He lives on Swan Johnson Road.\n\n(3) Jimmy Potts lives in Parsons on Decaturville Road. He hates Clint and is always gives him problems. Potts attempted to get Holly on his facebook. Wesley Conway does not like Clint and is a running buddy of Potts.\n\n(4) Mitchell Wood. Holly met him at Jackson State and rode with him before dating Drew. Wood was pursing Holly but she did not like him. He was not happy.\n\n(5) Kevin Dickson, address unknown, phone 845-5864. The Bobo family met him at a funeral (Bronson) and he rode with them. They did not know him. Drew hunted with him 1 time years ago, but didn't know him.\n\n(6) Chad Marshall, lives on Myracle Town Road in Parsons. Drew went 4 wheel riding and hunting with him.\n\n(7) Jessica King. She is a former girlfriend of Drew. There was bad blood between them. Holly didn't like her before she dated Drew. Holly was going to order her off the property one time.\n\n(8) Shane Austin. Works at Adult Book Store and fits description on the guy.\n\n(9)Corey Milam. He wanted to date Holly, but she was just a friend of his. This was when she was between dating Lee and Drew.\n\n(10) Flint Perkins. Same information at Milam.\n\n(11) Joey Troxley. He has been out of town since Holly disappeared. Joey lives on Gilbert Road not far from the Bobo residence.\n\n(12) Holly would not go to the door for someone she did not know.\n\n(13) Lee Conrad was observed with Holly. She told him not to text her anymore and he sent a text back using curse words (i.e. G.D. I don't care if you have a boyfriend)."], ["TN0579", "04-23-2011", "Open", "Routine", "SA Ronnie Faulkner", "", "LEIC Stanfill spoke with Officer Jamie James from the Paris Police Department, work ph (731) 642-2424 or cell ph. (731) 363-5153 at 12:40 pm on 4-23-2011.  He stated that a lady named Mary Martha Scherer, lives at 309 S. 5th St. Apt. A Murray, Ky 42071 came by the police department today to make a statement about a guy she met at a dance 6 weeks ago in Trezvant.  His name is John Earl Brockman and lives at 5939 Fairfield Dr. Milan.  Officer James said that Mary Martha said that she went to Mr. Brockman's house sometime after the dance.  She said that there were things in the house that made her feel uncomfortable.  There was a safe room in the house and he also photos in his closet.  She describe that the house had an empty bedroom.  Mary Martha said that she and Mr. Brockman went out to eat and when they came back there was a mattress on the floor of the empty bedroom.  About 3 or 4 weeks ago she went back to the dance and met Mr. Brockman again.  She said that there was a blond girl at the dance who looked like Holly Bobo.  She said that Mr. Brockman had danced with the girl and said that she was from a town near Jackson, TN.\n\nOfficer James has a written and audio statement of the report."], ["TN0578", "04-23-2011", "Open", "Routine", "", "From SA N Bishop", "Locate Darold Armstrong and interview. Armstrong is on SOR. He is connected with William Barker, who has been linked to the area of the disappearance and to Barnes who is a neighbor of victim and suspect."], ["TN0580", "04-23-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Carl Oldham (580) 579-9910 at 12:48 pm on 4-23-2011.  Mr. Oldham is a truck driver.  He reported that he stopped at the TA Truckstop in Denmark, TN around 1:30 am on 4-23-2011.  He stated that he saw a guy and a blond girl in the parking lot across from the truckstop.  He said that the guy had the girl by the arm and was pulling her.  He put her in a Blue Mustang and then took off very fast.  Mr. Oldham said that they were headed East bound on I-40 back toward Jackson, TN.  He said that the girl looked exactly like Holly Bobo.  He described the guy as being between the ages of 23 and 25 years old, wearing camouflage pants, a light blue shirt, and tennis shoes.  The girl was wearing a pink shirt, blue jean shorts, and tennis shoes."], ["TN0547", "04-23-2011", "Closed", "", "SA Brian Fazenbaker - FBI", "From SA N Bishop", "Request closure - Interview conducted by FBI Agent Brian Fazenbaker"], ["TN0581", "04-23-2011", "Open", "Routine", "Rachel Pierce Victim Specialist FBI", "From FBI VS R Pierce", "Interview with Clint and Karen Bobo -\n\n\n\nCHAD MARSHALL broke up with his girlfriend about 5 weeks before Holly went missing. Since then Clint Bobo and him have been very close (they were already good friends) Clint reports that Chad used to call him 4 or 5 times a day, every day. Since this happened he thinks he has maybe heard from him 3x's. This is a striking difference in behavior Karen reports that she has thought about Chad as a potential subject several times."], ["TN0582", "04-23-2011", "Open", "Routine", "SA Jeff Jackson", "From SA N Bishop", "Search property in Perry Co. that Barnes has been seen around since Holly went missing."], ["TN0561", "04-23-2011", "Closed", "", "Deputy Eric Toms - FBI/Maury Co. SO", "From Dep. E. Toms", "Sgt. Cohl MPD, is investigating the disappearance of a halfway house resident Scott Sobey. Sobey left the halfway house on 4/8 with Brent Rowden en-route to Eric Short's residence in Iron City for the weekend. On 4/10 Sobey and Rowden left Short's residence en-route back to Memphis however never arrived. Sgt. Cohl stated Rowden/Sobey's route would have taken them back through Parsons on the way to Memphis. Neither subj. has been contacted however Short is cooperating with LEOs. Rowden has a conviction for Rape and a perplexity for violence and has not been located. Sobey was to be released from the halfway house in 5 weeks and had a job lined up in Memphis beginning 4/13 however did not show up. Sgt. Cohl was not aware of any link between these subject and Bobo"], ["TN0583", "04-23-2011", "Open", "Routine", "", "", "Randy Cloyd, cell number 931-220-0960, observed suspicious activity in the Fairbgrounds building. Cloyd approached FBI SA Viveros and reported seeing a strange male approximately 50 years old staring at women inside the Fairgrounds building. He looked very strange and was dressed in full camo. When someone approached him to ask who he was he walked away quickly to a white car and departed the Fairgrounds. The car tag was 693 TPS from Dyer County. The tag is registered to Anthony Dwight Parham MW/DOB 12/11/1955, residence 657 George Weakley Road, Dyersburg, TN 38024. DL photo attached to Lead Sheet."], ["TN0584", "04-23-2011", "Open", "Routine", "", "", "Tom Morris, a concerned citizen, phone number 731-847-6885, address 260 Myracle Road, advised Shelly (last name unknown) cuts hair at Shelly's Styles. She arrived at Bobo residence shortly after the abduction and witnessed family members immediately after the incident. Shelly stated she had not been interviewed as of 04/23/2011. FBI SA Champine."], ["TN0379", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Champine and Toms."], ["TN0067", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Champine."], ["TN0120", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Reich and SA Sligh."], ["TN0526", "04-23-2011", "Closed", "", "", "", "Event closed."], ["TN0273", "04-23-2011", "Closed", "", "", "", "Event closed by TBI SA Jackson."], ["TN0337", "04-23-2011", "Closed", "", "", "", "Event closed by SA Dennis King."], ["TN0150", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Vagas."], ["TN0356", "04-23-2011", "Closed", "", "", "", "Nickell has been investigated. Event closed by TBI SA John Simmons."], ["TN0523", "04-23-2011", "Closed", "", "", "", "Event closed by TBI SA Dicus."], ["TN0557", "04-23-2011", "Closed", "", "", "", "Event closed by TBI SA Faulkner."], ["TN0553", "04-23-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Event closed by FBI SA Champine."], ["TN0528", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Acosta."], ["TN0049", "04-23-2011", "Update", "Routine", "", "", "Investigative Report from Lexington Police Department added to Intelligence and Reports on VCC"], ["TN0585", "04-23-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Tara Hicks (731) 220-2166 at 3:20 pm on 4-23-2011.  She has requested to remain anonymous.  She said that she and her friend Shannon (731) 220-1552 saw a facebook page called 'Holly Bobo Updates and PrayersåÓ.  Tara said on this facebook page is a sketch of a man and has something called 'map 1 and map 2åÓ.  She said that she knows the man in the sketch and his name is Johnny Harris.  She said that he lives in Holliday, TN in Benton County on Hwy 192 across the road from Vulcan Material.  She said that Mr. Harris lives in an Eagle Building.  She described this building as a wood shed type building.  She said that there is a lime pit that is owned by Vulcan Material also across the road from Mr. Harris.  Tara Hicks said that Mr. Harris' son is best friends with her son and this is why she wants to remain anonymous."], ["TN0586", "04-23-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Wally Lidburg (828) 980-2516 at 3:40 pm on 4-23-2011.  He gave me the longitude and latitude of where the abductor is located.  35 degrees, 48 minutes, 56.69 seconds north, and 88 degrees, 11 minutes, 54.41 seconds west."], ["TN0589", "04-23-2011", "Open", "Routine", "", "", "TIES Operator Norma Raleigh took this call:  female called in on console line phone number showing 352 243 2761 out of FL her name Jean Delaney. She states and suggests the following: She saw the interview with the mother and says to give mom a lie detector test, the mother is lying and she knows something. \n\nThe caller says that she has a built in radar in picking up when a person is lying. Check the mom.\n\nCall came in at 1549"], ["TN0587", "04-23-2011", "Open", "Routine", "", "", "LEIC Stanfill spoke with Kim Fisher (707) 972-7135 at 3:55 pm on 4-23-2011.  Kim said that she is a psychic and said that Holly Bobo is still alive and in a motel.  Kim said that the motel looks like a Ramada or a Best Western."], ["TN0588", "04-23-2011", "Open", "Routine", "", "", "TBI SA Brent Booth spoke with Holly Bobo's mother, Karen Bobo, several times on 19 Apr 11. Karen Bobo told SA Booth that Brittney Brown, a friend of Holly's was having lunch with Holly at the Longhorn Restaurant in Jackson, TN, when a MW who works for a Glass Company in Mayfield, KY. Approached Holly and Brittney and gave them a business card with the name Michael Toone it said \"You ladies are too pretty to pay for your own lunch. The MW paid for their lunch.\n\n\n\nKaren Bobo also told SA Booth that during one of their nightly round table discussions, Drew, Holly's boyfriend, said Byrce Howell tried to talk to Holly.\n\n\n\nKaren Bobo told SA Booth that Brittney Brown, a friend of Holly's told her Brandon Conrad was obsessed with Holly, but said some really ugly stuff to her.\n\n\n\nKaren Bobo told SA Booth that during one of their nightly round table discussions, Drew, Holly's boyfriend, said Skylar Hasher tried to talk to Holly."], ["TN0590", "04-23-2011", "Open", "Routine", "", "", "Timmy and Mitchell Wood. Mitchell was after Holly in school. Timmy briefly interviewed at search site and said both were at work at 08:30 on 04/13/2011 at BNW Auto\n\nFBI SA Cotton and Ross interviewed owner of BNW Auto on Highway 22, Randy White. Verified both at work that morning and left later to join the search. Both brothers have searched daily since then. No answer at Wood address 27693 Highway 104 S. Both believed to be at search site."], ["TN0590", "04-23-2011", "Closed", "", "", "", "Event closed by FBI SA Cotton and Ross."], ["TN0591", "04-23-2011", "Open", "Immediate", "", "", "Coon Hunter list will be closed when all the hunters have been interviewed."], ["TN0416", "04-23-2011", "Closed", "", "", "", "Lead covered by Sarasota FBI RA Rubiera. Made contact with manager and employee of Kay Jewelry. Showed photograph of Bobo to employees who advised they were familiar with the case. Cynthia Maretti, DOB 12/21/1984 an employee looks very familiar to Bobo minus dimples. Maretti also has mole above lip. Maretti has been working at Kay Jewelers for approximately 1 month, liven in North Port, FL. SA Rubiera will complete paperwork and forward to case file and case agent on Monday. Event closed."], ["TN0573", "04-23-2011", "Closed", "", "SA David Harmon - TBI", "", "SA White contacted SSRA Brad Fister of Huntsville, AL FBI. Fister interviewed Brian Hunter who consented to interviews and searches of his residence and vehicle. Hunter admitted to attendence at the Coon Hunt where he won a trophy. Hunter attended with a girlfriend, who stayed with him the entire trip. Hunter returned home on Sunday 04/09/2011. The timeline checks out except for Wednesday from 09:00 to 16:30 hours. He gave credit card information and account info for interview agent to follow up on purchases. SA Fister also interviewed the girlfriend independently and she stated the same. Hunter drives a silver Chevrolet and allowed the vehicel to be searche. Hunter attended a Sex Offender Support Group meeting on Thursday. Event closed by FBI SA White."], ["TN0592", "04-24-2011", "Open", "Routine", "", "phone call", "Received a call from a lady by the name of Linda Simmons.  She lives in the Centerville Village Apartments in Centerville, TN.  She is in Apartment Building F #145 and her p[hone number is 931-729-0133.  She stated that approximately four months ago she saw a man coming out of the woods behind her apartment.  They have been having cases of peeping Toms and she had called her fiancee from the apartment to come meet her when she got out of her car at dusk.  He was about average height, salt and pepper hair, moustache, beret, camo jacket with his camo pants tucked in his pants.  He was NOT active military.  His hair and moustache were long.  He has never been seen since.  Caller stated that she is approximately 1 hour from where Holly Bobo was abducted."], ["TN0593", "04-24-2011", "Open", "Routine", "", "Phone call", "Date/time:\n\n4/23/11 at 8:05pm\n\n \n\nCaller from New York, 518-563-6534 stated she had been checking Facebook and a Cody Scott has not updated his Facebook page since Holly disappeared.  \n\n \n\nCaller stated he made comment on page that he liked this girl but thought she liked his cousin instead, caller thought cousin may be a Clinton Scott.  Cody also had made some comments that sounded violent to the caller."], ["TN0594", "04-24-2011", "Open", "Routine", "", "phone call", "SAC Jordan called in and he said that he had received a tip from a sheriff that a man by the name of Steven had called.  His phone number is 256-520-7641.  He said that his wife was jogging along I-64 and someone pulled up in a car and made a reference regarding the Holly Bobo case.  SAC Joradn said that someone should probably call the man and speak to him."], ["TN0595", "04-24-2011", "Open", "Routine", "", "phone call", "Man by the name of O.J. Bixon called.  His phone number is 731-435-4088.  Back in October of last year he and his wife and teenage daughter were 25 miles North of Daren, approximately 30 miles from Parsons.  They were ditch digging for bottles.  Mother and Father are in the ditch and daughter up in the truck.  A white male, age 25-28 year old, dark hair, non-shaven wearing camo came up to the truck and tried to start talking to the girl.  The parents noticed it and hollered up to the subject.  He took off walking.  The father went up to the truck and they started to drive away when this subject came driving towards their truck.  He was driving a green pick-up, 4 wheel drive, 1997-1999.  Mr. Bixon asked him what was he doing and he replied, squirrel hunting.  Caller stated that he had a AR-15 as a weapon.  The suspect drove on up the road and turned around in the church drive.  No further information and have never seen him since.  No tags."], ["TN0596", "04-24-2011", "Open", "Routine", "", "phone call", "Marty Brasher, 731-499-2020, called to report what a friend saw last Thursday, April 21st.\n\n \n\n    His friend reported a maroon Ford Ranger truck parked at Bradford Cemetery Road in the Pecan Tree area."], ["TN0320", "04-24-2011", "Update", "Routine", "", "SA David Harmon TBI", "SA Dave Harmon attempted to locate Mr. Hall at residence on 4/23/11 at 2:37 p.m. and 4:29 p.m."], ["TN0595", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0592", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0597", "04-24-2011", "Open", "Routine", "", "phone call", "Psychic called (401)349-5502 stating she had a dream a week before Holly went missing and saw a blonde being abducted by a man with short dark hair with a gray tshirt driving a light colored pick up truck.  Stated she saw the number 25 and \"Fish Rd\". Also saw something regarding facebook and Holly is in an undergroung bunker bound & gaged."], ["TN0310", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "SA Nathen Bishop", "THIS Lead is related to #0041."], ["TN0594", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0593", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0598", "04-24-2011", "Open", "Routine", "", "phone call", "Received a call from Steven Lyell (931) 306-9558.  Stated he lives in Hohenwald and James Barnes, referred to him as \"Ed\" was at his home on Friday 4/22/11 between 7-10pm and was talking about the case.  Stated that this morning between 8:30 and 9 am he started receiving strange text messages from (931) 306-2863. Doesnt know if the visit from Barnes and the messages are related but wanted to let someone know."], ["TN0596", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0596", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "FBI SA Champin", "Brasher has been volunteer searcher. Recieved info from friend that a maroon truck was Pecan Tree area on 4/21/11. Brasher identified Kenneth Anderson as source of informaion. ANderson contacted at 731-394-2609. He lives in Carroll COunty and travels regularly to Decatur County. On 4/23/11 Anderson observes truck again at 5:15 pm on Hwy 412 in Pasons. THP was conducting traffic stop."], ["TN0596", "04-24-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "SA Nathen Bishop", "CLOSE per SA Nathen Bishop."], ["TN0599", "04-24-2011", "Open", "Routine", "", "phone call", "Received a call from Jenny Jones (731) 549-6041 regarding Jason Hefner. She stated that Hefner lived just a few miles from Holly's residence and on the day she went missing he had walked to the store thru the woods and was wearing camo. She stated Hefner immediatley left the area when he heard she was missing because he was out of prison on meth charges and had just gotten off of parole and he did not want to deal with the police. She also stated she learned all of this information during a conversation with her dad but he did not want to get involved. She stated she did record the conversation. Also stated that last night Hefner was asking her dad about new tires for his Alero and her dad gave him some tires but instead of putting them in the trunk Hefner squeezed them into the back seat."], ["TN0107", "04-24-2011", "Closed", "", "", "TBI SA Nathen Bishop", "CLOSE-Interview conducted by USMS Love on 4/18/11."], ["TN0578", "04-24-2011", "Update", "Routine", "", "TBI CP", "Locate Darold Armstrong and interview. Armstrong is on SOR. He is connected with William Barker, who has been kinked to the area of disappearance,and to Barnes who is a neighbor of victim and suspect."], ["TN0578", "04-24-2011", "Update", "Routine", "", "SA Jeff Jackson", "TBI SA Jeff Jackson interviewed and took statement from mother. She gave same alibi as on SOR Canvass. Mother verified alibi. Need to cross check (931)628-4318 against Holly's cell dump."], ["TN0491", "04-24-2011", "Update", "Routine", "", "SA David Harmon", "FBI SA T.White contacted SA Kristina Morris Mass Div. FBI. Morris indicated she would attempt to cover the lead and contact T. White once lead is covered. T. White will advise on information. A follow up interview at Federal Corrections is needed."], ["TN0493", "04-24-2011", "Update", "Routine", "SA Brent Booth", "", ""], ["TN0401", "04-24-2011", "Update", "Routine", "SA Brent Booth", "", ""], ["TN0600", "04-24-2011", "Open", "Routine", "SA Brent Booth", "Phone call to SA Booth", "SA Booth obtained information about an abandoned house in Deactur COunty, 69 Cooley Street. Possible clothing matching Holly Bobo's. SA Booth went to the location and
