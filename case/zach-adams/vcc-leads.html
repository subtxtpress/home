n the park before and must have shown up last weekend (6/3/11). The people that she is staying with have TX plates and have a 36' Wilderness 5th wheel style trailer, white/green/blue in color and the only one in the park of that style."], ["TN0839", "06-11-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call from a lady in Huntsville AL 423 364-2739 about a possible Holly Bob sighting on a farm off Hwy 72 (2938 is the address). The lady stated she didn't want to give specific stuff because she feels her life is in danger from the people who has or know where Holly is. She states if you run this Tag# 47N50D5 AL, then it will lead you to the person that actually has Holly. Another person of interest is Frank Johns who may have had personal contact with Holly. She also states the girl she saw was in bad shape from abuse (glazed eyes w/a distant stare, mouth white around the edges, tired). Because the lady feels her life is in danger, she may seek protection from local law enforcement."], ["TN0834", "06-13-2011", "Closed", "", "", "", "ASAC Mark Lewis contacted Mr. Clenney. Event closed by ASAC Lewis"], ["TN0840", "06-13-2011", "Open", "Routine", "", "Telephone", "Caller, Kala Keeton 731-549-5504, stated that she received three \"blocked\" calls last night at 2045. All the caller said in a whispered male voice was \"Do you know Holly Bobo\". The caller is very afraid. She stated she called her phone provider and said she could not get any information about the call but that TBI could get a court order if they need it for their investigation. The phone number 731-549-5504 is in her mother's name, Teresa Tillman."], ["TN0838", "06-13-2011", "Closed", "", "", "", "TN0836, TN 0837, TN0838 all reference the same information.\n\nOn 6/13 Sgt Rusty Poland, Bienville Co SO, Arcadia, LA provided the following information. Sgt Poland made contact with the unk girl re the provided leads. She was identified as a Brittany Fancher from Joaquin, Tx. Fancher was staying at the Bonnie and Clyde Rv park with a friend, whose husband was on the pipelind. Fancher was driving a car registered to her mother. Relatives to Fancher were spoken to on the phone, who verified her identity. Fancher appeared to be safe and not in any sort of kidnapping situation. Fancher is in her early 20s and does resemble (V) BOBO, but is definitely not her. Fancher lives at 8013 Farm RD 699 in Joaquin, Tx. Sgt Poland may be reached at 318-263-7432. Event closed by ASAC Mark Lewis."], ["TN0837", "06-13-2011", "Closed", "", "", "", "TN0836, TN0837, TN0838 all reference the same information.\n\nOn 6/13 Sgt Rusty Poland, Bienville Co SO, Arcadia, LA provided the following information. Sgt Poland made contact with the unk girl re the provided leads. She was identified as a Brittany Fancher from Joaquin, Tx. Fancher was staying at the Bonnie and Clyde Rv park with a friend, whose husband was on the pipelind. Fancher was driving a car registered to her mother. Relatives to Fancher were spoken to on the phone, who verified her identity. Fancher appeared to be safe and not in any sort of kidnapping situation. Fancher is in her early 20s and does resemble (V) BOBO, but is definitely not her. Fancher lives at 8013 Farm RD 699 in Joaquin, Tx. Sgt Poland may be reached at 318-263-7432. Event closed by ASAC Mark Lewis."], ["TN0844", "06-13-2011", "Closed", "", "", "", "TBI Special Agent Valerie Troutt request this lead to be closed. No follow up needed."], ["TN0844", "06-13-2011", "Open", "Routine", "", "", "On June 13, 2011 at 2100 hr. TBI Special Agent Valerie Troutt spoke with Chief Parker, Huntingdon Police. Chief Parker received information from Huntingdon residence, Donnie Wheat, DOB: 05/18/56, SSN: 408-06-9876 stating Holly Bobo had spoken with Donnie prior to her disappearance and mentioned she was scared of Michael Hardin.  This agent spoke with Donnie Wheat on same date; it became apparent Donnie Wheat was not being truthful. Donnie Wheat stated Michael Hardin phoned Donnie from the Benton Co. jail confessing to the killing of Holly Bobo. Request to close this lead, Donnie Wheat admitted to making the aforementioned information up, Michael Hardin was incarcerated at the time of Holly Bobo's disappearance. Donnie Wheat has a history with local law enforcement of mental issues."], ["TN0833", "06-15-2011", "Closed", "", "TBI SA Terry Dicus", "", "TBI SA Terry Dicus: Decatur County Deputy Scott Cagle interviewed him at the jail."], ["TN0843", "06-16-2011", "Open", "Routine", "", "", "if the man dragging miss bobo was white, tall and slender to medium build with a goatee...perhaps u should look hard at buck castleberry. he,s a resident of parsons,tn and i had several very peculiar run ins with him. he,s armed and has a cache of food supplies and survival stuff including guns. i seen it personally. whenever he leaves the residence he arms himself with a glock sidearm and locks his wife inside...from the outside. everything about spooked me in retrospect. he,s cloaking himself in a religious garb and has a web site called consider this. i have nothing concrete to go on...but several times now i thought about notifying u about him and didn,t!!! seems my mind keeps goin back to him for some reason and so now i am notifying u!!! the greater story is a 20 minute conversation. my name is mark alan werda, i live in columbia,tn and my ph# is 931 388 1953. i hope for holly,s sake that this tip may produce her whereabouts and hopefully bring her home safely. i am available for any further help in any capacity...but i do wish to remain annonymous.     respectfully,  mark werda"], ["TN0813", "06-16-2011", "Closed", "", "TBI SA Terry Dicus", "", "TBI SA Terry Dicus: Decatur County Deputy Scott Cagle checked him out.  His name is Martin Miller and he is currently in jail in decatur County."], ["TN0802", "06-16-2011", "Closed", "", "", "", "TBI SA Terry Dicus: Anthony Cothe is Stanley Tubbs' girlfriend's son.  He was at work at NSI in Lexington on that day.  Cory Tubbs and John Tubbs were at work at Tubbs' saw mill that morning.  A third brother was at work at another saw mill."], ["TN0841", "06-20-2011", "Open", "Routine", "", "Telephone", "Caller,  Terry Inskip 317-688-8082, stated that the Indiana missing woman resembles Holly Bobo and wondered if any consideration has been given to tornado chasers or tornado damage construction crews since there was a tornado right before the Indiana woman went missing as well as tornadoes (or damaging winds) in Tennessee at the beginning of April when Holly went missing."], ["TN0842", "06-20-2011", "Open", "Routine", "", "", "PER OUR RECENT PHONE CONVERSATION MY NAME IS SUSAN BAKER I AM A MEDIUM I HAVE BEEN RECENTLY CONTACTED BY HOLLY BOBO AS I UNDERSTAND SHE HAS BEEN MISSING FOR SOME TIME SHE CAME TO ME IN VISIONS ON THE FOLLOWING DATES JUNE 13, 14, 15 EACH TIME SHE APPEARS SHE IS STANDING WHAT APPEARS TO BE HER LIFELESS BODY IT WAS HARD AT FIRST FOR ME BECAUSE, I DID NOT KNOW WHOM I WAS DEALING WITH BECAUSE, SHE HAS NOT SPOKEN TO ME EVEN AS OF YET SHE HAS NOT SAID A WORD.\n\n \n\n       SHE IS A YOUNG WOMAN IN HER EARLY 20,S SHE HAS BLOND HAIR AND IS OF MEDIUM HEIGHT HER CLOTHES ARE GRUNGY AND FULL OF BLOOD AS WELL AS HER HAIR HER FACE LOOKS LIKE IT HAS BEEN HARMED LIKE CUTS ON HER FACE AND ITS BLOODY HER HAIR IS STREAKY SHE LOOKS TO ME LIKE SHE HAS BEEN BEATEN AND ABUSED BY HER ATTACKER.\n\n \n\n        HER HANDS ARE POSITIONED TO SHOW HER BODY AND THEY ARE OUTSTRETCHED OVER HER LEFT SHOULDER IS BARBED WIRE AND FENCING ALL AROUND I SEE A SIGN LIKE MAXIMUM SECURITY LIKE THEY HAVE IN PRISONS I WILL BE HONEST I HAVE NOT TRAVELED TO YOUR STATE THIS IS ALL IN THE VISION SHE IS SHOWING ME ALSO THERE IS TALL BROWN GRASS LIKE THISTLE ALL AROUND HER YOU PROBABLY WONT BE ABLE TO SEE HER FROM THE ROAD.\n\n \n\n        AS SHE IS STANDING THERE SHE LLOKS FREIGHTENED AND SCARED SHE IS ALSO HOLDING SOMETHING IN HER HAND LIKE A LOCKET AND ITS ON A CHAIN. IF YOU NEED TO CONTACT ME MY NAME IS SUSAN BAKER MY EMAIL ADDRESS IS SUSANBAKER2762 @AOL.COM AND MY CELL# IS 518-421-7149 LIKE I SAID I WILL KEEP YOU INFORMED THANKS FOR YOUR TIME SINCERELY YOURS\n\n \n\n                                                          SUSAN M BAKER \n\n \n\n                                                           PSYCHIC MEDIUM"], ["TN0842", "06-20-2011", "Closed", "", "", "", "Psychic lead only."], ["TN0841", "06-20-2011", "Closed", "", "", "", "Investigative suggestion - tornado damage workers."], ["TN0807", "06-20-2011", "Closed", "", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson, Close as unconfirmed possible sighting."], ["TN0807", "06-20-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson on 06/20/11 @ 1255 hrs. Numerous attempts made to contact Harris.  Neither number is good.  Close as unconfirmed possible sighting."], ["TN0840", "06-21-2011", "Update", "Routine", "", "", "Kala Keeton 731-549-5504 DOB 11-16-88\n\nI contacted Ms Keeton by telephone.  She lives at 153 Latta St, Dresden, TN with her b/f Brandon Ryan.\n\nShe advised since the first incident no one has prank called her like that again.  She did not recognize the voice because they were whispering but she said it was a male's voice.  Not sure whether they were young or old.  She advised she does know Holly, because she dated Holly's brother Clint for a few years, back in 2007 and again in 2009.  But she has no further information.  \n\nI request this lead be closed.  No follow up needed.\n\nTBI Special Agent Heidi White."], ["TN0840", "06-21-2011", "Closed", "", "", "", "TBI Special Agent Heidi White: \n\nMs. Keeton has no further information.  \n\nI request this lead be closed.  No follow up needed."], ["TN0764", "06-21-2011", "Update", "Routine", "", "", "TBI Special Agent Ronnie Faulkner : Daniel Zukowski 07/27/1984 34 Carol Rd Huron, Tn works at Lexington Chevrolet and I confirmed that he clocked in for work at 7:59am on April 13th and worked until after 5pm\n\nalso checked residence on Hwy 412 and it is unoccupied at this time\n\n \n\nPlease update and close lead"], ["TN0764", "06-21-2011", "Closed", "", "", "", "TBI Special Agent Ronnie Faulkner, no additional follow up needed, request closure on this lead."], ["TN0835", "06-22-2011", "Closed", "", "", "", "I request that this lead be closed. No other follow up is needed.\n\nSpecial Agent Heidi White"], ["TN0835", "06-22-2011", "Update", "Routine", "", "", "TBI Special Agent Heidi White spoke to Detective Tim Busby of the Catoosa County, GA SO's Office by telephone on 06-21-11 and relayed the information to him.  He called Mr. Friar, the man who phoned the TBI, and spoke to him.  Detective Busby then went to 65 Frontier Ln, Ringgold, GA and spoke to Oscar Vanhook.  Mr. Vanhook stated he and Mr. Friar have an ongoing property dispute.  Mr. Vanhook allowed the detectives to look around his property.  It has been determined this tip was called in because of the property dispute and nothing more.  I request that this lead be closed.\n\n  \n\nSpecial Agent Heidi White"], ["TN0673", "06-22-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "On 06/22/11 Karen Bobo provided the user name and password for Ebay account to TBI SA Dicus. TBI SA Dicus and TBI SA Faulkner looked at the account and were unable to find any further information on the buyer of the dress. \n\n \n\nPlease update and close as information only."], ["TN0673", "06-22-2011", "Closed", "", "SA Ronnie Faulkner", "", "TBI SA Ronnie Faulkner: Please update and close as information only."], ["TN0491", "06-22-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "Assigned to TBI SA Ronnie Faulkner."], ["TN0491", "06-22-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "On 06/22/11 at approx. 12:08pm TBI SA Faulkner spoke with Mark Mangrum telephonically. Mangrun is currently in a Federal Correctional Facility in MA. Mangrum stated in 2006 he was a pastor at First Baptist Church in Parsons and counseled Jonathan Dodd and Blake Barnett. He advised that both were kicked out of their homes and were troubled teens. He has had no contact with them since.\n\n \n\nPlease update and close lead."], ["TN0673", "06-22-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "Assigned to TBI SA Ronnie Faulkner."], ["TN0792", "06-22-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "Assigned to TBI SA Ronnie Faulkner."], ["TN0839", "06-22-2011", "Update", "Routine", "TBI SA Heidi White", "", "Assigned to TBI SA Heidi White."], ["TN0832", "06-22-2011", "Update", "Routine", "TBI SA Heidi White", "", "Assigned to TBI SA Heidi White."], ["TN0821", "06-22-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "Assigned to TBI SA Cathy Ferguson."], ["TN0808", "06-22-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "Assigned to TBI SA Cathy Ferguson."], ["TN0807", "06-22-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "Assigned to TBI SA Cathy Ferguson."], ["TN0800", "06-22-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "Assigned to TBI SA Cathy Ferguson."], ["TN0799", "06-22-2011", "Update", "Routine", "SA Art Viveros - FBI", "", "Assigned to FBI SA Art Viveros."], ["TN0797", "06-22-2011", "Update", "Routine", "SA Art Viveros - FBI", "", "Assigned to FBI SA Art Viveros."], ["TN0801", "06-22-2011", "Update", "Routine", "SA Art Viveros - FBI", "", "Assigned to FBI SA Art Viveros."], ["TN0491", "06-23-2011", "Closed", "", "SA Ronnie Faulkner", "", "On 06/22/11 at approx. 12:08pm SA Faulkner spoke with Mark Mangrum telephonically. Please update and close lead, no follow up needed."], ["TN0845", "06-23-2011", "Open", "Routine", "", "TBI Find Line", "I received a call on TBI Tips - Caller Carol Morris 731-549-5047 lives in Decatur Co. - She states that she works at a local bank in Parsons.  She stated that she lives close to Holly house.  She said that the week Holly went missing that Monday and Tuesday April 11th & 12th she had to go to work early because she had examiners coming into the bank.  On Monday and Tuesday of that week- both days she left her house about twenty to 7, but in the neighborhood there was a male driving an older model red Chevy single cab pick up diving in the wrong lane and driving really slow.  She thought to her self what is he doing, he's driving in the wrong lane.  \n\n\n\nThen Holly went missing and she has wondered about this guy and truck- she's never seen that pick up or the guy since.  Carol stated that she works in the operations part of the bank and has to review new accounts that get opened and in the file they have a copy of the applicants DL- so yesterday on 6-22-11 she reviewed a case and it was the same male who drove the red pick up, He opened a account in the bank.  She saw his picture and knew this was the guy that was in the neighborhood those 2 days before Holly went missing. \n\n\n\nShe said his name is Jonathan B. Dodd\n\n154 Cedar Hill, Parsons"], ["TN0845", "06-23-2011", "Closed", "", "", "", "This information provided to SA Dicus on 6-23-11. \n\nClose per ASAC Lewis, Dodd intel only."], ["TN0800", "06-23-2011", "Closed", "", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson, Close as vehicle description."], ["TN0800", "06-23-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson, on 06/23/11 @1420 hrs Caller has seen vehicle around lately when she takes her kids to school.  Unable to locate good phone # for car owner.  Close as vehicle description."], ["TN0846", "06-23-2011", "Open", "Routine", "", "Telephone", "I received a call from Julie Jaggers 731-845-4711, She had placed a trap off of hwy 641 west and Spence Loop- approx a mile up from the interstate by Chucks CV shop.  She stated there is also an old white abandon house.  She went to check the trap today up behind the house but found a pair of white & blue leather Nike shoes approx size 7.  She said there was a suit case and some other stuff around the area.  She said she didn't touch or move any of the clothes.  She saw a water jug and did open it to smell to try and see if it seemed \"old\" - She stated it didn't smell and the stuff didn't appear to be there for very long. \n\n\n\nShe left everything there but you have to walk up behind the house to see everything."], ["TN0846", "06-24-2011", "Update", "Routine", "", "", "On 6-24-11, Chief Deputy Scott Cagle, Decatur Co SO, followed up on this lead. Jaggers was spoken with and provided no new information. It appeared that the mentioned items had been at that location for a \"long\" time, and did not appear to be associated with the Bobo case. This area was described as a place where \"junk\" was discarded."], ["TN0821", "06-27-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson, on 06/27/11 @ 1200 hrs Dodd has been interviewed and cleared.  Dicus to follow-up on Johnson and Pope."], ["TN0808", "06-27-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson, on 06/27/11 @ 1200 hrs Work and Holmes have been interviewed and cleared.  SA Dicus will follow-up on Atchinson."], ["TN0847", "06-28-2011", "Open", "Routine", "", "TBI Find Line", "Male subject called in to state while he was at a bar a couple of weeks ago, he overheard a conversation about Holly Bobo and a guy being obsessed with her. He said the name Brandon was mentioned. He's around 30 years old and has a younger brother by the name of Dillon Henderson, 17 yoa. Dillon's last name is different than Brandon's. The subject stated it was mentioned Brandon drives a white T-Bird and is probably on probation and has parents that live in Henderson County, probably Huron, TN. The caller stated the bar was located off of 70 and said the name was Gina's Bar. He did not know if the information was too obscure and if these individuals were just talking. The caller did not want to give his name but caller ID showed the number to be 731-425-4796. This number was checked through general internet searches and CLEAR with no information showing for this number."], ["TN0839", "06-28-2011", "Closed", "", "TBI SA Heidi White", "", "I request this lead be closed. Special Agent Heidi White TN Bureau of Investigation"], ["TN0839", "06-28-2011", "Update", "Routine", "TBI SA Heidi White", "", "06-28-11\n\n1:40 PM\n\nTelephone\n\nTN0839\n\n \n\nI spoke to the callers sister, Doris Ham, on 2 separate occasions by telephone.  The first time on 06-21-11 and the second time on 06-28-11.  The first time I spoke to Doris she advised that her sister's name was Kay Ham and that Kay was living in Alabama with her son.  She said she would have Kay call me.  As of 06-28-11, I still had not heard from Kay, so I called the number back and again spoke to Doris Ham.  Doris advised that her sister was still in Alabama but would get her the message.  I request this lead be closed.\n\n \n\n \n\nSpecial Agent Heidi White\n\nTN Bureau of Investigation"], ["TN0848", "06-29-2011", "Open", "Routine", "", "800 TBI FIND", "Anonymous male caller called 800-TBI-FIND. Advised that a white male in his late 30's by the name of Scott Menendez was possibly involved in Human Trafficking out of Mobile, AL. Menedez is supposed to be an alias and the subject is supposed to be from the state of MI. He worked at Lewis Farm before he disappeared approximately 3 weeks ago with his girlfriend Crystal Nolan or Noland. The caller advised that the farm was involved with \"some trouble\" regarding the manufacturing of child pornography and subjects there had been previously investigated. The caller stated that Menendez lived in the Nixon area of Hardin County, TN. Menedez's 4 wheeler and truck went missing several weeks ago and he refused to report both of them as stolen. Menendez frequently dressed in camo clothing. A male subject by the name of Ricky was supposed to have left with Menedez. The number on the caller id was 270-444-7200."], ["TN0832", "06-30-2011", "Update", "Routine", "TBI SA Heidi White", "", "TN0832\n\n06-30-11\n\n10:50 AM\n\nTelephone\n\n \n\nI attempted to contact Chad David Sells by telephone 3 times, 06-21-11, 06-28-11, and 06-30-11.  The first attempt I could not leave a message, the second attempt I left a message, and the third time there was no answer.  I request this lead be closed.\n\n \n\nSpecial Agent Heidi White\n\nTN Bureau of Investigation"], ["TN0832", "06-30-2011", "Closed", "", "TBI SA Heidi White", "", "06-30-11 10:50 AM, I request this lead be closed.\n\n \n\nSpecial Agent Heidi White\n\nTN Bureau of Investigation"], ["TN0846", "07-07-2011", "Closed", "", "", "", "Close per ASAC Lewis - info not believed to be related."], ["TN0821", "07-12-2011", "Closed", "", "TBI SA Cathy Ferguson", "", "Close as per ASAC Mark Lewis, lead provided directly to case agent SA Dicus to follow-up."], ["TN0808", "07-12-2011", "Closed", "", "TBI SA Cathy Ferguson", "", "Close as per ASAC Mark Lewis, lead provided directly to case agent SA Dicus to follow-up."], ["TN0792", "07-13-2011", "Closed", "", "SA Ronnie Faulkner", "", "please close\n\nper ASAC Lewis - lead addressed in agents file, follow -up by FBI, will document in case file."], ["TN0850", "07-13-2011", "Open", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Cathy Ferguson; Buddie Newman (989-0111) stated he met WF at store beside Save-a-lot in Savannah, TN.  He believed it was Holly.  She gave him her ph # (438-0680).\n\n3 weeks later, he reported this to JPD,(7-13-2011 @ 14:30).  \n\n \n\nMr. Newman resides at the American Hotel, Room # 214, Henderson, TN."], ["TN0799", "07-18-2011", "Closed", "", "SA Art Viveros - FBI", "", "Please close per ASAC Lewis 7-18-11 - based on date of receipt, not believed to be related to investigation."], ["TN0801", "07-19-2011", "Closed", "", "SA Art Viveros - FBI", "", "Please close per ASAC Lewis 7-18-11 - multiple attempts to contact Bivens, with negative results/facebook lead."], ["TN0850", "07-25-2011", "Update", "Routine", "SA Ronnie Faulkner", "", "TBI SA Faulkner spoke with Newman.  David Snipes (687-7888) saw female, too.  Numbers for female and Snipes are not in service."], ["TN0849", "07-26-2011", "Open", "Routine", "", "Telephone", "Caller, Mickey Bartholomew 731-858-2526 or 731-549-6338, stated that her children were at the local city park in Sardis, Tn and found a roll of duct tape with several blonde hair attached. The children picked the tape up with some scissors and took it home. The address is 34570 Hwy 104 S, Sardis, Tn.  The tape looks like it has been there for awhile as it appears to have been rained on. No one has touched the roll of tape."], ["TN0849", "07-27-2011", "Update", "Routine", "TBI SA Cathy Ferguson", "", "TBI SA Ferguson collected the duct tape/hair from caller on 07/27/11.  Evidence will be submitted to lab. Caller posted info about this on FaceBook; SA Ferguson asked her to remove it."], ["TN0850", "07-28-2011", "Closed", "", "SA Ronnie Faulkner", "", "TBI SA Ronnie Faulkner; No Video available from store.  Close unfounded."], ["TN0851", "07-28-2011", "Open", "Routine", "", "Telephone", "Caller, Jill Wilson 731-845-5916, stated that she is the caretaker for a church that is a mile from her house. Her address is 691 Safford Mill Road, near the E Henderson and Decatur county line. When she went to mow the lawn she noticed tracks in the dewy grass that went around the church. About 1/4 mile between the church and her house she found a beer bottle with a foam cover that has \"panama city Florida\" written on it. There was also a small tank top that was bout 24 inches from the beer bottle. The caller collected the items in plastic bags and has them at her house. She stated that the shirt was damp like it had been rained on."], ["TN0848", "08-01-2011", "Closed", "", "", "", "TBI SA Terry Dicus; I checked this lead on August 1, 2011.  Scott \"Martinez\" works for James Marshall Lewis.  I spoked to Martinez and Mr. Lewis and both said that he was planting corn in MS on the date of the abduction.  The lead can be closed."], ["TN0849", "08-02-2011", "Closed", "", "TBI SA Cathy Ferguson", "", "close per ASAC Lewis - 8-2-11, lead to be documented in case file."], ["TN0851", "08-02-2011", "Closed", "", "", "", "ASAC Lewis spoke with Jill Wilson via telephone 8-2-11, she could provide no further information, she did verify that all the activity she reported occurred on or around 7-28-11. She provided no info to connect this activity to that of (V) Bobo. \n\n \n\nclose - per ASAC Lewis - not believed to be related to (V) Bobo, due to lack of specifics and time frame."], ["TN0852", "08-02-2011", "Open", "Routine", "", "", "Fusion Center-Amy Allen: Jerri Jean Moses - 909-252-8952. Called to advise she had started to remember being attacked by a male in August of 2002 in Athens, TN. Ms Moses advised she had been struck in the head and left in a ditch along the road. She stated that the law enforcement in the area had covered up the case. She feels this subject could be involved all she can remember is the subject was from Canada. \n\n \n\nSearched ISIS and did not locate a case with her listed as a victim. Searched online for a news story and did not get a hit. Search of CRMS listed 2 arrest one in Madisonville, TN and one in Monroe Co. TN. One was for shoplifting and the other did not list the charge or incident."], ["TN0853", "08-07-2011", "Open", "Routine", "", "", ">>> \"Hunter Blake\" <hunterhunt@bpsnetworks.com> 8/7/2011 12:45 AM >>>\n\n\n\nWe were eating at a little resturant in Bernie,Mo. when a man and a young woman came in and it seemed a little odd. First thoght he was maybe her father but then maybe they were dating. He seem to old for her and I guess thats why we noticed. They both went to the truck to get her purse I think. Just seemed odd he stayed right with her . She was blond and looked to be in her 20's. When we left my husband looked at the truck to see were they were from and it was Tenn. L # T H M or T H L something like that.Burgurndy power stroke diesel. And later thoght came to me about the missing student form Tenn. May not be anything to it but I didn't know if God was trying to tell us something . just couldn't sleep with this on my mind."], ["TN0852", "08-15-2011", "Closed", "", "", "", "Per ASAC Mark Lewis: Intel only, not believed to be related to this case."], ["TN0853", "08-15-2011", "Closed", "", "", "", "AS Per ASAC Mark Lewis: No more specifics, person does not appear to be in harms way, intel only."], ["TN0854", "08-20-2011", "Open", "Routine", "", "Telephone", "Received a phone call from Kelly 731 847-4291 a Parson TN Florist about receiving a phone call from Mary Lee 305 769-0367 a Florist at 114700 N W 7th Ave, Miami FL 33168. Mary Lee stated to Kelly that the local mailman saw a girl walking down the street that he had not seen before and she lookded somewhat  like Holly Bobo. He said the girl was alone and looked strung out on drugs."], ["TN0855", "08-22-2011", "Open", "Routine", "", "Telephone", "Caller, Karen 503-569-6615 reported that a Terry G. Edwards (wanted in New Hampshire, Coos County for Aggravated Felonious Sexual Assault - victim under 18 y.o.) is now living at 7850 Highway 22 South, Huntington, TN 38340. According to the New Hampshire Department of Safety, Division of State Police Registration of Criminal Offenders website there is a warrant for Edwards. Caller lives in Oregon and wants to remain anonymous. Caller is calling for family members who are related to Edwards and in the same vicinity of Edwards at this time. Caller stated that she just wanted to let the TBI know because of the \"missing girl\"."], ["TN0855", "08-25-2011", "Update", "Routine", "", "", "Update:  ASAC Lewis 8/25/11  EDWARDS, TERRY G. Date of Birth: 8/28/1960 ,Colebrook, NEW HAMPSHIRE Coos County  - State Police, was wanted for failure to register as sex offender, would not extradite from TN, Edwards registered with Carroll Co SO TN August 11, 2011, but had been in Carroll Co since 2001, and not reported. In compliance at this time per Carroll Co So, and NH St Police notified. Huntingdon Address is current. Spoke with caller Karen, who advised she had no info to connect Edwards to Bobo, just wanted LE to know he was in the area and possibly wanted."], ["TN0856", "08-28-2011", "Open", "Routine", "", "", "Tracey Givens: Received a call from a Jimmie Patterson who lives in Holladay TN regarding a guy he thinks is a little suspicious and may have something to do with Holly's disapperance.  He stated that Rickey Miller is a strange guy and last year he was accused of picking up young girls and buying them alcohol and possibly drugs.  I have found a Rickey Miller that matches the description and have attached his DL.  Mr Patterson's call back number is 731-437-9228 and he stated he had a cell phone number for Mr. Miller of 731-220-2698."], ["TN0855", "08-29-2011", "Closed", "", "", "", "Close: per ASAC Lewis, intel only , not believed to be related."], ["TN0857", "08-31-2011", "Open", "Routine", "", "800-TBI-FIND", "Thomas Wedge (479) 747-1870. Mr. Wedge is a truck driver and saw someone who he believes to be Holly at a QT truck stop on I70 ext 222 in St. Peters, Missouri between 1 and 2:30 p.m. on August 10, 2011. The female was working at the truck stop."], ["TN0854", "09-06-2011", "Update", "Routine", "", "", "ASAC Mark Lewis Update: RE Fla florist\n\n9/6/11, spoke with florist Mary Lee who advised she had already been contacted by SA Dicus, and that SA Dicus had also spoken with the mailman. Mary Lee said that this unk girl who resembled Holly had a tattoo on her leg. Mary Lee did knot know why the Bobo family thought that Holly was in Miami. She had no other info to believe that this unk girl was Holly. At time of Holly's disappearance, she had no tattoo."], ["TN0854", "09-06-2011", "Closed", "", "", "", "Close, per ASAC Lewis, not believed to be related."], ["TN0858", "09-13-2011", "Open", "Routine", "", "Telephone", "Caller, 651-785-3830, asked for \"information on how the case of Holly Bobo was going.\" When he was told that I was not at liberty to tell him any specifics he stated \"she is still missing right?\" and when I responded with yes he stated \"that's too bad\" and hung up. CLEAR search indicates that the phone number is registered to a Jacob Nickolas Kohloff, DOB 5/15/1981 SSN 551-87-4782 of 550 Snelling Ave N 405, Saint Paul, MN."], ["TN0859", "09-17-2011", "Open", "Routine", "", "", "Emerald Star: Received call from gentleman at 931-589-5271 stating that property referred to the Love Farm in Parsons and occupants may be involved in Holly Bobo disappearance.\n\n \n\nOccupants of the property involved in drugs and 'hippie lifestyle' according to caller.  Caller stated woman (name Emily) living there with boyfriend and others.  \n\n \n\nTags/vehicles:\n\n864KXB Perry Co tag Ford or Chrysler Van\n\n416PMC Perry Co tag that expired on 2007 Ford Superwagon\n\nYTA8023 NC tag, Jeep Cherokee.\n\n \n\nCaller feels that Emily's boyfriend or others living on property may be involved in Holly Bobo disappearance."], ["TN0860", "10-06-2011", "Open", "Routine", "", "telephone", "Caller Detective Michael Yates from the Murfreesboro Police Department- cell:(615)294-4291, office: (615)893-2717, stated he was contacted by employees at Uncle Sandy's Market on 2019 S. Church Street, Murfreesboro. Market #(615)890-1941. The 2 employees:\n\nAmy Payne(615)578-6622 and Jim Cooper (615)896-6030-room#268,\n\nstated that a woman-Tiffany Connell, came in the market. She was very mad at her boyfriend and kept saying how \"God is gonna get him\" which prompted the 2 employees to ask her what was going on and she started telling them details of the Holly Bobo case. Said her boyfriend, whose name is Jason was driving around in his van with clothes with Holly's dna on them and he'd get caught because of that. He lives in his van -Brown van, usually parked behind the Regal Inn at 2025 S. Church Street. Tiffany was apparently upset with her boyfriend Jason and was staying some with a Jonathan Mathews at room 212. She had been kicked off of the Regal Inn property about a month and a half ago."], ["TN0861", "10-13-2011", "Open", "Routine", "", "Telephone", "Rcd a phone call from a lady @ 615-268-1400 about being @ a concert in CA @ the Hollywood Bowl. She sat in Section N3 Row 9 Seat 21 and held a conversation with a young lady who was with her family of about 30 people and hand all of the features of Holly Bobo. The young girl stated she was a nurse and the lady talking with her is a nurse as well. The caller had a weird feeling that this may be Holly or a Holly twin and she is just now calling to report the possible sighting."], ["TN0862", "10-18-2011", "Open", "Routine", "", "", "I just received(10/18/11) a phone call on the TBI-find line by Mr. Mack Forester of Ridgely,TN: Office-(731)253-7367, Home-(731)264-5129 about the Holly Bobo case. He said that him and his wife, were traveling on I-40 West on Sunday afternoon (Oct 16th, 2011) and stopped at a rest stop past the TN river (was not sure if it was near Camden,TN). He saw an African-American guy who looked to be in his mid-twenties, charging his cell phone and looking at a Holly Bobo poster on the wall. He was traveling with a lighter skinned older African-American lady seemingly in the 60s . The guy asked Mr. Forester how long had Holly been missing and he told him a few months. After that the guy said he saw her last week outside of Louisville, KY, where he was coming from and she looked like she was trying to hide. \n\nMr. Forester told him that he should report that to the number on the poster and then left. Before he drove off the rest stop he wrote down the Car tag the guy was traveling in: 107DD5, KY, Jefferson Co.- blue chevy  4-door car, traveling west on I-40 (they passed Mr. Forester's car).\n\n \n\nI ran the plate through e-Agent but did not get any results back. I also contacted the KY Fusion Center to run it but they were not able to get results back either.\n\nPlease let me know if i can do anything else to help!\n\nZhenya\n\n \n\n \n\nZhenya Ivanova, IA"], ["TN0863", "10-20-2011", "Open", "Routine", "", "", "I received a phone call from a woman (Sharon Summer) concerning Holly. She stated that there was a young man that lived in a trailer next door to her sister with a fortress built around it. She said that no one could see in it but he could see out of it and it is possible that Holly might be there. Her sisters address is 595 Kelly Road in Benton County. Ms. Summer's contact number is: 731.441.9407. \n\n \n\n \n\nAlisha Rutherford\n\nIntelligence Analyst"], ["TN0861", "10-26-2011", "Closed", "", "", "", "To close - per ASAC Lewis - 10/26/11 - intel only/ possible sighting - not believed to be valid info."], ["TN0864", "10-26-2011", "Update", "Routine", "", "", "UPDATE:\n\nI sent you the forwarded e-mail about an hour ago and Ms. Jenna Keith just called us back and stated she took the wallet to the Chattanooga PD- Sex Offender Office  and gave it to Officer Jessica White, phone# 423-209-7198.\n\n \n\n \n\nZhenya Ivanova, IA\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation\n\n901 R.S. Gass Boulevard\n\nNashville, TN 37216\n\n(615) 744-4397\n\n(615) 744-4655 FAX"], ["TN0864", "10-26-2011", "Open", "Routine", "", "", "My name is Zhenya and I just received a tip on the TBI find line that seemed to be applicable to the BOBO case:\n\nA woman from Hixson,TN: Jenna Keith call: 423-298-4052, called to report she found a wallet on a bench on the Walnut Street bridge in Chattanooga.\n\nShe called to report it because the wallet seemed to belong to a registered sex offender and had a few small pictures of Holly Bobo and information on her disappearance on a piece of paper.\n\nThese pieces were found in the Wallet:\n\n1) Photocopy of a TN ID card# 063852449, exp date: 04/01/2014\n\nDOB 04/01/1954- Charles D. Gaskill, 5 f. 9 in., green eyes\n\n600 Lyttle Street. Chattanooga, TN, 37405\n\n \n\n2)Benefits Security Card\n\n \n\n3) Business Card from Hamilton Co. Sherif's Office- has an appointment for 11/07/2011 at 10:00 am  for Sex Offender Registry.\n\n \n\n4) pictures of Holly\n\n \n\n5)Registration Paper for Sex Offender registry from Hamilton Co. Sherif's Office with the name: Frank Nelson and signature of Charles Gaskill from 09/09/2011, address: 7032 Grasshopper Rd.\n\nTOMIS# 00225157\n\n \n\n6)BP Giftcard\n\n \n\n7) 2 prescriptions a) Loratab- 5/325 every 6 hours by Doctor Joel Sutton\n\n                          b) Dilantin 100mlgr. 160 count\n\n                          c) Phenoburbital 30mlgr. 90 count\n\n \n\n8) business card for renting rooms in houses\n\n \n\n9) paper with several phone numbers: 635-0068- Will\n\n                                                        1-877-517-6051-no name\n\n                                                        326-9306- no name\n\n                                                        757-5551- no name\n\n                                                        634-6260\n\n \n\nMs. Jenna Keith said she would be able to take the wallet to the Chattanooga Police Dept.-Sex Offender Office on Friday 10/28/11 on 601 Walnut Street, Chattanooga, TN. I asked her to call us back and report the name of the officer she turned the wallet to."], ["TN0864", "10-27-2011", "Update", "Routine", "", "", ">>> Luke Muhonen 10/27/2011 10:05 AM >>>\n\n\n\nOn October 27, 2011 I met with Jessica White, Hamilton County Sex Offender Registry Compliance Officer. She showed the wallet that was recovered by Jenna Keith and turned over to her on 10/26/11. The wallet contained assorted scraps of paper, and (2) Holly Bobo \"abducted\" business cards. It also contained a photo-copied TN ID for Charles D. Gaskill. Officer White advised that Gaskill was an offender that she had registered, and advised he was in good standing. She stated that he was listed as homeless, and that his next scheduled appointment was on November 7, 2011. White provided printouts of Gaskill's activities and some personal information including a possible cell phone number (423) 475-4972. She attempted to call the number to make contact with Gaskill but there was no answer. I have attached the documents provided by White to this e-mail.\n\n \n\nIf further contact is needed with Gaskill, he may be able to be interviewed on the 11/07/11 report date. Let me know if you need anything else.\n\n \n\nLuke"], ["TN0864", "10-27-2011", "Closed", "", "", "", "Close as per ASAC Mark Lewis this date - Bobo family had been in Hamilton Co handing out info, no reason to believe subject left area due to being homeless and in good standing re SOR. Cell number to be compared to cell dumps, result ? neg or positive?\n\n\n\nThe phone number 423-475-4972 does not show up in the tower dumps for verizon, sprint, t mobile and AT&T.  Joe"], ["TN0862", "11-01-2011", "Closed", "", "", "", "TBI Special Agent Joe Walker: I contacted  Mr Mack Forester on his cell phone at 731-264-7763.  Forester retold his story without further details.  He stated he was sure it was a Kentucky tag.  Since there is no further information available and the lead is so vague, I suggest the lead be closed.  The information about where (V) BOBO is untraceable.  Joe"], ["TN0865", "11-14-2011", "Open", "Routine", "", "Telephone", "Caller, Candace 360-721-6933, stated that she called two weeks ago and now is calling back because the situation is getting worse. She stated that the Bobo family is requesting that people give them the tips directly and now information regarding the tips is being leaked out. One person who gave a tip about a relative is now being threatened by the person of interest (or people close to this person). Two nights ago someone came to the tipsters house at 2230 and pounded on the door. The tipster was so scared that she \"cut off all the lights, ran to her bedroom and got her gun\". The tipster told the caller that there was a burgundy pickup with a large white cylinder in the bed was parked in front of her house. The caller does not live in the Parsons area and thinks this is the reason the tipster is telling her this is all happening. The caller does have names and more specific information but would like to talk to an agent directly. She appeared nervous but is willing to talk more."], ["TN0860", "11-15-2011", "Update", "Routine", "", "", "TBI SA Brent Booth ; In reference to lead number 8060 that originated out of Murfreesboro involving three subjects in a brown van that had made statements referencing the disappearance of Holly Bobo was unfounded.  SA Jason Wilkerson of the Tennessee Bureau of  Investigation made contact with the three individuals involved. They gave consent to search to SA Wilkerson and provided information concerning their where they were and what they were doing on Wednesday 4/13/2011.  Jason Connell the driver of the brown van was in the Decatur County area later in the afternoon of 4/13 working for a company out of Clarksville Tennessee selling boxes of steaks. Tiffany Connell and Jason Connell are known in the Murfreesboro area as drug users. Tiffany told SA Wilkerson she was angry at Jason when she made the statement in front of People in the store referring  to Jason as being involved in Holly's disappearance. She said Jason had camo clothing in the van and she and Jason were living in the van sometimes with her mother as well.  Jason was arrested on a misdemeanor warrant out of Metro Nashville and has charges pending in Colorado for Misdemeanor charges there for which they will not extradite.  SA Wilkerson contacted Jason Connell's employer Omha Steaks in Clarksville Tennessee to verify his employment and learned he was in a company truck working in the Carroll, Henry and Decatur County area on 4/13 but did not arrive in the Decatur County area until late afternoon on 4/13. It was the opinion of SA Wilkerson and I that Jason Connell had nothing to do with the disappearance of Holly Bobo."], ["TN0860", "11-15-2011", "Closed", "", "", "", "Close as per ASAC Mark Lewis: TBI SA Brent Booth; It was the opinion of SA Wilkerson and I that Jason Connell had nothing to do with the disappearance of Holly Bobo."], ["TN0865", "11-15-2011", "Update", "Routine", "", "", "TBI ASAC Mark Lewis....update - spoke with caller on 11-15-11, stated that the tipster mentioned was Brenda Conrad, and her main concern was Brenda being harassed as a result of providing info directly to Bobo's. Caller had no knowledge of where Holly was or what happened to her, but did state she believed Holly to be in protective custody. Caller would not provide a contact number for Brenda Conrad, stating that Conrad did not trust the police. Caller also said that Amanda Conrad may have some information concerning Holly. Caller said she would tell Brenda Conrad to report any criminal activity to Law Enforcement. Intel concerning Amanda Conrad to be forwarded to case agent."], ["TN0865", "11-15-2011", "Closed", "", "", "", "Please close per ASAC Lewis 11-15-11, intel only.."], ["TN0868", "11-15-2011", "Open", "Routine", "", "", "on Nov. 15, 2011 at 5:48 pm I received a call by Regina Sides 731-614-9696. She said she was going to a funeral on the day Holly went missing and passed by the Camp side owned by Brad Camper and had a weird feeling he has something to do with her disappearance. She said Mr. Camper has lots of parties at the campsite with a lot of young people one of which is Holly and Stephany Kennedy. She requested we look at Mr. Camper as she said there was a body found of a young girl recently there but no details were released. \n\n\n\nZhenya Ivanova, IA"], ["TN0869", "11-15-2011", "Open", "Routine", "", "", "on Nov 15, 2011 at around 8pm i received a call from a lady named Samira- Department of Justice Command Center (916) 227-2893. She reported that she received a call from a Spanish speaking Eusbio Gusman(he specifically requested a Spanish Speaker)- 559-667-8569. He stated that he saw Holly in Tolery, CA about 2 weeks ago and with a 26 year old looking Caucasian male. He called saw the flier for missing persons and called the number to report it. He said the girl looked like she was homeless so he gave her $15.00 and asked her where they were headed. She told him they were trying to hitch hike to Santa Barbara. I hope this helps. Thank you! Zhenya Ivanova, IA Criminal Intelligence Unit Tennessee Bureau of Investigation"], ["TN0867", "11-16-2011", "Open", "Routine", "", "", "1) on Nov 10, 2011 we received a call on the TBI-find  line from a Dusty Carden, owner of Netease Internet services at Parsons, TN, phone # 731-549-0282, he stated that he had received a phone call that seemed odd to him from Ohio #234-736-1260 at 13:20 pm. Caller said they are working as part of investigating team from Ohio, asking for information on Holly Bobo. They asked Mr. Carden what kind of business he runs  and if he is situated close to Bear Creek Road Phone company, caller was very surprised that Mr. Carden runs an internet service provider.\n\n \n\nZhenya Ivanova, IA\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation"], ["TN0866", "11-17-2011", "Open", "Routine", "", "", "On June 8, 2011 about 4:40pm we had an encounter with a man I had a creepy feeling about in an area about 30 miles from where Holly Bobo disappeared. I wrote down the situation as it occurred and took a cell phone picture of his license. I keep thinking about the situation and how it seemed suspicious.\n\n\n\nWe pulled into the parking lot in front of the deck at Pilot's Knob. When the man saw us pull in he was coming down from the deck and rushed to get in his truck. Our group was traveling in two Dodge caravans. The man pulled out like he was leaving then stopped directly behind both our vans so we were blocked in. He rolled down his window to make conversation. When he saw there were 4 adults and several kids he started acting nervous. He said he wanted to show us pictures on his cell phone of the river before it was flooded. He  got out of his truck instead of pulling it into a parking spot again so he continued to block us. He kept chattering and wouldn't stop; he kept staring at  sister-in-law who is thin and blonde. We felt uncomfortable and he kept saying he was sorry to bother us but still did. He kept clicking through his phone but couldn't find the photos. He seemed to be trying to distract us from walking down into the woods. He said he lived down\n\n the road and had to come up there to try to get phone reception. He said he worked for TVA. When he did find the photos they didn't seem to be any different than the water looked now so we felt that was an excuse. He made us feel so creepy we all decided to leave. He had talked non-stop the entire time. It wasn't until he saw we were getting in our cars that he got back in his truck to leave. \n\n\n\nHe was a white man wearing a brown baseball cap and had a long pony tail. He had a faint mustache and the beginnings of a beard growing. His eyes were sunken in and a very distinct ocean blue color. He acted nervous and distracted.  \n\n\n\nAva Peeples\n\n615-478-0708"], ["TN0870", "11-20-2011", "Open", "Routine", "", "", "Received a call today from a Ashley Simbeck who stated that her boyfriend, Tyler Brown told her that he was told by a Jimbo Stackpole that Jimbo knows a guy who is stating he killed Holly and she would never be found.  \n\n \n\nAshley and Tyler live in Loretto TN.  Ashley stated Tyler told her this on Thursday 11/17/2011.  Ashley did not have any other info regarding who told Jimbo but she can be reached at 931-279-2635.  \n\n \n\nI was able to find a James Joseph Stackpole that lives in Loretto.  His DL# is 107605126"], ["TN0871", "11-22-2011", "Closed", "", "", "", "close - intel only, caller could not say which day this occurred, only recently thinks it connected.  - possible vehicle description. \n\n\n\nASAC Mark Lewis"], ["TN0871", "11-22-2011", "Open", "Routine", "", "", "on 11-22-11, this agent spoke with caller Leslie Collins who stated his wife ( Vickie ) might have info on Bobo case. Said that week of Bobo disappearance, she was driving to work and was between Camden and Parsons on 641 traveling north and was passed at high speed by white 4D truck pulling a 4 wheeler. With 4 white males and a blonde female in the truck. Same date spoke with Vickie who verified this and added that the truck had Indiana tags, but one of the males looked like an employee at food giant in parsons. She said she thought nothing of it until recently as she has begun to read on the case, and now remembers the female made eye contact with her and she could have been holly, and she held her hands up like she was handcuffed but did not see handcuffs.  Vickie does not remember if this was the same day of the abduction, and did not have a good answer when asked why she did not report this back in april considering she knew the Bobo's and knew about the abduction. 731-733-0222 or 0221. 65 Berry Wood Ln, Parsons. \n\nLibby Shepherd, Administrative Secretary"], ["TN0867", "11-23-2011", "Closed", "", "", "", "I spoke with Dusty Carden, owner of Net Ease in Parsons.  Carden said he had been concerned when he received a call from someone claiming to be an investigator from Ohio and was asking questions about his location, his business and the area. The caller had asked about Bear Creek Rd. Specifically.  Carden was told there is a private investigator from Ohio working on Holly's disappearance but his investigation was in no way connected to ours.  I told him if he did not want to talk to them he did not have to.  Carden said he was in no way connected to the Bobo family and he did not do business with the Bobo family.  I recommend this lead be closed.  SA Joe Walker"], ["TN0872", "11-27-2011", "Open", "Routine", "", "", ">>> Kathi Randolph 11/27/2011 12:27 PM >>>\n\n\n\nenter call to TIES\n\nOn November 27th at 12:05 pm Mr. Thomas Brown in Destin, FL called to give the following tip:\n\n \n\n      A car that was parked at Walmart, store 15017, on Highway 98 in Destin, Fl had the poster about Holly Bobo taped on the window inside the car.  \n\n \n\n       About a half mile from there he found a TN DL for John Nathan Kohlman, 5814 Wallflower Lane, Knoxville, TN that was torn in four pieces.  He said the expiration on the DL was not until 2014.\n\n \n\n      He said he thought it was suspicious and wanted to report it.\n\n \n\n      He can be reached on cell phone number 850-218-9579 and lives in Destin."], ["TN0869", "11-28-2011", "Closed", "", "", "", "In regard to VCC lead TN0869: I spoke with FBI SA Art Viveros on last Wednesday.  Art said he had received the same information and since he spoke a little spanish, he would contact the person giving this information and see what further information he could get.  This information will be included in the FBI case file.  I request that this lead be closed.\n\nSA Joe Walker"], ["TN0866", "11-28-2011", "Closed", "", "", "", "In regard to VCC lead TN0866: I spoke with Ava Peeples and got the license plate number 339WJW, TN issue, from her as the vehicle she encountered at Pilot's Knob.  This tag is registered to MArk Shane Seaton, 395 Old Flatwoods Road, Eva, TN in Benton County. The vehicle and dl picture of the subject match her description.  I contacted Inv. Bryant Allen of the Benton County Sheriff's Office and asked him about Seaton.  \n\nBryant said Seaton would not have good phone reception where he lived and it was not far from Pilot's Knob.  Bryant said Seaton might smoke a little marijuana but he certainly didn't think he was capable of doing anything violent. I request this lead be closed but kept for informational purposes.\n\nSA Joe Walker"], ["TN0872", "12-02-2011", "Update", "Routine", "", "", "update\n\nOn Friday, 12/2/2011, I spoke telephonically with Jon Kohlman reference the Bobo investigation.  RA explained to Kohlman that his license had been found discarded in Florida and there were concerns over his safety.  Kohlman stated that his wallet had been stolen while he was on vacation there in the past weeks.  He advised that he had since obtained a replacement license and contacted his financial institutions regarding the theft.  Kohlman stated that he had received a telephone call from an individual claiming to have found his license, but he suspected he may have been the person who stole it.  He advised the caller was worried more about receiving a reward than returning his property. \n\nSpecial Agent Darren DeArmond - Knoxville"], ["TN0872", "12-05-2011", "Closed", "", "", "", "ASAC Lewis has attempted on numerous  occasions to contact  Brown via telephone to the number he provided, all attempts were unsuccessful.\n\n \n\n \n\nclose - per ASAC Lewis, 12-5-11, does not appear to be related to case."], ["TN0873", "12-21-2011", "Open", "Routine", "", "", "Nicole Daniel \n\nTuesday, December 20, 2011 4:59 PM  \n\nI received a tip on the find line from Judy Afflerbach 765-654-7976, Judy states she is an attorney and at one time was a deputy prosecutor.   \n\nJudy stated-Gordon Lynn Dunkin 9/19/1963 W/M åÐlives in Lexington, Tn- He is a sex offender, where he lives supposedly has 5 cabins on his property, his house supposedly has hidden rooms.Gordon also has family living in Ohio.Gordon either works for but possibly owns Lexington Concrete.Gordon has a nephew åÐ Tyler Gusmus 3/4/1990 W/M åÐ Tyler has been involved in drugs in the past.  Tyler used to live in Bowling Green, KY until about 7 months ago when he moved to Lafayette, Indiana to be by his wife's family. Deanna aka 'D'Gusmus is Tyler's wife, a small blonde- Deanna is 8 months pregnant.Tyler has in the past worked for his uncle Gordon when he lived in KY.However now that Tyler has moved to Indiana Gordon will randomly call Tyler to come help him at work.Deanna was recently admitted to the hospital for a couple days due to her pregnancy, Tyler just return from another trip from Gordon's house and had a disposable cell phone; which is weird because both Tyler and Deanne have regular cell phones.  Deanna over heard a conversation that Tyler was having with Gordon where Tyler stated 'I think she knows more / she's getting to understand more of what's going on.' \n\nApparently the police went to Gordon house, not sure why but after Gordon called Tyler and was freaking out. Deanna was watching CNN with Tyler and they were doing a special on Holly Bobo-and Deanna said I need to pray for that family / hope they find her ect.Tyler got really mad and stated 'Just leave that fucking alone.'Deanna saw some sketch of a potential suspect- Deanna stated the sketch looks like Gordon Dunkin. Deanna apparently told all this information to her mother and that's where Judy received the information."], ["TN0874", "12-21-2011", "Open", "Routine", "", "", "This is the tip I received on our TBI-find line a few minutes ago:\n\n\n\n Mr. Steve Holloway phone # 404-268-0208 called to report that yesterday- Dec.20th, 2011 he saw a young girl whose eyes, nose and cheeks were exactly like Bobo's picture. He said she had shorter hair but the smoothness of her skin looked just like Holly. He saw her between the hours of 6 and 8 pm at the Travel Inn on the corner of Industrial Blvd and Shirley Drive in Atlanta, GA. She was alone. She was wearing a yellow tube top and black spandex pants- he said she looked like a prostitute. Seemed to be between 20 and 25 years old. She was very aggressive trying to solicit him into going to her room. She told him her room number as #230 and called him to go to her. At the same time she got into an argument on the balcony with another \"black\" girl- \"dark skinned young lady\" in another room. The girl who looked like Holly, looked like she was on drugs. He went to her room and stood on the door way talking to her but \"something didn't feel right\" about what he was going to do so he decided not to go in. He could smell marijuana from inside the room. \n\n\n\n \n\n\n\nZhenya Ivanova, IA\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation\n\n901 R.S. Gass Boulevard\n\nNashville, TN 37216\n\n(615) 744-4397"], ["TN0875", "12-21-2011", "Open", "Routine", "", "", "At 17:46 today Dec 21, 2011 I received a tip for the case of Holly Bobo by Ms Laura, phone # (618)343-3585.\n\n\n\nShe said that she heard from a friend of hers who lives in Camden, TN that Holly's dad had an argument with one of \"the Bruce boys\" from Camden, TN. She said they had been in the penitentiary for killing someone. The argument was over Holly's dad telling one of the Bruce boys that he was \"no good\".\n\n\n\nMs. Laura said she lives in Illinois and is available to be contacted if needed.\n\n\n\n \n\n\n\nZhenya Ivanova, IA\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation\n\n901 R.S. Gass Boulevard\n\nNashville, TN 37216\n\n(615) 744-4397\n\n(615) 744-4655 FAX"], ["TN0874", "12-22-2011", "Closed", "", "", "", "From: Terry Dicus \n\nSent: Thursday, December 22, 2011 2:57 PM\n\nTo: Mark Lewis\n\nSubject: FW: BOBO tip\n\n \n\nMark,\n\n \n\nI called the Travel Inn that he was talking about.  They had a lady named Kyle that rented the room on that night.  She is blond-haired, but doesn't favor Holly.  I had them look up Holly on google and Dan who works every day hasn't seen her.   \n\n\n\n--------------------------------------------------------------------------------"], ["TN0876", "12-28-2011", "Open", "Routine", "", "", "From: Tony chapman [gitguss@charter.net]\n\nSent: Tuesday, December 27, 2011 1:35 AM\n\nTo: tipstotbi\n\nSubject: Five missing women and Manitowoc Refrigeration locations\n\n TBI,\n\n This may be a stretch, but Parsons, TN has a plant of Manitowoc Refrigeration (McCall) and other towns and cities have Manitowoc locations near or what would be on the way to locations of similar disappearances of petite, blonde women and several locations are college or near college towns. I began teaching at the Jackson State Community College in Lexington, TN in September of this year and have talked with some of the students who are friends of (or know) the Bobo family and I began looking for similarities in these 5 disappearances and Manitowoc Locations. I thought you might look to see if there is any Manitowoc employees (truck drivers especially) who go between the locations. It is probably just coincidence, but I felt like I needed to point it out and if it is nothing, I have done what I believe is the 'right thing.åÓ\n\nTony A. Chapman\n\nAdjunct Faculty\n\nJSCC, Lexington, TN\n\n(731) 610-1059 (Cell)\n\n  \n\nDates & times when the five blonde women were reported missing and/or abducted;\n\n1)Holly Bobo åÉåÉåÉåÉ..Wednesday @ 7:40 am April 13th 2011 Darden TN \n\n2) Lauren Spierer åÉåÉ..Friday @ 4:30 am June 3rd 2011 Bloomington IN, \n\n3)Ktelyn MarkhamåÉSaturday @ 11:00 pm August 13th 2011 Fairfield OH.\n\n4)Paige Johnson åÉåÉThursday @ 1:00 am September 23rd 2010 Florence KY.\n\n5) Karen SwiftåÉåÉåÉåÉ. Sunday @ 5:00 am October 30th, 2011 Dyersburg TN,\n\n  \n\nManitowoc Refrigeration Division Locations[2]\n\nParsons, Tennessee (Near Darden, TN)\n\nSellersburg, Indiana (Near Bloomington, IN, Fairfield OH, and Florence KY)\n\nFort Wayne, Indiana (Northernmost M/R Plant other than Manitowoc, WI corporate headquarters)\n\nCovington, Tennessee (Near Dyersburg, TN)\n\nBarbourville, Kentucky (on way to Fairfield, OH and Florence, KY)\n\nPiney Flats, Tennessee (on way to Fairfield, OH and Florence, KY)"], ["TN0875", "12-28-2011", "Closed", "", "", "", "Close åÐ info on Bruce family already been received/ info forwarded to SA Dicus. \n\nASAC Mark Lewis"], ["TN0876", "12-28-2011", "Closed", "", "", "", "Close åÐIntel only /info forwarded to SA Dicus. \n\nAsac Mark Lewis"], ["TN0877", "01-08-2012", "Open", "Routine", "", "", "Just received a call from a Mark Milam  (901) 240-6204 who stated that sometimes he visits a casino in West Memphis Arkanasa and the past couple of times he has been there he has noticed a truck in a hotel parking lot with Decature County TN plates.  Mr Milam stated it appeard approximatley 6 weeks ago and it there everytime he goes to the casino.  It is parked in a Days Inn parking lot at the Ingram Arkanasa exit (he thinks it is exit 5).  He was able to provided a plate number (622XHY).  The plate comes back to a Brian Mosley out of Parsons. ( I have attached the plate and DL info for Mr Mosley.  \n\n \n\nMr Milam just thought this was odd and wanted to report this information.\n\n \n\n \n\nIA Tracey Givens\n\nTennessee Bureau of Investigation\n\n901 RS Gass Blvd \n\nNashville TN 37216"], ["TN0877", "01-09-2012", "Closed", "", "", "", "Did a criminal history check on Brian Mosley, nothing that would relate to this case, close intel only.\n\nTBI ASAC Mark Lewis"], ["TN0880", "01-10-2012", "Open", "Routine", "", "", "From: Zhenya Ivanova \n\nSent: Tuesday, January 10, 2012 12:01 PM\n\nTo: Mark Lewis\n\nSubject: Holly Bobbo Tip\n\n\n\nI just received a tip about Holly Bobo. A man by the name of Michael Miller, phone# 513-376-1773, called to report that he \"saw Holly a couple of hours ago\" walking into the Walmart on Harry Sauner RD in Hillsboro, Ohio. He saw her face on the pecan pie box after he saw her and it stated that there was a $80,000.00 dollar reward for her. He stated she was wearing pink pants and a shirt and looked \"pretty much like the picture\". He stated that she was with another female who's hair looked different but who \"had the same structure as Holly\"."], ["TN0886", "01-18-2012", "Open", "Routine", "", "", "Received a call from Mr. Harold Phifer @ 1644 Tom White Rd.Big Sandy, TN (731)593-3327 in reference to an overheard conversation regarding the disappearance of Holly Bobo.  Mr. Phifer stated he was in a local Texaco and overheard some individuals talking about a female body they had found in \"Harmon Creek\".\n\nHe stated that one of the individuals stated that \"you know that's the Bobo girl\" J. C. Bruce is the one that killed her\".  Mr. Phifer stated he did not know if it was fact and had no knowledge if they had actually found a body and not reported it or if it was a falsehood.  He did state he was familiar with Mr. Bruce, who was working cutting wood in the general vicinity of the Bobo's residence at the time of her disappearence and he has been convicted of attempted murder in the past.  Mr. Bruce, according to Mr. Phifer has served time in prison for throwing a female off the Duck River bridge along I-40.  The victim landed in a manner that allowed her to survive and testify against Mr. Bruce.  Mr. Phifer feels that Mr. Bruce is more than capable of being involved in the disappearance of Ms. Bobo."], ["TN0878", "01-18-2012", "Open", "Routine", "", "", "Good Afternoon,\n\n\n\nI just received a call on the TBI find line from a person who identified himself as Holly's preacher. He called from #731-845-9920. He said that he received a phone call from an anonymous person today stating that we need to investigate a Mr. Hollie Newton- male from Hohenwald, works in Timber, lives in Nunley, about 60 years old. He stated that he was told Mr. Newton had a rape and a murder on his record and was suspected by neighbors for other offences that were not proven. \n\n\n\nI researched the name in the Portal and found a man who matches the description and am attaching the information. He is not in the SOR registry but his Tomis ID shows he was convicted of rape and murder in the 70's.\n\n\n\nPlease let me know if you need any help in regard to this tip. \n\n\n\nThank you,\n\n\n\nZhenya\n\n\n\nZhenya Ivanova, IA\n\nCriminal Intelligence Unit\n\nTennessee Bureau of Investigation\n\n901 R.S. Gass Boulevard\n\nNashville, TN 37216\n\n("], ["TN0881", "01-20-2012", "Open", "Routine", "", "", "From: Amy Allen \n\nSent: Friday, January 20, 2012 10:36 AM\n\nTo: Mark Lewis\n\nSubject: Tip on Bobo Case\n\n\n\nCaller, Raymond Martinez (956) 237-5871, stated he saw Holly's poster on the back of a semi truck in Laredo, Texas. He advised that a female matching her description has been seen over the past year standing at the corner of Hwy 35 and Hwy 59 in Laredo asking passersby for money. She always wears a long dress and has  a dog with her. He has only seen her there during the day and has never  seen her at night."], ["TN0879", "01-23-2012", "Open", "Routine", "", "", "I just received a tip regarding Holly Bobo. Caller Lynda Shuttleworth phone # 310-450-6389 from Santa Monica, CA called to report that since yesterday (1-22-12) she has watched a white van with tan trim, CA TAG# 6MDC577, that has been parked across from her building. She saw there was a girl matching Holly's description who was dropped off yesterday afternoon by a silver pick-up truck with a handicap sticker, \"maybe an F-250\". The Guy who dropped her off, driving the truck was supposedly matching the description of Holly's assailant  drawn by a psychic. Ms. Shuttleworth claimed the young lady went in and out of the van at some point and looked like she had sores in her mouth and had been sedated, wobbly and beaten up, and tortured.\n\n\n\nShe said the girl looks to be 5'3-5'5, 100+ ponds, blond.\n\n\n\nThe caller stated the truck was currently at the 1800 block of Ocean Park Blvd, Santa Monica, 90405, just east of 18th street on the south side.\n\n\n\n \n\n\n\nI ran the tag and it came back to the following individual:\n\n\n\n \n\n\n\nTXT\n\nDATE: 01/23/12 TIME: 13:12\n\nINSURANCE INFORMATION ON FILE              \n\nREG VALID FROM: 07/26/11 TO 07/26/12\n\nLIC#:6MDC577 YRMD:97 MAKE:DODG BTM :SV VIN :2B6HB21Y9VK576337 \n\nR/O :MCCLENDON TYRONE, 19911 VENTURA BLVD CITY:WOODLAND HLS \n\nC.C.:19 ZIP#:91364 \n\nSOLD:00/00/97 RCID:09/16/11 OCID:07/01/10 LOCD:9 \n\n06/16/10 PREV LIC     1PNKLDY  \n\n\n\n04/08/2000-ODOMETER:     75,327 MILES  ACTUAL MILEAGE          \n\n\n\nEND"], ["TN0879", "01-26-2012", "Closed", "", "", "", "I just contacted Dispatch at Santa Monica Police Department and spoke to Bishop who advised me that their officers were dispatched to the address in question after Ms. Shuttleworth called them as well, and found nothing unusual after making contact with the person in the Van in question.\n\n\n\nClose as per ASAC Mark Lewis,not believed to be related."], ["TN0882", "02-01-2012", "Open", "Routine", "", "", "From: Zhenya Ivanova \n\nSent: Wednesday, February 01, 2012 12:49 PM\n\nTo: Mark Lewis\n\nSubject: Tips call for Bobo\n\n\n\nGood Afternoon,\n\n\n\nwe just received a call on the Find line about an article that was published talking about a sex offender Terry Britt stalking women in Madison County. I found the article the caller was referring to and i'm attaching a link to it:\n\n\n\n\n\nhttp://www.wbbjtv.com/news/local/TBI-Sex-Offender-Stalking-West-TN-Women-138444709.html\n\n\n\nCaller's name is Nathan: phone# 931-797-8040, and wanted to suggest we look into Mr. Britt for possible connection to Holly Bobo."], ["TN0883", "02-02-2012", "Open", "Routine", "", "", "A few minutes ago i received a phone call on the TBI Find line from Ms Karen Lancaster, phone # 731-847-6726.\n\n\n\nShe stated that we need to pull a statement she made to a blond, female TBI agent around the time of Holly's disappearance. She stated that she took part in 5 searches for Holly and her statement was regarding Mr. Terry Britt. She requested to be shown an old picture of Mr. Britt.\n\n\n\nShe stated that about 8 years ago she was working at a fast food place when she was approached by a man who was driving a white 6-wheel van with the YMCA emblem on it who tried to get her to go in the van and put 2 wires together to help him start it. She stated that the incident was suspicious because there is no YMCA anywhere close to Parsons and the man was visibly staring at her for a while but wouldn't speak and was very unnerving. She stated that he went to her place of work twice and the second time was while the place was completely empty. She stated she asked the next customer who came in to wait with her until that man left because she was afraid of him. \n\n\n\nMs. Lancaster stated that Mr. Britt has the same eyes but she would like to look at an older picture of his in order to be completely sure it was him.\n\n\n\nShe stated that she talked to Sheriff Ronald Kennar and deputy Sheriff Waylen Inman about the incident and they tried to locate the van but were unable to investigate further.\n\n\n\nMs Lancaster requested for an agent to contact her for further details on her statement as she was not certain if the details were retained."], ["TN0884", "02-02-2012", "Open", "Routine", "", "", "From: Zhenya Ivanova \n\nSent: Thursday, February 02, 2012 12:12 PM\n\nTo: Mark Lewis; Terry Dicus; Larry Anthony; Rosemary Lambert\n\nSubject: Bobo tip\n\n\n\nA woman by the name of Patty Jicking, phone# 615-308-6968 called to report that a guy she used to know by the name of David Edgar from Mary Esther, FL ( - in an efficiency apartment by the water) needs to be checked in the case of Holly Bobo.  He used to be a truck driver and would wear camoflage clothes sometimes and talked about hating women. He used to drive from Florida to Memphis but has been fired since. He used to look up women on Craigslist. He was born on Dec. 10 and is about 50yo."], ["TN0885", "02-02-2012", "Open", "Routine", "", "", "From: Zhenya Ivanova \n\nSent: Thursday, February 02, 2012 12:26 PM\n\nTo: Larry Anthony; Mark Lewis; Rosemary Lambert; Terry Dicus\n\nSubject: New Bobo tip\n\n\n\n\n\nMr. Billy Ray Beecham, phone# 417-499-2433, a truck driver for Taylor Express out of Fayetteville, NC who lives in TN, called to report that he thinks he saw Holly on the 429 Bi-pass in Kansas City on about 3 months ago. She was in a white car with @ white males and another girl. He reported that she looked 14-15/ 18-19 yo. She had short, blond hair and was either sitting in the front between the 2 men or on the back seat and looking in between the front seats. She stared in Mr. Beecham."], ["TN0883", "02-08-2012", "Closed", "", "", "", "Please close 883\n\n \n\nSA Dicus 02-08-12.  The timeframe for this stalking allegation is the summer of 2002 (Sheriff Kenner was in office at the time).  Britt was in prison until January of 2003 and could not be the perpetrator of that offense.  Not enough information is available to proceed with a separate complaint."], ["TN0882", "02-08-2012", "Closed", "", "", "", "Please close.\n\n \n\nSA Dicus 02-08-12.  Caller has no personal knowledge of Britt or why he may be the subject."], ["TN0887", "02-16-2012", "Open", "Routine", "", "", "2-14-12, caller Tony Robertson advised that on date of Bobo kidnapping, he saw a suspicious vehicle in the area of Rock Milan Rd in Henderson Co. This is near the 101 exit on I 40. The vehicle was a maroon  90s ford truck, driven by a w/m with dark hair. Robertson said he passed this vehicle and can only describe it as suspicious, he said he should have called in when it happened, and recently saw a police show on TV which prompted him to call in now. Added that there were some swamps in the area, good place to hide a body.  Tony Robertson, w/m 6/26/57, 731-307-6437, currently lives in MO but last April lived in Henderson Co TN."], ["TN0887", "02-16-2012", "Closed", "", "", "", "Close per ASAC Lewis - intel only  - vehicle description."], ["TN0870", "02-21-2012", "Closed", "", "", "", "Close as per ASAC Mark Lewis:  Lead documented in case file, ref Lawrence Co. Sheriff Department lead."], ["TN0889", "02-23-2012", "Open", "Routine", "", "", "Memphis PD Sgt. Andy Hurst passed on a lead about Holly Bobo.  Andy has a contact in Henderson County named Denny Dennison (PH 731-968-8492) that I believe works around the Beech Lake area.  Someone showed Denny a photo of a waterlogged decomposed arm and that person said it was from one of the lakes in Henderson County.  I do not know how accurate this info is, but Denny is willing to be interviewed and provide more info.  I remember working up there in Decatur with you guys last year and know that all leads have to be researched.  Maybe if the photo is real and it is not Holly Bobo's arm, it might help some other criminal case or missing persons.  \n\n\n\nDon R. Hankinson Jr.\n\nInspector-Sex Offender Investigation Branch\n\nUS Marshals Service\n\nPH 901-969-4210\n\nCELL 901-601-0281"], ["TN0888", "02-23-2012", "Open", "Routine", "", "", "A woman by the name of Natasha Bowan, phone# 801-605-3839, called to report that about 2 weeks ago she saw a girl she thinks was Holly Bobo in the mall in Ogden, Utah. She said there is only one mall in the community of Ogden and they were in the food court with her children and started talking to a girl who introduced herself as Holly form Tennessee and said she had ran away from her family for love and didn't care to be around them much. She was with an older white male, blond hair, blue eyes, glasses and a baseball cap, who just came and told her that they need to go and called her Holly.\n\nThe caller said that her children showed her the picture on the box because they recognized Holly from the Pie box. She said Holly's hair was the same only with a few dark highlights.\n\nCaller said she believed that Holly was staying by Weber State University, Utah and since that is considered Mormon Country, she would go unnoticed with an older man, since that was completely normal."], ["TN0890", "02-26-2012", "Open", "Routine", "", "", "Just received a call for a woman in Missouri who did not leave her name but her number was 573-598-1239.  Caller stated she received information on where Holly is buried from another person who wanted to remain anoymous.  Caller stated she was told the following directions:\n\ntake ext 126 off of the interstate and take highway 641 into Benton County \n\nRight before the Jimmy Kelly Trucking company there is a road (did not have the name of the road).\n\nTurn left onto this road.\n\nShortly after turning onto this road there will be another smaller road that if you aren't paying attention you will miss it (did not know if the second road was on the right or the left)\n\nOnce on the smaller side road there is an old cemetery that is not marked and Holly is buried in this area.\n\n \n\nCaller also stated that the person responsible the person who's vehicle was shot up 11 times or so.  She could not give me any other information regarding the person or this incident.\n\n \n\nIA Tracey Givens\n\nTennessee Bureau of Investigation"], ["TN0891", "03-13-2012", "Open", "Routine", "", "", "An unidentified caller said that he was approached by a girl fitting Holly's description at a Pilot in Tipton, Georgia.  He said she was working as a prostitute and gave him the number 229-392-7217.  He also said that workers at that store know the girl."], ["TN0868", "03-14-2012", "Closed", "", "", "", "As Per SA Terry Dicus\n\nPlease close lead 868, per me.  Brad Camber was at work in Lexington from 5:30 am until 4:01 pm on the day of the abduction.  He is not allowed to leave work."], ["TN0892", "03-16-2012", "Open", "Routine", "", "", "I received a call on the TBI Find from SGT Shoaff with Stewart County SO- he works in the jail, his cell 931-627-9298 / SO non emergency # 931-232-8332\n\n \n\nSGT Shoaff stated that one of the inmates Joshua Eads W/M 11/29/1988 (in jail on a VOP) has been in contact with his ex wife - Jennifer Eads W/F 2/11/1986 currently homeless/lives with boyfriend.  Jennifer has told Joshua that when she was with her new boyfriend Randal Edward Williams W/M 8/8/1984 who lives in Big Sandy (currently in jail in Benton County and a Sex Offender) last August she was at his house in Big Sandy on the front porch - it was her Jennifer, Randal, Randal's sister Bretnie Ramsey W/F 12/16/1989- and some other guys that were hanging out but Jennifer doesn't know the names, but they talked about they knew what happened to Holly Bob- that in retaliation to Holly's father firing a guy (Jennifer didn't know his name) that he and his brother then kidnapped Holly- killed her and rolled her up in barbed wire and threw her in the lake (unknown lake /area)\n\n \n\nRandal advised Jennifer not to talk about it that these were bad guys but Jennifer brought it up to Joshua. \n\n \n\nSGT Shoaff stated that Jennifer doesn't have the great past but she came from a good family her brother was a police officer ect but she went down the wrong past however she has worked for them before as an informant with the drug unit and she normally gives creditable info-She doesn't have an address now but her phone #731-220-5094.  \n\nNicole L. Daniel, IA"], ["TN0857", "03-21-2012", "Closed", "", "", "", "On 03/21/12 I spoke with Lt. Rick Gregre of the St. Peters Missouri PD (636) 278-2222 and requested his assistance.\n\nLt. Gregre called back and stated that he had obatined a picture of Holly from the TBI web site and spoke with the manager at QT truck stop. The manger stated that she had been at the QT for five years and had employed five or six females that matched Holly's description but looked at the picture and confirmed that Holly had never worked there. \n\nPlease update and close.\n\nSA Ronnie Faulkner"], ["TN0890", "03-21-2012", "Closed", "", "", "", "SA Terry Dicus;  The person referred to in this lead is Jason Autry.  Autry has been interviewed and he has not been ruled out as the possible perpetrator.   Dicus, Inman and Chief Rogers of Benton County SD have attempted to locate the area of the unmarked cemetary, but the caller cannot provide sufficient directions where it can be located.  Chief Rogers is contacting Dennis Bell who lives in this area and was on the search team that covered this area for two weeks.  With no further information available, this lead can be closed.  New information will be followed when it is received.   (Date worked 03-21-12)"], ["TN0858", "03-21-2012", "Closed", "", "", "", "I spoke with Jacob Kohloof via telephone on 03/21/12 at 651-785-3830 he conformed that he lives in Saint Paul, MN.\n\nSA Ronnie Faulkner;\n\nHe stated that he had seen Holly's picture on the back of a semi-truck and then he had read about her on Google.\n\nHe stated that the reason he had called was because he was curious to see if she had been found. \n\nPlease update and close the lead."], ["TN0886", "03-21-2012", "Closed", "", "", "", "SA Terry Dicus;  The body recovered at Harmon's Creek is not Holly Bobo.  James Fields has been prosecuted in relation to that unrelated crime.  JC Bruce has been interviewed and his alibi for that day, Ron Darcy, has also been interviewed.  While their information was consistent, Bruce and Darcy have not been ruled out as a possible perpetrators.  New information relating to them will be followed when it is received.  (Date worked 03-21-12)"], ["TN0859", "03-21-2012", "Closed", "", "", "", "859.  Inman and Dicus are not familiar with an area called Love Farm in Parsons.  Dicus tried to call the number on the anonymous tip, but it has been disconected.  This lead can be closed pending further information.  (Date worked 03-21-12)  \n\n \n\nSA Terry Dicus;  Inman and Dicus are not familiar with an area called Love Farm in Parsons.  Dicus tried to call the number on the anonymous tip, but it has been disconected.  This lead can be closed pending further information.  (Date worked 03-21-12)"], ["TN0892", "03-21-2012", "Closed", "", "", "", "SA Terry Dicus;  Dicus and Inman interviewed Randall Edward Williams at the Benton County Jail.  He confirmed that the persons named in the lead were speaking about this crime, but no one had any knowledge of it other than the multitude of rumors that have circulated.  According to Dana Bobo, the victim's father, he has never had an employee or had anyone fired.  Dicus did confirm that Williams was incarcerated in Benton County at the time of Holly's disappearance.  This lead can be closed.  (Date worked 03-21-12)"], ["TN0863", "03-22-20
