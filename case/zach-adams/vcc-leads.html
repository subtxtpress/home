Open", "Routine", "SA Joe Walker", "Email to TBI Website", "Email to TBI Website\n\nI have something but I am not sure if it is anything.  I have seen some things speculated online tonight and I have a person that fits the description.  I do not know where he was during the time she was abducted but I know I searched with him and he acted peculiar enough that I told my family members I was with I wanted to get away from him.  I really feel this would be better described with me talking versus an e&#8209;mail.  Duct tape was found that day and he was ahead of us.  There again it might not be anything.  I do not want to call names when all I have are something of a description of him and his family online and my gut feeling.  My cell phone is 731&#8209;733&#8209;1999.\n\n\n\nRosemary D. Hamilton\n\nrwward@tds.net"], ["TN0763", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website from America's Most Wanted\n\nReported By &#8209; Customer &#8209; Bobo, Holly \n\nIssue Number &#8209; 155111\n\nCategory &#8209; TIP&#8209;EMAIL\n\nDate Received &#8209; 4/29/2011 09:45:19\n\nPriority &#8209; MODERATE\n\nEntered By &#8209; terameau\n\nName Used &#8209; barry allen\n\nAddress &#8209; internet\n\nCity &#8209; benton county /  dickson county\n\nState &#8209; TN\n\nCountry &#8209; \n\nWhen Last Seen &#8209;  4/28/11&#8209;4/29/11\n\nAppx Age &#8209; \n\nHeight &#8209; \n\nWeight &#8209; \n\nHair &#8209; \n\nEyes &#8209; \n\nLanguage and Accent &#8209; \n\nRace &#8209; \n\nVehicle &#8209; \n\nScars and Tattoos &#8209; \n\nClothing &#8209; \n\nDescription &#8209; WHO_SEEN: barry allen\n\nWHAT_NAME: barry allen\n\nWHERE_SEEN: facebook\n\nWHEN_LAST_SEEN: 4/28/11&#8209;4/29/11\n\nHEIGHT: \n\nWEIGHT: \n\nAGE: \n\nEYE_COLOR: \n\nHAIR_COLOR: \n\nADDITIONAL_PHYSICAL_DESCRIPTION: \n\nVEHICLE_USED: \n\nOTHER_COMMENTS: this is for the HOLLY BOBO CASE..decatur county tn.. This man is really strange and acts like he knows a lot about the case and is not from the area..close but not real close..pages have blocked him because of his comments..maybe nothing to it, but is just doesn't seem right...says from benton county tn and lives in dickson county tn..no real employment showing\n\nLEVEL_OF_SURENESS: 3\n\nPERSONAL_INFORMATION: tammy ramey decatur county tn\n\nENTERED: {ts '2011&#8209;04&#8209;28 22:37:33'}\n\n\n\nTime Spent &#8209; 000:00:02:57\n\nSummary &#8209; tammy ramey decatur county tn"], ["TN0764", "05-04-2011", "Update", "Routine", "", "", "2nd part of email\n\n\n\nADDITIONAL_PHYSICAL_DESCRIPTION: He's tall and skinny and eerily resembles Holly Bobo's boyfriend. This would explain why Hollys brother thought the abductor was infact her boyfriend because of the close resemblance Danny has to him.\n\nVEHICLE_USED: He drives a Honda Accord but has a girlfriend who drives a green explorer or expedition. \n\nOTHER_COMMENTS: You really need to look into Daniel Zukowski as a suspect. Not only because how close he fits the description of the abductor. But also because he knows the area the Bobo house is located very well, and he has hunted in the area. His ex&#8209;father inlaw (Richard Poley) lives not even 10 minutes away from the Bobo's residence!! He also has access to the house because Rick is currently in Mississppi attending to his mother who is dying from cancer. Richard Poleys address is 2692 Highway 412 W Parsons, TN. There is a huge creek going all around the house. \n\nLEVEL_OF_SURENESS: 10\n\nPERSONAL_INFORMATION: My name is Drew Pena&#8209;Roque. I am the boyfriend of Dannys es&#8209;wife Danielle Poley. We live in Vero Beach, Florida. My cell phone is 772&#8209;501&#8209;5264 and my email is xdflashx@yahoo.com. I can also be reached on Danielles cell 772&#8209;643&#8209;4003. \n\nENTERED: {ts '2011&#8209;04&#8209;29 05:37:20'}\n\nSummary &#8209; Drew Pena&#8209;Roque. My cell phone is 772&#8209;501&#8209;5264 and my email is xdflashx@yahoo.com.  Vero Beach, FL"], ["TN0764", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nReported By &#8209; Customer &#8209; Bobo, Holly \n\nIssue Number &#8209; 155114\n\nCategory &#8209; TIP&#8209;EMAIL\n\nDate Received &#8209; 4/29/2011 09:45:10\n\nPriority &#8209; MODERATE\n\nEntered By &#8209; terameau\n\nName Used &#8209;  Daniel Zukowski\n\nAddress &#8209; \n\nCity &#8209; Huron \n\nState &#8209; TN\n\nCountry &#8209; \n\nWhen Last Seen &#8209; 2010\n\nAppx Age &#8209; \n\nHeight &#8209; 6'1\n\nWeight &#8209; 180\n\nHair &#8209; brown\n\nEyes &#8209; brown\n\nLanguage and Accent &#8209; \n\nRace &#8209; \n\nVehicle &#8209; \n\nScars and Tattoos &#8209; \n\nClothing &#8209; \n\nDescription &#8209; WHO_SEEN_ID: 77784\n\nWHO_SEEN: Didn't see anyone per say\n\nWHAT_NAME: Daniel Zukowski\n\nWHERE_SEEN: Daniel Zukowski is my girlfriends ex&#8209;husband. I've known her since middle school. She was married to Danny from 2007&#8209;2009 and lived in Huron with him. He still lives there to this day. He also works in Lexington, TN.\n\nWHEN_LAST_SEEN: 2010\n\nHEIGHT: 6'1\n\nWEIGHT: \n\nAGE: 28\n\nEYE_COLOR: brown\n\nHAIR_COLOR: brown"], ["TN0765", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website\n\nHi,\n\n\n\nI do map dowsing to find missing people, and have been successful at locating 4 people within the last couple of years.  These people were found within hundreds of feet of the gps coordinates I came up with (a few much closer).  I volunteer with the Find Me http://www.findme2.com/ team as well.  Recently we were successful as a team in locating Willie Jigba within 50 feet of where he was found by the team of cadaver dogs from the team (I was one of four in the team of 100, thats coordinates were right where he was found). Anyways, I have been strongly drawn to work on Holly's case and wanted to share the coordinates the pendulum has zoned in on.  I am also working as a team on the Psychic Crime Fighters Case http://www.psychiccrimefighter.com/forum/general-2/amber-alert-holly-bobo-20-years-old-memphis-tennessee-area/page_50/ working on Holly's case where many of our successful cases are archived.  I have attached some screen shots from google earth with the area clearly marked.  I really think this area should be searched thoroughly with both scent and cadaver dogs.  At the very least, this place can be eliminated, but with the track record of the pendulum it is definitely work checking out.  Some psychics from the group have been feeling she may be in water, so the lake should be checked out as well since it is in such close proximity to the area the pendulum went to.  \n\n\n\nCoordinate: 35.5034.02 N -88.1427.57 W \n\n\n\nThe pendulum is zoning in on the area of Natchez Trace Park that is North of I-40.  Specifically the areas around and near Maple Creek Lake.  Please see attached maps marking the area clearly.  \n\n\n\nPraying this information leads to finding Holly, and best of luck to your team.  If you have any questions, please don't hesitate to call.  \n\n\n\nKristine Pomeroy\n\n\n\n(360) 758-2719"], ["TN0765", "05-04-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0766", "05-04-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0766", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nI don't want you to think I am crazy, but I called a psychic that I have been to a few times in the past the week Holly went missing . This particular psychic is located in Jackson, Tn and she has always been correct in what she has told me in the past. When I asked her about Holly she had already heard about it and said someone else had talked to her about it. She told me that she kept getting the name Grant over and over again and the name Adam but she wasn't sure if it was 2 different people or if it was 1 person with the name Grant Adams. I asked a few people from Parsons if they knew anyone by that name and they didn't so I never looked into it any further until today. I got on Holly's personal facebook page and was looking through her friends list just to see if anything caught my eye and as I was scrolling down her friends list I came across the name GRANT SHAHANNON ADAMS. I was shocked to say the least. I didn't know if this was something you might look into or if you would just think I am nuts. I do not know this guy at all and his profile is set to private so you can't see where he is from or any information about him but his profile picture was very strange to me. It is a picture of just his face and head and he is hooked to probes like he is having a EEG done which is used to measure brain wave so immediately I think mental problems. Like I said, this may not be of any help but I thought it was something worth looking into. Thank you for your time and I hope this can be of great use. If you have anymore questions please fill free to contact me. \n\nKristin Latimer\n\n1730 Hwy 641 N\n\nCamden, TN 38320\n\nPhone 731-441-4110"], ["TN0767", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nI have never given a tip but I work at the school with Mrs. Bobo and would hate for this one to be accurate and not delivered. I was waiting in line for gas in Lexington and the man in front of me was acting strange but asked the cashier if she had an extra flyer on the missing blond girl he could have. She did not have an extra but he looked at the one she had. He said that he saw her 'holed up' at the new apartments being built behind Sonic. To my knowledge not all of these are even open yet so it might actually make a good place to hide someone. I'm sure you get hundreds of these but there was just something off about this guy that made me wonder if he really did see something or maybe involved somehow. \n\n\n\n\n\nI worked at the fairgrounds helping with food when I could as my husband didn't want me in the woods. I commend you all for the work you are doing to find Holly and for working with the numbers of volunteers you had to deal with. Please keep looking. \n\n\n\n\n\nSummer Brewer\n\nReplying to email is the best way to reach me \n\nor\n\n731-798-6468"], ["TN0768", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nTo whom it may concern in the Tennessee Bureau of Investigation Office, \n\n\n\nI've followed the Holly Bobo Case in the news and understand that any vehicles that people might want to sell quickly should be brought to the attention of the authorities. \n\n\n\nI noticed today on Craigslist that a person wanted to sell a truck right away. The posting was listed this morning. The link is http://jacksontn.craigslist.org/cto/2356172835.html and the title of the listing is \n\nTruck quick sale! Today! Runs great! Make me an offer! - $1650 (Parsons Tn). \n\nThe body of the message contains:\n\n\n\n\"I have a 91 Silverado I want to sell today. It has 166,xxx origional miles on it. It has a 350 v8 and is an automatic. The interior is in great condition, the body needs a little work and could use a paint job. Single disk CD player, power windows and locks, A/C blows but not cold, heat works great. The truck runs and drives great! Title in hand. I can txt pics. Call or txt anytime 931-332-3134. No emails plz. Make me an offer. \" \n\n\n\nIt is out of the ordinary enough that I thought I should at least bring it to your attention. I am sure you already have people looking at auto sales ads but you can never be too careful. \n\n\n\nI really want to see Holly safe and sound. I also don't want to distract you from any other business, but thought this was a very odd sale. \n\n\n\nMike Stoll"], ["TN0769", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nReported By &#8209; Customer &#8209; Bobo, Holly \n\nIssue Number &#8209; 155153\n\nCategory &#8209; TIP&#8209;EMAIL\n\nDate Received &#8209; 5/2/2011 10:54:35\n\nPriority &#8209; LOW\n\nEntered By &#8209; terameau\n\nName Used &#8209; \n\nAddress &#8209; internet\n any young girls. I have known him for 35 years and I would ask that you look into him on the Holly Bobo case as well. He is friends with Roashall Pocius and Nicki Green who both have conncetions with Holly Bobo. I do not want to see any other young girls hurt by this man. \n\n \n\nJoAnne Hasler | Stitch by Stitch Inc.\n\n65 E. Palatine Road | Suite 217 | Prospect Heights, IL 60070\n\nTel: 847-541-2543 | Mobile: 773-612-1314 | Fax: 847-229-0065\n\nMobile Email: JoAnneHasler@att.blackberry.net\n\nstitch217@aol.com | www.stitchembroidery.com"], ["TN0772", "05-04-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\nI have been writing to the smithm@decaturcountytn.org, dcsheriff@netease.net, I have reason to believe she is in a barn.  I also suspect that one of the sex preditors address is involved.  Either way, please check this to make sure this is not a possibility. \n\nFor Holly.\n\nKatlyn\n\n--- On Mon, 5/2/11, kat Trent <kattrent5@yahoo.com> wrote:\n\n\n\n\n\nFrom: kat Trent <kattrent5@yahoo.com>\n\nSubject: Please view this farm house.\n\nTo: smithm@decaturcountytn.org, dcsheriff@netease.net\n\nDate: Monday, May 2, 2011, 7:45 PM\n\n\n\n\n\nI believe that Holly may be at this barn.  It is listed wrong in the real estate trulia listing.\n\nPlease check this place.  \n\nOn google maps put in the following\n\nDestination 1:  681 Swan Johnson Road, Darden, TN\n\nDestination 2:  2800 jannette holladay road, parsons tn  sex preditor's address\n\nDestination 3:  Ray Hill Rd Parsons, TN 38363  (old barn by itself on alot of land.  Has been up for 126 days. )\n\n \n\nThis barn is listed as: MLS 1239019.  If you go to the map it is really Ray Hill Rd Parsons, TN 38363  \n\nThis farmhouse is all by itself. Please check to see if Holly is there. \n\n \n\nThere is a farm house all by itself .   Please check to see if Holly is there.  \n\nKatlyn \n\n\n\nAlso, looking at your website of where the officers are looking, please check out this barn at this location.  \n\n4660 Coffee Landing Road, Morris Chapel TN 38361 \n\nMLS:\n\n3221508\n\n \n\nThis listing is near where you are searching onn \n\nWoodlawn Shores Road Sugar Tree TN\n\n.  I really think she is in a run down barn.  I hope you find her.\n\n \n\nKatlyn"], ["TN0772", "05-04-2011", "Closed", "", "", "", "Psychic Lead\n\n\n\nSubject emailed additional information\n\n\n\nI am sorry to say, but I have reason to believe that Holly is in the water that was near the farmhouse.   She is in the lake or water that runs near the farmhouse from past email.  north east from neighbor.  \n\n\n\n \n\nholly house.... \n\n                                                                                              water                      \n\n \n\n                   neighbor--------"], ["TN0773", "05-04-2011", "Open", "Routine", "", "TIES Operations", "Tip from TIES Operations sent to TBI Tips Email\n\nReceived a call from a distant family member of Holly (Lolita).  She has been speaking to a psychic friend.  The psychic has given us a report that she is seeing Holly is not alive.  That Holly's mother received a sense of peace the other night.  The psychic is seeing a meat processing plant.  She sees the name Prospect Road and/or Iron Bridge Road.  She sees that the brother and boyfriend are not involved yet they know the suspect and everyone will be shocked at end of who it is."], ["TN0773", "05-04-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0774", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nTo whom it may concern:\n\nI know this is a long shot, but while looking through some missing persons photos on a facebook page, I ran across one that looked peculiar to me. This man in Cordova, TN went missing only 4 days before Holly's disappearance. I don't know if he could be involved in Holly's disappearance or not, or if he would have any connection to Decatur County. I didn't know if anyone had seen this or not, so, here is the link: http://www.facebook.com/photo.php?fbid=142206555848542&set=a.107810599288138.9595.100001775941605&type=1&theater\n\n\n\n\n\nThanks, \n\nMarty Mays\n\n215 Beverly Mays Ln\n\nParsons, TN 38363\n\n731-733-0749"], ["TN0775", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email from TIES Operations to TBI Website\n\nPsychic from Arizona called.  She did a reading on Holly Bobo by looking at her photograph and this is what she saw.  Holly told on the subject.  She smells Rosewood incense.  She gets the name Edward Rawlings.  She sees an Old Lansing Road.  She sees a corgis dog, a Highway 87, a man by the name of Kyle, white, medium build, long legs.  She sees a Red Rooster Restaurant.  She seeks the SE corner of the state of Missouri.  A Pitstop Bar or Lounge.  A sandstone or sandblast quary.  The numbers 08/06/78 or 08/09/79.  She sees Sassafras or Sasparella clothing label.  This is not random.  15 to 18 to 21 miles away from her home.  Durham International Raceway.  She also sees the time 8:17 am."], ["TN0775", "05-04-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0776", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nThis may not be relevant to the case but if I don't report it I will worry it could have made a difference. Today when I was riding my father-in-law around, I saw a flock of buzzards over some farm land between Sulphur Springs Rd. and Evanstown Rd which is located in a two to four mile radius of the Bobo property. I know it sounds silly but if she is dead and in the area, buzzards would be attracted to the odor of decaying matter. I didn't call the hotline because my touch screen on my phone has malfunctioned. I had to wait til I got home to send an email. \n\n \n\nMy prayers are with the law enforcement working this case."], ["TN0777", "05-04-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nMy name is Sandra Sue Moody I live @ 1224 Palmer shelter rd,Huntingdon,Tn, on the day Holly Bobo went missing ,I saw a young looking male person,dressed in full camaflouge clothing on Purdy road in huntingdon ,Tn about 2;30-3;00 pm,he was in a Cobolt blue newer model car,he had pulled in ,just off the road to a old house no one lives in,what scared me about him was he was getting out of his car ,walking toward the back of it and when he saw me he had a gun and he just stared @ me and then he racked,(I think is the word, pulling the bullets up in the barrell is what I am trying to say)  his gun not taking his eyes off me I actually thought he was going to fire @ me,it did not look like a shotgun or even a normal rifle to me, later as I was going by the place again I saw another cobolt blue vehicle, like a suv setting in the same place barely pulled in the drive sitting near the road ,did not see a person this time it was also in the afternoon when it was parked there.It may not be anything connected to Holly, but felt like I should let u know about this incident.If u want to see the place u may contact me @ 731 986 9160 or my cell number is 731 535 2152.I know it definatly was the day Holly went missing."], ["TN0779", "05-04-2011", "Open", "Routine", "", "", "FBI SA Art Viveros interviewed Karen Bobo.She advised that a friend told her that Kenneth Johnson,telephone number 731-206-0001 was seen driving his old white station wagon vehicle on logging roads on the day Holly disappeared in the area of the Bobo residence.Kenneth Johnson's address is 681 Swan Johnson Road Darden, TN."], ["TN0623", "05-05-2011", "Closed", "", "", "SA Mark Lewis", "Per FBI this occurred April 13th, 2011 at 3am hours before Holly went missing/Unrelated."], ["TN0776", "05-05-2011", "Closed", "", "", "SA Mark Lewis", "Information related buzzard activity."], ["TN0774", "05-05-2011", "Closed", "", "", "", "Missing person from Cordova,facebook information."], ["TN0768", "05-05-2011", "Closed", "", "", "", "Craiglist/for vehicle description."], ["TN0769", "05-05-2011", "Closed", "", "", "", "Unknown how information is related to case."], ["TN0770", "05-05-2011", "Closed", "", "", "", "Unknown how information is related to case."], ["TN0778", "05-05-2011", "Closed", "", "", "", "Sim Car/cellphone does not belong to Holly Bobo."], ["TN0780", "05-05-2011", "Open", "Routine", "", "", "Email to TBI Website:Part 1 \n\n\n\nGood Evening,\n\n\n\nEarlier tonight, one of my Facebook friends, whom I do not know personally, asked me out of the blue about Holly. Perhaps he was just curious, but I got worried.\n\nI added this young man to my Myspace and Facebook a year or two ago. He seemed like an ok guy at first, but I was always a little leery of him. I don't know why I never deleted him. \n\nWe don't talk much, and when we do, the conversation is usually just \"Hey\" and \"What's up?\" I'll answer, and then he'll usually stop talking because he realized I don't want to talk to him anyway. Tonight was different. He suddenly tried to get information about Holly's disappearance out of me. I love Holly, and I wouldn't want to compromise the investigation, so I just told him I hadn't heard anything lately. He persisted and wanted to know what I'd heard. I just said a couple of things that everyone already knew, and he finally gave up. \n\nHere is the conversation. I copied and pasted this directed from the Facebook I.M. window. Our names are in parenthesis above what we say.\n\n(Billy Yarbrough)\n\n \n\nhi'\n\n\n\n(Robyn Bingham)\n\n \n\nHey \n\n\n\n(Billy Yarbrough)\n\n \n\nwuz up\n\n\n\n(Robyn Bingham)\n\n \n\nNothing, just studying and packing. You?\n\n\n\n(Billy Yarbrough)\n\n \n\nnm sound like fun\n\n \n\nyou hear anything about holly bobo?\n\n\n\n(Robyn Bingham)\n\n \n\nNot recently\n\n\n\n(Billy Yarbrough)\n\n \n\nwhat said about her\n\n\n\n(Robyn Bingham)\n\n \n\nShe's been missing for 3 weeks now.\n\n\n\n(Billy Yarbrough)\n\n \n\nyup\n\nwhat they find out of abouy\n\nt\n\n\n\n(Robyn Bingham)\n\n \n\nThey haven't really found anything.\n\n\n\n(Billy Yarbrough)\n\n \n\nok"], ["TN0791", "05-05-2011", "Open", "Routine", "", "SA Booth / SA Joe Walker", "Sex offender, Jeffery Lee Turner,working at Duke Motors on Corinth Road registered in Gibson County. Living and working in Darden-Dukes Motors. Moved in a trailer about two weeks prior to Bobo's disappearance. Jeffery Lee Turner's violations were against 15 year old males. Turner served entire sentence to not be on paper. Turner got out of prison on April 6. He has been in Dyer with his grandmother until April 15 until she died. Mother, Wanda Hildreth, (618-7937) and Christie Mitchell (995-5487). This trailer was rented on April 7 by Human Services. He had been painting it and working on it for three days now. No furniture in trailer. No transportation. Prepared by SA Booth. Assigned to SA Joe Walker."], ["TN0780", "05-05-2011", "Update", "Routine", "", "", "Email to TBI website Part 2\n\n\n\nHe began to message me at about 9:15 PM and the conversation ended about 10 minutes later. There was a significant pause between his post of \"nm sounds like fun\" and his post of \"you hear anything about holly bobo?\"\n\n\n\nAfter this short conversation he could tell that I had nothing to offer and has stopped messaging me. He has been online ever since, though, and has just recently gotten offline (10:57 PM)\n\nI was concerned and went to look at his profile. I found that almost all of his friends on Facebook were girls and women from various places, and he couldn't possibly know them all personally. His \"about me\" section says \"LOOKING FOR WOMEN\" and \"like looking for pretty women, and havin fun\"\n\nI then went to his Myspace. He had mostly female friends on there as well. Holly was not his friend on either of these sites.\n\nHe is apparently from Michie, TN, which is not too far from the Decatur County."], ["TN0780", "05-05-2011", "Update", "Routine", "", "", "Email to TBI Website:Part 3 \n\nHere is a link to his Facebook: https://www.facebook.com/profile.php?id=100000390475609&sk=info\n\nHere is a link to his Myspace: http://www.myspace.com/basspro1200\n\n\n\nPerhaps I am over-reacting, but even if it's nothing, I didn't want it to go unnoticed. \n\nMy profile picture on Facebook is the Amber Alert Flyer of Holly, so maybe he just thought I'd know of anything new and was curious since there haven't been as many things in the news about the investigation lately, but of course my mind automatically went to \"What if he has her or knows the person who does and he's trying to get info so he'll know if they're on to him?\"\n\n\n\nHe is probably harmless, but it's better to be safe than sorry. I found him to be a bit sketchy and was visibly shaken by this. \n\n\n\nI'm sorry that it has taken me so long to report this. I spoke to my fiancÌ©e and his mother beforehand asking them if I should report it or not, and his mother gave me this email address. It has taken me a long time to compose the email and all its contents into what you have just read.\n\nI really hope this helps. I know Holly personally and have seen the devastation it has caused our community.\n\n\n\nIf you need to contact me, you can contact me from this email (RobLBing@UT.UTM.EDU) or by cell phone (1-731-602-0829). I am at college right now but will be coming home to Lexington, TN, sometime tomorrow. If you cannot reach me by cell phone, you can try my home phone after about 12 tomorrow (1-731-968-9683). Contact via email or cell phone is preferred. \n\n\n\nThank you for your time,\n\nRobyn Bingham"], ["TN0771", "05-05-2011", "Closed", "", "", "", "Subject Interviewed on April 18,2011, from SOR Round Up which was subject's alibi it was verified."], ["TN0617", "05-05-2011", "Closed", "", "", "", "Closed case ref to case number 623."], ["TN0591", "05-05-2011", "Update", "Routine", "", "", "There is hunter by the name of Michael Murphy who was compared to a Murphy who was staying at the Best Western at Hurricane Mills.Murphy,was later identified as Robert Murphy and was not the same guy."], ["TN0756", "05-05-2011", "Closed", "", "", "", "Closed not believed to be related to the case."], ["TN0781", "05-05-2011", "Open", "Routine", "", "post-it note at Parsons CP", "A caller named Chris (lnu) 731-307-8703 (cell) 731-336-0930 called in early in the investigation to advise that someone (law enforcement) had inquired with him on a James Rogers Lunsford pertaining to the fact of whether he \"checked in\" or not on Wednesday (the date Holly disappeared). Apparently Lunsford had given law enforcement Chris' name as an alibi check as to his whereabouts and Chris advised Lunsford was not there that date. It is unknown where the Lunsford lead originated."], ["TN0763", "05-05-2011", "Closed", "", "", "", "Closed AMW information only"], ["TN0289", "05-05-2011", "Closed", "", "", "", "Caller heard a rumor that Holly Bobo was in a abandoned house.Rumor heard through 3 different people."], ["TN0389", "05-05-2011", "Closed", "", "", "", "On 5/05/11 SA Booth and Walker interviewed Jerry Gilbert father to John an Luke Gilbert.Gilbert, believe to be at home the day of Holly's Abduction.SA Booth has notes reference to the interview.Closed lead due to Gilbert believed not to be related."], ["TN0782", "05-05-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Sharon Summer (731) 847-2063 said she has a rental trailer at 3600 Holiday Road, Holiday, TN.  The renter (Wesley Jagger w/m 6') has a white pickup truck but she hasn't seen it in a while. He is behind on the rent and doesn't know if he is still living at this location. He has two kids and a wife. They also have a white SUV. She doesn't have his phone number."], ["TN0783", "05-05-2011", "Open", "Routine", "", "", "Caller stated he works with Randall Hughes at the boot company in Lexington. Hughes lives in Parsons. Caller stated that a few days ago, Hughes made the comment that he 'knows where Holly is åÐ somewhere between Hwy 641 and I40.'Caller stated Hughes received a phone call today from a family member that informed him that TBI was at his house looking for him today. Caller stated that this information made Hughes very nervous and immediately started texting someone. Hughes also said that he would not be going home today with TBI looking for him. Caller wishes to remain anonymous. Caller ID registered 731.602.0768."], ["TN0767", "05-06-2011", "Update", "Routine", "", "SA Lewis", "Lexington PD spoke to contractors and searched apartments. Obtained no information relating to the Hole Bobo case."], ["TN0767", "05-06-2011", "Closed", "", "", "SA Lewis", "CLOSED Per SA MArk Lewis. Lead not believed to be realated to Holly Bobo."], ["TN0780", "05-06-2011", "Closed", "", "", "SA Lewis", "CLOSED:FACEBOOK Lead"], ["TN0784", "05-06-2011", "Open", "Routine", "", "TBI Find Line", "Leslie called in on the TBI Find Line and advised that on I-40 West before the\n\n150 mile marker,she noticed a pair of lace up hunting boots on the right side of the road.Her phone number 731-549-6576."], ["TN0782", "05-06-2011", "Update", "Routine", "", "SA Lewis", "Subject is an over the road trucker. His family still lives at this location."], ["TN0782", "05-06-2011", "Closed", "", "", "SA Lewis", "CLOSED Per SA Lewis. Inormation ONLY"], ["TN0783", "05-06-2011", "Update", "Routine", "", "SA Lewis", "Subject interviewd on today's date by FBI SA West Mayes. Verified that subject was at work 7am to 11am on date of abduction. Checked out for lunch at 11 am"], ["TN0783", "05-06-2011", "Closed", "", "", "SA Lewis", "Subject not believed to be involved.CLOSED per Sa Lewis"], ["TN0658", "05-06-2011", "Closed", "", "", "SA Lewis", "CLOSED per SA Lewis. Refernce incident #783"], ["TN0254", "05-06-2011", "Closed", "", "", "SA Lewis", "CLOSED Per SA Lewis. Refernce incident #389."], ["TN0785", "05-06-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Michelle Hickerson (731)693-4093 called about a white Rodeo V6 SUV sitting in a field in Gibson county. Ms. Hickerson called the Gibson County Sheriff Office to let them know about a vehicle that has been sitting there for over a week. She is not sure if Gibson County SO took a look at the truck. Ms. Hickerson decided to take a look herself. Ms. Hickerson said, the truck has a large black trash bag, hard drive, and empty car charger boxes in the seat. Ms. Hickerson said, there are no tags on the truck. The directions to the truck are as follows: from the middle of Trenton, Tn, take a right on Bradford Highway to the end of the road which is 45 Bypass, then make a left towards Martin and go approximately two miles and the truck is on the right side in a field."], ["TN0785", "05-06-2011", "Update", "Routine", "", "1-731-692-3714", "Gibson County Sheriffs office checked out the vehicle in the field. The tag number is 753JZK which returns to a Elica Owenby from Murray, Ky. The officer said, he has received a lot of calls about the vehicle. The officer stated it has been parked in the field for about a month. The owner had problems with the drive shaft and left it parked at this location. The officer told the owner of the vehicle she could leave it there as long as the property owner didn't ask her to remove it."], ["TN0786", "05-06-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller David Harrelston (731)549-0234 said, a friend of his talked to a girl who lives in Lexington, TN and she said, every time I discuss the Holly Bobo case around Ben Steele who lives in Lexington, he starts to sweat and leaves the room. The girl wants to remain anonymous and said he is friends with the Dodd boy."], ["TN0787", "05-07-2011", "Open", "Routine", "", "800 TBI FIND", "Kathleen Marvin called to advise the name David Hansen popped into her head while she was watching Good Morning America this morning. She feels the name should be checked in relation to Holly's disappearance."], ["TN0787", "05-07-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0788", "05-07-2011", "Open", "Routine", "", "Email from TIES Operator Norma Raleigh", "Call taken by TIES Operator Norma Raleigh\n\nA Jerry Pratt 731 423 0987 just called in on the console line rolled in from Jackson.\n\n \n\nhe states the following:\n\n \n\nhe was fishing Friday May 6th on dogwood lake and around 1400 hours he noticed a \n\nvery large amount of scavenger birds(buzzards) circling in a specific area. \n\non dogwood lake. and does realize that this could be a deer but thought that he may need to call this in anyway because of Holly and the location- \n\n \n\n \n\nhe states location is :\n\n \n\nDogwood lake upper end toward the shallow on the right side on the ridge area. that if they are still there you will have no trouble finding this location there is that many birds.\n\n \n\nstating that this area is the east side of the Natchez trace park near Chesterfield or Darden\n\nand as the crow fly's Holly Bobo's home. \n\n \n\nMr Pratt also stated that if anyone has additional Questions to please call him and he would be happy to answer the phone number is a land line for his home.\n\n \n\nSpoke to SAC John Mehr on this and was directed to send this email-"], ["TN0823", "05-07-2011", "Open", "Routine", "", "phone call", "Alan Maness called and advised that he had foung a plastic glove like the hones used in hospitals and believes it could be related to Holly's disapperance. He called Decatur Co SO and 911 to advise as well. He lives at 2321 hwy 641 S in Parsons (731) 847-7014."], ["TN0824", "05-07-2011", "Open", "Routine", "", "phone call", "A gray van with UT on the side was seen on Brush Trail with a stated goverment tag about 9:30 or 10:00 on 5/6/11. Caller is a Ricky Scott (731) 845-4438. He advised two subjects were in the van and that the female waved at him when he pulled out his phone to make a phone call."], ["TN0789", "05-07-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website!\n\n***************************************************************\n\nThis email was sent via http://www.AnonymousSpeech.com,  \n\nthe worlds leading <a href=http://www.anonymousspeech.com>anonymous email</a> provider.\n\nReport Abuse: http://www.anonymousspeech.com/contact.aspx \n\nStop receiving emails from AnonymousSpeech.com: http://www.anonymousspeech.com/bannedemail.aspx?email=tipstotbi@tn.gov \n\n***************************************************************\n\n\n\nIn H.B. case:Prove Brent Ellis to be innocent or guilty for sure. \n\n(this weekend is crucial > Sunday?)\n\n\n\nAMG82"], ["TN0790", "05-08-2011", "Open", "Routine", "", "Telephone", "Caller Stanley Houston, 731-798-9292, stated he ran into Gary Stanfill Jr today. Mr. Stanfill is from Lexington, Tn and was hauling a horse trailer with a duelly truck, wears camo. Mr Stanfill mentioned Holly Bobo's kidnapping as if \"he knew something about it or knows the person who did it\". It was difficult to completely undertand the caller because he seemed excited. Requested that he spell the name of the subject slowly."], ["TN0781", "05-09-2011", "Update", "Routine", "", "ASAC Mark Lewis", "Lexington PD, Robbie McCready, interviewed Sex Offender, James Rogers Lunsford, who stated on April 13 was at home with his mother who confirmed this to Officer McCready. Lundsford stated that he met with Probabtion Officer on the Thursday after Holly disappeared."], ["TN0793", "05-09-2011", "Open", "Routine", "SA Joe Walker", "SA Joe Walker - fax", "SA Joe Walker received a call from Natalie Bobo on Sunday night at approximately 8:30pm. Natalie gave her phone to a family member she relayed the following information: Karen Bobo had told them to be on the lookout for a green Ford Taurus because one had been spotted near their house prior to Holly's disappearance. This family member said they discovered one matching that description at 2426 Hornyhead Cr. Rd. They were unable to get a tag number from the vehicle. They said there were numerous vehicles there. They said by the time they got turned around and got back to the residence the green car was gone. They said a van being driven by a white female with a black male passenger was pulling out. There was not a tag on this vehicle. The family member said they drove by a couple of more times and a car came out of the driveway and followed them. The tag number on this vehicle was 575 CBM, a Decatur County tag. Assigned to SA Joe Walker for follow-up"], ["TN0792", "05-09-2011", "Open", "Routine", "", "SA Joe Walker - fax", "On Friday, May 6, 2011, SA Walker spoke with Natalie Bobo with the intention to find out where she worked and where she lived in Miami at the strip club. The address of the townhouse where all the girls lived was 90 SW Third, Miami FL 33130. Natalie could not remember the name of the club. Natalie said the tag of the vehicle who picked her up at the Ft Lauderdale airport was ALU-8924. Some of those working at the club are J. Will 305-300-1903 and Chrissy (Misty) 305-879-7944. From what Natalie described to me during an earlier interview, the company running the club and housing the girls sounds like organized crime with prostitution with possible human trafficking. When Natalie left she took a Korean girl with her. It could be (V) Holly Bobo's disappearance is linked to Natalie's and the Korean girl's leaving. Assigned to FBI for follow-up."], ["TN0789", "05-09-2011", "Closed", "", "", "ASAC Lewis", "close per ASAC Mark Lewis - email lead"], ["TN0785", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - not related to investigation"], ["TN0786", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - Dodd intel"], ["TN0784", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - Information only"], ["TN0788", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - buzzard activity"], ["TN0757", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - area already searched"], ["TN0791", "05-09-2011", "Closed", "", "", "ASAC Lewis", "Close per ASAC Mark Lewis - interview complete"], ["TN0755", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis - Dodd intel"], ["TN0795", "05-09-2011", "Open", "Routine", "", "ASAC Mark Lewis - fax", "On 05/09/11, SA R. Faulkner spoke with Capt. Jim Webb of Dickson Co. SO. He had checked out Shannon David Williams, sex offender, and Shannon Williams, coon hunter, are two different people. Shannon David Williams, sex offender, is a truck driver and his probation officer said he was out on the road on April 13."], ["TN0794", "05-09-2011", "Open", "Routine", "", "ASAC Mark Lewis - fax", "On 05/05/11, SA R. Faulkner spoke with Dee Little at 423-304-0038. She stated that her and her husband, Allen Little, were at the coon hunt showing dogs. She and her husband had heard about Holly Bobo being missing and they looked at her picture on the internet. They do not remember seeing her at the coon hunt. They were driving a gray Hummer and do not know anyone else who was there with Hamilton County tags. reference TN0011\n\nAddress: 611 Spring Valley Lane, Chattanooga TN  37415."], ["TN0739", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "All Dement workers were accounted for. No further action at this time. Event closed by SA Faulkner."], ["TN0748", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis - intel/septic tank"], ["TN0794", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis. Does not fit profile. Reference TN0011"], ["TN0795", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis. The Shannon Williams at the coon hunt is not the same person as Sex Offender, Shannon David Williams."], ["TN0011", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close ASAC Mark Lewis - reference TN0794 and TN0795"], ["TN0591", "05-09-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis. FBI SA Art Viveros will pursue this lead. Reference: coon hunters."], ["TN0796", "05-09-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Glenn Jarvis (252) 658-0010 said, Holly spoke to him in his mind and told him what happened. Mr. Jarvis stated two men took Holly 6.3 miles Southeast of her home and raped her near a big tree, then strangled her. Later, they burned her clothes and put chicken blood on her and possibly fed her to an alligator. Mr. Jarvis also asked me if we had any swamps in the area. Mr. Jarvis said, he knows the names of the two men who did this, Steve Justice and John Hughes. They were both wearing white t-shirts at the time. The vehicle they drove was a white 4-door truck with Georgia tag #Y5H672."], ["TN0796", "05-10-2011", "Closed", "", "", "", "Psychic Lead - \n\n\n\nTag does not exist in Georgia"], ["TN0781", "05-10-2011", "Closed", "", "", "ASAC Mark Lewis", "Close per ASAC Mark Lewis. Information only Henderson County sex offender."], ["TN0537", "05-10-2011", "Closed", "", "", "By phone from ASAC M Lewis", "No more activity/Believe unrelated"], ["TN0797", "05-10-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Joann Andrews (931)593-3493 advised a K. White that lives at 1853 Jeanette Holiday Road, Parsons may be someone we need to talk to. Ms. Andrews said, he is 6', 200lbs, around 20 yoa, very quite and lives with his parents. Mr. Andrews said, she saw him at the Food Giant grocery store in Parsons and he was buying 5 or 6 cans of soup on May 1, 2011. She thought it was strange that he didn't go in the direction of his home when he left the grocery store. Ms. Andrews decided to follow him. Mr. White took Hwy 69 from the grocery store parking lot, turned left at the red light onto Hwy 412 E. and went 3 1/2 miles and turned to the right just before the Pine Tree Inn. Ms. Andrews lost contact with him at this location. Mr. White drives a newer blue Ford Fusion. Ms. Andrews mentioned Holly's lunchbox being found between Gooch Road and Horny Road in Parsons. Ms. Andrews said, Mr. White lives between these two roads. Ms. Andrews also mentioned Mr. White attended the same college with Holly."], ["TN0779", "05-11-2011", "Update", "Routine", "", "", "Special Agent Cardone and Investigator Ricky Inman attempted to locate Johnson at 5003 Crawford School Road (likely address), and 838 Campground Rd, Decaturville, TN. Negative results, Although items at 5003 Crawford School Road, Decaturville, indicated Johnson may live there. Attempted to locate at possible employer, Keeton's Cabinets, Inc., Decaturville, Tn åÐ negative. He hasn't worked there in several years. Johnson may be logging according to prior employer. Attempt to locate Johnson in the evening."], ["TN0779", "05-11-2011", "Closed", "", "", "", "SA Joe Walker spoke with Kenneth Johnson at his residence of 5003 Crawford School Road, Scotts Hill. Johnson said he observed the white station wagon in the area three to four weeks prior to Holly's disappearance. The station wagon was driven by Dewayne Lance, a local thief. Johnson was cutting timber in the area at the time. On the day of Holly's disappearance, Johnson was cutting timber with Ricky Mills in Lexington near the Moose Lodge. Mills was contacted at 731-220-0254 and he confirmed this."], ["TN0735", "05-11-2011", "Update", "Routine", "", "", "Per SA Mark Reynolds, on 5/10/2011, video only maintained for one week. Showed photo of victim, no one recognized her as being in the store."], ["TN0750", "05-11-2011", "Closed", "", "", "", "SA Joe Walker met Cody Wood in Lexington on 05/05/2011. Wood said he met Holly Bobo when she was going to Jackson State. Wood said he never saw Holly in the Wal-Mart parking lot. Wood said there were two groups that hung out there and she may be in the other group. Wood stated on April 13 he was a Physical Science II lab at Jackson State. Class meets at 8AM the teacher is Casey Meeks. I contacted Meeks and he checked his role and confirmed Wood was in class that day. The class is on the main campus in Jackson, Tennessee."], ["TN0798", "05-11-2011", "Open", "Routine", "", "Telephone", "Caller Henry Bennett, 802-989-6924 stated that he feels that Holly was raped and murdered shortly after she was lead into the woods. He feels that her body was missed when the search party walked by and possibly a red-headed person walked very close to where she was. Need to look at clothing that might be hers and she might be near a shed or outhouse. Should look into serial killers."], ["TN0798", "05-11-2011", "Closed", "", "", "", "Psychic lead"], ["TN0799", "05-11-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @2031pm from a Barbara Singleton 731 415-5368 stating she was horseback riding in Natchez Trace State Park near Parsons and found a Montgomery Alabama Shell Station receipt dated 5/09/11, invoice #053196, debit card #744646, date stamped 16:55:12 pm, store phone #333 270-1523 on the riding trail that had not been there when they first rode by. This is not normal for the riding trail and she thought this may has some bearing on the Bobo case. She works for TDOT and will take the receipt to work with her should anyone wish to retrieve the receipt."], ["TN0735", "05-12-2011", "Closed", "", "", "", ""], ["TN0580", "05-12-2011", "Closed", "", "", "", "SA Heidi White on 05/11/11,verified no camera across the street and no one at the truck stop remembers seeing anyone that look like Holly Bobo."], ["TN0583", "05-12-2011", "Closed", "", "", "", "On 05/11/11 SA Bishop,SGT Langsford Dyersburg PD verified subject was at fairgrounds participating in search.Reason for subject being jamilar with the area is has gone Dear hunting here before.Per SA Bishop subject was at work on 04/13/2011.Verified by Bishop."], ["TN0800", "05-12-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Lynn Walls (731) 617-0386 said, she lives down the street from the Bobo family. Ms. Walls saw a suspicious vehicle driving down the street every morning around 7:00 a.m. for four weeks towards the Bobo residence before Holly Bobo disappeared. The morning she disappeared Ms. Walls didn't see the vehicle and hasn't seen the vehicle again. The vehicle description is a green Ford mustang with tag# 552JJS. The tag# returns to a Linda Dyer at 20980 Highway 412 E, Lexington, TN. The driver was a white male with long brown hair in a ponytail and appeared to be in his late 20's or early 30'S."], ["TN0801", "05-12-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Crystal Graham (785)761-7082 advised TBI to check out Facebook page \"Holly Bobo Search and Info\"."], ["TN0490", "05-12-2011", "Closed", "", "SA Kira Hayden", "", "This agent contacted James Tucker and learned this incident happend in Lawrence county not in Centerville.Ispoke with Lt. Nathan niece and he informed him Investigator robert Denton was handling this case.I spoke with Investigator Denton and he told him he was going to show the victim Kelly Carroll a photo line up containing Vance Staggs picture.Investigator Denton later informed me that Kelly Carroll could not identify Staggs as the person who attempted to assault her.Investigator Denton stated he would continue working on this and if he come with anything he would contact me.Because the victim was unalbe to identify Staggs as her attacker and we dont know who it isthis lead should be closed."], ["TN0801", "05-12-2011", "Update", "Routine", "", "tbi-find", "Vicki Bivens called and reported the offense pages on this site. Vicki stated that Will Ratliff is a name on that Facebook page (she thinks page belongs to him). Vicki can be reached at 731-847-9225."], ["TN0802", "05-12-2011", "Open", "Routine", "", "tbi find", "Caller Barbara Millhorn can be reached at 731-616-2366. Barbara stated that the father of her child (father is Anthony Kothe) posted on his Facebook page that he was leaving the state and was going to Cuba, KS."], ["TN0803", "05-13-2011", "Open", "Routine", "", "800-TBI-FIND", "Two complainants have called the TBI FIND line about over hearing a conversation at the Best One Tire center in Jackson, Tennessee this morning (5/13/2011). The Complainant advised that a driver of a gravel truck for Delta Construction stated he had seen a girl resembling Holly in a 97-99 model white Grand Am. The female appeared to have been beaten and appeared drugged. The driver advised he saw this at the end of last week first of this week on Airways Blvd in Jackson. The drive of the car was a darker complected male wearing camouflage pants. The first complainant is Stan Doyle 731-441-0433 and the second is Danny Scott at 731-616-5770."], ["TN0804", "05-13-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call @ 1710pm from a Susan Robinson 731 427-4057 stating she has a vision about 'thick, thick walls, like in an old ice house'is were Holly is being kept and that she still feels that she is alive. This vision has been haunting her since Holly went missing and now feels it time to reveal the vision."], ["TN0805", "05-14-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call from Tracie Rosen 731 847-4315 stating that TBI should monitor the following FaceBook Page \"Holly Bobo Search Info\". The caller states that who ever is using that site is putting some very strange comments on the page."], ["TN0806", "05-14-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call from a male named Eric, 731 608-4256 who states he was driving home from work on the 10th of May around 4:30am heading South on Hwy 22 @ 100 crossing when he came across a truck traveling in the same direction but at a slown rate of speed (35-40mph). He travels this road frequently from work and pretty much knows the traffic pattern and this car was out of place. It was a Drk/Blu/Chevy/S10/dark windows/Decatur County tags/didn't get license #. The truck was being driven by a very large white/male, who gave that look that you caught me with my hand in the cookie jar type stare. Eric states this was very odd because normally only big rigs are on that road during that time of morning and this made the S10 somewhat out of place. He noticed no one else in the truck."], ["TN0816", "05-15-2011", "Open", "Routine", "", "SA Brent Booth", "Karen Bobo (mother of victim) stated Scott Wyatt, an EMS person and dispatcher for Decatur County has moved in with Drew Scott as of 4/13/2011 and has been exhibiting odd behavior towards Drew Scott."], ["TN0803", "05-16-2011", "Update", "Routine", "", "", "On 5/13/11, Jackson Police Department was notified on an attempt to locate vehicles. On 5/16/11, ASAC Mark Lewis contacted both callers who could not provide anymore information."], ["TN0804", "05-16-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0805", "05-16-2011", "Closed", "", "", "", "Facebook lead"], ["TN0806", "05-16-2011", "Closed", "", "", "", "Vehicle description/May 10, 2011"], ["TN0577", "05-17-2011", "Closed", "", "SA Joe Upton - FBI", "", "Per SA Dicus. All have been contacted."], ["TN0801", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0802", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0797", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0799", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0800", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0673", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0764", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0790", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0491", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0037", "05-17-2011", "Update", "Routine", "", "", "To be assigned to Jackson FBI Agents, SA Art Verveos"], ["TN0803", "05-17-2011", "Closed", "", "", "", "Close - no further contact - vehicle description."], ["TN0803", "05-17-2011", "Update", "Routine", "", "", "on 5-17-11, SA Lewis spoke with Delta gravel truck driver Robert Morin, who advised he was the one who saw a girl fitting the description of Holly Bobo in Jackson, TN. Morin sated this was about 3 days after she went missing, in the area of State St and Hwy 45 by-pass N. The blonde w/f was with a mixed male in a 2000 2d grand am, madison co tags. Morin has not seen this vehicle nor the two individuals since. Morin described this girl as beaten up and stoned. Morin may be reached at 830-299-2650, or Delta Construction in Jackson, TN. or his brother George Morin 731-515-2144."], ["TN0807", "05-17-2011", "Open", "Routine", "", "Telephone", "Caller, Joan Harris 707-4044 (called from 615-891-7070) stated she saw a woman on April 13th that looked like Holly Bobo in the Kroger on Dickson Road in Nashville. The reason she noticed her is because she looked drugged. The man with her was a tall man around 6'1\". They were there around 1810."], ["TN0808", "05-18-2011", "Open", "Routine", "", "Phone Call", "caller stated she felt that the friends of Blake Barnett need to be checked out since he is a \"suspect\".  The friends name's are Holden Work, Josh Atchinson, and Jonathan Holmes.  Caller state that she was the mother of one of Holly's ex-boyfriends (Lee) and Josh actually beat her son up for Blake.  Caller stated she did not have a good feeling about any of these boys."], ["TN0817", "05-18-2011", "Open", "Routine", "", "SA Brent Booth", "Friends of Karen Bobo were in the area of Box Road and noticed at 115 Box Rd, lots of buzzards and dogs. House was abandoned and had a dead smell."], ["TN0809", "05-18-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website\n\nI know that I have sent a few tips. Now that more information has been coming to me more completely, I feel a sincerely huge case of urgency to be sure that Pastor Don Franks and the Corinth Baptist Church, where the hub has been for the searching for the Holly Bobo case, along with the surrounding property and the properties of he and his son be searched. If it has already been searched, please disregard this email. For reasons, which I can give you details, should you request them, this is really urgent. I think that this is going to be where you will find Holly and close this case based on the \"relationship\" between this case and the pastor and his son, which is sad.\n\n\n\n\n\nThanks for all that you do! I know that you run around looking at any tips that you get as fast as you can and that is perfectly wonderful of you. We all want closure for the Bobos. Of course, if Holly is still alive, which I know the statistics are not in favor of, it would be truly a wonderful miracle and I would personally like to fly out there to meet her.\n\n\n\n\n\nThanks again for all of your work! You may contact me at the phone number below if you need to. \n\n\n\n\n\nNatasha Call\n\n\n\n~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~\n\nNatasha Call\n\n(801) 915-9130\n\nInspired Lemonade\n\n~The Finest Creative PR~\n\nwww.inspiredlemonade.com\n\nnatasha@inspiredlemonade.com"], ["TN0809", "05-18-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0801", "05-19-2011", "Update", "Routine", "", "", "SA Scott B. Lawson: Called number for Vicki Bivens and the person who answered hung up on me. Follow up needed, recall Vicki Bivens."], ["TN0793", "05-19-2011", "Update", "Routine", "SA Joe Walker", "Email", "Assigned to SA Joe Walker"], ["TN0777", "05-19-2011", "Update", "Routine", "", "Email", "Assigned to Carroll Co So David Bunn checking lead."], ["TN0792", "05-19-2011", "Update", "Routine", "", "Email", "Assigned to FBI, SA Art Ververos."], ["TN0762", "05-19-2011", "Update", "Routine", "SA Joe Walker", "Email", "Assigned to SA Joe Walker."], ["TN0579", "05-19-2011", "Update", "Routine", "SA Ronnie Faulkner", "Email", "Assigned to SA Ronnie Faulkner."], ["TN0790", "05-19-2011", "Closed", "", "", "", "SA Scott B. Lawson:  Mr. Houston has obvious mental problems.  Not believed to be related to case."], ["TN0802", "05-19-2011", "Update", "Routine", "", "", "SA Scott B. Lawson: Barbara Millhorn, DOB: 11-18-1984, home address 2245 Law Rd. Lexington, TN. Cell# 731-616-2366, was interviewed telephonically by FBI SA Scott B. Lawson regarding the disappearance of Holly BoBo.  After being advised as to the identity of the interviewing agent and to the nature of the interview, Millhorn provided the following information: Millhorn has a child with Anthony Cothe.  The two do no get along.  On the date of BoBo's disappearance Cothe told Millhorn that BoBo's body could be found at the sawmill on Horny Head Rd., Parsons, TN.  Millhorn became upset and told Cothe not to speak of things he did not know.  In a day or two after the disappearance, Cothe abruptly left Parsons, TN and moved to Cuba, Kansas.  In the following weeks, Cothe came back to TN once and quickly returned to Cuba, Kansas.  Cothe worked for Stanley Tubbs owner of Tubbs Sawmill.  Cothe's mother is a live-in-girlfriend of Tubbs.  Tubbs has two sons that live with him, Cory Tubbs and John Tubbs.  Tubbs is rational, but Cory and John are crazy and addicted to drugs according to Millhorn.  The location of the sawmill is in close proximity to the residence of BoBo.  Millhorn provided the following description of Cothe.  Cothe has a charming front, but is very angry and violent when his real personality is shown.  Cothe's DOB: 08-16-1984 and uses cell # 402-363-9547.  Millhorn could not provide an address for Cothe since he moved to Kansas.  When in Parsons, TN Cothe lived with this mother and Tubbs on Horny Head Rd. near the Tubbs sawmill. \n\nRecommend follow up by interviewing Anthony Cothe.  Send lead to Kansas to interview Anthony Cothe."], ["TN0810", "05-19-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Jeff Andrews(615)924-5380 advised he saw a white male wearing all camouflage clothing and a camo backpack around a month ago. He was at a Phillip 66 gas station located at Briley Parkway/I-40 in Nashville, TN. Mr. Andrews said, the man was asking for money from the store clerks. Then, he asked where all the cars and ladies were coming from. He was told there was Kaplan Career Institute at the end of the road. The address for Kaplan is 750 Envious Lane, Nashville, TN."], ["TN0811", "05-20-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nTo The Investigation Unit, \n\nI have been getting thoughts about this case, actually very strong feeling about this Holly Bobo Case. \n\nI have to tell you that when this happens I am usually right on. I feel that she is in this field/forest\n\nwhere she was lead into and that this definitely was a planned crime. I feel that she is buried in this forest. and \n\nthat you will need to search this area with cadevor dogs because the grave site is very well camoflaged,, \n\nvery well hidden, I keep seeing a grave with leaves scattered all over the top of the grave and it can't be \n\ndetected without scent dogs or probs.. because it really is covered up very well.\n\nI am in California and in no way have any clues other than my intuitative feelings like I have had on other\n\ncases, and this feeling is very strong. \n\nPlease go in and search this area and yes, I feel that the person you are looking for is someone that has \n\nplanned this, but I don't see the prep,, I just see the area in my mind's eye and it is in the location she \n\nwas taken into.\n\nHope this helps find her.\n\nKathy Patterson \n\nCalifornia"], ["TN0811", "05-20-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0812", "05-20-2011", "Open", "Routine", "", "Email to TBI Website", "Email sent to TBI Website\n\nHello,\n\nI have been wondering about this case.\n\nIn my past I have had occurrences of \n\npsychic premonitions and messages, and\n\nI just wanted to let you know that this\n\nmorning I saw a list with the name Travis\n\non it it was the 4th name down on the \n\nlist. I also heard \"Dean Foods\" I \n\ndon't know if this will help you or \n\nnot. Good luck with finding her.\n\n\n\n\n\nChris LIght"], ["TN0812", "05-20-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0813", "05-20-2011", "Open", "Routine", "", "Telephone", "Caller, Bronson 731-549-0982 wants to remain anonymous. He stated that there is a guy who he would see every day or so at various gas stations in the early morning (0500-0530) but has not seen him after April 13th. The caller does not know the man's name but he drives a 2009 or 2010 Dodge Ram truck. The caller stated that he saw the man again this last Monday for the first time since it all happened in April with his truck windows now tinted. The caller stated that the man works for the state and \"he is not all there\". After the caller heard that something had been found near a state building he remembered this odd behavior."], ["TN0814", "05-21-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone called @ 12:30pm from Kristian 540 303-8180 about a physic web site (www.issue.cc/complaint/holly-bobo/physic), from a person (kalhlla). This person is posting ideas and what he feels is Holly's location. The caller was upset about the posting and replied that she was calling the TBI Tip line."], ["TN0815", "05-22-2011", "Open", "Routine", "", "phone call", "Caller, Kathy Turner (731) 602-0707 stated that she owns a resturant (Meo Mio's Cajun Seafood) in Decaturville and last night (5/21/11) a strange (creepy) guy came in.  Kathy stated his name is Ricky Mattison and he told her he was a teacher at a local college in Parsons. Kathy stated he was a computre tech and he brought her a new monitor for her computer system without her asking for it. Kathy stated that while he was at the resturant he was stalking one of the servers who resembles Holly and she had to run him out of the resturant. Kathy stated Mattison lives in Darden and he was just a very stange fellow and since he was a teacher at the local college he may have known Holly. His DL is 092243699 with an address of 120 DOYLE REEVES RD."], ["TN0816", "05-23-2011", "Closed", "", "", "SA Brent Booth", "Per SA Terry Dycus on 5/21/11, it was confirmed Scott Wyatt moved in with Drew Scott a week after the abduction. Scott is a good friend of Drew's. According to Drew, Scott was dispatching at 911 that day and he hasn't seen anything weird. Confirmed at EMS at 7:00 on 126 Holliday Rd."], ["TN0817", "05-23-2011", "Closed", "", "", "SA Brent Booth", "Per Scott Cagle with the Decatur Co Sheriff's office, 115 Box Road does not exist in the Decatur County E911 database. Checked the area and all residences that appeared to be abandoned and found nothing out of the ordinary.A dead dog was found about half way down on Box Road."], ["TN0818", "05-23-2011", "Open", "Routine", "", "Telephone", "Caller, Lisa 731-968-1908, stated that her relative mentioned that Ben Steele has been acting weird since the Holly Bobo kidnapping. He did not come into work at Auto Zone in Lexington the night of the 13th of April. She state that he has been covered for several times at work."], ["TN0810", "05-24-2011", "Closed", "", "", "", "Close per ASAC Mark Lewis. Does not appear to be related to Bobo case."], ["TN0814", "05-24-2011", "Closed", "", "", "", "Close per ASAC Mark Lewis. Psychic lead."], ["TN0819", "05-26-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call from TBI TIC about a phone call they rcvd @1713pm from a truck driver Mack Johnson 678 758-5614. He stated that about 3 wks to 1 mo ago he and his co-driver were coming from Mesquite TX & remembers seeing a female at a Pilot, Love or T/A truck stop btwn Nashville & Knoxville. The girl hand a pair of sandals in her hands, her shirt was pink and had a spill on it w/short sleeves, light flare leg short jeans, a purse over her shoulder, needed a shower, shoulder length hair that needed brushing and smoking a cigarette. She got into a bob-tail type tractor w/no trailer."], ["TN0818", "05-27-2011", "Closed", "", "", "e-mail", "Close lead related to Dodd intel"], ["TN0813", "05-27-2011", "Update", "Routine", "", "e-mail", "assigned to SA Terry Dicus"], ["TN0815", "05-27-2011", "Update", "Routine", "", "e-mail", "assigned to SA Terry Dicus"], ["TN0815", "05-27-2011", "Closed", "", "", "SA Dicus", "Closed per SA Dicus. No relation to case."], ["TN0820", "05-27-2011", "Open", "Routine", "", "NCMEC Lead 507590", "Caller Donny McCoy stated he works at Motel 6 at 1776 Burning Tree Road Columbia, S.C. Caller stated seeing a female that matched the description of Holly Bobo. There were also several other females at the location that made copies of the Holly Bobo poster. Females were seen leaving in a white Dodge Neon."], ["TN0820", "05-27-2011", "Update", "Routine", "", "Phone by SA Dicus", "SA Dicus spoke to the Seargant assigned to the case. The 17 year old female had checked out of the room and the others left the location."], ["TN0820", "05-27-2011", "Closed", "", "", "phone", "CLOSE Per SA Dicus"], ["TN0821", "05-31-2011", "Open", "Routine", "", "email", "My name is Ashley Mays. I live in Scotts Hill, Tennessee. I go to Scotts Hill High School. I've known in Holly my whole life and I'd like to share a few tips with you.\n\n\n\n\n\n1. Jack Johnson\n\n    Here is his Facebook link: http://www.facebook.com/profile.php?id=1253351525\n\n    My reasoning behind him maybe having something to do with it is because he was recently questioned at Scotts Hill High School for touching girls inappropriately and sexual           references.\n\n\n\n\n\n2. Bobby Pope\n\n    Here is his Facebook link: http://www.facebook.com/profile.php?id=100000518212743\n\n    My reasoning behind him is because at church a while back, he would force girls to give him hugs and he would always flirt with younger girls.\n\n\n\n\n\n3. Jonathan Dodd\n\n    Here is his Facebook link: http://www.facebook.com/profile.php?id=1029921104\n\n    My reasoning behind him is because he is capable of a kidnapping and he is  a compulsive liar. He can look you in the eye and lie to you. And his teachers have always said that     they always thought he would grow up to be a serial killer."], ["TN0822", "05-31-2011", "Open", "Routine", "", "email", "This came to me from a concerned member in Parsons as I am an administrator on a Facebook page for Holly Bobo. We get a lot of garbage that I would never send in, but this seemed like something that should be passed on. \n\n\n\n\n\nBradley Dodd's house on Wilkinstown Rd. has a trailer behind it that no one has lived in or anything for years and we have noticed that a couple of weeks ago there was a gray car there and then we started noticing a light on at night at one end of the trailor. also in the past month there has been a boat, two fourwheelers, and many diferent veichles in the driveway that havent ever been there before\n\n\n\n\n\n\n\n\n\nThank you for all you are doing to\n\nBring Holly Home to her Family\n\nMichelle Crosslin"], ["TN0823", "05-31-2011", "Closed", "", "", "SA Ferguson", "Intel only"], ["TN0824", "05-31-2011", "Closed", "", "", "SA Ferguson", "intel only"], ["TN0825", "05-31-2011", "Open", "Routine", "", "phone call", "Received a call from Janice Flinchum (662) 551-4298. She stated that she heard agents had been lookin for a woman by the name of Erica Warnock aka Erica Young. Caller happens to be a distant relative and she stated that Warnock was sent to the mental hospital in Jackson. Caller stated she heard that another relative said Warnock was out about a month ago claining to be on a furlough or leave. Caller stated she believed that was the same time that Holly went missing."], ["TN0825", "05-31-2011", "Closed", "", "", "SA Ferguson", "Warnock is not a suspect and there are 12 Erica Young's listed in the CJ Portal"], ["TN0826", "05-31-2011", "Open", "Routine", "", "phone call", "Caller stated she prayed all day long for Holly and that night the Lord showed her an address at 882 Mclin St Humbolt, TN"], ["TN0826", "05-31-2011", "Closed", "", "", "SA Ferguson", "Closed-psychic Bad address-there is not 882 Mclin st in Humbolt"], ["TN0827", "05-31-2011", "Open", "Routine", "", "email", "Kyla Whitsitt sent an email regarding a cave-Its on hwy 641 between Jeanette Holliday Rd and the Double D's. Kyla can be reached at 731-549-4325"], ["TN0827", "05-31-2011", "Closed", "", "", "SA Ferguson", "Cave has been searched-lead being closed with negative contact"], ["TN0828", "05-31-2011", "Open", "Routine", "", "SA Ferguson", "John Ebeling-I am a shamanistic psychic. I know how people are though so I'll be brief. What i am gettig is that the abductor is the son of a \"friend\" of Holly's father. The last name I am gettin is CELEZ. The first name is TODD."], ["TN0828", "05-31-2011", "Closed", "", "", "Sa Ferguson", "Psychic lead"], ["TN0829", "05-31-2011", "Open", "Routine", "", "email", "I am an Independent Investigative Journalist out of the Dallas Texas area.  For the past two months I have been a regular guest on the National Radio show \"The Power Hour\" hosted by Joyce Riley  (http://thepowerhour.com). You can listen to my appearances via this link\n\n\n\nI was originally asked to be a guest on the show, due to my work investigating the Rep. Giffords event.  Sheriff Mack is a close friend of the show and due to his friendship with Judge John Roll, I focused my initial investigation on his assassinations.  The details of that investigation, are still being organized and we will be presenting our finding to the proper authorities when ready.  This investigation has taken me on a wild and sometimes surreal journey.  Along this journey I have discovered information pertaining not just to the Rep Giffords (FSE) but information on the missing Utah woman Susan Powell and the Missing Holly Bobo. All of these events have  a common link.\n\n\n\nI have located Bobo, and posted some of my finding on the website http://wellaware1.com/bobo.htm.  \n\n\n\nI have also forwarded this information to the Local Dallas FBI branch, Local Law enforcement, the Governor of your state, and certain media outlets that I can trust.\n\n\n\nFeel free to contact me, as I am prepared to hand over my data to your investigators, and cooperate fully in the prosecution of those who are responsible and for those who participated in this massive frauds propagation to the rest of the Country.\n\n\n\n\n\nRegards,\n\nEdward Chiarini\n\n214-989-8441 cell"], ["TN0829", "05-31-2011", "Closed", "", "", "SA Ferguson", "No credible information"], ["TN0830", "05-31-2011", "Open", "Routine", "", "email", "Dear Sir or Maam,\n\n\n\n \n\n\n\nDetective Gordon Special Victims Unit Newport News, Virginia.\n\n\n\n \n\n\n\nI received a call from Detective Clemmons. Mrs. Teresa Daily called her again. Detective Clemmens advised that Mrs. Daily left a message stating she overheard them that they will have Holly at the Save A Lot up from Alpine Street at 1000 a.m., but we will not be able to recognize her. \n\n\n\n \n\n\n\nI have not contacted Mrs. Daily. I did send you the e-mail with the information from the last contact. I have notified my supervisor and we do have a Save A Lot in our city at Denbigh Boulevard and Warwick Boulevard, 14339 Warwick Boulevard Newport News, Virginia. Sgt. Creswell will have a couple of detective respond to that location around 0930 hours.\n\n\n\n \n\n\n\nIf needed: \n\n\n\n \n\n\n\nDetective Gordon (757) 928-4234, (757) 879-5340\n\n\n\nDetective Clemmens (757) 926-4756, (757) 268-7330\n\n\n\nSgt. Creswell (757) 928-4230 (757) 813-8389"], ["TN0830", "05-31-2011", "Closed", "", "", "SA Ferguson", "psychic lead-no credible information"], ["TN0831", "05-31-2011", "Open", "Routine", "", "phone call", "CALL CAME IN ON CONSOLE LINE ROLLED UP. FEMALE STATED THAT SHE CALLED IN THE FIRST WEEKEND THAT HOLLY DISAPPEARED REFERENCING A WHITE CAR SHE SEEN IN BENTON CO,ON HWY 641 NORTH-  STATED SHE IS A SCHOOL BUS DRIVER AND IS CALLING BACK TODAY TO STATE THAT SHE FEELS CERTAIN THAT SHE JUST SEEN THE CAR AGAIN TODAY .STATES SHE SEEN A PINK SHIRT IN THE VEHICLE AND A FEMALE \n\n \n\nTHE WHITE MIRAGE tn TAG 114KKP OUT OF LAUDERDALE COUNTY, VEH WAS OCCUPIED X4\n\nWITH A MALE DRIVER. VEHICLE WAS SEEN IN CAMDEN TODAY IN LAST FEW MINUTES.\n\nCALLER STATES THAT SHE HAS TAKEN A PHOTO OF THE VEHICLE AND WILL BE EMAILING IT IN  the photos i will have to fax groupwise will not allow me to forward"], ["TN0831", "05-31-2011", "Closed", "", "", "SA Ferguson", "Car registered to John Rose/John Lawrence in Benton Co. No further follow up needed"], ["TN0832", "05-31-2011", "Open", "Routine", "", "800 TBI FIND", "Chad David Sells called to advised he had seen a female that looked like Holly at the VA Hospital in Memphis on May 17, 2011. Mr. Sells advised the only thing he can remember about her description is that her hair was shorter than the photo and she was wearing a wide black ring on her 3rd finger on her right hand. Mr. Sells phone number is 731-307-0766."], ["TN0833", "05-31-2011", "Open", "Routine", "", "telephone", "Caller, Kelly Allen 731-549-4674, stated that one week before Holly disappeared she met a man in the florist shop (Parsons Florist). She made a comment about his plates on his car (Wyoming 155128) and asked why he was in town. The man stated that he just made the decision to move and picked a place on the map. He stated he just moved down from Ohio one week prior to the conversation. The caller stated that she has seen him around town since. He drives a silver four door vehicle."], ["TN0579", "06-01-2011", "Closed", "", "SA Ronnie Faulkner", "", "John Earl Brockman\n\n5639 Fairfield Dr.\n\nMilan, TN \n\nDOB: 04/17/1945 Home# (731) 613-2090 Cell# (731) 298-4171\n\n\n\nSA Ronnie Faulkner spoke with Inv. Bobby Sellers of the Milan PD (731) 414-8771, and he was familiar with Mr. Brockman and advised he was working with ICE agent Kevin Liles.\n\nSA Faulkner spoke with agent Liles (901) 601-1649 and he advised that Brockman was involved in some internet white collar scams involving Nigeria checks and credit cards and was currently cooperating with them. He stated that Brockman was into mail order brides from foreign countries but had no record of rape or sex charges. He provided Brockman email as Brockman777@gmail.com. \n\nSA Faulkner interviewed John Earl Brockman and he provided that he lives alone and his retired. He does not watch TV much but had seen the Holly Bobo case on the internet. He stated that he did not know her and had never been to Parsons, TN before. Brockman is 66 years old and drives a 1986 brown Nissan pickup and also owes a Lincoln Towncar. \n\n\n\nDue to Brockman's age and other information this lead should be closed."], ["TN0037", "06-02-2011", "Closed", "", "", "", "SA Ronnie Faulkner interviewed Shane Hopper at the Henderson Co. jail, he has been there since May 23rd on Meth charges. Hopper stated that he was in jail in Tipton Co. from Dec. 7, 2010 until Jan. 4, 2011 also on Meth charges. He denied making any kind of statement about wanting to abduct girls and he had only been arrested for drug charges. \n\nHopper had been living in Willow Oaks apartments in Lexington since April 7 with his wife, Karen James Hopper, who had also been arrested on Meth charges. \n\nHopper claimed that he had heard about the Holly Bobo case from his mother who called and told him about her abduction. He provided his cell number as (731) 616-8526.\n\nHopper is 5'9'but only weighs 135lbs, has long dirty brown hair past is shoulder and a beard. His description does not match the suspect description. \n\n\n\nShane Hopper, W/M, DOB: 09/15/1973, SS# 410-49-1499, TN dl 070977591"], ["TN0836", "06-07-2011", "Open", "Routine", "", "", "Stephen Skinner 318-805-4834. Mr. Skinner advised his son works at a camper repair business and was in Arcadia, LA today 06/07/2011, at the Bonnie and Clyde Trailer Park when he was approached by a white female matching Holly's description. She told him she was from TN and that she was 20 years old. Mr. Skinner stated his son was on his way home when he heard about Holly on the radio. When he got home he pulled up the news reports on Holly and told his father that the girl looked like Holly."], ["TN0822", "06-07-2011", "Closed", "", "", "", "Dodd intel"], ["TN0819", "06-07-2011", "Closed", "", "", "", "Possible sighting / vague description"], ["TN0777", "06-07-2011", "Closed", "", "", "", "Carroll co So Inv. David Bunn verified that his dept  received no other similar calls relating to this lead. The area was checked and he could produce no further information....possible hunters."], ["TN0834", "06-08-2011", "Open", "Routine", "", "Telephone", "Caller, Jerry Clenney 731-798-6160, would like John Mehr to call him. He has spoken to John before and he now has information (second hand) about someone who knows where  Holly Bob is."], ["TN0835", "06-08-2011", "Open", "Routine", "", "Telephone", "Caller, Bill Friar 423-313-8912, stated that Oscar VanHook w/m, 58-60yo, glasses is his neighbor and every time a child/young adult has gone missing in the last few month, VanHook has been away from his home for a couple of days and when he returns he adamantly goes about cleaning his vehicle (detailing). Caller stated that when Holly went missing VanHook was gone for three days and he was driving a van. VanHook's address is 65 Frontier Lane, Ringo GA which is right across the state line from Chattanooga. Mr. Friar said it may be nothing but it is very coincidental to him."], ["TN0836", "06-09-2011", "Update", "Routine", "", "", "ASAC Lewis spoke with Mr. Skinner on 6-9-11, Skinner stated his son is 17yoa and this unk female was flirting with him. She did not appear to be in a kidnapping situation. Skinners son did not think any thing about it until he heard on the radio the same day that Holly Bobo was seen in the area in LA. He could provide no further information."], ["TN0836", "06-09-2011", "Closed", "", "", "", "TN0836, TN0837, TN0838 all reference the same information.\n\nclose - not believed to be Holly Bobo - no knowledge of any credible sightings anywhere.\n\nOn 6/13 Sgt Rusty Poland, Bienville Co SO, Arcadia, LA provided the following information. Sgt Poland made contact with the unk girl re the provided leads. She was identified as a Brittany Fancher from Joaquin, Tx. Fancher was staying at the Bonnie and Clyde Rv park with a friend, whose husband was on the pipelind. Fancher was driving a car registered to her mother. Relatives to Fancher were spoken to on the phone, who verified her identity. Fancher appeared to be safe and not in any sort of kidnapping situation. Fancher is in her early 20s and does resemble (V) BOBO, but is definitely not her. Fancher lives at 8013 Farm RD 699 in Joaquin, Tx. Sgt Poland may be reached at 318-263-7432."], ["TN0837", "06-09-2011", "Open", "Routine", "", "Telephone", "Caller, Sandra Humphries 318-396-2473 stated that her brother Steve Humphries saw and spoke to a women who stated she was Holly at the Bonnie and Clyde RV park. THe brother stated that the female was staying in a RV that was by the back gate and up the hill, there is a gray car with a smashed inside.  The RV is a fifth wheel type."], ["TN0838", "06-10-2011", "Open", "Routine", "", "Telephone", "Rcvd a phone call from John Carter of West LA phone #s 318 237-2335(c), 318 396-2225(w), about a blonde possibly matching the description of Holly Bobo. Two of his employee Steve Humphries & Jamie Spilers were on a call in Arcadia LA to install an a/c into a trailer @ Bonnie & Clyde RV Campground of I20 exit 67/69. They were approached by a blonde (approx 20 yrs olds, short, blonde hair, scar on lower leg, approx 100 lbs). She made a statement 'have you heard any rumors about me, I don't have a boyfriend anymore and I'm lonelyåÓ. The two workers stated that she had not been i
