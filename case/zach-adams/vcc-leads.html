<style>
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}
html { 
  font-size: 14px; 
}
:root {
  --bg:            #0d1117;
  --bg2:           #161b22;
  --bg3:           #21262d;
  --border:        #30363d;
  --accent:        #2f81f7;
  --accent-subtle: rgba(47,129,247,0.10);
  --accent-dim:    rgba(47,129,247,0.40);
  --text:          #e6edf3;
  --text-dim:      #7d8590;
  --red:           #f85149;
  --green:         #3fb950;
  --amber:         #d29922;
  --card-alt:      rgba(230,237,243,0.04);
  --border-lo:     rgba(48,54,61,0.7);
  --hdr:           #010409;
  --hdr-sub:       #0d1117;
  --hdr-txt:       #e6edf3;
  --thead:         #161b22;
  --thd-hov:       #21262d;
  --green-bg:      rgba(63,185,80,0.12);
  --red-bg:        rgba(248,81,73,0.12);
  --amber-bg:      rgba(210,153,34,0.12);
}
[data-theme="light"] {
  --bg:            #ffffff;
  --bg2:           #f6f8fa;
  --bg3:           #eaeef2;
  --border:        #d0d7de;
  --accent:        #0969da;
  --accent-subtle: rgba(9,105,218,0.08);
  --accent-dim:    rgba(9,105,218,0.35);
  --text:          #1f2328;
  --text-dim:      #57606a;
  --red:           #cf222e;
  --green:         #1a7f37;
  --amber:         #9a6700;
  --card-alt:      rgba(31,35,40,0.04);
  --border-lo:     rgba(208,215,222,0.6);
  --hdr:           #24292f;
  --hdr-sub:       #1c2128;
  --hdr-txt:       #f0f6fc;
  --thead:         #f6f8fa;
  --thd-hov:       #eaeef2;
  --green-bg:      rgba(26,127,55,0.10);
  --red-bg:        rgba(207,34,46,0.10);
  --amber-bg:      rgba(154,103,0,0.10);
}
body { 
  font-family: Arial, sans-serif; 
  background: var(--bg); 
  color: var(--text); 
}
header { 
  background: var(--hdr); 
  color: var(--hdr-txt); 
  padding: 16px 24px 12px; 
}
header h1 { 
  font-size: clamp(.95rem, 2.5vw + .4rem, 1.15rem); 
  font-weight: 700; 
  line-height: 1.3; 
}
header p  { 
  font-size: clamp(.7rem, 1.5vw + .3rem, .78rem); 
  opacity: .7; 
  margin-top: 4px; 
  line-height: 1.4; 
}
.stats-bar {
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap;
  background: var(--hdr-sub); 
  padding: 8px 16px;
}
.stat {
  background: rgba(230,237,243,.08); 
  border-radius: 6px;
  padding: 5px 12px; 
  color: var(--hdr-txt); 
  font-size: .75rem;
  display: flex; 
  align-items: center; 
  gap: 5px; 
  flex-shrink: 0;
}
.stat strong { 
  font-size: .95rem; 
}
.toolbar {
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap; 
  align-items: center;
  padding: 10px 16px; 
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; 
  top: 0; 
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.toolbar input[type=text] {
  flex: 1; 
  min-width: 180px; 
  padding: 7px 12px;
  border: 1.5px solid var(--border); 
  border-radius: 7px;
  font-size: .85rem; 
  outline: none;
  background: var(--bg); 
  color: var(--text);
}
.toolbar input::placeholder { 
  color: var(--text-dim); 
}
.toolbar input:focus { 
  border-color: var(--accent); 
}
.toolbar select {
  padding: 7px 10px; 
  border: 1.5px solid var(--border);
  border-radius: 7px; 
  font-size: .82rem;
  background: var(--bg); 
  color: var(--text);
  outline: none; 
  cursor: pointer; 
  max-width: 180px;
}
.toolbar select:focus { 
  border-color: var(--accent); 
}
.btn {
  padding: 7px 13px; 
  border: none; 
  border-radius: 7px;
  font-size: .82rem; 
  cursor: pointer; 
  font-weight: 600;
  white-space: nowrap;
}
.btn-clear { 
  background: var(--accent-subtle); 
  color: var(--accent); 
  border: 1px solid var(--accent-dim); 
}
.btn-clear:hover { 
  opacity: .8; 
}
.count-bar {
  padding: 4px 16px; 
  font-size: .75rem; 
  color: var(--text-dim);
  background: var(--bg3); 
  border-bottom: 1px solid var(--border);
}
/* Table */
.table-wrap { 
  overflow-x: auto; 
  padding: 0 0 60px; 
}
table { 
  width: 100%; 
  border-collapse: collapse; 
  min-width: 700px; 
  table-layout: fixed; 
}
col.c-id   { width: 80px; }
col.c-date { width: 95px; }
col.c-stat { width: 75px; }
col.c-prec { width: 100px; }
col.c-agent{ width: 120px; }
col.c-how  { width: 110px; }
col.c-narr { width: auto; }
thead th {
  background: var(--thead); 
  color: var(--hdr-txt); 
  padding: 8px 10px; 
  text-align: left;
  font-size: clamp(.68rem, 1.2vw + .3rem, .78rem);
  position: sticky; 
  top: 0; 
  cursor: pointer;
  user-select: none; 
  white-space: nowrap; 
  border-bottom: 1px solid var(--border);
}
thead th:hover { 
  background: var(--thd-hov); 
}
thead th .si { 
  margin-left: 3px; 
  opacity: .4; 
}
thead th.sorted .si { 
  opacity: 1; 
}
tbody tr:nth-child(even) td { 
  background: var(--card-alt); 
}
tbody tr:hover td { 
  background: var(--bg3) !important; 
}
td {
  padding: 7px 10px; 
  font-size: clamp(.75rem, 1.3vw + .3rem, .82rem);
  border-bottom: 1px solid var(--border-lo); 
  vertical-align: top;
  color: var(--text) !important;
}
/* Badges */
.badge {
  display: inline-block; 
  padding: 1px 7px; 
  border-radius: 10px;
  font-size: .68rem; 
  font-weight: 700; 
  white-space: nowrap;
}
.s-open { 
  background: var(--green-bg);   
  color: var(--green); 
}
.s-closed { 
  background: var(--card-alt);    
  color: var(--text-dim); 
}
.s-update { 
  background: var(--accent-subtle); 
  color: var(--accent); 
}
.s-info { 
  background: var(--amber-bg);    
  color: var(--amber); 
}
.p-immediate { 
  background: var(--red-bg);      
  color: var(--red); 
}
.p-priority { 
  background: var(--amber-bg);    
  color: var(--amber); 
}
.p-routine { 
  display: none; 
}
/* Narrative expand */
.narr-cell { 
  max-width: 340px; 
}
.narr-preview { 
  display: -webkit-box; 
  -webkit-line-clamp: 2; 
  -webkit-box-orient: vertical; 
  overflow: hidden; 
  line-height: 1.45; 
}
.narr-full { 
  display: none; 
  line-height: 1.55; 
  word-break: break-word; 
}
.narr-toggle {
  background: none; 
  border: none; 
  color: var(--accent);
  font-size: .72rem; 
  cursor: pointer; 
  padding: 2px 0; 
  font-family: inherit;
  display: inline-block; 
  margin-top: 3px;
}
.narr-toggle:hover { 
  text-decoration: underline; 
}
tr.expanded .narr-preview { 
  display: none; 
}
tr.expanded .narr-full { 
  display: block; 
}
/* Mobile */
@media (max-width: 640px) {
  header { 
    padding: 12px 14px; 
  }
  .toolbar { 
    padding: 8px 12px; 
    gap: 6px; 
  }
  .toolbar input[type=text] { 
    min-width: 0; 
    flex: 1 1 100%; 
  }
  .toolbar select { 
    flex: 1 1 calc(50% - 4px); 
    min-width: 0; 
    max-width: none; 
  }
  .toolbar #case-nav { 
    width: 100%; 
  }
  .table-wrap { 
    padding: 0 0 60px; 
    overflow-x: hidden; 
  }
  table, thead, tbody, tr, th, td { 
    display: block; 
  }
  table { 
    width: 100%; 
    min-width: 0; 
  }
  thead tr { 
    display: none; 
  }
  tbody tr {
    width: 100%; 
    background: var(--bg2); 
    border-radius: 10px;
    margin: 8px 12px; 
    width: calc(100% - 24px);
    box-shadow: 0 1px 4px rgba(0,0,0,.2); 
    padding: 10px 12px;
    border-left: 3px solid var(--border); 
    box-sizing: border-box;
  }
  tbody tr.prec-immediate { 
    border-left-color: var(--red); 
  }
  tbody tr.prec-priority { 
    border-left-color: var(--amber); 
  }
  tbody tr.prec-routine { 
    border-left-color: var(--accent); 
  }
  tbody tr:nth-child(even) td { 
    background: transparent; 
  }
  tbody tr:hover td { 
    background: transparent !important; 
  }
  td {
    border: none; 
    position: relative;
    padding: 2px 0 2px 72px; 
    display: block; 
    min-height: 1.6rem;
    font-size: .82rem; 
    word-break: break-word; 
    overflow-wrap: anywhere;
  }
  td::before {
    content: attr(data-label);
    position: absolute; 
    left: 0; 
    top: 3px; 
    width: 66px;
    font-weight: 700; 
    font-size: .67rem; 
    color: var(--text-dim);
    text-transform: uppercase; 
    letter-spacing: .03em;
  }
  td:first-child { 
    display: none; 
  }
  .narr-cell { 
    max-width: none; 
  }
}
</style>
</head>

const DATA = [["TN0012", "04-13-2011", "Open", "Routine", "", "", "Henderson Co SO Heath Delaney interviewed Jimmy Broadway between 6:30-7:00am. Mr. Broadway stated that he saw a beat up green S-10 truck with a blue tailgate on a gravel road off of Mt. Aarot Cemetary Road."], ["TN0004", "04-13-2011", "Open", "Routine", "", "", "John Babb spotted a white truck traveling at a high rate of speed on Swan Johnson Road."], ["TN0346", "04-13-2011", "Open", "Routine", "", "lead sheet", "Prepared 4/19/11. USMS took neighbor BARNES to address in Parsons in order to complete interview of his friend. While riding BARNES said he believed he was going to be arrested. He also commented on the number of people searching and said \"I hope no one else gets hurt.\" He was extremely nervous during this voluntary ride and conversation."], ["TN0001", "04-13-2011", "Open", "Routine", "", "", "TBI Agent Pat Looney and Analyst Stephanie Davis arrived in Decatur County with the TBI Command Post."], ["TN0000", "04-13-2011", "Info Only", "Routine", "", "", "The Event Board is Officially Open"], ["TN0002", "04-13-2011", "Open", "Routine", "", "", "Cell phone found by TBI Agent Chris Carpenter. At 2151 hrs, I S.Davis was informed by SA Mark Lewis that the cell phone belonged to a search party member, not connected with the case."], ["TN0027", "04-13-2011", "Open", "Routine", "", "Telephone", "Caller telephoned in to the 800 number to state that Blake Barnett posted on FB approximately 23 minutes before she called in at 12:30 pm. The caller stated she befriended Blake through her daughter's FB page and he accepted the request from his IPhone. Upon Annette Tedford checking Blake's FB page, there had not been an entry made in the past 20 hours. The caller wanted to advise us since he is a suspect or has been a suspect and he has not been able to be located. The caller's phone number is 731-614-7354"], ["TN0003", "04-13-2011", "Open", "Routine", "", "", "Knife found by THP Brad Lund."], ["TN0005", "04-13-2011", "Open", "Routine", "", "", "Currently there is a neighborhood canvas on Swan Johnson Road south of the crime scene, 5 forks to Henderson County Line west of the crime scene, Bear Creek Road east of the crime scene and also a road north of crime scene."], ["TN0006", "04-13-2011", "Open", "Routine", "", "", "U.S. Marshal Chris Crozier searched the residence at 555 Swan Johnson Road, the outer buildings and vehicles, nothing was found. The search was performed because the blood hound running a track for the victim ended at that residence."], ["TN0007", "04-13-2011", "Open", "Routine", "", "", "Tony Weber Decatur Co SO is currently checking all Decatur Co Sex Offenders."], ["TN0008", "04-13-2011", "Open", "Routine", "", "", "According to FBI Agent Bilnoski, Steve Paulk stalked victims mother a few years ago."], ["TN0009", "04-13-2011", "Open", "Routine", "", "", "Decatur Co SO Ricky Inman spoke to Tim Manus Sunday @ 5:45pm. It's the first left from the crime scene; they saw a dark grey Durango with Hamilton Co tags."], ["TN0010", "04-13-2011", "Open", "Routine", "", "", "TBI SA Reeves Garnett checked the victim's home computer. When he touched the mouse the screen saver turned off and the Facebook login page immediately came up. Browsing history on the computer was checked, Facebook and Ebay was the most recent activity. A picture was recently accessed labeled Holly and Drew 019 that appears to be the victim with her arm around a male."], ["TN0011", "04-13-2011", "Open", "Routine", "", "", "Deputy Randy Quinn with the Decatur SO went to the Largest Coon Hunt Association and discovered that the victim had contact with a guy with Hamilton Co tags. SA Dean called the Coon Hunt and the only information they had for the vehicle was the name D.B. Little and a phone number 423-304-0038, no address."], ["TN0013", "04-13-2011", "Open", "Routine", "", "", "Curently FBI Bilnoski and Ricky Inman are looking for a Henderson Co Sex Offender named Brandon Kelly who drives a S-10 fitting the description given earlier by Jimmy Broadway. Negative information."], ["TN0014", "04-13-2011", "Open", "Routine", "", "", "Currently Scott Cagle with Decatur Co Sheriff and team are conducting a canvas of the North 40 truck Stop based on the cell tower information, the victims phone received a phone call @ 9:06am north of I-40."], ["TN0015", "04-13-2011", "Open", "Routine", "", "Agents", "TN0013: Decauter County Deputy Sheriff Inman, FBI SA Cardone, and FBI SA interviewed Brandon Kelly at Kelly's home at 4430 Highway 100 East in Decauterville. Results Negative."], ["TN0020", "04-13-2011", "Open", "Routine", "", "", "TBI S/A Pat Looney and Analyst Stephanie Davis left the Command Post"], ["TN0016", "04-13-2011", "Open", "Routine", "", "Agents", "FBI SA Viverors and USMS Shane Brown interviewed Keith Clark, a friend of James Barnes, at Clark's residence at 223 Bulter Road at 21:45 hours. Results Negative."], ["TN0017", "04-13-2011", "Open", "Routine", "", "Agents", "TBI SA Mark Lewis and FBI SA Joe Upton interviewed all of Victim Holly Bobo's classmates from UT Martin at Parsons at approximately 12:00 hours. The students and teacher missed Victim Bobo when she did not show up for class at 08:30. No follow on information was obtained."], ["TN0018", "04-13-2011", "Open", "Routine", "", "Agents", "Natalie Bobo, Victim Holly Bobo's cousin, stated she and the victim were walking in front of James Barnes house on the 1st or 2nd of April 2011 and notice two Male Whites watching them from the front of Barnes house. FBI SA Viveros and TBI SA Brent Booth interviewed Barnes at his residence at 14:30 hours on Wednesday 13 Apr 11, and learned the other male white was Keith Clark. Barnes stated he was loading his pick up truck with tool between 07:40 and 08:10 on Wednesday 13 Apr 11 when he heard screams from the direction of Holly Bobo's house. The screams were like those of someone being frightned by something. Barnes walked toward Holly's house but saw nothing. Barnes wife came outside with the child and got in the pick up with Barnes to go to work. Barnes does not usually drive by Holly's house, but did on this occassion, but saw nothing. Barnes' wife called Holly's mother at work and advised her of the situation. One of Holly's relatives that was contacted by Barnes' wife called the Sheriff's Office at 07:59 and this was the first report. The second call to the Sheriff's Office was at 08:08."], ["TN0019", "04-14-2011", "Open", "Routine", "", "Deputy Michael Hamilton", "Decauter County Sheriff's Deputies Michael Hamilton and Travis Dunavant came to the CP and reported Decauter County Dispatch had recieved a 911 call at 12:20 hours on Wednesday, 13 Apr11 from a MW/17 Landon Bibbs, DOB 08/09/1993, home phone 731-847-3033. Dep. Hamilton called Bibbs and Bibbs stated that he had a doctor's appointment with Dr. Montgomery at 09:50 on Wednesday Morning 13 Apr11. When Bibbs arrived at the doctor's office he heard weeping screams from the rear of the doctor's office and the college somewhere close to Bible Hill. Bibbs told the doctor's secretary about the screams, but did not call the police. He learned of the disappearence of victim Bobo when he returned home tonight and told his mother, who told him to call the police. Bibb's mother is Monica Thomas, who has been handled by the Decauter Sheriff's office on drug charges in the past. Bibbs attends Riverside High School from approximatley 07:45 to 14:45 each day. Deputy Hamilton called Parsons Police Dispatch and was advised that no calls were made in the area of Dr. Montgomery's office all day.\n\nDeputy Hamilton obtained a written statement from Bibbs at 02:00 on Thursday 14 Apr 11. The statement is on file in the CP. No further action at this time."], ["TN0021", "04-14-2011", "Open", "Routine", "", "SA Lewis", "07:38 TBI SA Lewis advised that TBI SA Terry Dicus was enroute to the Decauter County Bank to check on Victim Bobo's finicial records, and to check recent activity; and to advise the bank to contact TBI if there is any activity with Victims Bobo's account."], ["TN0022", "04-14-2011", "Open", "Routine", "", "SA Lewis", "08:05 TBI SA Lewis advised that USMS Chris Crozier is checking any possible financial leads unknown to investigators, i.e. credit cards."], ["TN0023", "04-14-2011", "Open", "Routine", "", "SA Lewis", "08:12 TBI SA Lewis advised that USMS Crozier and Henderson County Deputy Sheriff David Dowdy are checking all the sex offenders in Henderson and Decauter County."], ["TN0033", "04-14-2011", "Open", "Routine", "", "", "FBI Agent Arthur Viveros and TBI Agent Brent Booth spoke with Natalie Bobo 156 Myracle Rd, Parson TN 38363 who states she met a guy Steve Warner W/M, 50's, 5/10\" over 200 lbs, with an injured foot (not known if permanent) walks with a crutch on MySpace about 1 yr ago who offered to take pictures of her for free. He took pictures of her at various locations around her home with her clothes on. Thereafter she traveled to Nashville at his expense for more pictures, he provided the food, place to stay and did not solicit sex. Warner has a brother, about the same age as himself who visited on occasion. She stopped communication w/ Warner after the last Nashville photo shoot and does not know how to contact him. Last summer she worked in a club named Cherry's as a stripper in Corinth MS. were the manager was  Jake (LNU), W/M, 50's, 5/8\" to 5/9\", cell phone #662 212-2158, who she lived with but did not have sex with. January 14 to 19 2011 she was employed as a stripper in Miami at a club whose name she can not remember after responding to an internet site called sexyjobs.com. She was offered the job by Miami'sfinestmodels.com were the manager was Miguel (LNU) and they paid her airfare from Nashville to Miami. She quit the strip club after they asked her to become a prostitute, so she contacted her father who paid her return airfare to Nashville. None of the clubs or people mentioned knew her cousin Holly except Steve Warner. Natalie did not tell Warner of her cousin Holly but Holly allowed Warner to be a friend on her MySpace after her mother Karen Bobo asked Holly to allow Warner to be her friend on her account and Karen could examine Warner's MySpace. Natalie requested that Warner delete his friendship account with Holly so she could maintain her own privacy from Warner. Natalie feels the before mention parties would not want to harm her or Holly. Natalie indicated that she and Holly used marijuana in the past but stopped last year and used no other drugs."], ["TN0024", "04-14-2011", "Open", "Routine", "", "Witness called Police", "08:55 A written statement obtained from MW/DOB/01/22/1948 Mike Oneal Cook from Henderson County Deputy Sheriff Kenneth Thompson at the CP. Mr.Cook believes he saw the Victim Bobo with a MW around 12:20 hours on Wednesday in the area of a gravel pit off Highway 412."], ["TN0309", "04-14-2011", "Open", "Routine", "", "", "SA John Simmons interviewed Shannon Lee Baxin, 111 Vaughn St #S141, Waynesboro TN, 217.320.4607. Baxin and daughter, Christina Bravo, headed to Savannah from Waynesboro TN on Hwy 64. About å_ mile E of Hwy 128 they saw a person walking EB on Hwy 64 on the S side of the road, wearing camo hat and jacket, dark green pants, and lg. military style backpack, hitchhiking with her thumb out, turned around and picked her up. They first thought it was a man due to short hair. She was headed to Waynesboro. She said she wasn't in military, someone gave her the clothing. She had new military style boots and was breaking them in. Stated she was from Oregon, but hesitated when answering, headed to Chattanooga and 20 yoa. She planned to hop a train in Chattanooga and go to PA. Baxin said it would be better to go to I40 and hitch a ride with a trucker to PA. She didn't want to do that. She hitched a ride on Hwy 128 and got dropped off at the corner of Hwy 64. Her dad is a bluegrass singer. Mom is a meth head and works as a custodian. She has hopped trains since she was 16-17. They told her it was dangerous to be alone. She hasn't been alone long because she and her boyfriend broke up recently. She had real pretty blue eyes and was very masculine. They told her it was a long walk to Chattanooga. She said people sometimes let her stay with them and fed her. They dropped her off at the Exxon located across the road from the hospital in Waynesboro. She lost her college scholarship and job in Oregon. They noticed she had some kind of touch cell phone, never made or received any calls. She had friends in PA who arranged a job as a 'bar bag'for her there. She never gave her name or said where in Oregon she was from. She never said where in PA she was headed or why she was on the road, just this is how she travels. She appeared to have been on the road for quite a while and receives food stamps. She mentioned the workers at the rail yard in Chattanooga know her and let her hop on trains."], ["TN0025", "04-14-2011", "Open", "Routine", "", "FBI SA Upton", "10:02 FBI SA Joe Upton went to Parsons High School to interview FW/DOB 07/17/1994 Jessica Pearcy, who stated she was home alone at 1455 Wilkens Town Road, Darden, TN on Thursday 07 Apr 11 at approximatley 11:00 hours, when a MW approximately 40 years of age, height 5'10\", skinny build, with black shaggy hair/not long, black goatee, wearing camoflauge pants walked into her garage. Jessica opened the door and the MW said \"I didn't expect anybody to answer the door. The MW said something about a call about a tree being down. Jessica said We didn't call anybody about a tree down. The MW turned and walked to a late 1980s gray Chevrolet Blazer 4 door with a blond FW in the passenger, that was not Victim Bobo. Jessican can ID the MW if seen again. Jessica's home phone number is 731-847-7209, her mother, Charity Pearcy's cell phone is 731-549-7853. No further action at this time."], ["TN0026", "04-14-2011", "Open", "Routine", "", "Telephone", "Received a call from Melissa Quinn (913) 940-8311. She lives in Kansas now but she stated that she has known Holly for a very long time and remembers that Holly has a very rough breakup with an ex-boyfriend, Blake Barnett. Ms. Quinn stated that she remembers that Holly went to court and got a retraining order within the last year. However, we do not find a record of it in the Portal. Blake stays with his grandfather, Jimmy Jones, and step grandmother, Sandra Jones, on Bible Hill Road. Ms. Quinn stated that her family used to own the farm and knows that there are several places to hide something because it is on 80 acres with barns and two ponds. Ms. Quinn stated she looked at Blake's Facebook page and was \"startled\" by what she saw."], ["TN0093", "04-14-2011", "Open", "Routine", "", "note", "Email forwarded by Joanne Light from Julie McAnnally (original date July 21, 2010). The man [Emmett Gregory Nolan] tried to abduct my niece. Amber, Sunday, July 11, 2010 from the Walmart parking lot in Oneonta. Amber got away from him in her car. The man chased her flashing his lights and waving his arm out of his truck window. She called her parents from her cell phone and her dad met her on the road. The guy drove past them and waved. In less than 30 minutes he was spotted back in the Walmart parking lot looking for someone else to abduct. Oneonta City Police were called. He told them he was just trying to pick up women. He was arrested but bonded out of Blount County Jail in less than 6 hours. Trussville Police Department had an outstanding warrant on him and picked him up. He bonded out of Trussville on July 13, 2010. There have been reports of similar incidents in the area. There are also reports of a man matching his discription in a similar vehicle seen around businesses and subdivisions in the Springville area.  The tag number of his vehicle is 79895AP."], ["TN0028", "04-14-2011", "Open", "Routine", "", "SA King", "SA Dennis King with 24th Judical Task force approximately @14:30 on 4/13/2011,went to the crime relaying information to the Decatur Chief Deputy.Sometime between 7pm a lady advised that saw a man sitting on Bible road in Henderson Co with Camoflage.No name or contact other than a phone number.SA King made contact with a male subject in a Charcoal Silverado.He identified himself has Clayton Rainey.He advised SA King that he was Turky hunting.King also spoke with some unknown neighbors."], ["TN0029", "04-14-2011", "Open", "Routine", "", "SA Upton", "FBI Agent Joe Upton inteviewed Brittany Brown she provided an email address for Holly of litlebobo_09@hotmail.com."], ["TN0030", "04-14-2011", "Open", "Routine", "", "TIP", "Approximately 12pm today,SA Mark Lewis advised he received a tip that there was a road Construction Crew working on Cavia Road yesterday.Call thought he may have seen something.Carroll Co So canvased this area today and spoke to the Construction Crew and provided no information Per Carroll County Sheriff Dickson."], ["TN0031", "04-14-2011", "Open", "Routine", "", "FBI Task Force", "TFO's Todd Thayer and Chris Gorman spoke to White male Alan Evans he said around 8:20 yester day morning he was on Bohannon Landing Road,when he passed a White late 80's early 90's White single cab pickup with three subjects in the vehicle.The driver was a white male wearing a long sleeve camouflage shirt with Sandy Brown hair and unknown about the other 2 passengers.They were about 6 to 8 miles away from the victims house.The pickup was traveling East toward the river."], ["TN0032", "04-14-2011", "Open", "Routine", "", "SA Lewis", "Victims family states these are the items she was last known to be wearing: shirt (hot pink in color), writting girlie girl orginal (front left breast) in black & yellow or black & white lettering, on the back in black and white letters (don't squat with your spurs on), black flip flop Old Navy brand size 6 and half or 7, blue faded jeans, belly button ring (unknown type), white gold diamond ring (square setting) small diamonds w/center diamond being largest."], ["TN0075", "04-14-2011", "Open", "Routine", "", "notes", "\"Bill Perry - Paul Ray Pruitt, camo clothing. Lives in trailer.\" Information received from Sheriff's Office on notepad and brought to CP. Unknown origin."], ["TN0076", "04-14-2011", "Open", "Routine", "", "note", "\"Jessica Crowe 731-307-5996 - works at Fred's in Lexington. Man came in wearing full camo, acting very nervous, would not even let her give him his change. Could not see his face.\" Information received from Sheriff's Office on notepad and brought to CP. Unknown origin."], ["TN0077", "04-14-2011", "Open", "Routine", "", "note", "\"Nina Marks 731-307-1412\" Information received from Sheriff's Office on notepad and brought to CP. Unknown origin."], ["TN0034", "04-14-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Anonymous caller advised a female body was found at 8:05 a.m. this morning in Crooksville, Ohio. The Perry County Sheriff's Office is investigating this case. The Sheriff's phone number is (740)342-4123."], ["TN0036", "04-14-2011", "Open", "Routine", "", "", "On 4/14/11 approx 4:45pm Joe Wacker interviewed Dorothy Hill W/F DOB 5/20/60, 2730 Taylor Town Rd, Wildersville, 731 845-5434. Ms Hill between 4&6pm 4/13/11 she was traveling from Lexington on the Natchez Trace Pkwy Rd.Ms Hill said before she got to the firing range and shop she got behind a Red Jeep Cherokee. Ms Hill said her brother drove one like that and she thought it was him. As she neared the red Jeep it took off and she followed it. Ms Hill said the Jeep reached speeds of 60 to 65 on this curvy road. She knew then that this was not her brother. Ms Hill said the Red Jeep turned off on Cub Lake Rd. Ms Hill said the Red Jeep ran a stop sign and she also ran it trying to catch it. The Red Jeep had dark tinted windows and she could not see anyone in the vehicle. There was possibly a gray area around the bottom of the Jeep"], ["TN0035", "04-14-2011", "Open", "Routine", "", "800 TBI FIND", "Complainant Vicky Harris had read the news story of Ms. Bobo's disappearance on the 48 Hours Web Site. She advised a large white male subject dressed in a camouflage jacket walking a black Rottweiler. She stated he was bald and had a thick build. She lives in the area of a state and a private prison. She had never seen the man in the area before and was concerned because of the story."], ["TN0037", "04-14-2011", "Open", "Routine", "", "800 TBI FIND", "Justin Brooks & Kevin Bird called to advise that a male subject with the last name of Hopper was in jail with Justin in December in Tipton County. Justin Brooks advised the subject is from Henderson County, TN and had been arrested for meth. He had a hold on him for Madison County. Brooks advised that why he was in jail the Hopper subject advised that he wanted to abduct girls and had been to prison before. Brooks described him as being 6'0 apx 180lbs and had long black hair that hit the middle of his back.  Contact number for subjects is 901-626-2268"], ["TN0038", "04-14-2011", "Open", "Routine", "", "800 TBI FIND", "Michael James - 856 Golf Crest, Ackworth, GA 30101 (cell) 678-787-3632 (home) 770-672-0677. Mr. James advised that he was on Craigslist and found an ad that on the casual encounters section that appeared to include a photo of the victim. Mr. James emailed the ad to LEIC Allen. A copy of the email is included below. \n\n\n\nmj110560@comcast.net has forwarded you this craigslist.org posting.\n\n\n\nPlease see below for more information. \n\n\n\nVisit the posting at http://atlanta.craigslist.org/atl/cas/2322181904.html to contact the person who posted this.\n\n\n\n\n\n--------------------------------------------------------------------------------\n\n\n\ngf pics 4 gf pics - mw4mw\n\nDate: 2011-04-13, 5:43AM\n\n\n\nMy gf pics for you gf pics like the title says send your gf or wife pics and ill send mine together or alone \n\n\n\n\n\n\n\nLocation: atlanta \n\nit's NOT ok to contact this poster with services or other commercial interests\n\n\n\nOriginal URL: http://atlanta.craigslist.org/atl/cas/2322181904.html \n\n\n\n\n\n--------------------------------------------------------------------------------\n\n\n\nthis craigslist posting was forwarded to you by someone using our email-a-friend feature - if you want to prevent these, please go to:\n\nhttp://www.craigslist.org/cgi-bin/te/U2FsdGVkX18xNDc3ODE0N448FRTxgZQRMatr5FAp7Q83m8Iwiqx8d3i81z3eJ77p1udfDIyLCdM"], ["TN0039", "04-14-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Kevin Lewis @ (901) 482-7510 advised he may have seen Bobo at the Mapco gas station located at 1781 Kirby Pkwy Popular Ave, Memphis-East, TN 38138. Mr. Lewis saw a blonde female around 25 yoa wearing a white shirt and beige pants, Wednesday(4/13)around 6:00 p.m. Mr. Lewis stated it looked like the missing female. The female was pumping gas, then paid the clerk and left. No direction of travel.  The female was driving a mid 2000 white Toyota 4Runner. No tag information."], ["TN0040", "04-14-2011", "Open", "Routine", "", "1-800-TBI-FINd", "Lindsey Griffin @ (615)473-2882 advised she saw a female with dirty brown hair, wearing blue jeans, and two shirts at Target in Brentwood, TN that looked like the missing girl. She was with a male subject wearing a green t-shirt and brown pants. He was wearing a ballcap pulled down over part of his face. When Ms. Griffin left Target she saw them again around I-65 in the median.  It appeared they were hitchhiking."], ["TN0055", "04-14-2011", "Open", "Routine", "", "In person", "TBI SA Mark Lewis - Holly Bobo's lunch box was located by local resident, John Graves, on the side of the road on Gooch Road in a creek. On Gooch Road approximately between Bible Hill Road and Horny Head Creek Road. Lunch box was verified to belong to victim. Lat/Long-88080398313543552777"], ["TN0054", "04-14-2011", "Open", "Routine", "", "in person", "TBI SA Mark Lewis - Interview Sandra Miller 125 Mills Lane, (731) 549-7559. On same date around 6:55am Mills saw white male dressed in camo with a floppy hat and a white dog carrying a shovel. Looked suspicious. He was in the area of Horny Head Creek Road and Gooch Road. Unknown white male later identified by SA Mark Lewis as Marshall Spoon, DOB 5-12-70 TX DL #24813397. Spoon advised he was walking in that area with that clothing, a shovel and a white dog. Spoon advised he was walking in that area Wednesday between 7:30am - 8:00am does not remember seeing anything unusual in the area of Gooch Road. Spoon lives in a tent on Horny Creek Road halfway between Mills Lane and Gooch Road."], ["TN0047", "04-15-2011", "Open", "Routine", "", "Email from TIES", "A woman from another state had been here in Shelbyville, TN and remembered seeing a poster of a missing blond girl out of Shelbyville.  The poster was in the TAC Shop called Winter Circle next to Best Western Hotel.  She thought these to missinggirls could be connected to each other. Wanted to be anonymous.  Did not catch the number it came from."], ["TN0046", "04-15-2011", "Open", "Routine", "", "Email from TIES", "This woman called and stated she had been praying real hard and had a dream last night that she wanted to share, because she believes when you pray God will show you the way.  She dreamed of a white barn with hay.  She dreamed that you had to cross an older bridge and she remembered the name Charlotte.  And she believes the young girl is still alive.  Did not leave a name and didn't catch the number it came in from."], ["TN0041", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Carolyn Rogers - 9800 Hwy 100 Scotts Hill, TN (731) 549-5869. Mrs. Roger is the aunt of Dana Bobo. Mrs. Rogers advised on Wednesday at approximately 7:00 a.m. she met a dull red or maroon late model car in a deep curve on Box Rd. going toward Hwy 412. The car almost ran her off the road and was traveling at a high rate of speed."], ["TN0042", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Sarah Saunders - N. Long Avenue, Hamilton, Ohio (513) 448-5874. Ms. Saunders is a nursing student in Hamilton, Ohio. She advised she had an encounter with a male in a camouflage coat with a southern accent on a Monday or Wednesday approximately a month ago. Ms. Saunders advised that she stopped to get a dog out of the road and the male subject approached her in a threatening manner and advised her that he had it. Ms. Saunders advised the subject was driving a green ford explorer or jeep type vehicle. She stated that when a similar vehicle in navy and tan pulled up she left the area. Ms. Hamilton advised she knew this was a long shot but wanted to inform someone about the encounter after seeing it on t.v."], ["TN0088", "04-15-2011", "Open", "Routine", "", "note", "Decatur County SD tip - My friend was followed Sunday night by a man who was VERY bold. He followed her to her house and she managed to elude him. But he got out of his car at her house after trying to flag her down on the highway. It may not be related in the least, but I felf compelled to send this. Wanda didn't even get an ID on the car or the guy (bc it was dark), but the police said the MO was very similar to an earlier abduction attempt. All were blondes. Hope it is nothing, but just had to send this. (Teresa Morton Owens, 85252 US Hwy 278 Horton, Al 35980. email dawgfanz77@gmail.com). The police departments involved are all in Alabama. You can contact the Blount County Alabama Sheriff Dept, Oneonta AL PD, Trussville, AL PD for further info."], ["TN0043", "04-15-2011", "Open", "Routine", "", "email", "Resident Rhonda Kates, left for work yesterday morning between 9:00am - 9:30am and noticed a black jeep with black tinted window parked in a pull off near Bunches chapel right before you enter to get on INterstate 412. The individual in the car was a white male in camouflage and he was on the cell phone. Rhonda Kates 731-847-2583."], ["TN0045", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Rose Hinchey (731) 733-1837 - Ms. Hinchey advised that on Wednesday around noon she saw a red mini-van parked up in the woods at 8803 Brooksy Thompson Road, Bath Springs. A white male in driver's seat. Looked to be hiding & watching for something."], ["TN0044", "04-15-2011", "Open", "Routine", "", "Email", "Mr. Thomas claims that he may have seen missing person (Bobo) and suspects at Bojangles (Store #1056) in Franklin, NC on Highway 441. He said there were two men in camouflage at the Bojangles/Shell station around 9:00am EST. He stated that after he left the Bojangles he saw a woman wearing pink near the Ruby Cinema (about 3 miles from the Bojangles on Hwy 441). One man was at the Shell station buying beer while the other was buying food at Bojangles. Both men were around 6ft tall and wearing camouflage with small shaped patterns."], ["TN0048", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Sara Webb - (615) 352-3512 or (615) 779-6763. Mrs. Webb advised that she stayed with a female subject in Alabama that is possibly involved in Human Trafficking and may have been involved in the victim's disappearance. She advised the female, Allison Smith, looks like a man and is a former Marine. She did find Smith's dog tags that had the name L. Christiansan on the them. Smith lives at 530 County Road 179 in Crossville, Alabama with her two sons. Ms. Webb feels that there is something going on at the residence. She found where someone at the home had looked at a web site that was about selling kids for sex. She stayed with Smith in November 2010 while Ms. Webb was caring for her mother. Ms. Webb would like to speak with someone about Ms. Smith."], ["TN0073", "04-15-2011", "Open", "Routine", "", "notes", "Bobby Church 731-414-8563, Humbolt, store Superway. Green mini van, no tag information on 0530 yesterday, assault rifle in front seat (thought unusual for turkey season). White male, pale, white/reddish blonde hair, facial hair, rought cut. Complete camo. Seen in store."], ["TN0074", "04-15-2011", "Open", "Routine", "", "notes", "Jerry McAfee 549-4461, Billy Bell and Jerry frequented Shamrock to play cards 3 years ago, guy from up north showed up, mid 40s, 5'10\", 170-200 lbs. Lives around Swan Johnson Road below Dana Bobo, van fixed up to live n, dark curtains on windows, became obsessed with young girl at bat is why he was noticed. He lurked. Van seen below Holly Bobo's house."], ["TN0049", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Stacey Rice 190 Neely Avenue, Parsons, TN 38363 (731) 847-2519. Ms. Rice advised that her boyfriend, Harold Mitchell is a registered sex offender and has been telling her he knows where the victim is located. Ms. Rice advised that when Mitchell left the house on Tuesday he was driving a red Mercury and when he came home yesterday he told her he had sold it. Mitchell was at the residence this morning and Ms. Rice advised she waited until he had left to call. TBI SA Mark Lewis- FBI Joe Upton, US Marshall Chris Crozier are checking on this lead."], ["TN0051", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Clint Griswald - Baton Rouge, LA (225) 772-3651. Complainant wishes to remain anonymous. Complainant was driving through Tennessee on 4/11/11 on I-40 near Parsons. Puled off exit to get gas and stopped at a McDonald's attached to Loretta Lynn's Kitchen (poss Waverly exit) Subject was in line in front of caller. Subject was very agitated, loud, made threatening remarks, \"acting crazy\". Left McDonald's and went down the road and pulled off. Seemed to be waiting for caller to come by him. Subject was driving a brown/dark tan Honda Odyssey mini van with tenp tag exp. 5-1-11. Subject was a w/m 30-35 6'0-6'2\" 220-230lbs, long dark hair and a baseball cap."], ["TN0050", "04-15-2011", "Open", "Routine", "", "800 TBI Find", "Anonymous caller 4/15/2011 at 9:05 advised that on a Face Book friend (of the victim) - Matt Elkins has a friend named Randy Corlew.  And he is dressed in camouflage and is staying with a women ( maybe victim)."], ["TN0111", "04-15-2011", "Open", "Routine", "", "Email from LEIC Lambert", "Kim Lewis claims that her son (Toby Barrie) may have information on Bobo case. Man was in Dailey's/Shell Station off New Shackle Island Rd. in Hendersonville, TN. He claims there was a man there with camaflouge bibs and long sleeve shirt with hat and salt and pepper hair. He doesn't remember if it was the day of or the day after the abduction. Kim Lewis phone # 931-287-6013."], ["TN0053", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Male subject called 800 TBI FIND. He asked if he was talking to the FBI or TBI. Once he was told he was talking to TBI he stated \"He was glad that the girl was missing and hoped more went missing because of the Bush era bullshit.\" and then hung up the phone. The number listed on the caller ID was 760-922-9832. Subject sounded like he had a Northern or Midwestern accent."], ["TN0052", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Sherry Ashley - 205-466-5444. Complainant called to advise that a female subject in Blount County, Alabama was ambushed on Sunday night, April 10, 2011 at approximately 8:30 p.m. Ms. Ashley did not know the female's name, as she is a friend of a friend. The male subject attempted to grab the female at her residence as she was getting into her car. The female was able to get away from him and back out of the driveway. The male subject was tall white male and had light colored or gray hair. Ms. Ashley has heard that he attempted to abduct another female in the county the same night. Blount Co. AL is located 3 hrs south of Parsons TN per the complainant."], ["TN0058", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At approximately 10:30 a.m. LEIC Kershaw received a call on the TBI find line from Corrine Holbrook at 301-933-8757.  Ms. Holbrook was traveling from PA to MI when two men attempted to kidnap her.  Ms. Holbrook reported both incidents to Law Enforcement."], ["TN0052", "04-15-2011", "Update", "Routine", "Oneonta Alabama Police Department", "800 TBI FIND", "LEIC Allen spoke with Deputy at Blount Co. Alabama Sheriff's Department. He advised that a formal report has not been filed by the victim. Investigator Mitch Latta with The Oneonta Alabama Police Department has received an email on the incident and was looking into it. The number for the department is 205-625-4351. The subject did not actually approach the female and followed the female from Wal Mart in town and was harassing her as she drove from Wal Mart. A description was not available from the victim according to the deputy because of it being dark."], ["TN0060", "04-15-2011", "Open", "Routine", "", "In person", "Joseph Hudgens & Art Viveros, FBI - Interviewed Travis Eugene Hemby Volner, 66 Beasley Loop, Linden, Tn DOB 7-21-91, SSN 411-69-3490, Nursing student at UTM-Parsons, Lives with his father, Kenny Volner, sophmore, class on wednesday from 0930 to 1045 (english comp) approximately 5 minutes late because he overslept. Father can verify he was at home. He did not have a class with Holly, but he knew her through school and spoken to her a few times at UTM-Parsons. Last time talked to her was a scholarship banquet in 2009 where they both won a $1000 scholarship. Has known her for 6 - 7 years. Father's cell 731-549-4336. He couldn't recall anyone who would have wanted to hurt Holly or had an obcession with her. Story seems credible."], ["TN0061", "04-15-2011", "Open", "Routine", "", "In person", "Joseph Hudgens & Art Viveros, FBI - Interviewed Courtney LeAnn Tanner, 1727 Crawford Road, Decaturville, Tn, cell 731-549-0284, DOB 8-17-91, SSN 412-69-6705, Student at UTM-Parsons, sophmore majoring in education, knows Holly through growing up with her and through church Corinth Baptist Church in Darden. She had a wednesday class 0930 english composition approximately 5 minutes late due to sleeping in. She stated she did not have any classes with Holly. Can't think of any one who want to hurt Holly. She did notice a creepy guy in a white van that wore glasses waiting for someone at the school, in his late 20s approximately 5'10\" and he would sometimes wait in the student lounge with a small laptop and play the game bejewelled. Charity Pearcy who workes for Dr. Phillips in Parsons relayed to her that an older gentleman in a gray beard asked with camo pants came up to Pearcy's house and asked her if they needed any brush cleared from the property. Hudgens will follow up on Charity Pearcy's description."], ["TN0056", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "TN Homeland Security IA Lindsey Johnson received a call on the TBI find line from Janie at 731-668-0240.  Janie said she wanted to provide information to SAC John Mehr because she used to go to church with him at Skyline Church of Christ.  Janie said Mehr doesn't know her but he did speak to her one day at the Goodwill Store.  Janie explained she recently talked to a guy she dated once or twice and that his son's girlfriend knew of Holly Bobo and that her brother did not try to stop the guy from taking her.  Janie explained she is not psychic but does have feelings as to what happened to the victim."], ["TN0057", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "LEIC James Bryson received a call from a cab driver in Colombus, OH on the TBI find line at approximately 11:35 a.m. Citizen did not provide name but called from # 614-353-8871.  Cab driver explained about 2 to 3 evenings ago he saw a car traveling  270 N and a blonde girl looked at him from the car window then a guy looked at her and she turned away.  The guy sped away and he could not make out the vehicle TAG.  Cab driver reported that the guy had a football build, short clean hair cut, tan complexion.  The vehicle was described as a Mid 80's Gray Dodge type car."], ["TN0059", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At approximately 10:30 a.m. LEIC Kershaw received a call from Sonya in Oregon at 503-754-6607. Sonya called to report information on a suspect, Paul Evans Winklebluck, in her daughter's kidnapping.  According to Sonya, case has been mentioned on America's Most Wanted 3 times. Sonya explained Winklebluck has impersonated Police Officers wearing camo.  Sonya reported some details similar to Bobo case.  Suspect in her daughter's kidnapping is still on the run and her daughter was able to escape.  Det. Michelle Michaels in Portland, OR worked the case."], ["TN0062", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At 10:48 a.m. Admin Asst. Dickerson received a call from Scott Vincent at 914-761-7515. Mr. Vincent stated he called earlier but wanted to add that upon searching Holly Bobo's Facebook pages, he found a \"friend\" she had named Randy Corlew.  Mr. Vincent stated that both the victim and Scott Corlew attended UT Martin College.  He also stated that the picture on Facebook showed him in camo and as an outdoorsman.  He didn't know if this would be of help, but wanted to let us know what he had found."], ["TN0091", "04-15-2011", "Open", "Routine", "", "note", "Heather Burly stated that she thinks she was Holly at B/P in Parson a few days ago when she was going to cliicals at the hospital in Parsons and a man inside B/P was making comments to all the girls with her but singling Holly out. She does not know what the man was driving. Her phone 731-733-0000."], ["TN0063", "04-15-2011", "Open", "Immediate", "", "", "Sgt Jonathan Johnson - Ms. Jamie Sypsma called from 231-856-4246 to give information. When contacted back Ms. Sypsma did state that her brother-in-law had been acting strange for the last few months. She states that he would dress in camouflage (military style) and would go into the woods and walk around. She states that he would sneak up on people and found it amusing that he could watch (see) others when they did not see him. She states that he takes medication for mental issues, and believes that he is a patient of Quinco Mental Health in Decaturville. Ms. Sypsma states that he and her sister are considering divorce at this time. She also states that the two met through the internet and he may be looking for someone else on the internet. She states that he is originally from Boston. She states that he usually just walks into the woods near his residence, and does not known of him having an ATV. Ms. Sympsma states that when she heard of the incident taking place in Parsons, and the subject possibly wearing camouflage, she thought she should contact us. The information she gave is from telephone conversations with her sister. She has not seen the two for some time. She also states that she does not want the two to know that she called this information in."], ["TN0064", "04-15-2011", "Open", "Routine", "", "", "Caller named Justine 843-771-3753 -  was drugged, kidnapped, and raped by Miltary personnel Cory Gray age 32 W/M in 2007. Location a common area at Black Water SC. Justine advised she looks like victim.  She advised Gray has connections in Tennessee.  She mention Clarksville, Goodlettsville areas.  \n\nHe was convicted in Cumberland Co in South Carolina for Sexual Battery.  I checked the TN SOR - No Record."], ["TN0055", "04-15-2011", "Update", "Routine", "", "", "As per SA Mark Lewis - Search of the area where the lunch box was located is being searched."], ["TN0057", "04-15-2011", "Update", "Routine", "", "TBI Find Call", "IA Johnson received a call at 1:24 p.m. from caller who wanted to provide updated information.  Caller wanted to let authorities know he did a google search of vehicles and he believes the vehicle was a mid-80's Mustang."], ["TN0092", "04-15-2011", "Open", "Routine", "", "note", "Gloria Hogan called and stated she saw the news and her ex-husband Michael McCall and his father Jeffery Krider live in Parsons and the Jeff Krider is a convicted sex offender. She stated they were both hunters and was concerned. Her number 731-819-7236."], ["TN0065", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At 1:20 pm TBI Charley Dickerson received a call from Remona Carter from Petal, MS at 601-227-1356. Remona belives that Holly Bobo is alive and in the truck of a car and is crying.  Remona says that she is an evangelist and has premonitions and dreams that sometimes become reality.  She said that she does not know the area where Holly Bobo was taken from, but that in her dream there was a reference to a bathroom.  She said when she reached for the tissue roll that it would not tear and that it looked like a blue and white striped towel instead of tissue paper....it was rough, like the type you would scratch your back with.  She said she does not know what this represents, but felt it might signify te inside of a car truck, a towel in the trunk, someone's bathroom she (Holly) knew, a bathroom where Holly might have been before or a bathroom inside a building she'd been in.  Remona said she trusts her dreams because she had a dream about the 3 children who were drowned in the lake and also of the 2 children who's bodies were found floating down the river in suitcases.  She said that she posts her dreams into her website at remonacarter@yahoo.com, for a timeline...however, she said she has not put this dream on her yahoo because it's already been so long since she was taken.  She said that if she could speak with someone who is there where the girl was taken from who could tell her about the area, that she feels certain that she would be able to give more information and be of help in finding her."], ["TN0066", "04-15-2011", "Open", "Routine", "", "800 TBI FIND", "Victoria Hayes - (731) 549-2183 Home number- Ms. Hayes works in Sporting Goods at the Wal Mart in Lexington, TN. She advised they have had a 4 sales of MRE's this week and she found that very unusual as they usually only sell one or two a year. The number listed is for her home and she will be home after 5p.m. She is currently at the Wal Mart but did not know the store's number."], ["TN0067", "04-15-2011", "Open", "Routine", "", "", "TBI SA Cathy Ferguson & SA Doug Pate - Checking on leads: Robby Middleton 731-549-0397 has information and Karen Lancaster 731-847-6726 has information re: Paul Ray Pruett, possible child molestor seen with the victim (not recently). Pate left voice mail to both subjects."], ["TN0068", "04-15-2011", "Open", "Routine", "", "Email from ASAC Quin", "Email was sent to TBI by Invs. Curtis with the Chattanooga Police Department\n\n\n\n>>> \"Penney Curtis\" <penney_c@chattanooga.gov> 4/15/2011 10:19 AM >>>\n\n\n\nThis party may have already been looked into, but I wanted to pass it along just in case.\n\n\n\n \n\n\n\nEDDIE NEAL HALL (W/M)\n\n\n\n5'07 /200PDS\n\n\n\nTOMIS ID#: 00317368\n\n\n\n \n\n\n\nHALL IS A VALIDATED MEMBER OF THE ARYAN BROTHERHOOD AND WAS SENTENCED TO PRISON FOR AGGRAVATED BURGLARY AND STATUATORY RAPE.\n\n\n\n \n\n\n\nHALL'S LISTED ADDRESS IS APPROXIMATELY 7 MILES FROM THE VICTIM'S RESIDENCE. LOOKING AT THE DIRECTIONS TO GET FROM HIS HOUSE TO HERS IS BASICALLY AN 'L'PATTERN.\n\n\n\n \n\n\n\nI HOPE THIS HELPS\n\n\n\n \n\n\n\nInv. Curtis Penney#354\n\n\n\nCHATTANOOGA POLICE DEPARTMENT\n\n\n\nCRIME SUPPRESSION UNIT\n\n\n\n423-643-5000"], ["TN0067", "04-15-2011", "Update", "Routine", "", "", "Ferguson and Pate - Jonathon Dodd white male lives in the Bible Hill Road area lives with a grandfather, Grafton Dodd, son of Bradley Dodd came in as a tip that he is a mean person, lives in the area, and is capable of doing something like this. Working on leads."], ["TN0069", "04-15-2011", "Open", "Routine", "", "In person", "SA Joe Walker - Joe Frye, State Parole Officer in Henry County called on 4/15/2011 at 1223 and reported he was concerned about Jason Nickell possibly being connected to the Bobo disappearance in Decatur County. Frye told me he had een discussing this incident and he believed Nickell was definitely the type of person who would do something like this. Frye said Nickell had recently been in trouble for stalking a coed. Frye said he would try to get contact information for Nickell."], ["TN0049", "04-15-2011", "Update", "Routine", "", "In person", "Joe Upton, FBI - Spoke to Stacy Rice advised that Mitchell left as of last friday, returned on 4/14/2011. He had a red 1985 Mercury Cougar that was scrapped earlier in the week. He had never mentioned Holly to her. Hasn't talked about what has happened. While he was not living with her he was staying with Roger (last name unknown) and Pam Brown. Roger works at Bo's Furniture in Parsons. She said Harold was there on and off. Spoke with Roger, he verified he took Harold on Tuesday 4/12/11 to Lexington, Tn to scrap the vehicle. He stayed with Roger Tuesday night. Wednesday, Roger went to work and later mid morning wednesday Harold was with his cousin (Terry Arnold) at he shop 731-307-8100. He stayed with Terry all rest of Wednesday through Thursday."], ["TN0070", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "IA Johnson received a call at 3:25 p.m. from David Brewer at 615-429-5362. Mr. Brewer explained back in 2006-2007 he used to hunt in Parsons, TN. Mr. Brewer wanted to let investigators know there are a lot of hunting clubs across the river and around the area she was reported missing.  Mr. Brewer suggested LE might want to look into them if they haven't done so already."], ["TN0071", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "IA Johnson received a call at 3:30 p.m. from Robert Chojnacki at 708-785-3184.  Mr. Chojnacki reported he was at Harrah's Casino in Joliet, IL yesterday and spoke with a girl who said her name was Holly and that she looked a lot like Holly Bobo.  Mr. Chojnacki was approached by the woman at approximately 2:30 p.m. yesterday outside of the Casino.  Holly told Mr. Chojnacki she was 21 years old and 3 months pregnant.  Holly also told him she is in an abusive relationship.  Mr. Chojnacki said he gave Holly $20.00 because he felt sorry for her and that she went back into the Casino."], ["TN0072", "04-15-2011", "Open", "Routine", "", "", "Ms. Rachael Box advised a burgandy car was speeding on Box Road at 0730 on 4/13/11 and nearly ran them off of the road."], ["TN0080", "04-15-2011", "Open", "Routine", "", "Called in to Lexington PD", "Truck Driver, Tommy Hughes (662-706-2676)reported that yesterday, April 14 he saw a female fitting the description of Holly Bobo on the side of the road on Interstate 40 at mile marker 170. TBI SA  Terry Dicus is working this lead."], ["TN0067", "04-15-2011", "Update", "Routine", "", "In person", "Dodd 731-549-0599, was at Ben Steele house asleep. Ben Steele is a rescue squad and Dodd went with him on the search. Dodd heard screams in the woods near Evanstown Road and Cedar Hill Road last night at dark."], ["TN0078", "04-15-2011", "Open", "Routine", "", "note", "\"Alan Wyatt 549-9779, 549-5646 - Tuesday knocked at door, 5'7\" white male early 20s, camo, dred locks, red bandana, acting strange. Said from Nashville, selling meat. Small tan truck with camper.\" Information received from Sheriff's Office on notepad and brought to CP. Unknown origin."], ["TN0079", "04-15-2011", "Open", "Routine", "", "note", "\"Michael Rose 615-815-5675, hdrarek.\" Information received from Sheriff's Office on notepad and brought to CP. Unknown origin."], ["TN0074", "04-15-2011", "Update", "Routine", "", "note", "SA Joe Walker - spoke with Jerry McAfee 549-4461 in reference to a tip he called in to Decatur County SD. McAfee stated he played poker with a guy at the Shamrock Bar a couple of years ago. McAfee said the guys name was Dave or David. McAfee said this guy lived either next door to or the next hous down from the Bobo's on Show Johnson Road. McAfee said there was a 20 year old girl who came in with her father. McAfee said he could not take his eyes off this girl. He was obsessed with her. Dave is described as 40 years old, 5'10\", 200lbs with tattoos all over hs body. Has not seen him in over a year."], ["TN0081", "04-15-2011", "Open", "Routine", "", "note", "549-5581 - Fisher's Grocery, caller ran into man this week, late 20s or early 30s. Right height. Spoke, but guy in camo (old time army) gave him a horrible look. Short, reddish brown beard, slender face. Another guy in car. One guy asked if they were going back to the creek which was unusual for turkey hunting at that time of day. Caller probably could recognize him."], ["TN0082", "04-15-2011", "Open", "Routine", "", "note", "Tipster Rodney McAlpine 256-366-4191, say this morning at Southern & Cooper Memphis, south side of railroad tracks. Girl looking like Holly leaving motel followed by a large black male. Girl was carrying clothes over arm and looked scared. Call in at 0240 by Lt. Cindy Capps - Missing persons desk 901-363-4444 or 901-636-4479."], ["TN0083", "04-15-2011", "Open", "Routine", "", "note", "Susan Thompson 901-826-7243, Will Russell (Brewston) he watches young girls in pagents (Holly's friends). Maybe moved to Boliver."], ["TN0084", "04-15-2011", "Open", "Routine", "", "note", "James Johnson 270-816-8833, 731-968-9112 - Empty house - 2411 Highway 412W, father has key, John D. Johnson."], ["TN0085", "04-15-2011", "Open", "Routine", "", "note", "Diane Holzhauser 901-239-6979 - psychic, Holly gone. Knife - left side. Man, brown hair, either went to school with Holly or worked at school. Workers checked water too soon. He didn't know what to do with the body for a day, then put in water. He will take his own life. Sick young man."], ["TN0086", "04-15-2011", "Open", "Routine", "", "note", "Deputy Parker 731-298-406 - Someone told him he had vision of Holly being buried at Reelfoot Lake. First killing?"], ["TN0087", "04-15-2011", "Open", "Routine", "", "note", "Red Cameron 804-815-3448 - Psychic, Nashville, Images of Holly tied up (hands and feet) captive in a small wooden shed (not much larger than outhouse). Northwest of Parsons, near y intersection. Road goes to right. Lake at end of road."], ["TN0089", "04-15-2011", "Open", "Routine", "", "note", "James Pedder 412-389-8756 - tip on Holly Bobo. Hit on head, knocked out, put in back of light colored late model car."], ["TN0090", "04-15-2011", "Open", "Routine", "", "note", "Teresa Blackstock 549-4818 - said Aunt Pauline Quinn, 1636 Horny Head Creek Road, got a phone call yesterday, a male voice was whispering and asking question about the road around Tuckers."], ["TN0095", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At 5:10 p.m. LEIC Stanfill received a call on the TBI Find line from an anonymous caller at 617-955-2205.  Caller claimed she was a psychic and that Holly Bobo was wearing pink pants and that she feels her dad knows the guy who took her."], ["TN0094", "04-15-2011", "Open", "Routine", "", "Telephone", "Michelle Sanders 731-967-0527 called into Henderson County SD stating there is a youtube video about Holly Bobo being missing and there was a comment made by \"Brentsey\" that reads \"I have her head in a freezer\". LEIC Prickett is working on capturing the page and retrieving more information."], ["TN0118", "04-15-2011", "Open", "Routine", "", "Command Post", "On 4/16/11, information was received from Deputy Bryant Allen of the Benton County SO to check on a Ron Patton, W/M, 8/15/1969, 3190 BaldKnob Rd in Holladay, TN in regards to the disappearance of Holly Bobo. Allen stated a couple of years ago Patton kidnapped a female, tied her up and held her for a period of time. Allen said Patton injected the girl with Meth. Allen said the girl got loose and was found running down the road naked. SA Terry Dycus and SA Walker interviewed Patton at this home at 9:50 AM on 4/16/11. Patton said his daughter was friendly with the victim Bobo. Patton said his daughter, Brancy atton, had dated the same boy as Holly had at one time. They became acquaintances through this connection. The boys name was Lee Baughs. Patton said he figured someone had been stalking her. Patton said he figured Holly was in the woods somewher or in the bottom of a river. Patton said he was disabled from a severe trucking accident. Patton said he thought this was done by a jealous boyfriend."], ["TN0096", "04-15-2011", "Open", "Routine", "", "TBI Find Call", "At 5:35 p.m. IA Johnson received a call from Andrea at 303-875-6083. Andrea lives in NY & said she is a medium who recently saw the report on the missing girl in TN.  Andrea said she is picking up on information from the other said that the man that took Holly is either wearing or has worn hunting goggles. Andrea said he is involved in hunting in some sort of way. Andrea said she would like to call back when she is able to receive more information she is able to pick up on."], ["TN0067", "04-15-2011", "Update", "Routine", "", "In person", "SA Pate called Robbie Middleton - left message, has not called back. Spoke to Karen Lancaster. Still unable to locate Paul Ray Pruitt. He is a suspicious person who lives in the area but could not give specifics on how to find him."], ["TN0097", "04-15-2011", "Open", "Routine", "", "", "TIES Operator Belinda Allender took a call from an Alaskan State Trooper Phone #(907) 235-3001. He called to report that a computer tech named Cy St. Amand ph.#(907)299-2756 reported to him that he has been watching Holly Bobo's facebook page. He stated that a guy named Blake A. Side had posted odd things to Holly's facebook page and now has suddenly stopped posting to the page."], ["TN0098", "04-15-2011", "Open", "Routine", "", "In Person", "Steve Warner - photographer from Nashville, has been taking pictures of Natalie Bobo first cousin to Holly Bobo, provocative and nude photographs. Photos have been taken in Decatur County, Warner does not know the victim personally, but does know of her."], ["TN0098", "04-15-2011", "Update", "Routine", "", "Email", "On April 15, 2011 at 3:00 pm SA Colleen McEachen and SA Mike Smith went to the residence of Steve Warner, W/M, DOB: 07/06/1970, SSN: 412-49-6734, at 3724 Bakertown Road, Nashville, Tennessee 37211. Initial contact was made with Bobby Swaner, W/M, DOB: 02/14/1962, SSN: 410-21-9947, Swaner had Agents enter the residence and called out to Warner, who was on the computer in a bedroom. Agents immediately noticed that Warner appeared to be severely disabled and required the use of a crutch in order to walk. Agents explained that they were there because of the disappearance of Holly Bobo and because of his familiarity with Bobo's cousin, Natalie Bobo. Warner stated that he had seen information on the news about the Bobo disappearance and though he had never met or spoken with Holly, had previously photographed Natalie. Warner stated that Natalie lives about five miles from his mother in Parsons. Waner stated that he had photographed Natalie last Summer and had not seen her since. He fiuther stated that he was last in Parsons two weeks ago. On 4/13/11, Warner said that he, his father, and Bobby Swaner, who all reside at the Bakertown Road address, had been home. Swaner confirmed that information. Warner stated he had watched television, was on the internet, etc. A monitor in the residence showed numerous inside and outside surveillance video of the residence. Warner explained that the cameras were in place because his father had alzheimers and stated that he could provide video of himself, his father, and Swaner at the residence on 4/13/11. The walls were covered with photographs that he had taken of young women through his \"photography business\". Agents looked at the photographs, and although many of the females looked as of they might be in their mid to late teens, all of them were fully clothed."], ["TN0098", "04-15-2011", "Closed", "", "", "In person", "As per SA Mark Lewis based on SA McEachen's email has closed this inquiry."], ["TN0067", "04-15-2011", "Update", "Routine", "", "CP", "19:25 TBI SA Doug Pate and TBI SA Cathy Ferguson contacted Pary Ray Pruitt's girlfriend Judy Onan, phone 731-733-2467, who said she was with Pruitt from Sunday night 10 Apr 11 to Thursday night 14 Apr 11 unitl approximately 19:00 hours. Pruitt was arrested by Decatur County Sheriff's Officers Thursday night 14 Apr11 11 and is still in custody"], ["TN0099", "04-15-2011", "Open", "Routine", "", "TBI SA Pate", "19:57 TBI SA Doug Pate called Chaisty Kee, a manager of the Sonic in Huntington, TN. Kee's number is 731-986-8555. Ms. Kee stated that on Wednesday 13 Apr 11 at approximately 21:30 a FW who looked similar to Victim Bobo came to the Sonic in a Gold Dodge Stratus missing a left rear wheel cover. The FW was wearing a blue \"Kentucky\" tee-shirt. A MB wearing a purple shirt and shorts was a passenger in the Dodge. The FW did not appear to be in distress. SA Pate also spoke with Courtney Smith, a car-hop at Sonic, who stated the car was a Silver Dodge Stratus and the FW was wearing a long sleeved Kentucky tee-shirt. The Dodge had a temporary tag in the back window."], ["TN0100", "04-15-2011", "Open", "Routine", "", "TIES", "20:49 LEIC Belinda Allender received a call at 20:41 from Tony Calaberse in Ohio, phone number 731-736-1293. Calaberse advised he was on the computer doing a search on Holly Bobo and found a site www.facebook.com/allain.robichaud. When you click on this persons friends you will find Holly Bobo listed. When you click on this site www.facebook.com/profile.php?id=1649557905. Calaberse advised that the site looked to him if it was bogus with only 7 friends listed, all girls, but for the boy listed."], ["TN0101", "04-15-2011", "Open", "Routine", "", "Citized Calle", "21:40 TBI SA Lewis advised that a truck driver, Tommy Hughes, cell phone 662-706-2676 called and stated on Thursday, 14 Apr 11 he saw a FW walking on I40 at MM 170. TBI SA Joe Craig made contact with the Drug Interdiction Units that patrol that area and they advised they have not seen anyone matching Victim Bobo's description on the Interstate."], ["TN0102", "04-15-2011", "Open", "Routine", "", "CP", "21:45 FBI SA Bilnoski and Upton spoke with a witness who stated they saw 2 MW on Conrad Ridge Road, Decatur County running out of the woods and drive off in a Silver Dodge Intrepid. One MW was carrying a small black box. Both MWs were wearing camo. One MW was identified at Jeff Miller, DOB 08/09/1972, residence is 1264 Yellow Springs Road, Holladay, TN. An attempt to locate Miller was unsuccessful. The is no informaton on MW #2."], ["TN0103", "04-15-2011", "Open", "Routine", "", "CP", "22:12 TBI SA Lewis advised that Jackson Police Officer Dwayne McLean (Ph: 731-467-1209) called and reported JPD has warrants for Stalking/w Sexual Related for Jason Nickell MW/DOB 04/01/1972, H/A 1815 Liberty Church Road, Holladay, TN. Officer McLean knew Nickell's residence was close to the area being searched for Victim Bobo. \n\nDickson Police responded to a call on 07 Apr 11 to 413 West College Street in Dickson, and spoke with FW Marketta Kennedy, who stated she was walking home on College Street and a MW with dark hair pulle up next to her in a blue/gren two door car. The car has passed by her a couple of times. MS Kennedy stated stopped and asked her for directions to a tattoo shop and showed her a business card and when Ms. Kennedy leaned in the window to look at the card the MW grabbed her by the wrist, and she then saw the MW had his pants pulled down. Ms. Kennedy broke away from the MW and ran home.\n\nA photograph of Nickelly was obtained and sent to Dickson PD, who showed a Photo Spread to Ms. Kenney, who identified Nickell as the suspect who grabbed her.\n\nUSMS and FBI Agents located Nickell at his residence and are conducting at interview."], ["TN0104", "04-15-2011", "Open", "Routine", "", "Phone", "At 10:05 PM LEIC Belinda Allender received a call from a Ralph Girardin on Michigan (810-794-0941)\n\nHe advised that his family was returning from a vacation in FL when they stop to gas up in Pioneer, TN on the 11th of April at 3:43 PM.\n\nThey saw a white man in camo clothes with camo paint on his face at the Shell station.  He got into a cark drab looking Jeep Cherokee.  He also advised that he believes that he saw what looked like a M-16 between the seats as the man got into the Jeep.  He also noticed that the man in the Jeep got onto Hwy 75 going south bound."], ["TN0105", "04-15-2011", "Open", "Routine", "", "CP", "23:15 TBI SA Dicus followed up on information from Homeland Security that search members identified Stone Lewis as acting suspicious in the area of Gooch Road. This occurred on 15 Apr11 at approximately 17:00. Stone asked about what would happen to anybody that \"let her go\" and whether the searchers found the bloody school bag.\n\nSA Dicus, Carpenter, and Long interviewed Stone Lewis with his mother present. Lewis is 16 years of age and is a student at Riverside High School. Lewis was in school on the day of the kidnapping. Lewis's mother and step-father confirmed this information. No further action at this time"], ["TN0105", "04-15-2011", "Closed", "", "", "CP", "NO further action per SA Dicus."], ["TN0106", "04-15-2011", "Open", "Routine", "", "CP", "23:00 TBI SA Doug Pate. Ben Steele, phone: 731-602-0505, reported that Richard Logan Woods was a patient at Buffalo Valley Treatment Center with Walter Anderson, who stated that Woods was obsessed with a female. Woods father is Judge Rick Woods. Judge Woods was contacted by phone number 731-549-4371 and advised that his son, Richard Woods was at home on 04/13/2011 when Judge Woods left for work. Richard Woods was contacted and stated his girlfriend at the time was Chelsey Jowers and is currently. Richard Woods stated he was at home at 94 Dogwood Drive, Parsons, TN on Wednesday 13 Apr 11. No further action at this time per SA Pate."], ["TN0106", "04-15-2011", "Closed", "", "", "SA Pate", "Event closed per SA Pate."], ["TN0107", "04-16-2011", "Open", "Routine", "", "Phone", "I just received a call advising that one of the friend's on Bobo Face Book page is a Timothy Woods and the caller advised that there is a Timothy E. Woods on the Sexual offender list that lives in Lexington, TN.\n\nBelinda C. Allender\n\nTIES"], ["TN0108", "04-16-2011", "Open", "Routine", "", "SA Dicus", "00:20 TBI SA Dicus. Search teams recovered panties, two receipts with Holly Bobo's name, a one dollar bill, school paper, duck tape, lotion, cammo mask, one left flip/flop shoe, Dr. Pepper can, a piece of paper with hair, a Maxie Pad, and a gum box, on Yellow Spring Road, Pugh Road, and Holly Springs Road. These items indicate direction of travel was north from victim's residence."], ["TN0094", "04-16-2011", "Closed", "", "", "SA Frizzell", "00:10 SA Mike Frizzell advised the IP address is located in Southern California. No further action required."], ["TN0114", "04-16-2011", "Open", "Routine", "", "", "LEIC Purviance arrived at Command Post and relieved LEIC Anthony."], ["TN0110", "04-16-2011", "Open", "Routine", "", "", "LEIC Stanfill received call from Jeff Murphy(937)307-0527 at 7:08 am. He stated that he was driving South of Eaton, OH between 9:00 and 10:00 am on Friday 4-15-11. He said that he was on Hwy 127 and turned right on State Rd. 744. On the on ramp, there was a small gray or sliver car parked on the side of the road. There was a blonde female standing by the car and the driver's side door was open.  He said there was a man sitting in the driver's seat and he was taking off camouflage pants."], ["TN0109", "04-16-2011", "Open", "Routine", "", "Phone", "TBI SA Mike Frizzell advised that a message on WSMV Facebook stating \"I have her body in the closet\" was traced by IP address to Michael Sanders in Franklin, TN. SA Frizzell and another agent were going to speak with Sanders. SA Frizzell stated Sanders does not appear to be involved."], ["TN0113", "04-16-2011", "Open", "Routine", "", "SA Lewis", "Tommy Stevens 731-549-4702 on Wednesday at approximately 1 pm at intersection of Youal Gibson Rd and 641 he saw a white male in his 60's, approx 5'11, he was not wearing camaflouge, parked on side of road, walking around truck with passenger door open with a rock in his hand. Truck is brown, 4WD newer model, bed cover, MO tag. Unknown if anyone else was with him. TN OHS Joey Hudgins searched the area in and around this location and did not find anything."], ["TN0112", "04-16-2011", "Open", "Routine", "", "Email from Norma Raleigh", "Norma Raleigh received a call from a female by the name of Patty Garrison and phone number of 847-534-9446. Caller stated on 4/15/11 around 1720 hours Illinois time, the caller feels certain she saw Holly Bobo at the Deerfield Bakery. Number for the bakery is 847-534-0068. The female was wearing a light tan coat, black pants, brown boots, tall shaft hair pulled back in a ponytail. In the company of a B/M in his 30's wearing a brown blazer, jeans and a black driving cap/golf type short bill pulled down to the eye area. Caller stated they arrived in a car but does not remember the description at all of the vehicle on that it was a car and both subjects looked out of place and very richly dressed. She stated the female was very striking in appearance. Caller stated O'Hare airport is within 7-8 miles of the bakery. Schaumberg PD is going to the bakery."], ["TN0115", "04-16-2011", "Open", "Routine", "", "800 TBI  FIND", "Larry Spitler - (734) 225-0019 or (479) 270-5801. Mr. Spitler called and advised that he was at the Missouri and Arkansas state line at the MacAdoodles Center at approximately 10:00 a.m. yesterday, April 15, 2011. Mr. Spitler stated he saw a female matching the victim's description wearing a pink top, jean shorts and a plaid pull over and large sunglasses. She talked to several African American children wearing name tags and then crossed the parking lot and got into a faded green pickup."], ["TN0115", "04-16-2011", "Update", "Routine", "Missouri Highway Patrol", "SAC J Powell", "SAC Jerri Powell advised LEIC Allen to contact law enforcement in Missouri to have the rest area checked for surveillance video. LEIC Allen will be calling the Missouri Highway Patrol for assistance."], ["TN0112", "04-16-2011", "Update", "Routine", "Schaumburg Illinois Police Department", "Phone", "LEIC Allen spoke with patrol Lt. Kurt Metzger with Schaumburg Illinois Police Department. He advised he spoke with personnel at the bakery and the owner would be in today to review the video. Lt. Metzger advised he spoke with a worker that remembers seeing a blond female in the bakery but not the black male. He will contact TBI back with additional information as it becomes available. Schaumburg Police Department contact number is (847) 882-3534 and (847) 456-3030 is his cell phone."], ["TN0115", "04-16-2011", "Update", "Routine", "Missouri Highway Patrol", "Phone", "LEIC Allen spoke with Dispatcher Quint of Troop D with the Missouri Highway Patrol. She is dispatching a trooper to check for footage at the truck stop and will advise back when she hears from the trooper"], ["TN0013", "04-16-2011", "Closed", "", "", "", "negative information located.  He said he woke up at home and took his wife to work between 8-8:30AM. He took her to work at Sonic in Parsons. From there he went to Betty Jurnes to pick up some money that she owed him for moving some furniture. Then he went to the Delta gas station and purchased gas and paid with a check. After buying gas he went to pick up Thomas Hurd at Parsons at about 1:30 PM. (Thomas Hurd phone: 731-733-3145.) Then he and Thomas Hurd went fishing at Whites creek all day. Then left Whites Creek and picked up his wife at Sonic at approximately 5:30PM. The only discrepenacy, is on the coffee table there was a spiral notebook where someone had written SONIC Hours, 4/13 10:27AM to 5:05PM. According to the notebook she didn't start work until 10:30 and he says he dropped her off at 8:30. She did say she got to work early that day. Brandon Kelly: SSN 411-39-7336, DOB 5/22/82, residental address: 4430 Highway 100 East, Decaturville, TN cell: 731-487-4116."], ["TN0015", "04-16-2011", "Closed", "", "", "", "connected to TN0013"], ["TN0020", "04-16-2011", "Closed", "", "", "", "was relieved by LEIC  Anthony"], ["TN0116", "04-16-2011", "Open", "Routine", "", "", "LEIC Stanfill took a call from Dewayne Turner (256) 350-8121 home phone or (256) 566-3915 cell phone.  He stated that on Friday 4-15-2011 he was driving south of Lawrenceburg, when he saw a blonde lady driving a small four door white car.  He said that she was stopped at a stop sign in the area of Liberty Grove on Hwy 227 north.  He said that she was acting very odd and kept looking into to back seat several times."], ["TN0115", "04-16-2011", "Update", "Routine", "Missouri Highway Patrol", "Phone call from Trp Patterson", "LEIC Allen spoke with Trooper Patterson 1127. He is in route to the location and would check with the truck stop for footage. He was given the complainant's phone number."], ["TN0017", "04-16-2011", "Closed", "", "", "SAC J Powell", "Negative Results"], ["TN0016", "04-16-2011", "Closed", "", "", "SAC J Powell", "Negative Results"], ["TN0023", "04-16-2011", "Update", "Routine", "SA Mark Lewis TBI", "ASAC J Locke", "Majority of Sex Offenders have been checked per SA Mark Lewis"], ["TN0122", "04-16-2011", "Open", "Routine", "", "Tip given to FBI @ CP", "Christy Blackstock came to CP with cellphone 731-733-6400 and home number of 731-847-4643. She stated to SA Art Viveros and SAC John Mehr that Stacy Rice works at the Tip Top convenience store on Hwy 60 in Parsons and is said to know about a Roger Thornburg who knows something about Mexicans involved in drug activity in Decatur County and law enforcement had prior knowledge before making contact with Roger Thornburg. Local law enforcement tried to locate Roger about the Stacy Rice subject but failed. Christy knew the same info as Thornburg. Approximately 1 hour ago contact was made by SA Art Viveros of FBI and the interview revealed Christy had no information in regards to Mexicans and their drug activity and Holly Bobo's dissapearance."],
