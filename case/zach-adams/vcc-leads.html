searched the house. No evidence recovered. No apparent link to the case. Request CLOSURE."], ["TN0600", "04-24-2011", "Closed", "", "SA Brent Booth", "SA Nathen Bishop", "No apparent link to case."], ["TN0517", "04-24-2011", "Closed", "", "", "lead sheet", "CLOSE PER SA NATHN BISHOP"], ["TN0516", "04-24-2011", "Closed", "", "", "lead sheet", "Request CLOSURE Per SA Nathen Bishop. The cave area has been serched by Park Rangers. The source has no direct knowledge."], ["TN0549", "04-24-2011", "Update", "Routine", "SA Ronnie Faulkner", "", ""], ["TN0583", "04-24-2011", "Update", "Routine", "", "lead sheet", "4/24/11 SA R. Faulkner contacted Investigator Tommy Langford at the Dyersburg Police Dept. and requested a follow up."], ["TN0601", "04-24-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "phone call", "Tony Calabrese (234) 736-1293 called regarding a corporate jet that left the Beech Regional Airport at 8am the day Holly went missing.  Mr Calbrese has called in before with a facebook tip (incident #100) and he stated this time that \"they\" (a group of people that are doing online research) feel Holly is a victim of human trafficking and he has much more information to provide. He also thinks we need to investigate a company called Suncoast Air in Venice Fl. Believes Holly was abducted then flow to FL to be a sex slave...Tony called back and stated he made contact with the company in Florida and spoke with a woman that believes she saw a blonde hair female in a pink tshirt get off a plane the morning of Holly's abduction and she stated she appeared to be drugged. The contact number Tony used for the company was 941-485-1799 but he did not have a contact person because the woman would not give her name."], ["TN0310", "04-24-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "lead sheet", "Interviewed Carolyn Rogers. Subject has already been interviewed by FBI SA DeAna Fargas. SA Miller interviewed her again on 4/23/11. No useful information. Request Closure."], ["TN0599", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Assigned to FBI SA Champin"], ["TN0598", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", ""], ["TN0597", "04-24-2011", "Closed", "", "", "lead sheet", "No direct knowledge to case"], ["TN0602", "04-24-2011", "Open", "Routine", "", "lead sheet", "Joey Hudgins (TNOHS) provided videos on thumb drive from BP Store at Parkers Crossroads. 6 am to 12 noon."], ["TN0602", "04-24-2011", "Closed", "", "", "", "Closure requested."], ["TN0163", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Assigned to FBI SA Tom Hassey."], ["TN0604", "04-24-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "phone call", "Jim Phillips (731) 549-5581 called in regarding a supicious white ford ranger he saw this moring around 9am. Mr Phillips stated when he was on his way to pick up his mother for church he noticed a white Ford Ranger at the last bridge on Darden Bottom Rd trying to get thru an iron gate that is blocking access. Mr. Phillips stated there were two people in the truck but he only was able to give a description of one, 20's W/M reddish brown hair with a shaggy reddish brown beard wearing a white T-shirt and jeans. Mr Phillips stated when they saw him drive by they quickly back out and went across the road to New Canal Rd."], ["TN0603", "04-24-2011", "Open", "Routine", "", "lead sheet", "Assigned to Larry Mullins (TNOHS)DVD's of video at McDonald's @ Sparks Crossroads. Video from 6am to 7 am and 7 am to noon."], ["TN0603", "04-24-2011", "Closed", "", "", "", "Video obtained and turned over to TBI/FBI TECH."], ["TN0605", "04-24-2011", "Open", "Routine", "SA Jeff Jackson", "lead sheet", "Call received by John Mehr. Brittney Brown was attacked a Red Box about 4 months ago.  Possibly in Lexington."], ["TN0606", "04-24-2011", "Open", "Routine", "", "Clint Bobo (Holly's brother)", "There is a 35-36 year old man who rides 4 wheelers with all the young kids in the \"Colons\" near Perryville. John Paul Aaron used to do hard drugs and lived a rough life. Claean as long as Clint has known him. Approx 2008."], ["TN0607", "04-24-2011", "Open", "Routine", "", "KAREN BOBO", "Karen reports that NATHAN LINTON once sent Holly a rude message because she told him not to call her anymore. She suspected Lee Baugus may have put him up to it. This happened within the last 6 months."], ["TN0608", "04-24-2011", "Open", "Routine", "", "KAREN BOBO", "Ben Steele runs with Jonathon Dodd and fits the description\\frame of the person Clint saw with Holly."], ["TN0609", "04-24-2011", "Open", "Routine", "", "Karen Bobo", "Karen reported that Natalie Bobo claims she told LE about John LNU who lives with Grafton Dodd. Natalie went to the movies with him once. He is possibly an ex-con."], ["TN0610", "04-24-2011", "Open", "Routine", "", "lead sheet", "Derick Scott was at the 412 Nightclub and the owner, ALi-Khan called hom to the back and advised that they should check Miami, FL. Stated Natalie Bobo may have had a contract with a modeling agency there tht she didn't follow through with;this modeling agency is known to \"come get that person or someone in their family\" Victims often in Jackson,Nashville, Miami, etc."], ["TN0611", "04-24-2011", "Open", "Routine", "", "Karen Bobo", "Grafton Dodd owns 13 properties aound Decatur County. The family was previously unaware of most of these properties. (Information is attached to lead sheet) Plus 2 in Henderson County."], ["TN0611", "04-24-2011", "Closed", "", "", "Karen Bobo", "Grafton Dodd's properties have been searched numerous times. Dodd is cooperating. CLOSE Per SA Bishop"], ["TN0612", "04-24-2011", "Open", "Routine", "", "Karen Bobo", "Johnathon Dodd was getting a haircut at a Barber shop yesterday and told the employees that he din't even know Holly Bobo."], ["TN0612", "04-24-2011", "Closed", "", "", "Karen Bobo", "Request for CLOSURE per SA Bishop. Johnathon Dodd has been interviewed. Inforamtion passed on to case agent."], ["TN0613", "04-24-2011", "Open", "Routine", "", "lead sheet", "Joey Hudgins (TOHS)provided a list of people that stayed at the America's Best Value Inn."], ["TN0613", "04-24-2011", "Closed", "", "", "lead sheet", "Obtained list. Turned in to case agent SA Dicus. Closure Requested"], ["TN0614", "04-24-2011", "Open", "Routine", "", "lead sheet", "Joey Hudgins (TNOHS) Knights Inn 21305 Hwy 22N Wildersville, TN 38388. Obtained receipts of people that stayed at this location April 12-13, 2011."], ["TN0614", "04-24-2011", "Closed", "", "", "lead sheet", "Turned in receipts to SA Dicus. Closure requested."], ["TN0605", "04-24-2011", "Closed", "", "SA Jeff Jackson", "unkown source on lead sheet", "Already interviewed 3 times. 2 times by FBI and 1 time by TBI. Attack was over a year ago and was over a standard motorist she refused to help. No useful information."], ["TN0615", "04-24-2011", "Open", "Routine", "", "phone call", "Courntey West (731)307-1843 called regarding a conversation she heard Clint Bobo and Flint Perkins had last summer at the river.  Courtney stated that she use to date Flint and last summer they were all at the river when the conversation of how to hide a body came up. Courtney stated that Flint said he would attached to body to concrete and drop it in the river. Courtney stated Clint didn't really say anything. Courtney stated this info may not be useful but the conversation stuck in her head and she felt she needed to report it."], ["TN0616", "04-24-2011", "Open", "Routine", "", "Citizen Frank Evans-Lead Sheet", "Frank Evans reported to have video security system at end of driveway."], ["TN0616", "04-24-2011", "Closed", "", "", "", "Evans contacted and system reviewed. Did not record. No Value. CLOSE per SA Bishop."], ["TN0544", "04-24-2011", "Closed", "", "", "", "The FBI Evidence Response Team took the evidence to dry. Andrew Huckstadt (901) 229-2780 took control of the evidence. TBI SA Harmon took charge of a plastic bag of garbage and yellow cotton sheet containing a \"Shake and Bake\" meth lab. SA Harmon notified Sheriff Wyatt whose deputies will take charge of the Hazmat."], ["TN0593", "04-24-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "Lead Sheet", "Cody Scott posted on Facebook acct in Nov. \"how do you tell someone that you like them?\" the \"she might like my cousin more, maybe one day she'll like me ore.\" Pelkey believes Holly's boyfriend is the cousin of Cody Scott. Scott interviewed and claimed to be at H.S. on day of question. Confirmed Scott at Riverdale H.S. on4/13/11. Citizen Franklin Pelkey 518-563-6534."], ["TN0593", "04-24-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "SA Bishop requested for lead to be CLOSED."], ["TN0359", "04-24-2011", "Update", "Routine", "", "lead sheet", "Lead checked by FBI SA Jeff Dale. Property searched and interview completed on 4/24/11."], ["TN0359", "04-24-2011", "Closed", "", "", "lead sheet", "CLOSE per SA Bishop."], ["TN0542", "04-24-2011", "Closed", "", "", "lead sheet", "The source has a habit of calling in tips during homicide investigations. Subject possibly mentally ill. Close per SA Bishop."], ["TN0617", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Investigator Travis Hill with the Forrest City Police Department in Arkansas called in reference to information they had received. Investigator Hill stated a Dwight Hamilton (832) 785-3920, called to state on April 13, 2011 he picked Holly Bobo and a male gentleman up in West Memphis Arkansas and dropped them off at the Earl Truck Stop around the 250 mile marker on I-40 West. Mr. Hamilton stated they were trying to get to California. The distance from where Mr. Hamilton picked the 2 individuals up and dropped them off is about 20 miles. Investigator Hill stated they have a recording of the phone call. Also, Investigator Hill was going to Earl Truck Stop on this date and try to retrieve a copy of the video from April 13th. Investigator Hill can be reached at the police department at 870-633-3434 or his cell phone at 870-261-5994."], ["TN0618", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Mr. Glenn Rutherford called in 4/25/11 to report information he had reported back on April 17th along with some new information. Mr. Rutherford owns the Riverbreeze Estates property in Sugar Tree, TN. Mr. Rutherford stated there are currently only 2 houses on the property of 272 acres at this time; 1 of them being his and it is under construction. The other property is owned by a Ben Bayless whoe is a Fed Ex pilot. Mr. Rutherford stated Mr. Bayless called him and told him that on Saturday April 16th around 11:30 pm he saw something odd across from the bay. There was a 4 wheeler or ATV that sat with a light on the water for a long period of time. Mr. Bayless flashed a light back at them, went and got his gun and then got in his truck to go after them but they fled. This area is not a readily accessible area. Mr. Rutherford stated he called the Decatur County 911 on April 17th and then someone from the Command Post called him back possibly by the name of Larry and told him that it might have been someone looking to steal copper. Mr. Rutherford has not seen anyone come on the property or call him in regards to this incident. Mr. Rutherford also stated he had an unusual circumstance with an employee. Mr. Rutherford stated he had to terminate Jeff Miller for misconduct on April 12, 2011. Mr. Miller had been on the Riverbreeze property making meth. When Mr. Rutherford confronted Mr. Miller he stated he was on the property but not making meth. He was down there with a female that a Judge had ordered he have no contact with. Supposedly he had beat her and held her hostage at some point and thatåÀs what the no contact order was in regards to. Mr. Miller is a huge hunter, approximately 5:10 and knows the woods better than anyone in the area. Mr. Rutherford would just like for an agent to call him and let him know if they have been to that area and searched. This LEIC checked the VCC for a prior entry but did not locate one in regards to this tip. Mr. Rutherford # 731-697-7796"], ["TN0619", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Mr. Craig Leeth called to state he needs to talk to someone in regards to the Nickells subject. Mr. Leeth stated Nickells father is a Fred Buckalew. He lives north of Huntington. Mr. Leeth stated he deals with the Amish community as well does Mr. Buckalew. The Amish have stated Fred Buckalew had a brief case with Holly's shoes in it. When Mr. Buckalew knew his son had been arrested he took the briefcase and hid it so no one could find it. Mr. Leeth stated he is on his way to Decatur County now to speak with someone. He would like for someone to call him at 931-334-3095."], ["TN0620", "04-25-2011", "Open", "Routine", "", "TBI FIND", "Psychic (Liz) short for Elizabeth ( 989 866-2407  ) called TBI advising the following information.  Holly was in deeper water, however she is now in a creek close to her parents home.  A younger man in his late twenties, 511 to 600 tall is the offender.  She can be reached any time."], ["TN0620", "04-25-2011", "Closed", "", "", "TBI FIND", "Per Jerrie Powell close all psychic calls"], ["TN0621", "04-25-2011", "Open", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Source: Clint and Karen Bobo. Agent needs to interview Chad Marshall."], ["TN0622", "04-25-2011", "Open", "Routine", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Agent needs to interview Eric Jones, phone 731-733-0348."], ["TN0623", "04-25-2011", "Open", "Routine", "", "", "Assigned to Little Rock FBI who will follow up to get video from BP Truck Stop (FBI SA Viveros).\n\nA truck driver, Dwight Hamilton, stated he picked up a MW and FW two Wednesdays ago in West Memphis, AR at Exit 278. The FW was wearing jeans and a pull-over. The MW was wearing camo. They were dropped off at Earle, AR. They said they were from Decatur County."], ["TN0624", "04-25-2011", "Open", "Routine", "", "Lead sheet", "Received information to check out Richard Townsend as a possible suspect. On 4/24/11 SA Faulkner and SA Jackson spoke with Townsend and his mother, Wanda, at 1145 e Main st Parsons which is his parents residence and richard is currently living there."], ["TN0624", "04-25-2011", "Closed", "", "", "Lead sheet", "Richard was interviewed and his alibi was verified for the day of the abduction.  Closed per SA Bishop"], ["TN0625", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Michael Murphy from Florida called to state he sees things and has visions. He keeps seeing a man that takes Holly through the woods on an ATV. He is somewhere close by. The ATV is parked in a yard that is overgrown and not well kept. He keeps seeing a corner of a house that appears to be wood and has blue on it at some point. The man works around there and is an avid hunter. Mr. Murphy can be reached at 561-543-5436."], ["TN0625", "04-25-2011", "Closed", "", "", "TBI Find Line", "Psychic lead."], ["TN0594", "04-25-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Closed per SA Bishop"], ["TN0626", "04-25-2011", "Open", "Routine", "", "", "Shelly D. Keen, FW/DOB 09/28/1980, phone number 731-733-2288, address 65 Glennrick Drive, Parsons, TN. A friend of Holly Bobo. Met Natalie Bobo when Keen was working at Joe's Video and Tanning Salon in Parsons. Natalie and Holly would come in together. That was in the spring of 2009. Natalie's father did not like Keen and broke up their friendship. Natalie worked at a strip club in Corinth, MS, and bragged about the amouth of money she made. Natalie worked there all summer 2010."], ["TN0534", "04-25-2011", "Closed", "", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "", "Closed per SA Faulkner"], ["TN0626", "04-25-2011", "Closed", "", "", "", "Information confirmed by Joe Walker. Case agent was notified and added the information to file on Natalie Bobo. Event closed by SA Jeff Jackson."], ["TN0630", "04-25-2011", "Open", "Routine", "", "", "Tina Crews, cell phone 731-614-3765, friend of Karen Bobo. Tina was driving in Beach Bluff, TN and passed a car on Crucifer and White Faron. It was a small car, possibly a Corolla, spray painted dull black with a small fin on the back. She noticed a girl with long blond hair and a small face in a green shirt. Approximately 25 mintues later in the opposite direction, she saw the same car at the BP gas station with a Baskin Robbins. He backed into a spot and went inside. He was 6', sunglasses, white cap with wide brim and black wirls on it, dark hair, 19 to 20 years old, wearing jean and a white tee-shirt. The blond girl was no longer n the vehicle, or seen in the vehicle. She followed the vehicle back from Lexington to Parsons where it turned ont Corinth Church Road off 412, which leads back to the Bobo's neighborhood. The license number is 481-TPH."], ["TN0627", "04-25-2011", "Open", "Routine", "", "phone call", "Received a call from Caprese Roncali.  She is a distant cousin of Holly Bobo.  Her phone number is 816-633-2096.  She stated she lives in Independence, Missouri.  A male suspect tried to attack a college student there with a box cutter.  He got away but she thought there could be a link between these two suspects."], ["TN0631", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Tara 815-257-1336 stated that she is not a psychic (was very nervous) and the man responsible has a name that begins with a 'J' (like Jeff or John), wears glasses, has hair lose, lives in a green house with white shutters, lives by himself, no kids (may have an ex-wife), no animals, a room downstairs with a filing cabinet and a desk. The house has a new fence. He likes to listen to loud music."], ["TN0631", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-psychic"], ["TN0556", "04-25-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Close per SA Bishop"], ["TN0666", "04-25-2011", "Open", "Routine", "", "", "Randall Hughes fired from McKenzie Did work with Dana called Clint a couple of weeks before this happend wanting to sale all his stuff including Four Wheeler tires and wheels subject is bad on drugs.Hughes Texted Clint the morning it happened,has  been out by the house,stopped and talked to Dana on the road.Randall phone# 731-733-1445."], ["TN0622", "04-25-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Closed per Sa Bishop"], ["TN0234", "04-25-2011", "Update", "Routine", "", "", "SA McEachen and SA Travers advised that they were able to make contact with the Centerville PD and there is an incident report that was made.  SA McEachen is going to have the incident report faxed to HQ. Per booth agents there was no suspect information on the incident report."], ["TN0632", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Joe Zingher called from Illinois wanted to give information on a way to help search for Holly Bobo. He said he works with the ATM Crime Initiative and believes Holly is a victim of Express Kidnapping - ATM. He said the geocoding can be done and data can be captured from other ATM's that may link to other similar crimes. He said once he saw that Duck Tape had been used, he knew that duct tape ia a big part of the crime trend. He would like to email someone the information that he has. He can be reached at 847-672-8519 (home) or 847-650-3114 (Cell)."], ["TN0668", "04-25-2011", "Open", "Routine", "", "", "Corey Stewart has followed Whitney one day when she was in Scotts Hill Runnning .He at one time was on Holly's Clint's and whitney's facebook.He put up a bad picture they all deleted him.He has tried to add him back."], ["TN0670", "04-25-2011", "Open", "Routine", "", "", "Blake Barnett and JOdi Borron or Corey Borron  got in trouble about stolen GPS's and guns.Blake had to become the informant to get himself out of trouble.Blake may have still cared for Holly or held a grudge don't know which."], ["TN0591", "04-25-2011", "Update", "Immediate", "", "", "Closed per SA Bishop-information only\n\nRe-Open per SA Lewis"], ["TN0588", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-Information only"], ["TN0589", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-no direct knowledge"], ["TN0587", "04-25-2011", "Closed", "", "", "", "Closed-Psychic"], ["TN0582", "04-25-2011", "Closed", "", "SA Jeff Jackson", "", "Closed per SA Bishop-information only"], ["TN0578", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop"], ["TN0563", "04-25-2011", "Closed", "", "", "", "Close-psychic"], ["TN0633", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Paul Creswell 901-263-5181 stated he has been studying the Facebook pages of Holly Bobo, Drew Scott, and Clint Bobo and based on his research feels that the investigation needs to take a strong look into Joe Christensen. He is listed as a friend of Drew Scott. He brags about being muscular, goes to school, and lives in Camden. The caller stated that often it is the friends of someone the victim knows that is involved."], ["TN0562", "04-25-2011", "Closed", "", "SA Jeff Jackson", "", "Closed per SA Bishop-interview complete"], ["TN0634", "04-25-2011", "Open", "Routine", "", "TBI FIND", "Caller Jack 901 289-8772 wanted to advise TBI of a shady character - Mike Huddleston.  He has emailed Jack copies of women duct taped in the past.  Huddleston raped a women in 1993 but the women didnt file charges. Jack knows that he raped her. Huddleston is the owner of the River Bar. off hwy 98 or 412. Jack can answer more questions about Huddleston if needed."], ["TN0541", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-information only"], ["TN0535", "04-25-2011", "Closed", "", "", "", "Closed-psychic"], ["TN0509", "04-25-2011", "Closed", "", "", "", "Closed-infromation only"], ["TN0465", "04-25-2011", "Closed", "", "", "", "Closed-information only"], ["TN0450", "04-25-2011", "Closed", "", "", "", "Close per SA Bishop-information only no direct knowledge"], ["TN0441", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-information only"], ["TN0426", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-No direct information"], ["TN0345", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-Information only"], ["TN0350", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-no direct information"], ["TN0319", "04-25-2011", "Closed", "", "", "", "Close per SA Bishop-no apparent connection"], ["TN0315", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-area being searched on horseback"], ["TN0316", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-no direct information"], ["TN0635", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Earl McClanhan 615-644-5388 stated that Holly Bobo is still within a four square mile from where she walked into the woods. The caller knows that the area has been searched but he knows that she has been overlooked. If the blood that was found was not Holly's then agents need to call him because he can help. He has been doing this type fo work for many years and currently working on a case in Virginia. He gets his knowledge through research."], ["TN0306", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-interview was conducted"], ["TN0290", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-Caves have been searched"], ["TN0285", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-Interview conducted"], ["TN0284", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-interview conducted"], ["TN0283", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-interview conducted"], ["TN0240", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-caves have been searched"], ["TN0158", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-information only"], ["TN0157", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-Interview conducted"], ["TN0049", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-interview conducted"], ["TN0068", "04-25-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Close per SA Bishop-Alibi Verified"], ["TN0636", "04-25-2011", "Open", "Routine", "", "", "Drunk in bar making bizarre comments"], ["TN0636", "04-25-2011", "Closed", "", "", "SA Dicus", "SA Dicus and SA Jackson interviewed Rodney Tharp at 562 Roach Rd-Dad is alibi and verified for day of abduction. Lead closed"], ["TN0637", "04-25-2011", "Open", "Routine", "", "", "Check business locations around UT campus for surveillance video. If possible go back to date of abduction 13 Apr 11."], ["TN0638", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Christopher Lynn 731-847-6735 Conrad Ridge Road, stated that on January 7, 2011 he witnessed a man aiming a telephoto lens camera into his bathroom window. The caller said he is thin with long reddish hair so he could have been mistaken for Holly [a woman]. When the caller went to get his binoculars the man had retreated into the cab of a blue semi-truck/trailor. There was a trailer down the road from him on Conrad Ridge Road that was for rent. He noticed that the same or similar blue semi-truck parked outside the trailer. On March 19th at around 1630 a ford pickup was in front of his yard throwing cans. The man was in his 30s or 40s with dark hair. The pickup had a mower in the back. The caller stated he is online a lot so he does not know if it is just someone who is 'messing' with him. He made mention several times that he sleeps naked and walks around his house naked. That is why he ran people of his property the other day because a 13year old was looking in his window and he was naked."], ["TN0639", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Emily Kirk 615-513-7588 stated that this is only a theory but she noticed that on of the ROTC students at UT-Martin/Jackson is also a nursing major. The ROTC program trains people for mountain warfare and tactical ambush."], ["TN0549", "04-25-2011", "Closed", "", "SA Ronnie Faulkner", "", "Joey Tucsnak was located by SA Ronnie Faulkner. Tucsnak gave a written statement which is attached to the Lead Sheet and filed. Event closed by SA Faulkner."], ["TN0601", "04-25-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Closed per FBI Greg Adams and Caper Cronwell-information only"], ["TN0550", "04-25-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Per FBI agents Greg Adams and Capser Cronwell Grant is on his way to St louis for a death in the family and will not be avaliable for a few days.  Grant Adams new cell # is 731-307-0899"], ["TN0621", "04-25-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "per FBI agents Greg Adams and Capers Cronwell Chad Marshall was in attendance at the Tn Tech Center on the day of the abduction per his teacher. Lead closed"], ["TN0641", "04-25-2011", "Open", "Routine", "", "", "A 13 year old female overheard a conversation in Jackson, TN Saturday night. A subject named Deion Timberlake a MB from Lexington, TN said Holly was behind a house in Lexington in a shed tied up and police would not find her."], ["TN0640", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Ken Jones 831-236-3890 stated that he received an insight when he clicked on the story of Holly Bobo that the \"man\" was actually a large woman in fatigues and army boots."], ["TN0640", "04-25-2011", "Closed", "", "", "", "Psychic lead."], ["TN0642", "04-25-2011", "Open", "Routine", "", "", "at 1813 hours a female called in on the console line- the number- showed 731 614 2959\n\n \n\nthe female did not want to leave her name but had the following to state:\n\n \n\nthat she knows the Bobo family, and knows that Danny Burton was questioned reference to \n\nHolly missing. \n\n \n\nthe female wanted to know if TBI was aware that out around the 400 block of Darden\n\nChristian Chapel RD Burton and his wife own  house, that has been setting empty\n\nfor the last 3 years.\n\n \n\nthe house is described as teal green color siding. but empty."], ["TN0608", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-interview conducted"], ["TN0604", "04-25-2011", "Closed", "", "USMS John Walker, FBI-Jaine Corman 901-301-6825", "", "Closed per SA Bishop-information only"], ["TN0643", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Saudia Akins 731-415-9474 stated that she had two experiences in August 2010 with Jason Nickell. He was stalking her and she had him arrested in Camden."], ["TN0245", "04-25-2011", "Closed", "", "", "", "Close per SA Bishop-information only"], ["TN0644", "04-25-2011", "Open", "Routine", "", "Lead Sheet", "Darren Cooley,mail carrier on Swan Johnson Rd and was interviewed by SA Chris Miller"], ["TN0644", "04-25-2011", "Closed", "", "", "", "Close Per SA Miller-Cooley stated he has not seen any differenc ein vehicles or subjects"], ["TN0456", "04-25-2011", "Closed", "", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "", "Close per SA Bishop"], ["TN0494", "04-25-2011", "Closed", "", "SA Brian Harbaugh, Ronnie Faulkner 615-476-0799", "", "Close per SA Bishop"], ["TN0427", "04-25-2011", "Closed", "", "Acosta", "", "Close per SA Bishop"], ["TN0645", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "Virginia Andrews called to state she \"sees\" what happened. She states the brother killed Holly. He tied her up by her feets and hands and then put her in a garbage bag. He then buried her in red sand. She stated if his vehicle and closets were checked they would find red sand. She states he has access to all of her stuff and destroys it. She says he thinks he has an alibi. She stated if you look into the picture of Holly Bobo and look into her eyes, she will talk to you. Virginia's number is 901-463-0024"], ["TN0645", "04-25-2011", "Closed", "", "", "TBI Find Line", "Psychic information"], ["TN0646", "04-25-2011", "Open", "Routine", "", "", "Received a call from a pizza delivery guy named Landon.  He stated that he has been delivering pizza on Oak Grove Road for several days.  There is a white abandoned house right before you reach the address of 860 where he's been delivering.  The house has no driveway and he is has been praying since Holly has come up missing.  He believes the house needs to be checked since it his empty."], ["TN0646", "04-25-2011", "Closed", "", "", "", "No Oak Grove Road in Decatur or Perry county. Event closed by SA Joe Walker."], ["TN0618", "04-25-2011", "Closed", "", "", "", "Closed-no new information"], ["TN0647", "04-25-2011", "Open", "Routine", "", "", "Received a call from Lisa Wood.  Her phone number is 731-968-4598.  she stated that there is a concrete pump station located on the end of Willie Mack Hayes road...secluded off in the bushes.  She could be there."], ["TN0647", "04-25-2011", "Closed", "", "", "", "SA Walker spoke with Ms. Wood, who stated she was given the information by a neighbor. She stated the pump stations was on Mouse Tail Landing. SA Walker located the station, it was locked and there was no smell. Event closed by SA Walker."], ["TN0609", "04-25-2011", "Closed", "", "", "", "Close per SA Bishop-information only"], ["TN0630", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-information only"], ["TN0320", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-see incident #68."], ["TN0649", "04-25-2011", "Open", "Routine", "", "", "Caller from 931-289-5925 stated called about a blond girl up the street from him that we may want to check out. blue house on route side of street on Clay Tomlinson Rd., Erwin, TN.\n\nCaller stated at this time bleached blond girl between 16-20 yrs. old is outside with blue jeans shorts and red top.  Staying with a man woman and young man with kids at this address. Young male has a 4 wheel drive Chev red pickup with a black door.\n\nEmerald Star/TIES"], ["TN0650", "04-25-2011", "Open", "Routine", "", "", "This is the car we was looking at when the 4 wheeler come up in this area\n\nYou have been sent 1 picture. (Picture attached to Lead Sheet)"], ["TN0163", "04-25-2011", "Update", "Routine", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Phone contact was made with residence and wife advised she did not know anything about her husband callin in a lead"], ["TN0651", "04-25-2011", "Open", "Routine", "", "", "I received the imagine from a female by the name of Tina Frey.  Her phone number is 731-424-7763.  she stated that she thinks the attached male individual looks like the psychics sketch of Holly Bobo's assailant (on Facebook).  The caller stated that she and her husband were stopping by this address to look at a burgundy corvette.  The residence is listed off of 412..when you are heading into Parsons it will be on the right side of the road.  It looks like a empty house.  I will forward the corvette also.\n\n\n\ni will send you a pic of the sketch and teh corvette also. (See TN0650)"], ["TN0610", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop-information only"], ["TN0653", "04-25-2011", "Open", "Routine", "", "", "Clint Bobo received a facebook message from Claire Dinano stating that Holly could be located at GPS coordinates 35.368217-87.752580. 1161 - 1199 Pope Circle Road, Waynesboro, TN. He does not know Claire and has not responded. She mentioned doing a \"Chakras\" test."], ["TN0652", "04-25-2011", "Open", "Routine", "", "", "ASAC Doug Long received an email from Valerie Smith who had a friend who talked to a psychic named Wendy Higheagle. Higheagle claimed Holly is with 2 ladies and a man and the abduction is over school and an infaturation. Higheagle's phone number is 615-479-4488"], ["TN0652", "04-25-2011", "Closed", "", "", "", "Closed-psychic"], ["TN0654", "04-25-2011", "Open", "Routine", "", "", "FBI SA Pierce. Karen Bobo advised that Justin Hill is a good friend of both Clint and Drew but neither one of them has heard from him since all this happened. Justin also dated Natalie. Justin has told Chad Marshall in the last six months that Holly had tried to talk to him and could have her anytime he wants, which family knows to be untrue."], ["TN0655", "04-25-2011", "Open", "Routine", "", "", "FBI SA Pierce. Karen Bobo stated the family met a man named Kyle Gibson at CMA fest 2 years ago when he asked them to take a picture. He became facebook friends with Clint, then Holly the following year. He often comments on her pictures. He is from Nashville, but has been driving up to help with the search. Told a family friend (Tammy White) that he didn't \"put it together\" until the news anounced it was Whitney's cousin, which mom felt was unusual."], ["TN0656", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Lada Aycock 731-549-0644 (cell)/731-847-4127 - stated that her neighbor, Timothy Wheat (411-13-4564), is a registered sex offender. Caller has a camera outside her residence that records audio only and she overheard Wheat tell someone that he wanted the gun that was hidden. The caller then came across another neighbor who was very distraught because they \"didn't want to know that he knows\". Wheat disappeared about two weeks ago and did not reappear until last friday when he was asking the kids if anyone was at home and when he was told no he started washing and vacuuming his vehicle. The caller said this was the first time they had seen him do this in five years. Wheat came back today but did not get out of his car. The caller stated that Wheat was going to have it out with someone. Connection to the Bobo's is that they all worked for MacKenzie's Tree service at one time or another. If someone is going to contact the caller in person she askes to be given a heads up because she has a dog that she must put away."], ["TN0657", "04-25-2011", "Open", "Routine", "", "", "Timothy Wheat-Sex Offender in Decatur Co. Person of interest. Received call stating he left his home the day Holly went missing then returned 2 days ago and washed his truck."], ["TN0657", "04-25-2011", "Closed", "", "", "", "Timothy Wheat was interviewed on 4/18/11 and alibi was verified.  He was working out of town and when he got home he did clean his truck.\n\nLead Closed"], ["TN0658", "04-25-2011", "Open", "Routine", "", "", "Justin Swindle, Home phone 847-9291, Cell phone 614-2302, Work phone 847-7878 (RJS Industrial Service. Mr. Swindle reported that on Saturday 04/28/11 at approximately 14:00 a two tone red and tan, late 1980s regular cab, short bed, Chevy pickup with primer spots on the passenger side passed by his hous on McMurry Road in a 5 minute peroid two times. This vehicle was driven by Randall Hughes from Bath Springs. He state that he thought Radall Hughes had been fired from McKenize Tree Service in he last 2 months."], ["TN0656", "04-25-2011", "Closed", "", "", "", "Closed per SA Lewis- see incident 657"], ["TN0659", "04-25-2011", "Open", "Routine", "", "ASAC Doug Long", "ASAC Doug Long received information that Cory King or Keen came into a Crooked Creek Restaurant and bothered Kathy White Bell. Ms. Bell advised he was charged with Criminal Trespass and Impersonating an Officer. Ms Bell can be reached at (931)593-2641"], ["TN0660", "04-25-2011", "Open", "Routine", "", "TBI Find Line", "A male individual by the name of Mike called from 901-835-3428. He said he knows of an individual by the name of Gary Atkins that just got out of the mental hospital not too long ago. He said Gary should be looked into. He used to be an EMT and lives in the Cold Creek Community. He has stalked neighbors in the past and 90% of the time wears camoflauge. Mike is concerned about this individual."], ["TN0565", "04-25-2011", "Closed", "", "", "", "Closed per SA Bishop"], ["TN0661", "04-25-2011", "Open", "Routine", "", "", "Jeffrey Singer Lederkramer, MW/DOB 09/23/1946, home address 1083 Gooch Road, Parsons, TN came to the CP to complain about the way the investigation was going. Lederkramer was armed with a weapon under his shirt, but he does not have a permit. SA Bishop and SA Lewis listened to Lederkramer and decided a follow up investigation of him and his residence should be done. A letter to the Bobo family fell out of Lederkramer's billfold as he was looking for some information. The letter is attached to this Lead Sheet. Lederkramer advised he had been talking to THP Brad Wilbank at the Fairgrounds. Lederkramer's cell phone number is 731-847-4423, additional number is 931-628-8012. A criminal history is attached."], ["TN0599", "04-25-2011", "Closed", "", "FBI-Greg Adams, Casper Cromwell 615-521-9698", "", "Closed per SA Bishop-interview conducted"], ["TN0662", "04-25-2011", "Open", "Routine", "", "Telephone", "Caller Thomas Minley 731-845-3077 stated that when he and his wife were fishing at Busseltown Wildlife Refuge two men approached asking about the fishing. They ran down a path was described as being rough and full of snakes and stopped at the beaver dam. They just stared at the water and the dam. The caller thought this was odd because they were obvious northerners and driving an out of state vehicle. They were two men in their 20s, one white male 6'1\" short hair, and one darker skinned male 5'10\" with black hair. The car they were driving was a silver volkswagon passat station wagon with Ohio plates. The caller did not get the tag number but the wife did get that they expire in May 2011."], ["TN0663", "04-26-2011", "Open", "Routine", "", "TBI Find Line", "Kelly Brewer (distant family member) called to say she had received several phone calls overnight in regards to a facebook posting created by a \"Bill Way\" of 101.5 FM in Jackson, TN. He posts \"Holly Bobo IS alive. wish i cud tell you more. but can't. Unconfirmed. But extremely possible it appears.\" This was posted 10 hrs ago. Kelly would like for someone to talk to him and find out where he is getting this information. The number for the radio station i s731-423-8101 or 731-423-8316. Bill's Facebook page is https://www.facebook.com/#!/profile.php?id=1087626372&sk=wall.\n\nKelly's number is 662-587-7500."], ["TN0664", "04-26-2011", "Open", "Routine", "", "Phone call", "Received a call from James Atkins (731) 645-7125 who believes Anthony \"Tony\" Newton needs to be checked out.  Mr Atkins stated that Newton is a sex offender from Madison Co. Newton's DOB is 11/1/1959 and he is showing an address of 200 White Fern Rd in Beech Bluff TN. TNDL# 065950162"], ["TN0665", "04-26-2011", "Open", "Routine", "", "Email", "During the time frame that Nashville Star was being filmed when Whitney Duncan was on the show I overheard someone in my living room talking about kidnapping a young blonde. He said \"He is obcessed with Whitney Duncan on Nashville Star\"\n\nHe said \"He tried to get close to her but he could not\" He said \"He wants a young blonde but he can't get one\" He said \"I told him he should go after her cousin because she is younger and she would be more caring since she wants to be a nurse\" He said \"He would have to quit work if he went after her so he had better save up\". I think he said \"I told him he should cut her arm so she knows he means business\" I can't swear who the man was because there a lot of people in and out of my house at the time. I don't want someone to interview who I think it was because he obviously is so mean my life would be in danger. I will tell you that the person that I think said that also said for sure he had a friend that worked at the Wild Horse in Nashville, TN. Since people have searched the area where Holly Bobo lives and not found any trace of her which I didn't think they would I have to tell you all of this. I just want someone to\n\nverify the where abouts of the people working durin Whitney Duncan's Nashville Star taping. Especially the sound system people since the person I think I overheard was working on sound systems. I think the man who kidnapped Holly Bobo is crazy and probably a crack addict. I think these people are very dangerous so you need to investigate the Wild Horse employees from about 4 years ago very quietly. I think that the man who kidnapped Holly Bobo saved enough money so he could not work for a while and it took him 4 years. I\n\nknow that sounds crazy but he would have to be crazy. I also think everyone involved or knew about her kidnapping is very dangerous."], ["TN0665", "04-26-2011", "Update", "Routine", "", "", "I have no name to give you only that he most likely lived in the Nashville area 4 years ago. He may have downsized and moved somewhere cheap to live outside of Nashville but I think he still drove to Nashville to work the past 4 years because I think he worked on the sound system and that work is mostly in the Nashville area. I can not come to you and talk to you directly so if is the best lead you get then investigate."], ["TN0675", "04-26-2011", "Closed", "", "", "", "Inv. Ricky Inman called Dana Bobo and Dana stated taht he not remember ever selling any equipment, not even a chainsaw to any one."], ["TN0567", "04-26-2011", "Closed", "", "", "", "4/25/2011, 1540 hrs, Crocket County SO, advised Asst. Chief Jenkins is not working today and will return on Tuesday 4/26/2010.\n\n\n\nClosed not related to case. SA Faulkner"], ["TN0650", "04-26-2011", "Closed", "", "", "", "Closed not related. SA Faulkner"], ["TN0651", "04-26-2011", "Closed", "", "", "", "Closed not related. SA Faulkner"], ["TN0649", "04-26-2011", "Closed", "", "", "", "Close, in East Tennessee only info is a blonde girl washing a truck. SA Faulkner"], ["TN0527", "04-26-2011", "Closed", "", "", "", "Close. All have been checked out in area. SA Faulkner"], ["TN0667", "04-26-2011", "Open", "Routine", "", "", "Brandon Young - buying her horse from her paying $25 a week. His dad told me yesterday he (Brandon) was been on Selena, Holly's horse.\n\n\n\nDuring the search, he keeps the horse at Jake Myracle's granddaddy's house, Bobby Myracle. We went by one day to see SElena and saw Brandon coming out. he acted like it made him mad. Another boy was with him, Shamus Humble. Jake Myracle and Brandon had some kind of agreement like Jake could ride the horse when he was in because we let Jake borrow Selena when he wanted to ride. Jake was a friend of Blake Barnett. That's how Holly got to know him. FBI, Mychell Mitchell"], ["TN0674", "04-26-2011", "Open", "Routine", "", "", "Victim Specialist Mychell Mitchell interviewed Tammy White a friend of Karen Bobo's.Tammy White reported that over in Camden,TN there is a Boy Scouts camp with some cabins.Jonathan Dodds father has been a Boy Scouts leader for many years.Jonathan Dodd is an Eagle Scout and would know about the camp-Camp Max between Birdsong and 69.The Camp is only opened in the summer.Tammy White's phone number is 731-549-0585.Her address is 1885 Iron Hill Road Parson TN."], ["TN0132", "04-26-2011", "Closed", "", "", "", "Mitchell Wood has been interviewed and was at work. Close SA Faulkner"], ["TN0669", "04-26-2011", "Open", "Routine", "", "TBI FIND", "Psychic - Claudia Golden 731 - 607-1657  -  has visions of Holly in a tent near Yellow Creek in the Shadows MS area.  The offender is a W/M blue eyes, blonde hair, dimples, wgts 180-190.  She can see Holly dressed in camo.  He has a red pick up truck.   They are closed to a farm house with a red roof."], ["TN0681", "04-26-2011", "Open", "Routine", "", "", "FBI R.Pierce interviewed Karen Bobo.Karen advised that Melvin Stegall is a man in town who everyone thinks is a Rapist.No known contact with Holly."], ["TN0679", "04-26-2011", "Open", "Routine", "", "", "FBI R Pierce interviewed Karen Bobo.She advised that Jake Myracle bought Holly's horse.He always wanted Holly to meet him about it,but Karen always did instead.Karen is not sure if Holly was afraid of Jake or just afraid Drew would get mad at her."], ["TN0677", "04-26-2011", "Open", "Routine", "", "", "R Pierce FBI interviewed Boo&Shelia Scott parents of Drew Scott(Holly's boyfriend).They remembered that 1 or 2 weeks before this happened ,they drove by the house and saw a white car parked for a second and pull off past the house going toward 5 forks,between 3&4 p.m,maybe on Thursday or Friday."], ["TN0676", "04-26-2011", "Open", "Routine", "", "", "FBI SA Pierce interviewed Karen Bobo.She advised that Holly was always afraid of Joe Tuggnak when she was little.He come to lori's house either that Wedenesday or Thursday when this happened.Drews dad,Boo,also stated \"that man creeps me out\".Karen notes that everyone now knows what a wierdo he is.She had a dream last night that Joey had Holly."], ["TN0675", "04-26-2011", "Open", "Routine", "", "", "FBI Victim Specialist Mychell Mitchell interviewed Tammy White a friend of Karen Bobo's.Tammy White reported that last night 04/25/2011,her daughter's(Jill White)boyfriend,Calvin Zemer at 615-418-2199,contacted her by phone about a conversation he had with an older man(about 40years old)in his class at Nashville Tech in Waverly,TN about Holly Bobo The man reported to Calvin Zemer that he knew some Bruces in Benton County whom Dana Bobo allegelly sold some equipment that didn't work.They were upset with Dana Bobo.Calvin Zemer reported the man stated the one of the Bruce boys has been incarcerated for abductin a girl and raping the girl.The girl escaped and reported the crime.The Abduction and the rape incident took place in Benton County.The Bruces live in Benton County TN. Tammy White phone number is 731-549-0585.Her address is 1885 Iron Hill Road Parson TN"], ["TN0673", "04-26-2011", "Open", "Routine", "", "", "Karen Bobo was interviewed by SA Pierce with the FBI.Mrs.Bobo advised that they sold a prom dress on ebay February 2011.A picture of Holly was used in it.The buyer asked aboout height,weight and bra size of the person wearing the dress in the picture.Their return address would have been on the mailing label.Documentation is attached."], ["TN0669", "04-26-2011", "Closed", "", "", "TBI FIND", "Per SAC Powell - close all psychic calls"], ["TN0662", "04-26-2011", "Closed", "", "", "", "Close. Info Only not enough to follow-up. SA Faulkner"], ["TN0671", "04-26-2011", "Open", "Routine", "", "Telephone", "Sheriff King, Benton County 731-584-4407 stated they received a tip from a Delbert Ellis of 4859 West Port Road, Holladay, Tn 731-584-6518 that he and his grandson came across a man in the woods near Bradford Cemetary (down the road by where they have been clearing). When Ellis and his grandson approached the man the man ran away. Delbert Ellis is available if you need more information."], ["TN0667", "04-26-2011", "Closed", "", "", "", "Close. Info only. SA Faulkner"], ["TN0670", "04-26-2011", "Closed", "", "", "", "Close. Blake Barnett has been interviewed. SA Faulkner"], ["TN0684", "04-26-2011", "Open", "Routine", "", "", "FBI R.Pierce interviewed Karen Bobo,she advised that her neighbor John Babb saw a white truck driving down Swan Johnson Road at a high rate of speed at approximately 7:50a.m.On 04/13/2011.It had a loud engine,which is why he noticed.Karen also has been stating that she heard a loud truck that morning."], ["TN0683", "04-26-2011", "Open", "Routine", "", "", "FBI R.Pierce interviewed Tammy White a friend of Karen Bobo's.Tammy reports that Aaron Evans saw a white truck with 3 people inside of it at approximately 8:30a.m. on 04/13/2011 on Old Cherokee Road,north of the Bobo residence.The driver was wearing Camo,and AAron thought to himself\"thats no Turkey hunter\"because it was the wrong camo.No info on the two people in the truck."], ["TN0685", "04-26-2011", "Open", "Routine", "", "", "FBI R.Pierce interviewed Karen Bobo.Karen reports that Bob Myers owns 300 acres to the right of the Bobo house.He may have info on people who have been hunting on his property.Tammy White \"thinks he's wierd\"He lives in Chattanooga and his phone number is 423-622-8095."], ["TN0318", "04-26-2011", "Closed", "", "", "", "SA John Simmons spoke with Alice Reid advised she has never had a problem with Bradley Todd and that she really like him.SA John Simmons also spoke with Bradley at 3:30 p.m. 04/26/2011,he advised he was home the morning of the 04/13/2011.He took his son to his parents house at around 8:15 a.m.Father Steve Todd confirmed Bradley dropped his son off at his house just after 8:00a.m. on 04/13/2011.Bradley Todd's phone number 731-845-4527."], ["TN0525", "04-26-2011", "Closed", "", "", "", "Close. Information only. SA Faulkner"], ["TN0672", "04-26-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Ms. Natasha Call (801)653-2763 suggested to check the greenhouse on the UT Martin campus and tornado shelters."], ["TN0654", "04-26-2011", "Update", "Routine", "SA John Simmons - TBI", "SA J Simmons", "SA John Simmons checked home but no activity"], ["TN0637", "04-26-2011", "Closed", "", "", "", "Completed by Kira Hayden 04/25/2011."], ["TN0570", "04-26-2011", "Update", "Routine", "Rachel Pierce Victim Specialist FBI", "", "T Buckley obtaining consent to taek over Clint's facebook page."], ["TN0661", "04-26-2011", "Closed", "", "", "", "T Buckley. No follow up needed"], ["TN0584", "04-26-2011", "Update", "Routine", "", "", "T Buckley attempted contact. Left message on 04/26/2011\n\n\n\n28 Apr 11 (FBI SSTF Marhett and Page): Detectives spoke with Shelley Maness (FW/DOB 2-13-1977, address 2755 McCall Road, Lexington, TN, phone 731-614-8514,  work address 9465 Highway 100, Scotts Hill, TN, phone 731-549-2418. Shelly Maness stated she saw Karen Bobo and Terry (last name unknown) driving with flashers on down Highway 114. Shelley Maness called Terry, who stated Holly is missing to come help. Shelly Maness and her husband went to the Bobo address. Shelley Maness searched the detached garage and another building on the Bobo property. Shelley Maness talked to the Bobo son, Clint Bobo. Clint told Maness he saw Holly Bobo walk into the woods with a male wearing camouflage   and holding Holly by the arm and carrying something in his other hand. Clint thought it was a turkey caller. Shelley stayed at the Bobo residence until 12:45 p.m. Maness cuts hair for a living and Holly, Clint, and Karen Bobo are customers. Maness has known the Bobo's for 3 to 4 years. Maness is married to john Daniel Maness (MW/DOB 12/24/1972, phone 731-614-8515). John Maness was at work and will contact at a later time."], ["TN0664", "04-26-2011", "Closed", "", "", "", "Atkins was arrested for sex offenses against family members and church members. He doesn't fit the physical description. The Bobo family has no ties to the church he attends. H2O church, Church 360 TV."], ["TN0678", "04-26-2011", "Open", "Routine", "", "Email to TBI Website", "Tip from TBI Website\n\n\n\nHello,\n\nI am sure you have all kinds of tips of this girls disappearance. Well, here is another. Not sure if it will help. I know nothing personally of this girl as I am from PA, but once in awhile I get dreams about people who are missing. Example: A Hornbeck boy was missing. I knew he was living and living near 2 railroad tracks with a man that took him in a truck. And dreamed that he will be found when the man kidnaps another boy. Well that happened as I read they found the boy and another boy with him.\n\nI dreamed that Holly showed me that a man named \" Stan Warren or Stan Libby\"; not sure which one took her on a motorcyle. She said he is dead. (which doesn't make much sense, but I am just telling what I dreamed). Not sure if this will help. Like I said, this was just a dream and I am sure you get all kinds of strange leads, but I couldn't help contact you with this info. If it doesn't help, sorry to waste your time. Kind Regards, Audi Gibbons, Seward, PA"], ["TN0678", "04-26-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0680", "04-26-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email to TBI Website\n\n\n\nI sent this to the locals, but thought I should forward it to you as well.  \n\n \n\nFrom: Brittany Chandler \n\nSent: Friday, April 22, 2011 12:00 PM\n\nTo: dcsheriff@netease.net \n\nSubject: Holly Bobo Case\n\n \n\nHi, I don't know if this has been passed along or not.  Has anyone been keeping an eye on this Blake Hickerson from Parsons?  I have found him on Facebook via a link from the forum scaredmonkeys.com.  On April 15, 2011 he posted the following status:\n\n \n\nis it slander if a ceartian investergatar runs his mouth about u? jw cause im gonna show his fagit ass wht i can really do\n\nApril 15 at 8:52pm\n\n \n\nHere is a link to his page:\n\n \n\nhttp://www.facebook.com/?ref=logo#!/profile.php?id=100000490900812\n\n \n\nHere is the link to a girl (Annie Watson) who is from Alabama who has uploaded pictures of him and it seems to me that after April 14th he went to Alabama.\n\n \n\nhttp://www.facebook.com/?ref=logo#!/profile.php?id=100001236199541\n\n \n\nI am also attaching screen shots of the status and the pictures posted.  I hope this helps in some way, and if it turns out to be nothing, it looked worth checking"], ["TN0682", "04-26-2011", "Open", "Routine", "", "Email to TBI Website", "Tip emailed to TBI Website\n\n\n\nBrodies Landing Rd, Parson, Tn.\n\n\n\nThat road leads right into Tennessee River.\n\n\n\nl.  Holly Bobo's lunch/purse found in creek bed.  Perp uses water to \n\ntransport Holly.\n\n\n\n2.  Could Perp now be using the Tennessee River to transport Holly again?\n\n\n\n3.  Who handles patrolling the rivers ....making sure of safety of \n\npeople when on water?\n\n\n\n4.  Can boat landings where people refuel be alerted to watch out for perp?\n\n\n\n5.  Or in general can people be alerted to watch the rivers some how?\n\n\n\nMy speculation:\n\n\n\nPerp uses creek bed/water to transport Holly to land auto, then to \n\nBrodie Landing to boat.........easier to travel river without \n\ninterference than on land.  Not too many people looking on the \n\nriver..........lots of people looking on land.\n\n\n\nTraveling North/Kentucky to a hide away.  Kentucky.........less densely \n\npopulated and easier to stash someone.\n\n\n\nMaybe this perp has a connection to Kentucky/Illinois (have no idea \n\nwhere the Illinois reference came from!).\n\n\n\nThanks,\n\n\n\n(PS...above posted as questions.....just being grammatically \n\ncorrect............I read 1st page saying you don't answer questions!  \n\nThanks again & Good Luck in the Search!)"], ["TN0682", "04-26-2011", "Closed", "", "", "", "Psychic lead"], ["TN0303", "04-26-2011", "Closed", "", "", "", "On 04/19/2011, SA Faulkner spoke with Ms. Duncan by cell phone. She provided John Curtis' cell phone number and information we received that Curtis and Jonathan Dodd were hiding because Dodd had been receiving threats. Curtis was interviewed later that day by SA Faulkner and Shane Brown of the US Marshal Service. Copy of Curtis interview was provided to Case Agent Dicus."], ["TN0691", "04-26-2011", "Open", "Routine", "", "", "FBI Mychell Mitchell: Karen Bobo (mother of Holly Bobo) @ 681 Swan Johnson Rd., Darden, TN.731-733-3913.  Karen Bobo reported she contacted Jerry Miller via phone (731-847-6706) about the information Jerry Evans shared with her about the flat bed truck he seen on or near his property on Wednesday, 4-13-2011 @ 9:30a.m. Mr Miller reported he saw the truck on Oscar Gipson Rd. on 4-13-11, same day."], ["TN0672", "04-26-2011", "Closed", "", "", "", "Close per SA Faulkner. Information only"], ["TN0692", "04-26-2011", "Open", "Routine", "", "", "FBI Mychell Mitchell:  Karen Bobo (mother of Holly Bobo) @ 681 Swan Johnson Rd., Darden, TN 731-733-3913. Karen Bobo visted Jerry Evans (731-847-3932) today 4-26-11 at his home, 5 Forks Road.  Mr Evans reported he told law enforcement on Wednesday, 4-13-11 @ 9:30 a.m., that he saw a flat bed truck (possibly green) with a homemade box on it going North on the gravel road beside his house.  Mr. Evans reported to Karen Bobo that Jerry Miller saw the same truck some where between Parsons and Camden."], ["TN0684", "04-26-2011", "Closed", "", "", "", "Art Vivaros and Joey Hudgins have already interviewed twice."], ["TN0606", "04-26-2011", "Update", "Routine", "", "", "04/26/2011 @ 2:20PM. No answer at door at 139 Northwood, Parsons."], ["TN0658", "04-26-2011", "Update", "Routine", "", "", "04/26/2011, Ricci & Adams, FBI attempted contact. No contact made with Randall Hughes; no answer at home addres of 7929 Brooksie Thompson Rd, Bath Springs, TN."], ["TN0642", "04-26-2011", "Update", "Routine", "", "", "04/26/2011, Ricci & Adams, FBI, located the teal colored house located at 5071 Darden Christian Chapel Rd., Darden, TN. House appeared to be vacant; overgrown around house. Back porch door open, all other doors locked. Hoome connected to Danny C Burton, DOB 07/05/1962. Address connected to Burton: RR1, Argonia lane, Darden and 108 Perryville Marina Drive, Parsons."], ["TN0690", "04-26-2011", "Open", "Routine", "", "", "FBI R. Pierce: Debbie Harris @ 75 Lancaster, Parsons, TN, 731-733-0041.  Debbie was pulling in City Drug on Main Street noticed a truck turn around in Farmers Bank.  Rusted color & license plates, front was really messed up, Mexican with shoulder length hair, heavy set, sunglasses & red ball cap.  Another man in truck no description.  Truck had a white box in back that went across the whole truck, no handle like a feeder."], ["TN0686", "04-26-2011", "Open", "Routine", "", "", "SA John Simmons contacted Steve Todd by telephone.Mr. Todd,advised that he saw a new model burgandy Dodge Van driving back and forth on Box Road on Saturday 04/9/2011.It was occupied by 2 males in camo.He believes the van is owned by Jimmy Pirtle 731-967-3689 and was likely driven by one of his two sons."], ["TN0687", "04-26-2011", "Open", "Routine", "", "", "Ricci & Adams, FBI, made another attempt to contact Sex Offender Dustin Littles. Agents went to 1765 Laster Road, Huron, TN and Littles was not home. After reviewing the canvass packet, it was found to ontain documentation from Littles' employer. The documents show Little is employed as an over the road truck driver and was driving across country on 04/13/2011. These records were provided by another LE other than Ricci & Adams."], ["TN0686", "04-26-2011", "Update", "Routine", "", "", "Need to contact Jimmy Pirtle"], ["TN0688", "04-26-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Caller John Murphy (614)209-7253 said, he was using the Stranger Chat App on his iphone on 04/09/11. He was chatting with a 20 year old, nursing student from Tennessee. The picture of the girl looked just like Holly Bobo. Mr. Murphy advised he cannot retrieve the picture, any name, or cell number."], ["TN0689", "04-26-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Julie Decker (567)525-6333 said she \"got a message\" that Holly Bobo is buried seven miles southwest from her home in Parsons under the tallest tree in Jasper or Casper, TN.  Ms. Decker advised she has been speaking with her friend that is psychic."], ["TN0689", "04-26-2011", "Closed", "", "", "", "Psychic lead"], ["TN0490", "04-27-2011", "Update", "Routine", "SA Kira Hayden", "SA K Hayden", "SA K Hayden attempted to contact Vincent Staggs at (931) 628-3677. Subject has not contacted SA Hayden back at this time."], ["TN0666", "04-27-2011", "Update", "Routine", "", "FBI TFO P Gooch and T Wilson", "TFO P Gooch and T Wilson of Memphis FBI spoke to Dennis McKenzie who is friends with Mr. Boboand is his boss. McKenzie advised he fired Randall Hughes on April 1, 2010 because he was not working much and seemed to possibly have a drinking problem. He hasn't seen Hughes in about 8 months, but said the last known address ws 7929 Brooksie Thompson Rd in Parsons. They went to that address but nobody was at home @ 1455 hrs. They spoke to the neighbor and she advised Hughes' sister comes in and out of the house but Randall Hughes no longer lives there and hasn't for some time. They went to 8228 Brooskie Thompson where Hughes' grandmother is said to live and no one was at home. They tried to call Randall Hughes on the phone but no answer and no voicemail. Mr. McKenzie advised he can't recall any problems between Hughes and Dana Bobo and doesn't think they even did any work together. They did not talk to anyone named \"Clint\" and it's presumed \"Clint\" in this tip is referring to Holly Bobo's brother. The follow up on this tip would be to either talk with Randall Hughes just routine or talk with Clint to see if he recalls anything about this. Info: Randall Hughes, DOB: 5/26/86, SSN: 412-57-5792, cell: 731-733-6000, sisters known address 7929 Brooksie Thompson Rd. Unable to locate Randall Hughes. Follow up needed."], ["TN0512", "04-27-2011", "Closed", "", "", "", "FBI Memphis TFO P Gooch and T Wilson went to Kurt Ulrich's house and spoke with his live in girlfriend, Jalane White. The address is 730 Horny Head Creek Rd. Everything seemed okay. Also met with Ulrich's neighbors (George Wilkins, 800 Horny Head Creek) and they advised they knew Ulrich and his live in girlfriend and they were believed to be good people. The Wilkins advised their property and Ulrich's property were searched by volunteers and others. Nothing out of the ordinary was observed. Kurt Ulrich's number is 615-972-5041."], ["TN0693", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\n\n\nMy name is Katie Pitts (email: katiepitts79@yahoo.com) and I found this on a website I've been keeping up with, about holly bobo.\n\n(www.psychiccrimefighter.com) \n\n\n\n\n\nThis is what one wrote:\n\nI am familiar with Holly's case only from what I've heard in the media. I haven't red any posts here so I apologize if I am repeating.\n\n\n\nI had a strong sense immediately upon hearing her story that she was abducted by someone who had been watching or \"stalking\" her. I use \"stalking\" loosely, more as a descriptor. \n\n\n\nWhat I get specifically is that someone \"planned\" her abduction well in advance with her as the target in mind. Not a random or stranger abduction of opportunity, it was very well staged and timed. It's someone she would recognize and may know by name but not a close friend or family member."], ["TN0693", "04-27-2011", "Update", "Routine", "", "", "2nd part of email\n\nHe \"wanted\" her and built a \"special\" place for her. He prepared and swiftly swept her into an underground shelter/cage. I get straight down, not a cave. not natural, he dug it. Opening is covered with a wooden slatted produce crate? 24\"x18\" - it is newer, not aged or old. LOOK DOWN. Someone will find her because of this. It's covered with foliage, but will be exposed and stand out because it is too light, not weathered, doesn't fit in.\n\n\n\nI feel she is alive, though being held against her will. I clearly sense her being restrained, blindfolded, gagged. I do not get drugged. Her mind is racing, processing, thinking. She is sharp and playing along. Learning about her captor, absorbing her environment, taking it in, strategizing a plan. She is scared, but in an \"afraid they won't find me\" way, not a tortured, abused way. He \"visits\" her, but is not guarding her. He is hiding her, she's a treasure, \"I want her\" \"I want her.\" Like a kitten, favorite to"], ["TN0693", "04-27-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0693", "04-27-2011", "Update", "Routine", "", "", "3rd part of email\n\n\n\nI get that he is \"slow\" in a childlike way. Mildly retarded maybe, though definitely not profoundly so. The extent of his limited mental capacity is not fully obvious to others. Possibly perceived as \"slow\" in an ignorant, uneducated way, but I get the word \"disordered.\" To me this means something is wrong with his brain systemically. He doesn't think or process right. \n\n\n\nBaby Huey, Lennie, Dufus, Tard - may be a nickname or name he has been teased with. Others will know him by this name. He is known in the community. Not a stranger, not a mountain man. Strong survivalist skills, minimalist.\n\n\n\nThe names I'm getting for him don't match to me. I \"see\" him as a stereotypical Billy Bob, Jim Bob, Bubba or Junior, but I'm getting the names Eric, Derek, Christopher, Kevin, Keith...hard \"k\" sound in his name. \n\n\n\nAged 37-44. 5'10\" stocky, 210-220 lbs. Fair skinned, reddish blonde thin hair, receding hairline or pronounced forehead. Eyes are a strange color, distinct - golden green like a cat or reddish brown like clay. Forearms are very freckled. BAD teeth - stained, poor oral hygiene...dip. He chews tobacco, big wad lower right, spits a lot, like skoal - but not, not in a can. In brown or black pouch - looks like beef jerkey? \n\n\n\nPhew...I am getting A LOT of imagery. I am posting this now and want to look at a map. Will post coordinate if I get anything.\n\n\n\nHope something out of all this helps!! Main message is she is under ground, but not buried. Alive, hidden, \"kept.\"\n\n\n\n\n\nI hope this helps find Holly."], ["TN0695", "04-27-2011", "Open", "Routine", "", "1-800-TBI-FIND", "Mark Dickson (731)733-9040 advised Joseph Tucsnak (possible address 3301 Hwy 641 North, Parsons) has been acting strange since the disappearance of Holly Bobo. Mr. Dickson said, he use to hunt on Mr. Tucsnak's farm but they had a disagreement in 2007 and he didn't use his farm anymore. He hasn't spoke to him since that time. On Friday, after Holly disappeared, Mr. Tucsnak stopped by the Bear Creek Church and started talking to Mr. Dickson. Mr. Tucsnak asked if anyone had found Holly. Then, Mr. Tucsnak said, I guess if she's at the interstate I will find her. Mr. Dickson said, Mr. Tucsnak was known to go around the truck stops and possibly have sex with the men. Mr. Dickson also said, he remembers seeing condoms on Mr. Tucsnak farm."], ["TN0694", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nHello, I'm a 64 yr old lady from Quebec, Canada who has tried to get this into to you since April 20, 2011. Sent it to the sheriff's office, but heard nothing if they got it.\n\n\n\nNOT saying he's guilty, but please look into Glenn Adams http://www.facebook.com/profile.php?id=100000739887735\n\nFor the first almost week he was posting on Bring Holly Bobo home safe page http://www.facebook.com/BHBHS?ref=ts almost every half hour around the clock. THAT did change recently.\n\n\n\nSome of his posts/comments sounded like he was part of either the search team or family, just did not sound right, so I did an search into his background and found out some shocking things that he CLAIMS changed his life and got him into this, BUT I believe this is all a cover for the fact that he was a partner with Gary Michael Hilton in the murder of Meredith Hope Emerson there is just too much information in his OWN words not to look further into this. In 2008 right after her murder, him living only 200 yards from the abandoned farm house where she was said held before her murder, he posts on many diverse blogs and sites, often contradicting himself. PLEASE read his blog, you need to go to the bottom of EACH page to go back further where he has posted both a memorial to he hiker he says he made himself and pictures of Hilton and himself, saying that \"a demon entered his body and he took on the appearance of Hilton\" another post he said he MADE himself take on his appearance. This guy is SICK if nothing else."], ["TN0694", "04-27-2011", "Update", "Routine", "", "Email to TBI Website", "2nd part of email \n\nThe woman in Tenn. that was nearly kidnapped from her home three weeks ago, mentioned the guy wore a hooded sweater, look at the enclosed picture, in the caption to this picture he says he \"took on Hilton's appearance\" and had to change his by dying is hair etc. PLEASE read. \n\nhttp://glennindawson.blogspot.com\n\n\n\nThese are some of the links he has lots of posts on, have a professional investigator have a look please. \n\nhttp://mylifeofcrime.wordpress.com/2008/01/08/gary-michael-hilton-serial-killer/\n\n\n\nhttp://cheryldunlap.bigboardlive.com/t8-gary-michaelmack-hilton-sadistic-malignant-psychopathic-serial-killer"], ["TN0694", "04-27-2011", "Update", "Routine", "", "Email to TBI Website", "3rd part of email\n\nThis is what he says on one blog \n\n\"on or about the 10th of Jan., I received info from Steve an eyewitness that saw him in the Wildcat Campgronud of Dawson Forest. My wife had had enough on my weirdness by then and went to stay at my daughters. I went to the campground. When I got 100 yards from his site the demon left my head and I felt euphoria. I knew then his victims had to be near.\"\n\n\n\nI sent an e-mail to the sheriff's office April 20th, but have no idea if anyone paid attention, this guy is a Vietnam Vet. like Hilton, both serving time in Germany, good chance they knew each other, and what is the most scary is the link between his favorite novel The Shack and these series of killings. Victims taken, held in a shack, found in cave. I'll post the page about the Shack below, please look at it, I feel this guy is living this.\n\n\n\nIF I'm wrong, NO HARM done, IF I'm right he's an experienced certified diver, his favorite show being criminal minds, they just had a show THIS last Friday about victims being held in a cave in the same area of the country, I told the Sheriff's office I believe this guy to be extremely smart, his face book friends are those 'in the know' he could be obtaining info from, and I think he has Holly in an underwater cave. And when I made that statement I had NO idea there were such caves in Tenn. I had a friend look on the map and he found Russel caves, which is about half way between the kidnapping and Glenn's home. \n\n\n\nI beg you to look into this. Anna May Kinney\n\n819-872-3295 Praying for her safe return! IF this guy is/was a partner with Hilton, then he's already been involved in many murders. I'm enclosing a the picture of him in the hooded sweater, you can tell it is hooded by the red draw strings you see in the front on each side. \n\n\n\nThe following is one of Glenn's favorite books, read the things it has in common with the hiker's murder and possibly this kidnapping:"], ["TN0694", "04-27-2011", "Update", "Routine", "", "Email to TBI Website", "4th part of email\n\nThe Shack\n\nTHE SHACK\n\n \n\nAuthor\n\n William P Young\n\n\n\nPublication date\n\n May, 2007\n\n \n\nMedia type\n\n Print \n\n \n\nThe Shack is a Christian novel by Canadian author William P. Young, a former office manager and hotel night clerk, published in 2007.[1] The novel was self-published but became a USA Today bestseller, having sold 1 million copies as of June 8, 2008.[2] It was the #1 Paperback trade fiction seller on the New York Times best sellers list from June 2008 to early 2010.[3]\n\n\n\nThe title of the book is a metaphor for Ì¢åÛåÏthe house you build out of your own painÌ¢åÛ , as Young explained in a telephone interview.[4] He also states to radio host talk show Drew Marshall that The Shack \"is a metaphor for the places you get stuck, you get hurt, you get damaged...the thing where shame or hurt is centered.\"[5]"], ["TN0696", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Around the same day or so when holly was taken across the road from me is about 58 acres and heard a couple of gun shots,however that is not unusual were I live but the people who own the land live in Ohio..I think it is worth looking into and searching that property,I can be reached at 731&#8209;441&#8209;3892.Thanks..Brian Daugherty.."], ["TN0697", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nI posted this the other day after a day thinking about it.  \"Sometimes\" I get feelings and thoughts that connect for some weird reason and decided to post this in case someone hasn't thought of it.\n\n\n\n\n\n*****\n\nI had a precognitive feeling/thought that possibly a coworker of her Father's lost his job and since has suffered family loss things and is who has something to do with it if his work is a competitive environment and someone got laid off instead of him possibly months ago. Have they considered a possibility of something like this? Just a hunch thinking ... \"maybe just maybe\" I might be right.\n\nI sure hope that this young lady is unharmed and allowed to return home.\n\n\n\n\n\n\n\n\n\n*****\n\n\n\nJerry Baker\n\nColorado\n\njerry1475@comcast.net"], ["TN0697", "04-27-2011", "Closed", "", "", "", "Psychic Lead"], ["TN0698", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nI live off Bible Hill Road in Parsons. I telecommute and I looked back in my email from the day Holly went missing. That morning my Internet was out, Charter is the Internet provider I have for my working computer....not sure if that means anything but a Charter repairmen was in our area too. Maybe they might have seen something. The customer service contact said about 50% of customers in our area were without service. \n\n\n\nAlso as a nurse, we did clinical rotations in psych facilities as well as medical, just thought it might be possible someone she came in contact with through those avenues might be a lead.\n\n\n\nI use to work home health and traveled the back roads for short cuts as well as seeing patients in that area. Maybe some home health workers may have seen something in that area. UPS or Fed Ex delivery drivers, bus drivers with school system as well as Lexington Electric System workers might also be potential resources. Lots of storm damage in that area the week before. Maybe one of them saw some type of vehicle in that area the week before. (probably nothing but just thought of it)\n\n\n\nPraying continually for her and finding whoever is responsible. \n\n\n\nThanks for your hard work. \n\n\n\nTammy Crawley\n\n731&#8209;847&#8209;3500\n\n\n\nSent from my iPod"], ["TN0699", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nmark pewitt of sugar tree, face book, please read the posts back until april 11, the lyrics he puts on there n posts for next day r curious snd suspiciou am sending another message after this with more info on y i suspect he could have connections to Holly bobo's missing\n\n\n\nSubject has also included a conversation between herself and the Centerville kidnapping victim Heather Sullivan. Unable to post the conversation to VCC. Will forward to Command Post."], ["TN0700", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Tip received in TIES by Operator E. Star and emailed to TBI Website\n\n\n\nRobert Bonee 901-377-4871 called and stated that the FBI should stop giving media updates because the abductor is waiting till after midnight in the dark to move around."], ["TN0701", "04-27-2011", "Open", "Routine", "", "Email to TBI Website by TIES", "Tip received in TIES by Operator E. Star and emailed to TBI Website \n\n\n\nBrian Marley at 940-206-1318, cross-country truck driver.  Was in Lebanon, TN Pilot Truck stop between 2:00-3:00am. Mr. Marley was not sure of area where Holly disappeared so he was not sure if call would help.\n\n \n\nStated that he saw a tall skinny male all in camouflage at the truck stop.  Mr. Marley thought the camouflage was strange.  The man had fair hair. Mr. Marley was sure that the truck stop had camera that we may could check.\n\n \n\nMr. Marley was back on the road in Arkansas on I-40 west bound around 6:34pm, 4/23/11 at this time."], ["TN0702", "04-27-2011", "Open", "Routine", "", "Email to TBI Website", "Email to TBI Website\n\nHello,\n\nI received the tweet (attached) just a few moments ago. I consider it threatening. As a reporter for Fox 13 Memphis, I've been tweeting a little bit about the Holly Bobo case. I wanted you guys to see this tweet that was sent to me today. The twitter account goes back to a William Tomsick and it shows he just started \"following\" me today.\n\nPlease feel free to contact me any time.\n\n\n\nJill Monier\n\n\n\nFox 13 News-Memphis\n\n901-218-4777 (c)"], ["TN0703", "04-27-2011", "Open", "Routine", "", "Email sent to TBI Website", "Email sent to TBI Website\n\n\n\nEver since Holly disappeared me friends and I have been nonstop reading articles, checking message boards and other stuff relating to the case. We live in Nashville and were volunteers for a few days before we had to come home for Easter. Well, we have been able to find quite a few things that other people have discovered, and we also came across a website called psychiccrimefighter.com. Now I know ya'll probably don't believe in that stuff, and neither do I... TRUST ME. I believe in God, and I don't listen to that crazy crap. But one of my friends, Kyle, his aunt is able to see visions (being a psychic is not her profession or anything, it's only used to help people when she senses things). She called Kyle and told him about her vision of Holly. She said she was awkwardly positioned on the floor, in some kind of shed-like building. She felt that she was still alive but injured. She said she saw the man in her vision who possibly abducted her, or was somehow involved. There is much more she had told us about what she was seeing/feeling but it would take forever to type and we already spoke to Sheriff Roy Wyatt before we left to go back to Nashville after a long day of volunteering But this caused my friends and I to look around online and do a little investigating of our own to see what we could come up with. Well, we came across this website, psychiccrimefighter.com. And let me tell you again, I have never believed in this psychic stuff but the posts on that website in the Holly Bobo thread/topic made me see that they can be legit sometimes. At first I thought, \"all of these people are coming up with something different... I don't know how most of these things are connected to one another.\" But half of the thing
