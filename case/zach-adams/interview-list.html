[data-theme="light"] {

  --red:           #cf222e;
  --green:         #1a7f37;

  --card-alt:      rgba(31,35,40,0.04);

  --hdr-sub:       #1c2128;
  --hdr-txt:       #f0f6fc;
  --thead:         #f6f8fa;
  --thd-hov:       #eaeef2;

}

body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }

header { background: var(--hdr); color: var(--hdr-txt); padding: 16px 24px 12px; }
header h1 { font-size: clamp(1rem, 3vw + .5rem, 1.25rem); font-weight: 700; }
header p  { font-size: clamp(.72rem, 1.5vw + .4rem, .78rem); opacity: .7; margin-top: 3px; }

.stats-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  background: var(--hdr-sub); padding: 8px 20px;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat {
  background: rgba(240,234,224,.1); border-radius: 6px;
  padding: 5px 12px; color: var(--hdr-txt); font-size: .75rem;
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.stat strong { font-size: 1rem; }

.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 20px; background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.toolbar input[type=text] {
  flex: 1; min-width: 200px; padding: 8px 12px;
  border: 1.5px solid var(--border); border-radius: 7px;
  font-size: .88rem; outline: none;
  background: var(--bg); color: var(--text);
}
.toolbar input[type=text]::placeholder { color: var(--text-dim); }
.toolbar input:focus { border-color: var(--accent); }
.toolbar select {
  padding: 8px 10px; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: .82rem;
  background: var(--bg); color: var(--text);
  outline: none; cursor: pointer;
}
.btn {
  padding: 8px 14px; border: none; border-radius: 7px;
  font-size: .82rem; cursor: pointer; font-weight: 600; transition: .15s;
  white-space: nowrap; text-decoration: none; display: inline-block;
}
.btn-clear { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent-dim); }
.btn-clear:hover { opacity: .8; }
.btn-nav  { background: var(--accent-subtle); color: var(--accent); }
.btn-nav:hover { opacity: .8; }
.btn-nav2 { background: var(--accent-subtle); color: var(--accent); }
.btn-nav2:hover { opacity: .8; }

.count-bar {
  padding: 5px 20px; font-size: .75rem; color: var(--text-dim);
  background: var(--bg3); border-bottom: 1px solid var(--border);
}

/* Table */
.table-wrap { overflow-x: auto; padding: 0 20px 40px; }
table { width: 100%; border-collapse: collapse; margin-top: 14px; min-width: 680px; }
thead th {
  background: var(--thead); color: var(--hdr-txt); padding: 9px 10px;
  font-size: .78rem; text-align: left;
  position: sticky; top: 0; cursor: pointer;
  user-select: none; white-space: nowrap;
}
thead th:hover { background: var(--thd-hov); }
thead th .si { margin-left: 4px; opacity: .5; }
thead th.sorted .si { opacity: 1; }
tbody tr:nth-child(even) td { background: var(--card-alt); }
tbody tr:hover td { background: var(--bg3) !important; }
td {
  padding: 7px 10px; font-size: .82rem;
  border-bottom: 1px solid var(--border-lo); vertical-align: top;
  color: var(--text) !important;
}

.ir-badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--accent-subtle); color: var(--accent);
  border: 1px solid var(--accent-dim);
  font-size: .7rem; font-weight: 700; white-space: nowrap;
}
.sr-badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--green-bg); color: var(--green);
  font-size: .7rem; font-weight: 600;
}
.ni-badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  background: var(--amber-bg); color: var(--amber);
  font-size: .7rem; font-weight: 600;
}
.profile-link { color: var(--accent); text-decoration: none; font-size: .8rem; margin-left: 5px; }
.profile-link:hover { text-decoration: underline; }

/* Need-to-interview section */
.need-section {
  margin: 20px 20px 0; background: var(--bg2); border-radius: 10px;
  border-left: 5px solid var(--amber); padding: 16px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.need-section h2 { font-size: .9rem; color: var(--amber); font-weight: 700; margin-bottom: 10px; }
.need-item {
  font-size: .82rem; padding: 4px 0;
  border-bottom: 1px solid var(--border-lo); color: var(--text);
}

.no-results { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 1rem; }

/* Mobile card layout */
@media (max-width: 640px) {
  .toolbar { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .toolbar input[type=text] { min-width: 0; flex: 1 1 100%; font-size: .9rem; }
  .toolbar select { flex: 1 1 calc(50% - 3px); min-width: 0; font-size: .85rem; }
  .toolbar .btn { flex: 1 1 calc(50% - 3px); text-align: center; font-size: .85rem; }
  .toolbar #case-nav { width: 100%; }
  .need-section { margin: 12px 10px 0; }
  header { padding: 12px 16px; }
  .ir-badge, .sr-badge, .ni-badge { font-size: .75rem; }
  .stat { font-size: .8rem; }
  .stat strong { font-size: 1.05rem; }
  .count-bar { font-size: .8rem; }
  .need-item { font-size: .85rem; }

  .table-wrap { padding: 0 10px 40px; overflow-x: hidden; }
  table, thead, tbody, tr, th, td { display: block; }
  table { width: 100%; min-width: 0; }
  thead tr { display: none; }
  tbody tr {
    width: 100%; background: var(--bg2); border-radius: 10px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 12px 14px;
    border-left: 4px solid var(--accent); box-sizing: border-box;
  }
  tbody tr:nth-child(even) td { background: transparent; }
  tbody tr:hover td { background: transparent !important; }
  td {
    border: none; position: relative;
    padding: 3px 0 3px 72px;
    font-size: .84rem; display: block;
    word-break: break-word; overflow-wrap: anywhere;
  }
  td::before {
    content: attr(data-label);

    width: 66px;

    text-transform: uppercase; letter-spacing: .03em;
  }
  td:first-child { display: none; }
  td:first-child + td { font-size: .95rem; }
}

// sort
let sortCol = 0, sortDir = 1;
let filtered = [...DATA];

function applyFilters() {
  const q      = document.getElementById('searchBox').value.toLowerCase().trim();
  const ir     = document.getElementById('filterIR').value;
  const status = document.getElementById('filterSR').value;

  filtered = DATA.filter(r => {
    const [num, name, irn, agents, notes, sr, id] = r;
    const text = [num, name, irn, agents, notes].join(' ').toLowerCase();
    if (q      && !text.includes(q))          return false;
    if (ir === 'ir'   && !irn)                return false;
    if (ir === 'noir' && irn)                 return false;
    if (status === 'sr'     && !sr)           return false;
    if (status === 'linked' && !id)           return false;
    return true;
  });
  renderTable();
}

function clearFilters() {
  document.getElementById('searchBox').value = '';
  document.getElementById('filterIR').value  = '';
  document.getElementById('filterSR').value  = '';
  filtered = [...DATA];
  renderTable();
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('thead th').forEach((th, i) => {
    th.classList.toggle('sorted', i === col);
    const si = th.querySelector('.si');
    if (si) si.textContent = i===col ? (sortDir===1?'↑':'↓') : '↕';
  });
  filtered.sort((a, b) => {
    let va = a[col]||'', vb = b[col]||'';
    if (col === 0) return sortDir * (Number(va) - Number(vb));
    return sortDir * String(va).localeCompare(String(vb));
  });
  renderTable();
}

function renderTable() {
  const tbody  = document.getElementById('tableBody');
  const noRes  = document.getElementById('noResults');
  const table  = document.getElementById('mainTable');
  tbody.innerHTML = '';

  document.getElementById('countBar').textContent =
    `Showing ${filtered.length} of ${DATA.length} entries`;
  document.getElementById('statShowing').textContent = filtered.length;

  if (!filtered.length) {
    noRes.style.display  = 'block';
    table.style.display  = 'none';
    return;
  }
  noRes.style.display = 'none';
  table.style.display = '';

  filtered.forEach(r => {
    const [num, name, irn, agents, notes, sr, id] = r;
    const irBadge  = irn  ? irn.split(',').map(n=>`<span class="ir-badge">IR ${n.trim()}</span>`).join(' ') : '';
    const srBadge  = sr   ? '<span class="sr-badge">Cleared</span>' : '';
    const profLink = id   ? `<a class="profile-link" href="name-Index.html?person=${id}" target="_blank"><svg xmlns='http://www.w3.org/2000/svg' width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-2px'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></svg></a>` : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="color:#94a3b8;font-size:.78rem;text-align:right;padding-right:8px;">${num}</td>
      <td data-label="Name"><strong>${name}</strong>${profLink}</td>
      <td data-label="IR #">${irBadge}</td>
      <td data-label="Agent(s)" style="color:#475569;font-size:.78rem;">${agents}</td>
      <td data-label="Notes" style="color:#374151;">${notes}</td>
      <td data-label="Status">${srBadge}</td>
    `;
    tbody.appendChild(tr);
  });

  // update stats (always off full DATA)
  document.getElementById('statTotal').textContent  = DATA.length;
  document.getElementById('statIR').textContent     = DATA.filter(r=>r[2]).length;
  document.getElementById('statSR').textContent     = DATA.filter(r=>r[5]).length;
  document.getElementById('statLinked').textContent = DATA.filter(r=>r[6]).length;
}

    document.getElementById('searchBox').value = q;
    applyFilters();
  } else {
    renderTable();
