<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('foia-theme')==='light')document.documentElement.dataset.theme='light';}catch(e){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holly Bobo – Evidence Log</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }

/* ── FOIA.io palette — dark default, [data-theme="light"] override ── */
:root {
  --bg:            #0d1117;
  --bg2:           #161b22;
  --bg3:           #21262d;
  --border:        #30363d;
  --accent:        #2f81f7;
  --accent-subtle: rgba(47,129,247,0.10);
  --accent-dim:    rgba(47,129,247,0.40);
  --text:          #e6edf3;
  --text-dim:      #7d8590;
  --red:           #f85149;
  --green:         #3fb950;
  --amber:         #d29922;
  --card-alt:      rgba(230,237,243,0.04);
  --border-lo:     rgba(48,54,61,0.7);
  --hdr:           #010409;
  --hdr-sub:       #0d1117;
  --hdr-txt:       #e6edf3;
  --thead:         #161b22;
  --thd-hov:       #21262d;
  --green-bg:      rgba(63,185,80,0.12);
  --red-bg:        rgba(248,81,73,0.12);
  --amber-bg:      rgba(210,153,34,0.12);
}
[data-theme="light"] {
  --bg:            #ffffff;
  --bg2:           #f6f8fa;
  --bg3:           #eaeef2;
  --border:        #d0d7de;
  --accent:        #0969da;
  --accent-subtle: rgba(9,105,218,0.08);
  --accent-dim:    rgba(9,105,218,0.35);
  --text:          #1f2328;
  --text-dim:      #57606a;
  --red:           #cf222e;
  --green:         #1a7f37;
  --amber:         #9a6700;
  --card-alt:      rgba(31,35,40,0.04);
  --border-lo:     rgba(208,215,222,0.6);
  --hdr:           #24292f;
  --hdr-sub:       #1c2128;
  --hdr-txt:       #f0f6fc;
  --thead:         #f6f8fa;
  --thd-hov:       #eaeef2;
  --green-bg:      rgba(26,127,55,0.10);
  --red-bg:        rgba(207,34,46,0.10);
  --amber-bg:      rgba(154,103,0,0.10);
}

body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }

header { background: var(--hdr); color: var(--hdr-txt); padding: 16px 24px 12px; }
header h1 { font-size: clamp(1rem, 3vw + .5rem, 1.25rem); font-weight: 700; }
header p  { font-size: clamp(.72rem, 1.5vw + .4rem, .78rem); opacity: .7; margin-top: 3px; }

.stats-bar {
  display: flex; gap: 8px; flex-wrap: wrap;
  background: var(--hdr-sub); padding: 8px 20px;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat {
  background: rgba(240,234,224,.1); border-radius: 6px;
  padding: 5px 12px; color: var(--hdr-txt); font-size: .75rem;
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.stat strong { font-size: 1rem; }

.toolbar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 20px; background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.toolbar input[type=text] {
  flex: 1; min-width: 180px; padding: 8px 12px;
  border: 1.5px solid var(--border); border-radius: 7px;
  font-size: .88rem; outline: none;
  background: var(--bg); color: var(--text);
}
.toolbar input[type=text]::placeholder { color: var(--text-dim); }
.toolbar input:focus { border-color: var(--accent); }
.toolbar select {
  padding: 8px 10px; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: .82rem;
  background: var(--bg); color: var(--text);
  outline: none; cursor: pointer;
}
.btn {
  padding: 8px 14px; border: none; border-radius: 7px;
  font-size: .82rem; cursor: pointer; font-weight: 600; transition: .15s;
  white-space: nowrap; text-decoration: none; display: inline-block;
}
.btn-add   { background: var(--green-bg); color: var(--green); }
.btn-add:hover { opacity: .8; }
.btn-clear { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent-dim); }
.btn-clear:hover { opacity: .8; }
.btn-nav   { background: var(--accent-subtle); color: var(--accent); }
.btn-nav:hover { opacity: .8; }
.btn-nav2  { background: var(--accent-subtle); color: var(--accent); }
.btn-nav2:hover { opacity: .8; }
.btn-nav3  { background: var(--red-bg); color: var(--red); }
.btn-nav3:hover { opacity: .8; }

.count-bar {
  padding: 5px 20px; font-size: .75rem; color: var(--text-dim);
  background: var(--bg3); border-bottom: 1px solid var(--border);
}

/* Add-item panel */
.add-panel {
  display: none; background: var(--bg2);
  border-bottom: 1px solid var(--border); padding: 16px 20px;
}
.add-panel.open { display: block; }
.add-panel h3 { font-size: .88rem; color: var(--text); margin-bottom: 12px; font-weight: 700; }
.add-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}
.add-grid input, .add-grid select, .add-grid textarea {
  width: 100%; padding: 7px 10px;
  border: 1.5px solid var(--border); border-radius: 6px;
  font-size: .82rem; font-family: inherit; outline: none;
  background: var(--bg); color: var(--text);
}
.add-grid textarea { resize: vertical; min-height: 58px; }
.add-grid input:focus, .add-grid select:focus, .add-grid textarea:focus { border-color: var(--accent); }
.add-grid label { font-size: .7rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; display: block; margin-bottom: 3px; }
.field-group { display: flex; flex-direction: column; }
.field-group.span2 { grid-column: span 2; }
.add-actions { margin-top: 10px; display: flex; gap: 8px; }
.btn-save { background: var(--hdr); color: var(--hdr-txt); }
.btn-save:hover { opacity: .85; }
.btn-cancel { background: var(--bg3); color: var(--text-dim); }
.btn-cancel:hover { opacity: .8; }

/* Status badges */
.status {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: .7rem; font-weight: 700; white-space: nowrap;
}
.status-collected    { background: var(--accent-subtle); color: var(--accent); }
.status-submitted    { background: var(--amber-bg); color: var(--amber); }
.status-testing      { background: var(--amber-bg); color: var(--amber); }
.status-results-in   { background: var(--green-bg); color: var(--green); }
.status-inconclusive { background: var(--red-bg); color: var(--red); }
.status-not-tested   { background: var(--card-alt); color: var(--text-dim); }

/* Table */
.table-wrap { overflow-x: auto; padding: 0 20px 40px; }
table { width: 100%; border-collapse: collapse; margin-top: 14px; min-width: 780px; }
thead th {
  background: var(--thead); color: var(--hdr-txt); padding: 9px 10px;
  font-size: .78rem; text-align: left;
  position: sticky; top: 0; cursor: pointer;
  user-select: none; white-space: nowrap;
}
thead th:hover { background: var(--thd-hov); }
thead th .si { margin-left: 4px; opacity: .5; }
thead th.sorted .si { opacity: 1; }
tbody tr:nth-child(even) td { background: var(--card-alt); }
tbody tr:hover td { background: var(--bg3) !important; }
td {
  padding: 7px 10px; font-size: .82rem;
  border-bottom: 1px solid var(--border-lo); vertical-align: top;
  color: var(--text) !important;
}
.marker-num {
  font-weight: 800; font-size: 1rem; color: var(--accent);
  text-align: center; min-width: 32px; display: inline-block;
}
.notes-cell { min-width: 140px; }
.notes-cell textarea {
  width: 100%; border: 1px solid var(--border-lo); border-radius: 5px;
  font-size: .78rem; padding: 4px 6px; resize: vertical;
  font-family: inherit; color: var(--text); background: transparent; min-height: 36px;
}
.notes-cell textarea:focus { border-color: var(--accent); outline: none; background: var(--bg); }
.source-link { color: var(--accent); text-decoration: none; font-size: .78rem; }
.source-link:hover { text-decoration: underline; }
.del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: .85rem; padding: 2px 4px;
  border-radius: 4px; transition: .15s; opacity: .5;
}
.del-btn:hover { color: var(--red); background: var(--red-bg); opacity: 1; }

.no-results { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 1rem; }

/* Mobile card list */
.card-list { display: none; padding: 10px 16px 40px; }
.ev-card {
  background: var(--bg2); border-radius: 10px; margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 14px 16px;
  border-left: 4px solid var(--accent);
}
.ev-card-header {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-lo);
}
.ev-card-marker { font-size: .68rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
.ev-card-marker span { color: var(--accent); font-size: 1rem; margin-left: 3px; }
.ev-card-desc { font-weight: 700; font-size: .92rem; flex: 1; color: var(--text); }
.ev-card-del {
  background: none; border: none; cursor: pointer;
  color: var(--text-dim); font-size: .85rem; padding: 2px 4px; border-radius: 4px;
  flex-shrink: 0; opacity: .5;
}
.ev-card-del:hover { color: var(--red); background: var(--red-bg); opacity: 1; }
.ev-card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.ev-card-row { font-size: .78rem; color: var(--text); }
.ev-card-row strong { color: var(--text-dim); font-weight: 600; font-size: .68rem; text-transform: uppercase; margin-right: 3px; }
.ev-card-notes textarea {
  width: 100%; border: 1px solid var(--border-lo); border-radius: 5px;
  font-size: .78rem; padding: 5px 8px; resize: vertical;
  font-family: inherit; color: var(--text); min-height: 36px; margin-top: 6px;
}
.ev-card-notes textarea:focus { border-color: var(--accent); outline: none; }

@media (max-width: 640px) {
  .toolbar { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .toolbar input[type=text] { min-width: 0; flex: 1 1 100%; font-size: .9rem; }
  .toolbar select { flex: 1 1 calc(50% - 3px); min-width: 0; font-size: .85rem; }
  .toolbar .btn { flex: 1 1 calc(50% - 3px); text-align: center; font-size: .85rem; }
  .toolbar #case-nav { width: 100%; }
  header { padding: 12px 16px; }
  .add-panel { padding: 12px 14px; }
  .add-grid label { font-size: .75rem; }
  .status { font-size: .75rem; }
  .stat { font-size: .8rem; }
  .stat strong { font-size: 1.05rem; }
  .count-bar { font-size: .8rem; }
  .ev-card-marker { font-size: .72rem; }
  .ev-card-desc { font-size: .95rem; }
  .ev-card-row { font-size: .82rem; }
  .add-grid { grid-template-columns: 1fr 1fr; }
  .field-group.span2 { grid-column: span 2; }
  .table-wrap { display: none; }
  .card-list { display: block; }
}
</style>
</head>
<body>

<header>
  <h1>Evidence Log</h1>
  <p>Case JA-90A-000005 · TBI / FBI · April 13, 2011 onwards</p>
</header>

<div class="stats-bar">
  <div class="stat"><strong id="statTotal">–</strong> Items</div>
  <div class="stat"><strong id="statCollected">–</strong> Collected</div>
  <div class="stat"><strong id="statSubmitted">–</strong> Submitted</div>
  <div class="stat"><strong id="statResults">–</strong> Results In</div>
  <div class="stat"><strong id="statShowing">–</strong> Showing</div>
</div>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="Search description, location, notes…" oninput="applyFilters()">
  <select id="filterStatus" onchange="applyFilters()">
    <option value="">All Statuses</option>
    <option value="Collected">Collected</option>
    <option value="Submitted to Lab">Submitted to Lab</option>
    <option value="In Testing">In Testing</option>
    <option value="Results In">Results In</option>
    <option value="Inconclusive">Inconclusive</option>
    <option value="Not Tested">Not Tested</option>
  </select>
  <select id="filterLoc" onchange="applyFilters()">
    <option value="">All Locations</option>
  </select>
  <button class="btn btn-add" onclick="toggleAdd()">+ Add Item</button>
  <button class="btn btn-clear" onclick="clearFilters()">✕ Clear</button>
  <div id="case-nav"></div>
  <script src="nav.js"></script>
</div>
<div class="count-bar" id="countBar"></div>

<!-- Add-item panel -->
<div class="add-panel" id="addPanel">
  <h3>Add Evidence Item</h3>
  <div class="add-grid">
    <div class="field-group">
      <label>Marker #</label>
      <input type="text" id="f_marker" placeholder="e.g. 3">
    </div>
    <div class="field-group">
      <label>Date</label>
      <input type="text" id="f_date" placeholder="04/13/2011">
    </div>
    <div class="field-group">
      <label>Agency</label>
      <input type="text" id="f_agency" placeholder="TBI">
    </div>
    <div class="field-group">
      <label>Collected By</label>
      <input type="text" id="f_agent" placeholder="Agent name">
    </div>
    <div class="field-group span2">
      <label>Description</label>
      <input type="text" id="f_desc" placeholder="Brief description of item">
    </div>
    <div class="field-group">
      <label>Location</label>
      <input type="text" id="f_loc" placeholder="e.g. Carport, Bedroom">
    </div>
    <div class="field-group">
      <label>IR / Lab Ref #</label>
      <input type="text" id="f_ir" placeholder="e.g. IR 14">
    </div>
    <div class="field-group">
      <label>Status</label>
      <select id="f_status">
        <option>Collected</option>
        <option>Submitted to Lab</option>
        <option>In Testing</option>
        <option>Results In</option>
        <option>Inconclusive</option>
        <option>Not Tested</option>
      </select>
    </div>
    <div class="field-group">
      <label>Source Label</label>
      <input type="text" id="f_srcLabel" placeholder="e.g. TBI Video, IR 14">
    </div>
    <div class="field-group span2">
      <label>Source URL</label>
      <input type="text" id="f_srcUrl" placeholder="https://drive.google.com/…">
    </div>
    <div class="field-group span2">
      <label>Notes</label>
      <textarea id="f_notes" placeholder="Additional notes…"></textarea>
    </div>
  </div>
  <div class="add-actions">
    <button class="btn btn-save" onclick="addItem()">Save Item</button>
    <button class="btn btn-cancel" onclick="toggleAdd()">Cancel</button>
  </div>
</div>

<div class="table-wrap">
<table id="mainTable">
  <thead>
    <tr>
      <th onclick="sortTable(0)">#<span class="si">↕</span></th>
      <th onclick="sortTable(1)">Description<span class="si">↕</span></th>
      <th onclick="sortTable(2)">Location<span class="si">↕</span></th>
      <th onclick="sortTable(3)">Agency / Agent<span class="si">↕</span></th>
      <th onclick="sortTable(4)">Date<span class="si">↕</span></th>
      <th onclick="sortTable(5)">IR / Lab Ref<span class="si">↕</span></th>
      <th onclick="sortTable(6)">Status<span class="si">↕</span></th>
      <th>Source</th>
      <th>Notes</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
<div class="no-results" id="noResults" style="display:none">No items match your filters.</div>
</div>

<div class="card-list" id="cardList"></div>

<script>
const STATUS_CLS = {
  "Collected":       "status-collected",
  "Submitted to Lab":"status-submitted",
  "In Testing":      "status-testing",
  "Results In":      "status-results-in",
  "Inconclusive":    "status-inconclusive",
  "Not Tested":      "status-not-tested",
};

const VIDEO_LINK = "https://drive.google.com/file/d/1SDUzExr3kjdTg6iaJjz86nlX39TNVgQ7/view?pli=1";

// Seed data — pre-populated from known sources
// Fields: [marker, description, location, agency, agent, date, ir_ref, status, srcLabel, srcUrl, notes, id]
const SEED = [
  ["1",  "Pool of blood",
         "Carport / concrete slab", "TBI", "", "04/13/2011", "",
         "Collected", "TBI Video", VIDEO_LINK, "", "ev-1a"],
  ["2",  "Nail/wire on concrete surface",
         "Carport / concrete slab", "TBI", "", "04/13/2011", "",
         "Collected", "TBI Video", VIDEO_LINK, "", "ev-1b"],
];
const SEED_VER = 3;

// Load from localStorage, merging with seed
function loadItems() {
  const saved = localStorage.getItem("hb_evidence");
  const ver   = parseInt(localStorage.getItem("hb_evidence_ver") || "0");
  if (saved && ver === SEED_VER) return JSON.parse(saved);
  // Seed version changed — reset to updated seed
  const fresh = SEED.map(r => ({
    marker:   r[0], desc: r[1], loc: r[2], agency: r[3], agent: r[4],
    date:     r[5], ir:   r[6], status: r[7],
    srcLabel: r[8], srcUrl: r[9], notes: r[10], id: r[11]
  }));
  localStorage.setItem("hb_evidence", JSON.stringify(fresh));
  localStorage.setItem("hb_evidence_ver", SEED_VER);
  return fresh;
}

function saveItems() {
  localStorage.setItem("hb_evidence", JSON.stringify(items));
  localStorage.setItem("hb_evidence_ver", SEED_VER);
}

let items = loadItems();
let filtered = [...items];
let sortCol = 4, sortDir = 1;

// Location filter population
function populateLocFilter() {
  const sel = document.getElementById("filterLoc");
  const locs = [...new Set(items.map(i => i.loc).filter(Boolean))].sort();
  sel.innerHTML = "<option value=''>All Locations</option>";
  locs.forEach(l => {
    const o = document.createElement("option");
    o.textContent = l; sel.appendChild(o);
  });
}

function applyFilters() {
  const q   = document.getElementById("searchBox").value.toLowerCase().trim();
  const st  = document.getElementById("filterStatus").value;
  const loc = document.getElementById("filterLoc").value;
  filtered = items.filter(it => {
    const text = [it.marker, it.desc, it.loc, it.agency, it.agent, it.ir, it.notes, it.srcLabel].join(" ").toLowerCase();
    if (q   && !text.includes(q))    return false;
    if (st  && it.status !== st)     return false;
    if (loc && it.loc !== loc)       return false;
    return true;
  });
  renderTable();
}

function clearFilters() {
  document.getElementById("searchBox").value  = "";
  document.getElementById("filterStatus").value = "";
  document.getElementById("filterLoc").value  = "";
  filtered = [...items];
  renderTable();
}

function sortTable(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll("thead th").forEach((th, i) => {
    th.classList.toggle("sorted", i === col);
    const si = th.querySelector(".si"); if (si) si.textContent = i===col?(sortDir===1?"↑":"↓"):"↕";
  });
  const keys = ["marker","desc","loc","agency","date","ir","status"];
  filtered.sort((a,b) => sortDir * String(a[keys[col]]||"").localeCompare(String(b[keys[col]]||""), undefined, {numeric:true}));
  renderTable();
}

function statusBadge(s) {
  const cls = STATUS_CLS[s] || "status-not-tested";
  return `<span class="status ${cls}">${s||"—"}</span>`;
}

function renderTable() {
  const tbody    = document.getElementById("tableBody");
  const cardList = document.getElementById("cardList");
  const noRes    = document.getElementById("noResults");
  const table    = document.getElementById("mainTable");
  tbody.innerHTML = "";
  cardList.innerHTML = "";

  // Stats
  document.getElementById("statTotal").textContent     = items.length;
  document.getElementById("statCollected").textContent = items.filter(i=>i.status==="Collected").length;
  document.getElementById("statSubmitted").textContent = items.filter(i=>["Submitted to Lab","In Testing"].includes(i.status)).length;
  document.getElementById("statResults").textContent   = items.filter(i=>["Results In","Inconclusive"].includes(i.status)).length;
  document.getElementById("statShowing").textContent   = filtered.length;
  document.getElementById("countBar").textContent      = `Showing ${filtered.length} of ${items.length} items`;

  if (!filtered.length) { noRes.style.display="block"; table.style.display="none"; return; }
  noRes.style.display="none"; table.style.display="";

  filtered.forEach(it => {
    const src = it.srcUrl
      ? `<a class="source-link" href="${it.srcUrl}" target="_blank">${it.srcLabel||"Source"}</a>`
      : (it.srcLabel || "");
    const agencyStr = [it.agency, it.agent].filter(Boolean).join(" / ") || "—";

    // ── Desktop table row ──
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td data-label="Marker"><span class="marker-num">${it.marker||"–"}</span></td>
      <td data-label="Description"><strong>${it.desc}</strong></td>
      <td data-label="Location">${it.loc||"—"}</td>
      <td data-label="Agency">${agencyStr}</td>
      <td data-label="Date" style="white-space:nowrap">${it.date||"—"}</td>
      <td data-label="IR/Lab">${it.ir||"—"}</td>
      <td data-label="Status">${statusBadge(it.status)}</td>
      <td data-label="Source">${src}</td>
      <td class="notes-cell" data-label="Notes">
        <textarea placeholder="Notes…" onchange="updateNote('${it.id}',this.value)">${it.notes||""}</textarea>
      </td>
      <td><button class="del-btn" onclick="deleteItem('${it.id}')" title="Delete">✕</button></td>
    `;
    tbody.appendChild(tr);

    // ── Mobile card ──
    const card = document.createElement("div");
    card.className = "ev-card";
    card.innerHTML = `
      <div class="ev-card-header">
        <div>
          <div class="ev-card-marker">Marker<span>${it.marker||"–"}</span></div>
          <div class="ev-card-desc">${it.desc}</div>
        </div>
        <button class="ev-card-del" onclick="deleteItem('${it.id}')" title="Delete">✕</button>
      </div>
      <div class="ev-card-meta">
        ${statusBadge(it.status)}
        ${it.date ? `<span class="ev-card-row"><strong>Date</strong>${it.date}</span>` : ""}
        ${it.loc  ? `<span class="ev-card-row"><strong>Loc</strong>${it.loc}</span>` : ""}
        ${it.agency||it.agent ? `<span class="ev-card-row"><strong>Agency</strong>${agencyStr}</span>` : ""}
        ${it.ir   ? `<span class="ev-card-row"><strong>IR/Lab</strong>${it.ir}</span>` : ""}
        ${src     ? `<span class="ev-card-row">${src}</span>` : ""}
      </div>
      <div class="ev-card-notes">
        <textarea placeholder="Notes…" onchange="updateNote('${it.id}',this.value)">${it.notes||""}</textarea>
      </div>
    `;
    cardList.appendChild(card);
  });
}

function updateNote(id, val) {
  const it = items.find(i => i.id === id);
  if (it) { it.notes = val; saveItems(); }
}

function deleteItem(id) {
  if (!confirm("Remove this evidence item?")) return;
  items = items.filter(i => i.id !== id);
  saveItems(); populateLocFilter(); applyFilters();
}

function toggleAdd() {
  document.getElementById("addPanel").classList.toggle("open");
}

function uid() { return "ev-" + Date.now(); }

function addItem() {
  const marker   = document.getElementById("f_marker").value.trim();
  const desc     = document.getElementById("f_desc").value.trim();
  if (!desc) { alert("Description is required."); return; }
  const item = {
    marker,
    desc,
    loc:      document.getElementById("f_loc").value.trim(),
    agency:   document.getElementById("f_agency").value.trim(),
    agent:    document.getElementById("f_agent").value.trim(),
    date:     document.getElementById("f_date").value.trim(),
    ir:       document.getElementById("f_ir").value.trim(),
    status:   document.getElementById("f_status").value,
    srcLabel: document.getElementById("f_srcLabel").value.trim(),
    srcUrl:   document.getElementById("f_srcUrl").value.trim(),
    notes:    document.getElementById("f_notes").value.trim(),
    id:       uid()
  };
  items.push(item);
  saveItems(); populateLocFilter();
  // Clear form
  ["f_marker","f_desc","f_loc","f_agency","f_agent","f_date","f_ir","f_srcLabel","f_srcUrl","f_notes"].forEach(id => {
    document.getElementById(id).value = "";
  });
  document.getElementById("f_status").value = "Collected";
  document.getElementById("addPanel").classList.remove("open");
  applyFilters();
}

// Init
populateLocFilter();
applyFilters();
</script>
</body>
</html>
