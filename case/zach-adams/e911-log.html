/* ──────────────────────────────────────────
   Storage / render
────────────────────────────────────────── */
const STORE_KEY = 'e911_log';
const VER_KEY   = 'e911_log_ver';

function load() {
  try {
    const ver = localStorage.getItem(VER_KEY);
    if (ver !== String(SEED_VER)) throw new Error('stale');
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const data = SEED.map(r => ({
    bobo:r[0], date:r[1], shift:r[2], operator:r[3],
    time:r[4], to:r[5], from:r[6], disp:r[7],
    comments:r[8], flag:r[9], status:r[10], id:r[11]
  }));
  save(data);
  return data;
}

function save(data) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
    localStorage.setItem(VER_KEY, String(SEED_VER));
  } catch(e) {}
}

let DATA = load();
let nextId = DATA.reduce((m,r) => {
  const n = parseInt(r.id.replace(/\D/g,'')) || 0;
  return Math.max(m, n);
}, 100) + 1;

/* ── Filters ── */
function getSearchBox() { return document.getElementById('searchBox'); }
function getFilterDate() { return document.getElementById('filterDate'); }
function getFilterFlag() { return document.getElementById('filterFlag'); }
function getFilterStatus() { return document.getElementById('filterStatus'); }

function populateDateFilter() {
  const filterDate = getFilterDate();
  const dates = [...new Set(DATA.map(r => r.date).filter(d => d && d !== '[unknown]' && d !== '—'))].sort();
  filterDate.innerHTML = '<option value="">All dates</option>' +
    dates.map(d => `<option value="${d}">${d}</option>`).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function flagBadge(f) {
  if (f === 'Y') return '<span class="badge badge-flag-y">TIP</span>';
  if (f === 'P') return '<span class="badge badge-flag-p">NOTE</span>';
  return '';
}

function statusBadge(s) {
  const map = {T:['badge-t','Transcribed'],PA:['badge-p','Partial'],R:['badge-r','Redacted'],B:['badge-n','Blank'],NO:['badge-n','Note']};
  const [cls, label] = map[s] || ['badge-n', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

function trClass(f) {
  if (f === 'Y') return ' class="flagged-y"';
  if (f === 'P') return ' class="flagged-p"';
  return '';
}

function render() {
  console.log('render() called');
  try {
    const q     = getSearchBox().value.toLowerCase().trim();
    const dFilt = getFilterDate().value;
    const fFilt = getFilterFlag().value;
    const sFilt = getFilterStatus().value;

  const rows = DATA.filter(r => {
    if (dFilt && r.date !== dFilt) return false;
    if (fFilt) {
      if (fFilt === 'N' && (r.flag === 'Y' || r.flag === 'P')) return false;
      if (fFilt !== 'N' && r.flag !== fFilt) return false;
    }
    if (sFilt && r.status !== sFilt) return false;
    if (q) {
      const haystack = [r.bobo, r.date, r.operator, r.time, r.to, r.from, r.disp, r.comments].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => {
    const short = r.comments.length > 120 ? r.comments.slice(0,120) + '…' : r.comments;
    const full  = r.comments.replace(/\n+/g, '<br>');
    const hasMore = r.comments.length > 120;
    return `<tr${trClass(r.flag)} data-id="${esc(r.id)}">
      <td class="td-mono" data-label="BOBO">${esc(r.bobo)}</td>
      <td class="td-time" data-label="Date" style="white-space:nowrap">${esc(r.date)}</td>
      <td class="td-dim" ${r.shift ? 'data-label="Shift"' : ''}>${esc(r.shift)}</td>
      <td ${r.operator ? 'data-label="Operator"' : ''}>${esc(r.operator)}</td>
      <td class="td-time" data-label="Time" style="white-space:nowrap">${esc(r.time)}</td>
      <td ${r.to ? 'data-label="To"' : ''}>${esc(r.to)}</td>
      <td data-label="From">${esc(r.from)}</td>
      <td class="td-dim" ${r.disp ? 'data-label="Disp"' : ''}>${esc(r.disp)}</td>
      <td data-label="Flag">${flagBadge(r.flag)}</td>
      <td data-label="Status">${statusBadge(r.status)}</td>
      <td data-label="Comments">
        <span class="narr-short" onclick="toggleNarr(this)">${esc(short)}${hasMore ? '<span class="expand-btn">[expand]</span>' : ''}</span>
        <span class="narr-full">${full}${hasMore ? ' <span class="expand-btn" onclick="toggleNarr(this)">[collapse]</span>' : ''}</span>
      </td>
      <td><button class="del-btn" onclick="delRow('${esc(r.id)}')" title="Delete">✕</button></td>
    </tr>`;
  }).join('');

  // Stats
  const total   = DATA.length;
  const tips    = DATA.filter(r => r.flag === 'Y').length;
  const notable = DATA.filter(r => r.flag === 'P').length;
  const shown   = rows.length;
  const dates   = [...new Set(DATA.map(r=>r.date).filter(d=>d&&d!=='[unknown]'&&d!=='—'))].length;
  document.getElementById('statsBar').innerHTML =
    `<span class="stat"><strong>${total}</strong> entries</span>
     <span class="stat"><strong>${tips}</strong> case tips</span>
     <span class="stat"><strong>${notable}</strong> high-interest</span>
     <span class="stat"><strong>${dates}</strong> log dates</span>
     <span class="stat"><strong>${shown}</strong> shown</span>`;

  document.getElementById('emptyState').classList.toggle('show', rows.length === 0);
  } catch(err) {
    console.error('render() error:', err);
    document.getElementById('tbody').innerHTML = '<tr><td colspan="12" style="padding:20px">Error: ' + err.message + '</td></tr>';
  }
}

function toggleNarr(el) {
  el.closest('tr').classList.toggle('narr-open');
}

function delRow(id) {
  if (!confirm('Delete this entry?')) return;
  DATA = DATA.filter(r => r.id !== id);
  save(DATA);
  render();
}

/* ── Add form ── */
document.getElementById('addBtn').addEventListener('click', () => {
  document.getElementById('addForm').classList.toggle('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => {
  document.getElementById('addForm').classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const get = id => document.getElementById(id).value.trim();
  const entry = {
    bobo:     get('fBobo') || '—',
    date:     get('fDate') || '—',
    shift:    get('fShift') || '—',
    operator: get('fOper') || '—',
    time:     get('fTime') || '—',
    to:       get('fTo'),
    from:     get('fFrom'),
    disp:     get('fDisp'),
    comments: get('fNarr'),
    flag:     document.getElementById('fFlag').value,
    status:   document.getElementById('fStat').value,
    id:       'u' + (nextId++),
  };
  DATA.push(entry);
  save(DATA);
  populateDateFilter();
  render();
  document.getElementById('addForm').classList.remove('open');
  ['fBobo','fDate','fShift','fOper','fTime','fTo','fFrom','fDisp','fNarr'].forEach(id => {
    document.getElementById(id).value = '';
  });
});

/* ── Init ── */
/* ── Initialize immediately ── */
try {
  const sb = getSearchBox();
  const fd = getFilterDate();
  const ff = getFilterFlag();
  const fs = getFilterStatus();
  console.log('Elements found:', {sb: !!sb, fd: !!fd, ff: !!ff, fs: !!fs});
  if (sb) sb.addEventListener('input', render);
  if (fd) fd.addEventListener('change', render);
  if (ff) ff.addEventListener('change', render);
  if (fs) fs.addEventListener('change', render);
  populateDateFilter();
  render();
} catch(e) {
  console.error('Init error:', e);
}
</script>
</body>
