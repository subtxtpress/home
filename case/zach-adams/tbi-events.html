let entries = [];

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const ver = localStorage.getItem(VER_KEY);
    if (raw && ver === String(SEED_VER)) {
      entries = JSON.parse(raw);
      return;
    }
  } catch(e) {}
  entries = SEED.map(r => ({
    bobo: r[0], date: r[1], time: r[2], tn: r[3],
    summary: r[4], status: r[5], prec: r[6], flag: r[7], id: r[8]
  }));
  saveEntries();
}

function saveEntries() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(entries));
    localStorage.setItem(VER_KEY, String(SEED_VER));
  } catch(e) {}
}

function statusBadge(s) {
  const map = { Open: 'badge-open', Closed: 'badge-closed', Update: 'badge-update' };
  return `<span class="badge ${map[s] || 'badge-closed'}">${s}</span>`;
}
function precBadge(p) {
  if (p === 'Immediate') return `<span class="badge badge-imm">Imm.</span>`;
  return `<span class="badge badge-routine">Routine</span>`;
}
function flagBadge(f) {
  if (f === 'Y') return `<span class="badge badge-flag-y">TIP</span>`;
  if (f === 'P') return `<span class="badge badge-flag-p">NOTE</span>`;
  return '';
}
function flagClass(f) {
  if (f === 'Y') return ' flagged-y';
  if (f === 'P') return ' flagged-p';
  return '';
}

const TRUNC = 160;
function summaryCell(e) {
  const s = e.summary || '';
  if (s.length <= TRUNC) return `<span class="narr-short">${esc(s)}</span>`;
  return `<span class="narr-short">${esc(s.slice(0, TRUNC))}… <button class="narr-toggle" onclick="toggle(this)">more ▾</button></span>
          <span class="narr-full">${esc(s)} <button class="narr-toggle" onclick="toggle(this)">less ▴</button></span>`;
}
function toggle(btn) {
  btn.closest('tr').classList.toggle('expanded');
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const q    = document.getElementById('q').value.toLowerCase();
  const fDate = document.getElementById('f-date').value;
  const fStat = document.getElementById('f-status').value;
  const fFlag = document.getElementById('f-flag').value;

  const filtered = entries.filter(e => {
    if (fDate && e.date !== fDate) return false;
    if (fStat && e.status !== fStat) return false;
    if (fFlag && e.flag !== fFlag) return false;
    if (q) {
      const hay = [e.bobo, e.date, e.time, e.tn, e.summary, e.status, e.prec].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('empty-msg').style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(e => {
    const tr = document.createElement('tr');
    tr.className = flagClass(e.flag);
    tr.innerHTML = `
      <td class="c-mono" data-label="BOBO">${esc(e.bobo)}</td>
      <td data-label="Date">${esc(e.date)}</td>
      <td class="c-mono" data-label="Time">${esc(e.time)}</td>
      <td class="c-mono" data-label="TN #"><strong>${esc(e.tn)}</strong></td>
      <td data-label="Summary">${summaryCell(e)}</td>
      <td data-label="Status">${statusBadge(e.status)}</td>
      <td data-label="Prec.">${precBadge(e.prec)}</td>
      <td data-label="Flag">${flagBadge(e.flag)}</td>
      <td class="td-del"><button class="del-btn" title="Delete" onclick="delEntry('${e.id}')">×</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Update stats
  const open   = entries.filter(e => e.status === 'Open').length;
  const closed = entries.filter(e => e.status === 'Closed').length;
  const update = entries.filter(e => e.status === 'Update').length;
  const tips   = entries.filter(e => e.flag === 'Y').length;
  const notes  = entries.filter(e => e.flag === 'P').length;
  document.getElementById('stats-bar').innerHTML =
    `<span><span class="stat-val">${filtered.length}</span> / ${entries.length} entries</span>` +
    `<span>Open: <span class="stat-val">${open}</span></span>` +
    `<span>Closed: <span class="stat-val">${closed}</span></span>` +
    `<span>Update: <span class="stat-val">${update}</span></span>` +
    `<span>TIP: <span class="stat-val">${tips}</span></span>` +
    `<span>NOTE: <span class="stat-val">${notes}</span></span>` +
    `<span style="margin-left:auto;font-size:.7rem;">BOBO 00008739–00008786 · TBI Events Board · 04-13 to 04-17-2011</span>`;
}

function populateDateFilter() {
  const dates = [...new Set(entries.map(e => e.date))].sort();
  const sel = document.getElementById('f-date');
  dates.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

function delEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function toggleAdd() {
  document.getElementById('add-panel').classList.toggle('open');
}

function addEntry() {
  const id = 'u' + Date.now();
  entries.unshift({
    bobo:    document.getElementById('f-bobo').value.trim() || '?',
    date:    document.getElementById('f-adate').value.trim(),
    time:    document.getElementById('f-time').value.trim(),
    tn:      document.getElementById('f-tn').value.trim(),
    summary: document.getElementById('f-narr').value.trim(),
    status:  document.getElementById('f-astat').value,
    prec:    document.getElementById('f-aprec').value,
    flag:    document.getElementById('f-aflag').value,
    id
  });
  saveEntries();
  document.getElementById('add-panel').classList.remove('open');
  ['f-bobo','f-adate','f-time','f-tn','f-narr'].forEach(id => document.getElementById(id).value = '');
  render();
}

loadEntries();
populateDateFilter();
render();
</script>
