<style>
/* ── GitHub Dark / Light palette ── */
:root {
  --bg:          #0d1117;
  --bg2:         #161b22;
  --bg3:         #21262d;
  --border:      #30363d;
  --text:        #e6edf3;
  --text-dim:    #8b949e;
  --accent:      #58a6ff;
  --accent-dim:  #1f3a5c;
  --accent-subtle: #131d2e;
  --red:         #f85149;
  --green:       #3fb950;
  --yellow:      #d29922;
  --yellow-bg:   #272115;
  --pink:        #f778ba;
  --pink-bg:     #2a1520;
  --purple:      #bc8cff;
  --teal:        #39d353;
  --orange:      #e3b341;
}
[data-theme="light"] {
  --bg:          #ffffff;
  --bg2:         #f6f8fa;
  --bg3:         #eaeef2;
  --border:      #d0d7de;
  --text:        #1f2328;
  --text-dim:    #636c76;
  --accent:      #0969da;
  --accent-dim:  #b6d4fb;
  --accent-subtle: #ddf4ff;
  --red:         #d1242f;
  --green:       #1a7f37;
  --yellow:      #9a6700;
  --yellow-bg:   #fff8c5;
  --pink:        #bf3989;
  --pink-bg:     #ffeff7;
  --purple:      #8250df;
  --teal:        #1a7f37;
  --orange:      #953800;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Toolbar ── */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.toolbar h1 {
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  margin-right: 4px;
}
.toolbar h1 span { color: var(--text-dim); font-weight: 400; }

.stats-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  font-size: .75rem;
  color: var(--text-dim);
}
.stat-val { color: var(--text); font-weight: 600; }

/* ── Filters ── */
select, input[type="text"] {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: .78rem;
  font-family: inherit;
  cursor: pointer;
}
select:focus, input[type="text"]:focus { outline: 2px solid var(--accent); }
input[type="text"] { width: 180px; }

/* ── Buttons ── */
.btn {
  padding: 5px 11px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  color: var(--text);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}
.btn:hover { opacity: .8; }
.btn-primary {
  background: var(--accent-subtle);
  color: var(--accent);
  border-color: var(--accent-dim);
}

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  min-width: 1020px;
  border-collapse: collapse;
  table-layout: fixed;
}
colgroup col.c-bobo  { width: 110px; }
colgroup col.c-date  { width: 88px;  }
colgroup col.c-time  { width: 56px;  }
colgroup col.c-tn    { width: 72px;  }
colgroup col.c-summ  { width: auto;  }
colgroup col.c-stat  { width: 74px;  }
colgroup col.c-prec  { width: 72px;  }
colgroup col.c-flag  { width: 60px;  }
colgroup col.c-del   { width: 30px;  }

thead th {
  background: var(--bg2);
  border-bottom: 2px solid var(--border);
  padding: 7px 8px;
  text-align: left;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text-dim);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
tbody tr:hover { background: var(--bg3); }
tbody tr.flagged-y { border-left: 3px solid var(--yellow); }
tbody tr.flagged-p { border-left: 3px solid var(--pink); }
[data-theme="light"] tbody tr.flagged-y { background: #fffbdd; }
[data-theme="light"] tbody tr.flagged-y:hover { background: #fff8c5; }
[data-theme="light"] tbody tr.flagged-p { background: #fff0f8; }
[data-theme="light"] tbody tr.flagged-p:hover { background: #ffe4f2; }

tbody td {
  padding: 7px 8px;
  vertical-align: top;
  line-height: 1.45;
  font-size: .78rem;
  word-break: break-word;
}
td.c-mono { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; font-size: .72rem; }
td.td-del { text-align: center; vertical-align: middle; }
.del-btn {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: .9rem;
  padding: 0 2px;
  line-height: 1;
  opacity: .4;
}
.del-btn:hover { opacity: 1; color: var(--red); }

/* ── Narrative expand ── */
.narr-short { display: block; }
.narr-full  { display: none; }
.narr-toggle {
  color: var(--accent);
  cursor: pointer;
  font-size: .7rem;
  margin-top: 3px;
  display: inline-block;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}
.narr-toggle:hover { text-decoration: underline; }
tr.expanded .narr-short { display: none; }
tr.expanded .narr-full  { display: block; }

/* ── Badges ── */
.badge {
  display: inline-block;
  font-size: .62rem;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 9px;
  line-height: 1.5;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.badge-open   { background: #0d2e0d; color: #3fb950; }
.badge-closed { background: #21262d; color: #8b949e; }
.badge-update { background: #0d1a2e; color: #58a6ff; }
.badge-imm    { background: #3b0e0e; color: #f85149; }
.badge-routine{ background: transparent; color: var(--text-dim); font-weight: 500; font-size: .65rem; }
.badge-flag-y { background: #3b2c00; color: #d29922; }
.badge-flag-p { background: #2a1520; color: #f778ba; }
.badge-flag-n { display: none; }
[data-theme="light"] .badge-open   { background: #d4f4d4; color: #1a5c1a; }
[data-theme="light"] .badge-closed { background: #eaeef2; color: #636c76; }
[data-theme="light"] .badge-update { background: #ddf4ff; color: #0969da; }
[data-theme="light"] .badge-imm    { background: #fde0e0; color: #9a0000; }
[data-theme="light"] .badge-flag-y { background: #fff3b0; color: #7a5100; }
[data-theme="light"] .badge-flag-p { background: #ffe0f0; color: #8b005a; }

/* ── Add form ── */
.add-panel {
  display: none;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
}
.add-panel.open { display: block; }
.add-panel h2 { font-size: .85rem; margin-bottom: 10px; font-weight: 700; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.form-grid label { font-size: .7rem; color: var(--text-dim); display: block; margin-bottom: 2px; }
.form-grid input, .form-grid select, .form-grid textarea {
  width: 100%;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 7px;
  font-size: .78rem;
  font-family: inherit;
}
.form-narr { grid-column: 1 / -1; }
.form-narr textarea { width: 100%; min-height: 60px; resize: vertical; }
.form-actions { display: flex; gap: 8px; }

/* ── Empty ── */
.empty-msg {
  text-align: center;
  padding: 40px;
  color: var(--text-dim);
  font-size: .85rem;
}

/* ── Mobile ── */
@media (max-width: 700px) {
  table, colgroup, col, tbody, tr { display: block; }
  table { min-width: unset; width: 100%; }
  thead { display: none; }
  tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  tbody td { display: block; width: 100%; box-sizing: border-box; padding: 3px 0 3px 90px; position: relative; min-height: 1.5rem; }
  tbody td::before { content: attr(data-label); position: absolute; left: 0; top: 3px; font-size: .65rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; width: 82px; }
  tbody td:not([data-label]) { display: none; }
}
</style>
</head>

<script>
const STORE_KEY = 'tbi_events';
const VER_KEY   = 'tbi_events_ver';
const SEED_VER  = 5;

// SEED format: [bobo, date, time, tn, summary, status, prec, flag, id]
const SEED = [
  ["00008751", "04-13-2011", "1856", "TN0000", "The Event Board is Officially Open!", "Open", "Routine", "N", "t150"],
  ["00008751", "04-13-2011", "1510", "TN0001", "TBI Agent Pat Looney and Analyst Stephanie Davis arrived in Decatur County at the TBI Command Post.", "Open", "Routine", "N", "t151"],
  ["00008751", "04-13-2011", "1935", "TN0002", "Cell phone found by TBI Agent Chris Carpenter. At 21:51 hrs, S. Davis was informed by SA Mark Lewis that the cell phone belonged to a search party member — not connected with the case.", "Closed", "Routine", "N", "t149"],
  ["00008750", "04-13-2011", "1950", "TN0003", "Knife found by THP Brad Lund.", "Open", "Routine", "Y", "t147"],
  ["00008751", "04-13-2011", "0725", "TN0004", "John Babb spotted a white truck traveling at a high rate of speed on Swan Johnson Road.", "Open", "Routine", "N", "t152"],
  ["00008750", "04-13-2011", "2007", "TN0005", "Neighborhood canvas ongoing: Swan Johnson Road south of the crime scene, 5 forks to Henderson County line west of the crime scene, Bear Creek Road east of the crime scene, and a road north of the crime scene.", "Open", "Routine", "N", "t146"],
  ["00008750", "04-13-2011", "2018", "TN0006", "U.S. Marshal Chris Crozier searched the residence at 555 Swan Johnson Road, outer buildings, and vehicles — nothing was found. The search was performed because the bloodhound running a track for the victim ended at that residence.", "Closed", "Routine", "Y", "t145"],
  ["00008750", "04-13-2011", "2038", "TN0007", "Tony Weber, Decatur Co SO, is currently checking all Decatur Co Sex Offenders.", "Open", "Routine", "N", "t144"],
  ["00008750", "04-13-2011", "2040", "TN0008", "According to FBI Agent Bilnoski, Steve Paulk stalked victim's mother a few years ago.", "Open", "Routine", "Y", "t143"],
  ["00008750", "04-13-2011", "2048", "TN0009", "Decatur Co SO Ricky Inman spoke to Tim Manus Sunday at 5:45pm. It's the right turnoff from the crime scene; they saw a dark grey Durango with Hammond Co tags.", "Open", "Routine", "N", "t142"],
  ["00008750", "04-13-2011", "2051", "TN0010", "TBI SA Reeves Garnett checked the victim's home computer. When he touched the mouse the screensaver turned off and the Facebook login page immediately came up. Browsing history on the computer was checked — Facebook and Ebay were the most recent activity. A picture was recently accessed labeled 'Holly and Drew019' that appears to be the victim with her arm around a male.", "Open", "Routine", "N", "t141"],
  ["00008750", "04-13-2011", "2102", "TN0011", "Deputy Randy Quinn with the Decatur SO went to the Largest Coon Hunt Association and discovered that the victim had contact with a guy with Hamilton Co tags. SA Deatt called the Coon Hunt and the only information they had for the vehicle was the name O.B. Little and phone number 423-304-0038, no address.", "Open", "Routine", "N", "t140"],
  ["00008751", "04-13-2011", "0630", "TN0012", "Henderson Co SO Heath Delaney interviewed Jimmy Broadway between 6:30–7:00am. Mr. Broadway stated that he saw a beat up green S-10 truck with a blue tailgate on a gravel road off of Mt. Aaron Cemetery Road.", "Open", "Routine", "Y", "t153"],
  ["00008750", "04-13-2011", "2125", "TN0013", "FBI Bilnoski and Ricky Inman are looking for a Henderson Co Sex Offender named Brandon Kelly who drives a S-10 fitting the description given earlier by Jimmy Broadway. Negative information.", "Closed", "Routine", "N", "t139"],
  ["00008743", "04-16-2011", "1059", "TN0013", "Negative information located. He said he woke up at home and took his wife to work between 8-8:30 AM. He took her to work at Sonic in Parsons. From there he went to Betty James to pick up some money she owed him for moving some furniture. Then he went to the Delta gas station and purchased gas and paid with a check. Also on receipt at Sonic (discrepancy): on the coffee table there was a spiral notebook where written 'SONIC Hours, 4/13 10:27 AM to 5:05 PM.' According to the notebook she didn't start work until 10:30 and he says he dropped her off at 8:30. She did say she got to work early that day. Brandon Kelly: SSN 411-39-7335, DOB 5/22/82, residential address: 4430 Highway 100 East, Decaturville, TN, cell: 731-487-4116.", "Closed", "Routine", "Y", "t42"],
  ["00008750", "04-13-2011", "2142", "TN0014", "Cell tower information: Victim's phone received a phone call at 9:06am north of I-40. Sean Cagle and team are conducting a canvas of the North 40 truck stop based on this information.", "Open", "Routine", "Y", "t138"],
  ["00008750", "04-13-2011", "2224", "TN0015", "TN0013: Decatur County Deputy Sheriff Inman, FBI SA Cardone, and FBI SA interviewed Brandon Kelly at Kelly's home at 4430 Highway 100 East in Decaturville. Results Negative.", "Closed", "Routine", "N", "t137"],
  ["00008750", "04-13-2011", "2232", "TN0016", "FBI SA Viveros and USMS Shane Brown interviewed Keith Clark, a friend of James Barnes, at Clark's residence at 223 Butler Road at 21:45 hours. Results Negative.", "Closed", "Routine", "N", "t135"],
  ["00008750", "04-13-2011", "2258", "TN0017", "TBI SA Mark Lewis and FBI SA Joe Upton interviewed all of Victim Holly Bobo's classmates from UT Martin at Parsons at approximately 12:00 hours. The students and teacher missed Victim Bobo when she did not show up for class at 08:30. No follow-on information was obtained.", "Open", "Routine", "N", "t134"],
  ["00008750", "04-13-2011", "2331", "TN0018", "Natalie Bobo, Victim Holly Bobo's cousin, stated she and the victim were walking in front of James Barnes' house on the 1st or 2nd of April 2011 and noticed two Male Whites watching them from the front of Barnes' house. FBI SA Viveros and TBI SA Brent Booth interviewed Barnes at his residence at 14:30 hours on Wednesday 13 Apr 11. The other male white was Keith Clark. Barnes stated he was loading his pickup truck with tools between 07:40 and 08:10 on Wednesday 13 Apr 11 when he heard screams from the direction of Holly Bobo's house — like those of someone being frightened. Barnes walked toward Holly's house but saw nothing. Barnes' wife came outside with the child and got in the pickup with Barnes to go to work. Barnes does not usually drive by Holly's house but did on this occasion and saw nothing. Barnes' wife called Holly's mother at work and advised her of the situation. One of Holly's relatives contacted by Barnes' wife called the Sheriff's Office at 07:59 — this was the first report. The second call to the Sheriff's Office was at 08:08.", "Open", "Routine", "Y", "t133"],
  ["00008750", "04-14-2011", "0111", "TN0019", "Decatur County Sheriff's Deputies Michael Hamilton and Travis Dunavant came to the CP and reported that Decatur County Dispatch received a 911 call at 12:20 hours on Wednesday 13 Apr 11 from MW/17 Landon Bibbs, DOB 08/09/1993, home phone 731-847-3033. Hamilton called Bibbs, who stated he had a doctor's appointment with Dr. Montgomery at 09:50 on Wednesday morning 13 Apr 11. When Bibbs arrived at the doctor's office he heard weeping screams from the rear of the doctor's office and the college somewhere close to Bible Hill. Bibbs told the doctor's secretary about the screams but did not call the police. He learned of the disappearance of Victim Bobo when he returned home that night and told his mother, who told him to call the police. Bibbs' mother is Monica Thomas, who has been handled by the Decatur Sheriff's office on drug charges in the past. Bibbs attends Riverside High School from approximately 07:45 to 14:45 each day. Deputy Hamilton called Parsons Police Dispatch and was advised that no calls were made in the area of Dr. Montgomery's office all day. Deputy Hamilton obtained a written statement from Bibbs at 02:00 on Thursday 14 Apr 11. Statement on file in the CP. No further action at this time.", "Open", "Routine", "Y", "t132"],
  ["00008750", "04-13-2011", "2230", "TN0020", "TBI SIA Pat Looney and Analyst Stephanie Davis left the Command Post.", "Closed", "Routine", "N", "t136"],
  ["00008750", "04-14-2011", "0738", "TN0021", "TBI SA Lewis advised that TBI SA Terry Dicus was en route to the Decatur County Bank to check on Victim Bobo's financial records, check recent activity, and advise the bank to contact TBI if there is any activity with Victim Bobo's account.", "Open", "Routine", "N", "t131"],
  ["00008739", "04-17-2011", "0904", "TN0021", "Bank officials advised SA Dicus and Det. Ricky Inman: no bank cards on Holly's accounts, just a check book. Around $90.00 in the account. She just deals with cash and checks.", "Closed", "Routine", "N", "t6"],
  ["00008750", "04-14-2011", "0805", "TN0022", "TBI SA Lewis advised that USMS Chris Crozier is checking any possible financial leads unknown to investigators, i.e. credit cards.", "Open", "Routine", "N", "t130"],
  ["00008750", "04-14-2011", "0812", "TN0023", "TBI SA Lewis advised that USMS Crozier and Henderson County Deputy Sheriff David Dowdy are checking on the sex offenders in Henderson and Decatur County.", "Open", "Routine", "N", "t129"],
  ["00008742", "04-16-2011", "1115", "TN0023", "Majority of sex offenders have been checked per SA Mark Lewis.", "Update", "Immediate", "N", "t39"],
  ["00008750", "04-14-2011", "0855", "TN0024", "Written statement obtained from MW/DOB 01/22/1948 Mike Oneill Cook from Henderson County Deputy Sheriff Kenneth Thompson at the CP. Mr. Cook believes he saw Victim Bobo with a MW around 12:20 hours on Wednesday in the area of a gravel pit off Highway 412.", "Open", "Routine", "Y", "t128"],
  ["00008739", "04-17-2011", "0923", "TN0024", "Homeland Security SA Joseph Hudgins picked up on this information. Not a positive ID — witness said it looked like her. Met with Perry Co SO Chief Deputy Nic Weemes (931) 213-4192, lead investigator Fred Moore (931) 213-1813. Spoke to Gary Patel, manager of Fatman's Deli in Perry County (615) 337-0415. Perry Co assigned Deputy George Dittfuth (815) 542-4242 to canvass all stores in county, question and place posters. 1700: Deputy Dittfuth completed contact with all stores, nothing to report. BOLOs went out.", "Closed", "Routine", "N", "t5"],
  ["00008750", "04-14-2011", "1122", "TN0025", "FBI SA Joe Upton went to Parsons High School to interview F/W DOB 07/17/1994 Jessica Pearcy, who stated she was home alone at 1455 Wilkins Town Road, Darden, TN on Thursday 07 Apr 11 at approximately 11:00 hours, when a MW approximately 40 years of age, height 5'10\", skinny build, with black shaggy hair, black goatee, wearing camouflage pants walked into her garage. Jessica opened the door and the MW said he didn't expect anybody to answer the door. Said something about a car or tree being down. Jessica said they didn't call anybody about a tree down. The MW turned and walked to a late-1980s gray Chevrolet Blazer 4-door with a blonde F/W in the passenger seat — not Victim Bobo. Jessica can ID the MW if seen again. Jessica's home phone: 731-847-7209, mother Charity Pearcy's cell: 731-549-7853.", "Open", "Routine", "N", "t126"],
  ["00008751", "04-13-2011", "1946", "TN0027", "Caller telephoned the 800 number to state that Blake Barnett posted on Facebook approximately 23 minutes before she called in at 12:30pm. Caller stated she befriended Blake through her daughter's Facebook page and he accepted the request from his iPhone. Upon checking Blake's Facebook page, there had not been an entry made in the past 20 hours. The caller wanted to advise since he is a suspect or has been a suspect and has not been able to be located. Caller's phone number: 731-614-7354.", "Open", "Routine", "N", "t148"],
  ["00008749", "04-14-2011", "1236", "TN0028", "Melissa Quinn (913) 940-8311 — lives in Kansas now but has known Holly for a very long time. Remembers that Holly had a very rough breakup with ex-boyfriend Blake Barnett. Ms. Quinn states Holly went to court and got a restraining order within the last year — no record found in the Portal. Blake stays with his grandfather Jimmy Jones and step grandmother Sandra Jones on Bible Hill Road. Ms. Quinn states her family used to own the farm and knows there are several places to hide something because it is on 80 acres with barns and two ponds. Ms. Quinn stated she looked at Blake's Facebook page and was 'startled' by what she saw.", "Open", "Immediate", "Y", "t125"],
  ["00008749", "04-14-2011", "1302", "TN0028", "SA Dennis King with 24th Judicial Task Force, approximately 14:30 on 4/13/2011, went to the crime scene relaying information to the Decatur Chief Deputy. Sometime between 7pm, a lady advised that she saw a man sitting on Bible Road in Henderson Co with camouflage. No name or contact other than a phone number. SA King made contact with a male subject in a charcoal Silverado — identified himself as Gayton Rainey — and advised SA King that he was turkey hunting. King also spoke with some unknown neighbors.", "Open", "Routine", "N", "t123"],
  ["00008749", "04-14-2011", "1315", "TN0029", "FBI Agent Joe Upton interviewed Brittany Brown — she provided an email address for Holly of hollbobo_09@hotmail.com.", "Open", "Routine", "N", "t122"],
  ["00008749", "04-14-2011", "1324", "TN0030", "Approximately 12pm today, SA Mark Lewis advised he received a tip that there was a road construction crew working on Cavia Road yesterday. The caller thought he may have seen something. Carroll Co SO canvassed this area today and spoke to the Construction Crew and provided no information per Carroll County Sheriff Dickson.", "Closed", "Routine", "N", "t121"],
  ["00008749", "04-14-2011", "1330", "TN0031", "TFOs Todd Thayer and Chris Goffman spoke to white male Alan Evans. Said around 8:20 yesterday morning he was on Bohannon Landing Road when he passed a white late-80s/early-90s white single cab pickup with three subjects in the vehicle. The driver was a white male wearing a long sleeve camouflage shirt with sandy brown hair. Unknown about the other 2 passengers. They were about 6–8 miles from the victim's house. The pickup was traveling east toward the river.", "Open", "Routine", "N", "t120"],
  ["00008749", "04-14-2011", "1415", "TN0032", "Victim's family states these are the items she was last known to be wearing: shirt (hot pink in color), 'Fitting Girlie Girl Original' (front left breast) in black & yellow or black & white lettering; on the back in black and white letters 'don't squat with your spurs on'; black flip flop Old Navy brand size 6.5 or 7; blue faded jeans; belly button ring (unknown type); white gold diamond ring (square setting), small diamonds with center diamond being largest.", "Open", "Routine", "P", "t119"],
  ["00008750", "04-14-2011", "0902", "TN0033", "TBI Agent Arthur Viveros and TBI Agent Brent Booth spoke with Natalie Bobo, 156 Myracle Rd, Parsons, TN 38363. Natalie met a guy Steve Warner W/M, 50s, 5'10\", over 200 lbs, with an injured foot (walks with a crutch) on MySpace about 1 yr ago who offered to take pictures of her for free. He took pictures at various locations around her home. She traveled to Nashville at his expense for more pictures. Warner has a brother about the same age who visited once. She stopped communication with Warner after the last Nashville photo shoot. Last summer she worked as a stripper in a club named Cherry's in Corinth, MS, manager Jake (LNU), W/M, 50s, 5'8\"–5'9\", cell 662-212-2158. January 14–19, 2011 she was employed as a stripper in Miami after responding to sexyjobs.com, offered by miamifinestmodels.com, manager Miguel (LNU), who paid her airfare from Nashville to Miami. She quit after they asked her to become a prostitute and her father paid her return airfare. None of the clubs or people mentioned knew Holly except Steve Warner. Natalie did not tell Warner about Holly, but Holly allowed Warner to be a friend on her MySpace after her mother Karen Bobo asked Holly to do so, so Karen could examine Warner's page. Natalie requested that Warner delete his friendship with Holly to maintain her own privacy. Natalie indicated she and Holly used marijuana in the past but stopped last year and used no other drugs.", "Open", "Routine", "N", "t127"],
  ["00008749", "04-14-2011", "1835", "TN0034", "Anonymous caller advised a female body was found at 8:05am this morning in Crooksville, Ohio. The Perry County Sheriff's Office is investigating. Sheriff's phone: (740) 342-4123.", "Open", "Immediate", "N", "t115"],
  ["00008742", "04-16-2011", "1150", "TN0034", "LEIC Allen spoke with Dispatcher Howell with the Perry County Ohio Sheriff's Department. Dispatcher Howell advised the body had been identified as being Laura Chevalier of Roseville, Ohio.", "Update", "Immediate", "N", "t36"],
  ["00008749", "04-14-2011", "1653", "TN0035", "Complainant Vicky Harris had read the news story on the 48 Hours Web Site. She advised a large white male subject dressed in a camouflage jacket walking a black Rottweiler. He was bald and had a thick build. She lives in the area of a state and a private prison. She had never seen the man in the area before and was concerned because of the story. (Osceola Mills, Pennsylvania.)", "Open", "Routine", "N", "t113"],
  ["00008749", "04-14-2011", "1845", "TN0036", "On 4/14/11 approx 4:45pm, Joe Walker interviewed Dorothy Hill W/F DOB 5/20/80, 2730 Taylor Town Rd, Wildersville, 731-845-5434. Between 4–6pm on 4/13/11 she was traveling from Lexington on the Natchez Trace Pkwy Rd. Before she got to the firing range and shop she got behind a Red Jeep Cherokee; she thought it was her brother. As she neared, the Red Jeep took off at 60–65 on the curvy road — she knew it wasn't her brother. The Red Jeep turned off on Cub Lake Rd, ran a stop sign, and she ran it trying to catch it. The Red Jeep had dark tinted windows; she could not see anyone inside. Possibly a gray area around the bottom of the Jeep.", "Open", "Routine", "N", "t114"],
  ["00008749", "04-14-2011", "1726", "TN0037", "Justin Brooks & Kevin Bini called to advise that a male subject with the last name Hopper was in jail with Justin in December in Tipton County. Justin Brooks advised the subject is from Henderson County, TN and had been arrested for meth. He had a hold on him for Madison County. Brooks advised that while in jail, Hopper said he wanted to abduct girls and had been to prison before. Brooks described him as 6'0, approx 180 lbs, with long black hair hitting the middle of his back. Contact number: 901-626-2268.", "Open", "Routine", "Y", "t112"],
  ["00008742", "04-16-2011", "1208", "TN0037", "LEIC Allen has possibly identified the subject as being Shane Hopper, DOB 09/15/1973. His address is 104 Willow Point in Lexington, Tennessee. His point of contact on his Tipton County booking record is his mother, Margaret Fry (731) 602-0005. CL Photo and CCH available at TBI HQ.", "Closed", "Routine", "N", "t35"],
  ["00008749", "04-14-2011", "1728", "TN0038", "Michael James, 856 Golf Crest, Acworth, GA 30101, (cell) 678-787-3632, (home) 770-672-0677. Mr. James advised he was on Craigslist and found an ad in the casual encounters section that appeared to include a photo of the victim. Mr. James emailed the ad to LEIC Allen. (Craigslist Atlanta posting dated 2011-04-13, 5:43am: 'My gf pics for you — send your gf or wife pics and I'll send mine together or alone. Location: Atlanta.')", "Open", "Routine", "N", "t111"],
  ["00008749", "04-14-2011", "1805", "TN0039", "Kevin Lewis, (901) 482-7510, advised he may have seen Bobo at the Mijpco gas station at 1781 Kirby Pkwy/Poplar Ave, Memphis-East, TN 38138. Mr. Lewis saw a blonde female around 25 wearing a white shirt and beige pants, Wednesday (4/13) around 6:00pm — it looked like the missing female. The female was pumping gas, paid the clerk, and left. No direction of travel. The female was driving a mid-2000 white Toyota 4Runner. No tag information.", "Open", "Routine", "N", "t110"],
  ["00008748", "04-14-2011", "1835", "TN0040", "Lindsey Griffin, (615) 473-2882, advised she saw a female with dirty brown hair, wearing blue jeans and two shirts at Target in Brentwood, TN that looked like the missing girl. She was with a male subject wearing a green t-shirt and brown pants with a bandcap pulled down over part of his face. When Ms. Griffin left Target she saw them again around I-65 in the median; they appeared to be hitchhiking.", "Open", "Routine", "N", "t109"],
  ["00008748", "04-15-2011", "0715", "TN0041", "Carolyn Rogers, 9800 Hwy 100, Scotts Hill, TN (731) 549-5869. Mrs. Rogers is the aunt of Dana Bobo. On Wednesday at approximately 7:00am she met a dull red or maroon late model car in a deep curve on Box Rd going toward Hwy 412. The car almost ran her off the road and was traveling at a high rate of speed.", "Open", "Routine", "Y", "t104"],
  ["00008748", "04-15-2011", "0720", "TN0042", "Sarah Saunders, N. Long Avenue, Hamilton, Ohio (513) 448-5874. Ms. Saunders is a nursing student in Hamilton, Ohio. She had an encounter with a male in a camouflage coat with a southern accent on a Monday or Wednesday approximately a month ago. She stopped to get a dog out of the road and the male subject approached her in a threatening manner. The subject was driving a green Ford Explorer or Jeep-type vehicle. When a similar vehicle in navy and tan pulled up, she left the area.", "Open", "Routine", "N", "t103"],
  ["00008748", "04-15-2011", "0745", "TN0043", "Resident Rhonda Kates left for work yesterday morning between 9:00–9:30am and noticed a black Jeep with black tinted windows parked in a pulloff near Bunches Chapel, right before you enter Interstate 412. The individual in the car was a white male in camouflage and he was on the cell phone. Rhonda Kates 731-847-2583.", "Open", "Routine", "N", "t101"],
  ["00008748", "04-15-2011", "0748", "TN0044", "Mr. Thomas claims he may have seen missing person Bobo and suspects at Bojangles (#1056) in Franklin, NC on Highway 441. Two men in camouflage at that Bojangles/Shell station around 9:00am EST. After leaving, he saw a woman wearing pink near the Ruby Cinema (about 3 miles from the Bojangles on Hwy 441). One man at the Shell station buying beer while the other was buying food at Bojangles. Both men were around 6ft tall and wearing camouflage with small shaped patterns.", "Open", "Routine", "N", "t100"],
  ["00008748", "04-15-2011", "0748", "TN0045", "Rose Hinchey (731) 733-1837. Ms. Hinchey advised that on Wednesday around noon she saw a red mini-van parked up in the woods at 8803 Brooksy Thompson Road, Bath Springs. A white male in driver's seat looked to be hiding and watching for something.", "Open", "Routine", "N", "t99"],
  ["00008748", "04-15-2011", "0615", "TN0047", "A woman from another state had been in Shelbyville, TN and remembered seeing a poster of a missing blond girl from Shelbyville. The poster was in the TAC Shop called WinterCity next to the Best Western Hotel. She thought the two missing girls could be connected to each other; wanted to be anonymous.", "Open", "Routine", "N", "t105"],
  ["00008748", "04-15-2011", "0818", "TN0048", "Sara Webb, (615) 352-3512 or (815) 779-8783. Mrs. Webb advised that she stayed with a female subject in Alabama possibly involved in Human Trafficking and may have been involved in the victim's disappearance. The female, Allison Smith, looks like a man and is a former Marine. Webb found Smith's dog tag with the name L. Christiansen on it. Smith lives at 530 County Road 179 in Crossville, Alabama with her two sons. Ms. Webb found evidence someone at the home had looked at a website about selling kids for sex. She stayed with Smith in November 2010 while caring for her mother.", "Open", "Routine", "N", "t98"],
  ["00008748", "04-16-2011", "0615", "TN0048", "[UPDATE — 04/16] Caller had been praying and had a dream last night she wanted to share. She dreamed of a white barn with hay. She dreamed you had to cross an older bridge and she remembered the name Charlotte. She believes the young girl is still alive. Did not leave a name.", "Open", "Routine", "N", "t106"],
  ["00008748", "04-15-2011", "0917", "TN0049", "Stacey Rice, 190 Neely Avenue, Parsons, TN 38363 (731) 847-2519. Ms. Rice advised that her boyfriend, Harold Mitchell, is a registered sex offender and has been telling her he knows where the victim is located. Ms. Rice advised that when Mitchell left the house on Tuesday he was driving a red Mercury and when he came home yesterday he told her he had sold it. Mitchell was at the residence this morning and Ms. Rice advised she waited until he had left to call. TBI SA Mark Lewis, FBI Joe Upton, US Marshall Chris Crozier are checking on this lead.", "Open", "Immediate", "Y", "t95"],
  ["00008746", "04-15-2011", "1500", "TN0049", "Joe Upton, FBI. Spoke to Stacy Rice — advised that Mitchell left as of last Friday, returned on 4/14/2011. He had a red 1985 Mercury Cougar that was scrapped earlier in the week. He had never mentioned Holly to her. Hasn't talked about what has happened. While he was not living with her he was staying with Roger (last name unknown) and Pam Brown. Roger works at Bo's Furniture in Parsons. She said Harold was there on and off. Spoke with Roger — he verified he took Harold on Tuesday 4/12/11 to Lexington, TN to scrap the vehicle. He stayed with Roger Tuesday night. Wednesday, Roger went to work and later mid-morning Wednesday Harold was with his cousin (Terry Arnold) at the shop 731-307-8100. He stayed with Terry all rest of Wednesday through Thursday.", "Update", "Routine", "P", "t76"],
  ["00008747", "04-15-2011", "0934", "TN0050", "Anonymous caller 4/15/2011 at 9:05 advised that on a Face Book friend (of the victim), Matt Elkins has a friend named Randy Cortew. And he is dressed in camouflage and is staying with a woman (maybe victim).", "Open", "Routine", "Y", "t93"],
  ["00008747", "04-15-2011", "0930", "TN0051", "Clint Griswald, Baton Rouge, LA (225) 772-3651. Complainant wishes to remain anonymous. Complainant was driving through Tennessee on 4/11/11 on I-40 near Parsons. Pulled off exit to get gas and stopped at a McDonald's attached to Loretta Lynn's Kitchen (possibly Waverly exit). Subject was in line in front of caller. Subject was very agitated, loud, made threatening remarks, 'acting crazy.' Left McDonald's and went down the road and pulled off. Seemed to be waiting for caller to come by him. Subject was driving a brown/gray car, Hood/Odyssey-type vehicle, 5'11'. Subject was wearing blue jeans.", "Open", "Routine", "N", "t94"],
  ["00008747", "04-15-2011", "1019", "TN0052", "Sherry Ashley 205-466-5444. Complainant called to advise that a female subject in Blount County, Alabama was ambushed on Sunday night, April 10, 2011 at approximately 8:30 pm. The male subject attempted to grab the female at her residence as she was getting into her car. The female was able to get away. The male subject was tall, white male and had light colored or gray hair. Ms. Ashley has heard that he attempted to abduct another female in the county the same night. Blount County, AL is located approximately 3 miles south of Parsons, TN per the complainant.", "Open", "Routine", "N", "t90"],
  ["00008742", "04-16-2011", "1128", "TN0052", "LEIC Allen spoke with dispatch and requested to speak with Investigator Latta. Dispatch is attempting to reach him.", "Update", "Routine", "N", "t37"],
  ["00008742", "04-16-2011", "1216", "TN0052", "LEIC Allen spoke with Investigator Latta. He advised that they have been unable to locate the victim of this incident. They received the information through messages being posted to the internet by members of their community. At this time they do not have any specific information regarding the case. Advised they will contact TBI back with any further information on file.", "Closed", "Routine", "N", "t34"],
  ["00008747", "04-15-2011", "1010", "TN0053", "Male subject called 800 TBI FIND. He asked if he was talking to the FBI or TBI. Once he was told he was talking to TBI he stated 'He was glad that the girl was missing and hoped mom went missing because of the Bush era bullshit' and then hung up the phone. The number listed on the caller ID was 760-922-9832. Subject sounded like he had a Northern or Midwestern accent.", "Open", "Routine", "N", "t91"],
  ["00008748", "04-14-2011", "2130", "TN0054", "TBI SA Mark Lewis. Sandra Miller, 125 Mills Lane, (731) 549-7559. Around 6:05am Mills saw a white male dressed in camo with a floppy hat and a white dog carrying a shovel — looked suspicious. Area of Horny Head Creek Road and Gooch Road. Male later identified by SA Mark Lewis as Marshall Spoon, DOB 9-12-70, TX DL 024813397. Spoon advised he was walking in that area with those clothes, a shovel, and a white dog between 7:30–8:00am Wednesday, does not remember seeing anything unusual. Spoon lives in a tent on Horny Creek Road halfway between Mills Lane and Gooch Road.", "Open", "Routine", "N", "t107"],
  ["00008748", "04-14-2011", "2030", "TN0055", "TBI SA Mark Lewis — Holly Bobo's lunch box was located by local resident John Graves on the side of Gooch Road in a creek, approximately between Bible Hill Road and Horny Head Creek Road. Lunch box verified to belong to victim.", "Open", "Routine", "Y", "t108"],
  ["00008747", "04-15-2011", "1151", "TN0057", "LEIC James Bryson received a call from a cab driver in Columbus, OH on the TBI find line at approximately 11:35am. Citizen did not provide name but called from 614-353-8871. Cab driver explained about 2 to 3 evenings ago he saw a car traveling 270 N and a blonde girl looked at him from the car window then a guy looked at her and she turned away. The guy sped away and he could not make out the vehicle TAG. Cab driver reported that the guy had a football build, short dark hair cut, tan complexion. The vehicle was described as a Mid 80's Gray Dodge-type car.", "Open", "Routine", "N", "t87"],
  ["00008747", "04-15-2011", "1216", "TN0059", "At approximately 10:30am LEIC Kershaw received a call from Sonya in Oregon at 503-754-6607. Sonya called to report information on a suspect, Paul Evans Winklebluck, in her daughter's kidnapping. According to Sonya, case has been mentioned on America's Most Wanted 3 times. Winklebluck has impersonated Police Officers wearing camo. Sonya reported some details similar to Bobo case. Suspect in her daughter's kidnapping is still on the run and her daughter was able to escape. Det. Michelle Michaels in Portland, OR worked the case.", "Open", "Routine", "N", "t86"],
  ["00008741", "04-16-2011", "1255", "TN0059", "LEIC Allen located information on Paul Winkleblack on AMW [America's Most Wanted]. Subject is still at large per the AMW website. http://www.amw.com/fugitives/case.cfm?id=71863", "Closed", "Routine", "N", "t28"],
  ["00008747", "04-15-2011", "1030", "TN0060", "Joseph Hudgens & Art Viveros, FBI. Interviewed Travis Eugene Hemby Volner, 68 Beasley Loop, Linden, TN, DOB 7-21-91, SSN 411-69-3490. Nursing student at UTM-Parsons. Lives with his father Kenny Volner. Sophomore, class on Wednesday from 0930 to 1045 (English comp) approximately 5 minutes late because he overslept. Father can verify he was at home. He did not have a class with Holly but knew her through school and spoke to her a few times at UTM-Parsons. Last time talked to her was a scholarship banquet in 2009 where they both won a $1000 scholarship. Has known her for 6–7 years. He couldn't recall anyone who would have wanted to hurt Holly or had an obsession with her. Story seems credible.", "Closed", "Routine", "N", "t89"],
  ["00008747", "04-15-2011", "1038", "TN0061", "Joseph Hudgens & Art Viveros, FBI. Interviewed Courtney LeAnn Tanner, 1727 Clayword Road, Decaturville, TN, cell 731-549-0284, DOB 8-17-91, SSN 412-69-6705. Student at UTM-Parsons, sophomore majoring in education. Knows Holly through growing up with her and through church — Corinth Baptist Church in Darden. Had a Wednesday class 0930 English Composition approximately 5 minutes late due to sleeping in. She stated she did not have any classes with Holly. Can't think of anyone who would want to hurt Holly. Did notice a creepy guy in a white van who wore glasses waiting for someone at the school, in his late 20s approximately 5'10', and he would sometimes wait in the student lounge with a small laptop and play the game Bejeweled. Charity Pearcy who works for Dr. Phillips in Parsons relayed to her that an older gentleman in a gray beard with camo pants came up to Pearcy's house and asked if they needed any brush cleared from the property.", "Open", "Routine", "Y", "t88"],
  ["00008747", "04-15-2011", "1223", "TN0062", "At 10:48am Admin Asst Dickerson received a call from Scott Vincent at 914-781-7515. Mr. Vincent stated he called earlier but wanted to add that upon searching Holly Bobo's Facebook pages, he found a 'friend' she had named Randy Cortew. Mr. Vincent stated that both the victim and Scott Cortew attended UT Martin College. He also stated that the picture on Facebook showed him in camo and as an outdoorsman.", "Open", "Routine", "Y", "t85"],
  ["00008739", "04-16-2011", "1851", "TN0063", "Wes Mays FBI Agent, SA Art Viveros FBI spoke to Mike Chisel, sister's brother-in-law. DOB 6/22/1968, SSN 024-49-7022, W/M 250 lbs at 2575 Mouse Tail Rd, Parsons, TN 731-847-2058. States he's bi-polar and takes medications. Says he does own camo overall hunting garment but hasn't worn in a year. Does not go into woods. On Wednesday April 13 he was at home — wife Deanna can verify. On disability; does not hunt but owns several rifles at a friend's house because he's had thoughts of suicide in the past. Son Dakota Sharpe, 18 yrs, goes to UT-Martin, knows victim. Both said Dakota was sick on the 13th. After interview, determined this lead can be closed.", "Closed", "Routine", "N", "t12"],
  ["00008746", "04-15-2011", "1343", "TN0065", "At 1:20 pm TBI Charley Dickenson received a call from Remona Carter from Petal, MS at 601-227-1356. Remona believes that Holly Bobo is alive and in the trunk of a car and is crying. Remona says she is an evangelist and has premonitions and dreams that sometimes become reality. She said in her dream there was a reference to a bathroom — when she reached for the tissue roll there would not tear and it looked like a blue and white striped towel instead of tissue paper, rough, like the type you would scratch your back with. She said this might signify: inside of a car trunk, a towel in the trunk, someone's bathroom she (Holly) knew, a bathroom where Holly might have been before, or a bathroom inside a building she'd been in.", "Open", "Routine", "N", "t82"],
  ["00008746", "04-15-2011", "1348", "TN0066", "Victoria Hayes (731) 549-2183. Ms. Hayes works in Sporting Goods at the Wal-Mart in Lexington, TN. She advised they have had 4 sales of MREs this week and she found that very unusual as they usually only sell one or two a year. She is currently at the Wal-Mart but could not get the store's number. She will be home after 5pm.", "Open", "Routine", "Y", "t81"],
  ["00008746", "04-15-2011", "1401", "TN0067", "TBI SA Cathy Ferguson & SA Doug Pate — Checking on leads: Robby Middleton 731-549-0397 has information and Karen Lancaster 731-847-6726 has information re: Paul Ray Pruett, possible child molesters seen with the victim (not recently). Pate left voice memos to both subjects.", "Open", "Routine", "N", "t80"],
  ["00008746", "04-15-2011", "1424", "TN0067", "Ferguson and Pate — Jonathon Dodd, W/M, female lives in the Bible Hill Road area, lives with grandfather Grafton Dodd, son of Bradley Dodd. Came in as a tip that he is a mean person, lives in the area, and is capable of doing something like this. Working on leads.", "Open", "Routine", "N", "t78"],
  ["00008745", "04-15-2011", "1623", "TN0067", "Dodd 731-549-0599, was at Ben Steele house asleep. Ben Steele is a rescue squad and Dodd went with him on the search. Dodd heard screams in the woods near Evanstown Road and Cedar Hill Road last night at dark.", "Open", "Routine", "Y", "t73"],
  ["00008745", "04-15-2011", "1657", "TN0067", "SA Pate called Judy Onan, phone 731-733-2467, who said she was with Pruitt from Sunday night 10 Apr 11 to Thursday night 14 Apr 11 until approximately 19:00 hours. Pruitt was arrested by Decatur County Sheriff's Officers Thursday night 14 Apr 11 and is still in custody.", "Update", "Routine", "N", "t65"],
  ["00008745", "04-15-2011", "1749", "TN0067", "SA Pate called Robbie Middleton — left message, has not called back. Spoke to Karen Lancaster. Still unable to locate Paul Ray Pruitt. He is a suspicious person who lives in the area but could not give specifics on how to find him.", "Update", "Routine", "N", "t62"],
  ["00008745", "04-15-2011", "1925", "TN0067", "SA Ferguson and Pate — Jonathon Dodd, W/M, female lives in the Bible Hill Road area, lives with grandfather Grafton Dodd. Son of Bradley Dodd. Came in as a tip that he is a mean person, lives in the area, and is capable of doing something like this. Working on leads.", "Open", "Routine", "N", "t61"],
  ["00008746", "04-15-2011", "1414", "TN0068", "Email from Inv. Penney Curtis, Chattanooga PD CSU 423-643-5000: 'EDDIE NEAL HALL (W/M) 5'07 200lbs, TOMIS ID#: 00317368. HALL IS A VALIDATED MEMBER OF THE ARYAN BROTHERHOOD AND WAS SENTENCED TO PRISON FOR AGGRAVATED BURGLARY AND STATUATORY RAPE. HALL'S LISTED ADDRESS IS APPROXIMATELY 7 MILES FROM THE VICTIM'S RESIDENCE. LOOKING AT THE DIRECTIONS TO GET FROM HIS HOUSE TO HERS IS BASICALLY AN \"I\" PATTERN. I HOPE THIS HELPS.'", "Open", "Routine", "Y", "t79"],
  ["00008746", "04-15-2011", "1440", "TN0069", "SA Joe Walker — Joe Frye, State Parole Officer in Henry County, called on 4/15/2011 at 1223 and reported he was concerned about Jason Nickell possibly being connected to the Bobo disappearance in Decatur County. Frye told me he had been discussing this incident and he believed Nickell was definitely the type of person who would do something like this. Frye said Nickell had recently been in trouble for stalking a coed. Frye said he would try to get contact information for Nickell.", "Open", "Routine", "P", "t77"],
  ["00008746", "04-15-2011", "1526", "TN0070", "IA Johnson received a call from David Brewer at 615-429-5362. Back in 2006-2007 he used to hunt in Parsons, TN. Mr. Brewer wanted to let investigators know there are a lot of hunting clubs across the river and around the area she was reported missing. Mr. Brewer suggested LE might want to look into them if they haven't done so already.", "Open", "Routine", "N", "t75"],
  ["00008746", "04-15-2011", "1539", "TN0071", "IA Johnson received a call at 3:30 pm from Robert Chojnacki at 708-785-3184. He was at Harrah's Casino in Joliet, IL yesterday and spoke with a girl who said her name was Holly and that she looked a lot like Holly Bobo. He was approached by the woman at approximately 2:30 pm outside of the casino. Holly told Mr. Chojnacki she was 21 years old and 3 months pregnant. Holly also told him she is in an abusive relationship. Mr. Chojnacki said he gave Holly $20.00 because he felt sorry for her and that she went back into the casino.", "Open", "Routine", "N", "t74"],
  ["00008741", "04-16-2011", "1404", "TN0071", "LEIC Allen contacted security at Harrah's Casino in Joliet, IL and spoke with Security Officer D. Jadzak (djadzak@jolietharrahs.com). Officer Jadzak is forwarding the information to the surveillance department to search their surveillance footage and to the on-duty managers.", "Closed", "Routine", "N", "t23"],
  ["00008748", "04-15-2011", "0846", "TN0073", "Bobby Church 731-414-8563, Humboldt, store Superway. Green mini van, no tag info on 04-13-2011, assault rifle in front seat (thought unusual for turkey season). White male, pale, white/reddish blonde hair, facial hair, rough/full complete camo. Seen in store.", "Open", "Routine", "N", "t97"],
  ["00008748", "04-15-2011", "0858", "TN0074", "Jerry McAfee 549-4461. Billy Bell and Jerry frequented Shamrock to play cards 3 years ago; a guy from up north showed up, mid 40s, 5'10\", 170-200 lbs. Lives around Swan Johnson Road below Dana Bobo, van fixed up to live in, black curtains on windows, became obsessed with young girl at bar — that is why he was noticed. He lurked; van seen below Holly Bobo's house.", "Open", "Routine", "N", "t96"],
  ["00008749", "04-14-2011", "1617", "TN0075", "Bill Perry — Paul Ray Pruitt, camo clothing, lives in trailer. Information received from Sheriff's Office on notepad and brought to CP. Unknown origin.", "Open", "Routine", "N", "t118"],
  ["00008749", "04-14-2011", "1619", "TN0076", "Jessica Crowe 731-307-5998 — works at Fred's in Lexington. Man came in wearing full camo, acting very nervous, would not even let her give him his change. Could not see his face. Information received from Sheriff's Office on notepad and brought to CP. Unknown origin.", "Open", "Routine", "N", "t117"],
  ["00008749", "04-14-2011", "1621", "TN0077", "Nina Malka 731-307-1412. Information received from Sheriff's Office on notepad and brought to CP. Unknown origin.", "Open", "Routine", "N", "t116"],
  ["00008745", "04-15-2011", "1625", "TN0078", "Alan Wright 549-9779, 549-5646 — Tuesday knocked at door. 5'7' white male early 20s, camo, dread locks, red bandana, acting strange. Said from Nashville, selling meat. Small tan truck with camper. Information received from Sheriff's Office on notepad and brought to CP. Unknown origin.", "Open", "Routine", "Y", "t72"],
  ["00008745", "04-15-2011", "1635", "TN0081", "549-5581 — Fisher's Grocery. Caller ran into man this week, late 20s or early 30s. Right height. Spoke but guy in camo (old timey) gave him a horrible look. Short, reddish brown beard, slender face. Another guy in car. One guy asked if they were going back to the creek, which was unusual for turkey hunting at that time of day. Caller probably could recognize him.", "Open", "Routine", "N", "t71"],
  ["00008745", "04-15-2011", "1637", "TN0082", "Tipster Rodney McAlpine 256-366-4191. Saw this morning at Southern & Cooper, Memphis, south side of railroad tracks. Girl looking like Holly leaving motel followed by a large black male. Girl was carrying clothes over arm and looked scared. Call in at 0240 by Lt. Cindy Capps — Missing Persons desk 901-363-4444 or 901-636-4479.", "Open", "Routine", "N", "t70"],
  ["00008745", "04-15-2011", "1642", "TN0086", "Deputy Parker 731-298-406 — Someone told him he had vision of Holly being buried at Reelfoot Lake. First killing?", "Open", "Routine", "N", "t69"],
  ["00008745", "04-15-2011", "1644", "TN0087", "Red Cameron 804-815-3448 — Psychic. Nashville. Image of Holly tied up (hands and feet), captive in a small wooden shed (not much larger than an outhouse). Northwest of Parsons, near intersection. Road goes to right. Lake at end of road.", "Open", "Routine", "N", "t68"],
  ["00008748", "04-15-2011", "0722", "TN0088", "Decatur County SO tip — friend was followed Sunday night by a man who was very bold. He followed her to her house and she managed to elude him. He got out of his car at her house after trying to flag her down on the highway. Police said the MO was very similar to an earlier abduction attempt; all were blondes. (Teresa Morton Owens, 85252 US Hwy 278, Horton, AL 35980.) Police departments involved all in Alabama — Blount County Sheriff Dept, Oneonta AL PD, Trussville AL PD.", "Open", "Routine", "N", "t102"],
  ["00008745", "04-15-2011", "1647", "TN0089", "James Pedder 412-389-8756 — tip on Holly Bobo. Hit on head, knocked out, put in back of light colored late-model car.", "Open", "Routine", "N", "t67"],
  ["00008745", "04-15-2011", "1648", "TN0090", "Teresa Blackstock 549-4618 — said Aunt Pauline Quinn, 1836 Horny Head Creek Road, got a phone call yesterday. A male voice was whispering, asking questions about the road around Tuckers.", "Open", "Routine", "N", "t66"],
  ["00008747", "04-15-2011", "1233", "TN0091", "Heather Burry stated that she thinks she saw Holly at SIP in Parsons a few days ago when she was going to clinics at the hospital in Parsons and a man inside SIP was making comments to all the girls with her but singling Holly out. She does not know what the man was driving. Her phone 731-733-0000.", "Open", "Routine", "N", "t84"],
  ["00008746", "04-15-2011", "1326", "TN0092", "Gloria Hogan called and stated she saw the news and her ex-husband Michael McCaa and his father Jeffery Krider live in Parsons and Jeff Krider is a convicted sex offender. She stated they were both hunters and was concerned. Her number 731-519-7236.", "Open", "Routine", "N", "t83"],
  ["00008741", "04-16-2011", "1253", "TN0092", "SA Doug Pate spoke with Jeffery Krider at 1590 Brodies Landing Rd, Parsons, TN. He was at work at Kolpak from 0515–1430 on Wednesday April 13, 2011. His son Michael McCaul lives at the address also but son is not suspected. There is a hunting cabin behind the property on Brodies Landing owned by Bobby Swindle. This property is being checked out by Decatur Co SO per Decatur 911.", "Update", "Routine", "N", "t29"],
  ["00008749", "04-14-2011", "1244", "TN0093", "Email forwarded by Joanne Light from Julie McAnnelly (original date July 21, 2010): The man (Emmett Gregory Nolan) tried to abduct niece Amber on Sunday, July 11, 2010 from the Walmart parking lot in Oneonta. Amber got away in her car. Nolan chased her flashing his lights and waving his arm out the truck window. She called her parents who met her on the road. The guy drove past and waved. In less than 30 minutes he was spotted back in the Walmart parking lot looking for someone else to abduct. Oneonta City Police were called — he told them he was just trying to pick up women. Arrested but bonded out of Blount County Jail in less than 6 hours. Trussville Police Dept had an outstanding warrant and picked him up. Bonded out of Trussville on July 13, 2010. Reports of similar incidents in the area. Tag number of vehicle: 79895AP.", "Open", "Routine", "Y", "t124"],
  ["00008740", "04-16-2011", "1508", "TN0093", "Same lead as TN0052. LEIC Allen has spoken with Investigator Latta about his case. This is an email that has been sent around the community. Investigator advised the victim has not come in to file a formal report on this case at this time. If additional information is located, Latta will contact TBI.", "Closed", "Routine", "N", "t20"],
  ["00008744", "04-16-2011", "0028", "TN0094", "SA Mike Frizzell advised the IP address is located in Southern California. No further action required.", "Closed", "Routine", "N", "t50"],
  ["00008745", "04-15-2011", "1739", "TN0096", "At 5:35 pm IA Johnson received a call from Andrea at 303-879-3 [?]. Andrea lives in NY and said she is a medium who recently saw the report on the missing girl in TN. Andrea said she is picking up information from the other side that the man who took Holly is either wearing or has worn hunting goggles. Andrea said he is involved in hunting in some sort of way. She would like to call back when she is able to receive more information.", "Open", "Routine", "N", "t63"],
  ["00008745", "04-15-2011", "1957", "TN0099", "TBI SA Doug Pate called Charisty Kee, manager of Sonic in Huntington, TN (731) 986-8555. Ms. Kee stated that on Wednesday 13 Apr 11 at approximately 21:30 a F/W who looked similar to Victim Bobo came to the Sonic in a Gold Dodge Stratus missing a rear wheel cover. The F/W was wearing a blue 'Kentucky' tee-shirt. A M/B wearing a purple shirt and shorts was a passenger in the Dodge. The F/W did not appear to be in distress. SA Pate also spoke with Courtney Smith, a car-hop at Sonic, who stated the car was a Silver Dodge Stratus and the F/W was wearing a long sleeved Kentucky tee-shirt. The Dodge had a temporary tag in the back window.", "Open", "Routine", "N", "t60"],
  ["00008744", "04-15-2011", "2105", "TN0100", "LEIC Belinda Allender received a call at 20:41 from Tony Calabrese in Ohio, phone number 731-736-1293. Calabrese advised he was on the computer doing a search on Holly Bobo and found a site www.facebook.com/alain.robichaud. When you click on this person's friends you will find Holly Bobo listed. Calabrese advised that the site looked to him if it was bogus with only 7 friends listed, all girls, but for the boy listed.", "Open", "Routine", "N", "t59"],
  ["00008744", "04-15-2011", "2148", "TN0101", "TBI SA Lewis advised that a truck driver, Tommy Hughes, cell phone 662-706-2676, called and stated on Thursday, 14 Apr 11 he saw a F/W walking on I-40 at MM 170. TBI SA Joe Craig made contact with the Drug Interdiction Units that patrol that area and they advised they have not seen anyone matching Victim Bobo's description on the Interstate.", "Closed", "Routine", "N", "t58"],
  ["00008744", "04-15-2011", "2153", "TN0102", "FBI SA Bisnoski and Upton spoke with a witness who stated they saw 2 W/M on Conrad Ridge Road, Decatur County, running out of the woods and drive off in a Silver Dodge Intrepid. One W/M was carrying a small black box. Both W/Ms were wearing camo. One W/M was identified as Jeff Miller, DOB 08/09/1972, residence is 1264 Yellow Springs Road, Holladay, TN. An attempt to locate Miller was unsuccessful.", "Open", "Routine", "Y", "t57"],
  ["00008740", "04-16-2011", "1701", "TN0102", "On April 16, 2011 at approximately 1540, SA Clayton Goldsmith of FBI and SA Joe Walker of TBI went to 1264 Yellow Springs Rd, Holladay and spoke with Miller. Miller was told they were investigating Holly Bobo. Miller said he was turkey hunting alone on Conrad Ridge Rd on property of Lloyd Conrad. He came out of the woods and Deputy Johnson of Decatur County SO was there. Miller said when he got home he realized he had lost his hunting chair and a decoy. He and a friend Jason Markowski went back and retrieved the chair and decoy and threw them in his trunk and left. Lead investigated — agents feel comfortable to close this lead.", "Closed", "Routine", "N", "t16"],
  ["00008744", "04-15-2011", "2220", "TN0103", "TBI SA Lewis advised that Jackson Police Officer Dwayne Mclean (731-467-1209) called and reported JPD has warrants for Stalking/Sexual Related for Jason Nickell, W/M, DOB 04/01/1972, H/A 1815 Liberty Church Road, Holladay, TN. Officer Mclean knew Nickell's residence was close to the area being searched for Victim Bobo. USMS and FBI Agents located Nickell at his residence and are conducting an interview.", "Open", "Immediate", "P", "t56"],
  ["00008744", "04-15-2011", "2243", "TN0104", "At 10:05 PM LEIC Belinda Allender received a call from Ralph Giranlin in Michigan (810-794-0941). He advised that his family was returning from a vacation in FL when they stopped to gas up in Pioneer, TN on the 11th of April at 3:43 PM. They saw a white man in camo clothes with camo paint on his face at the Shell station. He got into a drab looking Jeep Cherokee. He also advised that he believes he saw what looked like a M-16 between the seats as the man got into the Jeep. He also noticed that the man in the Jeep got onto Hwy 75 going southbound.", "Open", "Routine", "Y", "t55"],
  ["00008744", "04-15-2011", "2315", "TN0105", "TBI SA Dicus followed up on information from Homeland Security that search members identified Stone Lewis as acting suspicious in the area of Gooch Road on 15 Apr 11 at approximately 17:00. Stone asked about what would happen to anybody that 'let her go' and whether the searchers found the bloody school bag. SA Dicus, Carpenter, and Long interviewed Stone Lewis with his mother present. Lewis is 16 years of age and is a student at Riverside High School. Lewis was in school on the day of the kidnapping. Lewis's mother and step-father confirmed this information. No further action at this time.", "Closed", "Routine", "Y", "t54"],
  ["00008744", "04-15-2011", "2323", "TN0106", "TBI SA Doug Pate. Ben Steele, phone: 731-602-0505, reported that Richard Logan Woods was a patient at Buffalo Valley Treatment Center with Walter Anderson, who stated that Woods was obsessed with a female. Woods' father is Judge Rick Woods (731) 549-4371. Richard Woods was contacted and stated his girlfriend at the time was Chelsey Jowers. Richard Woods stated he was at home at 94 Dogwood Drive, Parsons, TN on Wednesday 13 Apr 11. No further action at this time per SA Pate.", "Closed", "Routine", "P", "t53"],
  ["00008744", "04-16-2011", "0009", "TN0107", "Just received a call advising that one of the friends on Bobo Facebook page is a Timothy Woods and the caller advised that there is a Timothy E. Woods on the Sexual Offender list that lives in Lexington, TN. Belinda C. Allender, TIES.", "Open", "Routine", "N", "t52"],
  ["00008744", "04-16-2011", "0020", "TN0108", "TBI SA Dicus. Search teams recovered: panties, two receipts with Holly Bobo's name, a one dollar bill, school paper, duck tape, lotion, camo mask, one left flip-flop shoe, Dr. Pepper can, a piece of paper with hair, a Maxi Pad, and a gum box, on Yellow Spring Road, Pugh Road, and Holly Springs Road. These items indicated direction of travel was north from victim's residence.", "Closed", "Routine", "P", "t51"],
  ["00008743", "04-16-2011", "0812", "TN0109", "TBI SA Mike Frizzell advised that a message on WSMV Facebook stating 'I have her body in the closet' was traced by IP address to Michael Sanders in Franklin, TN. SA Frizzell and another agent were going to speak with Sanders. SA Frizzell says Sanders does not appear to be 'just.'", "Open", "Routine", "Y", "t48"],
  ["00008741", "04-16-2011", "1238", "TN0109", "SA Frizzell met with Michael Sanders Jr. of 2210 Oak Circle in Franklin, TN at approximately 2:45-3:00am on 4/16/11 re: the FB posting. SA Frizzell stated Mr. Sanders thought the posting was funny. Mr. Sanders was advised of the situation and that the posting is not funny.", "Closed", "Routine", "N", "t32"],
  ["00008747", "04-15-2011", "0951", "TN0111", "Kim Lewis claims that her son (Toby Barris) may have information on Bobo case. Man was in Dandy's/Shell Station off New Shackle Island Rd in Hendersonville, TN. He claims there was a man there with camouflage bibs and long sleeve shirt with hat and salt and pepper hair. He doesn't remember if it was the day of or the day after the abduction. Kim Lewis phone 931-287-4513.", "Open", "Routine", "N", "t92"],
  ["00008743", "04-16-2011", "0844", "TN0112", "Norma Raleigh received a call from a female by the name of Patty Garrison and phone number 847-534-9446. Caller stated on 4/16/11 around 1720 hours Illinois time, the caller feels certain she saw Holly Bobo at the Deerfield Bakery. Number for the bakery is 847-534-0068. The female was wearing a light tan coat, black pants, brown boots, tall shaft hair pulled back in a ponytail. In the company of a B/M in his 30's wearing a brown blazer, jeans and a black driving cap/golf type short bill pulled down to the face. Caller stated they arrived in a car but does not remember the description at all of the vehicle. Caller stated O'Hare airport is within 7–8 miles of the bakery. Schaumburg PD is going to the bakery.", "Open", "Routine", "N", "t46"],
  ["00008743", "04-16-2011", "0844", "TN0113", "Tommy Stevens 731-549-4702 on Wednesday at approximately 1pm at intersection of Youal Gibson Rd and 641 he saw a white male in his 50's, approx 5'11', he was not wearing camouflage, parked on side of road, walking around truck with passenger door open with a rock in his hand. Truck is brown, 4WD newer model, bed cover, MO tag. Unknown if anyone else was with him. TN DHS Joey Hudgins searched the area in and around this location and did not find anything.", "Open", "Routine", "N", "t47"],
  ["00008744", "04-16-2011", "0647", "TN0114", "LEIC Purviance arrived at Command Post and relieved LEIC Anthony.", "Closed", "Routine", "N", "t49"],
  ["00008743", "04-16-2011", "1021", "TN0115", "Larry Spitler (734) 225-0019 or (479) 270-5801. Mr. Spitler called and advised that he was at the Missouri and Arkansas state line at the MacAdoodles Center at approximately 10:00 a.m. yesterday, April 15, 2011. Mr. Spitler stated he saw a female matching the victim's description wearing a pink top, jean shorts and a plaid pullover and large sunglasses. She talked to several African American children wearing name tags and then crossed the parking lot and got into a faded green pickup.", "Open", "Routine", "Y", "t45"],
  ["00008743", "04-16-2011", "1028", "TN0115", "SAC Jerri Powell advised LEIC Allen to contact law enforcement in Missouri to have the rest area checked for surveillance video. LEIC Allen will be calling the Missouri Highway Patrol for assistance.", "Update", "Routine", "N", "t44"],
  ["00008743", "04-16-2011", "1038", "TN0115", "LEIC Allen spoke with patrol Lt. Kurt Menger with Schaumburg Illinois Police Department. He advised they received a call from a driver who stated he saw a woman matching the description of Holly Bobo at the rest stop on I-90 east in Schaumburg. The driver described the woman as a white blonde female. He will contact TBI back with additional information as it becomes available. Schaumburg Police Department contact number: (847) 882-3534 and (847) 456-3030 (cell).", "Update", "Routine", "N", "t43"],
  ["00008743", "04-16-2011", "1107", "TN0115", "LEIC Allen spoke with Trooper Patterson 1127. He is in route to the location and would check with the truck stop for footage. He was given the complainant's phone number.", "Update", "Routine", "N", "t40"],
  ["00008743", "04-16-2011", "1105", "TN0116", "LEIC Stanfill took a call from Dewayne Turner (256) 350-8121 home, (256) 566-3915 cell. He stated that on Friday 4-15-2011 he was driving south off Lawrenceburg when he saw a blonde lady driving a small four-door white car. She was stopped at a stop sign in the area of Liberty Grove on Hwy 227 north. He said that she was acting very odd and kept looking into the back seat several times.", "Open", "Routine", "N", "t41"],
  ["00008742", "04-16-2011", "1224", "TN0117", "4/16/11 approx 1135: LEIC Bryson received a tip from a caller at 407-319-057-4 about a Doug Saul who is on a Facebook blog (primenews) talking about the missing person Holly Bobo and how he hates women. He states she has a 2nd boyfriend and that is who she ran away with, not the 1st boyfriend. She is embarrassed because he is older and a friend of the family. 'This is what happens and young girls do this because it's like eloping. They make it seem like abduction so the parents are on the wrong track.'", "Open", "Routine", "N", "t33"],
  ["00008745", "04-15-2011", "1720", "TN0118", "On 4/16/11, information was received from Deputy Bryant Allen of the Benton County SO to check on Ron Patton, W/M, 8/15/1969, 3190 Bald Knob Rd in Holladay, TN in regards to the disappearance of Holly Bobo. Allen stated a couple of years ago Patton kidnapped a female, tied her up and held her for a period of time. Allen said Patton injected the girl with meth. Allen said the girl got loose and was found running down the road naked. SA Terry Dycus and SA Walker interviewed Patton at his home at 9:50 AM on 4/16/11. Patton said his daughter was friendly with the victim Bobo. Patton said his daughter Brandy Patton had dated the same boy as Holly had at one time. They became acquaintances through this connection. The boy's name was Lee Baughs. Patton said he figured someone had been stalking her and thought Holly was in the woods somewhere or in the bottom of a river. Patton said he was disabled from a severe trucking accident.", "Update", "Routine", "P", "t64"],
  ["00008740", "04-16-2011", "1501", "TN0119", "Facebook page reviewed and blog page by LEIC Purviance. Nothing unusual posted on either page. Glenn Adams is a retired Atlanta Fire Department Captain who has joined the Bring Home Holly Bobo Safe Facebook page. All postings are in line with other postings by other individuals. Nothing further to look into. Close lead.", "Closed", "Routine", "N", "t21"],
  ["00008741", "04-16-2011", "1250", "TN0120", "LEIC Stanfill took a call from Beth Higdon (731) 549-7764. Beth stated a friend who has been searching for Holly got suspicious of some boys (near Holly's age) who live in the area being searched because he did not see them helping in the search. Boys live near Pugh Rd in the Yellow Springs area. One of the boy's names is Cory Williams. Beth stated that he is known to use drugs and has been seen with Holly in the past. The father of the boys owns a saw mill and has several vehicles. Father has seen drug paraphernalia and portable meth labs near where some of the evidence has been found.", "Open", "Routine", "Y", "t30"],
  ["00008741", "04-16-2011", "1314", "TN0121", "4/16/11 approx 1:12pm: LEIC Bryson received call from Nancy Nelson 580-862-7691. School teacher of 38 years — states that last night while praying she had a vision of a trailer (light in color, with a slightly dark roof) sitting on a slight incline in some trees cut out just for the trailer. On the back side of the trailer was a freshly planted tree on the south side and in that same area was a freshly dug hole near the skirting of the trailer that lead under and behind the skirting back into the trailer. She feels Holly may be inside or in the hole outside near the skirt of the trailer.", "Open", "Routine", "N", "t27"],
  ["00008742", "04-16-2011", "1119", "TN0122", "Christy Blackstock came to CP with cell phone 731-733-6400 and home number 731-847-4843. She stated to SA Art Viveros and SAC John Mehr that Stacy Rice works at the Top Top convenience store on Hwy 60 in Parsons and is said to know about a Roger Thornburg who knows something about Mexicans involved in drug activity in Decatur County and law enforcement had prior knowledge before making contact with Roger Thornburg. Local law enforcement tried to locate Roger about the Stacy Rice subject but failed. Christy knew the same info as Thornburg. Approximately 1 hour ago contact was made by SA Art Viveros of FBI and the interview revealed Christy had no information in regards to Mexicans and their drug activity and Holly Bobo's disappearance.", "Open", "Routine", "N", "t38"],
  ["00008741", "04-16-2011", "1331", "TN0123", "Reades [?] from Kelly (family friend) 662-587-7500, who advised she had spoken to Tracy Woodson 662-322-7175, 662-507-0300, who met new boyfriend 'Blu Smith' from Booneville/Iuka, Mississippi at Chili's in Tupelo, MS at 12 noon on April 13th. She had spoken with him that morning and he said he was in TN 'taking care of things and getting some beer.' Per Tracy, he was 'talking like a psychotic idiot on phone during lunch.' He told her he had just broken up with his girlfriend who was in nursing school in TN and showed her a picture that looked like Bobo. He is in the military and was scheduled to fly to the middle east on a C-5 plane at midnight of the 13th. Tracy advised he drives a grey Dodge vehicle.", "Open", "Routine", "Y", "t25"],
  ["00008741", "04-16-2011", "1357", "TN0124", "4-16-11 approx 1345: LEIC Bryson received a phone call from 765-744-0881. Caller was calling about 2 people she knew back in the 90's who like to hunt and kill things. She has no info about where they currently live but thinks this is something they may do. Names are Alan Cook & Goodacrt [?] (first name not known), but has a sister named Candice, and the 2 men do not know each other.", "Open", "Routine", "N", "t24"],
  ["00008741", "04-16-2011", "1238", "TN0125", "Anthony (cousin of victim's father) called in to the FBI: there's a parade in Holladay, TN today across the road from the search area. Anthony's friend Wayne Holliday is at the parade and noticed an old abandoned house that has been empty for a long time. But sometime within the last 5 days, new plywood boards have been nailed up on the windows that weren't there before.", "Open", "Routine", "Y", "t31"],
  ["00008740", "04-16-2011", "1410", "TN0126", "SA Doug Pate received information from an individual by the name of Wayne Wright reporting a person of interest, Aaron Wallace. Wallace is described as mentally impaired, lives in the area, close in age. SA Pate discovered Mr. Wallace does not live in the area; has lived with his mother for the last 4 years. He is mentally handicapped, draws SSI and does not have a DL. Mr. Wallace helped with the search parties on 4-wheelers/horseback since date of incident. Father Tommy Wallace lives at 1940 Sulfur Springs Rd in Parsons, personally spoken to on 4/16 by SA Pate.", "Open", "Routine", "N", "t22"],
  ["00008740", "04-16-2011", "1529", "TN0126", "SA Pate spoke with Mother and Father. Mother Tonye Fisher gave alibi for Aaron Wallace. Stated he was at home during time of incident and a painter was at the house as well. Tonye Fisher 731-549-7866.", "Closed", "Routine", "N", "t19"],
  ["00008741", "04-16-2011", "1315", "TN0127", "Search team dog hit on an area around 2051 Yellow Springs Rd, which is a cabin. Vehicle at location had TN Tag 754-FZZ. Owner is Paul Baswell, DOB 10/09/1970, W/M. Address: 105 Bentree Court, Hendersonville, TN. TN DHS Joey Hudgins spoke with search team — dog handlers stated the hit could have been methane gas. Records check showed subject does not have a criminal history. Lead to be closed per SA Mark Lewis.", "Closed", "Routine", "N", "t26"],
  ["00008740", "04-16-2011", "1557", "TN0128", "SAC John Mehr received information from the victim's family in regards to a Wally Lidberg. Lidberg stated he knew where the victim's body was — the location was approximately 1.5 hours away. Law enforcement went to the area. Lidberg had given previous information on another case and a body was found. Phone number 828-980-2516; address: 799 Bethany Church Road, Forest City, NC; DOB 05/08/1936; SSN 393-32-5688. Checks showed Mr. Lidberg does not have a criminal history. Phone calls made to Lidberg were recorded and copied to Decatur Kidnap folder on Command Post laptop. SA Jeff Jackson and the Obion County SO still in area at 1603 hrs searching.", "Closed", "Routine", "N", "t18"],
  ["00008740", "04-16-2011", "1640", "TN0129", "LEIC Stanfill received call from Decatur Co Dispatcher Deanna. Received a tip at 16:33 from Kenneth Smith Jr. (781) 897-1535. Deanna said Mr. Smith was very difficult to understand but she thinks he said he saw Holly Bobo 1.5 months ago at a Gentlemen's Club in Massachusetts.", "Update", "Routine", "N", "t17"],
  ["00008740", "04-16-2011", "1747", "TN0130", "Norma Raleigh in TIES received a call at 1716 hrs from 731-632-1218. Caller stated her kids found a trunk at a farm belonging to Bill Roe on 4/16/2011 at approximately 5:00 PM. Kids went back to check it out. The volunteers were Ricky Alexander age 19, Dakota Alexander age 15, and Katlin [?] age 19. Caller states her kids have returned upset and feel certain they heard something and are asking to please send someone back to check the Conway Ridge area again.", "Open", "Routine", "Y", "t15"],
  ["00008740", "04-16-2011", "1801", "TN0131", "THP has flown over the area with no result. Per SAC Mehr, this lead can be closed.", "Closed", "Routine", "N", "t14"],
