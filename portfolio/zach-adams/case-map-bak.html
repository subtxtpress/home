  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #060B14;
      --surface:  #0D1B2A;
      --border:   rgba(244,229,196,0.10);
      --border2:  rgba(244,229,196,0.22);
      --text:     #F5F5F5;
      --text2:    #D8DADB;
      --muted:    rgba(216,218,219,0.50);

      --c-red:    #E63946;
      --c-amber:  #F4A261;
      --c-blue:   #57B0DC;
      --c-purple: #9D4EDD;
      --c-gray:   #8E9AAF;
      --c-teal:   #4A8A7C;
      --c-cream:  #EBE2CD;
      --c-orange: #E8891C;

      --mono: 'IBM Plex Mono', monospace;
      --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --head: 'Barlow Condensed', sans-serif;

      --nav-h:    48px;
      --panel-w:  290px;
    }

    html {
      width: 100%; height: auto;
      overflow-y: auto;
    }
    body {
      width: 100%; min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text2);
      font-family: var(--body);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .map-spacer {
      height: 100vh;
    }

    /* ── INFO CARDS ── */
    .info-section {
      position: relative;
      z-index: 5;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 40px calc(var(--panel-w) + 24px) 60px 24px;
    }
    .info-section h2 {
      font-family: var(--head);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin: 0 0 24px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .card-title {
      font-family: var(--head);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text1);
    }
    .card-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text3);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
    }
    .card-desc {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text3);
    }
    .card-toggle {
      margin-top: 4px;
      align-self: flex-start;
      font-size: 11px;
      font-family: var(--head);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--border);
      color: var(--text3);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .card-toggle:hover { color: var(--text1); border-color: rgba(255,255,255,0.25); }
    .card-toggle.active { color: var(--text1); border-color: rgba(255,255,255,0.35); }

    /* ── NAV ── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(6,11,20,0.96);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      z-index: 1200;
      gap: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--text); }
    .nav-back svg { flex-shrink: 0; }

    .nav-sep { color: var(--border2); }

    .nav-title {
      font-family: var(--head);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-tag {
      background: rgba(230,57,70,0.14);
      border: 1px solid rgba(230,57,70,0.35);
      color: #e07070;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-source-link {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      text-decoration: none;
      letter-spacing: 0.04em;
      opacity: 0.65;
      white-space: nowrap;
      transition: opacity 0.15s, color 0.15s;
    }
    .nav-source-link:hover { opacity: 1; color: var(--text2); }

    /* ── MAP ── */
    #map {
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: var(--panel-w);
      bottom: 0;
      z-index: 1;
    }

    /* ── PANEL ── */
    .panel {
      position: fixed;
      top: var(--nav-h);
      right: 0;
      width: var(--panel-w);
      bottom: 0;
      background: rgba(6,11,20,0.97);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1100;
      overflow: hidden;
    }

    .panel-hdr {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-hdr h2 {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
    }

    .panel-toggle-btn {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    .panel-toggle-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0 16px;
    }
    .panel-body::-webkit-scrollbar { width: 3px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ── SECTION LABEL ── */
    .sec-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px 4px;
      opacity: 0.7;
    }

    /* ── LAYER TOGGLE ROW ── */
    .layer-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .layer-row:hover { background: rgba(255,255,255,0.04); }

    .lchk {
      position: relative;
      width: 15px; height: 15px;
      flex-shrink: 0;
    }
    .lchk input {
      position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
    }
    .lchk-box {
      width: 15px; height: 15px;
      border: 1.5px solid var(--cc);
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .lchk input:checked ~ .lchk-box { background: var(--cc); }
    .lchk-box svg { opacity: 0; transition: opacity 0.1s; }
    .lchk input:checked ~ .lchk-box svg { opacity: 1; }

    .layer-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .layer-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      flex: 1;
      line-height: 1.3;
    }

    .layer-ct {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }



    /* ── DIV ICONS ── */
    .map-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    }
    .map-icon svg { display: block; }

    .trail-panel { border-color: rgba(74,138,124,0.25); background: rgba(74,138,124,0.07); }
    .trail-panel .tl-header-label { color: #4A8A7C; }
    .trail-panel .tl-btn.on { background: rgba(74,138,124,0.20); border-color: rgba(74,138,124,0.50); color: #4A8A7C; }
    .trail-panel .tl-slider::-webkit-slider-thumb { background: #4A8A7C; }
    .trail-panel .tl-slider::-moz-range-thumb { background: #4A8A7C; }
    .trail-panel .tl-slider { background: rgba(74,138,124,0.15); }
    /* ── BASEMAP TOGGLE ── */
    .basemap-row {
      display: flex;
      gap: 5px;
      padding: 8px 14px 4px;
    }
    .bm-btn {
      flex: 1;
      padding: 5px 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s;
    }
    .bm-btn:hover { background: rgba(255,255,255,0.09); color: var(--text2); }
    .bm-btn.active {
      background: rgba(244,229,196,0.10);
      border-color: rgba(244,229,196,0.30);
      color: var(--text);
    }
    @media (max-width: 767px) {
      .basemap-row {
        flex-direction: column;
        align-items: stretch;
        min-width: 90px; max-width: 90px;
        flex-shrink: 0;
        padding: 8px 6px 9px;
        border-radius: 6px;
        border: 1px solid var(--border);
        gap: 4px;
        scroll-snap-align: start;
      }
      .bm-btn { font-size: 9px; }
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 8px 14px;
    }

    /* ── TIMELINE PANEL ── */
    .tl-panel {
      margin: 4px 12px 4px;
      padding: 11px 12px;
      background: rgba(232,137,28,0.07);
      border: 1px solid rgba(232,137,28,0.18);
      border-radius: 6px;
    }
    .tl-panel.hidden { display: none; }

    .tl-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .tl-header-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--c-orange);
    }
    .tl-step-counter {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .tl-step-name {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.45;
      min-height: 28px;
      margin-bottom: 9px;
      opacity: 0.9;
    }

    .tl-btns {
      display: flex;
      gap: 5px;
      margin-bottom: 9px;
    }
    .tl-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 5px 0;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .tl-btn:hover { background: rgba(255,255,255,0.10); border-color: var(--border2); }
    .tl-btn.play { flex: 1.4; }
    .tl-btn.on { background: rgba(232,137,28,0.18); border-color: rgba(232,137,28,0.45); color: var(--c-orange); }

    .tl-slider-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }
    .tl-slider-end {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .tl-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: rgba(255,255,255,0.10);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .tl-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--c-orange);
      cursor: pointer;
    }
    .tl-slider::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--c-orange);
      cursor: pointer;
      border: none;
    }

    .tl-util-btns { display: flex; gap: 5px; }
    .tl-util-btns .tl-btn { font-size: 10px; }

    /* ── LEAFLET OVERRIDES ── */
    .leaflet-popup-content-wrapper {
      background: rgba(8,14,24,0.97) !important;
      border: 1px solid rgba(244,229,196,0.16) !important;
      border-radius: 7px !important;
      box-shadow: 0 6px 28px rgba(0,0,0,0.65) !important;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content {
      margin: 13px 15px !important;
      color: var(--text2) !important;
      font-family: var(--body) !important;
      font-size: 12px !important;
      max-width: 280px;
      min-width: 180px;
    }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      top: 5px !important; right: 8px !important;
      font-size: 16px !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    .pu-title {
      font-family: var(--head);
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text);
      margin-bottom: 6px;
      padding-right: 14px;
      line-height: 1.3;
    }
    .pu-desc {
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 8px;
      font-size: 11.5px;
    }
    .pu-desc b { color: var(--text); }
    .pu-meta {
      border-top: 1px solid var(--border);
      padding-top: 7px;
      margin-top: 4px;
    }
    .pu-row {
      display: flex;
      gap: 7px;
      margin-bottom: 4px;
      align-items: baseline;
    }
    .pu-key {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      flex-shrink: 0;
      width: 44px;
    }
    .pu-val { font-size: 11px; color: var(--text2); line-height: 1.4; }

    .leaflet-control-attribution {
      background: rgba(6,11,20,0.80) !important;
      color: rgba(216,218,219,0.4) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: rgba(216,218,219,0.5) !important; }
    .leaflet-control-zoom a {
      background: rgba(6,11,20,0.90) !important;
      color: var(--text2) !important;
      border-color: var(--border) !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(255,255,255,0.08) !important; }

    /* ── MOBILE ── */
    @media (max-width: 767px) {
      #map { right: 0; bottom: 210px; }
      .panel {
        top: auto; right: 0; left: 0;
        width: 100%; height: 210px;
        border-left: none;
        border-top: 1px solid var(--border);
        transition: height 0.28s ease;
      }
      .panel.collapsed { height: 44px; }
      .panel.collapsed .panel-body { display: none; }
      .panel-toggle-btn { display: flex; align-items: center; }
      .panel-body {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px 8px 10px;
        gap: 6px;
        align-items: flex-start;
        scroll-snap-type: x mandatory;
      }
      .panel-body::-webkit-scrollbar { height: 3px; }
      .sec-label { display: none; }
    }

    /* ── DIV ICONS ── */
    .map-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7));
    }
    .map-icon svg { display: block; }

    .trail-panel .tl-header-label { color: #4A8A7C; }
    .trail-panel .tl-btn.on { background: rgba(74,138,124,0.20); border-color: rgba(74,138,124,0.50); color: #4A8A7C; }
    .trail-panel .tl-slider::-webkit-slider-thumb { background: #4A8A7C; }
    .trail-panel .tl-slider::-moz-range-thumb { background: #4A8A7C; }
    .trail-panel .tl-slider { background: rgba(74,138,124,0.15); }

    .bm-btn.active {

ome. <b>[cite: 277]</b><br/>\n      <b>Notes:</b> Point placement is approximate.<br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above","category":"Evidence recovery","date":"2011-04-24","cite":"276;277","source":"2022 appellate opinion (State v. Zachary Rye Adams)"},{"name":"SIM CARD RECOVERY SITE","features":[{"type":"point","coords":[35.6584578,-88.1194067]}],"desc":"<b>Recovered by:</b> Ednesha Brasher's brother.<br/>\n      <b>Date:</b> 2011-05-02 (reported found). <b>[cite: 278]</b><br/>\n      <b>Context:</b> Found while riding bicycles near the victim's home. <b>[cite: 278]</b><br/>\n      <b>Notes:</b> Some other accounts list 2011-05-03; retain the appellate-opinion date above as the cited reference.<br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above","category":"Evidence recovery","date":"2011-05-02","cite":"278","source":"2022 appellate opinion (State v. Zachary Rye Adams)"},{"name":"REMAINS RECOVERY SITE","features":[{"type":"point","coords":[35.8215758,-88.169261]}],"desc":"<b>Recovered by:</b> Ernest \"Larry\" Stone (ginseng hunter).<br/>\n      <b>Date:</b> 2014-09-07 (reported located). <b>[cite: 282]</b><br/>\n      <b>Description:</b> A skull was found under an upside-down bucket in the woods near a cell phone tower. <b>[cite: 282-284]</b><br/>\n      <b>Location detail:</b> About three miles from Austin's home; about five miles from the Defendant's home. <b>[cite: 507]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above","category":"Evidence recovery","date":"2014-09-07","cite":"282-284;507","source":"2022 appellate opinion (State v. Zachary Rye Adams)"},{"name":"PISTOL RECOVERY (JOE HOLLADAY ROAD)","features":[{"type":"point","coords":[35.8410278,-88.154404]}],"desc":"<b>Recovered by:</b> Steve Deaton (lead diver).<br/>\n      <b>Date:</b> 2017-05-25 (reported recovered). <b>[cite: 516]</b><br/>\n      <b>Location detail:</b> In a creek-like \"drainage feature\" along Joe Holladay Road. <b>[cite: 516]</b><br/>\n      <b>Context:</b> Victor Dinsmore testified his wife disposed of the pistol in a creek 3\u20134 miles from Yellow Springs Road. <b>[cite: 1093]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above","category":"Evidence recovery","date":"2017-05-25","cite":"516;1093","source":"2022 appellate opinion (State v. Zachary Rye Adams)"},{"name":"BIRDSONG BRIDGE / I-40 CROSSING","features":[{"type":"point","coords":[35.8680952,-87.9434109]}],"desc":"<b>Testimony:</b> Jason Autry testified they took the body to the Tennessee River under the Interstate 40 bridge. <b>[cite: 321]</b><br/>\n      <b>Evidence:</b> Nursing papers found where the bridge crosses over I-40. <b>[cite: 489]</b><br/>\n      <b>Statements:</b> Defendant reportedly said to \"put up under the Birdsong bridge.\" <b>[cite: 251]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"THE \"OLD BARN\" (HICKERSON PROPERTY)","features":[{"type":"point","coords":[35.8159405,-88.1277967]}],"desc":"<b>Testimony:</b> Jason Autry searched his late grandmother's barn on Yellow Springs Road for evidence. <b>[cite: 376]</b><br/>\n      <b>Witness:</b> Brian Vitt lived across from the barn. <b>[cite: 415]</b><br/>\n      <b>Status:</b> Reported destroyed in late 2012 or early 2013. <b>[cite: 752]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"}],"people":[{"name":"ZACHARY ADAMS's","features":[{"type":"point","coords":[35.8214583,-88.0837789]}],"desc":"<b>Location detail:</b> Located north of Parsons, near Holladay, not far from Yellow Springs Road. <b>[cite: 159]</b><br/>\n      <b>Testimony:</b> Autry arrived here at ~2:30 p.m. and reported seeing the men fighting. <b>[cite: 341]</b><br/>\n      <b>Testimony:</b> Stephen Young reported seeing the Defendant vacuuming a truck here. <b>[cite: 176]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"SHAYNE AUSTIN","features":[{"type":"point","coords":[35.8064745,-88.1204944]}],"desc":"<b>Testimony:</b> Autry arrived here around 9:00 a.m. on 2011-04-13. <b>[cite: 308]</b><br/>\n      <b>Observation:</b> Autry reported seeing a large fire in a burn barrel; the victim's father later reported seeing a burn barrel here. <b>[cite: 308, 952]</b><br/>\n      <b>Location:</b> Yellow Springs community. <b>[cite: 308]</b><br/>\n      <b>Notes:</b> Address commonly listed as 30 Yellow Spring Rd (not a court label).<br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"BRENDA O'BRYANT / KELLY RIDGE","features":[{"type":"point","coords":[35.8229219,-88.1408102]}],"desc":"<b>Testimony:</b> Brenda O'Bryant's parents lived across from \"Kelly Ridge\". <b>[cite: 423]</b><br/>\n      <b>Testimony:</b> A man (identified as Autry) asked to fish in their ponds. <b>[cite: 425]</b><br/>\n      <b>Statement:</b> Defendant told Autry \"we throwed her out near Kelly Ridge.\" <b>[cite: 356]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"ANGELA SCOTT","features":[{"type":"point","coords":[36.022526,-88.069439]}],"desc":"<b>Identity:</b> Angela Scott was Jason Autry's girlfriend. <b>[cite: 431]</b><br/>\n      <b>Location:</b> Camden area (tied to cell-tower data described near her home). <b>[cite: 551]</b><br/>\n      <b>Notes:</b> Coordinate represents a mapped residence point used in this file.<br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"DOTTIE COOLEY'S","features":[{"type":"point","coords":[35.8186527,-88.0984935]}],"desc":"<b>Testimony:</b> The men drove to Dottie Cooley's home to meet Victor Dinsmore. <b>[cite: 345]</b><br/>\n      <b>Location detail:</b> About two miles from the Defendant's home. <b>[cite: 345]</b><br/>\n      <b>Witness:</b> Cleaner Debbie Dorris reported seeing three men there between ~2:30 and 3:30 p.m. <b>[cite: 521]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"VICTOR DINSMORE'S","features":[{"type":"point","coords":[35.8184545,-88.1394212]}],"desc":"<b>Location:</b> Yellow Springs Road in the Holladay community. <b>[cite: 436]</b><br/>\n      <b>Proximity:</b> The victim's remains were found less than two miles from this location. <b>[cite: 470]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"VICTOR DINSMORE'S SHOP","features":[{"type":"point","coords":[35.8186962,-88.1393744]}],"desc":"<b>Testimony:</b> Defendant hid his white truck in Dinsmore's shop. <b>[cite: 452]</b><br/>\n      <b>Notes:</b> Coordinate represents a mapped shop location near Dinsmore's residence.<br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"JUANITA HICKERSON","features":[{"type":"point","coords":[35.8166,-88.127187]}],"desc":"<b>Identity:</b> Late grandmother of Shayne Austin and Jason Autry. <b>[cite: 415]</b><br/>\n      <b>Evidence:</b> Money and a receipt with the victim's name were found on her property. <b>[cite: 488]</b><br/>\n      <b>Location detail:</b> Located about one mile from Austin's home. <b>[cite: 725]</b><br/>\n      <b>Source:</b> 2022 appellate opinion (State v. Zachary Rye Adams), line refs above"},{"name":"TERRY BRITT'S","features":[{"type":"point","coords":[35.7683869,-88.1304145]}],"desc":"<b>Location detail:</b> Four miles south of Yellow Springs Church. <b>[cite: 491]</b><br/>\n      <b>Investigation:</b> Described as the \"geographic center\" of where evidence was recovered. <b>[cite: 791]</b><br/>\n      <b>Action:</b> Wiretaps and search warrants executed here. <b>[cite: 492-493]</b><br/>\n      <b>Notes:</b> Coordinat   <script>
  'use strict';


  /* ── BASEMAP LAYERS ── */
  const BASEMAPS = {
    dark: L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { subdomains: 'abcd', maxZoom: 19,
        attribution: '\u00a9 <a href="https://openstreetmap.org/copyright" target="_blank">OSM</a> contributors \u00a9 <a href="https://carto.com" target="_blank">CARTO</a>' }
    ),
    satellite: L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19,
        attribution: '\u00a9 <a href="https://www.esri.com" target="_blank">Esri</a>, Maxar, Earthstar Geographics' }
    ),
  };
  let activeBasemap = 'satellite';

  function initBasemapToggle() {
    document.getElementById('bm-dark').addEventListener('click', () => switchBasemap('dark'));
    document.getElementById('bm-satellite').addEventListener('click', () => switchBasemap('satellite'));
  }

  function switchBasemap(name) {
    if (name === activeBasemap) return;
    BASEMAPS[activeBasemap].remove();
    BASEMAPS[name].addTo(map);
    BASEMAPS[name].bringToBack();
    activeBasemap = name;
    document.getElementById('bm-dark').classList.toggle('active', name === 'dark');
    document.getElementById('bm-satellite').classList.toggle('active', name === 'satellite');
  }

  const LAYERS = [
    { key: 'major',     label: 'Major Events',           color: '#E63946', on: true  },
    { key: 'evidence',  label: 'Evidence & Key Locations',color: '#F4A261', on: false },
    { key: 'people',    label: 'People & Residences',     color: '#57B0DC', on: false },
    { key: 'towers',    label: 'Cell Towers',             color: '#9D4EDD', on: false },
    { key: 'other',     label: 'Other Locations',         color: '#8E9AAF', on: false },
    { key: 'trail',     label: 'Phone GPS Trail',         color: '#4A8A7C', on: false },
    { key: 'usermarks', label: 'Route Markers',           color: '#EBE2CD', on: false },
    { key: 'timeline',  label: 'Phone Timeline',          color: '#E8891C', on: false },
  ];

  let map;
  const groups  = {};

  // Trail animation
  let trailCoords  = [];
  let trailStep    = -1;
  let trailPlaying = false;
  let trailTimer   = null;
  const TRAIL_SKIP = 6; // sample every 6th coord for ~50 steps


  let tlMarkers = [];
  let tlNames   = [];
  let tlStep    = -1;
  let tlPlaying = false;
  let tlTimer   = null;
  let panelOpen = true;

  /* ── MAP ── */
  function initMap() {
    map = L.map('map', {
      center: [35.755, -88.10],
      zoom: 11,
      zoomControl: false,
    });
    BASEMAPS.satellite.addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
  }

  /* ── POPUP ── */
  function escH(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function makePopup(pm) {
    let h = '<div class="pu-title">' + escH(pm.name) + '</div>';
    if (pm.desc)  h += '<div class="pu-desc">' + pm.desc + '</div>';
    const rows = [];
    if (pm.category) rows.push(['CAT',    escH(pm.category)]);
    if (pm.date)     rows.push(['DATE',   escH(pm.date)]);
    if (pm.cite)     rows.push(['CITE',   escH(pm.cite)]);
    if (pm.source)   rows.push(['SOURCE', escH(pm.source)]);
    if (rows.length) {
      h += '<div class="pu-meta">';
      for (const [k,v] of rows)
        h += '<div class="pu-row"><span class="pu-key">'+k+'</span><span class="pu-val">'+v+'</span></div>';
      h += '</div>';
    }
    return h;
  }


  /* ── ICON MARKERS ── */
  const ICON_SVGs = {
    home: (color) => `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 20 20" fill="${color}">
      <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
    </svg>`,
    pin: (color) => `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 20 20" fill="${color}">
      <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
    </svg>`,
    phone: (color, size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 20 20" fill="${color}">
      <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/>
    </svg>`,
  };

  function makeIconMarker(latlng, svgKey, color, pop) {
    const icon = L.divIcon({
      className: 'map-icon',
      html: ICON_SVGs[svgKey](color),
      iconSize: svgKey === 'home' ? [18, 18] : [16, 16],
      iconAnchor: svgKey === 'home' ? [9, 9] : [8, 8],
      popupAnchor: [0, -10],
    });
    const m = L.marker(latlng, { icon });
    if (pop) m.bindPopup(pop, { maxWidth: 310, minWidth: 180 });
    return m;
  }


  function phoneIcon(state) {
    const COLOR = '#E8891C';
    const cfg = {
      all:     { size: 16, opacity: 1,    zIdx: 0,    glow: '' },
      current: { size: 22, opacity: 1,    zIdx: 1000, glow: 'drop-shadow(0 0 5px rgba(255,170,50,0.9))' },
      past:    { size: 10, opacity: 0.35, zIdx: 0,    glow: '' },
    }[state] || { size: 16, opacity: 1, zIdx: 0, glow: '' };
    return L.divIcon({
      className: 'map-icon',
      html: `<span style="opacity:${cfg.opacity};filter:${cfg.glow};display:block">${ICON_SVGs.phone(COLOR, cfg.size)}</span>`,
      iconSize:   [cfg.size, cfg.size],
      iconAnchor: [cfg.size / 2, cfg.size / 2],
      popupAnchor: [0, -cfg.size / 2 - 2],
    });
  }

  /* ── FEATURE CREATION ── */
  function circleMarker(latlng, color, r, pop) {
    const m = L.circleMarker(latlng, {
      radius: r, color, fillColor: color, fillOpacity: 0.82, weight: 1.5,
    });
    if (pop) m.bindPopup(pop, { maxWidth: 310, minWidth: 180 });
    return m;
  }

  function buildFeatures(pm, color, isTimeline, layerKey) {
    const pop = makePopup(pm);
    const out = [];

    for (const f of pm.features) {
      if (f.type === 'point') {
        let marker;
        if (layerKey === 'people') {
          marker = makeIconMarker(f.coords, 'home', color, pop);
        } else if (layerKey === 'usermarks') {
          marker = makeIconMarker(f.coords, 'pin', color, pop);
        } else if (isTimeline) {
          const m2 = L.marker(f.coords, { icon: phoneIcon('all') });
          if (pop) m2.bindPopup(pop, { maxWidth: 310, minWidth: 180 });
          marker = m2;
        } else {
          marker = circleMarker(f.coords, color, isTimeline ? 7 : 6, pop);
        }
        out.push({ type: 'point', latlng: f.coords, feature: marker });

      } else if (f.type === 'line') {
        const isTrail = pm.name.toLowerCase().includes('trail') ||
                        pm.name.toLowerCase().includes('segment');
        const line = L.polyline(f.coords, {
          color, weight: isTrail ? 2.5 : 1.5,
          opacity: isTrail ? 0.80 : 0.60,
          dashArray: pm.name.toLowerCase().includes('arm') ? '5,5' : null,
        });
        line.bindPopup(pop, { maxWidth: 300 });
        out.push({ type: 'line', feature: line });

      } else if (f.type === 'polygon') {
        const poly = L.polygon(f.coords, {
          color, fillColor: color, fillOpacity: 0.11, weight: 1.2, opacity: 0.55,
        });
        poly.bindPopup(pop, { maxWidth: 300 });
        out.push({ type: 'polygon', feature: poly });
      }
    }
    return out;
  }

  /* ── BUILD LAYERS ── */
  function buildLayers() {
    for (const cfg of LAYERS) {
      const group = L.layerGroup();
      const pms   = KML_DATA[cfg.key] || [];

      if (cfg.key === 'timeline') {
        tlMarkers = [];
        tlNames   = [];
        for (const pm of pms) {
          const feats = buildFeatures(pm, cfg.color, true, cfg.key);
          const pt    = feats.find(f => f.type === 'point');
          if (pt) {
            tlMarkers.push(pt.feature);
            tlNames.push(pm.name);
            pt.feature.addTo(group);
          }
        }
        const slider = document.getElementById('tl-slider');
        document.getElementById('tl-slider-max').textContent = tlMarkers.length;
        slider.max = Math.max(0, tlMarkers.length - 1);
      } else {
        for (const pm of pms) {
          for (const f of buildFeatures(pm, cfg.color, false, cfg.key)) {
            f.feature.addTo(group);
          }
        }
      }

      if (cfg.key === 'trail') buildTrailSteps();
      groups[cfg.key] = group;
      if (cfg.on) group.addTo(map);

      // Update count badge
      const ct = document.getElementById('ct-' + cfg.key);
      if (ct) ct.textContent = pms.length || '';
    }
  }

  /* ── LAYER TOGGLE UI ── */
  function buildLayerUI() {
    const container = document.getElementById('layer-list');

    container.innerHTML = '<div class="sec-label">Case Locations</div>';

    for (const cfg of LAYERS) {
      if (cfg.key === 'towers') {
        container.insertAdjacentHTML('beforeend',
          '<div class="divider"></div><div class="sec-label">Cell &amp; Route Data</div>');
      }

      const label = document.createElement('label');
      label.className = 'layer-row';
      label.setAttribute('for', 'chk-' + cfg.key);
      label.innerHTML = `
        <span class="lchk" style="--cc:${cfg.color}">
          <input type="checkbox" id="chk-${cfg.key}" data-key="${cfg.key}" ${cfg.on ? 'checked' : ''}>
          <span class="lchk-box">
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none"
                 stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1.5,5 4,7.5 8.5,2.5"/>
            </svg>
          </span>
        </span>
        <span class="layer-dot" style="background:${cfg.color}"></span>
        <span class="layer-name">${cfg.label}</span>
        <span class="layer-ct" id="ct-${cfg.key}"></span>
      `;
      container.appendChild(label);

      label.querySelector('input').addEventListener('change', function () {
        const key = this.dataset.key;
        if (this.checked) {
          groups[key]?.addTo(map);
          if (key === 'timeline') document.getElementById('tl-panel').classList.remove('hidden');
          if (key === 'trail')    document.getElementById('trail-panel').classList.remove('hidden');
        } else {
          groups[key]?.remove();
          if (key === 'timeline') { document.getElementById('tl-panel').classList.add('hidden'); stopPlay(); }
          if (key === 'trail')    { document.getElementById('trail-panel').classList.add('hidden'); stopTrailPlay(); }
        }
      });
    }
  }

  /* ── TIMELINE ── */
  function setStep(step) {
    tlStep = step;
    const group = groups['timeline'];
    if (!group) return;
    group.clearLayers();

    if (step === -1) {
      for (const m of tlMarkers) { applyStyle(m, 'all'); m.addTo(group); }
    } else {
      for (let i = 0; i <= step && i < tlMarkers.length; i++) {
        applyStyle(tlMarkers[i], i === step ? 'current' : 'past');
        tlMarkers[i].addTo(group);
      }
      const m = tlMarkers[step];
      if (m?.getLatLng) map.panTo(m.getLatLng(), { animate: true, duration: 0.5 });
    }

    document.getElementById('tl-counter').textContent =
      step === -1 ? 'ALL (' + tlMarkers.length + ')' : (step+1) + ' / ' + tlMarkers.length;
    document.getElementById('tl-name').textContent =
      step === -1 ? 'All ' + tlMarkers.length + ' events shown' : (tlNames[step] || '');
    document.getElementById('tl-slider').value = step === -1 ? 0 : step;
  }

  function applyStyle(m, state) {
    if (m.setStyle) {
      // circleMarker path (fallback)
      if (state === 'current')
        m.setStyle({ radius:11, fillColor:'#E8891C', color:'#ffbb55', fillOpacity:1, weight:2.5, opacity:1 });
      else if (state === 'past')
        m.setStyle({ radius:4,  fillColor:'#E8891C', color:'#E8891C', fillOpacity:0.35, weight:1, opacity:0.4 });
      else
        m.setStyle({ radius:7,  fillColor:'#E8891C', color:'#E8891C', fillOpacity:0.82, weight:1.5, opacity:1 });
    } else if (m.setIcon) {
      // divIcon marker (phone icon)
      m.setIcon(phoneIcon(state));
      if (state === 'current') m.setZIndexOffset(1000);
      else m.setZIndexOffset(0);
    }
  }

  function startPlay() {
    if (!tlMarkers.length) return;
    tlPlaying = true;
    const btn = document.getElementById('tl-play');
    btn.textContent = '\u23f8 Pause'; btn.classList.add('on');
    if (tlStep === -1 || tlStep >= tlMarkers.length - 1) setStep(0);
    tlTimer = setInterval(() => {
      const next = tlStep + 1;
      if (next >= tlMarkers.length) { stopPlay(); return; }
      setStep(next);
      document.getElementById('tl-slider').value = next;
    }, 2200);
  }

  function stopPlay() {
    tlPlaying = false;
    clearInterval(tlTimer); tlTimer = null;
    const btn = document.getElementById('tl-play');
    if (btn) { btn.textContent = '\u25b6 Play'; btn.classList.remove('on'); }
  }

  function initTimelineUI() {
    document.getElementById('tl-play').addEventListener('click', () => tlPlaying ? stopPlay() : startPlay());
    document.getElementById('tl-prev').addEventListener('click', () => {
      stopPlay();
      if (!tlMarkers.length) return;
      setStep(tlStep <= 0 ? tlMarkers.length - 1 : tlStep - 1);
    });
    document.getElementById('tl-next').addEventListener('click', () => {
      stopPlay();
      if (!tlMarkers.length) return;
      setStep(tlStep === -1 ? 0 : (tlStep + 1) % tlMarkers.length);
    });
    document.getElementById('tl-all').addEventListener('click', () => { stopPlay(); setStep(-1); });
    document.getElementById('tl-reset').addEventListener('click', () => { stopPlay(); setStep(0); });
    document.getElementById('tl-slider').addEventListener('input', function () {
      stopPlay(); setStep(parseInt(this.value, 10));
    });

    const cfg = LAYERS.find(l => l.key === 'timeline');
    if (cfg?.on) document.getElementById('tl-panel').classList.remove('hidden');
  }

  /* ── GPS TRAIL ANIMATION ── */
  function buildTrailSteps() {
    trailCoords = [];
    const pms = KML_DATA['trail'] || [];
    for (const pm of pms) {
      for (const f of pm.features || []) {
        if (f.type === 'line') {
          const coords = f.coords;
          for (let i = 0; i < coords.length; i += TRAIL_SKIP) {
            trailCoords.push(coords[i]);
          }
          // always include last point
          const last = coords[coords.length - 1];
          if (trailCoords.length && trailCoords[trailCoords.length - 1] !== last) {
            trailCoords.push(last);
          }
        }
      }
    }
    const slider = document.getElementById('trail-slider');
    document.getElementById('trail-slider-max').textContent = trailCoords.length;
    slider.max = Math.max(0, trailCoords.length - 1);
  }

  function setTrailStep(step) {
    trailStep = step;
    const group = groups['trail'];
    if (!group) return;
    group.clearLayers();

    const counter  = document.getElementById('trail-counter');
    const nameEl   = document.getElementById('trail-name');
    const slider   = document.getElementById('trail-slider');
    const playBtn  = document.getElementById('trail-play');

    if (!trailCoords.length) {
      counter.textContent = '—';
      nameEl.textContent  = 'No trail data';
      return;
    }

    if (step === -1) {
      // Show all coords as one full polyline
      const fullLine = L.polyline(trailCoords, {
        color: '#4A8A7C', weight: 2.5, opacity: 0.85,
      });
      fullLine.addTo(group);
      counter.textContent = `All (${trailCoords.length})`;
      nameEl.textContent  = 'Full GPS trail';
      slider.value        = slider.max;
      playBtn.classList.remove('on');
      playBtn.textContent = '&#9654; Play';
      return;
    }

    const idx = Math.max(0, Math.min(step, trailCoords.length - 1));
    slider.value = idx;
    counter.textContent = `${idx + 1} / ${trailCoords.length}`;

    // Revealed path (bright)
    if (idx > 0) {
      L.polyline(trailCoords.slice(0, idx + 1), {
        color: '#4A8A7C', weight: 2.5, opacity: 0.90,
      }).addTo(group);
    }

    // Future path (dim dashed)
    if (idx < trailCoords.length - 1) {
      L.polyline(trailCoords.slice(idx), {
        color: '#4A8A7C', weight: 1.5, opacity: 0.25, dashArray: '4,6',
      }).addTo(group);
    }

    // Pin marker at current position
    const pinSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 384 512" fill="#4A8A7C">
      <path d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
    </svg>`;
    const pinIcon = L.divIcon({
      html: `<div style="filter:drop-shadow(0 0 4px #4A8A7C)">${pinSvg}</div>`,
      className: '', iconSize: [18, 18], iconAnchor: [9, 18],
    });
    const coord = trailCoords[idx];
    const ll    = L.latLng(coord[0], coord[1]);
    const latlngStr = `${coord[0].toFixed(5)}, ${coord[1].toFixed(5)}`;
    nameEl.textContent = latlngStr;

    const marker = L.marker(ll, { icon: pinIcon, zIndexOffset: 1000 });
    marker.bindPopup(
      `<b>GPS Trail – Step ${idx + 1}</b><br>${latlngStr}`,
      { maxWidth: 260, autoPan: false }
    );
    marker.addTo(group);
    marker.openPopup();
  }

  function startTrailPlay() {
    if (!trailCoords.length) return;
    trailPlaying = true;
    const btn = document.getElementById('trail-play');
    btn.classList.add('on');
    btn.innerHTML = '&#9646;&#9646; Pause';
    if (trailStep >= trailCoords.length - 1 || trailStep === -1) setTrailStep(0);
    trailTimer = setInterval(() => {
      const next = trailStep + 1;
      if (next >= trailCoords.length) {
        stopTrailPlay();
        return;
      }
      setTrailStep(next);
    }, 120);
  }

  function stopTrailPlay() {
    trailPlaying = false;
    clearInterval(trailTimer);
    trailTimer = null;
    const btn = document.getElementById('trail-play');
    if (btn) { btn.classList.remove('on'); btn.innerHTML = '&#9654; Play'; }
  }

  function initTrailUI() {
    document.getElementById('trail-prev').addEventListener('click', () => {
      stopTrailPlay();
      if (!trailCoords.length) return;
      const prev = trailStep <= 0 ? 0 : trailStep - 1;
      setTrailStep(prev);
    });
    document.getElementById('trail-play').addEventListener('click', () => {
      if (trailPlaying) stopTrailPlay(); else startTrailPlay();
    });
    document.getElementById('trail-next').addEventListener('click', () => {
      stopTrailPlay();
      if (!trailCoords.length) return;
      setTrailStep(trailStep === -1 ? 0 : (trailStep + 1) % trailCoords.length);
    });
    document.getElementById('trail-all').addEventListener('click', () => { stopTrailPlay(); setTrailStep(-1); });
    document.getElementById('trail-reset').addEventListener('click', () => { stopTrailPlay(); setTrailStep(0); });
    document.getElementById('trail-slider').addEventListener('input', function () {
      stopTrailPlay(); setTrailStep(parseInt(this.value, 10));
    });
  }

  /* ── MOBILE PANEL TOGGLE ── */
  function initPanelToggle() {
    const btn   = document.getElementById('panel-toggle-btn');
    const panel = document.getElementById('panel');
    const icon  = document.getElementById('panel-icon');
    const mapEl = document.getElementById('map');

    btn.addEventListener('click', () => {
      panelOpen = !panelOpen;
      panel.classList.toggle('collapsed', !panelOpen);
      icon.setAttribute('points', panelOpen ? '18,15 12,9 6,15' : '6,15 12,9 18,15');
      mapEl.style.bottom = panelOpen ? '210px' : '44px';
      setTimeout(() => map.invalidateSize(), 300);
    });
  }

  /* ── INFO CARDS ── */
  const CARD_INFO = {
    major:    { desc: 'Key events central to the prosecution\'s timeline — including the abduction site on Parsons Branch Road and the recovery location where Holly Bobo\'s remains were found.' },
    evidence: { desc: 'Physical evidence collection sites and forensically significant locations referenced during trial testimony, including areas searched by investigators and witnesses.' },
    people:   { desc: 'Residences and addresses associated with individuals named in the case — defendants, witnesses, and others placed in the region during the relevant timeframe.' },
    towers:   { desc: 'Cell tower locations used to reconstruct the movement and communication patterns of individuals through call record and ping data introduced at trial.' },
    other:    { desc: 'Additional locations referenced in testimony or investigative reports — roads, landmarks, and areas that provide geographic context to the case narrative.' },
    trail:    { desc: 'GPS coordinates logged from a device recovered during the investigation. The animated trail reconstructs a path step-by-step from raw location data.' },
    usermarks:{ desc: 'Annotated route markers highlighting roads and paths relevant to the case, including routes prosecutors argued were used to transport Holly Bobo.' },
    timeline: { desc: 'Chronological sequence of phone activity — calls, texts, and tower pings — mapped to geographic locations to reconstruct communication leading up to and following the abduction.' },
  };

  function buildInfoCards() {
    const grid = document.getElementById('cards-grid');
    if (!grid) return;
    grid.innerHTML = '';
    for (const cfg of LAYERS) {
      const info  = CARD_INFO[cfg.key] || {};
      const count = (KML_DATA[cfg.key] || []).length;
      const card  = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-dot" style="background:${cfg.color}"></span>
          <span class="card-title">${cfg.label}</span>
          ${count ? `<span class="card-count">${count}</span>` : ''}
        </div>
        <p class="card-desc">${info.desc || ''}</p>
        <button class="card-toggle${cfg.on ? ' active' : ''}" data-key="${cfg.key}">
          ${cfg.on ? 'Visible on map' : 'Add to map'}
        </button>
      `;
      card.querySelector('.card-toggle').addEventListener('click', function () {
        const key = this.dataset.key;
        const chk = document.getElementById('chk-' + key);
        if (!chk) return;
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change'));
        this.classList.toggle('active', chk.checked);
        this.textContent = chk.checked ? 'Visible on map' : 'Add to map';
      });
      grid.appendChild(card);
    }
  }

  /* ── INIT ── */
  buildLayerUI();
  initTimelineUI();
  initTrailUI();
  initPanelToggle();
  initMap();
  initBasemapToggle();
  buildLayers();
  buildInfoCards();
  // Show all timeline events on initial load
  const tlCfg = LAYERS.find(l => l.key === 'timeline');
  if (tlCfg && tlCfg.on && tlMarkers.length) setStep(-1);
  const trailCfg = LAYERS.find(l => l.key === 'trail');
  if (trailCfg?.on) document.getElementById('trail-panel').classList.remove('hidden');
  </script>
</body>
</html>
